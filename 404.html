<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina niet gevonden &middot; Lorenzo Greidanus</title>
<link rel="stylesheet" href="/fonts.css?v=2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%23204ECF'/><text x='50' y='68' font-family='Poppins,Arial' font-size='46' font-weight='600' fill='%23FBF6F1' text-anchor='middle'>LG</text></svg>">
<style>
:root{--crab:#F26749;--amber:#EA9836;--ocean:#204ECF;--vista:#83A5F2;--sand:#FCDED6;--room:#FBF6F1;--ink:#14224C;--muted:#5b6480;--hand:#D9522F;
  --navy:#14224C;--groot:#204ECF}
/* ook deze pagina kantelt mee met je apparaat of je keuze */
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--room:#0F1A3D;--ink:#F3EFE9;--muted:#B3BBD0;--hand:#F26749;--groot:#83A5F2}
}
:root[data-theme="dark"]{--room:#0F1A3D;--ink:#F3EFE9;--muted:#B3BBD0;--hand:#F26749;--groot:#83A5F2;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;
  background:var(--room);color:var(--ink);font-family:'Poppins',system-ui,Arial,sans-serif;text-align:center}
.hand{font-family:'Caveat',cursive;font-size:1.8rem;color:var(--hand)}
h1{font-size:clamp(3.4rem,14vw,7rem);font-weight:600;margin:.2rem 0;letter-spacing:-.03em;color:var(--groot);text-wrap:balance}
p{color:var(--muted);max-width:38ch;margin:0 auto 26px}
a.btn{display:inline-block;background:var(--crab);color:var(--navy);text-decoration:none;font-weight:600;
  padding:13px 26px;border-radius:999px;box-shadow:0 10px 0 rgba(20,34,76,.08);transition:transform .16s ease}
a.btn:hover{transform:translateY(-2px)}
/* het gezichtje: groot, midden boven de 404, en het kijkt je muis na */
.oeps{width:168px;height:168px;margin:0 auto 4px}
.oeps .avatar{display:block;margin:0;width:100%;height:100%}
@media(prefers-reduced-motion:no-preference){
  .oeps{animation:oepsIn .7s cubic-bezier(.22,1,.36,1) both}
  @keyframes oepsIn{from{opacity:0;transform:translateY(10px) rotate(-6deg)}to{opacity:1;transform:none}}
}
.strip{display:flex;height:8px;width:170px;margin:34px auto 0;border-radius:999px;overflow:hidden}
.strip i{flex:1}
</style>
<script>
(function(){try{var t=localStorage.getItem('thema');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
<script src="/vangnet.js" defer></script>
<script src="/leermiddelen/avatar.js"></script>
</head>
<body>
<div>
  <div class="oeps" id="oeps" aria-hidden="true"></div>
  <span class="hand">oeps, die is er niet</span>
  <h1>404</h1>
  <p>Deze pagina bestaat niet of is verhuisd. Ga terug naar de startpagina en probeer het opnieuw.</p>
  <a class="btn" href="/">Terug naar de startpagina</a>
  <div class="strip" aria-hidden="true">
    <i style="background:var(--crab)"></i><i style="background:var(--amber)"></i><i style="background:var(--ocean)"></i><i style="background:var(--vista)"></i><i style="background:var(--sand)"></i>
  </div>
</div>
<script>
/* het gezichtje: altijd dezelfde, koraal met grote ogen; avatar.js laat de ogen de muis volgen */
(function(){
  var doel = document.getElementById('oeps');
  if (!doel || !window.AVATAR) return;
  doel.innerHTML = AVATAR.svg('oeps', 168, AVATAR.maak({ v:4, k:0, o:4, m:1, e:5 }), { stemming:'oeps' });
})();
</script>
</body>
</html>
