<!DOCTYPE html>
<html lang="nl">
<head>
<!-- De leerroute: een hele leerlijn per vak (rekenen, Nederlands), elk doel stap voor stap. Motor: leerroute.js, inhoud: leerroute/<vak>-*.js -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">
<script src="avatar.js"></script>
<script src="profiel.js"></script>
<link rel="apple-touch-icon" href="/icoon-192.png">
<script>(function(){try{var t=localStorage.getItem('thema');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
<title>De leerroute &middot; meneer Greidanus</title>
<meta name="description" content="De hele leerlijn rekenen en Nederlands, van de basis tot 3F. Elke rekenmanier en elke regel stap voor stap: uitleg, voordoen, samen en zelf.">
<meta property="og:type" content="website">
<meta property="og:locale" content="nl_NL">
<meta property="og:site_name" content="meneer Greidanus">
<meta property="og:title" content="De leerroute">
<meta property="og:description" content="De hele leerlijn rekenen en Nederlands, elke manier stap voor stap.">
<meta property="og:url" content="https://meneergreidanus.nl/leermiddelen/leerroute.html">
<meta property="og:image" content="https://meneergreidanus.nl/icoon-512.png">
<meta name="theme-color" content="#FBF6F1">
<link rel="stylesheet" href="../fonts.css?v=2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M54.7 9 C78.5 11.8 93.5 29.6 90.3 51.7 C86.7 75.3 72.7 92.1 49.8 88.7 C26.1 85.1 3.9 71.7 9 48.3 C14.1 24.9 31.7 6.4 54.7 9Z' fill='%23EA9836'/><g transform='translate(50 51) scale(2.2) translate(-12 -12)' fill='none' stroke='%2314224C' stroke-width='2.25' stroke-linecap='round' stroke-linejoin='round'><rect x='4.5' y='6.5' width='15' height='11' rx='2'/><path d='M4.5 12h15'/><path d='M9.5 6.5v11M14.5 6.5v11'/></g></svg>">
<link rel="stylesheet" href="vakspel.css">
<link rel="stylesheet" href="basis.css">
<style>
/* de kleuren van de plaatjes: vijf die je uit elkaar houdt, ook in het donker */
:root{--lr-1:#204ECF;--lr-2:#D9522F;--lr-3:#B4701A;--lr-4:#1f7a52;--lr-5:#7a3fb0;--lr-zacht:rgba(32,78,207,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--lr-1:#83A5F2;--lr-2:#F58C72;--lr-3:#EBB563;--lr-4:#7fd3a6;--lr-5:#c39af0;--lr-zacht:rgba(131,165,242,.12)}}
:root[data-theme="dark"]{--lr-1:#83A5F2;--lr-2:#F58C72;--lr-3:#EBB563;--lr-4:#7fd3a6;--lr-5:#c39af0;--lr-zacht:rgba(131,165,242,.12)}
body{background:var(--room)}
header{background:var(--room)}
#lr{padding:22px 0 80px;max-width:1000px}
.lr-laden{color:var(--muted);padding:40px 0}
.btn.klein{min-height:44px;padding:0 16px;font-size:.95rem;margin-top:0}
.lr-knoppen{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin-top:20px}
.lr-knoppen .btn{margin-top:0}
.lr-knoppen a.btn{text-decoration:none;display:inline-flex;align-items:center}

/* ---------- het overzicht ---------- */
.lr-top .hand{font-size:1.6rem;margin:0}
.lr-top h1{font-size:clamp(2rem,6vw,3rem);margin:2px 0 8px}
.lr-lead{font-size:1.08rem;max-width:62ch;color:var(--muted);text-wrap:pretty}
.lr-stand{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:20px;background:var(--kaart);border:1px solid var(--rand);border-radius:22px;padding:16px 18px;box-shadow:var(--schaduw)}
.lr-stand p{margin:0;flex:1 1 160px}
.lr-stand .btn{margin-top:0;text-decoration:none;display:inline-flex;align-items:center}
.lr-balk{flex:1 1 100%;height:12px;border-radius:999px;background:var(--kaart2);overflow:hidden}
.lr-balk i{display:block;height:100%;background:var(--goed);border-radius:999px;min-width:2px;transition:width .6s var(--ease)}
.lr-hoe{margin-top:16px;max-width:70ch;color:var(--muted);font-size:.95rem;text-wrap:pretty}
.lr-hoe b{color:var(--ink)}
.lr-nav{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:62px;z-index:5;background:var(--room);padding:8px 0}
.lr-nav a{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:4px 16px;border-radius:999px;border:1px solid var(--rand2);background:var(--kaart);color:var(--ink);text-decoration:none;font-size:.92rem}
.lr-nav a:hover{border-color:var(--vak)}
.lr-nav span{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.lr-niveau{scroll-margin-top:120px;margin-top:38px}
.lr-nkop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;border-top:2px solid var(--ink);padding-top:16px}
.lr-nlabel{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:700;letter-spacing:-.03em;color:var(--vak);line-height:1}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lr-nlabel{color:color-mix(in srgb,var(--vak) 50%,#fff)}}
:root[data-theme="dark"] .lr-nlabel{color:color-mix(in srgb,var(--vak) 50%,#fff)}
.lr-nkop p{margin:0;color:var(--muted);max-width:66ch;font-size:.95rem;text-wrap:pretty}
.lr-dom{font-size:.76rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.lr-groepen{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.lr-groep{background:var(--kaart);border:1px solid var(--rand);border-radius:20px;padding:16px 16px 10px;scroll-margin-top:120px}
.lr-groep:target{outline:3px solid var(--vak);outline-offset:2px}
.lr-gkop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lr-gkop h3{font-size:1.08rem;line-height:1.25}
.lr-tel{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lr-tel.af{color:var(--goed);font-weight:600}
.lr-guit{margin:4px 0 6px;font-size:.86rem;color:var(--muted);text-wrap:pretty}
.lr-doelen{list-style:none;margin:0;padding:0}
.lr-doelen li+li{border-top:1px solid var(--rand)}
.lr-doelen a{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;min-height:44px;color:var(--ink);text-decoration:none;border-radius:10px}
.lr-doelen a:hover{background:var(--lr-zacht)}
.lr-doelen a>span{display:grid;gap:1px;min-width:0}
.lr-doelen b{font-weight:600;font-size:.94rem;line-height:1.3}
.lr-doelen small{color:var(--muted);font-size:.8rem;line-height:1.35}
.lr-bol{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--rand2);margin-top:1px;display:grid;place-items:center;font-style:normal}
.lr-bol.s1{border-color:var(--amber);background:linear-gradient(90deg,var(--amber) 50%,transparent 50%)}
.lr-bol.s2{border-color:var(--goed);background:var(--goed)}
.lr-bol svg{width:13px;height:13px;fill:none;stroke:var(--kaart);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- een doel ---------- */
.lr-kruim{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:.86rem;color:var(--muted)}
.lr-kruim a{color:var(--link);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.lr-kruim a:hover{text-decoration:underline}
.lr-dkop{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:6px}
.lr-dkop h1{font-size:clamp(1.7rem,5vw,2.5rem)}
.lr-label{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;border-radius:999px;padding:3px 10px 3px 4px;background:var(--kaart2)}
.lr-label.s2{background:var(--goed-bg);color:var(--goed);font-weight:600}
.lr-label .lr-bol{width:18px;height:18px;margin:0}
.lr-kort{font-size:1.1rem;font-weight:600;color:var(--nadruk);margin-top:4px;max-width:60ch}
.lr-fases{list-style:none;padding:0;margin:18px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lr-fases button{width:100%;display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 10px;border-radius:14px;border:1px solid var(--rand2);background:var(--kaart);color:var(--muted);font-weight:600;font-size:.9rem;text-align:left}
.lr-fases b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;font-size:.8rem}
.lr-fases button.nu{border-color:var(--vak);color:var(--ink);box-shadow:inset 0 -3px 0 var(--vak)}
.lr-fases button.nu b{background:var(--vak);border-color:var(--vak);color:#fff}
.lr-fases button.gedaan{color:var(--goed)}
@media(max-width:560px){.lr-fases button{flex-direction:column;gap:2px;font-size:.74rem;padding:6px 2px;text-align:center}}
.lr-kaart{background:var(--kaart);border:1px solid var(--rand);border-radius:24px;padding:clamp(18px,3.4vw,30px);margin-top:12px;box-shadow:var(--schaduw)}
.lr-uit{font-size:1.04rem;max-width:66ch;text-wrap:pretty}
.lr-uit p{margin:0 0 10px}
.lr-uit ul,.lr-uit ol{margin:0 0 10px;padding-left:1.3em}
.lr-uit li{margin:3px 0}
.lr-uit b,.lr-uit strong{color:var(--ink)}
.lr-wanneer{margin-top:14px;background:var(--lr-zacht);border-radius:14px;padding:10px 14px;font-size:.95rem;max-width:66ch}
.lr-beeld{display:flex;justify-content:center;align-items:center;margin:16px 0 4px;background:var(--kaart2);border-radius:18px;padding:14px 10px;overflow-x:auto}
.lr-beeld:empty{display:none}
.lr-context{color:var(--muted);text-align:center;max-width:56ch;margin:6px auto 0;font-size:1rem}
.lr-som{font-size:clamp(1.6rem,6vw,2.6rem);font-weight:700;text-align:center;margin:10px 0 4px;font-variant-numeric:tabular-nums;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.lr-som small{display:block;font-size:.45em;font-weight:500;color:var(--muted);letter-spacing:0}
.lr-stappen{list-style:none;padding:0;margin:16px auto 0;max-width:600px;display:grid;gap:8px;counter-reset:st}
.lr-stappen li{counter-increment:st;position:relative;padding:10px 14px 10px 44px;border-radius:14px;background:var(--kaart2);font-size:1.06rem;font-variant-numeric:tabular-nums;line-height:1.45}
.lr-stappen li::before{content:counter(st);position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.74rem;font-weight:700;background:var(--rand2);color:var(--ink)}
.lr-stappen li.klaar::before,.lr-stappen li.nieuw::before{background:var(--goed);color:var(--kaart)}
.lr-stappen li.geholpen::before{background:var(--amber)}
.lr-stappen li.nu{background:var(--kaart);box-shadow:inset 0 0 0 2px var(--vak)}
.lr-stappen li.nu::before{background:var(--vak);color:#fff}
.lr-stappen li.later{opacity:.45}
.lr-stappen li.nieuw{animation:lr-in .35s var(--ease)}
.lr-stappen small{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
@keyframes lr-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lr-sant{color:var(--goed);font-weight:700}
.lr-invul{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 0 6px;vertical-align:middle}
.lr-invul input{width:8.5em;max-width:100%;min-height:48px;border-radius:12px;border:2px solid var(--rand2);background:var(--kaart);color:var(--ink);font:600 1.15rem Poppins,system-ui,sans-serif;text-align:center;padding:0 8px}
.lr-invul input:focus{outline:none;border-color:var(--nadruk);box-shadow:0 0 0 4px var(--nadruk-zacht)}
.lr-invul input.goed{background:var(--goed-bg);border-color:var(--goed);color:var(--goed)}
.lr-invul input.fout{background:var(--fout-bg);border-color:var(--fout);color:var(--fout);animation:lr-schud .35s}
.lr-invul input:disabled{opacity:1}
.lr-eenh{font-weight:600;color:var(--muted)}
@keyframes lr-schud{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.lr-zelfin{display:flex;justify-content:center;margin-top:14px}
.lr-zelfin .lr-invul{margin:0}
.lr-zelfin .lr-invul input{width:10em;min-height:56px;font-size:1.4rem}
.lr-zelfin .lr-opties{justify-content:center}
.lr-opties{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.lr-optie{min-height:48px;padding:6px 18px;border-radius:14px;border:2px solid var(--rand2);background:var(--kaart);color:var(--ink);font-weight:600;font-size:1.02rem;text-align:left}
.lr-optie:hover:not(:disabled){border-color:var(--nadruk)}
.lr-optie.goed{background:var(--goed-bg);border-color:var(--goed);color:var(--goed)}
.lr-optie.fout{background:var(--fout-bg);border-color:var(--fout);color:var(--fout)}
.lr-optie:disabled{cursor:default}
.lr-terug{min-height:1.4em;margin:8px 0 0;font-weight:500;font-size:.98rem}
.lr-terug:empty{margin:0}
.lr-terug.goed{color:var(--goed);font-weight:700;text-align:center}
.lr-terug.fout{color:var(--fout)}
.lr-terug.hint{color:var(--ink)}
.lr-terug.hint b{color:var(--hand)}
.lr-terug + .btn{margin-top:8px}
.lr-eind{text-align:center;margin-top:16px;font-size:1.15rem}
.lr-eind b{font-size:1.3em}
.lr-goedtxt{display:block;color:var(--goed);font-weight:600;font-size:.9rem;margin-top:2px}
.lr-zelfin + .lr-terug{text-align:center}
#lrUitw .lr-stappen{margin-top:10px}
.lr-volg{display:block;margin:18px auto 0}
.lr-bollen{display:flex;gap:8px;justify-content:center;margin-top:18px}
.lr-bollen i{width:14px;height:14px;border-radius:50%;border:2px solid var(--rand2)}
.lr-bollen i.nu{border-color:var(--vak)}
.lr-bollen i.goed{background:var(--goed);border-color:var(--goed)}
.lr-bollen i.fout{background:var(--fout);border-color:var(--fout)}
.lr-bollen.groot i{width:22px;height:22px}
.lr-uitkop{font-size:clamp(1.8rem,6vw,2.6rem);text-align:center}
.lr-kaart>.lr-uit:last-of-type{margin-inline:auto}
.lr-broers{margin-top:26px;border-top:1px dashed var(--rand2);padding-top:14px}
.lr-broers ul{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.lr-broers a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:4px 14px 4px 8px;border-radius:999px;border:1px solid var(--rand2);color:var(--ink);text-decoration:none;font-size:.88rem}
.lr-broers a:hover{border-color:var(--vak)}
.lr-broers .lr-bol{width:16px;height:16px;margin:0}

/* ---------- de plaatjes ---------- */
.lr-svg{width:100%;max-width:640px;height:auto;display:block;overflow:visible}
.lr-svg .as{stroke:var(--ink);stroke-width:2;fill:none}
.lr-svg .as.dun{stroke-width:1;opacity:.5}
.lr-svg text{fill:var(--ink);font-family:Poppins,system-ui,sans-serif}
.lr-svg .getal{font-size:15px;font-weight:600;text-anchor:middle}
.lr-svg .getal.klein{font-size:13px}
.lr-svg .getal.groot{font-size:20px;font-weight:700}
.lr-svg .sprong{font-size:16px;font-weight:700;text-anchor:middle}
.lr-svg .boog,.lr-svg .pijl{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lr-svg .boog.nieuw{stroke-dasharray:100;animation:lr-teken .55s var(--ease) both}
.lr-svg .pijl.nieuw,.lr-svg .sprong.nieuw{animation:lr-op .2s .5s both}
@keyframes lr-teken{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes lr-op{from{opacity:0}to{opacity:1}}
.lr-svg .stip{fill:var(--lr-2)}
.lr-svg .blok{stroke:var(--kaart);stroke-width:.6}
.lr-svg .blok.h{fill:var(--lr-1)}.lr-svg .blok.t{fill:var(--lr-2)}.lr-svg .blok.e{fill:var(--lr-3)}
.lr-svg .vak{fill:var(--kaart);stroke:var(--ink);stroke-width:2}
.lr-svg .vak.leeg{stroke:var(--lr-2);stroke-dasharray:5 4}
.lr-svg .deel{fill:var(--kaart);stroke:var(--ink);stroke-width:1.5}
.lr-svg .deel.vol{fill:var(--lr-1);opacity:.75}
.lr-svg .rand{fill:none;stroke:var(--ink);stroke-width:2.5}
.lr-svg .wijzerplaat{fill:var(--kaart);stroke:var(--ink);stroke-width:3}
.lr-svg .wijzer{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.lr-svg .wijzer.kort{stroke:var(--lr-2);stroke-width:5.5}
.lr-tabel{border-collapse:separate;border-spacing:4px;font-variant-numeric:tabular-nums;font-size:1.05rem}
.lr-tabel th,.lr-tabel td{padding:7px 12px;text-align:center;border-radius:10px;background:var(--kaart);min-width:54px}
.lr-tabel th{background:var(--lr-zacht);font-weight:600}
.lr-tabel td.nadruk,.lr-tabel th.nadruk{box-shadow:inset 0 0 0 2px var(--lr-2);font-weight:700}
.lr-tabel tr.pijlen td{background:none;padding:0 4px;font-size:.82rem;font-weight:700;color:var(--lr-2);text-align:left;transform:translateX(-50%)}
.lr-tabel.rooster th:first-child{background:none;color:var(--muted)}
.lr-vraagt{color:var(--lr-2)}
.lr-cijfer{border-collapse:collapse;font:600 1.6rem/1.2 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.lr-cijfer td{width:1.1em;text-align:center;padding:1px 0}
.lr-cijfer tr.onth td{font-size:.85rem;color:var(--lr-2);height:1.1em}
.lr-cijfer tr.streep td{border-top:3px solid currentColor;padding-top:3px}
.lr-cijfer td.teken{color:var(--muted)}
.lr-zin{display:flex;flex-wrap:wrap;gap:12px 6px;align-items:flex-start;justify-content:center;font-size:1.25rem;line-height:1.3;margin:0}
.lr-zin.dicht{gap:12px 2px;font-size:1.6rem;font-weight:600}
.lr-zin .los{padding:4px 0}
.lr-zin .stuk{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.lr-zin .stuk .t{padding:3px 8px;border-radius:8px;border-bottom:4px solid currentColor;background:var(--kaart)}
.lr-zin .stuk small{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.lr-zin .k1{color:var(--lr-1)}.lr-zin .k2{color:var(--lr-2)}.lr-zin .k3{color:var(--lr-3)}.lr-zin .k4{color:var(--lr-4)}.lr-zin .k5{color:var(--lr-5)}
.lr-zin .k0{color:var(--muted)}
.lr-zin .stuk .t{color:var(--ink)}
.lr-zin .stuk.weg .t{text-decoration:line-through;opacity:.55}
.lr-tekst{background:var(--kaart);border-radius:14px;padding:14px 16px;text-align:left;max-width:62ch;font-size:1rem;line-height:1.6}
.lr-tekst p{margin:0 0 8px}
.lr-tekst mark{background:var(--lr-zacht);color:inherit;border-bottom:3px solid var(--lr-2);padding:0 2px}
@media(prefers-reduced-motion:reduce){.lr-svg .boog.nieuw,.lr-svg .pijl.nieuw,.lr-svg .sprong.nieuw,.lr-stappen li.nieuw,.lr-invul input.fout{animation:none}}

/* ---------- kerndoelen ---------- */
.lr-kdrij{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 6px}
.lr-kdrij>span{font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.lr-kd{display:inline-flex;align-items:center;min-height:26px;padding:0 9px;border-radius:999px;border:1.5px solid var(--rand2);font-size:.76rem;font-weight:600;color:var(--ink);text-decoration:none;font-variant-numeric:tabular-nums}
.lr-kd:hover{border-color:var(--vak)}
.lr-kd.hv{border-style:dashed}
.lr-kdblok{margin-top:14px;border:1px solid var(--rand);border-radius:14px;padding:0 14px;max-width:66ch;font-size:.92rem}
.lr-kdblok summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lr-kdblok summary span{color:var(--muted)}
.lr-kdblok p{margin:0 0 6px}
.lr-kdblok ul{margin:0 0 10px;padding-left:1.2em}
.lr-kdblok i,.lr-verant i{color:var(--muted)}
.lr-kdbron{font-size:.84rem;color:var(--muted)}
.lr-kdbron a,.lr-verant a{color:var(--link)}
.lr-verant{margin-top:48px;border-top:2px solid var(--ink);padding-top:18px;scroll-margin-top:110px}
.lr-verant h2{font-size:clamp(1.4rem,4vw,1.9rem)}
.lr-kdzin{background:var(--kaart);border:1px solid var(--rand);border-radius:18px;padding:14px 16px;margin-top:12px;scroll-margin-top:110px}
.lr-kdzin:target{outline:3px solid var(--vak);outline-offset:2px}
.lr-kdzin h3{font-size:1.02rem}
.lr-kdzin>p{margin:2px 0 8px;color:var(--muted);font-size:.9rem}
.lr-kdzin ul{list-style:none;margin:0;padding:0}
.lr-kdzin li{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--rand);font-size:.9rem}
.lr-kdgr{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.84rem}
.lr-kdgr a{text-decoration:none}
.lr-kdgr a:hover{text-decoration:underline}
.lr-uitdoel{display:inline-block;font-size:.76rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--rand2);border-radius:999px;padding:1px 10px;margin-bottom:4px}

/* voordoen: de vakken waar je straks invult */
.lr-voor input{cursor:default}
.lr-voor input.wacht{border-color:var(--vak);box-shadow:0 0 0 4px var(--nadruk-zacht);animation:lr-wacht 1.4s ease-in-out infinite}
.lr-voor input.typ{animation:none;background:var(--kaart)}
@keyframes lr-wacht{50%{box-shadow:0 0 0 7px var(--nadruk-zacht)}}
.lr-voor .lr-optie:disabled{opacity:1;cursor:default}
.lr-voor .lr-optie.tik{animation:lr-tik .45s var(--ease)}
@keyframes lr-tik{40%{transform:scale(1.06)}}
.lr-hier{margin:6px 0 0;font-size:.86rem;font-weight:600;color:var(--hand)}
.lr-stappen li.klaar .lr-voor{opacity:1}
@media(prefers-reduced-motion:reduce){.lr-voor input.wacht,.lr-voor .lr-optie.tik{animation:none}}
</style>
