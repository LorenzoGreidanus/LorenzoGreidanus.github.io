<style>
/* Clubbaas: een donker speelveld zoals Teambaas (nachtblauw, gloed, merkkleuren), ook in het lichte thema.
   Het veld is blauw met lichtblauwe lijnen: het merkboek heeft geen groen. */
.cb{--bg:#0B1029;--kaart:#121A3D;--rand:rgba(251,246,241,.16);--ink:#FBF6F1;--zacht:#C9D2EE;--stil:#8F9BC8;
  background:radial-gradient(ellipse 60% 50% at 70% 0%,rgba(32,78,207,.26),transparent 70%),var(--bg);color:var(--ink);border-radius:24px;padding:18px 22px 22px;margin:14px auto 24px;max-width:1340px;font-family:Poppins,system-ui,sans-serif}
.cb h2,.cb h3{margin:0;font-weight:600;color:var(--ink)}.cb h2{font-size:1.15rem}.cb h3{font-size:1rem}
.cb a{color:#83A5F2}
.cb-hand{font-family:Caveat,cursive;font-size:1.2rem;color:#EA9836;line-height:1;display:block}
.cb-klein{font-size:.8rem;color:var(--zacht);line-height:1.45}
.cb-balk{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.cb-club{display:flex;align-items:center;gap:12px;margin-right:auto}.cb-club b{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}.cb-club svg{display:block}
.cb-tel{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--rand)}
.cb-tel b{font-size:1.15rem;display:block;line-height:1.1}.cb-tel span,.cb-tel small{font-size:.72rem;color:var(--zacht);display:block}
.cb-munt{border-color:rgba(234,152,54,.55);background:rgba(234,152,54,.08)}.cb-munt svg{width:22px;height:22px}
.cb-fitbalk{border-color:rgba(131,165,242,.5);background:rgba(131,165,242,.08)}.cb-fitbalk .cb-meter{width:110px}
.cb-meter{height:8px;border-radius:4px;background:rgba(251,246,241,.12);overflow:hidden;flex:1}.cb-meter i{display:block;height:100%;background:#83A5F2;border-radius:4px}
.cb-tabs{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0;padding:4px;border-radius:14px;background:rgba(251,246,241,.06)}
.cb-tabs button{min-height:40px;padding:0 14px;border-radius:10px;border:0;background:transparent;color:var(--ink);font:600 .88rem Poppins,sans-serif;cursor:pointer}
.cb-tabs button[aria-selected="true"]{background:var(--ink);color:#14224C}
.cb button:focus-visible,.cb a:focus-visible,.cb select:focus-visible,.cb input:focus-visible{outline:3px solid #EA9836;outline-offset:2px}
.cb-kaart{background:var(--kaart);border:1.5px solid var(--rand);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cb-rij{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cb-kol{display:flex;flex-direction:column;gap:14px;min-width:0}
.cb-knop{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid transparent;font:600 .88rem Poppins,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.cb-knop[disabled]{opacity:.45;cursor:not-allowed}
.cb-koraal{background:#F26749;color:#14224C;box-shadow:0 0 22px rgba(242,103,73,.4)}.cb-oker{background:#EA9836;color:#14224C}.cb-blauw{background:#83A5F2;color:#14224C}.cb-room{background:#FBF6F1;color:#14224C}
.cb-rand{background:transparent;color:var(--ink);border-color:rgba(251,246,241,.3)}.cb-smal{min-height:38px;padding:0 12px;font-size:.8rem}
.cb-link{background:none;border:0;color:#83A5F2;font:inherit;font-size:.8rem;cursor:pointer;text-decoration:underline;padding:6px 0}
.cb-huis{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;gap:14px;align-items:start}
.cb-duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.cb-duel>div{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}.cb-duel b{font-size:.9rem;overflow-wrap:anywhere}
.cb-tegen{font-family:Caveat,cursive;font-size:1.7rem;color:#EA9836}
.cb-aftel{display:flex;align-items:baseline;gap:8px;background:rgba(251,246,241,.06);border-radius:12px;padding:8px 12px}.cb-aftel b{font-size:1.15rem}.cb-aftel span{font-size:.75rem;color:var(--zacht)}
.cb-ministand{list-style:none;margin:0;padding:0;display:grid;gap:4px}.cb-ministand li{display:grid;grid-template-columns:20px 10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.85rem}
.cb-ministand li span{color:var(--zacht)}.cb-ministand li i{width:10px;height:10px;border-radius:3px}.cb-ministand li b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cb-ministand li em{font-style:normal}
.cb-ministand li.jij b,.cb-ministand li.jij em{font-weight:700;color:#EA9836}
.cb-selectie{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cb-sp{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 8px;align-items:center;background:rgba(251,246,241,.05);border-radius:12px;padding:7px 8px;border:1.5px solid transparent}
.cb-sp.basis{border-color:rgba(131,165,242,.35)}
.cb-sp .cb-gz{grid-row:span 2}.cb-sp b{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cb-sp small{font-size:.7rem;color:var(--zacht);display:flex;align-items:center;gap:6px;white-space:nowrap}.cb-sp .cb-fit{margin-left:auto}
.cb-gz{position:relative;display:inline-grid;place-items:center;border-radius:50%;box-shadow:0 0 0 2.5px var(--ring,#83A5F2)}.cb-gz svg{display:block}
.cb-fit{display:inline-block;width:34px;height:5px;border-radius:3px;background:rgba(251,246,241,.14);overflow:hidden}.cb-fit i{display:block;height:100%}
.cb-train{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cb-deel{background:rgba(251,246,241,.05);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}.cb-deel b{font-size:.9rem}.cb-deel .cb-klein{min-height:3.2em;font-size:.72rem}.cb-deel .cb-knop{min-height:38px;font-size:.72rem;padding:0 6px}
.cb-pips{display:flex;gap:2px}.cb-pips i{flex:1;height:6px;border-radius:2px;background:rgba(251,246,241,.16)}.cb-pips i.aan{background:#EA9836}.cb-pips i.dicht{background:transparent;border:1px dashed rgba(251,246,241,.14)}
.cb-bezig{font-size:.75rem;color:#83A5F2;font-weight:600}
.cb-jobs{display:flex;flex-direction:column;gap:8px}.cb-job{border-radius:14px;background:rgba(131,165,242,.1);border:1.5px solid #83A5F2;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.cb-job-kop{display:flex;justify-content:space-between;gap:8px;font-size:.82rem}.cb-vrij{background:transparent;border:1.5px dashed rgba(251,246,241,.25);font-size:.82rem;color:var(--zacht)}
.cb-nieuws{margin:0;padding-left:18px;font-size:.82rem;color:var(--zacht);display:grid;gap:5px}
.cb-stadion svg{display:block;width:100%;height:auto}
.cb-vragen{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.cb-veld{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--zacht)}
.cb-veld select,.cb-veld input{min-height:44px;border-radius:12px;border:1.5px solid rgba(251,246,241,.25);background:#0F1636;color:var(--ink);font:500 .95rem Poppins,sans-serif;padding:0 12px}
.cb-groot{font-size:2rem;font-weight:700;text-align:center;padding:6px 0}
.cb-vraagvak{min-height:440px;padding:26px 30px;gap:18px}.cb-label{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(251,246,241,.08);font-size:.75rem;color:var(--zacht);font-style:normal}
.cb-vraag{font-size:1.45rem;font-weight:600;line-height:1.35;margin:0;max-width:62ch}
.cb-vraagbeeld svg{max-width:320px;max-height:220px;display:block;background:#FBF6F1;border-radius:12px;padding:8px}
.cb-opties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cb-optie{min-height:64px;text-align:left;padding:10px 18px;border-radius:16px;border:2px solid #2F3C78;background:rgba(251,246,241,.04);color:var(--ink);font:500 1.02rem Poppins,sans-serif;cursor:pointer;display:flex;align-items:center;gap:12px}
.cb-optie b{color:var(--zacht);font-weight:600}.cb-optie:hover:not([disabled]){border-color:#83A5F2}
.cb-optie.goed{border-color:#83A5F2;background:rgba(131,165,242,.22)}.cb-optie.fout{border-color:#F26749;background:rgba(242,103,73,.18)}.cb-optie[disabled]{cursor:default}
.cb-uitleg{display:flex;align-items:center;gap:16px;border-radius:16px;padding:14px 18px}.cb-uitleg>div{flex:1}.cb-uitleg p{margin:4px 0 0;font-size:.9rem;color:#E3E8F7}
.cb-uitleg.goed{background:rgba(131,165,242,.18)}.cb-uitleg.fout{background:rgba(242,103,73,.16)}
/* het veld */
.cb-veldvak{position:relative;border-radius:14px;overflow:hidden;background:#204ECF;aspect-ratio:105/68;width:100%}.cb-veldvak.staand{aspect-ratio:68/100;max-width:440px;margin:0 auto}
.cb-veldvak>svg{position:absolute;inset:0;width:100%;height:100%}
.cb-plek{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:96px;background:none;border:0;padding:0;color:var(--ink);font-family:Poppins,sans-serif;cursor:pointer}
.cb-plek .cb-naam{font-size:.7rem;font-weight:600;background:#0B1029;border-radius:6px;padding:1px 6px;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.cb-plek small{font-size:.64rem;color:#FCDED6}
.cb-plek.kies .cb-gz{box-shadow:0 0 0 3px #FBF6F1,0 0 0 6px #EA9836,0 0 18px rgba(234,152,54,.8)}
.cb-plek.fout small{color:#FCDED6;background:#F26749;color:#14224C;border-radius:4px;padding:0 4px;font-weight:600}
.cb-opst{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.cb-seg{display:flex;flex-wrap:wrap;gap:6px}.cb-seg button{min-height:40px;padding:0 12px;border-radius:10px;border:1.5px solid #83A5F2;background:transparent;color:var(--ink);font:600 .82rem Poppins,sans-serif;cursor:pointer}.cb-seg button[aria-pressed="true"]{background:var(--ink);color:#14224C;border-color:var(--ink)}
.cb-drie{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.cb-drie button{padding:0 4px}
.cb-bank{display:grid;gap:6px}.cb-bankrij{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;background:rgba(251,246,241,.05);border-radius:10px;padding:6px 10px;border:1.5px solid transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%}
.cb-bankrij b{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cb-bankrij small{font-size:.72rem;color:var(--zacht)}.cb-bankrij.kies{border-color:#EA9836;background:rgba(234,152,54,.12)}
.cb-advies{border-color:#EA9836;background:rgba(234,152,54,.08);font-size:.82rem}
/* de wedstrijd */
.cb-wed{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.cb-bord{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.cb-bord>div{display:flex;align-items:center;gap:10px;min-width:0}.cb-bord>div:first-child{justify-content:flex-end;text-align:right}.cb-bord>div b{font-size:1rem;overflow-wrap:anywhere}
.cb-score{display:flex;flex-direction:column;align-items:center;background:#0B1029;border-radius:12px;padding:4px 20px}.cb-score b{font-size:2rem;line-height:1.1;letter-spacing:2px;font-variant-numeric:tabular-nums}.cb-score span{font-size:.78rem;color:#EA9836;font-weight:600}
.cb-man{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;will-change:transform;box-shadow:0 0 0 3px var(--ring)}
.cb-man svg{display:block}.cb-man.bal{z-index:2;box-shadow:0 0 0 3px var(--ring),0 0 0 5px #FBF6F1}
.cb-bal{position:absolute;left:0;top:0;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#FBF6F1;box-shadow:0 0 0 2px #14224C,0 2px 6px rgba(0,0,0,.4);z-index:3;will-change:transform}
.cb-roep{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:4;padding:6px 16px;border-radius:999px;background:#0B1029;border:1.5px solid #EA9836;font-weight:700;font-size:.95rem;white-space:nowrap}
.cb-roep.goal{background:#EA9836;color:#14224C;font-size:1.2rem;box-shadow:0 0 30px rgba(234,152,54,.7)}
.cb-roep[hidden]{display:none}
.cb-bediening{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cb-tijdlijn{position:relative;flex:1;min-width:160px;display:flex;align-items:center}
.cb-tijdlijn input{width:100%;accent-color:#83A5F2;min-height:32px}
.cb-tijdlijn>span:last-child{position:absolute;left:8px;right:8px;top:0;bottom:0;pointer-events:none}.cb-tijdlijn i{position:absolute;top:50%;width:4px;height:14px;border-radius:2px;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px #0B1029}
.cb-verslag{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:360px;overflow:auto}
.cb-verslag li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;background:rgba(251,246,241,.05);border-radius:10px;padding:7px 10px;font-size:.82rem;line-height:1.4}
.cb-verslag li b{color:#EA9836}.cb-verslag li.goal{background:rgba(234,152,54,.16)}
.cb-cijfer{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:.82rem}.cb-cijfer>div{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--zacht)}
.cb-twee{display:flex;width:100%;height:6px;border-radius:3px;overflow:hidden}
.cb-uitslagen{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.cb-uitslagen button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);gap:8px;align-items:center;min-height:40px;border-radius:10px;border:1.5px solid transparent;background:rgba(251,246,241,.05);color:var(--ink);font:500 .8rem Poppins,sans-serif;cursor:pointer;padding:4px 10px}
.cb-uitslagen button:hover,.cb-uitslagen button[aria-current="true"]{border-color:#83A5F2}.cb-uitslagen button span:first-child{text-align:right}.cb-uitslagen button b{text-align:center;font-variant-numeric:tabular-nums}.cb-uitslagen button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* stand, transfers, club */
.cb-tabel{width:100%;border-collapse:collapse;font-size:.85rem}.cb-tabel th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--zacht);text-align:left;font-weight:600;border-bottom:1.5px solid var(--rand);padding:6px 8px}
.cb-tabel td{padding:7px 8px;border-bottom:1px solid rgba(251,246,241,.06)}.cb-tabel .r{text-align:right;font-variant-numeric:tabular-nums}.cb-tabel tr.mijn td{background:rgba(242,103,73,.16);font-weight:600}
.cb-tabel tr.op td:first-child{box-shadow:inset 4px 0 0 #83A5F2}.cb-tabel tr.neer td:first-child{box-shadow:inset 4px 0 0 #F26749}
.cb-tabel td svg{vertical-align:middle;margin-right:8px}
.cb-standscherm{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.cb-transfer{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.cb-markt{display:grid;gap:6px}
.cb-mrij{display:grid;grid-template-columns:34px minmax(0,1.5fr) 52px minmax(0,1fr) 80px 130px;gap:10px;align-items:center;background:rgba(251,246,241,.05);border-radius:12px;padding:7px 10px;font-size:.82rem}
.cb-mrij b{display:block;font-size:.85rem}.cb-mrij small{color:var(--zacht);font-size:.72rem}.cb-mrij .cb-knop{min-height:38px;font-size:.78rem;padding:0 8px}
.cb-kop{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--zacht);background:none;padding-top:0;padding-bottom:0}
.cb-bod{border-color:#EA9836;background:rgba(234,152,54,.08)}
.cb-dicht{border-style:dashed}
.cb-clubscherm{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}
.cb-tenue{display:flex;gap:24px;align-items:center;justify-content:center;padding:18px;border-radius:16px;background:rgba(251,246,241,.05)}
.cb-stalen{display:flex;flex-wrap:wrap;gap:6px}
.cb-staal{width:38px;height:38px;border-radius:50%;border:2px solid rgba(251,246,241,.25);cursor:pointer}.cb-staal.aan{box-shadow:0 0 0 3px #0B1029,0 0 0 5px #FBF6F1}
.cb-logos{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cb-logos button{min-height:56px;border-radius:12px;border:1.5px solid rgba(251,246,241,.2);background:transparent;cursor:pointer;display:grid;place-items:center}.cb-logos button[aria-pressed="true"]{border-color:#83A5F2;background:rgba(131,165,242,.18)}
.cb-nieuw{max-width:640px;margin:20px auto;padding:26px 28px;gap:14px}.cb-nieuw h2{font-size:1.5rem}.cb-nieuw p{margin:0;color:#E3E8F7;line-height:1.55}
.cb-fout{color:#FCDED6;background:rgba(242,103,73,.16);border-radius:10px;padding:8px 12px;margin:0}
.cb-melding{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;background:#FBF6F1;color:#14224C;font-weight:600;padding:12px 20px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cb h2:focus,.cb h3:focus{outline:none}
@media(max-width:1180px){.cb-huis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cb-huis>.cb-midden{grid-column:1/-1;order:-1}.cb-opst,.cb-wed,.cb-vragen,.cb-transfer,.cb-clubscherm,.cb-standscherm{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){.cb{padding:14px 12px;border-radius:0;margin:0 -16px}.cb-huis,.cb-opties{grid-template-columns:minmax(0,1fr)}.cb-selectie{grid-template-columns:repeat(2,minmax(0,1fr))}.cb-train{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cb-mrij{grid-template-columns:34px minmax(0,1fr) auto}.cb-mrij .cb-weg{display:none}.cb-mrij .cb-knop{grid-column:2/-1}.cb-plek{width:70px}.cb-plek .cb-naam{max-width:70px;font-size:.62rem}.cb-plek small{display:none}.cb-man{width:20px;height:20px;margin:-10px 0 0 -10px}.cb-logos{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.cb-man,.cb-bal{transition:none}}
</style>
