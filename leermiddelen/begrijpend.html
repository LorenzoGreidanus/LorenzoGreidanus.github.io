<style>
/* ---------- de tekst bij de vragen ---------- */
.bl-tekst{width:100%;text-align:left;background:var(--kaart2);border-left:4px solid var(--spelkleur);border-radius:0 16px 16px 0}
.bl-tekst>summary{list-style:none;cursor:pointer;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:12px 16px 8px;min-height:44px}
.bl-tekst>summary::-webkit-details-marker{display:none}
.bl-tekst>summary .eyebrow{margin:0}
.bl-tekst>summary b{flex:1 1 100%;font-size:1.12rem;line-height:1.25;color:var(--ink)}
.bl-klap{margin-left:auto;font-size:.78rem;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.bl-tekst[open] .bl-klap .dicht,.bl-tekst:not([open]) .bl-klap .open{display:none}
.bl-body{padding:2px 18px 16px;font-size:1.02rem;line-height:1.72;color:var(--ink)}
.bl-body p+p{margin-top:.75em}
.bl-body .bl-onder{font-style:italic;color:var(--muted)}
.bl-z{border-radius:4px;transition:background-color .25s var(--ease),box-shadow .25s var(--ease)}
.bl-z.licht{background:var(--nadruk-zacht);box-shadow:0 0 0 2px var(--nadruk-zacht)}
.bl-z.wijs{background:var(--kaart-aan);box-shadow:0 0 0 2px var(--rand2)}
.bl-z.nee{text-decoration:line-through;text-decoration-color:var(--muted);text-decoration-thickness:1.5px;color:var(--muted)}
.bl-tekst p.zacht{background:var(--kaart-aan);border-radius:8px;box-shadow:0 0 0 6px var(--kaart-aan)}
.bl-m.wijs{font-weight:700;text-decoration:underline;text-decoration-color:var(--crab);text-decoration-thickness:3px;text-underline-offset:4px}
.bl-m.bron{border-radius:5px;box-shadow:0 0 0 2px var(--nadruk);background:var(--nadruk-zacht)}
/* de uitleg na een antwoord */
.bl-waarom{margin:0}
.bl-cit{display:block;margin-top:8px;padding:8px 12px;border-left:3px solid currentColor;border-radius:0 10px 10px 0;background:var(--kaart);color:var(--ink);font-style:italic;font-size:.92rem}
.bl-cit b{font-style:normal}
.bl-jij{margin-top:8px}
.bl-anders{margin-top:8px;color:var(--ink)}
.bl-anders>summary{cursor:pointer;font-weight:600;font-size:.88rem;min-height:44px;display:flex;align-items:center;gap:8px;list-style:none;text-decoration:underline;text-decoration-color:var(--rand2);text-underline-offset:4px}
.bl-anders>summary::-webkit-details-marker{display:none}
.bl-anders>summary::after{content:"";flex:none;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.bl-anders[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}
.bl-anders p{font-size:.88rem;margin-top:6px}
.bl-toon{margin-top:8px;background:none;border:1.5px solid currentColor;border-radius:999px;padding:6px 14px;min-height:44px;font-weight:600;font-size:.86rem;color:inherit}
.uitslagregel .bl-anders{display:block}
/* een feit-of-meningzin in de vraag */
.bl-vz{display:block;margin:8px auto 0;max-width:46ch;font-weight:500;font-style:italic;font-size:.98rem;color:var(--ink)}
/* de lange antwoorden: een kolom, links */
#scherm-spel .opties,.bl-opties{grid-template-columns:1fr}
#scherm-spel .opties.twee{grid-template-columns:1fr 1fr}

/* ---------- twee kolommen op een breed scherm: de tekst links, de vraag rechts ---------- */
@media (min-width:880px){
  #scherm-spel .kaart{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);column-gap:28px;align-items:start}
  #scherm-spel .kaart>*{grid-column:2;min-width:0}
  #scherm-spel .kaart>.beeld{grid-column:1;grid-row:1 / span 8;position:sticky;top:78px;margin:0;display:block;max-height:calc(100vh - 100px);overflow:auto;border-radius:0 16px 16px 0}
  #scherm-spel .onderdeel,#scherm-spel .vraag,#scherm-spel .opdracht{text-align:left}
  #scherm-spel .verder{justify-content:flex-start}
  .bl-tekst>summary{cursor:default}
  .bl-tekst .bl-klap{display:none}
}
/* op een telefoon: de tekst boven de vraag, in te klappen */
@media (max-width:879px){
  #scherm-spel .kaart{display:flex;flex-direction:column}
  #scherm-spel .kaart>.onderdeel{order:0}
  #scherm-spel .kaart>.beeld{order:1;display:block;margin:0 0 14px}
  #scherm-spel .kaart>*{order:2}
  .bl-body{font-size:1rem;padding:2px 14px 14px}
}

/* ---------- de knop naar de leerstand op het startscherm ---------- */
.bl-leerkaart{max-width:620px;margin:22px auto 0;background:var(--kaart);border:2px solid var(--spelkleur);border-radius:20px;padding:16px 18px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.bl-leerkaart .bl-ico{grid-row:1 / span 3;width:52px;height:52px;border-radius:16px;background:var(--spelkleur);display:grid;place-items:center}
.bl-leerkaart .bl-ico svg{width:30px;height:30px;fill:none;stroke:var(--spelinkt);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* de handkleur haalt op wit net geen 4,5:1; in het licht een tint donkerder, in het donker de gewone */
.bl-leerkaart .eyebrow{color:#B5401F}
:root[data-theme="dark"] .bl-leerkaart .eyebrow{color:var(--hand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .bl-leerkaart .eyebrow{color:var(--hand)}}
.bl-leerkaart b{font-size:1.08rem}
.bl-leerkaart p{font-size:.9rem;color:var(--muted)}
.bl-leerkaart .btn{grid-column:1 / -1;margin:10px 0 0;justify-self:start}
.bl-leerkaart.klein{display:flex;justify-content:center;border:0;background:none;padding:0;margin-top:14px}
.bl-leerkaart.klein>*:not(.bl-klein){display:none}
.bl-klein{display:none}
.bl-leerkaart.klein .bl-klein{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--rand2);border-radius:999px;background:var(--kaart);font-weight:600;font-size:.9rem;color:var(--ink)}
.bl-leerkaart.klein .bl-klein:hover{border-color:var(--ink)}
@media (max-width:560px){.bl-leerkaart{grid-template-columns:1fr;padding:14px}.bl-leerkaart .bl-ico{display:none}.bl-leerkaart .btn{justify-self:stretch}}

/* ---------- de leerstand ---------- */
.lr{max-width:1000px;padding:24px 0 60px}
.lr h1{font-size:clamp(1.7rem,4.5vw,2.4rem)}
.lr h2{font-size:clamp(1.35rem,3.6vw,1.9rem)}
.lr-kaart{background:var(--kaart);border:1px solid var(--rand);border-radius:22px;padding:clamp(14px,3vw,24px);margin-top:14px;box-shadow:var(--schaduw)}
.lr-kort{font-size:1.08rem;font-weight:600;color:var(--nadruk);margin-top:4px}
.lr-uit{margin-top:10px}
.lr-lijst{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.lr-lijst li{background:var(--kaart2);border-radius:12px;padding:9px 13px}
.lr-lijst li b{color:var(--ink)}
.lr-stappen{counter-reset:st;list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.lr-stappen li{counter-increment:st;position:relative;background:var(--kaart2);border-radius:12px;padding:9px 13px 9px 44px}
.lr-stappen li::before{content:counter(st);position:absolute;left:11px;top:9px;width:24px;height:24px;border-radius:8px;background:var(--spelkleur);color:var(--spelinkt);font-weight:700;font-size:.8rem;display:grid;place-items:center}
.lr-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.lr-chips button{border:1.5px solid var(--rand2);background:var(--kaart);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;min-height:44px}
.lr-chips button.klaar{background:var(--goed-bg);border-color:var(--goed)}
.lr-chips button.nu{border-color:var(--spelkleur);box-shadow:0 0 0 2px var(--spelkleur)}
.lr-knoppen{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.lr-knoppen .btn{margin-top:0}
.lr-twee{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:24px;align-items:start;margin-top:14px}
.lr-twee>.lr-links{position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto;border-radius:0 16px 16px 0}
.lr-vraag{font-size:clamp(1.05rem,2.3vw,1.25rem);font-weight:600;margin-top:4px}
.lr-vraag .vw{border-radius:4px;transition:all .2s var(--ease)}
.lr-vraag .vw.aan{text-decoration:underline;text-decoration-color:var(--crab);text-decoration-thickness:3px;text-underline-offset:4px}
.lr-denk{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.lr-denk li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:var(--kaart2);border-radius:14px;padding:10px 12px;animation:lrIn .3s var(--ease) both}
.lr-denk li i{width:30px;height:30px;border-radius:50%;background:var(--spelkleur);color:var(--spelinkt);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.82rem}
.lr-denk li.slot{background:var(--goed-bg);color:var(--ink)}
.lr-denk li.slot i{background:var(--goed);color:var(--kaart)}
@keyframes lrIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lr-hulp{margin-top:12px;background:var(--kaart-aan);border-radius:14px;padding:10px 14px;font-size:.92rem}
.lr-hulp .eyebrow{color:var(--nadruk)}
.lr-hulp ol{margin:6px 0 0;padding-left:20px}
.lr-hulp li+li{margin-top:3px}
.lr-hulp .tip{margin-top:6px;font-weight:600}
.lr-tik{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lr-tik button{border:1.5px solid var(--rand2);background:var(--kaart);color:var(--ink);border-radius:10px;padding:6px 10px;font-weight:600;min-height:44px;min-width:44px;font-size:.98rem}
.lr-tik button:hover:not(:disabled){border-color:var(--nadruk)}
.lr-tik button.goed{background:var(--goed-bg);border-color:var(--goed)}
.lr-tik button.mis{background:var(--fout-bg);border-color:var(--fout)}
.lr-tik button:disabled{cursor:default}
.lr-opdr{font-size:.9rem;color:var(--muted);margin-top:8px}
.lr-voort{display:flex;gap:6px;margin-top:12px}
.lr-voort i{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
.lr-voort i.goed{background:var(--goed);border-color:var(--goed)}
.lr-voort i.fout{background:var(--fout);border-color:var(--fout)}
.lr .opties{margin-top:14px}
.lr .opties button.optie{color:var(--ink)}
.lr-terug{margin-top:4px}
@media (max-width:879px){
  .lr-twee{grid-template-columns:1fr;gap:14px}
  .lr-twee>.lr-links{position:static;max-height:none}
}
body.groot .bl-body{font-size:1.25rem}
@media (prefers-reduced-motion:reduce){.lr-denk li{animation:none}}
/* Op het werkblad (.blad bestaat alleen op werkblad.html): in- en uitklappen kan op papier
   niet; een gemarkeerde zin krijgt een stippellijn, want een achtergrondkleur valt bij het printen weg */
.blad .bl-klap{display:none}
.blad .bl-z.wijs{background:none;box-shadow:none;border-bottom:1.5px dashed #14224C}
.blad .bl-verwijs{font-size:.9rem;color:#4a5270;border-left:3px solid #14224C;padding:2px 0 2px 10px}
</style>

<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script>
(function(){
  'use strict';
  var S = VAKSPEL.schoon, H = VAKSPEL.husselen;
  function $(id){ return document.getElementById(id); }
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }

  /* ============================================================================
     DE TEKSTEN
     T(niveau, soort, titel, alinea's, vragen). In een alinea staan merktekens:
     {v1:hij} is een verwijswoord, {a1:Daan} waar het naar verwijst, {w1:woord}
     een moeilijk woord. De vragen:
       L(vraag, kernwoorden, zin, opties, uitleg)   letterlijk: staat in de tekst
       A(vraag, zinnen, opties, uitleg)             afleiden: tussen de regels
       V(verwijswoord, bron, opties, uitleg)        verwijzen
       W(woord, opties, uitleg)                     woordbetekenis
       D(vraag, zinnen, opties, uitleg)             doel en mening
       F(zin, 'feit' of 'mening', uitleg)           feit of mening
     De eerste optie is goed; uitleg[0] zegt waarom, de rest waarom die optie
     niet klopt. Een zin is een stukje tekst uit precies een zin; meer zinnen
     scheid je met |. Die zinnen lichten op na het antwoord.
     ============================================================================ */
  var TEKSTEN = [];
  function T(niv, soort, titel, alineas, vragen){ TEKSTEN.push({ id:TEKSTEN.length, niv:niv, soort:soort, titel:titel, alineas:alineas, vragen:vragen }); }
  function L(vraag, k, z, o, u){ return { d:'l', vraag:vraag, k:k, z:z, o:o, u:u }; }
  function A(vraag, z, o, u){ return { d:'a', vraag:vraag, z:z, o:o, u:u }; }
  function D(vraag, z, o, u){ return { d:'d', vraag:vraag, z:z, o:o, u:u }; }
  function F(z, wat, u){ return { d:'d', f:wat, z:z, u:u }; }
  function V(w, a, o, u){ return { d:'v', w:w, a:a, o:o, u:u }; }
  function W(w, o, u){ return { d:'w', w:w, o:o, u:u }; }

  /* ===================== vmbo-bb: korte teksten, eenvoudige woorden ===================== */
  T("bb", "nieuws", "Speurhond vindt wandelaar", [
    "Een speurhond heeft zondag een man gevonden die verdwaald was in de bossen bij Ommen. De man van 71 was 's ochtends gaan wandelen. Om vijf uur was hij nog steeds niet thuis. Toen belde {a1:zijn vrouw} de politie, want {v1:ze} maakte zich zorgen.",
    "De politie kwam met hond Bobby. Bobby rook aan een sjaal van de man en ging meteen op zoek. Na een uur vond hij de man naast een omgevallen boom. De man was {w1:uitgeput}: hij had de hele dag gelopen en kon bijna niet meer staan.",
    "Een ambulance bracht de man naar het ziekenhuis. Hij mocht dezelfde avond weer naar huis. Bobby kreeg een extra koekje."
  ], [
    L("Hoe lang zocht Bobby voordat hij de man vond?", "Bobby|zocht", "Na een uur vond hij de man",
      ["een uur", "de hele dag", "tot vijf uur", "een avond"],
      ["In alinea 2 staat: ‘Na een uur vond hij de man.’ Zo lang zocht Bobby.", "De hele dag is hoe lang de man liep, niet hoe lang Bobby zocht.", "Om vijf uur was de man nog niet thuis. Toen begon het zoeken pas.", "Een avond staat niet in de tekst. Hij mocht ’s avonds naar huis, dat is iets anders."]),
    L("Waar vond Bobby de man?", "vond|Bobby", "naast een omgevallen boom",
      ["naast een omgevallen boom", "bij zijn huis", "in het ziekenhuis", "op een wandelpad"],
      ["In alinea 2 staat dat Bobby de man vond ‘naast een omgevallen boom’.", "Hij was juist níet thuis; daarom ging de politie zoeken.", "In het ziekenhuis kwam hij pas later, met de ambulance.", "Een wandelpad staat niet in de tekst. Dat verzin je erbij."]),
    V("v1", "a1", ["de vrouw van de man", "de politie", "de speurhond", "de man van 71"],
      ["‘Ze’ staat in dezelfde zin als ‘zijn vrouw’. Zijn vrouw belde de politie, want zíj maakte zich zorgen.", "De politie wordt gebeld. Zij maakt zich nog geen zorgen, de vrouw wel.", "De hond komt pas in alinea 2. ‘Ze’ wijst terug, niet vooruit.", "De man is ‘hij’, niet ‘ze’."]),
    W("w1", ["heel erg moe", "boos en verdrietig", "verdwaald", "gewond aan zijn been"],
      ["Na de dubbele punt staat de uitleg: hij had de hele dag gelopen en kon bijna niet meer staan. Dan ben je heel erg moe.", "Over boos of verdrietig staat niets in de zin.", "Hij wás verdwaald, maar dat betekent ‘uitgeput’ niet. Het woord gaat over hoe hij zich voelde.", "Er staat niets over een wond. Hij kon niet staan omdat hij zo lang had gelopen."])
  ]);

  T("bb", "uitleg", "Waarom spint een kat?", [
    "Bijna iedereen kent het geluid: een zacht gebrom dat diep uit de keel van een kat komt. Dat heet spinnen. Een kat spint vaak als hij op schoot ligt en geaaid wordt. Dan voelt hij zich veilig en tevreden.",
    "Maar katten spinnen niet alleen als ze blij zijn. Ze spinnen soms ook als ze pijn hebben of bang zijn, bijvoorbeeld bij de dierenarts. Wetenschappers denken dat spinnen een kat helpt om rustig te worden.",
    "Jonge katjes {a1:spinnen} al als ze een paar dagen oud zijn. Ze doen {v1:dat} als ze bij hun moeder drinken. Waarschijnlijk laten ze zo weten dat alles goed gaat."
  ], [
    L("Wanneer spinnen jonge katjes?", "katjes|jonge", "Ze doen dat als ze bij hun moeder drinken",
      ["als ze bij hun moeder drinken", "als ze bij de dierenarts zijn", "als ze op schoot liggen", "pas als ze een paar weken oud zijn"],
      ["In alinea 3 staat over jonge katjes: ‘Ze doen dat als ze bij hun moeder drinken.’", "De dierenarts staat in alinea 2, en die gaat over katten in het algemeen, niet over jonge katjes.", "Op schoot liggen staat in alinea 1, over katten in het algemeen.", "Er staat ‘een paar dagen’, niet ‘een paar weken’."]),
    V("v1", "a1", ["spinnen", "drinken bij hun moeder", "een paar dagen oud zijn", "bang zijn"],
      ["Lees de zin ervoor: ‘Jonge katjes spinnen al …’. ‘Ze doen dat’ betekent: ze spinnen.", "Het drinken staat in dezelfde zin, maar ‘dat’ wijst terug naar wat ze dóen als ze drinken.", "Oud zijn is niets wat je ‘doet’.", "Bang zijn staat in alinea 2 en gaat over grote katten."]),
    A("Je kat spint bij de dierenarts. Wat kun je daaruit afleiden?", "bijvoorbeeld bij de dierenarts|Wetenschappers denken",
      ["Je kat is misschien bang en probeert rustig te worden.", "Je kat vindt de dierenarts fijn.", "Je kat is heel erg ziek.", "Je kat heeft honger."],
      ["Alinea 2: katten spinnen ook als ze bang zijn, bijvoorbeeld bij de dierenarts, en spinnen helpt ze om rustig te worden.", "Dat denk je misschien, maar de tekst zegt juist dat spinnen niet altijd ‘blij’ betekent.", "Te sterk: er staat dat katten soms spinnen bij pijn, niet dat een spinnende kat heel ziek is.", "Over honger staat niets in de tekst."]),
    F("Jonge katjes spinnen al als ze een paar dagen oud zijn.", "feit", "Een feit: je kunt het nakijken, bijvoorbeeld door naar jonge katjes te kijken of het op te zoeken. Er staat geen woord in als ‘mooi’ of ‘ik vind’.")
  ]);

  T("bb", "verhaal", "De sleutel", [

  T("hv", "mening", "Je feed is een spiegel", [
    "Vorige week zocht ik een keer op hardloopschoenen. Sindsdien krijg ik op elke app advertenties voor sportkleding, filmpjes van marathonlopers en tips voor ‘de perfecte loophouding’. Mijn telefoon heeft besloten dat ik een hardloper ben. Ik heb nog nooit verder gerend dan naar de bus.",
    "Grappig, zou je zeggen. Maar het laat zien hoe sociale media werken. Een algoritme houdt bij waar je naar kijkt, hoe lang je bij een filmpje blijft hangen en wat je liket. Op basis daarvan krijg je meer van hetzelfde. Het doel is niet dat jij iets leert of een goede dag hebt. Het doel is dat je zo lang mogelijk blijft kijken, want dan zie je meer advertenties.",
    "Bij hardloopschoenen is dat onschuldig. Bij andere onderwerpen niet. Wie een paar keer kijkt naar filmpjes over afvallen, krijgt al snel bijna alleen nog filmpjes over diëten en dun zijn te zien. Wie boos is over een nieuwsbericht, krijgt steeds bozere berichten. {a1:Je beeld van de wereld wordt zo smaller, zonder dat je het merkt}. {v1:Dat} is het echte gevaar.",
    "Ik pleit er niet voor om je telefoon weg te gooien. Maar wees je ervan bewust dat je feed geen venster op de wereld is. Het is een spiegel van wat je al hebt bekeken.",
    "Sanne, 17 jaar"
  ], [
    L("Wat is volgens Sanne het doel van een algoritme?", "doel|algoritme", "Het doel is dat je zo lang mogelijk blijft kijken",
      ["dat je zo lang mogelijk blijft kijken", "dat je iets leert", "dat je een goede dag hebt", "dat je meer gaat sporten"],
      ["Alinea 2: ‘Het doel is dat je zo lang mogelijk blijft kijken, want dan zie je meer advertenties.’", "Dat staat er, maar met ‘niet’ ervoor: dat is juist níet het doel.", "Ook dit noemt ze als wat het doel níet is.", "Sporten is het voorbeeld van wat het algoritme dacht, niet het doel ervan."]),
    V("v1", "a1", ["dat je beeld van de wereld ongemerkt smaller wordt", "dat je advertenties voor hardloopschoenen krijgt", "dat je boos wordt over een nieuwsbericht", "dat je je telefoon weggooit"],
      ["‘Dat’ wijst naar de zin ervoor: je beeld van de wereld wordt smaller zonder dat je het merkt. Dat noemt ze het echte gevaar.", "Hardloopschoenen noemt ze juist ‘onschuldig’.", "Boos worden is een voorbeeld van hoe het werkt; het gevaar is wat er daarna met je beeld gebeurt.", "Dat raadt ze in de laatste alinea niet aan, en het staat na ‘Dat’."]),
    A("Wat bedoelt Sanne met ‘je feed is geen venster op de wereld’ maar ‘een spiegel’?", "Het is een spiegel van wat je al hebt bekeken.|Op basis daarvan krijg je meer van hetzelfde.",
      ["Je ziet vooral wat lijkt op wat je al bekeek, niet hoe de wereld echt is.", "Je ziet in je feed vooral hoe je er zelf uitziet.", "Je feed laat alles zien wat er in de wereld gebeurt.", "Je moet minder naar jezelf kijken op sociale media."],
      ["Door een venster zie je wat er buiten is; in een spiegel zie je jezelf terug. Je feed laat je dus vooral je eigen kijkgedrag terugzien, ‘meer van hetzelfde’.", "Te letterlijk: het gaat niet om je uiterlijk, maar om wat je eerder bekeek.", "Dat is precies wat ze ontkent: hij is géén venster op de wereld.", "Ze zegt niets over hoe vaak je naar jezelf kijkt; dat haal je te letterlijk uit het woord spiegel."]),
    D("Waarom begint Sanne met het verhaal over de hardloopschoenen?", "Mijn telefoon heeft besloten|Bij hardloopschoenen is dat onschuldig.",
      ["om met een herkenbaar, onschuldig voorbeeld te laten zien hoe een algoritme werkt", "om te vertellen dat ze wil gaan hardlopen", "om reclame te maken voor sportkleding", "om te bewijzen dat algoritmes altijd gevaarlijk zijn"],
      ["Het grappige voorbeeld maakt de werking meteen duidelijk. Daarna zegt ze: bij hardloopschoenen is het onschuldig, maar bij andere onderwerpen niet. Zo bouwt ze op naar haar punt.", "Ze zegt juist dat ze nooit verder rent dan naar de bus.", "Ze maakt geen reclame; ze ergert zich eerder aan de advertenties.", "Te breed: ze noemt dit voorbeeld zelf ‘onschuldig’. Het gevaar zit volgens haar bij andere onderwerpen."])
  ]);

  T("hv", "nieuws", "Kraaien vergeten geen gezicht", [
    "Wie een kraai lastigvalt, kan daar jaren later nog last van hebben. Dat blijkt uit een bekend onderzoek van biologen van de Universiteit van Washington in de Amerikaanse stad Seattle.",
    "De onderzoekers vingen een aantal kraaien om ze een ringetje om de poot te geven. Daarbij droegen ze een rubberen masker. De vogels werden daarna ongedeerd weer vrijgelaten. Toch onthielden ze het masker. Liep er later iemand met datzelfde masker over de campus, dan begonnen kraaien luid te krassen en dook een deel van hen op die persoon af. Iemand met een ander masker lieten ze met rust.",
    "Het opvallendste: ook kraaien die nooit gevangen waren, deden mee. Na een paar jaar was de groep die tegen het masker tekeerging zelfs groter dan in het begin. De vogels hadden het gevaar blijkbaar aan elkaar {w1:doorgegeven}, ook aan jonge kraaien die bij de vangst nog niet geboren waren.",
    "Volgens de onderzoekers is dat slim gedrag. Een kraai die onthoudt welke mensen gevaarlijk zijn, hoeft niet bij elke mens te vluchten. Hij kan rustig blijven zitten als er een onbekende langsloopt, en hoeft alleen op te letten bij wie hem ooit kwaad deed."
  ], [
    L("Waarom vingen de onderzoekers de kraaien?", "vingen|onderzoekers", "De onderzoekers vingen een aantal kraaien",
      ["om ze een ringetje om de poot te geven", "om te testen of ze maskers eng vonden", "om ze te laten wennen aan mensen", "om ze naar een andere stad te brengen"],
      ["Alinea 2: ze vingen de kraaien ‘om ze een ringetje om de poot te geven’.", "Dat de kraaien het masker onthielden, bleek pas later. Het staat er niet als reden voor het vangen.", "Wennen aan mensen staat er niet; de kraaien gingen mensen met het masker juist aanvallen.", "Ze werden weer vrijgelaten, op dezelfde plek."]),
    A("Wat kun je afleiden uit het feit dat ook kraaien die nooit gevangen waren gingen krassen?", "ook kraaien die nooit gevangen waren, deden mee",
      ["Kraaien leren van elkaar wie gevaarlijk is.", "Alle kraaien in Seattle waren ooit gevangen.", "Kraaien vinden alle maskers eng.", "Kraaien onthouden alleen maskers, geen gewone gezichten."],
      ["Deze kraaien hadden zelf niets meegemaakt. Ze moeten het dus van andere kraaien hebben geleerd. Dat staat ook in de zin erna: ze hadden het gevaar ‘aan elkaar doorgegeven’.", "Er staat juist dat deze kraaien nooit gevangen waren.", "Iemand met een ander masker lieten ze met rust.", "Te ver: het onderzoek gebruikte maskers, maar zegt niet dat kraaien gewone gezichten niet onthouden."]),
    W("w1", ["aan elkaar overgedragen, zodat anderen het ook wisten", "vergeten", "verstopt", "overdreven"],
      ["Kraaien die er niet bij waren, wisten het toch, zelfs jonge kraaien. Het gevaar ging dus van de ene kraai naar de andere: doorgeven.", "Vergeten past niet: de groep die krast wordt juist groter.", "Verstoppen zou betekenen dat andere kraaien het níet merkten.", "Overdrijven zegt iets over hoe hard ze krassen, niet over hoe anderen het leerden."]),
    D("Wat doet de schrijver in de laatste alinea?", "Volgens de onderzoekers is dat slim gedrag.",
      ["Hij legt uit waarom het gedrag van de kraaien slim is.", "Hij beschrijft een tweede onderzoek.", "Hij waarschuwt lezers om geen kraaien te vangen.", "Hij vat samen hoe het onderzoek is uitgevoerd."],
      ["De alinea begint met ‘Volgens de onderzoekers is dat slim gedrag’ en legt daarna uit waarom: een kraai hoeft niet voor iedereen te vluchten.", "Er komt geen nieuw onderzoek; het gaat nog steeds over hetzelfde.", "Er staat geen waarschuwing aan de lezer; de alinea legt het gedrag van de kraaien uit.", "Hoe het onderzoek ging, staat in alinea 2. De laatste alinea gaat over waarom het gedrag nuttig is."])
  ]);

  T("hv", "uitleg", "De kracht van een suikerpil", [
    "Een arts geeft een patiënt met hoofdpijn een pil. Een halfuur later is de pijn bijna weg. Wat de patiënt niet weet: in de pil zat alleen suiker. Toch werkte hij. Dit heet het placebo-effect.",
    "Het effect is geen {w1:verbeelding}. Als je verwacht dat een middel helpt, maakt je lichaam soms zelf stoffen aan die pijn dempen. Vooral bij klachten die je zelf voelt, zoals pijn, misselijkheid en vermoeidheid, kan een placebo een flink verschil maken. Bij een gebroken been of een infectie helpt een suikerpil natuurlijk niet.",
    "Opvallend is dat de verpakking ertoe doet. In onderzoeken werkten twee pillen beter dan een, en een dure pil beter dan een goedkope. Zelfs de kleur van een pil kan uitmaken hoe goed hij lijkt te werken.",
    "Voor onderzoekers is het placebo-effect een probleem. Wie {a1:een nieuw medicijn} test, wil weten of het middel zelf werkt, en niet alleen de verwachting van de patiënt. Daarom krijgt de ene groep proefpersonen het echte medicijn en de andere groep een nepmiddel. Niemand weet wie wat krijgt, ook de artsen niet. Pas als de groep met het echte medicijn duidelijk meer vooruitgaat, weten de onderzoekers dat {v1:het} echt werkt.",
    "Het omgekeerde bestaat ook: het nocebo-effect. Wie bang is voor bijwerkingen, krijgt ze vaker, zelfs van een suikerpil."
  ], [
    V("v1", "a1", ["het nieuwe medicijn", "de placebo", "de verwachting van de patiënt", "het onderzoek"],
      ["Onderzoekers willen weten of het nieuwe medicijn werkt. Als de groep met het echte medicijn meer vooruitgaat, weten ze dat ‘het’, het medicijn, echt werkt.", "De placebo is het nepmiddel waarmee het medicijn wordt vergeleken.", "De verwachting wil je er juist uit halen; die moet níet de oorzaak zijn.", "Het onderzoek ‘werkt’ niet; het test of iets werkt."]),
    A("Lisa vindt dat een duur merk pijnstillers beter helpt dan een goedkoop merk met precies dezelfde stof erin. Hoe verklaar je dat met de tekst?", "een dure pil beter dan een goedkope|Als je verwacht dat een middel helpt",
      ["Haar verwachting speelt mee: een dure pil lijkt beter te werken.", "In de dure pil zit meer werkzame stof.", "De goedkope pil is een placebo.", "Ze heeft last van het nocebo-effect."],
      ["De stof is hetzelfde, dus het verschil zit in haar verwachting. De tekst zegt dat dure pillen in onderzoek beter werkten dan goedkope.", "Er zit precies dezelfde stof in, staat in de vraag.", "De goedkope pil bevat gewoon de werkzame stof; het is geen nepmiddel.", "Het nocebo-effect gaat over bijwerkingen door angst, niet over welke pil beter helpt."]),
    W("w1", ["iets wat alleen in je hoofd bestaat en niet echt is", "een soort medicijn", "een bijwerking", "bedrog door de arts"],
      ["De zin erna laat zien dat er iets echts gebeurt: je lichaam maakt zelf stoffen aan. ‘Geen verbeelding’ betekent: het is niet alleen iets wat je denkt.", "Verbeelding is geen middel dat je inneemt.", "Bijwerkingen komen pas aan het eind van de tekst, bij het nocebo-effect.", "De arts geeft de pil wel, maar ‘verbeelding’ zegt iets over wat de patiënt ervaart."]),
    D("Waarom schrijft de schrijver dat een suikerpil niet helpt bij een gebroken been?", "Bij een gebroken been of een infectie",
      ["om duidelijk te maken dat het placebo-effect grenzen heeft", "om te waarschuwen voor gebroken benen", "om te bewijzen dat placebo’s nooit werken", "om uit te leggen hoe een infectie ontstaat"],
      ["Na alle voorbeelden van wat een placebo wél kan, laat de schrijver zien waar het ophoudt: bij klachten die je zelf voelt helpt het, bij een botbreuk niet.", "De lezer wordt nergens gewaarschuwd; het is een voorbeeld.", "Te breed: de tekst zegt juist dat placebo’s bij sommige klachten flink helpen.", "Hoe een infectie ontstaat, wordt nergens uitgelegd."])
  ]);

  T("hv", "verhaal", "De laatste trein", [
    "Om 23.48 uur stond Bram op het perron. De trein van 23.52 zou hem in twintig minuten thuisbrengen. Op het bord verscheen in rode letters een woord: Vervallen.",
    "Hij keek op zijn telefoon. Acht procent batterij. Hij scrolde naar ‘Mam’ en bleef met zijn duim boven haar naam hangen. Ze dacht dat hij bij Ruben was, twee straten verderop. Dat had hij haar die middag zelf verteld.",
    "Naast hem stond {a1:een oudere man} met een hond. ‘Ook gestrand?’ vroeg {v1:hij}. Bram knikte. ‘De volgende gaat pas om zes uur’, zei de man. ‘Ik bel mijn dochter, die komt me halen. Moet jij ook nog ver?’",
    "Bram dacht aan het feest dat hij net had verlaten, aan de muziek die nog in zijn oren gonsde, aan de geur van rook in zijn jas. Hij dacht aan het gezicht van zijn moeder als ze om middernacht de auto zou moeten pakken.",
    "‘Het gaat wel’, zei hij.",
    "De man keek hem even aan. Toen haalde hij een powerbank uit zijn tas. ‘Hier. Je telefoon ziet eruit alsof hij het niet lang meer volhoudt. En je moeder vast ook niet, als je niet belt.’",
    "Bram stak de stekker in zijn telefoon. Het batterijtje kleurde groen. Hij drukte op ‘Mam’."
  ], [
    L("Waar dacht de moeder van Bram dat hij was?", "moeder|dacht", "Ze dacht dat hij bij Ruben was",
      ["bij Ruben, twee straten verderop", "op een feest", "op het station", "bij de dochter van de man"],
      ["Alinea 2: ‘Ze dacht dat hij bij Ruben was, twee straten verderop.’", "Op het feest was hij echt, maar dat wist zijn moeder niet.", "Op het station staat hij nu; zijn moeder weet dat niet.", "De dochter van de man komt haar vader halen; met Bram heeft ze niets te maken."]),
    V("v1", "a1", ["de oudere man", "Bram", "de hond", "Ruben"],
      ["In dezelfde zin: ‘Naast hem stond een oudere man met een hond. ‘Ook gestrand?’ vroeg hij.’ De man stelt de vraag; Bram knikt.", "Bram antwoordt met een knik; hij stelt de vraag niet.", "Een hond vraagt niets.", "Ruben is niet op het station."]),
    A("Waarom aarzelt Bram om zijn moeder te bellen?", "Ze dacht dat hij bij Ruben was|aan de geur van rook in zijn jas",
      ["Dan komt uit dat hij niet bij Ruben was, maar op een feest.", "Zijn batterij is bijna leeg.", "Hij weet haar nummer niet meer.", "Hij wil eerst met de oudere man praten."],
      ["Hij heeft zijn moeder verteld dat hij bij Ruben was, twee straten verderop. Als ze hem midden in de nacht op een station moet ophalen, weet ze dat hij gelogen heeft. Dat staat er niet, maar het volgt uit alinea 2 en 4.", "Verleidelijk, want het staat er. Maar met acht procent kun je nog bellen; hij blijft juist met zijn duim boven haar naam hángen.", "Hij heeft haar naam al op het scherm.", "De man begint pas te praten nadat Bram al aarzelt."]),
    D("Waarom eindigt het verhaal met ‘Hij drukte op ‘Mam’’?", "Hij drukte op",
      ["om te laten zien dat Bram besluit eerlijk te zijn, zonder dat de schrijver het uitlegt", "om te laten zien dat de batterij weer vol is", "om te vertellen dat zijn moeder boos wordt", "om duidelijk te maken dat de man zijn opa is"],
      ["Het hele verhaal twijfelt Bram. Het korte slot laat zien dat hij de knoop doorhakt. De schrijver vertelt niet wat er daarna gebeurt; dat mag de lezer zelf invullen.", "De batterij kleurt groen, maar dat is niet waar het slot om draait.", "Wat zijn moeder zegt, staat er niet. Dat verzin je erbij.", "Niets wijst erop dat de man familie is."])
  ]);

  T("hv", "uitleg", "Een eilandje voor Manhattan", [
    "In de zeventiende eeuw was nootmuskaat in Europa bijna zo kostbaar als goud. De specerij groeide maar op een plek ter wereld: op de Banda-eilanden, een groepje kleine eilanden in het oosten van het huidige Indonesië. Wie de handel in nootmuskaat in handen had, kon schatrijk worden.",
    "De Verenigde Oost-Indische Compagnie (VOC) wilde dat {w1:monopolie} koste wat kost. In 1621 viel een vloot onder leiding van Jan Pieterszoon Coen de eilanden aan. Een groot deel van de bevolking werd gedood, verdreven of als slaaf weggevoerd. Van de ongeveer vijftienduizend Bandanezen bleef maar een klein deel over.",
    "Een eilandje, Run, was nog van de Engelsen. In 1667 sloten Nederland en Engeland de Vrede van Breda. Nederland hield Run. Engeland mocht een Nederlandse kolonie in Noord-Amerika houden die het al had veroverd: Nieuw-Amsterdam. De Engelsen noemden die stad New York.",
    "Achteraf lijkt dat een slechte ruil: een eilandje van een paar kilometer voor wat later Manhattan werd. Maar in 1667 dacht bijna niemand er zo over. Nootmuskaat bracht meteen veel geld op; Nieuw-Amsterdam was een klein handelsplaatsje.",
    "Tegenwoordig wordt Coen anders bekeken dan vroeger. Zijn standbeeld in Hoorn is omstreden: voor de een was hij een daadkrachtige bestuurder, voor de ander een massamoordenaar."
  ], [
    L("Waar groeide nootmuskaat in de zeventiende eeuw?", "nootmuskaat|groeide", "De specerij groeide maar op een plek ter wereld",
      ["alleen op de Banda-eilanden", "in heel Indonesië", "op Run en in Noord-Amerika", "in Europa"],
      ["Alinea 1: de specerij groeide ‘maar op een plek ter wereld: op de Banda-eilanden’.", "Te breed: de Banda-eilanden liggen in het huidige Indonesië, maar het groeide alleen op die eilanden.", "Run hoort bij de Banda-eilanden, maar in Noord-Amerika lag Nieuw-Amsterdam, geen nootmuskaat.", "In Europa was het juist kostbaar omdat het er niet groeide."]),
    A("Waarom wilde de VOC ook het eilandje Run hebben?", "Wie de handel in nootmuskaat in handen had|Een eilandje, Run, was nog van de Engelsen.",
      ["Zonder Run had de VOC de nootmuskaathandel niet helemaal in handen.", "Run lag dicht bij New York.", "Op Run woonden de meeste Bandanezen.", "De Engelsen wilden Run graag kwijt."],
      ["De VOC wilde een monopolie: als enige handelen. Zolang de Engelsen een van de eilanden hadden, kon er ook Engelse nootmuskaat op de markt komen. Dat zet je zelf naast elkaar.", "Run ligt in Azië, New York in Noord-Amerika.", "Over waar de Bandanezen woonden, staat dat niet.", "Er staat niet dat de Engelsen het kwijt wilden; het werd geregeld in een vredesverdrag."]),
    W("w1", ["het als enige in handen hebben van de handel", "een grote vloot", "een vredesverdrag", "een plantage"],
      ["De zin ervoor zegt: ‘Wie de handel in nootmuskaat in handen had, kon schatrijk worden.’ ‘Dat monopolie’ wijst daarnaar: de hele handel alleen in handen hebben.", "De vloot is het middel waarmee de VOC het probeerde te krijgen.", "Het vredesverdrag komt pas in 1667.", "Plantages horen erbij, maar ‘monopolie’ gaat over de handel."]),
    D("Hoe gaat de schrijver in de laatste alinea om met de meningen over Coen?", "voor de een was hij een daadkrachtige bestuurder",
      ["Hij noemt beide meningen zonder zelf te kiezen.", "Hij vindt Coen een daadkrachtige bestuurder.", "Hij vindt Coen een massamoordenaar.", "Hij vindt dat het standbeeld weg moet."],
      ["‘Voor de een … voor de ander …’: de schrijver geeft twee meningen van anderen en zegt niet wat hij zelf vindt.", "Dat is de mening van ‘de een’, niet per se van de schrijver.", "Dat is de mening van ‘de ander’. Wel beschrijft de schrijver eerder wat er gebeurde, maar hij oordeelt hier niet zelf.", "Over weghalen schrijft hij niets; hij zegt alleen dat het beeld omstreden is."])
  ]);

  T("hv", "mening", "Schaf de cijfers af", [
    "Een 5,4. Ik staarde naar het getal op mijn scherm en voelde me dom. Pas daarna las ik de opmerkingen die mijn docent bij mijn betoog had gezet. Ze waren nuttig: mijn argumenten waren sterk, maar de opbouw rammelde. Alleen wist ik de volgende ochtend nog precies welk cijfer ik had, en niets meer van die opmerkingen.",
    "Zo gaat het bij bijna iedereen. Een cijfer is een eindpunt. Het zegt hoe goed je iets kon, niet hoe je het beter kunt doen. Wie een 8 haalt, denkt: klaar. Wie een 4 haalt, denkt: ik kan het niet. In beide gevallen stopt het leren.",
    "Onderzoek laat zien dat leerlingen meer leren van {a1:opmerkingen} zonder cijfer dan van opmerkingen met een cijfer erbij. Zodra er een cijfer staat, kijken ze daar als eerste naar, en {v1:de rest} lezen ze nauwelijks.",
    "Daarom vind ik dat scholen in de onderbouw moeten stoppen met cijfers. Geef leerlingen in plaats daarvan concrete tips: wat ging goed, wat kan beter, en hoe. Natuurlijk moet er aan het eind van het jaar een besluit vallen over overgaan. Maar dat kan ook op basis van een portfolio en gesprekken.",
    "Tegenstanders zeggen dat leerlingen zonder cijfers niet meer hun best doen. Ik denk het {w1:tegendeel}. Wie snapt hoe hij beter wordt, wil dat ook."
  ], [
    V("v1", "a1", ["de opmerkingen van de docent", "de leerlingen", "de andere cijfers", "het onderzoek"],
      ["Leerlingen kijken eerst naar het cijfer. ‘De rest’ is wat er verder bij staat: de opmerkingen. Daar ging de hele zin over.", "De leerlingen zijn degenen die lezen (‘ze’), niet wat er gelezen wordt.", "Er staat een cijfer, niet meerdere.", "Het onderzoek lezen leerlingen niet bij hun toets."]),
    A("Wat bedoelt de schrijver met ‘Een cijfer is een eindpunt’?", "Een cijfer is een eindpunt.|In beide gevallen stopt het leren.",
      ["Met een cijfer lijkt het werk af, terwijl je juist moet leren hoe het beter kan.", "Een cijfer krijg je altijd aan het eind van het schooljaar.", "Een hoog cijfer betekent dat je niet meer hoeft te leren.", "Het laatste cijfer telt het zwaarst."],
      ["De zinnen erna leggen het uit: een cijfer zegt hoe goed je iets kon, niet hoe het beter kan, en daarna ‘stopt het leren’.", "Te letterlijk opgevat: het gaat niet over wanneer je het krijgt, maar over wat het met je leren doet.", "Dat is wat een leerling met een 8 dénkt, maar de schrijver vindt dat juist het probleem.", "Over hoe zwaar cijfers tellen, staat niets."]),
    W("w1", ["het omgekeerde", "hetzelfde", "niets", "een beetje"],
      ["Tegenstanders zeggen dat leerlingen dan níet hun best doen. De schrijver denkt dat ze dan juist wél hun best doen: het tegendeel.", "Dan zou hij het met de tegenstanders eens zijn, maar de zin erna zegt iets anders.", "Hij denkt wel iets: dat leerlingen beter willen worden.", "‘Een beetje’ past niet bij de stellige zin die volgt."]),
    D("Welke zin is het standpunt van de schrijver?", "Daarom vind ik dat scholen in de onderbouw moeten stoppen met cijfers.",
      ["Daarom vind ik dat scholen in de onderbouw moeten stoppen met cijfers.", "Een cijfer zegt hoe goed je iets kon, niet hoe je het beter kunt doen.", "Onderzoek laat zien dat leerlingen meer leren van opmerkingen zonder cijfer.", "Tegenstanders zeggen dat leerlingen zonder cijfers niet meer hun best doen."],
      ["Het standpunt is wat de schrijver vindt dat er moet gebeuren. Je herkent het aan ‘Daarom vind ik dat … moeten’. De rest van de tekst ondersteunt deze zin.", "Dit is een argument: het zegt waaróm cijfers volgens hem slecht werken.", "Dit is ook een argument, met onderzoek als steun.", "Dit is een tegenargument van anderen, dat hij daarna weerlegt."])
  ]);

  T("hv", "nieuws", "Nepstem van de directeur", [
    "Ouders van een middelbare school in Utrecht kregen vorige week een spraakbericht van de directeur. Daarin zei hij dat de school de volgende dag dicht zou zijn ‘vanwege een lekkage’. Alleen had de directeur het bericht nooit ingesproken.",
    "Het ging om een zogenoemde deepfake: een nepopname, gemaakt met kunstmatige intelligentie. Volgens de politie hebben twee leerlingen een toespraak van de directeur van de website van de school gehaald. Met een gratis programma maakten ze daarvan een stem die alles kon zeggen wat zij intypten. {a1:Het bericht} werd in een paar ouderapps gedeeld. Binnen een uur had {v1:het} honderden ouders bereikt.",
    "De school ontdekte het pas toen de telefoon roodgloeiend stond. ‘Ik schrok me rot’, zegt directeur Van Dam. ‘Het klonk precies als ik. Mijn eigen vrouw dacht dat ik het was.’",
    "De leerlingen zijn geschorst. Ze zeggen dat het als grap bedoeld was. Volgens een deskundige van de politie zien jongeren vaak niet hoe snel zoiets uit de hand loopt. ‘Een stem namaken was een paar jaar geleden nog heel lastig. Nu kan iedereen het in tien minuten.’",
    "De school stuurt ouders voortaan alleen nog berichten via het eigen ouderportaal. Wie een opvallend bericht krijgt, moet eerst de school bellen."
  ], [
    L("Hoe maakten de leerlingen de nepstem?", "maakten|nepstem", "Met een gratis programma maakten ze daarvan een stem",
      ["met een gratis programma en een toespraak van de website", "door de directeur op te bellen en op te nemen", "door zelf zijn stem na te doen", "met een programma van de politie"],
      ["Alinea 2: ze haalden een toespraak van de website en maakten daar ‘met een gratis programma’ een stem van.", "Opbellen staat niet in de tekst.", "Ze typten de tekst in; de computer maakte de stem.", "De politie onderzocht het, maar leverde geen programma."]),
    V("v1", "a1", ["het nepbericht", "het programma", "het ouderportaal", "het team van de school"],
      ["De zin ervoor: ‘Het bericht werd in een paar ouderapps gedeeld.’ Daarna had het bericht honderden ouders bereikt.", "Het programma maakte de stem, maar werd niet gedeeld.", "Het ouderportaal komt pas in de laatste alinea, als oplossing.", "Er staat geen team in de tekst."]),
    A("Waarom stuurt de school voortaan alleen nog berichten via het eigen ouderportaal?", "De school stuurt ouders voortaan alleen nog berichten",
      ["Dan weten ouders dat een bericht dat ergens anders binnenkomt, niet te vertrouwen is.", "Het ouderportaal is goedkoper.", "In het portaal kun je geen spraakberichten sturen.", "Omdat de leerlingen geschorst zijn."],
      ["Het nepbericht ging rond via ouderapps. Als echte berichten alleen nog via het portaal komen, herkennen ouders een nepbericht aan de plek waar het binnenkomt. Dat staat er niet letterlijk, maar het volgt eruit.", "Over kosten staat niets.", "Dat zou kunnen, maar de tekst noemt dat nergens. Het gaat om de plek, niet om de vorm.", "De schorsing is een straf. Die verklaart niet waarom de school haar berichten anders verstuurt."]),
    F("Ze zeggen dat het als grap bedoeld was.", "feit", "Een feit, al lijkt het op een mening. De zin meldt alleen dát de leerlingen dit zeggen, en dat kun je nagaan. Of het echt een grap was, is hun eigen uitleg; daarover oordeelt de zin niet.")

  T("hv", "uitleg", "Waarom een zebra strepen heeft", [
    "Over weinig dieren is zo lang gediscussieerd als over de zebra. Waarom heeft dit paardachtige dier zwart-witte strepen? Biologen hebben er de afgelopen honderdvijftig jaar talloze verklaringen voor bedacht.",
    "Een bekende verklaring was camouflage: in een kudde zouden de strepen door elkaar lopen, zodat een leeuw niet ziet waar de ene zebra ophoudt en de andere begint. Een andere was dat de strepen helpen om af te koelen. Beide ideeën bleken bij onderzoek weinig {w1:overtuigend}. Leeuwen jagen vooral in de schemering en ’s nachts, als ze de strepen nauwelijks kunnen zien. En bij metingen werden gestreepte en ongestreepte vachten in de zon ongeveer even warm.",
    "De sterkste verklaring komt uit een opvallend experiment in Engeland. Onderzoekers lieten paarden rondlopen met een gewone deken, en daarna met een zwart-wit gestreepte deken. Ze filmden de dazen: grote vliegen die bijten en bloed zuigen. Bij de gestreepte dekens vlogen de dazen wel in de buurt, maar ze landden veel minder vaak. Ze leken in de war te raken door de strepen en botsten er soms zelfs tegenop.",
    "Dat is belangrijk in Afrika. Dazen brengen daar ernstige ziektes over. Een dier dat minder gestoken wordt, heeft dus een grotere kans om gezond te blijven."
  ], [
    L("Wat deden de dazen bij de gestreepte dekens?", "dazen|gestreepte", "Bij de gestreepte dekens vlogen de dazen wel in de buurt",
      ["Ze vlogen in de buurt, maar landden veel minder vaak.", "Ze bleven helemaal weg.", "Ze staken juist vaker.", "Ze landden vooral op de witte strepen."],
      ["Alinea 3: ‘Bij de gestreepte dekens vlogen de dazen wel in de buurt, maar ze landden veel minder vaak.’", "Te sterk: ze kwamen wel in de buurt, ze landden alleen minder.", "Het omgekeerde staat er.", "Op welke kleur ze landden, staat er niet."]),
    A("Welke uitkomst zou de verklaring met de dazen tegenspreken?", "maar ze landden veel minder vaak",
      ["Dazen landen even vaak op gestreepte als op gewone dekens.", "Dazen vliegen vaak rond gestreepte dekens.", "Leeuwen jagen ook overdag.", "Zebra’s worden in de zon warm."],
      ["De verklaring rust op het verschil in landen. Als dat verschil er niet is, valt de verklaring weg.", "Dat klopt juist met het experiment: ze vlogen in de buurt, maar landden niet.", "Dat gaat over de camouflage-verklaring, niet over de dazen.", "Dat gaat over de verklaring van het afkoelen."]),
    W("w1", ["zo sterk dat je het gelooft", "bekend", "oud", "ingewikkeld"],
      ["De zinnen erna laten zien waarom de ideeën niet klopten: leeuwen zien de strepen nauwelijks en de vachten worden even warm. De ideeën waren dus niet sterk genoeg om te geloven.", "Bekend waren ze wel; de schrijver noemt camouflage zelfs ‘een bekende verklaring’.", "Oud waren ze misschien, maar daar gaat de zin niet over.", "Ingewikkeld waren ze niet; ze bleken niet te kloppen."]),
    D("Waarom eindigt de schrijver met de alinea over ziektes?", "Dazen brengen daar ernstige ziektes over.",
      ["om uit te leggen waarom minder steken voor een zebra echt een voordeel is", "om te waarschuwen voor reizen naar Afrika", "om een nieuwe, betere verklaring te geven", "om te laten zien dat het experiment mislukt is"],
      ["Na het experiment kun je denken: wat maakt een paar steken uit? De laatste alinea geeft het antwoord: dazen brengen ziektes over, dus minder steken betekent gezonder blijven.", "De lezer wordt niet gewaarschuwd; het gaat over zebra’s.", "Er komt geen nieuwe verklaring; deze alinea ondersteunt de verklaring met de dazen.", "Het experiment heet juist ‘de sterkste verklaring’."])
  ]);

  T("hv", "verhaal", "Het sollicitatiegesprek", [
    "De bedrijfsleider van de supermarkt had een stropdas om en een map op tafel. Lotte had haar beste trui aan, maar voelde zich toch te klein voor de stoel.",
    "‘Waarom wil je hier werken?’ vroeg hij.",
    "Lotte had het antwoord thuis drie keer geoefend voor de spiegel. ‘Omdat ik graag met mensen werk’, zei ze. Het klonk {w1:hol}, alsof iemand anders het zei.",
    "De man knikte en schreef iets op. Hij keek niet op.",
    "‘En eerlijk gezegd’, hoorde ze zichzelf zeggen, ‘omdat ik wil sparen. Mijn vader is zijn baan kwijt, en ik wil volgend jaar zelf mijn schoolreis naar Rome betalen.’",
    "Even was het stil. {a1:De pen} bleef in de lucht hangen. Lotte voelde haar wangen warm worden. Dat had ze niet moeten zeggen. Zoiets zei je toch niet bij een sollicitatie?",
    "De bedrijfsleider legde {v1:hem} neer en keek haar voor het eerst echt aan. ‘Weet je hoeveel mensen hier zeggen dat ze graag met mensen werken?’ vroeg hij. ‘Allemaal.’ Hij sloeg de map dicht. ‘Kun je zaterdag beginnen?’"

      ["De zin ervoor: ‘De pen bleef in de lucht hangen.’ Hij legt de pen neer. De map slaat hij pas daarna dicht.", "De map ligt al op tafel; die slaat hij dicht, niet neer.", "Een stropdas leg je niet neer tijdens een gesprek; hij heeft hem om.", "Een antwoord kun je niet neerleggen. En ‘het’ zou geen ‘hem’ worden."]),
    A("Waarom krijgt Lotte de baan waarschijnlijk?", "‘Allemaal.’|‘En eerlijk gezegd’",
      ["Haar eerlijke antwoord was echt, en niet hetzelfde als dat van iedereen.", "Omdat ze graag met mensen werkt.", "Omdat haar vader daar ook werkte.", "Omdat de bedrijfsleider medelijden met haar had."],
      ["Hij zegt dat iederéén ‘graag met mensen werken’ antwoordt. Pas bij haar eerlijke antwoord kijkt hij op. Dat antwoord viel dus op.", "Dat zegt iedereen, zegt hij juist. Dat antwoord maakte geen indruk.", "Haar vader is zijn baan kwijt; nergens staat waar hij werkte.", "Dat kan meespelen, maar de tekst wijst iets anders aan: hij vergelijkt haar antwoord met dat van ‘allemaal’."]),

      ["Het eind van de zin legt het uit: ‘alsof iemand anders het zei’. Het geoefende antwoord klonk niet als iets wat ze echt meende.", "Hoe hard ze praat, staat er niet.", "Zacht kan ze het ook gezegd hebben, maar de vergelijking gaat over echt of niet echt.", "Niemand lacht; het is eerder ongemakkelijk."]),
    D("Waarom schrijft de schrijver dat de man eerst ‘niet opkeek’ en later haar ‘voor het eerst echt’ aankeek?", "Hij keek niet op.|keek haar voor het eerst echt aan",
      ["om te laten zien dat haar eerlijke antwoord hem wel raakte", "om te laten zien dat de bedrijfsleider onbeleefd is", "om te vertellen dat hij slecht ziet", "om te laten zien dat Lotte iets fout deed"],
      ["Het verschil laat zien wat er verandert: bij het geoefende antwoord schrijft hij alleen iets op, bij het eerlijke antwoord heeft hij echte aandacht voor haar.", "Te snel geoordeeld: het gaat niet om zijn manieren, maar om wat er verandert.", "Over zijn ogen staat niets.", "Dat dénkt Lotte, maar de afloop laat het omgekeerde zien."])

  T("hv", "instructie", "Zo prik je door nepnieuws heen", [
    "Een filmpje van een overstroomde snelweg, een schokkende uitspraak van een politicus, een wondermiddel tegen puistjes: online zie je elke dag berichten die niet kloppen. Met vier vragen kom je er vaak al achter.",
    "Wie zegt het? Kijk wie het bericht heeft gemaakt. Een bekende nieuwsorganisatie heeft een naam te verliezen; een anoniem account niet. Klik door naar het profiel. Is het account pas een week oud en deelt het alleen boze berichten? Wees dan voorzichtig.",
    "Wat is de bron? Een goed bericht vertelt waar de informatie vandaan komt. Staat er alleen {a1:‘wetenschappers hebben ontdekt’, zonder dat je ziet welke wetenschappers}, dan is {v1:dat} een waarschuwingsteken.",
    "Klopt het beeld? Een foto kan echt zijn, maar uit een andere tijd of een ander land komen. Met een omgekeerde zoekopdracht naar afbeeldingen zie je waar een foto eerder is verschenen.",
    "Wie zeggen het nog meer? Groot nieuws wordt door meerdere media gebracht. Vind je het nergens anders, dan is de kans groot dat het niet klopt.",

  ], [
    L("Hoe kun je zien waar een foto eerder is verschenen?", "foto|verschenen", "Met een omgekeerde zoekopdracht",
      ["met een omgekeerde zoekopdracht naar afbeeldingen", "door naar het profiel van het account te klikken", "door te kijken of meerdere media het brengen", "door even te wachten voordat je deelt"],
      ["Alinea 4: ‘Met een omgekeerde zoekopdracht naar afbeeldingen zie je waar een foto eerder is verschenen.’", "Het profiel vertelt je wie het bericht maakte, niet waar de foto vandaan komt.", "Dat is de vierde vraag; die gaat over het nieuws, niet over de foto.", "Wachten is een tip over je gevoel."]),
    V("v1", "a1", ["een bericht dat geen duidelijke bron noemt", "een bekende nieuwsorganisatie", "een omgekeerde zoekopdracht", "een anoniem account"],

      ["Het klopt waarschijnlijk niet, dus je deelt het niet.", "Het klopt, want het maakt veel mensen boos.", "Het klopt waarschijnlijk, want nieuwe accounts zijn vaak het snelst.", "Je kunt er pas iets over zeggen als je de foto hebt gecontroleerd."],
      ["Drie waarschuwingstekens tegelijk: een nieuw account, nergens anders te vinden, en je wordt er boos van. Volgens de tekst is de kans dan groot dat het niet klopt, en moet je juist wachten met delen.", "Boosheid is volgens de tekst juist een reden om op te passen, geen bewijs.", "Dat staat nergens; de tekst noemt een nieuw account een reden om voorzichtig te zijn.", "Te streng: je hebt al genoeg tekens om voorzichtig te zijn. De tekst zegt niet dat je alle vier de vragen nodig hebt."]),
    D("Waarom begint de tekst met drie voorbeelden van berichten?", "Een filmpje van een overstroomde snelweg",

  T("hv", "nieuws", "Minder koppen bij de jeugd", [
    "Bij een voetbalclub in Nijmegen mogen spelers onder de twaalf jaar op de training niet meer koppen. De club volgt daarmee een voorbeeld uit Engeland, waar de voetbalbond in 2020 met een vergelijkbare regel kwam.",
    "Aanleiding is onderzoek naar oud-profvoetballers. Een groot Schots onderzoek uit 2019 vergeleek bijna achtduizend oud-profs met gewone mannen van dezelfde leeftijd. De oud-voetballers bleken ongeveer drieënhalf keer zo vaak te overlijden aan een hersenziekte, zoals dementie. Onderzoekers vermoeden dat de vele kopballen daarbij een rol spelen, maar dat is nog niet met zekerheid bewezen.",
    "Jeugdtrainer Rob Hendriks begrijpt de maatregel. ‘Bij kinderen zijn de hersenen nog in ontwikkeling. Je moet geen onnodige risico’s nemen.’ Toch vindt niet iedereen het een goed idee. Sommige ouders zijn bang dat hun kinderen later achterlopen. ‘Koppen is een techniek’, zegt een vader langs de lijn. ‘Als je die niet {w1:aanleert} als je jong bent, wordt het later lastig.’",
    "De club benadrukt dat koppen in wedstrijden gewoon mag. ‘We schrappen het alleen uit oefeningen waarbij spelers twintig keer achter elkaar een bal op hun hoofd krijgen’, zegt de voorzitter."
  ], [
    L("Hoeveel vaker overleden oud-profs aan een hersenziekte?", "vaker|oud-profs", "ongeveer drieënhalf keer zo vaak",
      ["ongeveer drieënhalf keer zo vaak", "twaalf keer zo vaak", "twintig keer zo vaak", "achtduizend keer zo vaak"],
      ["Alinea 2: ze overleden ‘ongeveer drieënhalf keer zo vaak’ aan een hersenziekte.", "Twaalf is de leeftijdsgrens bij de club.", "Twintig is het aantal kopballen in sommige oefeningen.", "Bijna achtduizend is het aantal oud-profs in het onderzoek."]),
    A("Wat zegt de tekst over de vraag of koppen dementie veroorzaakt?", "Onderzoekers vermoeden dat de vele kopballen",
      ["Dat wordt vermoed, maar het is nog niet zeker.", "Het is bewezen dat koppen dementie veroorzaakt.", "Koppen heeft er niets mee te maken.", "Alleen kinderen lopen risico door koppen."],
      ["Er staat ‘vermoeden’ en ‘nog niet met zekerheid bewezen’. Het onderzoek laat een verband zien, geen bewijs voor de oorzaak.", "Te sterk: dat is precies de conclusie die de tekst níet trekt.", "Ook te sterk, de andere kant op: onderzoekers denken juist dat het een rol speelt.", "Het onderzoek ging over oud-profs, dus volwassenen. Bij kinderen gaat het om voorzichtigheid."]),
    W("w1", ["leert en eigen maakt door te oefenen", "afleert", "aan anderen uitlegt", "overslaat"],

    F("Je moet geen onnodige risico’s nemen.", "mening", "Een mening: ‘je moet’ is een advies van de trainer, een oordeel over wat verstandig is. Anderen, zoals de vader, wegen dat anders. De zin ervoor, over de hersenen van kinderen, is wel een feit.")

  T("hv", "uitleg", "Waarom stampen niet werkt", [
    "De avond voor een toets nog even alles erin stampen: bijna iedere leerling heeft het gedaan. En het lijkt te werken. Je haalt een voldoende. Maar vraag je een week later naar dezelfde stof, dan is het meeste weg.",
    "Dat verschijnsel werd al in de negentiende eeuw beschreven door de Duitse psycholoog Hermann Ebbinghaus. Hij leerde zichzelf rijtjes onzinwoorden en testte hoeveel hij er na een tijd nog wist. {a1:Het vergeten} ging razendsnel: na een dag was hij al meer dan de helft kwijt. Maar {v1:het} ging steeds langzamer als hij de stof een paar keer herhaalde, met dagen ertussen.",
    "Tegenwoordig heet dat gespreid leren. Wie dezelfde tijd verdeelt over drie korte momenten, onthoudt veel meer dan wie alles in een keer doet. Het werkt nog beter als je jezelf overhoort in plaats van de stof alleen te herlezen. Herlezen voelt prettig, want alles komt je bekend voor. Maar dat gevoel is {w1:bedrieglijk}: herkennen is iets anders dan zelf kunnen ophalen.",
    "Voor de toets van volgende week betekent dat: begin vandaag met tien minuten, overhoor jezelf over twee dagen nog eens, en de avond van tevoren nog een keer. Het kost niet meer tijd. Het kost alleen een beetje planning."
  ], [
    V("v1", "a1", ["het vergeten", "het leren van de rijtjes", "de stof", "het herhalen"],
      ["De zin ervoor gaat over het vergeten, dat eerst razendsnel ging. Met ‘Maar’ volgt: het (vergeten) ging steeds langzamer als hij herhaalde.", "Leren gaat juist beter met herhalen; de zin zegt dat ‘het’ langzamer ging.", "De stof gaat niet langzamer; het wordt herhaald.", "Het herhalen is wat hij deed, en dat staat in dezelfde zin als iets anders: ‘als hij herhaalde’."]),
    A("Fleur leert een uur, de avond voor de toets. Sem leert drie keer twintig minuten en overhoort zichzelf. Wat voorspelt de tekst?", "Wie dezelfde tijd verdeelt over drie korte momenten|Het werkt nog beter als je jezelf overhoort",

      ["Sem doet beide dingen die volgens de tekst helpen: spreiden en zichzelf overhoren. Op lange termijn onthoudt hij veel meer.", "Te sterk: volgens alinea 1 haal je met stampen vaak wel een voldoende. Het probleem komt later.", "Het gaat juist om hoe je de tijd verdeelt, niet hoeveel.", "Vers helpt even, maar volgens Ebbinghaus is het meeste na een dag al weg."]),
    W("w1", ["misleidend: het lijkt beter dan het is", "prettig", "eerlijk", "vermoeiend"],

    D("Waarom schrijft de schrijver in de eerste alinea ‘En het lijkt te werken’?", "En het lijkt te werken.",
      ["om toe te geven wat lezers zelf merken, voordat hij laat zien waarom het toch niet werkt", "om stampen aan te raden", "om te laten zien dat toetsen te makkelijk zijn", "om Ebbinghaus aan te halen"],
      ["Lezers weten uit ervaring dat stampen een voldoende kan opleveren. De schrijver geeft dat eerst toe, en zet er met ‘Maar’ tegenover dat het meeste een week later weg is.", "De hele tekst raadt juist iets anders aan.", "Over de moeilijkheid van toetsen zegt hij niets.", "Ebbinghaus komt pas in alinea 2."])

  var DEEL = {

  /* ---------- een tekst in zinnen ---------- */
  function kaal(t){ return String(t).replace(/\{\w+:([^}]*)\}/g, '$1'); }
  function zinnenVan(p){
    var uit = [], begin = 0, re = /[.!?]+[’”]?\s+(?=[A-ZÀ-Ý‘“{(])/g, m;
    while ((m = re.exec(p))){ var eind = m.index + m[0].length; uit.push(p.slice(begin, eind).trim()); begin = eind; }
    uit.push(p.slice(begin).trim());
    return uit.filter(function(x){ return x; });
  }
  function bereid(t){
    if (t.zinnen) return t;

    t.alineas.forEach(function(p, ai){ zinnenVan(p).forEach(function(z){ t.zinnen.push(z); t.alinea.push(ai); }); });
    t.kaal = t.zinnen.map(kaal);
    return t;
  }
  /* de zinnen waar een stukje in staat; meer stukjes met | */
  function zoekZinnen(t, z){
    bereid(t); var uit = [];
    String(z || '').split('|').forEach(function(s){ s = s.trim(); if (!s) return; t.kaal.forEach(function(k, i){ if (k.indexOf(s) >= 0 && uit.indexOf(i) < 0) uit.push(i); }); });
    return uit.sort(function(a, b){ return a - b; });
  }
  function zinMet(t, merk){ bereid(t); for (var i = 0; i < t.zinnen.length; i++) if (t.zinnen[i].indexOf('{' + merk + ':') >= 0) return i; return -1; }
  function merkTekst(t, merk){ var m = new RegExp('\\{' + merk + ':([^}]*)\\}').exec(t.alineas.join(' ')); return m ? m[1] : ''; }

  function tekstHtml(t, opts){

        zin += (zin ? ' ' : '') + '<span class="bl-z" data-z="' + i + '">' + S(z).replace(/\{(\w+):([^}]*)\}/g, '<span class="bl-m" data-m="$1">$2</span>') + '</span>';

    (wat.bron || []).forEach(function(m){ Array.prototype.forEach.call(wortel.querySelectorAll('.bl-m[data-m="' + m + '"]'), function(e){ e.classList.add('bron'); }); });

  /* de zinnen waar het staat, als citaat onder de uitleg (op een telefoon staat de tekst uit beeld);
