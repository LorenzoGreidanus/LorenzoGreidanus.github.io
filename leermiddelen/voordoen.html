<style>
/* de voorgedane stappen: een lijstje met wat er gebeurt en waarom, de open stappen stippellijn */
.vd{width:100%;max-width:560px;margin:0 auto;text-align:left}
.vd-kop{margin:0 0 8px;text-align:center;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vd-fig{display:grid;place-items:center;margin:0 auto 12px}
.vd-fig svg{max-width:100%;height:auto;display:block;font-family:inherit}
.vd-tabel{overflow-x:auto;margin:0 auto 12px;display:grid;place-items:center}
.vd-st{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:vd}
.vd-st li{counter-increment:vd;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:14px;background:var(--kaart2);border:1px solid var(--rand);font-size:.95rem;line-height:1.4}
.vd-st li::before{content:counter(vd);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--spelkleur);color:var(--spelinkt);font-size:.85rem;font-weight:700}
.vd-st li.open{background:transparent;border:2px dashed var(--rand2)}
.vd-st li.open::before{background:transparent;border:2px dashed var(--rand2);color:var(--muted);width:22px;height:22px}
.vd-rek{display:block;margin-top:3px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--nadruk)}
.vd-st li.open .vd-rek{color:var(--muted);font-weight:600}
.vd-br{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .15em;font-size:.9em}
.vd-br>span:first-child{border-bottom:2px solid currentColor;padding:0 .25em}
.vd-br>span:last-child{padding:0 .25em}
.vd-vraagblok{display:block;margin-top:6px;font-size:1.5rem;font-weight:700;color:var(--nadruk)}
.vd-formule{display:inline-block;margin-top:6px;padding:6px 14px;border-radius:12px;background:var(--kaart2);border:1px solid var(--rand);font-weight:700;color:var(--nadruk)}
@media(max-width:480px){.vd-st li{font-size:.9rem;padding:9px 10px;gap:8px}.vd-vraagblok{font-size:1.3rem}}

<script>
(function(){
  'use strict';
  var S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function tussen(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function r2(x){ return Math.round(x * 100) / 100; }
  function net(x){ return String(r2(x)).replace('.', ','); }
  function eur(x){ var t = r2(x); return '€ ' + (t === Math.round(t) ? String(t) : t.toFixed(2).replace('.', ',')); }
  function term(a){ return (a === 1 ? '' : a) + 'x'; }
  function sg(p){ return p > 0 ? '+ ' + p : '− ' + (-p); }
  function frac(n, d){ return '<span class="vd-br"><span>' + n + '</span><span>' + d + '</span></span>'; }
  function oplos(l, r){ for (var x = -100; x <= 400; x++) if (Math.abs(l(x) - r(x)) < 1e-9) return x; return null; }
  function tweeDec(x){ return Math.abs(x * 100 - Math.round(x * 100)) < 1e-7; }

  /* een stap: wat je doet en waarom (wat), hoe het uitkomt (uit), wat je invult als je hem zelf doet (naam) */
  function stap(wat, uit, naam, antwoord, extra){
    var s = { wat:wat, uit:uit, naam:naam, antwoord:r2(antwoord) };
    if (extra) for (var k in extra) s[k] = extra[k];
    return s;
  }
  var EUR = { voor:'€' };

  /* ---------- van een som met stappen naar een opgave, met stappen die wegvallen ----------
     Positie 1 in een ronde: alles voorgedaan, je typt alleen het antwoord.
     Positie 2: de laatste stap is open, 3: de laatste twee, 4: de laatste drie,
     vanaf 5 vul je elke stap zelf in. */
  function uitvoer(o, pos){
    var n = o.stappen.length;
    var open = pos === 1 ? 0 : pos >= 5 ? n : Math.min(n, pos - 1);
    var gegeven = n - open, hint = pos >= 2 && pos <= 4;
    var kop = pos === 1 ? 'Eerst kijken: zo gaat het' : pos >= 5 ? 'Nu doe je alles zelf' : open >= n ? 'Jij doet alle stappen' : 'Jij doet de laatste ' + (open === 1 ? 'stap' : open + ' stappen');
    var opdracht = pos === 1 ? 'Lees elke stap: wat er gebeurt en waarom. Typ dan zelf het antwoord in het vakje.'
      : pos >= 5 ? 'Nu doe je alles zelf. Typ de uitkomst van elke stap, van boven naar beneden.'
      : open >= n ? 'Er staat geen stap meer voor je klaar, maar de stappen hieronder laten zien wat je moet doen. Vul de uitkomst van elke stap in.'
      : 'De stappen die er staan laten zien hoe het gaat. ' + (open === 1 ? 'De laatste stap vul je hieronder zelf in.' : 'De laatste ' + open + ' stappen vul je hieronder zelf in.');
    var lijst = '';
    if (pos < 5){
      lijst = '<ol class="vd-st">' + o.stappen.map(function(s, i){
        if (i < gegeven) return '<li><div><b>' + s.wat + '</b><span class="vd-rek">' + s.uit + '</span></div></li>';
        return hint ? '<li class="open"><div><b>' + s.wat + '</b><span class="vd-rek">hieronder invullen</span></div></li>' : '';
      }).join('') + '</ol>';
    }
    var beeld = (typeof o.beeld === 'function' ? o.beeld(gegeven) : (o.beeld || ''));
    var velden = pos === 1
      ? [{ label:'Antwoord: ' + o.antwoordLabel, antwoord:o.antwoord, tol:0.006, eenheid:o.eenheid, voor:o.voor }]
      : o.stappen.slice(gegeven).map(function(s, i){ return { label:'Stap ' + (gegeven + i + 1) + ': ' + s.naam, antwoord:s.antwoord, tol:0.006, eenheid:s.eenheid, voor:s.voor }; });
    var uitleg = 'Zo gaat het: <br>' + o.stappen.map(function(s, i){ return 'Stap ' + (i + 1) + ': ' + s.wat + ' ' + s.uit + '.'; }).join(' <br>') + (o.fout ? ' <br>Let op: ' + o.fout : '');
    return {
      onderdeel:'voordoen: ' + o.deel, onderdeelNaam:o.deel, vorm:'invul', sleutel:o.sleutel,
      vraag:o.vraag, opdracht:opdracht,
      beeld:'<div class="vd"><p class="vd-kop">' + kop + '</p>' + beeld + lijst + '</div>',
      velden:velden, uitleg:uitleg,
      antwoordTekst:o.antwoordTekst || (o.antwoordLabel.replace(/\s*=$/, '') + ': ' + (o.voor ? o.voor + ' ' : '') + net(o.antwoord) + (o.eenheid ? ' ' + o.eenheid : ''))
    };
  }
  /* de rest van de zin: wat het antwoord van de hele som is, voor de eerste opgave en de uitslag */
  function klaarMaken(o){
    var l = o.stappen[o.stappen.length - 1];
    if (o.antwoordLabel === undefined){ o.antwoordLabel = l.naam; o.antwoord = l.antwoord; o.eenheid = l.eenheid; o.voor = l.voor; }
    return o;
  }

  /* ================= vergelijking ================= */
  var STUKS = [['broodjes', 'broodje'], ['pennen', 'pen'], ['stickervellen', 'stickervel'], ['kaartjes', 'kaartje'], ['bananen', 'banaan'], ['schriften', 'schrift']];
  var EXTRA = ['tas', 'pot pindakaas', 'drankje', 'map', 'pak sap'];
  function bbSom(s){ return function(){
    var a = tussen(2, 12), x = s > 0 ? tussen(2, 15) : tussen(a + 1, a + 12), b = s > 0 ? x + a : x - a;
    var eq = 'x ' + (s > 0 ? '+' : '−') + ' ' + a + ' = ' + b;
    return klaarMaken({ deel:'vergelijking', sleutel:'vgl-bbsom' + s + '-' + a + '-' + x,
      vraag:'Los op met de balansmethode: <span class="vd-vraagblok">' + eq + '</span>',
      stappen:[
        stap(s > 0 ? 'Haal aan beide kanten ' + a + ' weg. Dan blijft links alleen x over.' : 'Tel aan beide kanten ' + a + ' erbij op. Dan blijft links alleen x over.',
          s > 0 ? b + ' − ' + a + ' = ' + x : b + ' + ' + a + ' = ' + x, s > 0 ? 'Rechterkant na het wegen =' : 'Rechterkant na het optellen =', x),
        stap('Links staat nu alleen x. Dat is je antwoord.', 'x = ' + x, 'x =', x),
        stap('Controleer: vul je x in. Links moet hetzelfde uitkomen als rechts.', x + (s > 0 ? ' + ' : ' − ') + a + ' = ' + b, 'Controle: links met jouw x =', b)
      ], antwoordLabel:'x =', antwoord:x,
      fout: s > 0 ? 'bij x + ' + a + ' = ' + b + ' doe je het tegenovergestelde van wat er staat. Er staat plus, dus je haalt eraf: ' + b + ' − ' + a + ', niet ' + b + ' + ' + a + '.'
        : 'bij x − ' + a + ' = ' + b + ' doe je het tegenovergestelde van wat er staat. Er staat min, dus je telt erbij op: ' + b + ' + ' + a + ', niet ' + b + ' − ' + a + '.',
      _ok: oplos(function(v){ return s > 0 ? v + a : v - a; }, function(){ return b; }) === x });
  }; }
  function bbKeer(){
    var a = tussen(2, 9), x = tussen(2, 12), c = a * x, ding = kies(STUKS), verhaal = Math.random() < .5;
    return klaarMaken({ deel:'vergelijking', sleutel:'vgl-bbkeer' + a + '-' + x + (verhaal ? 'v' : ''),
      vraag: verhaal ? a + ' ' + ding[0] + ' kosten samen € ' + c + '. Noem de prijs van één ' + ding[1] + ' x (in euro). Dan geldt <span class="vd-vraagblok">' + a + 'x = ' + c + '</span>Los op: wat kost één ' + ding[1] + '?'
        : 'Los op met de balansmethode: <span class="vd-vraagblok">' + a + 'x = ' + c + '</span>',
      stappen:[
        stap('Deel beide kanten door ' + a + '. Links staat ' + a + ' keer x, dus dan houd je x over.', c + ' ÷ ' + a + ' = ' + x, 'Rechterkant na het delen =', x),
        stap('Links staat nu alleen x. Dat is je antwoord.', 'x = ' + x, 'x =', x),
        stap('Controleer: vul je x in. Links moet hetzelfde uitkomen als rechts.', a + ' × ' + x + ' = ' + c, 'Controle: links met jouw x =', c)
      ], antwoordLabel:'x =', antwoord:x,
      fout:a + 'x betekent ' + a + ' keer x. Je deelt dus door ' + a + '. Je haalt er niet ' + a + ' af: ' + c + ' − ' + a + ' = ' + (c - a) + ' is niet x.',
      _ok: oplos(function(v){ return a * v; }, function(){ return c; }) === x });
  }
  function kgtTweestap(s){ return function(){
    var a = tussen(2, 9), x = tussen(2, 12), b = tussen(1, 15), c = a * x + s * b;
    while (c < 1){ x += 2; c = a * x + s * b; }
    var verhaal = s > 0 && Math.random() < .5, ding = kies(STUKS), extra = kies(EXTRA);
    var eq = a + 'x ' + (s > 0 ? '+' : '−') + ' ' + b + ' = ' + c;
    return klaarMaken({ deel:'vergelijking', sleutel:'vgl-kgt2' + s + '-' + a + '-' + x + '-' + b + (verhaal ? 'v' : ''),
      vraag: verhaal ? 'Je koopt ' + a + ' ' + ding[0] + ' en een ' + extra + ' van € ' + b + '. Samen betaal je € ' + c + '. Noem de prijs van één ' + ding[1] + ' x (in euro). Dan geldt <span class="vd-vraagblok">' + eq + '</span>Los op: wat kost één ' + ding[1] + '?'
        : 'Los op met de balansmethode: <span class="vd-vraagblok">' + eq + '</span>',
      stappen:[
        stap(s > 0 ? 'Haal aan beide kanten ' + b + ' weg, zodat links alleen ' + a + 'x overblijft.' : 'Tel aan beide kanten ' + b + ' erbij op, zodat links alleen ' + a + 'x overblijft.',
          s > 0 ? c + ' − ' + b + ' = ' + a * x : c + ' + ' + b + ' = ' + a * x, 'Rechterkant na stap 1 =', a * x),
        stap('Deel beide kanten door ' + a + '. Links houd je x over.', a * x + ' ÷ ' + a + ' = ' + x, 'x =', x),
        stap('Controleer: vul je x in. Links moet hetzelfde uitkomen als rechts.', a + ' × ' + x + (s > 0 ? ' + ' : ' − ') + b + ' = ' + c, 'Controle: links met jouw x =', c)
      ], antwoordLabel:'x =', antwoord:x,
      fout:'let op de volgorde: eerst het losse getal ' + b + ' wegwerken, dan pas delen door ' + a + '. Deel je ' + c + ' meteen door ' + a + ', dan vergeet je dat ' + b + ' er ook nog bij hoort.',
      _ok: oplos(function(v){ return a * v + s * b; }, function(){ return c; }) === x });
  }; }
  function kgtBeide(){
    var d, c, a, x, p, q, t = 0;
    do { c = tussen(1, 5); d = tussen(2, 5); a = c + d; x = tussen(2, 10); p = (Math.random() < .5 ? -1 : 1) * tussen(1, 12); q = d * x + p; } while (q < 1 && t++ < 50);
    var eq = term(a) + ' ' + sg(p) + ' = ' + term(c) + ' + ' + q;
    return klaarMaken({ deel:'vergelijking', sleutel:'vgl-kgtb' + a + '-' + c + '-' + p + '-' + x,
      vraag:'Los op met de balansmethode: <span class="vd-vraagblok">' + eq + '</span>',
      stappen:[
        stap('Haal aan beide kanten ' + term(c) + ' weg, zodat de x-en maar aan één kant staan.', term(a) + ' − ' + term(c) + ' = ' + term(d) + '. Nu staat er ' + term(d) + ' ' + sg(p) + ' = ' + q, 'Aantal x-en links na stap 1 =', d, { eenheid:'x' }),
        stap(p > 0 ? 'Haal aan beide kanten ' + p + ' weg, zodat links alleen ' + term(d) + ' overblijft.' : 'Tel aan beide kanten ' + (-p) + ' erbij op, zodat links alleen ' + term(d) + ' overblijft.',
          p > 0 ? q + ' − ' + p + ' = ' + (q - p) : q + ' + ' + (-p) + ' = ' + (q - p), 'Rechterkant na stap 2 =', q - p),
        stap('Deel beide kanten door ' + d + '. Links houd je x over.', (q - p) + ' ÷ ' + d + ' = ' + x, 'x =', x),
        stap('Controleer met allebei de kanten van de oorspronkelijke vergelijking. Ze moeten gelijk zijn.', 'links: ' + a + ' × ' + x + ' ' + sg(p) + ' = ' + (a * x + p) + ' en rechts: ' + c + ' × ' + x + ' + ' + q + ' = ' + (c * x + q), 'Controle: de rechterkant met jouw x =', c * x + q)
      ], antwoordLabel:'x =', antwoord:x,
      fout:'haal de x-en naar één kant door ' + term(c) + ' weg te halen, niet alleen ' + c + '. Dus ' + term(a) + ' − ' + term(c) + ' = ' + term(d) + ', en niet ' + term(a) + ' − ' + c + '.',
      _ok: oplos(function(v){ return a * v + p; }, function(v){ return c * v + q; }) === x });
  }
  function hvHaak(s){ return function(){
    var a = tussen(2, 6), b = tussen(1, 8), x = tussen(s > 0 ? 2 : b + 1, 12), c = a * (x + s * b), ab = a * b, o = s > 0 ? '+' : '−';
    return klaarMaken({ deel:'vergelijking', sleutel:'vgl-hvh' + s + '-' + a + '-' + b + '-' + x,
      vraag:'Los op met de balansmethode: <span class="vd-vraagblok">' + a + '(x ' + o + ' ' + b + ') = ' + c + '</span>',
      stappen:[
        stap('Werk eerst de haakjes weg: ' + a + ' keer x én ' + a + ' keer ' + b + '. Dan staat er ' + a + 'x ' + o + ' ' + ab + ' = ' + c + '.', a + ' × ' + b + ' = ' + ab, 'Haakjes weg: het losse getal wordt =', ab),
        stap(s > 0 ? 'Haal aan beide kanten ' + ab + ' weg, zodat links alleen ' + a + 'x overblijft.' : 'Tel aan beide kanten ' + ab + ' erbij op, zodat links alleen ' + a + 'x overblijft.',
          s > 0 ? c + ' − ' + ab + ' = ' + a * x : c + ' + ' + ab + ' = ' + a * x, 'Rechterkant na stap 2 =', a * x),
        stap('Deel beide kanten door ' + a + '. Links houd je x over.', a * x + ' ÷ ' + a + ' = ' + x, 'x =', x),
        stap('Controleer in de oorspronkelijke vergelijking, met haakjes.', a + ' × (' + x + ' ' + o + ' ' + b + ') = ' + a + ' × ' + (x + s * b) + ' = ' + c, 'Controle: links met jouw x =', c)
      ], antwoordLabel:'x =', antwoord:x,
      fout:'bij ' + a + '(x ' + o + ' ' + b + ') vermenigvuldig je ' + a + ' met alles tussen de haakjes: ' + a + 'x ' + o + ' ' + ab + '. Niet ' + a + 'x ' + o + ' ' + b + '.',
      _ok: oplos(function(v){ return a * (v + s * b); }, function(){ return c; }) === x });
  }; }
  function hvBreuk(s){ return function(){
    var k = tussen(2, 6), m = tussen(2, 9), b = tussen(1, 9), x = m * k, c = m + s * b, o = s > 0 ? '+' : '−';
    if (c < 1){ m += b; x = m * k; c = m + s * b; }
    return klaarMaken({ deel:'vergelijking', sleutel:'vgl-hvb' + s + '-' + k + '-' + m + '-' + b,
      vraag:'Los op met de balansmethode: <span class="vd-vraagblok">' + frac('x', k) + ' ' + o + ' ' + b + ' = ' + c + '</span>',
      stappen:[
        stap(s > 0 ? 'Haal aan beide kanten ' + b + ' weg, zodat links alleen x gedeeld door ' + k + ' overblijft.' : 'Tel aan beide kanten ' + b + ' erbij op, zodat links alleen x gedeeld door ' + k + ' overblijft.',
          s > 0 ? c + ' − ' + b + ' = ' + m : c + ' + ' + b + ' = ' + m, 'Rechterkant na stap 1 =', m),
        stap('Vermenigvuldig beide kanten met ' + k + '. Dat maakt "gedeeld door ' + k + '" ongedaan.', m + ' × ' + k + ' = ' + x, 'x =', x),
        stap('Controleer: vul je x in. Links moet hetzelfde uitkomen als rechts.', x + ' ÷ ' + k + ' ' + o + ' ' + b + ' = ' + m + ' ' + o + ' ' + b + ' = ' + c, 'Controle: links met jouw x =', c)
      ], antwoordLabel:'x =', antwoord:x,
      fout:'x gedeeld door ' + k + ' maak je ongedaan door met ' + k + ' te vermenigvuldigen, niet door nog een keer te delen.',
      _ok: oplos(function(v){ return v / k + s * b; }, function(){ return c; }) === x });
  }; }
  function hvBreuk2(){
    var k = tussen(2, 6), c = tussen(2, 9), b = tussen(1, 9), x = c * k - b;
    return klaarMaken({ deel:'vergelijking', sleutel:'vgl-hvb2' + k + '-' + c + '-' + b,
      vraag:'Los op met de balansmethode: <span class="vd-vraagblok">' + frac('x + ' + b, k) + ' = ' + c + '</span>',
      stappen:[
        stap('Vermenigvuldig beide kanten met ' + k + '. Dan verdwijnt de breuk en blijft x + ' + b + ' over.', c + ' × ' + k + ' = ' + c * k, 'Rechterkant na vermenigvuldigen =', c * k),
        stap('Haal aan beide kanten ' + b + ' weg, zodat links alleen x overblijft.', c * k + ' − ' + b + ' = ' + x, 'x =', x),
        stap('Controleer: vul je x in. Links moet hetzelfde uitkomen als rechts.', '(' + x + ' + ' + b + ') ÷ ' + k + ' = ' + (x + b) + ' ÷ ' + k + ' = ' + c, 'Controle: links met jouw x =', c)
      ], antwoordLabel:'x =', antwoord:x,
      fout:'je deelt x + ' + b + ' samen door ' + k + '. Je maakt dat ongedaan door beide kanten met ' + k + ' te vermenigvuldigen, dus x + ' + b + ' = ' + c * k + '. Het getal ' + b + ' blijft zoals het is.',
      _ok: oplos(function(v){ return (v + b) / k; }, function(){ return c; }) === x });
  }

    do { dd = tussen(2, 6); t++; } while ((dd * h) % 2 && t < 50);
    var B = c0 + dd, f = { punten:[[0, 0], [c0, 0], [B, h], [0, h]], delen:[{ punten:rect(0, 0, c0, h), naam:'A', kl:KA }, { punten:[[c0, 0], [B, h], [c0, h]], naam:'B', kl:KB }], lijnen:[[[c0, 0], [c0, h]]], labels:[] };
    f.labels = [lab(f.punten[0], f.punten[1], c0, e), lab(f.punten[2], f.punten[3], B, e), lab(f.punten[3], f.punten[0], h, e)];
    var R = c0 * h, D = dd * h / 2, T = R + D;
    return oppOpgave(c, f, [
      stap('De onderkant is langer dan de bovenkant. Het verschil is de basis van de driehoek (B).', B + ' − ' + c0 + ' = ' + dd, 'Basis van de driehoek =', dd, { eenheid:e }),
      stap('Reken de rechthoek (A) uit: lengte keer breedte.', c0 + ' × ' + h + ' = ' + R + ' ' + u, 'Oppervlakte van A =', R, { eenheid:u }),
      stap('B is een driehoek: de helft van een rechthoek van ' + dd + ' bij ' + h + '. Dus halve basis keer hoogte.', '½ × ' + dd + ' × ' + h + ' = ' + D + ' ' + u, 'Oppervlakte van B =', D, { eenheid:u }),
      stap('Tel A en B bij elkaar op.', R + ' + ' + D + ' = ' + T + ' ' + u, 'Totale oppervlakte =', T, { eenheid:u })
    ], 'de basis van de driehoek is niet de hele onderkant (' + B + '), maar alleen het stuk dat langer is dan de bovenkant: ' + dd + '. En de driehoek is de helft van een rechthoek.', T, 'opp-t' + c0 + '-' + dd + '-' + h + c.t);
  }

  /* ---------- welke varianten bij welk niveau ---------- */
  var SOORTEN = {
    vergelijking:{ bb:[bbSom(1), bbSom(-1), bbKeer], kgt:[kgtTweestap(1), kgtTweestap(-1), kgtBeide], hv:[hvHaak(1), hvHaak(-1), hvBreuk(1), hvBreuk(-1), hvBreuk2, hvHaakBeide] },
    procent:{ bb:[bbKorting, bbBtw], kgt:[kgtKorting, kgtBtw, kgtToename], hv:[hvTerug, hvBtwTerug, hvTwee] },
    formule:{ bb:[tabelVraag('bb'), invulVraag('bb'), terugVraag('bb')], kgt:[tabelVraag('kgt'), invulVraag('kgt'), terugVraag('kgt'), gemVraag], hv:[hvGelijk, hvMeer, hvKortingTerug] },
    oppervlakte:{ bb:[lVorm(true)], kgt:[lVorm(false), aftrek], hv:[uVorm, huis, trapezium] }
  };
  var LIJST = ['vergelijking', 'procent', 'formule', 'oppervlakte'];
  /* in een ronde blijft de soort som (en de variant) gelijk: de stappen die wegvallen moeten dezelfde zijn */
  var ronde = { alles:null, var:{}, begin:0, niv:null }, laatste = {}, laatsteAlles = null;
  function maakOpgave(keuze, nr){
    var niv = keuze.niveau || 'kgt';
    if (nr === 1 || !ronde.begin) ronde = { alles:null, var:{}, begin:nr, niv:niv };
    /* het niveau groeit mee (of zakt): dan begint de som opnieuw met een voorbeeld, want het is een nieuwe soort */
    else if (ronde.niv !== niv){ ronde.niv = niv; ronde.begin = nr; ronde.var = {}; }
    var pos = ((nr - ronde.begin) % 10) + 1;
    if (pos === 1 && nr > ronde.begin) ronde = { alles:null, var:{}, begin:ronde.begin, niv:niv };
    var soort = keuze.soort;
    if (soort === 'alles'){
      if (!ronde.alles){ ronde.alles = kies(LIJST.filter(function(s){ return s !== laatsteAlles; })); laatsteAlles = ronde.alles; }
      soort = ronde.alles;
    }
    var lijst = SOORTEN[soort][niv], sl = soort + '|' + niv;
    if (ronde.var[sl] === undefined){
      var kand = lijst.map(function(f, i){ return i; }).filter(function(i){ return lijst.length < 2 || i !== laatste[sl]; });
      ronde.var[sl] = kies(kand); laatste[sl] = ronde.var[sl];
    }
    var gen = lijst[ronde.var[sl]], o, t = 0;
    do { o = gen(); } while (!o._ok && ++t < 30);
    var u = uitvoer(o, pos);
    u._ok = o._ok;
    return u;
  }
