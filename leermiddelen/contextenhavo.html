<style>
/* De bron, de bewering en de omschrijving lezen hun kleuren uit de tokens die ook op het werkblad bestaan
   (--kaart2, --ink, --muted), zodat de donkere stand meekantelt en het op wit papier leesbaar blijft. */
.hc-vak{max-width:62ch;width:100%;text-align:left;background:var(--kaart2);border-left:4px solid var(--ink);border-radius:0 14px 14px 0;padding:12px 18px 12px 16px;font-size:1.02rem;line-height:1.6}
.hc-vak p{margin:0}
.hc-kop{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 6px !important}
.hc-bron blockquote{margin:0;font-size:1.02rem;line-height:1.6}
.hc-bij{margin:8px 0 0 !important;font-size:.86rem;line-height:1.45;color:var(--muted)}
.hc-bij b{color:var(--ink);font-weight:600}
body.groot .hc-vak{font-size:1.25rem}
/* op volgorde: elke gebeurtenis een eigen rij, anders staan lange zinnen in smalle kolommen */
body.hc-volg .vakken.rij{grid-template-columns:1fr}
body.hc-volg .vakken.rij .sleepdoel{flex-direction:row;align-items:center;min-height:58px;gap:10px}
body.hc-volg .vakken.rij .doelknop{width:auto;flex:none}
body.hc-volg .vakken.rij .sleepdoel .inhoud{justify-content:flex-start;flex:1;min-height:32px}
body.hc-volg .sleepkaart,body.hc-lijst .sleepkaart{text-align:left;font-weight:500;font-size:.92rem;display:flex}
body.hc-volg .kaartjes,body.hc-lijst .kaartjes{flex-direction:column;align-items:stretch}
/* koppelen: een vak per gevolg of kenmerkend aspect, onder elkaar, met de tekst links */
body.hc-lijst .vakken,body.hc-lijst .vakken.rij{grid-template-columns:1fr}
body.hc-lijst .sleepdoel{min-height:0}
body.hc-lijst .doelknop{place-items:start;padding-left:22px}
body.hc-lijst .doelknop b{text-align:left;font-weight:600}
body.hc-lijst .sleepdoel .inhoud{justify-content:flex-start}
@media(max-width:560px){.hc-vak{font-size:.97rem;padding:11px 14px}}

<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function cap(t){ t = String(t); return t.charAt(0).toUpperCase() + t.slice(1); }
  function vwo(niv){ return niv === 'vwo'; }
  /* uit een lijst met niveau-labels: op havo alleen 'hv', op vwo alles, met voorrang (kans p) voor de vwo-stof */
  function poel(lijst, niv, p){
    var hv = lijst.filter(function(x){ return x.n === 'hv'; });
    if (!vwo(niv)) return hv;
    var vw = lijst.filter(function(x){ return x.n === 'vwo'; });
    return vw.length && Math.random() < (p == null ? .6 : p) ? vw : lijst;
  }
  function vak(kop, html, klas){ return '<div class="hc-vak' + (klas ? ' ' + klas : '') + '">' + (kop ? '<p class="hc-kop">' + kop + '</p>' : '') + html + '</div>'; }

  /* ================= de stof per context (syllabus havo 2027, hoofdstuk 4.2 tot en met 4.4) =================
     tijd:    [sorteerwaarde, hoe het jaar er staat, gebeurtenis, niveau, vraag naar het jaartal]
     oorzaak: [oorzaak, gevolg, niveau, groep]  (paren uit dezelfde groep komen niet samen in een opgave)
     stel:    { s: bewering, o: [goed, fout, fout, fout], u: uitleg, n }
     begrip:  [omschrijving, [goede antwoorden], uitleg, niveau]
     diep:    vwo: { v: vraag, b: situatie, o: [goed, fout, fout, fout], u } */
  function T(a){ return { j:a[0], d:a[1], t:a[2], n:a[3], vr:a[4] }; }
  function O(a){ return { o:a[0], g:a[1], n:a[2], grp:a[3] || '' }; }
  function B(a){ return { v:a[0], a:a[1], u:a[2], n:a[3] || 'hv' }; }

  var CTX = {};

  /* ---------- Het Britse Rijk 1585-1900 ---------- */
  CTX.brits = {
    id:'brits', naam:'Het Britse Rijk', od:'contextenhavo: brits', vol:'het Britse Rijk 1585-1900',
    tijd:[
      [1585, "1585", "De Engelsen doen op het eiland Roanoke hun eerste poging om een kolonie in Noord-Amerika te stichten", "vwo", "In welk jaar deden de Engelsen op Roanoke hun eerste poging om een kolonie in Noord-Amerika te stichten?"],
      [1600, "1600", "De East India Company wordt opgericht", "vwo", "In welk jaar werd de East India Company opgericht?"],
      [1607, "1607", "Jamestown wordt gesticht, de eerste blijvende Engelse nederzetting in Noord-Amerika", "vwo"],
      [1620, "1620", "De protestantse Pilgrim Fathers stichten een Engelse nederzetting in Noord-Amerika", "hv", "In welk jaar stichtten de Pilgrim Fathers een Engelse nederzetting in Noord-Amerika?"],
      [1757, "1757", "De East India Company verslaat de heerser van Bengalen in de slag bij Plassey", "vwo"],
      [1765, "1765", "Het verdrag van Allahabad: het begin van het Britse rijk in India", "hv", "In welk jaar werd het verdrag van Allahabad gesloten, het begin van het Britse rijk in India?"],
      [1773, "1773", "Kolonisten gooien uit protest tegen de Britse belasting thee in de haven van Boston", "vwo"],
      [1776, "1776", "De dertien koloniën komen in opstand en verklaren zich onafhankelijk", "hv", "In welk jaar kwamen de dertien koloniën in Noord-Amerika in opstand en verklaarden zij zich onafhankelijk?"],
      [1783, "1783", "Groot-Brittannië erkent bij de Vrede van Parijs de onafhankelijkheid van de Verenigde Staten", "vwo"],
      [1807, "1807", "Een verbod op de slavenhandel in het Britse Rijk", "hv", "In welk jaar werd de slavenhandel in het Britse Rijk verboden?"],
      [1830, "1830", "De spoorlijn tussen Liverpool en Manchester gaat open", "vwo"],
      [1832, "1832", "De Reform Bill geeft ondernemers meer politieke invloed", "hv", "In welk jaar kregen Britse ondernemers met de Reform Bill meer politieke invloed?"],
      [1833, "1833", "Groot-Brittannië verbiedt de slavernij in grote delen van het rijk", "hv", "In welk jaar verbood Groot-Brittannië de slavernij in grote delen van het rijk?"],
      [1833.5, "1833", "De eerste Factory Act moet excessen in de fabrieken voorkomen", "vwo", "Vanaf welk jaar probeerde de Britse overheid met de Factory Acts excessen in fabrieken te voorkomen?"],
      [1846, "1846", "De graanwetten (Corn Laws) worden afgeschaft: een stap naar vrijhandel", "vwo"],
      [1851, "1851", "De eerste wereldtentoonstelling in Londen", "hv", "In welk jaar werd in Londen de eerste wereldtentoonstelling gehouden?"],
      [1857, "1857", "Een opstand van ontevreden Indiase soldaten tegen de Britten", "hv", "In welk jaar kwamen ontevreden Indiase soldaten in opstand tegen de Britten?"],
      [1858, "1858", "India komt onder direct gezag van de Britse regering", "vwo"],
      [1869, "1869", "Het Suezkanaal gaat open", "vwo", "In welk jaar ging het Suezkanaal open?"],
      [1871, "na 1870", "De Britse industrie krijgt groeiende concurrentie van de Verenigde Staten en Duitsland", "hv"],
      [1885, "1885", "Hoogopgeleide Indiërs richten het Indian National Congress op", "hv", "In welk jaar werd het Indian National Congress opgericht?"],
      [1900, "rond 1900", "Groot-Brittannië heerst over ongeveer een kwart van de wereldbevolking", "hv"]
    ].map(T),
    oorzaak:[
      ["De kolonisten betaalden belasting aan Groot-Brittannië, maar hadden geen vertegenwoordiging in het parlement", "De dertien koloniën kwamen in 1776 in opstand", "hv", "opstand"],
      ["Kolonisten kwamen in aanraking met Verlichte ideeën als volkssoevereiniteit en natuurlijke rechten", "De kolonisten vormden een onafhankelijke federale staat met eigen rechten", "vwo", "opstand"],
      ["In verlichte en religieuze kringen kwam het abolitionisme op", "In 1807 werd de slavenhandel in het Britse Rijk verboden", "hv", "slaaf"],
      ["De slavenhandel werd in 1807 verboden", "Barbados en Jamaica raakten economisch in verval", "hv", "slaaf2"],
      ["In de zuidelijke koloniën werden tabak en katoen voor de export verbouwd", "Slaafgemaakten vormden in het zuiden een groot deel van de bevolking", "hv", "plantage"],
      ["Bloedige oorlogen en ziekten die de Europeanen meebrachten", "De inheemse bevolking van Noord-Amerika werd gedecimeerd", "hv", "inheems"],
      ["De macht van de Mogol-vorsten werd zwakker", "De East India Company breidde haar macht over India uit", "hv", "eic"],
      ["De Britten sloegen de opstand van Indiase soldaten in 1857 hard neer", "India kwam onder direct gezag van de Britse regering", "hv", "1857"],
      ["De Britten voerden de Engelse taal, hun rechtssysteem en hun onderwijs in India in", "Hoogopgeleide Indiërs richtten in 1885 het Indian National Congress op", "hv", "inc"],
      ["Goedkope Engelse industrieproducten werden in India verkocht", "De Indiase huisnijverheid kreeg zware concurrentie", "hv", "markt"],
      ["Stoomschepen en de opening van het Suezkanaal", "Snellere verbindingen met het moederland en meer controle over India", "hv", "controle"],
      ["Uitvindingen zoals de spinning jenny en de stoommachine", "De industriële revolutie werd mogelijk", "hv", "ir"],
      ["Verbeteringen in de landbouw en ziektebestrijding", "De bevolking groeide en er was meer vraag naar goederen en goedkope arbeid", "hv", "bevolking"],
      ["Rijk geworden ondernemers wilden meer politieke invloed", "In 1832 kwam de Reform Bill", "hv", "reform"],
      ["Fabrieksarbeiders leefden en werkten onder slechte omstandigheden en kwamen in protest", "Vanaf 1833 probeerde de overheid met de Factory Acts excessen te voorkomen", "hv", "fabriek"],
      ["Na 1870 groeide de concurrentie van de Verenigde Staten en Duitsland", "Op zoek naar nieuwe markten breidden de Britten hun rijk verder uit", "hv", "concurrentie"],
      ["Ondernemers investeerden winsten uit de koloniën in Groot-Brittannië", "Eerst vaarwegen en daarna spoorwegen werden aangelegd", "vwo", "investering"],
      ["Ondernemers streefden naar vrijhandel, ook binnen het wereldrijk", "De Britten zetten de marine in om vrijhandel af te dwingen, ook buiten hun koloniën", "vwo", "vrijhandel"],
      ["Katoen uit de koloniën en de Verenigde Staten was onmisbaar voor de Britse fabrieken", "De Britse markt werd gevoelig voor gebeurtenissen op mondiaal niveau", "vwo", "mondiaal"]
    ].map(O),
    stel:[
      { n:'hv', s:"De noordelijke koloniën aan de oostkust van Noord-Amerika waren vooral plantagekoloniën.", o:["Onjuist, want het waren vestigingskoloniën, gericht op landbouw, handel en nijverheid.", "Onjuist, want in de noordelijke koloniën werd helemaal geen gebruik gemaakt van slaafgemaakten.", "Juist, want in het noorden werden tabak en katoen voor de export verbouwd.", "Juist, want alle dertien koloniën leefden van de export van plantageproducten."], u:"De plantage-economieën lagen in het zuiden. Let op de verleidelijke fout: alle Engelse koloniën gebruikten de arbeid van slaafgemaakten, ook in het noorden, maar in het zuiden vormden zij een groter deel van de bevolking." },
      { n:'hv', s:"De dertien koloniën in Noord-Amerika waren voor Groot-Brittannië de winstgevendste koloniën in Amerika.", o:["Onjuist, want plantagekoloniën in het Caribisch gebied, zoals Barbados en Jamaica, waren winstgevender.", "Onjuist, want de koloniën in Noord-Amerika brachten Groot-Brittannië helemaal geen winst op.", "Juist, want de dertien koloniën vormden het hele Britse rijk in Amerika.", "Juist, want in Noord-Amerika woonden de meeste Britse kolonisten."], u:"De dertien koloniën waren maar een deel van het Britse rijk in Amerika. De suikereilanden in het Caribisch gebied leverden meer winst op. Dat er veel kolonisten woonden, zegt niets over de winst." },
      { n:'hv', s:"India was voor Groot-Brittannië een vestigingskolonie, net als de noordelijke koloniën in Amerika.", o:["Onjuist, want er was nauwelijks migratie: een kleine groep Britten bestuurde miljoenen Indiërs.", "Onjuist, want India werd door de Britten nooit bestuurd, alleen bezocht voor handel.", "Juist, want na 1857 kwam India onder direct gezag van de Britse regering.", "Juist, want de Britten voerden in India de Engelse taal en hun onderwijs in."], u:"Een vestigingskolonie is een gebied waar veel Europeanen zich blijvend vestigen. In India gebeurde dat niet: een kleine groep Britten bestuurde het land met hulp van het bestaande inheemse bestuur. Direct gezag of Engels onderwijs maakt een land nog geen vestigingskolonie." },
      { n:'hv', s:"Het Brits-Indische leger bestond vooral uit Britse soldaten.", o:["Onjuist, want het bestond uit Indiase soldaten met Britse officieren.", "Onjuist, want de Britten lieten de verdediging over aan de Mogol-vorsten.", "Juist, want na 1857 namen de Britten geen Indiase soldaten meer aan.", "Juist, want er migreerden veel Britse soldaten met hun gezin naar India."], u:"Het Brits-Indische leger bestond uit Indiase soldaten met Britse officieren. Juist daarom was de opstand van ontevreden Indiase soldaten in 1857 zo gevaarlijk voor de Britten." },
      { n:'hv', s:"Het Indian National Congress streefde bij de oprichting in 1885 meteen naar onafhankelijkheid van India.", o:["Onjuist, want het streefde in eerste instantie naar gelijke kansen binnen het Brits-Indische bestuur.", "Onjuist, want het werd opgericht door Britse bestuurders om India beter te besturen.", "Juist, want het werd opgericht direct na de opstand van 1857.", "Juist, want hoogopgeleide Indiërs wezen het Britse onderwijs helemaal af."], u:"Hoogopgeleide Indiërs, opgeleid in het Britse onderwijs, vroegen eerst om gelijke kansen in het bestuur. De Britten gaven daar niet aan toe. Het Congress werd in 1885 opgericht, bijna dertig jaar na de opstand." },
      { n:'hv', s:"Het verdrag van Allahabad in 1765 betekende het begin van het Britse rijk in India.", o:["Juist, want de East India Company kreeg daarna macht over een groot gebied en kon er belasting innen.", "Juist, want India kwam toen onder direct gezag van de Britse regering.", "Onjuist, want het Britse rijk in India begon pas na de opening van het Suezkanaal.", "Onjuist, want de East India Company dreef in India alleen handel en bestuurde niets."], u:"Na Allahabad heerste de East India Company al snel over een groot deel van het subcontinent, en het innen van belasting werd een belangrijke inkomstenbron. Direct gezag van de Britse regering kwam pas na de opstand van 1857." },
      { n:'hv', s:"India werd in de 19e eeuw een belangrijke afzetmarkt voor de Britse katoenindustrie.", o:["Juist, want Engelse fabrieksstoffen werden in India verkocht.", "Juist, want India kocht vooral ruwe katoen in Groot-Brittannië.", "Onjuist, want India leverde alleen grondstoffen en kocht zelf niets.", "Onjuist, want de Britten verboden de verkoop van Engelse stoffen daar."], u:"India leverde grondstoffen zoals katoen en was tegelijk een markt voor Engelse fabrieksstoffen. Die import maakte het de Indiase huisnijverheid moeilijk." },
      { n:'hv', s:"De Britse overheid greep vanaf het begin van de industrialisatie in om de omstandigheden van fabrieksarbeiders te verbeteren.", o:["Onjuist, want pas vanaf 1833 kwamen de Factory Acts tegen excessen.", "Onjuist, want de Britse overheid greep in de hele 19e eeuw nooit in.", "Juist, want de Reform Bill van 1832 regelde de werktijden in fabrieken.", "Juist, want minister Robert Owen voerde al vroeg sociale wetten in."], u:"Eerst liet de overheid het over aan de markt. Vanaf 1833 kwamen de Factory Acts. De Reform Bill ging over politieke invloed, niet over arbeidstijden. Robert Owen was ondernemer en hervormer, geen minister." },
      { n:'hv', s:"De wereldtentoonstelling van 1851 liet zien dat Groot-Brittannië de werkplaats van de wereld was.", o:["Juist, want de Britse industrie liep toen voor op de rest van de wereld.", "Juist, want daar werden de koloniën officieel verdeeld.", "Onjuist, want de Verenigde Staten en Duitsland waren toen al de grootste industrielanden.", "Onjuist, want de industriële revolutie begon pas na 1870."], u:"In 1851 was Groot-Brittannië het voorbeeld van een industrieland. De concurrentie van de Verenigde Staten en Duitsland groeide pas na 1870." },
      { n:'hv', s:"Met de Reform Bill van 1832 kregen alle volwassen mannen in Groot-Brittannië kiesrecht.", o:["Onjuist, want de Reform Bill gaf vooral ondernemers meer politieke invloed, niet iedereen.", "Onjuist, want de Reform Bill ging over de afschaffing van de slavernij.", "Juist, want daarmee werd Groot-Brittannië in 1832 een volledige democratie.", "Juist, want fabrieksarbeiders hadden de Reform Bill met stakingen afgedwongen."], u:"Rijk geworden ondernemers wilden politieke invloed en kregen die met de Reform Bill. Arbeiders en vrouwen bleven nog lang zonder kiesrecht: de democratisering ging stap voor stap." },
      { n:'hv', s:"Door het verbod op de slavenhandel in 1807 bloeiden Barbados en Jamaica economisch op.", o:["Onjuist, want het verbod betekende de economische neergang van Barbados en Jamaica.", "Onjuist, want op Barbados en Jamaica werkten geen slaafgemaakten.", "Juist, want de planters konden voortaan betaalde arbeiders inhuren.", "Juist, want de slavernij werd daar in 1807 ook afgeschaft."], u:"De suikerplantages op Barbados en Jamaica waren afhankelijk van de aanvoer van slaafgemaakten. Het verbod op de handel in 1807 was nog geen verbod op slavernij: dat kwam in 1833." },
      { n:'hv', s:"Na 1870 had de Britse industrie geen serieuze concurrentie.", o:["Onjuist, want de concurrentie van de Verenigde Staten en Duitsland groeide.", "Onjuist, want Frankrijk en Nederland namen de Britse koloniën over.", "Juist, want rond 1900 heerste Groot-Brittannië over een kwart van de wereldbevolking.", "Juist, want Londen was het financiële hart van de wereld."], u:"Juist die concurrentie was een reden om nieuwe markten te zoeken en het rijk uit te breiden. Een groot rijk of een sterke financiële positie betekent niet dat er geen concurrentie was." },
      { n:'vwo', s:"Het bezit van India was voor Groot-Brittannië vooral van politiek belang.", o:["Onjuist, want het gaf wel politiek en militair aanzien, maar was vooral economisch belangrijk.", "Onjuist, want India had voor Groot-Brittannië geen enkel politiek belang.", "Juist, want koningin Victoria werd keizerin van India.", "Juist, want de Britten wilden de wereld naar Brits model beschaven."], u:"India leverde belasting, handelsgewassen van plantages en een afzetmarkt voor Britse industrieproducten. Het keizerschap en het beschavingsideaal laten het zelfbeeld zien, maar weerleggen niet dat het economische belang voorop stond." },
      { n:'vwo', s:"Vrijhandel betekende dat de Britse staat zich afzijdig hield van de wereldhandel.", o:["Onjuist, want de Britten zetten desnoods de marine in om vrijhandel af te dwingen, ook buiten hun koloniën.", "Onjuist, want de Britten hieven juist hoge invoerrechten op alle goederen.", "Juist, want liberalen wilden een kleine rol voor de overheid.", "Juist, want de marine werd alleen gebruikt om de kust van Groot-Brittannië te verdedigen."], u:"Een kleine rol voor de overheid in de economie ging samen met een grote rol van de marine in de wereld: de staat dwong open markten af. Dat is het verleidelijke: liberaal klinkt als afzijdig, maar dat was het buiten Europa niet." },
      { n:'vwo', s:"Door de industrialisatie werd de Britse markt minder afhankelijk van wat er elders in de wereld gebeurde.", o:["Onjuist, want katoen en afzet hingen af van India en de Verenigde Staten.", "Onjuist, want de industrialisatie maakte het land vooral afhankelijk van Frankrijk.", "Juist, want Groot-Brittannië maakte voortaan alles in eigen fabrieken.", "Juist, want het handelskapitalisme was vervangen door industrieel kapitalisme."], u:"Fabrieken in Lancashire draaiden op katoen uit Amerika en India, en verkochten aan India. Tijdens de Amerikaanse Burgeroorlog kwamen daardoor veel Britse katoenfabrieken stil te liggen." },
      { n:'vwo', s:"De kolonisten in Noord-Amerika verzetten zich tegen Groot-Brittannië met ideeën die ook in Groot-Brittannië zelf waren ontstaan.", o:["Juist, want het idee van natuurlijke rechten kwam onder anderen van de Engelse filosoof John Locke.", "Juist, want de kolonisten wilden een absoluut vorst, net als in Groot-Brittannië.", "Onjuist, want de Verlichting was een uitsluitend Franse beweging.", "Onjuist, want de kolonisten verzetten zich alleen om economische redenen."], u:"Locke schreef over natuurlijke rechten zoals leven, vrijheid en bezit. De kolonisten gebruikten zulke Verlichte ideeën tegen belasting zonder vertegenwoordiging. Economische belangen speelden mee, maar niet alleen." },

    diep:[
      { v:"Vergelijk de Britse koloniën in Noord-Amerika met Brits-India. Welk verschil is juist?", o:["In Noord-Amerika vestigden zich veel kolonisten; India bestuurde een kleine groep Britten.", "In Noord-Amerika werkten slaafgemaakten; in India verbouwden de Britten geen handelsgewassen.", "India kwam eerder onder Brits gezag dan de eerste Engelse nederzetting in Amerika.", "In Noord-Amerika ging het om handel; in India alleen om politiek aanzien."], u:"Het verschil zit in migratie en bestuur. In India werden ook plantages opgezet, en Allahabad (1765) kwam ruim een eeuw na 1620. Ook in India was het economische belang het grootst." },
      { v:"Welke redenering verbindt de industriële revolutie in Groot-Brittannië met de problemen van de Indiase huisnijverheid?", o:["Goedkope Britse fabrieksstoffen werden in India verkocht en verdrongen handgemaakte stoffen.", "De Britten verboden de Indiase huisnijverheid omdat zij Indiase gebruiken afwezen.", "Indiase wevers trokken massaal naar Britse fabrieken, zodat er in India niemand overbleef.", "Door het Suezkanaal kon India geen katoen meer naar Groot-Brittannië sturen."], u:"Grondstof uit India, verwerkt in Britse fabrieken, en terug als goedkoop product: India werd zo afzetmarkt en grondstoffenleverancier tegelijk." },
      { v:"Een historicus stelt: 'Zonder koloniën was de Britse industrialisatie trager verlopen.' Welk gegeven uit de context ondersteunt dit het best?", o:["Ondernemers investeerden koloniale winsten in industrie en transport.", "Uitvindingen zoals de spinning jenny en de stoommachine maakten industrie mogelijk.", "Door verbeteringen in de landbouw groeide de Britse bevolking snel.", "Na 1870 groeide de concurrentie van de Verenigde Staten en Duitsland."], u:"De stelling gaat over de rol van de koloniën. Uitvindingen en bevolkingsgroei zijn ook oorzaken van de industrialisatie, maar ze ondersteunen deze stelling niet." },
      { v:"'Op zoek naar nieuwe markten breidden de Britten hun rijk aan het einde van de 19e eeuw verder uit.' Welke twee kenmerkende aspecten verbindt deze zin?", o:["De industriële revolutie en de moderne vorm van imperialisme.", "Wereldwijde handelscontacten en de democratische revoluties.", "Discussies over de sociale kwestie en de opkomst van emancipatiebewegingen.", "De uitbouw van plantagekoloniën en de opkomst van het abolitionisme."], u:"De industrie had markten en grondstoffen nodig; dat dreef de uitbreiding van het rijk na 1870. Dat is precies het verband in het kenmerkend aspect over modern imperialisme." },
      { v:"De Britten voerden in India Engels onderwijs in om Indiërs naar Brits model te 'beschaven'. Welk gevolg daarvan is een onbedoeld gevolg?", o:["Opgeleide Indiërs richtten het Indian National Congress op en eisten gelijke kansen.", "Indiërs konden voortaan Britse bevelen en wetten in het Engels lezen.", "Er kwamen voortaan meer Britse leraren en ambtenaren naar India.", "De Britten konden India daardoor met minder eigen ambtenaren besturen."], u:"Een onbedoeld gevolg gaat in tegen wat de makers van het beleid wilden. De Britten wilden loyale onderdanen; ze kregen een opgeleide groep die zich tegen de ongelijkheid keerde." },
      { v:"Welke gebeurtenis laat zien dat de Britse markt in de 19e eeuw gevoelig was voor gebeurtenissen op mondiaal niveau?", o:["In de Amerikaanse Burgeroorlog kwam weinig katoen, en Britse fabrieken lagen stil.", "In 1851 liet de wereldtentoonstelling in Londen de Britse industrie zien.", "In 1832 kregen ondernemers met de Reform Bill meer politieke invloed.", "In 1833 kwamen de eerste Factory Acts tegen excessen in fabrieken."], u:"Een oorlog aan de andere kant van de oceaan raakte direct de fabrieken in Lancashire: dat is gevoeligheid voor gebeurtenissen op mondiaal niveau." },
      { v:"Waarom past de opstand van de dertien koloniën bij het kenmerkend aspect over democratische revoluties, en niet alleen bij een belastingconflict?", o:["De kolonisten beriepen zich op Verlichte ideeën en vormden een nieuwe staat.", "De kolonisten weigerden alleen om economische redenen belasting te betalen.", "De opstand werd gesteund en betaald door de Royal African Company.", "Na de opstand werd de slavernij in de Verenigde Staten meteen afgeschaft."], u:"Een democratische revolutie gaat over wie de macht heeft en welke rechten burgers hebben. Dat de slavernij meteen werd afgeschaft, klopt niet: dat gebeurde in de Verenigde Staten pas in 1865." },
      { v:"Welke uitspraak over continuïteit in het Britse Rijk van 1585 tot 1900 is het best te verdedigen?", o:["Van de kolonies in Amerika tot India ging het de Britten steeds vooral om handel en winst.", "De Britten bestuurden hun koloniën steeds via grote groepen Britse kolonisten.", "De Britten gebruikten in al hun koloniën tot 1900 de arbeid van slaafgemaakten.", "Het zwaartepunt van het rijk lag de hele periode in Noord-Amerika."], u:"Het zwaartepunt verschoof na 1776 naar India en de slavernij werd in 1833 verboden, maar het economische motief liep door: driehoekshandel, plantages, belasting en afzetmarkten." }
    ]

      { n:'hv', s:"Na de Tweede Wereldoorlog werd Duitsland verdeeld in twee bezettingszones.", o:["Onjuist, want de geallieerden verdeelden Duitsland in vier bezettingszones.", "Onjuist, want Duitsland werd na 1945 niet bezet.", "Juist, want er ontstonden twee Duitse staten: de BRD en de DDR.", "Juist, want alleen de Verenigde Staten en de Sovjet-Unie bezetten Duitsland."], u:"Er waren vier zones: een Amerikaanse, Britse, Franse en Sovjetzone. Pas in 1949 ontstonden twee staten." },

      { n:'hv', s:"Adenauer erkende de DDR als zelfstandige staat.", o:["Onjuist, want hij erkende de DDR niet en wilde Duitse eenheid.", "Onjuist, want Adenauer was zelf de leider van de DDR in Oost-Berlijn.", "Juist, want hij richtte zich op snelle integratie in het Westen.", "Juist, want de BRD en de DDR werden samen lid van de NAVO."], u:"Adenauer koos voor het Westen en weigerde de DDR te erkennen. De DDR was lid van het Warschaupact, niet van de NAVO. Pas in 1972, onder Brandt, erkenden beide staten elkaar." },
      { n:'hv', s:"Bij de bouw van de Berlijnse muur in 1961 grepen de Verenigde Staten militair in.", o:["Onjuist, want de VS erkenden de invloedssfeer van de Sovjet-Unie.", "Onjuist, want de muur werd door de Verenigde Staten zelf gebouwd.", "Juist, want de Amerikanen hielden West-Berlijn met een luchtbrug in leven.", "Juist, want de Verenigde Staten wilden de vlucht naar het Westen stoppen."], u:"De luchtbrug hoort bij de blokkade van 1948. In 1961 accepteerden de Verenigde Staten de muur; zo hoefden ze geen oorlog te riskeren." },
      { n:'hv', s:"Door de erkenning van de DDR in 1972 gaf de Bondsrepubliek het streven naar Duitse eenheid op.", o:["Onjuist, want de Bondsrepubliek hield vast aan het streven naar Duitse eenheid.", "Onjuist, want de BRD en de DDR erkenden elkaar pas in 1990.", "Juist, want Brandt zag de Duitse deling als definitief.", "Juist, want de BRD wilde daarna geen contact meer met de DDR."], u:"Het was DDR-leider Honecker die de deling als definitief zag, niet Brandt. De Bondsrepubliek bleef streven naar eenheid." },
      { n:'hv', s:"De DDR-leiding steunde het hervormingsbeleid van Gorbatsjov.", o:["Onjuist, want de DDR-leiding vreesde de gevolgen van hervormingen.", "Onjuist, want Gorbatsjov voerde in de Sovjet-Unie geen hervormingen door.", "Juist, want de DDR was een integraal deel van het Oostblok.", "Juist, want glasnost en perestrojka waren in de DDR bedacht."], u:"Glasnost (openheid) en perestrojka (hervorming) waren beleid van Gorbatsjov. Juist omdat de DDR zich ertegen keerde, groeide de onvrede onder de bevolking." },
      { n:'hv', s:"Na de hereniging in 1990 bleef Bonn de hoofdstad van Duitsland.", o:["Onjuist, want Duitsland werd herenigd met Berlijn als nieuwe hoofdstad.", "Onjuist, want de hoofdstad werd Frankfurt.", "Juist, want Bonn was de hoofdstad van de Bondsrepubliek.", "Juist, want Berlijn lag in de voormalige DDR."], u:"Bonn was de hoofdstad van de Bondsrepubliek, maar het herenigde Duitsland koos Berlijn." },
      { n:'hv', s:"Met het Marshallplan wilden de Verenigde Staten een dam opwerpen tegen communistische expansie.", o:["Juist, want economisch herstel moest voorkomen dat het communisme in West-Europa aanhang won.", "Juist, want het Marshallplan was hulp aan de Sovjet-Unie.", "Onjuist, want het Marshallplan was bedoeld om Duitsland te straffen.", "Onjuist, want het Marshallplan ging alleen over de verdeling in bezettingszones."], u:"Samen met de Trumandoctrine en het stimuleren van Europese eenwording was het Marshallplan bedoeld om communistische expansie tegen te houden." },
      { n:'hv', s:"In bezet Nederland bleef de rechtsstaat tijdens de Duitse bezetting gewoon werken.", o:["Onjuist, want de Duitsers zetten de rechtsstaat buiten werking.", "Onjuist, want Nederland werd in de oorlog niet door Duitsland bezet.", "Juist, want de Nederlandse rechters bleven gewoon in functie.", "Juist, want de Duitsers wilden de Nederlanders als bondgenoot."], u:"In de veroverde gebieden, waaronder Nederland, zetten de Duitsers de rechtsstaat buiten werking. Joden werden er systematisch uitgesloten en gedeporteerd." },
      { n:'vwo', s:"Na 1945 begonnen de geallieerden in hun bezettingszones met denazificatie.", o:["Juist, want elk van de vier bezetters begon in de eigen zone met denazificatie.", "Juist, want alleen de Verenigde Staten deden aan denazificatie.", "Onjuist, want de geallieerden lieten nazi's ongemoeid in hun functie.", "Onjuist, want denazificatie begon pas na de hereniging van 1990."], u:"Volgens afspraak verdeelden de geallieerden Duitsland in vier zones, waarin zij elk begonnen met denazificatie. Dat die in de BRD beperkt bleef, werd later een punt van kritiek." },
      { n:'vwo', s:"In de BRD stond in de jaren 1950 de kritische confrontatie met het naziverleden centraal.", o:["Onjuist, want door de nadruk op wederopbouw raakte het verleden op de achtergrond.", "Onjuist, want de BRD presenteerde zich als erfgenaam van het communistische verzet.", "Juist, want Adenauer hield vast aan het ideaal van een herenigd Duitsland.", "Juist, want het Wirtschaftswunder gaf ruimte voor een kritische blik terug."], u:"De BRD zocht vooral stabiliteit en welvaart. Het was de DDR die zich als erfgenaam van het communistische verzet presenteerde." },
      { n:'vwo', s:"De DDR presenteerde zich als ideologische erfgenaam van het communistische verzet tegen de nazi's.", o:["Juist, want zij wilde een socialistische staat waarin het fascisme geen kans kreeg.", "Juist, want de DDR werkte samen met de Baader-Meinhof Gruppe tegen de nazi's.", "Onjuist, want de DDR zag zichzelf als voortzetting van de Republiek van Weimar.", "Onjuist, want de DDR-leiding beschouwde het naziverleden niet als een probleem."], u:"Dit antifascisme was de kern van het zelfbeeld van de DDR. De steun aan de Baader-Meinhof Gruppe hoort bij de jaren 1970 en had niets met verzet tegen de nazi's te maken." },
      { n:'vwo', s:"De Baader-Meinhof Gruppe was een rechts-extremistische terreurgroep in de BRD.", o:["Onjuist, want het was een linkse groep, gesteund vanuit de DDR.", "Onjuist, want de groep pleegde haar aanslagen alleen in de DDR.", "Juist, want de groep verheerlijkte het naziverleden van Duitsland.", "Juist, want de groep kreeg steun van conservatieve partijen in de BRD."], u:"De Baader-Meinhof Gruppe hoort bij het linkse terrorisme in de BRD, en ontving steun vanuit de DDR." },
      { n:'vwo', s:"Na de hereniging had Oost-Duitsland alleen economische problemen.", o:["Onjuist, want er waren ook mentale gevolgen van het totalitaire regime.", "Onjuist, want Oost-Duitsland had na 1990 helemaal geen problemen meer.", "Juist, want alleen de planeconomie had de economie van de DDR verzwakt.", "Juist, want de mensen in de voormalige DDR waren al gewend aan democratie."], u:"Veertig jaar dictatuur liet ook sporen na in hoe mensen dachten en samenleefden. De planeconomie verklaart alleen het economische deel." },
      { n:'vwo', s:"Gorbatsjov liet de Brezjnevdoctrine los omdat hij het communisme wilde afschaffen.", o:["Onjuist, want hij wilde hervormen en had daarvoor het Westen nodig.", "Onjuist, want de Brezjnevdoctrine werd pas na 1991 losgelaten.", "Juist, want glasnost en perestrojka moesten de Sovjet-Unie opheffen.", "Juist, want hij wilde dat de DDR lid werd van de NAVO."], u:"Gorbatsjov wilde de Sovjet-Unie redden met hervormingen, niet opheffen. Het loslaten van de doctrine was een middel om de relatie met het Westen te verbeteren, met grote onbedoelde gevolgen." }
    ],

      ["De Amerikaanse belofte uit 1947 om landen te steunen die zich tegen het communisme verzetten", ["Trumandoctrine", "Truman doctrine", "de Trumandoctrine"], "De Trumandoctrine en het Marshallplan moesten een dam opwerpen tegen communistische expansie."],

      ["De manier waarop de Amerikanen West-Berlijn in 1948 en 1949 bevoorraadden", ["luchtbrug", "de luchtbrug", "Berliner Luftbrücke", "Berlijnse luchtbrug"], "Tijdens de Blokkade van Berlijn vlogen vliegtuigen voedsel en brandstof naar West-Berlijn."],

      ["De DDR-leider die van de DDR in de jaren 1950 een totalitaire dictatuur naar Sovjetmodel maakte", ["Ulbricht", "Walter Ulbricht"], "Onder Ulbricht kwam de bevolking onder strenge controle van de Stasi."],

      ["De ontspanning tussen de Verenigde Staten en de Sovjet-Unie vanaf de jaren 1960", ["detente", "ontspanning", "de detente"], "Tijdens de detente kon Brandt zijn Ostpolitik voeren."],

    diep:[
      { v:"Welke overeenkomst tussen nazi-Duitsland en de DDR onder Ulbricht past bij het kenmerkend aspect over totalitaire ideologieën?", o:["Beide gebruikten terreur, een geheime politie en propaganda om alles te beheersen.", "Beide regimes hadden een planeconomie naar het model van de Sovjet-Unie.", "Beide regimes werden in hun begintijd gesteund door de Verenigde Staten.", "Beide regimes kwamen aan de macht door vrije verkiezingen voor het parlement."], u:"Totalitair betekent: de staat wil alle terreinen van het leven beheersen. Een planeconomie had alleen de DDR, en de DDR kwam niet door vrije verkiezingen tot stand." },
      { v:"Waarom had de beurskrach van 1929 in Duitsland zulke grote politieke gevolgen?", o:["De democratie was al wankel: weinig vertrouwen, en extremisten profiteerden.", "Duitsland was het enige land ter wereld dat door de crisis werd getroffen.", "De beurskrach begon in Berlijn en trof daarom Duitsland het hardst.", "De crisis kwam door de Ostpolitik, die Duitsland afhankelijk maakte."], u:"Een economische crisis wordt een politieke crisis als het vertrouwen in de democratie al zwak is. De dolkstootlegende en de afkeer van Versailles hadden dat vertrouwen ondermijnd." },
      { v:"Waarom slaagde de omwenteling in de DDR in 1989, terwijl de opstand van 1953 mislukte?", o:["In 1989 greep Moskou niet in, want Gorbatsjov had de Brezjnevdoctrine losgelaten.", "In 1989 had de DDR geen geheime politie meer die demonstranten kon oppakken.", "In 1953 was er nog geen muur, dus vluchtten de opstandelingen naar het Westen.", "In 1989 grepen de Verenigde Staten militair in om de DDR-burgers te helpen."], u:"Het verschil zat in de houding van Moskou. De Stasi bestond in 1989 nog, en de Verenigde Staten grepen niet in." },
      { v:"Brandt voerde een Ostpolitik en zette zich tegelijk in voor Europese integratie. Hoe hangt dat samen?", o:["Zo stelde hij het Westen gerust dat de BRD in het westerse kamp bleef.", "Hij wilde de DDR via Europese integratie lid maken van de Europese Gemeenschap.", "Hij wilde de Europese integratie gebruiken als wapen tegen de Sovjet-Unie.", "Hij gaf het streven naar Duitse eenheid op en zocht een identiteit in Europa."], u:"Om de goede verhouding met het Westen te waarborgen, koppelde Brandt de Ostpolitik aan Europese integratie. Het streven naar eenheid gaf de BRD niet op." },
      { v:"Kohl accepteerde de invoering van de euro. Welke verklaring past bij de context?", o:["Het was een ruil: Frankrijk steunde de hereniging, Duitsland bond zich aan Europa.", "Duitsland had na de hereniging geen eigen munt meer en moest er een kiezen.", "De Sovjet-Unie eiste de euro als voorwaarde voor haar steun aan de hereniging.", "De DDR had de euro al ingevoerd en de BRD moest zich daarbij aansluiten."], u:"De syllabus noemt het een ruil voor Franse steun. Voor Frankrijk was belangrijk dat een herenigd Duitsland deel bleef van een sterk Europa." },
      { v:"West-Duitsland werd in de jaren 1950 een stabiele democratie; de Republiek van Weimar niet. Welke verklaring past het best?", o:["De BRD had het Wirtschaftswunder en westerse steun; Weimar had crisis en wantrouwen.", "De BRD hoefde geen herstelbetalingen te doen; verder was er geen enkel verschil.", "Weimar had geen grondwet en geen parlement; de BRD had die allebei wel.", "De BRD werd in de jaren 1950 bestuurd en beschermd door de Sovjet-Unie."], u:"Welvaart en westerse steun gaven de BRD draagvlak. Weimar had juist met economische tegenslag en een gebrek aan vertrouwen te maken." },
      { v:"In de BRD ontstond in de jaren 1970 links terrorisme. Welke twee oorzaken noemt de context?", o:["Kritiek op de consumptiecultuur en de beperkt gebleven denazificatie.", "De bouw van de Berlijnse muur en de Ostpolitik van bondskanselier Brandt.", "De oliecrisis van 1973 en de hoge werkloosheid onder jongeren in de BRD.", "De hereniging van Duitsland en de invoering van de euro als munt."], u:"Jongeren verweten de generatie van hun ouders materialisme en zwijgen over het naziverleden. Groepen als de Baader-Meinhof Gruppe kregen steun vanuit de DDR." },
      { v:"De BRD en de DDR gingen verschillend om met het naziverleden. Welke beschrijving klopt?", o:["De BRD keek vooral vooruit naar wederopbouw; de DDR noemde zich erfgenaam van het verzet.", "De BRD noemde zich een antifascistische staat; de DDR zweeg over het naziverleden.", "Beide staten weigerden na 1945 elke medewerking aan de denazificatie door de bezetters.", "De DDR liet de verwerking van het naziverleden helemaal over aan de Bondsrepubliek."], u:"Twee staten, twee verhalen: de BRD keek vooruit naar welvaart, de DDR gebruikte het antifascisme als fundament van haar staat." }
    ]
  };

    stel:[
      { n:'hv', s:"Direct na de Tweede Wereldoorlog verdween de verzuiling in Nederland.", o:["Onjuist, want de verzuilde verhoudingen werden eerst juist hersteld.", "Onjuist, want Nederland is in de 20e eeuw nooit verzuild geweest.", "Juist, want de Duitse bezetting had alle zuilen vernietigd.", "Juist, want direct na 1945 kwamen D'66 en Veronica op."], u:"Na 1945 keerden de oude zuilen terug. D'66 en Veronica horen bij de ontzuiling, vanaf de jaren 1960." },
      { n:'hv', s:"Na 1945 bleef Nederland een neutraliteitspolitiek voeren.", o:["Onjuist, want Nederland koos in de Koude Oorlog voor het Westen.", "Onjuist, want Nederland sloot in 1945 een bondgenootschap met de Sovjet-Unie.", "Juist, want Nederland was ook in de Eerste Wereldoorlog neutraal gebleven.", "Juist, want Nederland weigerde de Marshallhulp van de Verenigde Staten."], u:"Nederland koos na de oorlog duidelijk voor het Westen, onder meer als lid van de NAVO en door Europese samenwerking. Dat het vroeger neutraal was, zegt niets over de periode na 1945." },
      { n:'hv', s:"De rooms-rode regeringen stimuleerden met geleide loonpolitiek de export en de werkgelegenheid.", o:["Juist, want door de lonen laag te houden waren Nederlandse producten goedkoop in het buitenland.", "Juist, want de lonen werden zo snel mogelijk verhoogd.", "Onjuist, want geleide loonpolitiek werd pas in de jaren 1980 ingevoerd.", "Onjuist, want de rooms-rode regeringen bemoeiden zich niet met de economie."], u:"Met geleide loonpolitiek bepaalden overheid en sociale partners samen de lonen. Lage lonen hielden de export concurrerend. Vanaf het begin van de jaren 1960 stegen de lonen juist sterk." },
      { n:'hv', s:"De invoering van de AOW in 1957 was een stap in de opbouw van de verzorgingsstaat.", o:["Juist, want daarna werd de sociale wetgeving verder uitgebreid.", "Juist, want de AOW maakte een einde aan de geleide loonpolitiek.", "Onjuist, want de verzorgingsstaat werd pas na 1980 opgebouwd.", "Onjuist, want de AOW was een maatregel van de regeringen-Lubbers."], u:"Na 1980 werd de verzorgingsstaat juist beperkt, onder Lubbers. De AOW van 1957 is het startpunt van de uitbreiding." },
      { n:'hv', s:"In de jaren 1960 verzetten provo's en hippies zich tegen de consumptiemaatschappij.", o:["Juist, want zij bespotten het gezag van oudere generaties en eisten meer inspraak.", "Juist, want zij wilden de verzuiling herstellen.", "Onjuist, want provo's en hippies waren een jongerenbeweging uit de jaren 1980.", "Onjuist, want zij streden vooral voor lagere lonen."], u:"Provo's en hippies horen bij de jaren 1960. De punk- en kraakbeweging kwamen pas op tijdens de crisis rond 1980." },
      { n:'hv', s:"Begin jaren 1950 was Nederland een immigratieland.", o:["Onjuist, want veel Nederlanders vertrokken naar Australië en Canada.", "Onjuist, want er kwam toen niemand naar Nederland en niemand ging weg.", "Juist, want vanaf de jaren 1950 kwamen er grote groepen uit Turkije en Marokko.", "Juist, want Nederland was toen al een land met veel gastarbeiders."], u:"Begin jaren 1950 was Nederland een emigratieland: veel mensen trokken naar Australië, Nieuw-Zeeland en Canada. Gastarbeiders uit Turkije en Marokko kwamen pas vanaf de jaren 1960." },
      { n:'hv', s:"Vanaf de jaren 1960 kwamen gastarbeiders eerst uit Turkije en Marokko, later uit Zuid-Europa.", o:["Onjuist, want zij kwamen eerst uit Zuid-Europa en later uit Turkije en Marokko.", "Onjuist, want gastarbeiders kwamen alleen uit Suriname.", "Juist, want Turkije en Marokko lagen het dichtst bij Nederland.", "Juist, want de Zuid-Europese landen waren toen nog geen lid van de EGKS."], u:"De volgorde was Zuid-Europa (Italië, Spanje) en daarna Turkije en Marokko. Migranten uit Suriname kwamen door de dekolonisatie, niet als gastarbeider." },
      { n:'hv', s:"De oliecrisis van 1973 maakte een einde aan jarenlange economische groei.", o:["Juist, want daarna volgde rond 1980 een economische crisis.", "Juist, want na de oliecrisis begon de wederopbouw van Nederland.", "Onjuist, want na 1973 groeide de economie juist sneller dan ooit.", "Onjuist, want de oliecrisis trof alleen de Verenigde Staten."], u:"De oliecrisis was een keerpunt. De gevolgen werden pas rond 1980 echt voelbaar in een crisis die de verzorgingsstaat onder druk zette." },
      { n:'hv', s:"De regeringen-Lubbers breidden de verzorgingsstaat verder uit.", o:["Onjuist, want zij bezuinigden en privatiseerden staatsbedrijven.", "Onjuist, want Lubbers was al premier in de jaren 1950.", "Juist, want het poldermodel zorgde voor hogere uitkeringen.", "Juist, want na 1980 werd de verzorgingsstaat goedkoper en dus groter."], u:"Lubbers koos voor een liberaal beleid: bezuinigen en privatiseren. Het poldermodel zorgde voor politieke en economische rust, niet voor hogere uitkeringen." },
      { n:'hv', s:"Het Verdrag van Maastricht werd afgesloten onder Nederlands voorzitterschap.", o:["Juist, en het legde de basis voor de Europese Unie en de invoering van de euro.", "Juist, en daarmee werd Nederland lid van de NAVO.", "Onjuist, want Nederland was tegen verdere Europese samenwerking.", "Onjuist, want het verdrag regelde de onafhankelijkheid van Suriname."], u:"Nederland was voorstander van verdere Europese samenwerking. Als handelsland profiteerde het van de Europese markt." },
      { n:'hv', s:"Rond 2000 nam de polarisatie in Nederland af.", o:["Onjuist, want niet iedereen profiteerde en het migratiedebat werd heftig.", "Onjuist, want rond 2000 was er in Nederland geen economische groei.", "Juist, want vrijwel alle partijen steunden toen het multiculturalisme.", "Juist, want de economie bloeide tot 2008 en dat bracht iedereen rust."], u:"Ondanks de economische bloei voelden mensen een kloof tussen burgers en politiek. Steun voor het multiculturalisme was er tot het einde van de jaren 1990, daarna niet meer." },
      { n:'hv', s:"Internationaal liep Nederland voorop met de regeling van het homohuwelijk en euthanasie.", o:["Juist, want dat gaf het beeld van een vrije, tolerante samenleving.", "Juist, want het waren maatregelen van de rooms-rode regeringen.", "Onjuist, want die wetten kwamen er in Nederland pas na 2008.", "Onjuist, want Nederland volgde daarin de Verenigde Staten."], u:"Rond 2000 regelde Nederland als eerste land het homohuwelijk en euthanasie. Dat past bij de individualisering en de liberale tijdgeest." },
      { n:'hv', s:"De gabbercultuur was een politieke protestbeweging tegen de bestaande orde.", o:["Onjuist, want de gabbercultuur was apolitiek.", "Onjuist, want gabber was een Amerikaanse muziekstroming.", "Juist, want zij verzette zich met geweld tegen de woningnood.", "Juist, want zij kwam voort uit de provo's."], u:"Het was de kraakbeweging die zich, soms met geweld, tegen de woningnood verzette. Gabber ontstond in Nederland en was niet politiek." },
      { n:'hv', s:"Tot het einde van de jaren 1990 steunden vrijwel alle politieke partijen het idee van een multiculturele samenleving.", o:["Juist, maar vanaf 2002 kwam er beleid gericht op integratie.", "Juist, en die steun bleef bij alle partijen bestaan tot 2008.", "Onjuist, want vanaf de jaren 1950 werd al assimilatie geëist.", "Onjuist, want er woonden in Nederland toen nog geen migranten."], u:"Rond 2000 sloeg het debat om. Na de aanslagen van 2001 en de moord op Fortuyn in 2002 kwam er een ander beleid." },
      { n:'hv', s:"De punk- en kraakbeweging kwamen op tijdens de economische crisis rond 1980.", o:["Juist, want krakers bekritiseerden de woningnood in die crisis.", "Juist, want zij verzetten zich tegen de geleide loonpolitiek.", "Onjuist, want punk en krakers hoorden bij de jaren 1950.", "Onjuist, want punk en krakers kwamen pas op na 2002."], u:"Werkloosheid en woningnood tijdens de crisis rond 1980 vormden de voedingsbodem voor punk en kraakacties." },
      { n:'vwo', s:"De individualisering na 1978 was alleen een gevolg van de toenemende welvaart.", o:["Onjuist, want ook een kleinere overheid, meer commercie en ontzuiling speelden mee.", "Onjuist, want er was na 1978 helemaal geen sprake van individualisering.", "Juist, want welvaart is de enige oorzaak van sociaal-culturele verandering.", "Juist, want de overheid stimuleerde individualisering met geleide loonpolitiek."], u:"Een monocausale verklaring is bijna altijd te smal. De context noemt drie factoren naast elkaar, gesteund door wetten zoals het gedoogbeleid en de Algemene Wet Gelijke Behandeling." },
      { n:'vwo', s:"Het idee van de maakbare samenleving bleef na 1978 leidend in de Nederlandse politiek.", o:["Onjuist, want een liberaal vertrouwen in de zelfredzaamheid van burgers werd dominant.", "Onjuist, want het idee van de maakbare samenleving ontstond pas na 2002.", "Juist, want de overheid bleef de verzorgingsstaat uitbreiden.", "Juist, want het poldermodel was een vorm van maakbaarheid."], u:"Van maakbaarheid (de overheid stuurt naar meer gelijkheid) naar zelfredzaamheid (burgers zorgen voor zichzelf): dat is de grote verschuiving tussen de twee helften van de context." },
      { n:'vwo', s:"Het poldermodel van de jaren 1980 sloot aan bij een Nederlandse traditie van overleg.", o:["Juist, want al in de jaren 1950 overlegden overheid en sociale partners.", "Juist, want de verzuiling was in de jaren 1980 weer volledig hersteld.", "Onjuist, want het poldermodel was een volledige breuk met het verleden.", "Onjuist, want in het poldermodel besliste de overheid alles alleen."], u:"Overleg tussen overheid, werkgevers en werknemers liep als een rode draad door de hele periode: een voorbeeld van continuïteit." },
      { n:'vwo', s:"Na de val van Srebrenica zag Nederland zich meer dan ooit als gidsland.", o:["Onjuist, want daarna werd Nederland terughoudender in zijn ambities.", "Onjuist, want Nederland heeft zich nooit als gidsland gezien.", "Juist, want Nederland liep in die tijd voorop met het homohuwelijk.", "Juist, want de demonstraties tegen kruisraketten volgden daarna."], u:"Het gidsland-idee hoort bij de periode tot in de jaren 1980. De demonstraties tegen kruisraketten vonden vóór Srebrenica plaats." },
      { n:'vwo', s:"De economische groei tot 2008 kwam alle groepen in Nederland gelijk ten goede.", o:["Onjuist, want er was ook een toename van sociale verschillen en niet iedereen profiteerde.", "Onjuist, want er was tussen 1990 en 2008 geen economische groei.", "Juist, want Nederland behoorde tot de meest gelijkwaardige landen van de wereld.", "Juist, want de verzorgingsstaat werd na 1980 uitgebreid."], u:"Nederland bleef internationaal een gelijkwaardig land, maar de verschillen binnen Nederland groeiden. Beide horen in een genuanceerd antwoord." }
    ],

    diep:[
      { v:"Vergelijk 1948-1978 met 1978-2008. Welke verandering in de rol van de overheid is juist?", o:["Van maakbaarheid en uitbouw van de verzorgingsstaat naar bezuinigen en zelfredzaamheid.", "Van een kleine overheid naar een overheid die met geleide loonpolitiek de lonen bepaalde.", "Van samenwerking in Europa en de NAVO terug naar de oude neutraliteitspolitiek.", "Van een verzorgingsstaat naar een nachtwakersstaat zonder enige sociale wetgeving."], u:"De verzorgingsstaat werd beperkt, niet afgeschaft. Geleide loonpolitiek hoort juist bij de eerste periode." },
      { v:"Welke continuïteit loopt door de hele periode 1948-2008?", o:["Nederland was steeds voorstander van Europese samenwerking, waar het als handelsland van profiteerde.", "Nederland bleef de hele periode een verzuilde samenleving.", "Nederland bleef de hele periode een emigratieland.", "De multiculturele samenleving werd de hele periode door alle partijen gesteund."], u:"Van het begin van de Europese samenwerking na 1945 tot Maastricht: Nederland koos steeds voor Europa. De andere uitspraken gelden maar voor een deel van de periode." },
      { v:"Waarom past de komst van migranten uit Suriname rond 1975 bij twee kenmerkende aspecten van tijdvak 10?", o:["Het komt door de dekolonisatie en maakt de samenleving pluriformer en multicultureel.", "Het komt door de Koude Oorlog en draagt bij aan de eenwording van Europa.", "Het komt door de toenemende welvaart en hoort bij de wapenwedloop tussen de blokken.", "Het komt door de oliecrisis van 1973 en hoort bij de eenwording van Europa."], u:"Een gebeurtenis kan bij meer kenmerkende aspecten passen. Hier: dekolonisatie als oorzaak, een pluriforme samenleving als gevolg." },
      { v:"Een historicus noemt de jaren rond 2002 een breuk in het Nederlandse migratiebeleid. Welk gegeven ondersteunt dat?", o:["Tot eind jaren 1990 steunden bijna alle partijen het multiculturalisme; vanaf 2002 niet.", "Vanaf 2002 kwamen er helemaal geen migranten meer naar Nederland toe.", "In 2002 werd het Verdrag van Schengen over vrij verkeer van personen gesloten.", "In 2002 kregen gastarbeiders voor het eerst het recht op gezinshereniging."], u:"Een breuk toon je aan met een duidelijk verschil tussen voor en na. Schengen dateert uit het midden van de jaren 1980 en gezinshereniging uit de jaren daarvoor." },
      { v:"Welke verklaring past bij de kleinere Nederlandse invloed in Europa in de jaren 1990?", o:["Na de Koude Oorlog breidden EU en NAVO sterk uit, dus woog Nederland minder.", "Nederland trad in de jaren 1990 uit de Europese Unie en verloor zo zijn stem.", "Nederland weigerde het Verdrag van Maastricht te tekenen en stond daarna buitenspel.", "Door de oliecrisis kon Nederland zijn bijdrage aan Europa niet meer betalen."], u:"Meer lidstaten betekent relatief minder invloed voor een klein land. Nederland bleef voorstander van Europese samenwerking." },
      { v:"Rond 1980 kwam de verzorgingsstaat onder druk. Welke redenering verklaart dat het best?", o:["Door de crisis waren er meer uitkeringen nodig, terwijl de inkomsten daalden.", "Door de babyboom waren er rond 1980 juist te weinig ouderen om te verzorgen.", "Door de geleide loonpolitiek stegen de lonen rond 1980 veel te snel.", "Door het Verdrag van Maastricht mocht Nederland geen uitkeringen meer betalen."], u:"Meer uitgaven en minder inkomsten tegelijk: daardoor werd de verzorgingsstaat te duur gevonden, en kwam er kritiek dat hij ook te bureaucratisch was." },
      { v:"Na de jaren 1960 raakte de jeugdcultuur 'gefragmenteerd'. Wat wordt daarmee bedoeld?", o:["Jongeren van verschillende sociale en etnische achtergronden kregen elk een eigen stijl.", "Jongeren hadden na de jaren 1960 helemaal geen eigen cultuur meer.", "Alle jongeren volgden voortaan dezelfde Amerikaanse popmuziek en mode.", "Jongeren sloten zich weer aan bij de omroep en vereniging van hun eigen zuil."], u:"Gefragmenteerd betekent: in stukken uiteengevallen. In plaats van één jongerencultuur ontstonden er veel naast elkaar, wat past bij een pluriforme samenleving." },
      { v:"Rond 2000 behoorde Nederland tot de welvarendste landen, en toch nam de polarisatie toe. Welke verklaring geeft de context?", o:["Niet iedereen profiteerde van de groei en er groeide een kloof met de politiek.", "De welvaart daalde rond 2000 snel, waardoor veel mensen hun baan verloren.", "De verzuiling keerde rond 2000 terug en zette de zuilen tegenover elkaar.", "Nederland was rond 2000 weer een emigratieland geworden, waar mensen vertrokken."], u:"Welvaart gemiddeld zegt niets over de verdeling. Groeiende sociale verschillen en onvrede over politiek, Europa en migratie verklaren de polarisatie." }
    ]
  };

      if (ok) keus.push(e);
    });
    var ids = keus.map(function(e){ return KAEV.indexOf(e); });
    return {
      vorm:'sleep', klas:'hc-lijst', sleutel:'kas-' + ids.slice().sort(function(a, b){ return a - b; }).join('-'),
      vraag:'Welke gebeurtenis past bij welk kenmerkend aspect?',
      opdracht:'Zet elke gebeurtenis bij het kenmerkend aspect waar hij het best bij past.',
      kaarten: keus.map(function(e, i){ return { id:'k' + i, tekst:S(e.t) }; }),
      vakken: keus.map(function(e, i){ return { id:'a' + i, naam:S(kaTekst(KAnr[e.ka])), max:1, hoort:['k' + i] }; }),
      sleepuit:'Op een telefoon: tik een gebeurtenis aan en dan het kenmerkend aspect.',
      uitleg: keus.map(function(e){ return S(e.t) + ' &rarr; aspect ' + e.ka + ' (tijdvak ' + KAnr[e.ka].tv + ').'; }).join('<br>'),
      antwoordTekst: keus.map(function(e){ return e.t + ' > ' + e.ka; }).join('; ')
    };
  }
  function kenmerkend(niv){
    var o = Math.random() < (vwo(niv) ? .45 : .25) ? kaSleep(niv) : kaMeerkeuze(niv);
    o.onderdeel = 'contextenhavo: kenmerkende aspecten'; o.onderdeelNaam = 'kenmerkende aspecten';
    return o;
  }

  /* bronvragen */
  function bronBeeld(b){
    return '<div class="hc-vak hc-bron"><p class="hc-kop">bron</p><blockquote>' + (b.echt && !/^Een foto/.test(b.tekst) ? '&lsquo;' + S(b.tekst) + '&rsquo;' : S(b.tekst)) + '</blockquote>' +
      '<p class="hc-bij"><b>Maker:</b> ' + S(b.wie) + '. <b>Plaats:</b> ' + S(b.waar) + '. <b>Tijd:</b> ' + S(b.jaar) + '.<br>' +
      (b.echt ? 'Een echte bron, vertaald of beschreven.' : 'Voor deze oefening geschreven, naar wat er in die tijd speelde.') + '</p></div>';
  }
  function bron(niv){
    var lijst = [];
    BRON.forEach(function(b, bi){ b.vragen.forEach(function(q, qi){ lijst.push({ b:b, q:q, k:bi + '-' + qi }); }); });
    var p = lijst.filter(function(x){ return x.q.n === 'hv'; });
    if (vwo(niv)){ var vw = lijst.filter(function(x){ return x.q.n === 'vwo'; }); p = Math.random() < .7 ? vw : lijst; }
    var x = kies(p);
    return {
      vorm:'meerkeuze', sleutel:'br-' + x.k, onderdeel:'contextenhavo: bronnen', onderdeelNaam:'bronvragen',
      vraag:S(x.q.v), beeld:bronBeeld(x.b), opties:x.q.o.map(S), goed:0, uitleg:S(x.q.u)
    };
  }

  var DELEN = ['brits', 'duits', 'nl', 'ka', 'bron'];
  function maakOpgave(soort, niv){
    if (soort === 'ka') return kenmerkend(niv);
    if (soort === 'bron') return bron(niv);
    return context(soort, niv);
  }

  VAKSPEL.maak({
    id:'contextenhavo', naam:'Historische contexten havo', vak:'ges', kleur:'#8c3f2b',
    hand:'jaartallen, oorzaken en bronnen',
    lead:'De drie historische contexten van het centraal examen geschiedenis havo: het Britse Rijk van 1585 tot 1900, Duitsland in Europa van 1918 tot 1991 en Nederland van 1948 tot 2008. Je zet gebeurtenissen op volgorde, koppelt oorzaak en gevolg, beoordeelt beweringen met een redenering, kent de begrippen en jaartallen uit de syllabus, koppelt gebeurtenissen aan kenmerkende aspecten en werkt met bronnen.',
    leerdoel:'Je kent de drie historische contexten van het havo-examen: de ontwikkelingen, oorzaken en gevolgen, begrippen, personen en jaartallen, en je gebruikt ze om kenmerkende aspecten te herkennen en bronnen te beoordelen.',
    hoe:[
      { kop:'Drie contexten', tekst:'Het <b>Britse Rijk</b> (1585-1900), <b>Duitsland in Europa</b> (1918-1991) en <b>Nederland</b> (1948-2008). De jaartallen uit de syllabus zijn keerpunten: die moet je kennen.' },
      { kop:'Redeneren', tekst:'Bij een bewering kies je juist of onjuist <b>met de goede reden</b>. Bij een bron let je op de maker, het jaar en de plaats: waarvoor is hij betrouwbaar, en waarvoor niet?' },
      { kop:'Havo en vwo', tekst:'Op havo oefen je de stof uit de syllabus. Op vwo liggen de gebeurtenissen dichter bij elkaar, zijn er meer paren, en vergelijk je en verklaar je meer, met de extra stof over Duitsland uit het vwo-examen.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'hv', items:[
        { id:'hv', naam:'havo', uit:'De stof van de syllabus havo: jaartallen, oorzaak en gevolg, beweringen, begrippen, kenmerkende aspecten en bronvragen.' },
        { id:'vwo', naam:'vwo', uit:'Verder uitgediept: vijf gebeurtenissen dicht bij elkaar, vier paren oorzaak en gevolg, vergelijken en verklaren, betrouwbaarheid en standplaats, en de vwo-stof over Duitsland (denazificatie, de omgang met het naziverleden, links terrorisme).' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' },
        { id:'brits', naam:'het Britse Rijk', uit:'De koloniën in Amerika, India en de rol van de koloniën in de industrialisatie (1585-1900).' },
        { id:'duits', naam:'Duitsland in Europa', uit:'Weimar en het nationaalsocialisme, de Koude Oorlog en de deling, de hereniging en Europa (1918-1991).' },
        { id:'nl', naam:'Nederland 1948-2008', uit:'Wederopbouw, welvaart en verzorgingsstaat, ontzuiling en jongeren, migratie, Europa en polarisatie.' },
        { id:'ka', naam:'kenmerkende aspecten', uit:'Bij welk kenmerkend aspect van tijdvak 5 tot en met 10 past een gebeurtenis?' },
        { id:'bron', naam:'bronvragen', uit:'Een korte bron met maker, tijd en plaats: leg uit, toon aan, en is deze bron betrouwbaar?' } ] }
    ],
    aantal:10, minuten:9,
    maak:function(keuze, nr){
      var niv = keuze.niveau === 'vwo' ? 'vwo' : 'hv';
      var soort = keuze.soort === 'alles' || DELEN.indexOf(keuze.soort) < 0 ? kies(DELEN) : keuze.soort;
      var o = maakOpgave(soort, niv), klas = o.klas, oud = o.na;
      o.na = function(v){ document.body.classList.toggle('hc-volg', klas === 'hc-volg'); document.body.classList.toggle('hc-lijst', klas === 'hc-lijst'); if (oud) oud(v); };
      return o;
    },
    uitleg:{ doel:'De drie historische contexten van het examen geschiedenis havo: ontwikkelingen, oorzaken en gevolgen, begrippen, personen en jaartallen, kenmerkende aspecten en bronnen.', tijd:'twintig opgaven per ronde, of kies 10 of 30', bediening:'Kies het antwoord dat klopt (of druk op 1 tot 4). Bij een volgorde of een koppeling sleep je kaartjes; op een telefoon tik je een kaartje en dan het vak. Een begrip of jaartal vul je in en je drukt op Nakijken.' }
  });
})();
