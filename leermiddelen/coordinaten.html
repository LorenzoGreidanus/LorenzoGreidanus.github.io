<style>
.rooster{width:min(100%,460px);height:auto;display:block;margin-inline:auto;font-family:inherit;touch-action:manipulation}
.rooster .lijn{stroke:var(--rand2);stroke-width:1}
.rooster .as{stroke:var(--ink);stroke-width:2}
.rooster text{fill:var(--muted);font-size:12px;font-weight:600}
.rooster .punt{fill:var(--nadruk)}
.rooster .punt.spiegel{fill:var(--amber)}
.rooster.tikbaar{cursor:pointer}
/* de cursor: waar de muis zweeft, of waar je met de pijltjes staat */
.rooster .cursor{fill:var(--nadruk-zacht);stroke:var(--ink);stroke-width:2;pointer-events:none;display:none}
.rooster.zweeft .cursor,.rooster:focus-visible .cursor{display:inline}
.rooster:focus{outline:none}
.rooster:focus-visible{outline:3px solid var(--focusring,#B4701A);outline-offset:3px;border-radius:8px}
/* op een telefoon: de stip met knoppen een punt verschuiven, want de roosterpunten liggen te dicht bij elkaar voor een vinger */
.schuif{display:none}
.schuif button{min-width:52px;min-height:44px;border:1.5px solid var(--rand2);border-radius:12px;background:var(--kaart);color:var(--ink);font-size:1.15rem;font-weight:600}
.schuif button:disabled{opacity:.5;cursor:default}
@media screen and (max-width:699px), screen and (pointer:coarse){
  .schuif{display:flex;justify-content:center;gap:8px;margin-top:10px}
}
.rooster .stip{fill:var(--crab);stroke:var(--kaart);stroke-width:2;pointer-events:none}
.rooster .stip.goed{fill:var(--goed)}
.rooster .stip.fout{fill:var(--fout)}
.rooster .doel{fill:none;stroke:var(--goed);stroke-width:3;stroke-dasharray:4 3;pointer-events:none}
.rooster .schat{pointer-events:none}
.rooster .figuur{fill:var(--nadruk-zacht);stroke:var(--nadruk);stroke-width:2;stroke-dasharray:5 4}
.roosteruit{text-align:center;color:var(--muted);font-size:.86rem;margin-top:6px}
</style>
<script src="/vangnet.js" defer></script>
</head>
<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function tussen(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function net(x){ return String(Math.round(x * 100) / 100).replace('.', ','); }
  function co(p){ return '(' + net(p[0]) + ', ' + net(p[1]) + ')'; }

  /* het rooster: per niveau het bereik. bb alleen het eerste kwadrant. */
  function bereik(niveau){ return niveau === 'bb' ? { x0:0, x1:10, y0:0, y1:8 } : { x0:-5, x1:5, y0:-5, y1:5 }; }
  var SCHAT = '<g class="schat" transform="translate(-11 -10) scale(0.46)"><rect x="4" y="16" width="40" height="26" rx="4" fill="#8a5a2b" stroke="#5b3a1a" stroke-width="3"/><path d="M4 22a20 8 0 0 1 40 0" fill="#a0693a" stroke="#5b3a1a" stroke-width="3"/><rect x="20" y="24" width="8" height="8" rx="2" fill="#EA9836"/></g>';
  /* o: { b (bereik), punten:[{p:[x,y], klas, naam}], schat:[x,y], tikbaar, stippen:[[x,y]], figuur:[[x,y],...], pijlen:[[van,naar]] } */
  function rooster(o){
    var b = o.b, stap = 36, L = 30, T = 16, W = (b.x1 - b.x0) * stap + L + 20, Hh = (b.y1 - b.y0) * stap + T + 30;
    function X(x){ return L + (x - b.x0) * stap; } function Y(y){ return T + (b.y1 - y) * stap; }
    /* van een plek in de svg naar het dichtstbijzijnde roosterpunt; ver buiten het rooster (bij de getallen) is geen punt */
    function punt(px, py){
      var fx = (px - L) / stap, fy = (py - T) / stap;
      if (fx < -0.7 || fx > b.x1 - b.x0 + 0.7 || fy < -0.7 || fy > b.y1 - b.y0 + 0.7) return null;
      return [Math.max(b.x0, Math.min(b.x1, b.x0 + Math.round(fx))), Math.max(b.y0, Math.min(b.y1, b.y1 - Math.round(fy)))];
    }
    var s = '<svg class="rooster' + (o.tikbaar ? ' tikbaar" tabindex="0" role="application" aria-label="assenstelsel: kies een punt met de pijltjes, Enter zet de stip"' : '" role="img" aria-label="assenstelsel"') + ' viewBox="0 0 ' + W + ' ' + Hh + '">';
    for (var x = b.x0; x <= b.x1; x++) s += '<line class="' + (x === 0 ? 'as' : 'lijn') + '" x1="' + X(x) + '" y1="' + Y(b.y1) + '" x2="' + X(x) + '" y2="' + Y(b.y0) + '"/>';
    for (var y = b.y0; y <= b.y1; y++) s += '<line class="' + (y === 0 ? 'as' : 'lijn') + '" x1="' + X(b.x0) + '" y1="' + Y(y) + '" x2="' + X(b.x1) + '" y2="' + Y(y) + '"/>';
    for (x = b.x0; x <= b.x1; x++) if (x !== 0 || b.x0 === 0) s += '<text x="' + X(x) + '" y="' + (Y(b.y0) + 16) + '" text-anchor="middle">' + x + '</text>';
    for (y = b.y0; y <= b.y1; y++) if (y !== 0 || b.y0 === 0) s += '<text x="' + (X(b.x0) - 8) + '" y="' + (Y(y) + 4) + '" text-anchor="end">' + y + '</text>';
    s += '<text x="' + (X(b.x1) + 10) + '" y="' + (Y(0) + 4) + '">x</text><text x="' + (X(0) + 6) + '" y="' + (Y(b.y1) - 4) + '">y</text>';
    if (b.x0 < 0) s += '<text x="' + (X(0) - 6) + '" y="' + (Y(0) + 14) + '" text-anchor="end">O</text>';
    if (o.figuur) s += '<polygon class="figuur" points="' + o.figuur.map(function(p){ return X(p[0]) + ',' + Y(p[1]); }).join(' ') + '"/>';
    (o.pijlen || []).forEach(function(pl){ s += '<line x1="' + X(pl[0][0]) + '" y1="' + Y(pl[0][1]) + '" x2="' + X(pl[1][0]) + '" y2="' + Y(pl[1][1]) + '" stroke="var(--amber)" stroke-width="3" stroke-linecap="round"/>'; });
    (o.punten || []).forEach(function(p){ s += '<circle class="punt ' + (p.klas || '') + '" cx="' + X(p.p[0]) + '" cy="' + Y(p.p[1]) + '" r="6"/>' + (p.naam ? '<text x="' + (X(p.p[0]) + 8) + '" y="' + (Y(p.p[1]) - 8) + '" style="fill:var(--ink)">' + S(p.naam) + '</text>' : ''); });
    if (o.schat) s += '<g transform="translate(' + X(o.schat[0]) + ' ' + Y(o.schat[1]) + ')">' + SCHAT + '</g>';
    if (o.tikbaar) s += '<circle class="cursor" cx="' + X(0) + '" cy="' + Y(0) + '" r="13"/>';
    s += '<g class="stippen"></g></svg>';
    return { html: s, X: X, Y: Y, punt: punt };
  }
  function willekeurig(b, zonderNul){
    var p; do { p = [tussen(b.x0, b.x1), tussen(b.y0, b.y1)]; } while (zonderNul && (p[0] === 0 || p[1] === 0));
    return p;
  }

  /* 1. aflezen: waar ligt de schat */
  function aflezen(niveau){
    var b = bereik(niveau), p = willekeurig(b, true);
    if (niveau === 'hv' && Math.random() < 0.4){ p = [p[0] + 0.5 * kies([-1, 1]), p[1]]; if (p[0] < b.x0 || p[0] > b.x1) p[0] = Math.round(p[0]); }
    return { onderdeel:'coördinaten: aflezen', onderdeelNaam:'aflezen', vorm:'invul', sleutel:'af' + p.join(','),
      vraag:'Waar ligt de <b>schat</b>? Geef de coördinaten.', opdracht:'Eerst x (naar rechts), dan y (omhoog). Een halve mag als 2,5.',
      beeld: rooster({ b:b, schat:p }).html,
      velden:[{ label:'x', antwoord:p[0], tol:0.01 }, { label:'y', antwoord:p[1], tol:0.01 }],
      uitleg:'Vanaf de oorsprong O: ' + net(p[0]) + ' naar ' + (p[0] >= 0 ? 'rechts' : 'links') + ' en ' + net(Math.abs(p[1])) + ' ' + (p[1] >= 0 ? 'omhoog' : 'omlaag') + '. Eerst x, dan y: ' + co(p) + '.', antwoordTekst: co(p) };
  }
  /* 2. aanwijzen: tik het punt aan (eigen vorm) */
  function aanwijs(o){
    /* o: { b, doel:[x,y], vraag, opdracht, uitleg, onderdeel, onderdeelNaam, sleutel, extra (rooster-opties) } */
    return { onderdeel:o.onderdeel, onderdeelNaam:o.onderdeelNaam, vorm:'eigen', sleutel:o.sleutel, vraag:o.vraag, opdracht:o.opdracht, uitleg:o.uitleg, antwoordTekst: co(o.doel),
      teken:function(el, api){
        var r = rooster(Object.assign({ b:o.b, tikbaar:true }, o.extra || {})), b = o.b;
        /* de schuifknoppen alleen in het spel, niet op het werkblad (daar hangt el nog buiten de pagina) */
        var inSpel = document.body.contains(el), PIJL = [['←', 'links', -1, 0], ['↓', 'omlaag', 0, -1], ['↑', 'omhoog', 0, 1], ['→', 'rechts', 1, 0]];
        el.innerHTML = r.html + (inSpel ? '<div class="schuif" role="group" aria-label="stip verschuiven">' + PIJL.map(function(p, i){ return '<button type="button" data-i="' + i + '" aria-label="stip naar ' + p[1] + '">' + p[0] + '</button>'; }).join('') + '</div>' : '') +
          '<p class="roosteruit" id="roosteruit" aria-live="polite">Tik het roosterpunt aan. Nog eens tikken zet de stip ergens anders.' +
          '<span class="toetsuit">Met het toetsenbord: Tab naar het rooster, loop met de pijltjes en zet de stip met Enter.</span></p>';
        var svg = el.querySelector('svg'), stippen = svg.querySelector('.stippen'), cursor = svg.querySelector('.cursor'), gekozen = null;
        function uit(t){ el.querySelector('#roosteruit').textContent = t; }
        function zelfde(p, q){ return !!p && !!q && p[0] === q[0] && p[1] === q[1]; }
        /* de cursor (toetsenbord, zwevende muis) begint in de oorsprong en loopt met de stip mee */
        var hier = [0, 0];
        function naar(p){ hier = p; cursor.setAttribute('cx', r.X(p[0])); cursor.setAttribute('cy', r.Y(p[1])); }
        function binnen(p){ return [Math.max(b.x0, Math.min(b.x1, p[0])), Math.max(b.y0, Math.min(b.y1, p[1]))]; }
        function zet(p){
          if (!api.bezig()) return;
          gekozen = p.slice(); naar(p);
          stippen.innerHTML = '<circle class="stip" cx="' + r.X(p[0]) + '" cy="' + r.Y(p[1]) + '" r="8"/>';
          uit('Je stip staat op ' + co(p) + '. Klopt het? Druk op Nakijken.');
        }
        /* tikken: het dichtstbijzijnde roosterpunt, dus het hele hokje rond een punt is raak */
        function puntBij(e){
          var m = svg.getScreenCTM(); if (!m) return null;
          var q = svg.createSVGPoint(); q.x = e.clientX; q.y = e.clientY; q = q.matrixTransform(m.inverse());
          return r.punt(q.x, q.y);
        }
        svg.addEventListener('click', function(e){ if (!api.bezig()) return; var p = puntBij(e); if (p) zet(p); });
        svg.addEventListener('pointermove', function(e){ if (e.pointerType !== 'mouse' || !api.bezig()) return; var p = puntBij(e); svg.classList.toggle('zweeft', !!p); if (p) naar(p); });
        svg.addEventListener('pointerleave', function(){ svg.classList.remove('zweeft'); if (gekozen) naar(gekozen); });
        /* het toetsenbord: pijltjes verplaatsen de cursor, Enter zet de stip; staat hij er al, dan kijkt Enter na */
        svg.addEventListener('keydown', function(e){
          if (!api.bezig()) return;
          var d = { ArrowLeft:[-1, 0], ArrowRight:[1, 0], ArrowUp:[0, 1], ArrowDown:[0, -1] }[e.key];
          if (d){
            e.preventDefault();
            naar(binnen([hier[0] + d[0], hier[1] + d[1]]));
            uit('Op ' + co(hier) + (zelfde(hier, gekozen) ? ', daar staat je stip' : '') + '. Enter zet de stip hier.');
          } else if (e.key === 'Enter' || e.key === ' '){
            e.preventDefault(); e.stopPropagation();
            if (zelfde(hier, gekozen)) knop.click();
            else { zet(hier); uit('Je stip staat op ' + co(hier) + '. Nog een keer Enter kijkt na.'); }
          }
        });
        /* de schuifknoppen (telefoon): de stip een punt verschuiven */
        el.addEventListener('click', function(e){
          var k = e.target.closest('.schuif button'); if (!k || !api.bezig()) return;
          var p = PIJL[parseInt(k.getAttribute('data-i'), 10)];
          zet(binnen([(gekozen || hier)[0] + p[2], (gekozen || hier)[1] + p[3]]));
        });
        var knop = api.knop('Nakijken', function(){
          /* nog geen stip: geen fout, eerst een punt kiezen */
          if (!gekozen){ api.uit('Zet eerst een stip: tik een roosterpunt aan.'); return; }
          var ok = zelfde(gekozen, o.doel);
          stippen.innerHTML = '<circle class="stip ' + (ok ? 'goed' : 'fout') + '" cx="' + r.X(gekozen[0]) + '" cy="' + r.Y(gekozen[1]) + '" r="8"/>' + (ok ? '' : '<circle class="doel" cx="' + r.X(o.doel[0]) + '" cy="' + r.Y(o.doel[1]) + '" r="11"/>');
          svg.classList.remove('zweeft', 'tikbaar'); svg.setAttribute('tabindex', '-1');
          Array.prototype.forEach.call(el.querySelectorAll('.schuif button'), function(k){ k.disabled = true; });
          knop.disabled = true;
          api.klaar(ok, ok ? '' : 'Het goede punt (groen gestippeld) is ' + co(o.doel) + '; jij zat op ' + co(gekozen) + '.');
        });
        /* voor de proefscripts: een echte tik op de plek van het punt */
        function tik(p){ var m = svg.getScreenCTM(), q = svg.createSVGPoint(); q.x = r.X(p[0]); q.y = r.Y(p[1]); q = q.matrixTransform(m); svg.dispatchEvent(new MouseEvent('click', { bubbles:true, clientX:q.x, clientY:q.y })); }
        el.proef = function(){ tik(o.doel); knop.click(); };
        el.proefFout = function(){ tik(zelfde(o.doel, [b.x0, b.y0]) ? [b.x1, b.y1] : [b.x0, b.y0]); knop.click(); };
      } };
  }
  function aanwijzen(niveau){
    var b = bereik(niveau), p = willekeurig(b, niveau !== 'bb');
    return aanwijs({ b:b, doel:p, onderdeel:'coördinaten: aanwijzen', onderdeelNaam:'aanwijzen', sleutel:'aw' + p.join(','),
      vraag:'Tik het punt <b>' + co(p) + '</b> aan.', opdracht:'Eerst ' + net(p[0]) + ' langs de x-as, dan ' + net(p[1]) + ' langs de y-as.',
      uitleg:'Het eerste getal is x: ' + net(Math.abs(p[0])) + ' naar ' + (p[0] >= 0 ? 'rechts' : 'links') + '. Het tweede is y: ' + net(Math.abs(p[1])) + ' ' + (p[1] >= 0 ? 'omhoog' : 'omlaag') + '.' });
  }
  /* 3. route: vanaf een punt stappen zetten */
  function route(niveau){
    var b = bereik(niveau), start = willekeurig(b, false), dx, dy, eind;
    do { dx = tussen(-4, 4); dy = tussen(-4, 4); if (niveau === 'bb'){ dx = Math.abs(dx); dy = Math.abs(dy); } eind = [start[0] + dx, start[1] + dy]; }
    while ((dx === 0 && dy === 0) || eind[0] < b.x0 || eind[0] > b.x1 || eind[1] < b.y0 || eind[1] > b.y1);
    var stappen = [];
    if (dx) stappen.push(Math.abs(dx) + ' naar ' + (dx > 0 ? 'rechts' : 'links'));
    if (dy) stappen.push(Math.abs(dy) + ' ' + (dy > 0 ? 'omhoog' : 'omlaag'));
    if (Math.random() < 0.5) stappen.reverse();
    return { onderdeel:'coördinaten: route', onderdeelNaam:'route', vorm:'invul', sleutel:'ro' + start.join(',') + dx + dy,
      vraag:'Je start op <b>' + co(start) + '</b> en gaat ' + stappen.join(' en ') + '. Waar kom je uit?', opdracht:'x verandert bij links en rechts, y bij omhoog en omlaag.',
      beeld: rooster({ b:b, punten:[{ p:start, naam:'start' }] }).html,
      velden:[{ label:'x', antwoord:eind[0] }, { label:'y', antwoord:eind[1] }],
      uitleg:'x: ' + start[0] + (dx >= 0 ? ' + ' + dx : ' − ' + Math.abs(dx)) + ' = ' + eind[0] + '. y: ' + start[1] + (dy >= 0 ? ' + ' + dy : ' − ' + Math.abs(dy)) + ' = ' + eind[1] + '. Je komt uit op ' + co(eind) + '.', antwoordTekst: co(eind) };
  }
  /* 4. figuur: het vierde punt van een rechthoek of vierkant, of het spiegelbeeld (hv) */
  function figuur(niveau){
    var b = bereik(niveau);
    if (niveau === 'hv' && Math.random() < 0.5){
      var p = willekeurig(b, true), as = kies(['x', 'y']), sp = as === 'x' ? [p[0], -p[1]] : [-p[0], p[1]];
      return aanwijs({ b:b, doel:sp, onderdeel:'coördinaten: figuur', onderdeelNaam:'figuur en spiegelen', sleutel:'sp' + p.join(',') + as,
        vraag:'Spiegel het punt <b>' + co(p) + '</b> in de <b>' + as + '-as</b>. Tik het spiegelbeeld aan.', opdracht:'Bij spiegelen in de x-as wisselt y van teken; bij de y-as wisselt x.',
        uitleg:'Spiegelen in de ' + as + '-as: ' + (as === 'x' ? 'y' : 'x') + ' wordt tegengesteld, de andere blijft. ' + co(p) + ' wordt ' + co(sp) + '.', extra:{ punten:[{ p:p, naam:'P' }] } });
    }
    var w = tussen(2, 4), h = niveau === 'bb' ? tussen(2, 4) : tussen(1, 4), vierkant = Math.random() < 0.4; if (vierkant) h = w;
    var x0 = tussen(b.x0, b.x1 - w), y0 = tussen(b.y0, b.y1 - h);
    var hoeken = [[x0, y0], [x0 + w, y0], [x0 + w, y0 + h], [x0, y0 + h]], weg = tussen(0, 3), doel = hoeken[weg], rest = hoeken.filter(function(q, i){ return i !== weg; });
    return aanwijs({ b:b, doel:doel, onderdeel:'coördinaten: figuur', onderdeelNaam:'figuur en spiegelen', sleutel:'fig' + hoeken.join(''),
      vraag:'Drie hoekpunten van een <b>' + (vierkant ? 'vierkant' : 'rechthoek') + '</b> staan er al: ' + rest.map(co).join(', ') + '. Tik het vierde hoekpunt aan.',
      opdracht:'De zijden lopen langs de roosterlijnen.',
      uitleg:'Het vierde hoekpunt heeft de x van het punt erboven of eronder en de y van het punt ernaast: ' + co(doel) + '.',
      extra:{ punten: rest.map(function(q, i){ return { p:q, naam:['A', 'B', 'C'][i] }; }), figuur: rest } });
  }

  var SOORTEN = { aflezen: aflezen, aanwijzen: aanwijzen, route: route, figuur: figuur };
  VAKSPEL.maak({
    id:'coordinaten', naam:'Schatzoeken met coördinaten', vak:'wis', kleur:'#F26749',
    hand:'eerst x, dan y',
    lead:'Een assenstelsel met een schat: lees af waar hij ligt, tik een punt aan bij gegeven coördinaten, volg een route en maak een rechthoek af. Op havo en vwo ook met vier kwadranten, halve coördinaten en spiegelen in een as.',
    hoe:[
      { kop:'Eerst x, dan y', tekst:'Coördinaten schrijf je als (x, y): eerst hoeveel je naar <b>rechts</b> gaat, dan hoeveel <b>omhoog</b>. (3, 5) is 3 naar rechts en 5 omhoog.' },
      { kop:'Negatief', tekst:'Links van de y-as is x negatief, onder de x-as is y negatief. De oorsprong O is (0, 0).' },
      { kop:'Aanwijzen', tekst:'Bij aanwijzen tik je een roosterpunt aan; de stip verschijnt, en met Nakijken zie je of hij goed staat.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb', uit:'Alleen het eerste kwadrant: x en y van 0 tot 10.' },
        { id:'kgt', naam:'vmbo-kgt en tl', uit:'Vier kwadranten, van -5 tot 5, met negatieve stappen.' },
