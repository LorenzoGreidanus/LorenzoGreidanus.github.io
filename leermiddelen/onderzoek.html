<style>
/* Het proefje, de tabel en de grafiek lezen hun kleuren uit de tokens van vakspel.css,
   zodat de donkere stand meekantelt. Alleen de rand van het proefje heeft de spelkleur. */
.eg-sit,.eg-kort{max-width:62ch;width:100%;text-align:left;background:var(--kaart2);border-left:4px solid var(--spelkleur);border-radius:0 14px 14px 0;padding:13px 18px 13px 16px;font-size:1.02rem;line-height:1.6}
.eg-kort{font-size:.94rem;padding:9px 16px;color:var(--muted);background:none;border-left-width:3px;border-radius:0}
.eg-claim{max-width:62ch;width:100%;text-align:left;font-size:.96rem;line-height:1.55;padding:10px 14px;border-radius:12px;background:var(--kaart2);border:2px solid transparent}
.eg-toon .eg-claim.mis{background:var(--fout-bg);border-color:var(--fout)}
.eg-wrap{display:grid;gap:10px;justify-items:center;width:100%}
.eg-tab{border-collapse:collapse;width:100%;max-width:640px;font-size:.88rem;background:var(--kaart)}
.eg-tab caption{caption-side:top;text-align:left;font-size:.82rem;color:var(--muted);font-weight:600;padding:0 2px 6px}
.beeld .eg-tab td,.beeld .eg-tab th{padding:7px 9px;text-align:left;vertical-align:top;line-height:1.35;min-width:0}
.beeld .eg-tab thead th{background:var(--kaart2);font-weight:600}
.beeld .eg-tab tbody th{background:var(--kaart2);font-weight:600;width:34%}
.beeld .eg-tab.getal td,.beeld .eg-tab.getal thead th+th{text-align:center}
.beeld .eg-tab.getal tbody th{width:auto}
.beeld .eg-tab tr.som td,.beeld .eg-tab tr.som th{font-weight:700;background:var(--kaart2)}
.eg-toon .eg-tab tr[data-mis] th,.eg-toon .eg-tab tr[data-mis] td{background:var(--fout-bg);color:var(--fout)}
.eg-grafiek{width:min(100%,420px);height:auto;display:block;font-family:inherit}
.eg-grafiek text{fill:var(--muted);font-size:12px;font-weight:600}
.eg-grafiek .titel{fill:var(--ink);font-size:12.5px}
.eg-grafiek .waarde{fill:var(--ink);font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--kaart);stroke-width:4px;stroke-linejoin:round}
.eg-grafiek .as{stroke:var(--ink);stroke-width:1.5}
.eg-grafiek .raster{stroke:var(--rand2);stroke-width:1}
.eg-grafiek .staaf{fill:var(--nadruk)}
body.groot .eg-sit{font-size:1.25rem}
/* de stappen van een onderzoek: elke stap een eigen rij, anders staan lange zinnen in smalle kolommen */
body.eg-stap .vakken.rij{grid-template-columns:1fr}
body.eg-stap .vakken.rij .sleepdoel{flex-direction:row;align-items:center;min-height:58px;gap:10px}
body.eg-stap .vakken.rij .doelknop{width:auto;flex:none}
body.eg-stap .vakken.rij .sleepdoel .inhoud{justify-content:flex-start;flex:1;min-height:32px}
body.eg-stap .sleepkaart{text-align:left;font-weight:500;font-size:.92rem;display:flex}
body.eg-stap .kaartjes{flex-direction:column;align-items:stretch}
@media(max-width:560px){.eg-sit{font-size:.97rem;padding:11px 14px}.eg-tab{font-size:.82rem}.beeld .eg-tab td,.beeld .eg-tab th{padding:6px 7px}}
</style>

<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function cap(t){ t = String(t); return t.charAt(0).toUpperCase() + t.slice(1); }
  function lc(t){ t = String(t); return t.charAt(0).toLowerCase() + t.slice(1); }
  function afr(v, d){ var m = Math.pow(10, d || 0); return Math.round(v * m) / m + 0; }
  function fmt(v, d){ return (d ? Number(v).toFixed(d) : String(Math.round(v))).replace('.', ','); }
  function haak(v, d){ return v < 0 ? '(' + fmt(v, d) + ')' : fmt(v, d); }
  var NIV = { bb:1, kgt:2, hv:3 };
  function nr(niveau){ return NIV[niveau] || 2; }
  function trek(r, d){ var v = r[0] + Math.random() * (r[1] - r[0]); return (d ? Math.round(v * 10) / 10 : Math.round(v)) + 0; }
  function uniek(a){ var z = {}, u = []; a.forEach(function(t){ if (!z[t]){ z[t] = 1; u.push(t); } }); return u; }
  function gemiddelde(a){ return a.reduce(function(s, x){ return s + x; }, 0) / a.length; }

  /* ---------- de proefjes ----------
     sit: het verhaal; iv, dv: wat je verandert en meet; gelijk: wat je gelijk houdt;
     rows: dingen die je gelijk houdt, met een gelijke en een verschillende versie voor de tabel;
     A, B: de twee groepen; meetG, meetF, verkeerd: een goede, een slordige en een verkeerde meting;
     v1, v2: onderzoeksvragen; vF: foute vragen; hG, hR, hRF, hF: hypothese, verklaring, foute verklaringen, foute hypotheses;
     lv: de gemeten niveaus van de iv met een bereik voor de uitkomst; nul: twee bijna gelijke situaties;
     buiten, anders: conclusies die niet uit de meting volgen; plan, uitv, res, concl, eval: de stappen */
  var P = [
    { id:'bonen', niv:1, ex:'bonen', ex1:'boon', soort:'zaden', dec:0, ymax:10,
      titel:'kiemende bonen',
      kort:'Noor liet bonen een week kiemen bij verschillende temperaturen.',
      sit:'Noor wil weten of bonen beter kiemen als het warm is. Ze legt tien bonen op een natte tissue in de kast (20 °C) en tien bonen op een natte tissue in de koelkast (4 °C). Na een week telt ze hoeveel bonen zijn gekiemd.',
      ivNaam:'temperatuur', iv:'de temperatuur', dv:'het aantal bonen dat gekiemd is', dvZ:'het aantal gekiemde bonen',
      gelijk:['de hoeveelheid water op de tissue','het soort bonen','het bakje waar de bonen in liggen','de tijd die je wacht'],
      rows:[{ k:'de hoeveelheid water', g:'5 ml per dag', v:['5 ml per dag', '20 ml per dag'] },
            { k:'het soort bonen', g:'bruine bonen', v:['bruine bonen', 'witte bonen'] },
            { k:'het bakje', g:'bakje met deksel', v:['bakje met deksel', 'open bakje'] },
            { k:'de tijd tot het tellen', g:'7 dagen', v:['7 dagen', '3 dagen'] }],
      A:'20 °C (in de kast)', B:'4 °C (in de koelkast)',
      meetG:'na 7 dagen tellen hoeveel bonen een wortel hebben', meetF:'na 7 dagen op het oog schatten of er veel bonen gekiemd zijn', verkeerd:'na 7 dagen de bonen wegen',
      sel:['de grootste bonen', 'de kleinste bonen'],
      claim:'Na een week zijn 9 van de 10 bonen gekiemd. Noor schrijft: "Dus warmte laat bonen kiemen."',
      v1:'Kiemen er meer bonen bij 20 °C dan bij 4 °C?',
      v2:'Wat is het effect van de temperatuur op het aantal bonen dat in een week kiemt?',
      vF:[['Hoe groeien bonen?', 'vaag'], ['Zijn bonen lekkerder als ze warm staan?', 'mening'], ['Kiemen bonen alleen als er licht is?', 'ander']],
      hG:'Als bonen bij 20 °C staan, kiemen er in een week meer dan bij 4 °C',
      hR:'omdat de enzymen in het zaad bij 20 °C sneller werken dan bij 4 °C',
      hRF:[['omdat bonen in de koelkast te weinig zuurstof krijgen', 'In de koelkast zit gewoon lucht met zuurstof. Het verschil in deze proef is de temperatuur.'],
           ['omdat bonen in de kast meer licht krijgen', 'Licht verandert niet in deze proef, en een zaad heeft geen licht nodig om te kiemen.']],
      hF:[['Bonen zijn handige zaden.', 'mening'], ['Als bonen in het licht staan, kiemen er meer dan in het donker.', 'ander'], ['Kiemen bonen bij 20 °C?', 'vraag']],
      lv:[{ k:'4 °C', n:'bij 4 °C', v:[0, 1] }, { k:'12 °C', n:'bij 12 °C', v:[3, 5] }, { k:'20 °C', n:'bij 20 °C', v:[8, 10] }],
      axis:'gekiemde bonen (van 10)', eenh:'bonen',
      wz:function(n, v){ return v === 1 ? cap(n) + ' is er 1 boon gekiemd.' : cap(n) + ' zijn er ' + v + ' bonen gekiemd.'; },
      trend:'Hoe warmer, hoe meer bonen kiemen.', trendOm:'Hoe warmer, hoe minder bonen kiemen.',
      nul:{ a:{ k:'19 °C', n:'bij 19 °C' }, b:{ k:'20 °C', n:'bij 20 °C' }, base:7, u:1, kort:'Noor vergelijkt nu twee bijna gelijke temperaturen.' },
      buiten:'Bij 60 °C kiemen nog meer bonen.', bR:'Je mat alleen 4, 12 en 20 °C. Bij 60 °C gaat een zaad juist dood.',
      anders:'De bonen in de koelkast kiemden minder omdat ze te weinig licht kregen.',
      plan:'Je bedenkt vooraf: tien bonen in de kast (20 °C), tien in de koelkast (4 °C), en water, soort en bakje houd je gelijk.',
      uitv:'Je legt de bonen op natte tissues in bakjes, zet de bakjes weg en laat ze een week staan.',
      res:'Je telt per bakje hoeveel bonen gekiemd zijn en zet de aantallen in een tabel.',
      concl:'Je schrijft: bij 20 °C kiemen meer bonen dan bij 4 °C, dus je hypothese klopt.',
      eval:'Je kijkt terug: met meer bonen per bakje en een herhaling is de proef betrouwbaarder.' },

    { id:'licht', niv:1, ex:'zaadjes', ex1:'zaadje', soort:'planten', dec:1, n:20,
      titel:'tuinkers in licht en donker',
      kort:'Daan liet tuinkers zes dagen groeien bij verschillende hoeveelheden licht.',
      sit:'Daan wil weten of tuinkers licht nodig heeft. Hij laat tuinkers groeien op twee bakjes met natte watten. Het ene bakje staat bij het raam, het andere in een gesloten kast. Na zes dagen meet hij de lengte van de stengels.',
      ivNaam:'hoeveelheid licht', iv:'de hoeveelheid licht', dv:'de lengte van de stengels', dvZ:'de lengte van de stengels',
      gelijk:['het aantal zaadjes per bakje','de hoeveelheid water','de temperatuur','het soort zaadjes'],
      rows:[{ k:'de hoeveelheid water', g:'10 ml per dag', v:['10 ml per dag', '30 ml per dag'] },
            { k:'de temperatuur', g:'20 °C', v:['20 °C', '12 °C'] },
            { k:'het soort zaadjes', g:'tuinkers', v:['tuinkers', 'tuinkers van een andere soort'] },
            { k:'de ondergrond', g:'natte watten', v:['natte watten', 'aarde'] }],
      A:'in het licht (bij het raam)', B:'in het donker (in de kast)',
      meetG:'na 6 dagen van tien stengels de lengte in mm meten met een liniaal', meetF:'na 6 dagen op het oog schatten welke stengels langer zijn', verkeerd:'na 6 dagen tellen hoeveel zaadjes er in het bakje liggen',
      sel:['de grootste zaadjes', 'de kleinste zaadjes'],
      claim:'Na zes dagen zijn de stengels in het bakje bij het raam 4 cm lang. Daan schrijft: "Dus licht laat tuinkers groeien."',
      v1:'Zijn de stengels van tuinkers langer in het donker dan in het licht?',
      v2:'Wat is het effect van de hoeveelheid licht op de stengellengte van tuinkers na zes dagen?',
      vF:[['Hoe groeit een plant?', 'vaag'], ['Is tuinkers mooier in het licht?', 'mening'], ['Groeit tuinkers sneller bij warmte dan bij kou?', 'ander']],
      hG:'Als tuinkers in het donker staat, zijn de stengels na zes dagen langer dan in het licht',
      hR:'omdat de plant in het donker extra lang uitgroeit om het licht te zoeken',
      hRF:[['omdat de plant in het donker meer voedsel maakt', 'Zonder licht kan de plant geen fotosynthese doen en dus geen voedsel maken.'],
           ['omdat tuinkers in het licht niet kan groeien', 'In het licht groeit tuinkers juist wel, alleen korter en steviger.']],
      hF:[['Tuinkers is een leuke plant.', 'mening'], ['Als tuinkers warmer staat, zijn de stengels langer.', 'ander'], ['Zijn de stengels langer in het donker?', 'vraag']],
      lv:[{ k:'licht', n:'in het licht', v:[3.0, 4.0] }, { k:'half licht', n:'in halfschaduw', v:[4.6, 5.6] }, { k:'donker', n:'in het donker', v:[6.0, 8.0] }],
      axis:'stengellengte (cm)', eenh:'cm',
      wz:function(n, v){ return cap(n) + ' is de stengel ' + fmt(v, 1) + ' cm lang.'; },
      trend:'Hoe minder licht, hoe langer de stengels.', trendOm:'Hoe minder licht, hoe korter de stengels.',
      nul:{ a:{ k:'links', n:'bij het linkerraam' }, b:{ k:'rechts', n:'bij het rechterraam' }, base:3.5, u:0.2, kort:'Daan zet de bakjes nu bij twee gelijke ramen.' },
      buiten:'In het donker groeit tuinkers beter.', bR:'Je mat alleen de lengte, niet of de plant gezond is. In het donker worden planten lang, maar ook bleek en zwak.',
      anders:'De stengels zijn langer omdat het in de kast warmer is.',
      plan:'Je bedenkt vooraf: twee bakjes met twintig zaadjes, een in het licht en een in het donker, en water, temperatuur en soort houd je gelijk.',
      uitv:'Je zaait de zaadjes op natte watten, zet de bakjes op hun plek en geeft elke dag water.',
      res:'Je meet na zes dagen de stengels in millimeters en zet de gemiddelden in een tabel.',
      concl:'Je schrijft: in het donker zijn de stengels langer dan in het licht, dus je hypothese klopt.',
      eval:'Je kijkt terug: je kunt ook de kleur noteren, want de planten uit het donker zijn lang maar bleek.' },

    { id:'hartslag', niv:1, ex:'klasgenoten', ex1:'klasgenoot', soort:'mensen', dec:0,
      titel:'hartslag na het rennen',
      kort:'Sven mat de hartslag van een klasgenoot in rust en na rennen.',
      sit:'Sven wil weten wat rennen met je hartslag doet. Een klasgenoot telt eerst in rust zijn hartslag. Daarna rent hij op de plaats: één keer 1 minuut en één keer 3 minuten. Direct na het rennen telt Sven de polsslag een halve minuut en rekent dat om naar slagen per minuut.',
      ivNaam:'duur van het rennen', iv:'hoe lang je rent', dv:'de hartslag', dvZ:'de hartslag',
      gelijk:['de persoon die rent','het tempo waarmee je rent','het moment waarop je de hartslag telt','de ondergrond waarop je rent'],
      rows:[{ k:'het tempo', g:'rustig draven', v:['rustig draven', 'sprinten'] },
            { k:'het moment van meten', g:'direct na het rennen', v:['direct na het rennen', '2 minuten na het rennen'] },
            { k:'de leeftijd van de groep', g:'allemaal 14 jaar', v:['allemaal 14 jaar', 'allemaal 25 jaar'] },
            { k:'de ondergrond', g:'de sportzaal', v:['de sportzaal', 'het zand op het strand'] }],
      A:'rent 3 minuten', B:'rent 1 minuut',
      meetG:'direct na het rennen 30 seconden de polsslag tellen en omrekenen naar slagen per minuut', meetF:'na het rennen op het gevoel zeggen hoe snel het hart klopt', verkeerd:'na het rennen tellen hoe vaak je per minuut ademhaalt',
      sel:['de sportiefste klasgenoten', 'de minst sportieve klasgenoten'],
      claim:'Na 3 minuten rennen is zijn hartslag 130 slagen per minuut. Sven schrijft: "Dus rennen maakt je hartslag hoger."',
      v1:'Wordt je hartslag hoger als je langer rent?',
      v2:'Wat is het effect van de duur van het rennen op de hartslag?',
      vF:[['Hoe werkt het hart?', 'vaag'], ['Is rennen leuker dan wandelen?', 'mening'], ['Rent een oudere persoon langzamer dan een jonge?', 'ander']],
      hG:'Als je langer rent, is je hartslag hoger',
      hR:'omdat je spieren dan meer zuurstof nodig hebben en je hart het bloed sneller rondpompt',
      hRF:[['omdat je hart bij het rennen kleiner wordt', 'Je hart wordt niet kleiner. Het pompt juist sneller en harder.'],
           ['omdat je bloed bij het rennen minder zuurstof bevat', 'Het gaat om de behoefte van je spieren aan zuurstof. Je bloed bevat bij het rennen niet minder zuurstof.']],
      hF:[['Rennen is gezond.', 'mening'], ['Als je harder rent, word je sneller moe.', 'ander'], ['Is je hartslag hoger na rennen?', 'vraag']],
      lv:[{ k:'rust', n:'in rust', v:[65, 80] }, { k:'1 min', n:'na 1 minuut rennen', v:[100, 115] }, { k:'3 min', n:'na 3 minuten rennen', v:[125, 145] }],
      axis:'hartslag (slagen per minuut)', eenh:'slagen per minuut',
      wz:function(n, v){ return cap(n) + ' is de hartslag ' + v + ' slagen per minuut.'; },
      trend:'Hoe langer je rent, hoe hoger je hartslag.', trendOm:'Hoe langer je rent, hoe lager je hartslag.',
      nul:{ a:{ k:'gras', n:'na rennen op gras' }, b:{ k:'baan', n:'na rennen op de atletiekbaan' }, base:130, u:3, kort:'Sven laat nu 3 minuten rennen op gras of op de atletiekbaan.' },
      buiten:'Na 10 minuten rennen is je hartslag nog veel hoger.', bR:'Je mat alleen tot 3 minuten rennen. Wat er na 10 minuten gebeurt, weet je niet.',
      anders:'Je hartslag wordt hoger omdat je gaat zweten.',

      res:'Je telt direct na het rennen de polsslag, rekent om naar slagen per minuut en zet de gemiddelden in een tabel.',
      concl:'Je schrijft: na langer rennen is de hartslag hoger, dus je hypothese klopt.',
      eval:'Je kijkt terug: klasgenoten verschillen in conditie, dus je laat iedereen beide keren rennen.' },

    { id:'schimmel', niv:1, ex:'sneetjes brood', ex1:'sneetje brood', soort:'broodsoorten', dec:0,
      titel:'schimmel op brood',
      kort:'Fenna bewaarde brood een week bij verschillende temperaturen.',
      sit:'Fenna wil weten waar brood het snelst beschimmelt. Ze doet drie sneetjes brood met een druppel water in dichte zakjes. Een zakje gaat in de koelkast (4 °C), een op de kamer (20 °C) en een op een warme plek (28 °C). Na een week meet ze hoeveel cm² schimmel er op elk sneetje zit.',
      ivNaam:'temperatuur', iv:'de temperatuur', dv:'het oppervlak van de schimmel', dvZ:'het oppervlak van de schimmel',
      gelijk:['het soort brood','de hoeveelheid water in het zakje','de tijd die je wacht','het soort zakje'],
      rows:[{ k:'het soort brood', g:'witbrood', v:['witbrood', 'volkorenbrood'] },
            { k:'de hoeveelheid water', g:'1 druppel', v:['1 druppel', '10 druppels'] },
            { k:'het zakje', g:'dicht', v:['dicht', 'open'] },
            { k:'de dikte van het sneetje', g:'1 cm', v:['1 cm', '2 cm'] }],
      A:'bij 28 °C (warme plek)', B:'bij 4 °C (koelkast)',
      meetG:'na een week met een rooster van cm² meten hoeveel schimmel er op elk sneetje zit', meetF:'na een week op het oog schatten hoeveel schimmel er zit', verkeerd:'na een week aan de zakjes ruiken',
      sel:['het oudste brood', 'het verste brood'],
      claim:'Na een week zit er 25 cm² schimmel op het brood op de warme plek. Fenna schrijft: "Dus warmte laat schimmel groeien."',
      v1:'Groeit er meer schimmel op brood bij 28 °C dan bij 4 °C?',
      v2:'Wat is het effect van de temperatuur op het oppervlak schimmel op brood na een week?',
      vF:[['Hoe ontstaat schimmel?', 'vaag'], ['Is beschimmeld brood vies?', 'mening'], ['Groeit er meer schimmel op witbrood dan op volkorenbrood?', 'ander']],
      hG:'Als brood warmer ligt, zit er na een week meer schimmel op',
      hR:'omdat de enzymen van de schimmel bij warmte sneller werken, waardoor hij sneller groeit',
      hRF:[['omdat schimmel in de koelkast doodgaat door het licht', 'In de koelkast is het juist donker. Schimmel groeit er gewoon langzamer.'],

      uitleg:'Dit is de stap ' + S(goed.naam) + ': ' + S(goed.uit) + '. ' + andere.map(function(s){ return S(cap(s.naam)) + ' is ' + S(s.uit) + '.'; }).join(' ')
    };
  }
  function stappen(niveau){ return Math.random() < 0.5 ? stapVolgorde(niveau) : welkeStap(niveau); }

  var SOORTEN = { vraag:vraagOnderdeel, variabelen:variabelen, eerlijk:eerlijk, conclusie:conclusie, stappen:stappen };
  VAKSPEL.maak({
    id:'onderzoek', naam:'Het eerlijke experiment', vak:'bio', kleur:'#0d7b8a',
    hand:'verander één ding, meet één ding',
    lead:'Kiemende bonen, tuinkers in het donker, je hartslag na het rennen, schimmel op brood, gist en pissebedden: met proefjes ontdek je hoe de natuur werkt. Maar alleen als de proef eerlijk is. Je oefent met de vraag en de hypothese, met wat je verandert, meet en gelijk houdt, met het zoeken van fouten in een proef en met een conclusie die echt uit je meting volgt.',
    leerdoel:'Je leert een onderzoek opzetten en lezen: een goede vraag en hypothese, de variabelen, een eerlijke proef en een conclusie die klopt met wat je gemeten hebt.',
    hoe:[
      { kop:'Een ding tegelijk', tekst:'In een eerlijke proef verander je <b>één ding</b>, je meet <b>één ding</b> en al het andere houd je <b>gelijk</b>. Anders weet je niet waar een verschil vandaan komt.' },
      { kop:'Niet meer en niet minder', tekst:'Een conclusie volgt uit wat je gemeten hebt. Geen verschil gemeten? Dan zeg je dat. Een verschil gemeten bij een proefje? Dan bewijs je nog niet dat het voor alles geldt.' },
      { kop:'Vijf onderdelen', tekst:'De vraag en hypothese, de variabelen, is het eerlijk, de conclusie en de stappen van een onderzoek. Twintig opgaven per ronde, elk met uitleg.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb', uit:'Zeven eenvoudige proefjes. Wat verander je, wat meet je en wat houd je gelijk, en drie fouten die je in een proef kunt vinden.' },
        { id:'kgt', naam:'vmbo-kgt en tl', uit:'Ook de begrippen onafhankelijke en afhankelijke variabele en controlegroep, een slordige meting, en grafieken met drie waarden.' },
        { id:'hv', naam:'havo en vwo', uit:'Ook betrouwbaarheid, herhalen en gemiddelden, groepen eerlijk verdelen, en conclusies uit tabellen met spreiding.' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' }, { id:'vraag', naam:'vraag en hypothese' }, { id:'variabelen', naam:'variabelen' }, { id:'eerlijk', naam:'eerlijke proef', uit:'Is de proef eerlijk, en wat moet er anders?' }, { id:'conclusie', naam:'conclusie' }, { id:'stappen', naam:'stappen' } ] }
    ],
    aantal:10,
    maak:function(keuze, nrOpg){
      var soort = keuze.soort === 'alles' ? kies(['vraag', 'variabelen', 'eerlijk', 'conclusie', 'stappen']) : keuze.soort;
      var o = SOORTEN[soort](keuze.niveau), oud = o.na;
      o.na = function(vak){ document.body.classList.toggle('eg-stap', !!o.stapLijst); if (oud) oud(vak); };
      return o;
    },
    uitleg:{ doel:'Een onderzoek opzetten en lezen: vraag, hypothese, variabelen, een eerlijke proef en een conclusie die uit je meting volgt.', tijd:'twintig opgaven per ronde, of kies 10 of 30', bediening:'Kies het antwoord dat klopt (of druk op 1 tot 4). Bij de variabelen en de stappen sleep je kaartjes; op een telefoon tik je een kaartje en dan het vak. Bij een getal vul je het in en druk je op Nakijken.' }
  });
})();
