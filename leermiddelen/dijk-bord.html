<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Dijkbouwers · bord</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../fonts.css?v=2">
<script src="avatar.js"></script>
<style>
html,body{height:100%}
body{margin:0;background:#07102A;font-family:Poppins,system-ui,sans-serif;color:#F3EFE9;overflow:hidden}
.bord{position:absolute;left:0;top:0;width:1366px;height:768px;overflow:hidden;background:#0B1430;transform-origin:0 0}
.laag{position:absolute;left:-40px;top:0;width:1446px;height:768px}
.laag svg{display:block;width:1446px;height:768px}
.ver{animation:drift 26s ease-in-out infinite alternate}
.midden2{animation:drift 26s ease-in-out infinite alternate;animation-name:drift2}
.voor{animation:drift3 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(8px)}}
@keyframes drift2{to{transform:translateX(18px)}}
@keyframes drift3{to{transform:translateX(44px)}}
.golf{animation:golf 4.5s ease-in-out infinite alternate}
.golf2{animation:golf 6s ease-in-out infinite alternate-reverse}
@keyframes golf{to{transform:translateX(-36px)}}
.gloed{animation:flakker 3.2s ease-in-out infinite}
@keyframes flakker{0%,100%{opacity:.85}50%{opacity:1}}
.stof circle{animation:zweef 9s linear infinite}
@keyframes zweef{from{transform:translateY(0)}to{transform:translateY(-90px)}}
.valt{animation:val 2.6s cubic-bezier(.5,0,.9,.6) infinite}
@keyframes val{0%{transform:translateY(-60px);opacity:0}15%{opacity:1}70%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.spat{animation:spat 3.2s ease-out infinite;transform-origin:50% 100%}
@keyframes spat{0%,38%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1)}72%,100%{opacity:0;transform:scale(1.35) translateY(-6px)}}
.deining{animation:deining 5.5s ease-in-out infinite alternate}
@keyframes deining{to{transform:translateY(-8px)}}
.rol{animation:rol linear infinite}
@keyframes rol{from{transform:translateX(calc(-1 * var(--p)))}to{transform:translateX(0)}}
.dein{animation:dein ease-in-out infinite alternate}
@keyframes dein{from{transform:translateY(calc(-1 * var(--a)))}to{transform:translateY(var(--a))}}
.glim{animation:glim 2.6s ease-in-out infinite}
@keyframes glim{0%,100%{opacity:.08}50%{opacity:.85}}
.swash{animation:swash 3.2s ease-in-out infinite}
@keyframes swash{0%{transform:translate(-12px,26px);opacity:0}20%{opacity:1}50%{transform:translate(0,0);opacity:1}85%{transform:translate(-9px,19px);opacity:.6}100%{transform:translate(-12px,26px);opacity:0}}
.wuif{transform-box:fill-box;transform-origin:50% 100%;animation:wuif 2.8s ease-in-out infinite alternate}
@keyframes wuif{from{transform:skewX(-4deg)}to{transform:skewX(12deg)}}
.wuif.traag{animation-name:wuif2;animation-duration:3.6s}
@keyframes wuif2{from{transform:skewX(-2deg)}to{transform:skewX(6deg)}}
.bundel{animation:bundel 8s ease-in-out infinite}
@keyframes bundel{0%,100%{transform:scaleX(.04);opacity:0}25%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.04);opacity:0}}
.flits{transform-box:fill-box;transform-origin:center;animation:flits 4s ease-in-out infinite}
@keyframes flits{0%,100%{opacity:1;transform:scale(1.25)}20%,80%{opacity:.55;transform:scale(.9)}}
.rook circle{transform-box:fill-box;transform-origin:center;animation:rook 6s linear infinite}
@keyframes rook{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.35}100%{transform:translate(34px,-46px) scale(2);opacity:0}}
.boom{transform-box:fill-box;transform-origin:60% 100%;animation:boom 4.2s ease-in-out infinite alternate}
@keyframes boom{from{transform:rotate(-1deg)}to{transform:rotate(2.5deg)}}
.kaart{position:absolute;background:rgba(11,20,48,.86);border:2px solid rgba(243,239,233,.85);border-radius:18px;box-shadow:0 0 0 1px #0B1430,0 10px 30px rgba(0,0,0,.4)}
.melding{display:flex;align-items:center;gap:10px;background:rgba(11,20,48,.86);border:2px solid rgba(243,239,233,.8);border-radius:14px;padding:6px 14px 6px 8px;font-size:14px}
.melding svg{width:34px;height:34px;flex:none}
.melding{transition:opacity .6s}
.hoog{transition:transform 2.4s cubic-bezier(.3,.7,.3,1)}
.zakplek{transition:opacity .3s}
.erbij{animation:erbij .7s cubic-bezier(.5,0,.75,.4) both}
@keyframes erbij{from{transform:translateY(-120px);opacity:0}25%{opacity:1}to{transform:translateY(0);opacity:1}}
.muurdicht use{filter:drop-shadow(0 0 6px rgba(247,196,106,.9))}
.balk{height:14px;border-radius:999px;background:rgba(243,239,233,.15);overflow:hidden;position:relative}
.balk i{display:block;height:100%;background:#F2A23E;box-shadow:0 0 12px #F2A23E;border-radius:999px;transition:width 1s}
.balk b{position:absolute;top:-3px;bottom:-3px;width:3px;background:#F3EFE9;border-radius:2px}
.banier{position:absolute;left:50%;top:30px;transform:translateX(-50%) scale(.9);opacity:0;transition:opacity .6s,transform .6s;text-align:center;pointer-events:none;
  background:rgba(11,20,48,.9);border:2px solid #F7C46A;border-radius:22px;padding:16px 34px;box-shadow:0 0 40px rgba(247,196,106,.35)}
.banier.aan{opacity:1;transform:translateX(-50%) scale(1)}
.banier .k{font-family:Caveat,cursive;font-size:30px;color:#F7C46A;line-height:1}
.banier .g{font-size:40px;font-weight:600;line-height:1.15}
.banier .u{font-size:16px;color:#DCE0EA;margin-top:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s !important;animation-iteration-count:1 !important}.hoog,.balk i{transition:none}}
</style></head>
<body>
<div class="bord">
  <!-- 1. de lucht: diep navy, een gloed laag aan de horizon, een bleke maan -->
  <div class="laag" style="left:0;width:1366px">
    <svg viewBox="0 0 1366 768" width="1366" height="768" style="width:1366px">
      <defs>
        <linearGradient id="lucht" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070E26"/><stop offset=".3" stop-color="#14224C"/><stop offset=".5" stop-color="#2A3A78"/><stop offset=".58" stop-color="#6A5584"/><stop offset=".64" stop-color="#B86E5A"/><stop offset=".7" stop-color="#2A3A78"/><stop offset="1" stop-color="#14224C"/></linearGradient>
        <radialGradient id="maangloed" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FBF6F1" stop-opacity=".55"/><stop offset=".3" stop-color="#83A5F2" stop-opacity=".18"/><stop offset="1" stop-color="#83A5F2" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="1366" height="768" fill="url(#lucht)"/>
      <circle cx="440" cy="196" r="170" fill="url(#maangloed)"/>
      <circle cx="440" cy="196" r="36" fill="#F3EFE9"/>
      <circle cx="429" cy="188" r="7" fill="#DCE0EA"/><circle cx="452" cy="207" r="5" fill="#DCE0EA"/>
      <g fill="#F3EFE9" opacity=".7"><circle cx="160" cy="80" r="1.6"/><circle cx="300" cy="140" r="1.2"/><circle cx="520" cy="60" r="1.4"/><circle cx="700" cy="120" r="1.1"/><circle cx="860" cy="50" r="1.5"/><circle cx="1240" cy="90" r="1.3"/><circle cx="1300" cy="200" r="1"/><circle cx="1040" cy="150" r="1.4"/><circle cx="960" cy="230" r="1"/></g>
      <path d="M0 210 C200 196 420 214 600 204 C700 198 760 206 820 202" fill="none" stroke="#5B6BA8" stroke-width="10" stroke-linecap="round" opacity=".25"/>
      <path d="M760 250 C900 240 1100 256 1366 244" fill="none" stroke="#5B6BA8" stroke-width="8" stroke-linecap="round" opacity=".2"/>
    </svg>
  </div>
  <!-- 2. de verte: silhouetten van de polder, wazig en licht -->
  <div class="laag ver">
    <svg viewBox="0 0 1446 768">
      <defs><filter id="vaag1" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.4"/></filter></defs><g filter="url(#vaag1)"><path d="M760 520 C800 500 830 498 860 510 C880 492 920 492 940 508 L980 508 C990 470 1010 470 1016 508 L1080 508 C1110 486 1140 486 1160 504 L1220 504 L1236 420 L1246 404 L1256 420 L1272 504 L1446 500 V768 H760 Z" fill="#33447F"/>
      <g transform="translate(1310 430)" fill="#33447F"><path d="M-10 74 L-5 8 L5 8 L10 74 Z"/><path d="M0 8 L-30 -16 L-26 -20 L0 4 L26 -20 L30 -16 Z"/><path d="M0 8 L-26 34 L-30 30 L-4 6 M0 8 L26 34 L30 30 L4 6"/></g>
      <g fill="#F2A23E" opacity=".55"><rect x="1100" y="494" width="4" height="4"/><rect x="1112" y="494" width="4" height="4"/><rect x="1238" y="440" width="3" height="5"/></g></g>
    </svg>
  </div>
  <!-- 3. de zee in de verte en de polder dichterbij -->
  <div class="laag midden2">
    <svg viewBox="0 0 1446 768">
      <defs><linearGradient id="zeever" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4D8E"/><stop offset="1" stop-color="#1C2C66"/></linearGradient>
        <radialGradient id="raam" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F2A23E" stop-opacity=".9"/><stop offset="1" stop-color="#F2A23E" stop-opacity="0"/></radialGradient></defs>
      <rect x="0" y="470" width="700" height="300" fill="url(#zeever)"/>
      <path d="M0 470 H700" stroke="#C9764E" stroke-width="2" opacity=".6"/>
      <!-- vuurtoren op een rotsige kaap: rood-witte banden, een omloop met hekje, een glazen lichtkamer en een draaiende bundel -->
      <defs>
        <linearGradient id="bundelL" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#FCE0B4" stop-opacity=".55"/><stop offset="1" stop-color="#FCE0B4" stop-opacity="0"/></linearGradient>
        <linearGradient id="bundelR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FCE0B4" stop-opacity=".5"/><stop offset="1" stop-color="#FCE0B4" stop-opacity="0"/></linearGradient>
        <linearGradient id="torenlijf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9A94B4"/><stop offset=".55" stop-color="#C9C4DA"/><stop offset="1" stop-color="#E6E3F0"/></linearGradient>
        <clipPath id="torenvorm"><path d="M128 448 L137 352 L163 352 L172 448 Z"/></clipPath>
      </defs>
      <path d="M150 331 L-60 296 L-60 366 Z" fill="url(#bundelL)" class="bundel" style="transform-origin:150px 331px"/>
      <path d="M150 331 L760 290 L760 372 Z" fill="url(#bundelR)" class="bundel" style="transform-origin:150px 331px;animation-delay:-4s"/>
      <circle cx="150" cy="331" r="46" fill="url(#raam)" class="flits"/>
      <!-- de kaap: rotsen tot in zee -->
      <path d="M40 472 C52 456 70 452 84 446 C96 432 118 438 128 440 L172 440 C186 434 204 438 212 450 C228 452 246 460 262 472 Z" fill="#1A275A" stroke="#0B1430" stroke-width="3" stroke-linejoin="round"/>
      <path d="M84 446 C96 432 118 438 128 440" fill="none" stroke="#83A5F2" stroke-width="2" opacity=".35"/>
      <path d="M172 440 C186 434 204 438 212 450 C228 452 246 460 262 472" fill="none" stroke="#83A5F2" stroke-width="2.4" opacity=".55"/>
      <!-- de toren -->
      <path d="M128 448 L137 352 L163 352 L172 448 Z" fill="url(#torenlijf)"/>
      <g clip-path="url(#torenvorm)" fill="#A84A4A"><rect x="120" y="364" width="60" height="16"/><rect x="120" y="398" width="60" height="16"/><rect x="120" y="432" width="60" height="16"/></g>
      <rect x="120" y="352" width="18" height="96" fill="#0B1430" opacity=".18" clip-path="url(#torenvorm)"/>
      <path d="M128 448 L137 352 L163 352 L172 448 Z" fill="none" stroke="#0B1430" stroke-width="3" stroke-linejoin="round"/>
      <rect x="147" y="384" width="6" height="9" rx="3" fill="#F7C46A"/><rect x="146" y="418" width="7" height="10" rx="3.5" fill="#F7C46A" opacity=".85"/>
      <path d="M144 448 V436 C144 430 156 430 156 436 V448" fill="#14224C" stroke="#0B1430" stroke-width="2"/>
      <!-- omloop met hekje -->
      <rect x="130" y="347" width="40" height="6" fill="#14224C" stroke="#0B1430" stroke-width="2.5"/>
      <path d="M132 347 V339 M138 347 V339 M144 347 V339 M156 347 V339 M162 347 V339 M168 347 V339 M131 339 H169" stroke="#0B1430" stroke-width="2"/>
      <!-- lichtkamer en koepel -->
      <rect x="139" y="322" width="22" height="20" fill="#FCE0B4" class="gloed"/>
      <path d="M146 322 V342 M154 322 V342" stroke="#0B1430" stroke-width="1.6" opacity=".6"/>
      <rect x="139" y="322" width="22" height="20" fill="none" stroke="#0B1430" stroke-width="2.5"/>
      <path d="M136 323 C138 310 162 310 164 323 Z" fill="#A84A4A" stroke="#0B1430" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M150 312 V302" stroke="#0B1430" stroke-width="2.5" stroke-linecap="round"/><circle cx="150" cy="301" r="2.6" fill="#0B1430"/>
      <!-- polder: land lager dan de zee, een boerderij met warme ramen -->
      <path d="M860 560 L1446 548 V768 H860 Z" fill="#26356E"/>
      <path d="M860 560 L1446 548" stroke="#4A5C9E" stroke-width="2"/>
      <g transform="translate(1100 468)">
        <!-- een boom naast de boerderij, die zacht meebuigt -->
        <g class="boom">
          <path d="M-22 90 C-20 70 -22 52 -26 40 M-24 56 L-12 44 M-25 62 L-38 50" fill="none" stroke="#0B1430" stroke-width="5" stroke-linecap="round"/>
          <path d="M-58 44 C-70 30 -60 8 -44 8 C-42 -8 -20 -12 -10 0 C4 -4 16 10 10 24 C20 34 10 52 -6 48 C-14 58 -36 58 -42 50 C-54 56 -66 50 -58 44 Z" fill="#16224F" stroke="#0B1430" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M-58 44 C-70 30 -60 8 -44 8 C-42 -8 -20 -12 -10 0" fill="none" stroke="#83A5F2" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
        </g>
        <!-- licht dat uit de ramen en de deur op het gras valt -->
        <ellipse cx="34" cy="94" rx="44" ry="8" fill="url(#raam)" opacity=".55" class="gloed"/>
        <ellipse cx="98" cy="94" rx="40" ry="7" fill="url(#raam)" opacity=".45" class="gloed"/>
        <!-- schoorsteen met rook die met de wind meewaait -->
        <rect x="84" y="-2" width="12" height="26" fill="#2A2F5C" stroke="#0B1430" stroke-width="2.5"/>
        <rect x="82" y="-6" width="16" height="6" fill="#1C2A5C" stroke="#0B1430" stroke-width="2.5"/>
        <defs><filter id="rookvaag" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter></defs><g class="rook" fill="#8E98BC" filter="url(#rookvaag)"><circle cx="90" cy="-12" r="6"/><circle cx="90" cy="-12" r="6" style="animation-delay:-1.5s"/><circle cx="90" cy="-12" r="6" style="animation-delay:-3s"/><circle cx="90" cy="-12" r="6" style="animation-delay:-4.5s"/></g>
        <!-- muren -->
        <rect x="0" y="48" width="132" height="42" fill="#1F2B5E" stroke="#0B1430" stroke-width="3"/>
        <g stroke="#0B1430" stroke-width="1.2" opacity=".35"><path d="M0 58 H132 M0 68 H132 M0 78 H132"/></g>
        <!-- rieten dak, vol schoof aan de zijkanten -->
        <path d="M-10 52 L28 8 L104 8 L142 52 Z" fill="#4A3F63" stroke="#0B1430" stroke-width="3" stroke-linejoin="round"/>
        <g stroke="#2E2748" stroke-width="1.6" opacity=".8"><path d="M6 46 L34 14 M22 48 L44 14 M40 48 L56 12 M58 48 L68 12 M76 48 L80 12 M94 48 L92 12 M112 48 L104 12 M128 46 L110 16"/></g>
        <path d="M-10 52 L28 8 L104 8" fill="none" stroke="#83A5F2" stroke-width="2.4" stroke-linejoin="round" opacity=".55"/>
        <path d="M28 8 L104 8" stroke="#6A5584" stroke-width="4" stroke-linecap="round"/>
        <path d="M-12 53 L144 53" stroke="#0B1430" stroke-width="5" stroke-linecap="round"/>

        <g>
          <circle cx="30" cy="70" r="26" fill="url(#raam)" class="gloed"/>
          <path d="M8 60 L18 60 L18 82 L8 82 Z" fill="#A84A4A" stroke="#0B1430" stroke-width="2"/><path d="M8 60 L18 82 M18 60 L8 82" stroke="#C9C4DA" stroke-width="2"/>
          <path d="M42 60 L52 60 L52 82 L42 82 Z" fill="#A84A4A" stroke="#0B1430" stroke-width="2"/><path d="M42 60 L52 82 M52 60 L42 82" stroke="#C9C4DA" stroke-width="2"/>
          <rect x="19" y="60" width="22" height="22" fill="#F7C46A" stroke="#0B1430" stroke-width="2.4"/>
          <path d="M30 60 V82 M19 71 H41" stroke="#0B1430" stroke-width="2"/>
          <path d="M20 61 H27 C25 68 23 75 20 81 Z" fill="#D88A3A" opacity=".6"/><path d="M40 61 H34 C35 68 37 75 40 81 Z" fill="#D88A3A" opacity=".6"/>
        </g>
        <g>
          <circle cx="106" cy="70" r="24" fill="url(#raam)" class="gloed" style="animation-delay:-1.2s"/>
          <rect x="96" y="60" width="20" height="20" fill="#F7C46A" stroke="#0B1430" stroke-width="2.4"/>
          <path d="M106 60 V80 M96 70 H116" stroke="#0B1430" stroke-width="2"/>
        </g>
        <!-- deur met een lampje erboven, de bovendeur staat open -->
        <rect x="64" y="62" width="18" height="28" fill="#14224C" stroke="#0B1430" stroke-width="2.4"/>
        <rect x="66" y="64" width="14" height="11" fill="#F2A23E" opacity=".9"/>
        <circle cx="73" cy="56" r="9" fill="url(#raam)" class="gloed"/><circle cx="73" cy="56" r="2.6" fill="#FCE0B4"/>
        <!-- een hekje naar het land -->
        <g stroke="#0B1430" stroke-width="3" stroke-linecap="round"><path d="M150 90 V72 M176 90 V73 M202 90 V74 M228 89 V75"/><path d="M146 78 L232 80 M146 86 L232 87" stroke-width="2.4"/></g>
        <path d="M146 78 L232 80" stroke="#83A5F2" stroke-width="1" opacity=".5"/>
      </g>
    </svg>
  </div>
  <!-- 4. het speelveld: de dijk in doorsnede, dikke inktlijnen, het meeste contrast -->
  <div class="laag" style="left:0;width:1366px">
    <svg viewBox="0 0 1366 768" style="width:1366px">
      <defs>
        <linearGradient id="zee" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E4FA8"/><stop offset=".4" stop-color="#1B3380"/><stop offset="1" stop-color="#0D1A4A"/></linearGradient>
        <linearGradient id="dijk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A5C9E"/><stop offset="1" stop-color="#1C2A5C"/></linearGradient>
        <linearGradient id="zak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBE6C6"/><stop offset=".6" stop-color="#E8C08A"/><stop offset="1" stop-color="#B98A55"/></linearGradient>
        <linearGradient id="grasMaan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D3EE"/><stop offset=".25" stop-color="#7D92D8"/><stop offset=".6" stop-color="#3A4E9A"/><stop offset="1" stop-color="#1C2A5C"/></linearGradient>
        <linearGradient id="grasAchter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E52A0"/><stop offset="1" stop-color="#16224F"/></linearGradient>
        <linearGradient id="grasWarm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCE0B4"/><stop offset=".25" stop-color="#F2A23E"/><stop offset=".6" stop-color="#6A5584"/><stop offset="1" stop-color="#1C2A5C"/></linearGradient>
        <linearGradient id="grasDiep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7488D0"/><stop offset="1" stop-color="#2A3A78" stop-opacity=".2"/></linearGradient>
        <radialGradient id="maanVlek" cx="440" cy="560" r="300" gradientUnits="userSpaceOnUse" gradientTransform="translate(440 560) scale(.55 1) translate(-440 -560)"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></radialGradient>
        <mask id="maanMasker" maskUnits="userSpaceOnUse" x="-400" y="300" width="1200" height="600"><rect x="-400" y="300" width="1200" height="600" fill="url(#maanVlek)"/></mask>
        <radialGradient id="maanGloedWater" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#83A5F2" stop-opacity=".22"/><stop offset="1" stop-color="#83A5F2" stop-opacity="0"/></radialGradient>
        <linearGradient id="maanWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D3EE" stop-opacity=".35"/><stop offset="1" stop-color="#83A5F2" stop-opacity="0"/></linearGradient>
        <radialGradient id="lamp"cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FCE0B4" stop-opacity=".95"/><stop offset=".35" stop-color="#F2A23E" stop-opacity=".35"/><stop offset="1" stop-color="#F2A23E" stop-opacity="0"/></radialGradient>
        <g id="zak1">
          <path d="M-30 -2 C-32 -18 -18 -23 0 -23 C18 -23 32 -18 30 -2 C31 12 18 16 0 16 C-18 16 -31 12 -30 -2 Z" fill="url(#zak)" stroke="#0B1430" stroke-width="4"/>
          <path d="M-20 -13 C-7 -18 7 -18 20 -13" fill="none" stroke="#FFF8EC" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M-14 4 L-6 4 M6 6 L14 6" stroke="#8A5A2B" stroke-width="2.6" stroke-linecap="round"/>
        </g>
      </defs>
      <!-- de zee, hoog tegen de dijk -->
      <g class="hoog"><g class="deining">
        <path d="M-30 468 H620 V950 H-30 Z" fill="url(#zee)"/>
        <!-- rijen golven: ver klein en traag, dichtbij groot en snel; de wind waait van zee naar de dijk -->
        <g id="golven"></g>
        <!-- het maanlicht op het water -->

<script>
(function(){

  function el(naam, at, ouder){ var e = document.createElementNS(NS, naam); for (var k in at) e.setAttribute(k, at[k]); if (ouder) ouder.appendChild(e); return e; }
  var f = function(n){ return n.toFixed(1); };

  /* golven: elke rij is een band met spitse kammen; het patroon herhaalt na p pixels, zodat het rollen naadloos is */
  var rijen = [
    { y:482, a:2.2, L:44,  t:9,   lijf:'#24408E', kam:'#8EA4DE', kw:1.6 },
    { y:500, a:3.2, L:58,  t:8,   lijf:'#203A88', kam:'#A2B5E6', kw:2 },
    { y:524, a:4.6, L:76,  t:7.2, lijf:'#1C347E', kam:'#B4C3EC', kw:2.4, schuim:5 },

    { y:598, a:8.5, L:124, t:5.8, lijf:'#142866', kam:'#D6DEF3', kw:3.2, schuim:3 },
    { y:650, a:11,  L:156, t:5.2, lijf:'#10215A', kam:'#E3E9F7', kw:3.6, schuim:2 },
    { y:712, a:14,  L:196, t:4.6, lijf:'#0C1A4C', kam:'#F3EFE9', kw:4.2, schuim:2 }

  var golven = document.getElementById('golven');
  rijen.forEach(function(w, i){
    var volgende = rijen[i + 1] ? rijen[i + 1].y : 800, diep = volgende - w.y + 30;
    var k = w.schuim || 1, p = w.L * k, x0 = -p - w.L, x1 = 640 + p;

           + ' C' + f(x + w.L * .56) + ' ' + f(w.y - h * .7) + ' ' + f(x + w.L * .7) + ' ' + w.y + ' ' + f(x + w.L) + ' ' + w.y;

    rol = el('g', { 'class':'rol', style: stijl }, el('g', { mask:'url(#maanMasker)' }, dein));
    el('path', { d: kam, fill:'none', stroke: w.kam, 'stroke-width': w.kw + .6, 'stroke-linecap':'round', opacity: i < 2 ? .75 : 1 }, rol);

    el('path', { d: kam, fill:'none', stroke:'#0B1430', 'stroke-width': w.kw * 1.6, opacity:.35, transform:'translate(0 ' + f(w.kw * 1.8) + ')' }, rol);
    if (w.schuim){
      /* schuimkoppen op een deel van de kammen */
      var schuimRol = el('g', { 'class':'rol', style: stijl }, dein);
      var welke = []; for (var q = 0; q < k; q++) if (q === 0 || r() < .35) welke.push(q);
      for (x = x0; x < x1; x += w.L){
        if (welke.indexOf(Math.round((x - x0) / w.L) % k) < 0) continue;
        var cx = x + w.L * .5, cy = w.y - w.a * 2, s = w.a / 6;
        el('path', { d:'M' + f(cx - 16 * s) + ' ' + f(cy + 5 * s) + ' c' + f(4 * s) + ' ' + f(-9 * s) + ' ' + f(12 * s) + ' ' + f(-12 * s) + ' ' + f(18 * s) + ' ' + f(-7 * s) + ' c' + f(5 * s) + ' ' + f(-6 * s) + ' ' + f(14 * s) + ' ' + f(-3 * s) + ' ' + f(14 * s) + ' ' + f(5 * s) + ' c' + f(-10 * s) + ' ' + f(5 * s) + ' ' + f(-22 * s) + ' ' + f(5 * s) + ' ' + f(-32 * s) + ' ' + f(2 * s) + ' z',
          fill:'#F3EFE9', stroke:'#0B1430', 'stroke-width': f(Math.max(1.4, s * 2.2)), 'stroke-linejoin':'round' }, schuimRol);
        el('circle', { cx: f(cx + 8 * s), cy: f(cy - 9 * s), r: f(1.8 * s), fill:'#F3EFE9' }, schuimRol);

  /* maanspoor: losse streepjes onder de maan die oplichten en weer doven, breder naar voren */
  var spoor = document.getElementById('maanspoor');
  for (var y = 478; y < 770; y += 7 + (y - 478) * .03){
    var b = 16 + (y - 478) * .42, n = 2 + Math.floor((y - 478) / 50);
    for (var j = 0; j < n; j++){

  function pol(x, y, h, n, lean){

      var l = lean * hh * (.25 + r() * .5) + mid * 2.2, w = 1.6 + r() * 1.4;

         + ' C' + f(rx + l * .45 + w * .3) + ' ' + f(y - hh * .75) + ' ' + f(rx + w * .6) + ' ' + f(y - hh * .35) + ' ' + f(rx + w) + ' ' + f(y) + 'Z';

  }
  function achter(ouder, x0, x1, rand, h0, h1){
    /* een dichte, donkere achterste rij, in stukjes zodat ze golvend meebuigt */
    for (var x = x0; x < x1; x += 12){
      var d = '';
      for (var xx = x; xx < Math.min(x + 12, x1); xx += 3 + r() * 3) d += pol(xx, rand(xx) + 3, h0 + r() * (h1 - h0), 3, 1.1);
      el('path', { d: d, fill:'url(#grasAchter)' }, zwaai(ouder, x, true));
    }
  }

    /* binnenin: losse sprietjes als penseelstreken, dichter bij de rand, dunner naar beneden */
    var lagen = ['', '', ''];
    for (var i = 0; i < aantal; i++){
      var p = gebied(); if (!p) continue;
      var laag = p.diep < 60 ? 0 : p.diep < 150 ? 1 : 2, len = (10 - laag * 2.5) * (.6 + r() * .7);
      for (var k = 0; k < 2 + Math.floor(r() * 2); k++){
        var sx = p.x + k * 2.6 + (r() - .5) * 2, lean = 2 + r() * 4;
        lagen[laag] += 'M' + f(sx) + ' ' + f(p.y) + ' Q' + f(sx + 1) + ' ' + f(p.y - len * .6) + ' ' + f(sx + lean) + ' ' + f(p.y - len * (.7 + r() * .3));

  }

  var helling = function(x){ return x < 800 ? 430 - (x - 560) / 60 : 426 + (x - 800) * .725; };
  var polderRand = function(x){ return 600 - (x - 1040) * .03; };
  /* textuur binnenin de helling en de polder */
  streepjes(function(){ var x = 800 + r() * 236, top = helling(x), y = top + 8 + Math.pow(r(), 1.6) * (768 - top); return y < 772 ? { x: x, y: y, diep: y - top } : null; }, 420, '#93A6E2').forEach(function(e){ gb.appendChild(e); });
  /* de achterste rij en de voorste polletjes op de kruin en de helling */
  achter(gr, 746, 1042, helling, 12, 24);

<script>
/* Het bord van Dijkbouwers. strijd.html zet dit in een iframe en geeft de
   stand van de kamer door met DIJKBORD.zet(stand). Wat de klas ziet:
   - de muur groeit met de zakken tot het doel (MUUR plekken), daarna gloeit hij;
   - het water stijgt met de tijd en met de fouten, en daalt nooit;
   - wie een zak legt, komt rechtsonder in beeld met zijn eigen gezichtje.
   Er is geen ranglijst: alleen wat de klas samen doet. */
window.DIJKBORD = (function(){
  var NS = 'http://www.w3.org/2000/svg', $ = function(id){ return document.getElementById(id); };
  /* de plekken van de muur: rijen van drie en twee, als metselwerk */
  var PLEK = [], RIJEN = [[590, 652, 714], [621, 683], [590, 652, 714], [621, 683], [590, 652, 714], [621, 683]];
  RIJEN.forEach(function(r, i){ r.forEach(function(x){ PLEK.push({ x:x, y:414 - i * 34 }); }); });
  var MUUR = PLEK.length, gelegd = 0, laatsteDruk = 0, gezien = {}, meldingen = [], st = null, klokT = null;
  function schoon(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function legMuur(n, nieuw){
    var muur = $('muur');
    n = Math.max(0, Math.min(MUUR, n));
    while (muur.childNodes.length < n){
      var i = muur.childNodes.length, p = PLEK[i], g = document.createElementNS(NS, 'g'), u = document.createElementNS(NS, 'use');
      u.setAttribute('href', '#zak1'); u.setAttribute('x', p.x); u.setAttribute('y', p.y);
      g.appendChild(u); if (nieuw) g.setAttribute('class', 'erbij'); muur.appendChild(g);
    }
    while (muur.childNodes.length > n) muur.removeChild(muur.lastChild);
  }
  function tijd(ms){ ms = Math.max(0, ms); var s = Math.ceil(ms / 1000), m = Math.floor(s / 60); s = s % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
  function water(){
    if (!st || !st.dijk) return;
    var d = st.dijk, nu = Date.now() + (st.verschil || 0), duur = Math.max(1, d.eind - d.gestart);
    var t = Math.max(0, Math.min(1, (nu - d.gestart) / duur)), fout = Math.min(1, d.fouten / Math.max(10, d.doel * .5));
    /* het water daalt nooit, ook niet als de klok van het bord even verspringt */
    var druk = Math.max(laatsteDruk, Math.min(1, t * .75 + fout * .25));
    laatsteDruk = druk;
    var dy = 20 - 92 * druk;
    Array.prototype.forEach.call(document.querySelectorAll('.hoog'), function(g){ g.style.transform = 'translateY(' + dy.toFixed(1) + 'px)'; });
    $('water').textContent = '+' + (druk * 2.4).toFixed(1).replace('.', ',') + ' meter';
    $('klok').textContent = st.fase === 'einde' ? 'klaar' : 'nog ' + tijd(d.eind - nu);
  }
  function melding(sp, n){
    meldingen.unshift({ naam:sp.naam, av:sp.av || '', n:n });
    meldingen = meldingen.slice(0, 3);
    $('meldingen').innerHTML = meldingen.slice().reverse().map(function(m, i, a){
      var gezicht = window.AVATAR ? AVATAR.svg(m.naam, 34, m.av, { stemming:'blij' }) : '';
      return '<div class="melding" style="opacity:' + [.6, .8, 1][3 - a.length + i] + '">' + gezicht + '<span><b>' + schoon(m.naam) + '</b> legt ' + (m.n > 1 ? m.n + ' zakken' : 'een zak') + '</span></div>';
    }).join('');
  }
  var banKlok = null;
  function banier(k, g, u, ms){
    $('banK').textContent = k; $('banG').textContent = g; $('banU').textContent = u;
    $('banier').classList.add('aan');
    clearTimeout(banKlok);
    if (ms) banKlok = setTimeout(function(){ $('banier').classList.remove('aan'); }, ms);
  }
  function zet(nieuw){
    var eerst = !st;
    st = nieuw || {};
    if (st.nu) st.verschil = st.nu - Date.now();
    if (st.code) $('code').textContent = st.code;
    if (st.set) $('set').textContent = st.set;
    var d = st.dijk;
    var spelers = (st.spelers || []).filter(function(r){ return !r.weg; });
    $('mee').textContent = spelers.filter(function(r){ return r.aan; }).length + ' van ' + spelers.length + ' doen mee';
    /* wie er sinds de vorige stand zakken legde */
    (st.spelers || []).forEach(function(r){
      var oud = gezien[r.sid], nu = r.gehaald | 0;
      if (!eerst && oud !== undefined && nu > oud) melding(r, nu - oud);
      gezien[r.sid] = nu;
    });
    if (!d){ $('zakken').textContent = 'nog geen zandzakken'; $('doel').textContent = ''; return; }
    $('zakken').textContent = d.zakken + (d.zakken === 1 ? ' zandzak' : ' zandzakken');
    $('doel').textContent = 'doel ' + d.doel;
    $('balk').style.width = Math.min(100, d.zakken / d.doel * 100).toFixed(1) + '%';
    var n = Math.round(Math.min(1, d.zakken / d.doel) * MUUR);
    legMuur(n, !eerst && n > gelegd);
    gelegd = n;
    $('muur').setAttribute('class', d.dicht ? 'muurdicht' : '');
    if (d.dicht && !zet.dicht){ zet.dicht = true; if (!eerst) banier('het is gelukt', 'De dijk is dicht!', 'Bouw door: hoe hoger, hoe veiliger.', 7000); }
    if (st.fase === 'einde'){
      banier(d.zakken >= d.doel ? 'goed gedaan' : 'net niet',
             d.zakken >= d.doel ? 'De dijk houdt!' : 'De dijk is nog niet dicht',
             d.zakken + ' van de ' + d.doel + ' zandzakken samen, ' + d.fouten + (d.fouten === 1 ? ' fout' : ' fouten') + ' onderweg.', 0);
    }
    water();
    if (!klokT) klokT = setInterval(water, 1000);
  }
  /* het bord past op elk scherm: zo groot mogelijk, in het midden */
  function pas(){
    var b = document.querySelector('.bord'), w = innerWidth, h = innerHeight, k = Math.min(w / 1366, h / 768);
    b.style.transform = 'translate(' + ((w - 1366 * k) / 2).toFixed(1) + 'px,' + ((h - 768 * k) / 2).toFixed(1) + 'px) scale(' + k.toFixed(4) + ')';
  }
  addEventListener('resize', pas); pas();
  legMuur(0);
  return { zet: zet };
})();
</script>
