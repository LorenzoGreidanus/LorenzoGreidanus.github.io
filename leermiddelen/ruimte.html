<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function tussen(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function rond(x, d){ var f = Math.pow(10, d || 0); return Math.round(x * f * (1 + 1e-12)) / f; }
  /* een getal met een komma, en bij grote getallen een spatie tussen de duizendtallen */
  function net(x, d){
    var r = d == null ? Math.round(x * 1e6) / 1e6 : rond(x, d), neg = r < 0;
    r = Math.abs(r);
    var s = String(r); if (/e/.test(s)) s = r.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
    var delen = s.split('.'), heel = delen[0];
    if (heel.length > 4) heel = heel.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (neg ? '−' : '') + heel + (delen[1] ? ',' + delen[1] : '');
  }
  function grote(t){ return t.charAt(0).toUpperCase() + t.slice(1); }
  /* een invulveld met een afgerond antwoord. alt: de uitkomst als je een tussenstap al afrondt;
     scheelt dat precies één in de laatste decimaal, dan is die ook goed. */
  function veld(label, waarde, eenheid, d, alt){
    var sp = eenheid === '°' ? '' : ' ', r = rond(waarde, d), v = { label:label, antwoord:r, eenheid:eenheid, tol:1e-4, toon:net(r, d) + (eenheid ? sp + eenheid : '') };
    if (alt != null){
      var ra = rond(alt, d), stap = Math.pow(10, -d);
      if (Math.abs(ra - r) > 1e-9 && Math.abs(ra - r) <= stap * 1.01){ v.antwoord = (r + ra) / 2; v.tol = Math.abs(r - ra) / 2 + 1e-4; v.toon = net(r, d) + (eenheid ? sp + eenheid : '') + ' (of ' + net(ra, d) + ')'; }
    }
    return v;
  }
  var EEN = 'Rond af op één decimaal.';
  var PI_TEKST = 'Gebruik de π-knop van je rekenmachine.';

  /* ---------- vectoren ---------- */
  var RAD = Math.PI / 180;
  function plus(a, b, f){ f = f == null ? 1 : f; return [a[0] + b[0] * f, a[1] + b[1] * f, a[2] + b[2] * f]; }
  function min3(a, b){ return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function dot(a, b){ return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function eenh(a){ var l = Math.sqrt(dot(a, a)) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
  function kruis(a, b){ return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function midden(ps){ var m = [0, 0, 0]; ps.forEach(function(p){ m[0] += p[0]; m[1] += p[1]; m[2] += p[2]; }); return [m[0] / ps.length, m[1] / ps.length, m[2] / ps.length]; }

  /* ---------- tekenen ----------
     Vaste kleuren: een licht vel, lichte vlakken, donkere lijnen. Zo is elke tekening
     in de lichte en de donkere stand hetzelfde en goed te lezen. */
  var INK = '#14224C', PAP = '#FFFDF8', RAND = '#D9CDB8', LICHT = '#FFF3DE', MID = '#F4D7A6', DONKER = '#E2B877', ROOD = '#C2410C', BLAUW = '#1E4FD0';
  function hex(h){ return [1, 3, 5].map(function(i){ return parseInt(h.substr(i, 2), 16); }); }
  function meng(a, b, t){ var x = hex(a), y = hex(b); return 'rgb(' + x.map(function(v, i){ return Math.round(v + (y[i] - v) * t); }).join(',') + ')'; }
  var LAMP = eenh([-0.35, -0.55, 0.85]);
  function tint(n){ var t = Math.max(0, dot(n, LAMP)); return meng(DONKER, LICHT, Math.min(1, 0.2 + 0.8 * t)); }
  function f1(x){ return Math.round(x * 10) / 10; }
  function tekstBreed(t){ return String(t).replace(/<[^>]+>/g, '').length * 8.4; }
  function omhulsel(ps){
    ps = ps.slice().sort(function(a, b){ return a[0] - b[0] || a[1] - b[1]; });
    function x(o, a, b){ return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }
    var lo = [], hi = [], i;
    for (i = 0; i < ps.length; i++){ while (lo.length >= 2 && x(lo[lo.length - 2], lo[lo.length - 1], ps[i]) <= 0) lo.pop(); lo.push(ps[i]); }
    for (i = ps.length - 1; i >= 0; i--){ while (hi.length >= 2 && x(hi[hi.length - 2], hi[hi.length - 1], ps[i]) <= 0) hi.pop(); hi.push(ps[i]); }
    lo.pop(); hi.pop(); return lo.concat(hi);
  }
  function tekstEl(x, y, t, anker, kleur, maat){
    return '<text x="' + f1(x) + '" y="' + f1(y) + '" text-anchor="' + anker + '" fill="' + (kleur || INK) + '" font-size="' + (maat || 15) + '" font-weight="600" stroke="' + PAP + '" stroke-width="4" stroke-linejoin="round" paint-order="stroke">' + t + '</text>';
  }
  function vel(x, y, w, h, inhoud, naam, klasse){
    return '<svg class="rf' + (klasse ? ' ' + klasse : '') + '" viewBox="' + f1(x) + ' ' + f1(y) + ' ' + f1(w) + ' ' + f1(h) + '" role="img" aria-label="' + S(naam) + '" font-family="inherit">' +
      '<rect x="' + f1(x + 1) + '" y="' + f1(y + 1) + '" width="' + f1(w - 2) + '" height="' + f1(h - 2) + '" rx="12" fill="' + PAP + '" stroke="' + RAND + '"/>' + inhoud + '</svg>';
  }

  /* Een ruimtelijke tekening: een loodrechte projectie van schuin boven en rechts voor.
     az draait om de verticale as, el is hoe hoog je kijkt. Een liggende cirkel wordt zo
     een rechte ellips. */
  function scene(az, el){
    az = (az == null ? 28 : az) * RAD; el = (el == null ? 22 : el) * RAD;
    var ca = Math.cos(az), sa = Math.sin(az), cf = Math.cos(el), sf = Math.sin(el);
    var sc = { d:[sa * cf, -ca * cf, sf], er:[ca, sa, 0], items:[] };
    sc.pr = function(p){ var u = p[0] * ca + p[1] * sa, w = -p[0] * sa + p[1] * ca; return [u, -(p[2] * cf + w * sf)]; };
    sc.vlak = function(p, fill, rand){ sc.items.push({ t:'vlak', p:p, fill:fill, rand:rand }); };
    sc.lijn = function(p, o){ sc.items.push({ t:'lijn', p:p, o:o || {} }); };
    sc.romp = function(p, fill){ sc.items.push({ t:'romp', p:p, fill:fill }); };
    sc.maat = function(a, b, tekst, o){ sc.items.push({ t:'maat', a:a, b:b, tekst:tekst, o:o || {} }); };
    sc.label = function(p, tekst, o){ sc.items.push({ t:'label', q:p, tekst:tekst, o:o || {} }); };
    sc.haaks = function(p, u1, u2){ sc.items.push({ t:'haaks', q:p, u1:u1, u2:u2 }); };
    sc.boog = function(p, u1, u2, o){ sc.items.push({ t:'boog', q:p, u1:u1, u2:u2, o:o || {} }); };
    sc.pijl = function(a, b, tekst){ sc.items.push({ t:'pijl', a:a, b:b, tekst:tekst }); };
    sc.teken = function(maxB, maxH, naam, klasse){ return teken(sc, maxB, maxH, naam, klasse); };
    return sc;
  }
  function teken(sc, maxB, maxH, naam, klasse){
    var geo = [];
    sc.items.forEach(function(it){
      if (it.t === 'vlak' || it.t === 'lijn' || it.t === 'romp') it.p.forEach(function(p){ geo.push(sc.pr(p)); });
      if (it.t === 'pijl'){ geo.push(sc.pr(it.a)); geo.push(sc.pr(it.b)); }
    });
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    geo.forEach(function(q){ x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); });
    var bw = Math.max(x1 - x0, 1e-6), bh = Math.max(y1 - y0, 1e-6), s = Math.min(maxB / bw, maxH / bh);
    function T(p){ var q = sc.pr(p); return [(q[0] - x0) * s, (q[1] - y0) * s]; }
    var mid = [bw * s / 2, bh * s / 2], box = [0, 0, bw * s, bh * s], uit = '';
    function groei(x, y){ box[0] = Math.min(box[0], x); box[1] = Math.min(box[1], y); box[2] = Math.max(box[2], x); box[3] = Math.max(box[3], y); }
    function pts(a){ return a.map(function(q){ return f1(q[0]) + ',' + f1(q[1]); }).join(' '); }
    function tekst(x, y, t, anker, kleur){
      var w = tekstBreed(t), l = anker === 'middle' ? x - w / 2 : anker === 'end' ? x - w : x;
      groei(l - 3, y - 15); groei(l + w + 3, y + 5);
      return tekstEl(x, y, t, anker, kleur);
    }
    function richting(a, b){ var d = [b[0] - a[0], b[1] - a[1]], l = Math.sqrt(d[0] * d[0] + d[1] * d[1]) || 1; return [d[0] / l, d[1] / l]; }
    function anker(d){ return d[0] > 0.35 ? 'start' : d[0] < -0.35 ? 'end' : 'middle'; }
    function basis(y, d){ return y + 5 + (d[1] > 0.5 ? 5 : d[1] < -0.5 ? -3 : 0); }
    sc.items.forEach(function(it){
      var o = it.o || {};
      if (it.t === 'vlak') uit += '<polygon points="' + pts(it.p.map(T)) + '" fill="' + it.fill + '"' + (it.rand ? ' stroke="' + INK + '" stroke-width="1.8" stroke-linejoin="round"' : '') + '/>';
      else if (it.t === 'romp') uit += '<polygon points="' + pts(omhulsel(it.p.map(T))) + '" fill="' + it.fill + '" stroke="' + INK + '" stroke-width="2.2" stroke-linejoin="round"/>';
      else if (it.t === 'lijn') uit += '<polyline points="' + pts(it.p.map(T)) + '" fill="none" stroke="' + (o.kleur || INK) + '" stroke-width="' + (o.dik || (o.stip ? 1.7 : 2.2)) + '"' + (o.stip ? ' stroke-dasharray="6 5"' : '') + ' stroke-linecap="round" stroke-linejoin="round"/>';
      else if (it.t === 'maat'){
        var a = T(it.a), b = T(it.b), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], d = richting(a, b), n = [-d[1], d[0]];
        var weg = o.van ? T(o.van) : mid;
        if ((m[0] - weg[0]) * n[0] + (m[1] - weg[1]) * n[1] < 0) n = [-n[0], -n[1]];
        if (o.om) n = [-n[0], -n[1]];
        var af = o.af || 11, p = [m[0] + n[0] * af, m[1] + n[1] * af];
        uit += tekst(p[0], basis(p[1], n), it.tekst, anker(n), o.kleur);
      }
      else if (it.t === 'label'){
        var q = T(it.q);
        if (o.van){ var r = richting(T(o.van), q), af2 = o.af || 13; q = [q[0] + r[0] * af2, q[1] + r[1] * af2]; uit += tekst(q[0], basis(q[1], r), it.tekst, anker(r), o.kleur); }
        else uit += tekst(q[0] + (o.dx || 0), q[1] + (o.dy || 0) + 5, it.tekst, o.anker || 'middle', o.kleur);
      }
      else if (it.t === 'haaks'){
        var P = T(it.q), e1 = richting(P, T(plus(it.q, it.u1))), e2 = richting(P, T(plus(it.q, it.u2))), k = 10;
        uit += '<polyline points="' + pts([[P[0] + e1[0] * k, P[1] + e1[1] * k], [P[0] + (e1[0] + e2[0]) * k, P[1] + (e1[1] + e2[1]) * k], [P[0] + e2[0] * k, P[1] + e2[1] * k]]) + '" fill="none" stroke="' + INK + '" stroke-width="1.5"/>';
      }
      else if (it.t === 'boog'){
        var P2 = T(it.q), g1 = richting(P2, T(plus(it.q, it.u1))), g2 = richting(P2, T(plus(it.q, it.u2)));
        var t1 = Math.atan2(g1[1], g1[0]), t2 = Math.atan2(g2[1], g2[0]), dt = t2 - t1;
        while (dt > Math.PI) dt -= 2 * Math.PI; while (dt <= -Math.PI) dt += 2 * Math.PI;
        var rr = o.r || 24, boog = [], i;
        for (i = 0; i <= 14; i++){ var t = t1 + dt * i / 14; boog.push([P2[0] + rr * Math.cos(t), P2[1] + rr * Math.sin(t)]); }
        uit += '<polygon points="' + f1(P2[0]) + ',' + f1(P2[1]) + ' ' + pts(boog) + '" fill="' + ROOD + '" fill-opacity=".14" stroke="none"/>';
        uit += '<polyline points="' + pts(boog) + '" fill="none" stroke="' + ROOD + '" stroke-width="2"/>';
        if (o.tekst){ var tm = t1 + dt / 2, dm = [Math.cos(tm), Math.sin(tm)]; uit += tekst(P2[0] + dm[0] * (rr + 8), basis(P2[1] + dm[1] * (rr + 8), dm), o.tekst, anker(dm), ROOD); }
      }
      else if (it.t === 'pijl'){
        var A = T(it.a), B = T(it.b), dd = richting(A, B), nn = [-dd[1], dd[0]];
        uit += '<line x1="' + f1(A[0]) + '" y1="' + f1(A[1]) + '" x2="' + f1(B[0] - dd[0] * 6) + '" y2="' + f1(B[1] - dd[1] * 6) + '" stroke="' + BLAUW + '" stroke-width="3" stroke-linecap="round"/>';
        uit += '<polygon points="' + pts([B, [B[0] - dd[0] * 13 + nn[0] * 6.5, B[1] - dd[1] * 13 + nn[1] * 6.5], [B[0] - dd[0] * 13 - nn[0] * 6.5, B[1] - dd[1] * 13 - nn[1] * 6.5]]) + '" fill="' + BLAUW + '"/>';
        var terug = [-dd[0], -dd[1]];
        if (it.tekst) uit += tekst(A[0] + terug[0] * 8, basis(A[1] + terug[1] * 8, terug), it.tekst, anker(terug), BLAUW);
      }
    });
    var pad = 9;
    return vel(box[0] - pad, box[1] - pad, box[2] - box[0] + 2 * pad, box[3] - box[1] + 2 * pad, uit, naam, klasse);
  }

  /* ---------- lichamen ---------- */
  function veelvlak(sc, L){
    var V = L.V, c = midden(V), zie = [], randen = {}, volg = [];
    L.F.forEach(function(f, k){
      var n = [0, 0, 0], i;
      for (i = 0; i < f.length; i++){ var p = V[f[i]], q = V[f[(i + 1) % f.length]]; n[0] += (p[1] - q[1]) * (p[2] + q[2]); n[1] += (p[2] - q[2]) * (p[0] + q[0]); n[2] += (p[0] - q[0]) * (p[1] + q[1]); }
      var fc = midden(f.map(function(j){ return V[j]; }));
      if (dot(n, min3(fc, c)) < 0) n = [-n[0], -n[1], -n[2]];
      n = eenh(n); zie[k] = dot(n, sc.d) > 1e-4;
      if (zie[k]) sc.vlak(f.map(function(j){ return V[j]; }), tint(n));
      for (i = 0; i < f.length; i++){
        var a = f[i], b = f[(i + 1) % f.length], key = Math.min(a, b) + '-' + Math.max(a, b);
        if (!randen[key]){ randen[key] = { a:a, b:b, f:[] }; volg.push(key); }
        randen[key].f.push(k);
      }
    });
    volg.forEach(function(key){ var r = randen[key]; if (!r.f.some(function(k){ return zie[k]; })) sc.lijn([V[r.a], V[r.b]], { stip:true }); });
    volg.forEach(function(key){ var r = randen[key]; if (r.f.some(function(k){ return zie[k]; })) sc.lijn([V[r.a], V[r.b]]); });
  }
  function balkL(l, b, h){ return { V:[[0, 0, 0], [l, 0, 0], [l, b, 0], [0, b, 0], [0, 0, h], [l, 0, h], [l, b, h], [0, b, h]], F:[[0, 1, 2, 3], [4, 5, 6, 7], [0, 1, 5, 4], [1, 2, 6, 5], [2, 3, 7, 6], [3, 0, 4, 7]] }; }
  function prismaL(grond, h){
    var n = grond.length, V = [], F = [[], []], i;
    for (i = 0; i < n; i++) V.push([grond[i][0], grond[i][1], 0]);
    for (i = 0; i < n; i++) V.push([grond[i][0], grond[i][1], h]);
    for (i = 0; i < n; i++){ F[0].push(i); F[1].push(n + i); F.push([i, (i + 1) % n, n + (i + 1) % n, n + i]); }
    return { V:V, F:F };
  }
  /* een liggend prisma: de driehoek staat vooraan (y = 0) en loopt door naar achteren */
  function liggendL(drie, lang){
    var n = drie.length, V = [], F = [[], []], i;
    for (i = 0; i < n; i++) V.push([drie[i][0], 0, drie[i][1]]);
    for (i = 0; i < n; i++) V.push([drie[i][0], lang, drie[i][1]]);
    for (i = 0; i < n; i++){ F[0].push(i); F[1].push(n + i); F.push([i, (i + 1) % n, n + (i + 1) % n, n + i]); }
    return { V:V, F:F };
  }
  function piramideL(grond, top){
    var n = grond.length, V = grond.map(function(p){ return [p[0], p[1], 0]; }), F = [grond.map(function(p, i){ return i; })], i;
    V.push(top);
    for (i = 0; i < n; i++) F.push([i, (i + 1) % n, n]);
    return { V:V, F:F };
  }
  function veelhoek(n, r, draai){ var p = [], i; for (i = 0; i < n; i++){ var t = (draai + 360 * i / n) * RAD; p.push([r * Math.cos(t), r * Math.sin(t)]); } return p; }
  function cirkel(c, r, van, tot){
    var p = [], n = Math.max(8, Math.ceil(Math.abs(tot - van) / (Math.PI / 36))), i;
    for (i = 0; i <= n; i++){ var t = van + (tot - van) * i / n; p.push([c[0] + r * Math.cos(t), c[1] + r * Math.sin(t), c[2]]); }
    return p;
  }
  function voorHoek(sc){ return Math.atan2(sc.d[1], sc.d[0]); }
  function cilinder(sc, r, h){
