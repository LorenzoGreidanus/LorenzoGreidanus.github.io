/* het tekstvak met de alinea of de twee zinnen; het gat licht op na het antwoord */
.tv{max-width:62ch;width:100%;text-align:left;background:var(--kaart2);border-left:4px solid var(--spelkleur);border-radius:0 14px 14px 0;padding:14px 18px 14px 16px;font-size:1.08rem;line-height:1.65}
.tv .over{display:block;font-size:.76rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tv .gat{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);text-align:center;color:var(--muted);font-weight:600;line-height:1.2;margin:0 2px}
.tv.toon .gat{color:var(--nadruk);border-bottom-color:var(--nadruk);font-weight:700}
.tv .kz{display:block;margin:0 0 8px;padding-bottom:4px;border-bottom:2px dashed var(--muted);color:var(--muted);font-weight:600}
.tv.toon .kz{color:var(--nadruk);border-bottom:2px solid var(--nadruk);font-weight:700}
.waarom .regel{display:block;margin:.35rem 0}
.waarom .regel b{font-weight:700}
/* lange antwoorden: een zin per knop, onder elkaar */
.opties.zinnen{grid-template-columns:1fr}
.opties.zinnen button.optie.sv{font-size:.97rem;line-height:1.45}
.opties.nummer{counter-reset:zin}
.opties.nummer button.optie{counter-increment:zin}
.opties.nummer button.optie::before{content:counter(zin);display:inline-block;min-width:1.5em;margin-right:.3em;font-weight:700;color:var(--muted)}
/* de vakken voor de volgorde: onder elkaar, want een zin is breed */
#scherm-spel .vakken.rij{grid-template-columns:1fr}
#scherm-spel .vakken .sleepdoel{min-height:72px}
#scherm-spel .vakken .sleepdoel .inhoud{justify-content:flex-start}
#scherm-spel .vakken .sleepdoel .sleepkaart{text-align:left;font-weight:500}
body.groot .tv{font-size:1.3rem}
@media(max-width:560px){.tv{font-size:1rem;padding:12px 14px}.opties.zinnen button.optie.sv{font-size:.93rem}}

  }
  function onderwerp(t){ return '<div class="tv"><span class="over">alinea over</span><b>' + S(t) + '</b></div>'; }

  /* 1. volgorde: kernzin, toelichting, voorbeeld, slotzin */
  function volgorde(niveau){
    var d = D[niveau], i = pak(d.alin, 'alin' + niveau), r = d.alin[i], z = zinnenVan(r);
    var regels = z.map(function(t, j){ return '<span class="regel"><b>' + (j + 1) + '. ' + ROL[j] + '</b> ' + S(t) + '</span>'; }).join(' ');
    return {
      onderdeel:'alinea: volgorde', onderdeelNaam:'volgorde', vorm:'sleep', sleutel:'vo' + niveau + i,
      vraag: 'Zet de zinnen van deze alinea in de goede volgorde.',
      opdracht: niveau === 'bb' ? 'Begin met de zin die zegt waar de alinea over gaat.'
        : niveau === 'kgt' ? 'Een alinea begint met de kernzin en eindigt met een zin die afrondt.'
        : 'Let op woorden die naar iets terugwijzen, zoals dat, dit, zo en daarom.',
      beeld: onderwerp(r[0]),
      kaarten: z.map(function(t, j){ return { id:'s' + j, tekst:S(t) }; }),
      vakken: z.map(function(t, j){ var v = { id:'p' + j, max:1, hoort:['s' + j] }; if (niveau !== 'hv') v.naam = ROL[j]; return v; }),
      sleepuit: 'Vak 1 is het begin van de alinea. Op een telefoon: tik een zin aan en dan het vak.',
      uitleg: 'Zo loopt de alinea: ' + regels + ' <span class="regel">De kernzin zegt waar het over gaat, de toelichting zegt waarom dat zo is en het voorbeeld laat het zien met een situatie.' + (r[4] ? ' De slotzin rondt af.' : '') + '</span>',
      antwoordTekst: z.join(' ')
    };
  }

  /* 2. kernzin: kies de zin die bij de toelichting en het voorbeeld hoort */
  function kernzin(niveau){
    var d = D[niveau], i = pak(d.kern, 'kern' + niveau), r = d.kern[i];
    var z = [r[1], r[2]]; if (r[3]) z.push(r[3]);
    return {
      onderdeel:'alinea: kernzin', onderdeelNaam:'kernzin', vorm:'meerkeuze', sleutel:'kz' + niveau + i,
      vraag: 'Welke kernzin hoort bovenaan deze alinea?',
      opdracht: 'De kernzin zegt waar de hele alinea over gaat, niet maar een stukje ervan.',
      beeld: '<div class="tv" id="tv"><span class="kz" id="kzgat">hier ontbreekt de kernzin</span>' + z.map(S).join(' ') + '</div>',
      opties: [r[4], r[5], r[6], r[7]].map(S), goed: 0,
      uitleg: '<span class="regel"><b>Dit is de kernzin:</b> ' + S(r[4]) + ' De toelichting en het voorbeeld leggen precies dit uit.</span>' +
        '<span class="regel"><b>Te smal:</b> ' + S(r[5]) + ' Dat is maar een deel van de alinea.</span>' +
        '<span class="regel"><b>Te breed of ander onderwerp:</b> ' + S(r[6]) + ' Daar gaat deze alinea niet over.</span>' +
        '<span class="regel"><b>Klopt niet:</b> ' + S(r[7]) + ' Dat zegt iets anders dan de alinea.</span>',
      antwoordTekst: r[4],
      na: beide(langeOpties(false), naAntwoord(function(){ var g = el('kzgat'), t = el('tv'); if (g) g.textContent = r[4]; if (t) t.classList.add('toon'); }))
    };
  }

  /* 3. hoort niet: welke zin dwaalt af van de kernzin */
  function hoortniet(niveau){
    var d = D[niveau], i = pak(d.alin, 'alin' + niveau), r = d.alin[i], z = zinnenVan(r);
    var pos = 1 + Math.floor(Math.random() * z.length);
    var lijst = z.slice(); lijst.splice(pos, 0, r[5]);
    return {
      onderdeel:'alinea: hoortniet', onderdeelNaam:'hoort niet erbij', vorm:'meerkeuze', sleutel:'hn' + niveau + i,
      vraag: 'Welke zin hoort niet in deze alinea?',
      opdracht: 'Eén zin dwaalt af van de kernzin. Lees de alinea en kijk welke zin niets zegt over waar het om gaat.',
      beeld: onderwerp(r[0]),
      opties: lijst.map(S), goed: pos, vasteVolgorde: true,
      uitleg: '<span class="regel">De kernzin zegt: <i>' + S(r[1]) + '</i></span>' +
        '<span class="regel">De zin <i>' + S(r[5]) + '</i> hoort daar niet bij: hij ' + S(r[6]) + '. Hij kan lijken te passen, maar hij helpt de kernzin niet.</span>' +
        '<span class="regel">De andere zinnen leggen de kernzin uit, laten hem zien' + (r[4] ? ' of ronden hem af' : '') + '.</span>',
      antwoordTekst: r[5],
      na: langeOpties(true)
    };
  }

  /* 4. verbinden: welk woord past tussen twee zinnen, en waarom */
  var VERBAND = {
    want: 'een reden aan: wat erna komt, verklaart wat ervoor staat',
    dus: 'een gevolg of conclusie aan',
    maar: 'een tegenstelling aan',
    daardoor: 'een gevolg aan: wat erna komt, komt door wat ervoor staat',
    toch: 'een tegenstelling aan: het gaat anders dan je zou verwachten',
    bijvoorbeeld: 'een voorbeeld aan',
    daarna: 'een volgorde in de tijd aan',
    bovendien: 'een toevoeging aan: er komt nog iets bij',
    anders: 'aan wat er gebeurt als het eerste niet zo is',
    zodat: 'een doel aan',
    hoewel: 'een toegeving aan: het gebeurt ondanks wat je verwacht',
    terwijl: 'een tegenstelling aan, of dat iets tegelijk gebeurt',
    tenzij: 'een uitzondering aan',
    nadat: 'een volgorde in de tijd aan: eerst wat in de bijzin staat',
    doordat: 'een oorzaak aan',
    desondanks: 'een toegeving aan: ondanks wat ervoor staat gebeurt dit',
    integendeel: 'het tegenovergestelde aan van wat ervoor staat',
    kortom: 'een samenvatting of conclusie aan',
    daarentegen: 'een tegenstelling aan: twee zaken naast elkaar',
    vervolgens: 'de volgende stap in een volgorde aan'
  };
  function verbinden(niveau){
    var d = D[niveau], i = pak(d.verb, 'verb' + niveau), x = d.verb[i];
    var punt = x[2] === '.', woord = x[3];
    var tekst = S(x[0]) + (punt ? '. ' : ', ') + '<span class="gat" id="gatvak">&hellip;</span> ' + S(x[1]) + '.';
    return {
      onderdeel:'alinea: verbinden', onderdeelNaam:'verbinden', vorm:'meerkeuze', sleutel:'vb' + niveau + i,
      vraag: 'Welk verbindingswoord past op de plek van het gat?',
      opdracht: 'Bedenk eerst wat het verband is tussen de twee delen: oorzaak, gevolg, tegenstelling, voorbeeld of volgorde in de tijd.',
      beeld: '<div class="tv" id="tv">' + tekst + '</div>',
      opties: [woord].concat(x[4]).map(S), goed: 0,
      uitleg: '<span class="regel"><b>' + S(hoofd(woord)) + '</b> geeft ' + VERBAND[woord] + '.</span> <span class="regel">' + x[5] + '</span>',
      antwoordTekst: woord,
      na: naAntwoord(function(){ var g = el('gatvak'), t = el('tv'); if (g) g.textContent = punt ? hoofd(woord) : woord; if (t) t.classList.add('toon'); })
    };
  }

  /* 5. herschrijven (vanaf kgt): welke versie loopt het best */
  var FOUT = {
    h: 'Herhaling: hetzelfde woord of dezelfde woorden komen steeds terug. Zeg het één keer en gebruik daarna een ander woord of laat het weg.',
    l: 'Te lang: te veel delen in één zin, dus je raakt de draad kwijt. Knip de zin in stukken of laat over wat er niet toe doet.',
    v: 'Onduidelijke verwijzing: een woord als zij, hij, die of dit kan naar meer dan één persoon of ding wijzen. Noem dan de naam of de zaak zelf.'
  };
  function herschrijf(niveau){
    /* bij vmbo-bb de makkelijkste zinnen van kgt: zonder verwijzing */
    var bron = niveau === 'bb' ? D.kgt.her.filter(function(x){ return !x[0]; }) : D[niveau].her;
    var i = pak(bron, 'her' + niveau), x = bron[i];
    var fouten = [x[2], x[3]];
    return {
      onderdeel:'alinea: herschrijf', onderdeelNaam:'herschrijven', vorm:'meerkeuze', sleutel:'he' + niveau + bron[i][1].slice(0, 24),
      vraag: 'Welke versie van deze zin loopt het best?',
      opdracht: 'Let op herhaling, zinnen die te lang worden en woorden als hij, zij of dit waarvan je niet weet waar ze naar verwijzen.',
      beeld: x[0] ? '<div class="tv"><span class="over">wat je al weet</span>' + S(x[0]) + '</div>' : '',
      opties: [x[1], fouten[0][0], fouten[1][0]].map(S), goed: 0,
      uitleg: '<span class="regel"><b>Dit loopt het best:</b> ' + S(x[1]) + ' Het zegt het één keer, het is een zin die je in één keer leest en je weet steeds wie of wat bedoeld wordt.</span>' +
        fouten.map(function(f){ return '<span class="regel">' + S(FOUT[f[1]]) + '</span>'; }).join(' ') +
        '<span class="regel">' + S(x[4]) + '</span>',
      antwoordTekst: x[1],
      na: langeOpties(false)
    };
  }

  var SOORTEN = { volgorde: volgorde, kernzin: kernzin, hoortniet: hoortniet, verbinden: verbinden, herschrijf: herschrijf };
  function soortenVoor(niveau){ return niveau === 'bb' ? ['volgorde', 'kernzin', 'hoortniet', 'verbinden'] : ['volgorde', 'kernzin', 'hoortniet', 'verbinden', 'herschrijf']; }

  VAKSPEL.maak({
    id:'alinea', naam:'Bouw een alinea', vak:'ned', kleur:'#F26749',
    hand:'kernzin, toelichting, voorbeeld',
    lead:'Een goede alinea is een klein bouwwerk. Bovenaan staat de kernzin, die zegt waar het over gaat. Daarna komen een toelichting, een voorbeeld en een slotzin. Je oefent zelf schrijven in kleine stappen: zinnen op volgorde zetten, de kernzin kiezen, de zin vinden die afdwaalt, het goede verbindingswoord kiezen en zinnen beter laten lopen.',
    leerdoel:'Je leert hoe een alinea is opgebouwd en hoe je zinnen goed aan elkaar maakt, zodat je zelf een heldere alinea kunt schrijven.',
    hoe:[
      { kop:'De bouw van een alinea', tekst:'De <b>kernzin</b> zegt waar de alinea over gaat. De <b>toelichting</b> zegt waarom dat zo is, het <b>voorbeeld</b> laat het zien en de <b>slotzin</b> rondt af.' },
      { kop:'Verbindingswoorden', tekst:'Woorden als <b>want</b>, <b>daardoor</b>, <b>bijvoorbeeld</b>, <b>toch</b> en <b>daarna</b> laten zien hoe twee zinnen bij elkaar horen. Het verkeerde woord geeft een verkeerd verband.' },
      { kop:'Vijf soorten opgaven', tekst:'Zinnen op volgorde zetten, de kernzin kiezen, de zin vinden die niet past, het verbindingswoord kiezen en kiezen welke versie van een zin het best loopt. Tien per ronde.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb', uit:'Korte alinea\'s van drie zinnen: kernzin, toelichting en voorbeeld. Bij het op volgorde zetten staat de naam van elk vak erbij.' },
        { id:'kgt', naam:'vmbo-kgt en tl', uit:'Alinea\'s van vier zinnen, met een slotzin. Ook zinnen die beter kunnen lopen: herhaling, te lang en een onduidelijke verwijzing.' },
        { id:'hv', naam:'havo en vwo', uit:'Langere alinea\'s zonder namen bij de vakken, lastigere verbanden zoals hoewel, terwijl en desondanks, en subtielere zinnen om te herschrijven.' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' },
        { id:'volgorde', naam:'volgorde', uit:'De zinnen van een alinea staan door elkaar. Zet ze in de goede volgorde: kernzin, toelichting, voorbeeld en (vanaf kgt) slotzin.' },
        { id:'kernzin', naam:'kernzin', uit:'Je ziet een alinea zonder kernzin. Welke van de vier zinnen zegt waar de hele alinea over gaat?' },
        { id:'hoortniet', naam:'hoort niet erbij', uit:'In een alinea staat een zin die afdwaalt van de kernzin. Welke?' },
        { id:'verbinden', naam:'verbinden', uit:'Welk verbindingswoord past tussen twee zinnen, en waarom: want, daardoor, bijvoorbeeld, toch, daarna en meer.' },
        { id:'herschrijf', naam:'herschrijven', uit:'Drie versies van een zin: welke loopt het best? Bij vmbo-bb krijg je de makkelijkste zinnen, zonder verwijzing.' } ] }
    ],
    aantal:10, minuten:8,
    maak:function(keuze, nr){
      var niveau = D[keuze.niveau] ? keuze.niveau : 'kgt';
      var soort = keuze.soort === 'alles' ? kies(soortenVoor(niveau)) : keuze.soort;
      return SOORTEN[soort](niveau);
    },
    uitleg:{ doel:'Een alinea opbouwen en zinnen goed aan elkaar maken.', tijd:'tien opgaven per ronde', bediening:'Kies het antwoord dat klopt (of druk op 1 tot 5). Bij volgorde sleep je de zinnen naar de vakken; op een telefoon tik je een zin en dan het vak.' }
  });
})();
</script>
