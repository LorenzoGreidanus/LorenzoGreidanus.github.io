<style>
/* de ladder: elke trede een eenheid, de pijlen zeggen keer 10 of gedeeld door 10 */
.ladder{display:grid;grid-template-columns:auto auto;gap:4px 10px;align-items:center;font-variant-numeric:tabular-nums}
.ladder .trede{background:var(--kaart2);border-radius:10px;padding:5px 14px;font-weight:600;text-align:center;min-width:76px}
.ladder .trede.licht{background:var(--kaart-aan);color:var(--nadruk);box-shadow:inset 0 0 0 2px var(--nadruk)}
.ladder .stap{font-size:.74rem;color:var(--muted);font-weight:600;text-align:left}
</style>
<script src="/vangnet.js" defer></script>
</head>
<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function tussen(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function net(x){ x = Math.round(x * 1e6) / 1e6; var s = String(x); if (/e/.test(s)) s = x.toFixed(6).replace(/0+$/, '').replace(/\.$/, ''); return s.replace('.', ','); }

  /* de drie ladders: van groot naar klein, elke trede keer 10 */
  var LADDERS = {
    lengte: { naam:'lengte', treden:['km', 'hm', 'dam', 'm', 'dm', 'cm', 'mm'], gewoon:['km', 'm', 'cm', 'mm'] },
    gewicht: { naam:'gewicht', treden:['kg', 'hg', 'dag', 'g', 'dg', 'cg', 'mg'], gewoon:['kg', 'g', 'mg'] },
    inhoud: { naam:'inhoud', treden:['kl', 'hl', 'dal', 'l', 'dl', 'cl', 'ml'], gewoon:['l', 'dl', 'cl', 'ml'] }
  };
  function ladderHtml(l, van, naar){
    var iVan = l.treden.indexOf(van), iNaar = l.treden.indexOf(naar);
    return '<div class="ladder">' + l.treden.map(function(t, i){
      return '<div class="trede' + (t === van || t === naar ? ' licht' : '') + '">' + t + '</div><div class="stap">' + (i < l.treden.length - 1 ? '↓ × 10   ↑ ÷ 10' : '') + '</div>';
    }).join('') + '</div>';
  }
  function factor(l, van, naar){ return Math.pow(10, l.treden.indexOf(naar) - l.treden.indexOf(van)); }

  /* 1. omrekenen: een getal van de ene eenheid naar de andere */
  function omrekenen(niveau){
    var l = kies([LADDERS.lengte, LADDERS.gewicht, LADDERS.inhoud]);
    var lijst = niveau === 'bb' ? l.gewoon : l.treden;
    var van = kies(lijst), naar = kies(lijst); while (naar === van) naar = kies(lijst);
    var afstand = Math.abs(l.treden.indexOf(van) - l.treden.indexOf(naar));
    if (niveau === 'bb' && afstand > 3){ return omrekenen(niveau); }
    var f = factor(l, van, naar);
    var getal = niveau === 'bb' ? kies([1, 2, 3, 5, 8, 10, 25, 50]) : niveau === 'kgt' ? kies([1.5, 2, 3.5, 7, 12, 0.5, 45, 250]) : kies([0.35, 1.25, 7.5, 0.08, 62.5, 3.75, 0.004]);
    var antwoord = Math.round(getal * f * 1e6) / 1e6;
    var stappen = Math.abs(Math.round(Math.log10(f)));
    return {
      onderdeel:'metriek: omrekenen', onderdeelNaam:'omrekenen', vorm:'invul', sleutel:'om' + van + naar + getal,
      vraag: '<b>' + net(getal) + ' ' + van + '</b> = hoeveel ' + naar + '?',
      opdracht: 'Kijk op de ladder hoeveel treden het is, en welke kant op.',
      beeld: ladderHtml(l, van, naar),
      velden:[{ label: net(getal) + ' ' + van + ' =', antwoord: antwoord, tol: antwoord * 1e-9, eenheid: naar }],
      uitleg: 'Van ' + van + ' naar ' + naar + ' is ' + stappen + (stappen === 1 ? ' trede' : ' treden') + ' ' + (f > 1 ? 'omlaag: de komma ' + stappen + ' naar rechts (keer ' + net(f) + ')' : 'omhoog: de komma ' + stappen + ' naar links (gedeeld door ' + net(1 / f) + ')') + '. ' + net(getal) + ' ' + van + ' = ' + net(antwoord) + ' ' + naar + '.',
      antwoordTekst: net(antwoord) + ' ' + naar
    };
  }
  /* 2. welke eenheid past: meerkeuze */
  var DINGEN = [
    ['de lengte van een potlood', 'cm', 'lengte'], ['de afstand van Utrecht naar Groningen', 'km', 'lengte'], ['de dikte van een munt', 'mm', 'lengte'], ['de hoogte van een deur', 'm', 'lengte'],
    ['de lengte van een voetbalveld', 'm', 'lengte'], ['de breedte van een nagel', 'mm', 'lengte'], ['een rondje om de school', 'm', 'lengte'], ['de lengte van de Afsluitdijk', 'km', 'lengte'],
    ['het gewicht van een appel', 'g', 'gewicht'], ['het gewicht van een volwassene', 'kg', 'gewicht'], ['een snufje zout', 'mg', 'gewicht'], ['een zak aardappelen', 'kg', 'gewicht'], ['een brief', 'g', 'gewicht'],
    ['de inhoud van een badkuip', 'l', 'inhoud'], ['een slokje water', 'ml', 'inhoud'], ['een pak melk', 'l', 'inhoud'], ['een theelepel siroop', 'ml', 'inhoud'], ['een glas cola', 'cl', 'inhoud'], ['een zwembad', 'kl', 'inhoud'],
    ['de afstand van Amsterdam naar Parijs', 'km', 'lengte'], ['de lengte van een mier', 'mm', 'lengte'], ['de hoogte van een flatgebouw', 'm', 'lengte'], ['de breedte van een schrift', 'cm', 'lengte'], ['de lengte van de rivier de Rijn', 'km', 'lengte'],
    ['het gewicht van een fiets', 'kg', 'gewicht'], ['het gewicht van een paperclip', 'g', 'gewicht'], ['het medicijn in een pijnstillertablet', 'mg', 'gewicht'], ['een reep chocola', 'g', 'gewicht'],
    ['een emmer water', 'l', 'inhoud'], ['een flesje parfum', 'ml', 'inhoud'], ['de benzinetank van een auto', 'l', 'inhoud']
  ];
  function eenheid(niveau){
    var d = kies(DINGEN), l = LADDERS[d[2]];
    var opties = H(l.treden.filter(function(t){ return t !== d[1]; })).slice(0, 3).concat([d[1]]);
    var goedI = opties.indexOf(d[1]);
    return {
      onderdeel:'metriek: eenheid kiezen', onderdeelNaam:'eenheid kiezen', vorm:'meerkeuze', sleutel:'ee' + d[0],
      vraag: 'In welke eenheid meet je <b>' + d[0] + '</b>?',
      opties: opties, goed: goedI,
      uitleg: d[0].charAt(0).toUpperCase() + d[0].slice(1) + ' meet je in ' + d[1] + '. ' + (d[1] === 'km' ? 'Kilometers zijn voor afstanden tussen plaatsen.' : d[1] === 'mm' ? 'Millimeters zijn voor heel dunne of kleine dingen.' : d[1] === 'mg' ? 'Milligrammen zijn voor piepkleine hoeveelheden.' : d[1] === 'kl' ? 'Een kiloliter is duizend liter: alleen voor heel grote inhouden.' : 'Dat is de maat die past bij hoe groot het is.'),
      antwoordTekst: d[1]
    };
  }
  /* 3. op volgorde: maten met verschillende eenheden van klein naar groot slepen */
  function volgorde(niveau){
    var l = kies([LADDERS.lengte, LADDERS.gewicht, LADDERS.inhoud]);
    var lijst = niveau === 'bb' ? l.gewoon : l.treden, n = niveau === 'hv' ? 5 : 4, basis = l.treden[3];
    var maten = [], gebruikt = {};
    while (maten.length < n){
      var e = kies(lijst), g = niveau === 'bb' ? kies([1, 2, 5, 10, 20, 50]) : kies([0.5, 1, 2.5, 4, 15, 30, 75, 120]);
      var inBasis = g * factor(l, e, basis), k = Math.round(inBasis * 1e6);
      if (gebruikt[k]) continue; gebruikt[k] = 1;
      maten.push({ id:'m' + maten.length, tekst: net(g) + ' ' + e, w: inBasis });
    }
    var goed = maten.slice().sort(function(a, b){ return a.w - b.w; });
    return {
      onderdeel:'metriek: op volgorde', onderdeelNaam:'op volgorde', vorm:'sleep', sleutel:'vo' + maten.map(function(m){ return m.tekst; }).join(''),
      vraag: 'Zet deze maten op volgorde van <b>klein naar groot</b>.',
      sleepuit: 'Kaartje 1 is de kleinste. Reken ze eerst om naar dezelfde eenheid.',
      beeld: ladderHtml(l, '', ''),
      kaarten: maten.map(function(m){ return { id:m.id, tekst:m.tekst }; }),
      vakken: goed.map(function(m, i){ return { id:'p' + i, max:1, hoort:[m.id] }; }),
      uitleg: 'In ' + basis + ': ' + goed.map(function(m){ return m.tekst + ' = ' + net(m.w) + ' ' + basis; }).join(', ') + '.',
      antwoordTekst: goed.map(function(m){ return m.tekst; }).join(' < ')
    };
  }

  var SOORTEN = { omrekenen: omrekenen, eenheid: eenheid, volgorde: volgorde };
  VAKSPEL.maak({
    id:'metriek', naam:'Het metriek stelsel', vak:'reken', kleur:'#EA9836',
    hand:'elke trede is keer tien',
    lead:'Kilometer tot millimeter, kilogram tot milligram, liter tot milliliter. Je rekent om met de ladder, kiest de eenheid die past en zet maten op volgorde. Bij elke opgave staat de ladder erbij, met de treden die je nodig hebt oplichtend.',
    hoe:[
      { kop:'De ladder', tekst:'Elke trede omlaag is <b>keer 10</b>: de komma een plek naar rechts. Elke trede omhoog is gedeeld door 10: de komma naar links.' },
      { kop:'Drie ladders', tekst:'Lengte (km tot mm), gewicht (kg tot mg) en inhoud (kl tot ml) werken precies hetzelfde. Alleen de letters zijn anders.' },
      { kop:'Drie soorten opgaven', tekst:'Omrekenen, de eenheid kiezen die bij iets past, en maten op volgorde zetten. Tien per ronde, meteen nagekeken.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb', uit:'Alleen de gewone eenheden (km, m, cm, mm) en hele getallen.' },
        { id:'kgt', naam:'vmbo-kgt en tl', uit:'Alle treden van de ladder, ook hm, dam en dl, met kommagetallen.' },
        { id:'hv', naam:'havo en vwo', uit:'Kleine en grote kommagetallen, en vijf maten op volgorde.' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' }, { id:'omrekenen', naam:'omrekenen' }, { id:'eenheid', naam:'eenheid kiezen' }, { id:'volgorde', naam:'op volgorde' } ] }
    ],
    aantal:10,
    maak:function(keuze, nr){
      var soort = keuze.soort === 'alles' ? kies(['omrekenen', 'omrekenen', 'eenheid', 'volgorde']) : keuze.soort;
      return SOORTEN[soort](keuze.niveau);
    },
    uitleg:{ doel:'Omrekenen tussen eenheden met de ladder van het metriek stelsel.', tijd:'tien opgaven per ronde', bediening:'Typ het getal en druk op Nakijken. Bij op volgorde sleep je de kaartjes; op een telefoon tik je een kaartje en dan het vak.' }
  });
})();
</script>
