<html lang="nl">
<head>

<title>Formeel of informeel &middot; meneer Greidanus</title>
<meta name="description" content="Appje of brief? Formeel en informeel taalgebruik herkennen, de formele versie kiezen, een informele zin herschrijven en zinnen sorteren naar wie je schrijft.">

<meta property="og:title" content="Formeel of informeel">

<link rel="stylesheet" href="vakspel.css">

<style>
/* het bericht: als appje in een telefoon-ballon, als brief op een vel, of neutraal op een briefje (nog niet verraden) */
.bericht-vak{display:flex;gap:16px;align-items:stretch;justify-content:center;flex-wrap:wrap;width:100%;max-width:840px}
.briefje{background:var(--kaart2);border-radius:14px;padding:14px 18px;font-size:1.05rem;line-height:1.55;max-width:48ch;text-align:left}
.tel{background:var(--kaart2);border:2px solid var(--rand2);border-radius:22px;padding:14px 12px 16px;max-width:320px;width:100%;text-align:left;position:relative}
.tel .kopje{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--rand)}
.tel .kopje i{width:22px;height:22px;border-radius:50%;background:var(--vista);display:inline-block}
.ballon{background:var(--kaart-aan);border:1px solid var(--rand);border-radius:16px 16px 16px 4px;padding:9px 13px;font-size:1rem;line-height:1.45;position:relative;max-width:100%}
.ballon small{display:block;text-align:right;font-size:.68rem;color:var(--muted);margin-top:2px}
.ballon .w{color:var(--nadruk);font-weight:700}
.brief{background:var(--kaart);border:1px solid var(--rand2);border-radius:6px;padding:16px 18px 18px;max-width:380px;width:100%;text-align:left;box-shadow:var(--schaduw);font-size:.98rem;line-height:1.55;position:relative}
.brief .aan{font-size:.76rem;color:var(--muted);font-weight:600;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--rand);display:flex;justify-content:space-between;align-items:center}
.brief .aan svg{width:20px;height:20px;fill:none;stroke:var(--nadruk);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brief .lijnen{display:grid;gap:9px;margin-top:6px}
.brief .lijnen i{display:block;height:2px;background:var(--rand2);border-radius:2px}
.brief .lijnen i:last-child{width:60%}
.brief .gat{display:inline-block;min-width:5em;border-bottom:2px solid var(--ink);text-align:center;color:var(--muted);font-weight:600;line-height:1.2;margin:0 2px}
.brief.toon .gat{color:var(--nadruk);border-bottom-color:var(--nadruk)}
.brief .w{color:var(--nadruk);font-weight:700}
.pijltje{align-self:center;color:var(--muted);font-size:1.4rem}
.reglegenda{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.reglegenda div{background:var(--kaart2);border-radius:12px;padding:8px 12px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:8px}
.reglegenda svg{width:26px;height:26px;fill:none;stroke:var(--nadruk);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.groot .briefje,body.groot .ballon,body.groot .brief{font-size:1.2rem}
@media(max-width:560px){.bericht-vak{gap:10px}.pijltje{transform:rotate(90deg)}.tel{max-width:100%}.brief{padding:12px 14px}}
</style>
<script src="/vangnet.js" defer></script>
</head>
<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script src="register-opgaven.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon, R = REGISTER;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  var NIV = { bb:1, kgt:2, hv:3 };
  function bij(lijst, niveau){ var n = NIV[niveau] || 2, l = lijst.filter(function(x){ return x[0] === n; }); return kies(l.length ? l : lijst); }
  var ICO = {
    tel:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>',
    mail:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 8l9 6 9-6"/>',
    brief:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h6M9 16h6"/>'
  };
  function ico(id){ return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICO[id] + '</svg>'; }

  /* de drie kaders */
  function ballon(html, van){ return '<div class="tel"><div class="kopje"><i></i>' + S(van || 'chat') + '</div><div class="ballon">' + html + '<small>12:41</small></div></div>'; }
  function brief(html, aan){ return '<div class="brief" id="brief"><div class="aan"><span>Aan: ' + S(aan || 'de school') + '</span>' + ico('mail') + '</div>' + html + '</div>'; }
  function briefje(tekst){ return '<div class="briefje" id="briefje">' + S(tekst) + '</div>'; }
  function naAntwoord(fn){
    return function(){
      var r = document.getElementById('reactie'); if (!r || !window.MutationObserver) return;
      var mo = new MutationObserver(function(){ if (r.querySelector('.uitslagregel')){ mo.disconnect(); try { fn(); } catch (e){} } });
      mo.observe(r, { childList:true });
    };
  }

  /* 1. herkennen: formeel of informeel; na het antwoord verschijnt het bericht in het kader dat erbij hoort */
  function herkennen(niveau){
    var x = bij(R.HERKENNEN, niveau), formeel = x[2] === 'formeel';
    return {
      onderdeel:'register: herkennen', onderdeelNaam:'herkennen', vorm:'meerkeuze', sleutel:'herk' + R.HERKENNEN.indexOf(x),
      vraag: 'Is dit bericht formeel of informeel?',
      opdracht: 'Let op de aanspreekvorm (u of je), afkortingen, emoji’s en of de zinnen compleet zijn.',
      beeld: '<div class="bericht-vak">' + briefje(x[1]) + '</div>',
      opties: ['formeel', 'informeel'], goed: formeel ? 0 : 1, vasteVolgorde: true,
      uitleg: S(x[3]) + (formeel ? ' Dit hoort in een brief of e-mail aan iemand die je niet goed kent.' : ' Dit hoort in een appje aan een vriend.'),
      antwoordTekst: x[2],
      na: naAntwoord(function(){ var b = document.getElementById('beeld'); if (b) b.innerHTML = '<div class="bericht-vak">' + (formeel ? brief(S(x[1])) : ballon(S(x[1]), 'vriend')) + '</div>'; })
    };
  }
  /* 2. kies de formele versie: drie versies van dezelfde boodschap */
  function kiesFormeel(niveau){
    var x = bij(R.KIES, niveau), aan = /bedrijf|winkel|gemeente|bestelling|abonnement|klacht|vacature|stage|cursus|vergunning|solliciteer|diploma|website|lidmaatschap|club|schrijver|pakket|fiets/i.test(x[1] + x[2]) ? 'het bedrijf of de instantie' : 'de school';
    return {
      onderdeel:'register: kies de formele versie', onderdeelNaam:'kies de formele versie', vorm:'meerkeuze', sleutel:'kies' + R.KIES.indexOf(x),
      vraag: 'Welke versie past in een brief of e-mail?',
      opdracht: 'De boodschap: ' + S(x[1]),
      beeld: '<div class="bericht-vak">' + brief('<span class="gat" id="briefgat" style="min-width:12em">welke versie past hier?</span><div class="lijnen"><i></i><i></i><i></i></div>', aan) + '</div>',
      opties: x.slice(2, 5).map(S), goed: 0,
      uitleg: S(x[5]) + ' De andere twee zijn spreektaal: die passen in een appje, niet in een brief.',
      antwoordTekst: x[2],
      na: naAntwoord(function(){ var b = document.getElementById('brief'); if (b){ b.classList.add('toon'); b.innerHTML = b.querySelector('.aan').outerHTML + S(x[2]); } })
    };
  }
  /* 3. herschrijven: de informele zin als appje, de formele zin met een gat op de brief */
  function herschrijven(niveau){
    var x = bij(R.HERSCHRIJVEN, niveau);
    return {
      onderdeel:'register: herschrijven', onderdeelNaam:'herschrijven', vorm:'invul', sleutel:'her' + R.HERSCHRIJVEN.indexOf(x),
      vraag: 'Maak de formele versie af: welk woord hoort op de open plek?',
      opdracht: 'Links het appje, rechts de brief. Typ het formele woord dat in de brief hoort.',
      beeld: '<div class="bericht-vak">' + ballon(S(x[1]), 'vriend') + '<span class="pijltje">→</span>' + brief(S(x[2]).replace('___', '<span class="gat" id="briefgat">…</span>')) + '</div>',
      velden:[{ label:'het formele woord', antwoord: x[3], breed: true, type:'tekst', toon: x[3][0] }],
      uitleg: S(x[4]) + (x[3].length > 1 ? ' Goed is ook: ' + x[3].slice(1).join(', ') + '.' : ''),
      antwoordTekst: x[3][0],
      na: naAntwoord(function(){ var b = document.getElementById('brief'), g = document.getElementById('briefgat'); if (b) b.classList.add('toon'); if (g) g.textContent = x[3][0]; })
    };
  }
  /* 4. sorteren: zinnen naar appje, e-mail aan een docent en (hv) sollicitatiebrief */
  var VAKKEN = { app:{ naam:'appje aan een vriend', uit:'informeel' }, mail:{ naam:'e-mail aan een docent', uit:'formeel en beleefd' }, brief:{ naam:'sollicitatiebrief', uit:'formeel en zakelijk' } };
  function sorteren(niveau){
    var n = NIV[niveau] || 2, soorten = niveau === 'hv' ? ['app', 'mail', 'brief'] : ['app', 'mail'], per = niveau === 'hv' ? 2 : 3;
    var kaarten = [], vakken = [];
    soorten.forEach(function(s){
      var lijst = R.ZINNEN.filter(function(z){ return z[2] === s && (s === 'brief' || z[0] === n); });
      var w = H(lijst).slice(0, per);
      vakken.push({ id:s, naam:VAKKEN[s].naam, uit:VAKKEN[s].uit, hoort:w.map(function(z){ return 'z' + R.ZINNEN.indexOf(z); }) });
      w.forEach(function(z){ kaarten.push({ id:'z' + R.ZINNEN.indexOf(z), tekst:S(z[1]) }); });
    });
    return {
      onderdeel:'register: sorteren', onderdeelNaam:'sorteren', vorm:'sleep', sleutel:'sort' + kaarten.map(function(k){ return k.id; }).sort().join(','),
      vraag: 'Sleep elke zin naar het bericht waar hij in past.',
      beeld: '<div class="reglegenda">' + soorten.map(function(s){ return '<div>' + ico(s === 'app' ? 'tel' : s) + S(VAKKEN[s].naam) + '</div>'; }).join('') + '</div>',
      kaarten: kaarten, vakken: vakken,
      sleepuit: per + ' zinnen per bericht. Op een telefoon: tik een zin aan en dan het vak.',
      uitleg: 'Een appje: je, afkortingen, emoji’s en losse zinnen. Een e-mail aan een docent: u, hele zinnen, beleefd. ' + (niveau === 'hv' ? 'Een sollicitatiebrief: zakelijk, met vaste formules als ‘met belangstelling’ en ‘hoogachtend’.' : ''),
      antwoordTekst: vakken.map(function(v){ return v.naam + ': ' + v.hoort.map(function(id){ return R.ZINNEN[parseInt(id.slice(1), 10)][1]; }).join(' / '); }).join('; ')
    };
  }

  var SOORTEN = { herkennen: herkennen, kies: kiesFormeel, herschrijven: herschrijven, sorteren: sorteren };
  VAKSPEL.maak({
    id:'register', naam:'Formeel of informeel', vak:'ned', kleur:'#F26749',
    hand:'appje of brief?',
    lead:'Aan een vriend app je ‘hoi, kom je ff?’. Aan je docent of een bedrijf schrijf je ‘Geachte mevrouw, kunt u mij laten weten…’. Dat verschil heet register. Je herkent het, kiest de formele versie, herschrijft een informele zin en sorteert zinnen naar wie je schrijft.',
    hoe:[
      { kop:'Informeel', tekst:'Voor vrienden: <b>je</b>, afkortingen (ff, thnx), emoji’s, losse zinnen zonder onderwerp. Prima in een appje.' },
      { kop:'Formeel', tekst:'Voor school, een bedrijf of iemand die je niet kent: <b>u</b>, hele zinnen, geen afkortingen, een nette aanhef en groet.' },
      { kop:'Vier soorten opgaven', tekst:'Herkennen, de formele versie kiezen, een informeel woord herschrijven en zinnen sorteren. Tien per ronde, meteen nagekeken.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb', uit:'Korte berichten aan school: aanhef, u of je, afkortingen.' },
        { id:'kgt', naam:'vmbo-kgt en tl', uit:'Ook e-mails aan bedrijven en vaste formele woorden als verzoeken en ontvangen.' },
        { id:'hv', naam:'havo en vwo', uit:'Ook de sollicitatiebrief met zijn vaste formules, en drie vakken bij het sorteren.' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' }, { id:'herkennen', naam:'herkennen' }, { id:'kies', naam:'kies de formele versie' }, { id:'herschrijven', naam:'herschrijven' }, { id:'sorteren', naam:'sorteren' } ] }
    ],
    aantal:10,
    maak:function(keuze, nr){
      var soort = keuze.soort === 'alles' ? kies(['herkennen', 'kies', 'herschrijven', 'sorteren']) : keuze.soort;
      return SOORTEN[soort](keuze.niveau);
    },
    uitleg:{ doel:'Het verschil tussen formeel en informeel taalgebruik herkennen en toepassen.', tijd:'tien opgaven per ronde', bediening:'Kies het antwoord (of druk op 1 of 2), typ het formele woord en druk op Nakijken, of sleep de zinnen naar het bericht; op een telefoon tik je een zin en dan het vak.' }
  });
})();
</script>

<script src="klas.js"></script>
