<style>
/* ---------- de speler: het fragment boven de antwoorden ---------- */
.lu-speler{width:100%;max-width:640px;margin:0 auto;text-align:left;background:var(--kaart2);border-radius:18px;padding:14px 16px;display:grid;gap:12px}
/* basis.css geeft een svg in .beeld in het donker een eigen vlak; de pictogrammen hier horen doorzichtig te zijn */
.lu-speler svg{background:none!important}
.lu-kop{display:grid;gap:2px}
.lu-soort{font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lu-titel{font-size:1.1rem;line-height:1.25;color:var(--ink)}
.lu-sit{font-size:.93rem;line-height:1.45;color:var(--muted);margin:2px 0 0}
.lu-wie{display:flex;flex-wrap:wrap;gap:6px}
.lu-p{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:3px 12px 3px 5px;border-radius:999px;background:var(--kaart);border:1.5px solid var(--rand2);font-size:.86rem;font-weight:600;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.lu-p svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.lu-p.aan{border-color:var(--spelkleur);box-shadow:0 0 0 2px var(--spelkleur)}
.lu-p.aan svg{color:var(--ink)}
.lu-golf{display:none;align-items:center;gap:2px;height:14px}
.lu-golf i{display:block;width:3px;height:6px;border-radius:2px;background:var(--ink);animation:luGolf .8s ease-in-out infinite alternate}
.lu-golf i:nth-child(2){animation-delay:.2s}
.lu-golf i:nth-child(3){animation-delay:.4s}
.lu-p.aan .lu-golf{display:inline-flex}
@keyframes luGolf{from{height:4px}to{height:14px}}
@media(prefers-reduced-motion:reduce){.lu-golf i{animation:none;height:10px}}
.lu-bedien{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.lu-knop{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:0 22px;min-height:48px;font-weight:600;font-size:1rem;background:var(--spelkleur);color:var(--spelinkt);cursor:pointer}
.lu-knop svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lu-knop:disabled{opacity:.45;cursor:not-allowed}
.lu-knop[hidden]{display:none}
.lu-balk{flex:1 1 120px;height:6px;border-radius:99px;background:var(--rand2);overflow:hidden}
.lu-balk i{display:block;height:100%;width:0;background:var(--spelkleur);transition:width .3s ease}
.lu-tel{flex:1 1 100%;margin:0;font-size:.88rem;color:var(--muted)}
.lu-nood{display:grid;gap:8px;justify-items:start;border:1.5px dashed var(--rand2);border-radius:12px;padding:10px 12px;font-size:.92rem;line-height:1.45;color:var(--ink)}
.lu-nood[hidden],.lu-tekst[hidden],.lu-terug[hidden]{display:none}
.lu-lees{min-height:44px;border-radius:999px;border:1.5px solid var(--rand2);background:var(--kaart);color:var(--ink);font-weight:600;padding:0 18px;cursor:pointer}
.lu-tekst{background:var(--kaart);border:1px solid var(--rand);border-radius:12px;padding:10px 14px;font-size:.97rem;line-height:1.6;color:var(--ink);overflow-wrap:anywhere}
.lu-tekst p{margin:0 0 .45em}
.lu-tekst p:last-child{margin-bottom:0}
.lu-tekst b{color:var(--ink)}
.lu-terug{border-top:1px solid var(--rand);padding-top:6px}
.lu-terug>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;font-size:.92rem;color:var(--ink)}
.lu-terug>.lu-tekst{margin-top:4px}
.lu-zin{display:block;margin:8px auto 0;max-width:46ch;font-weight:500;font-style:italic;font-size:1rem;color:var(--ink)}
/* lange antwoorden: een kolom; feit of mening blijft naast elkaar */
#scherm-spel .opties{grid-template-columns:1fr}
#scherm-spel .opties.twee{grid-template-columns:1fr 1fr}
body.groot .lu-tekst{font-size:1.2rem}
@media(max-width:560px){.lu-speler{padding:12px}.lu-knop{flex:1 1 100%}.lu-balk{flex-basis:100%}}
/* ---------- op het werkblad (.blad bestaat alleen op werkblad.html): de vragen bij een fragment, zwart op wit ---------- */
.blad .lu-pv{display:grid;gap:10px;margin-top:4px}
.blad .lu-pq{display:block}
.blad .lu-pnr{display:inline-block;min-width:1.6em;font-weight:700;color:#14224C}
.blad .lu-pq .opties{margin-top:4px}
.blad .lu-pq .lijn{max-width:300px}
.blad .lu-pzin{display:block;font-style:italic;margin-top:2px}
</style>

<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script src="voorlezen.js"></script>
<script>
(function(){
  'use strict';
  var S = VAKSPEL.schoon, H = VAKSPEL.husselen;
  function $(id){ return document.getElementById(id); }
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  var WERKBLAD = /[?&]werkblad=1/.test(location.search);

  /* ============================================================================
     DE FRAGMENTEN
     F({ niv, id, soort, titel, sit, wie, tekst, doel, v })
       wie    de sprekers: { a:['Assistente', 'v'], j:['Joris', 'm'] } (v of m: welke stem)
       tekst  regels 'a: wat a zegt'; met ' || ' erachter hoe de stem het uitspreekt
              (als dat anders is dan wat er in de tekst staat, zoals een tijd)
       doel   (niet verplicht) een vraag naar het doel: { is, wie, niet:[doelen die
              ook te verdedigen zijn en dus niet als keuze komen], u:uitleg }
       v      de vragen:
              M(deel, vraag, [goed, fout, fout, fout], uitleg)   meerkeuze, de eerste is goed
              O(deel, vraag, [goede antwoorden], uitleg, eenheid) open, een woord of getal
              FM(deel, zin, 'feit' of 'mening', uitleg)          feit of mening
              deel: o = onderwerp en doel, i = informatie, b = bedoeling en mening
     Alle fragmenten zijn verzonnen.
     ============================================================================ */
  var FR = [];
  function F(f){ FR.push(f); }
  function M(d, vraag, opties, u){ return { d:d, t:'mk', vraag:vraag, opties:opties, u:u }; }
  function O(d, vraag, antwoord, u, eenheid){ return { d:d, t:'open', vraag:vraag, antwoord:[].concat(antwoord), u:u, eenheid:eenheid || '' }; }
  function FM(d, zin, wat, u){ return { d:d, t:'fm', zin:zin, wat:wat, u:u }; }

  /* ===================== vmbo-bb: korte fragmenten, vragen over wat er gezegd wordt ===================== */
  F({ niv:'bb', id:'bb-spoor', soort:'omroepbericht', titel:'Op het station', sit:'Je staat op het station en wilt met de trein naar Zwolle. Dan hoor je een omroepbericht.',
    wie:{ o:['Omroeper', 'v'] },
    tekst:[
      'o: Reizigers naar Zwolle, let op. De trein van tien over half vier naar Zwolle vertrekt vandaag niet van spoor 5, maar van spoor 8.',
      'o: Ik herhaal: de trein naar Zwolle vertrekt van spoor 8.',
      'o: De trein heeft ongeveer vijf minuten vertraging, door een defecte overweg. Wij bieden u onze excuses aan voor het ongemak.'
    ],
    v:[
      M('o', 'Voor wie is dit omroepbericht bedoeld?', ['voor reizigers naar Zwolle', 'voor alle reizigers op het station', 'voor mensen die op spoor 8 werken', 'voor reizigers die van Zwolle komen'], 'Het bericht begint met ‘Reizigers naar Zwolle, let op.’ Daarmee zegt de omroeper meteen voor wie het is. Andere reizigers hoeven niets te doen.'),
      M('o', 'Waar gaat dit omroepbericht over?', ['een ander spoor en vertraging voor de trein naar Zwolle', 'een trein naar Zwolle die helemaal niet rijdt', 'een ongeluk op het station', 'nieuwe treinen die op spoor 5 gaan rijden'], 'De trein rijdt wel, maar van een ander spoor (8 in plaats van 5) en met vijf minuten vertraging. Hij valt dus niet uit.'),
      M('i', 'Wat moet je als reiziger naar Zwolle nu doen?', ['naar spoor 8 lopen', 'op spoor 5 blijven wachten', 'een andere trein nemen', 'een nieuw kaartje kopen'], 'De trein vertrekt nu van spoor 8. Wie op spoor 5 blijft staan, mist de trein: 5 was het oude spoor.'),
      O('i', 'Van welk spoor vertrekt de trein naar Zwolle nu? Schrijf alleen het getal.', ['8', 'acht', 'spoor 8'], 'Spoor 8. De omroeper zegt het twee keer. Spoor 5 is het spoor waar de trein normaal vertrekt.'),
      M('i', 'Hoeveel vertraging heeft de trein?', ['ongeveer vijf minuten', 'ongeveer tien minuten', 'een half uur', 'geen vertraging'], 'De omroeper zegt: ‘De trein heeft ongeveer vijf minuten vertraging.’'),
      M('i', 'Wat is de oorzaak van de vertraging?', ['een kapotte overweg', 'te veel reizigers', 'slecht weer', 'een zieke machinist'], '‘Defect’ betekent kapot. De vertraging komt door een defecte, dus kapotte, overweg.'),
      M('b', 'Waarom zegt de omroeper twee keer van welk spoor de trein vertrekt?', ['omdat dat het belangrijkste is en niemand het mag missen', 'omdat ze zich de eerste keer vergiste', 'omdat er twee treinen naar Zwolle gaan', 'omdat ze boos is op de reizigers'], 'Met ‘Ik herhaal’ zegt ze het nog een keer. Zo hoort iedereen het, ook wie de eerste keer niet goed luisterde. Ze vergist zich niet: twee keer noemt ze spoor 8.'),
      M('b', 'De omroeper zegt: ‘Wij bieden u onze excuses aan voor het ongemak.’ Wat bedoelt ze daarmee?', ['Het spijt de spoorwegen dat de reizigers er last van hebben.', 'De reizigers krijgen hun geld terug.', 'De reizigers moeten sorry zeggen.', 'De trein rijdt vandaag gratis.'], 'Excuses aanbieden is sorry zeggen. Over geld terug of gratis reizen zegt ze niets.')
    ] });

  F({ niv:'bb', id:'bb-tandarts', soort:'voicemail', titel:'Een bericht van de tandarts', sit:'Daan heeft een gemiste oproep. Hij luistert zijn voicemail af.',
    wie:{ m:['Mirjam', 'v'] },
    tekst:[
      'm: Hallo, u spreekt met Mirjam van tandartspraktijk De Witte Tand. Dit bericht is voor Daan Visser.',
      'm: Daan, je had morgen om half tien een afspraak voor controle. Helaas is de tandarts morgen ziek.',
      'm: We hebben een nieuwe afspraak voor je gemaakt: volgende week dinsdag, om tien over drie.',
      'm: Kun je dan niet? Bel ons dan even terug. Tot ziens!'
    ],
    doel:{ is:'informeren', wie:'Mirjam', niet:['activeren'], u:'Mirjam vertelt vooral iets: de afspraak van morgen gaat niet door en er is een nieuwe. Alleen als Daan dinsdag niet kan, moet hij iets doen.' },
    v:[
      M('o', 'Waarom belt de tandartspraktijk naar Daan?', ['De afspraak van morgen gaat niet door en er is een nieuwe afspraak.', 'Daan is zijn afspraak vergeten.', 'Daan moet nog een rekening betalen.', 'De praktijk gaat verhuizen.'], 'De tandarts is morgen ziek. Daarom gaat de afspraak niet door en heeft de praktijk een nieuwe afspraak gemaakt.'),
      O('i', 'Op welke dag is de nieuwe afspraak?', ['dinsdag', 'volgende week dinsdag', 'dinsdag volgende week'], 'Mirjam zegt: ‘volgende week dinsdag’. Morgen was de oude afspraak.'),
      M('i', 'Hoe laat is de nieuwe afspraak?', ['om 15.10 uur', 'om 9.30 uur', 'om 14.50 uur', 'om 15.30 uur'], 'Tien over drie is 15.10 uur. Half tien (9.30 uur) was de tijd van de oude afspraak.'),
      M('i', 'Wat moet Daan doen als hij dinsdag niet kan?', ['de praktijk terugbellen', 'een mail sturen', 'morgen toch langskomen', 'niets, de praktijk belt zelf nog'], 'Mirjam zegt: ‘Kun je dan niet? Bel ons dan even terug.’'),
      M('b', 'Hoe klinkt Mirjam in dit bericht?', ['vriendelijk en duidelijk', 'boos', 'verdrietig', 'ongeduldig'], 'Ze zegt netjes wie ze is, legt uit wat er aan de hand is en sluit vriendelijk af met ‘Tot ziens!’. ‘Helaas’ betekent dat ze het jammer vindt, niet dat ze verdrietig is.'),
      FM('b', 'De tandarts is morgen ziek.', 'feit', 'Dit is een feit: het is iets wat zo is en wat je kunt nagaan. Er staat geen oordeel in, zoals leuk of vervelend.')
    ] });

  F({ niv:'bb', id:'bb-schoenen', soort:'gesprek', titel:'In de schoenenwinkel', sit:'Lisa is in een schoenenwinkel. Een verkoper komt naar haar toe.',
    wie:{ v:['Verkoper', 'm'], l:['Lisa', 'v'] },
    tekst:[
      'v: Goedemiddag, kan ik je helpen?',
      'l: Ja, graag. Ik zoek sportschoenen om mee hard te lopen.',
      'v: Dan ben je hier goed. Welke maat heb je?',
      'l: Maat 39.',
      'v: Deze zijn heel goed voor hardlopen. En ze zijn nu in de aanbieding: ze kosten vijftig euro in plaats van tachtig.',
      'l: Mooi! Mag ik ze even passen?',
      'v: Natuurlijk. En, hoe zitten ze?',
      'l: Ze knellen een beetje bij mijn tenen.',
      'v: Dan pak ik even maat 40 voor je.',
      'l: Ja, deze zitten veel beter. Die neem ik.'
    ],
    v:[
      M('o', 'Wat wil Lisa kopen?', ['sportschoenen om mee hard te lopen', 'schoenen voor een feest', 'voetbalschoenen', 'nieuwe sokken'], 'Lisa zegt: ‘Ik zoek sportschoenen om mee hard te lopen.’'),
      M('o', 'Waar vindt dit gesprek plaats?', ['in een schoenenwinkel', 'in een sporthal', 'op school', 'bij de dokter'], 'Een verkoper vraagt of hij Lisa kan helpen, en Lisa past schoenen. Dat gebeurt in een winkel.'),
      O('i', 'Welke maat neemt Lisa uiteindelijk? Schrijf alleen het getal.', ['40', 'veertig', 'maat 40'], 'Maat 40. Maat 39 was haar eigen maat, maar die knelde. De verkoper pakt daarom maat 40, en die past.'),
      M('i', 'Hoeveel kosten de schoenen nu?', ['50 euro', '80 euro', '39 euro', '40 euro'], 'Ze kosten nu vijftig euro ‘in plaats van tachtig’. Tachtig euro was de oude prijs.'),
      M('b', 'Lisa zegt: ‘Ze knellen een beetje bij mijn tenen.’ Wat bedoelt ze?', ['De schoenen zijn te klein.', 'De schoenen zijn te groot.', 'De schoenen zijn te duur.', 'Ze vindt de kleur niet mooi.'], 'Knellen is te strak zitten. Daarom pakt de verkoper een maat groter.'),
      M('b', 'Wat vindt Lisa van de schoenen in maat 40?', ['Ze zitten goed.', 'Ze zijn nog steeds te klein.', 'Ze zijn te duur.', 'Ze zijn lelijk.'], 'Lisa zegt: ‘Ja, deze zitten veel beter. Die neem ik.’'),
      FM('b', 'Deze zijn heel goed voor hardlopen.', 'mening', 'Dit is een mening: de verkoper geeft een oordeel (‘heel goed’). Iemand anders kan er anders over denken. Dat ze vijftig euro kosten, is wel een feit.')
    ] });

  F({ niv:'bb', id:'bb-fiets', soort:'reclame', titel:'Reclame op de radio', sit:'Je luistert naar de lokale radio. Er komt een reclame.',
    wie:{ s:['Stem', 'm'] },
    tekst:[
      's: Is je fiets kapot? Een lekke band, piepende remmen of een ketting die steeds van je fiets valt?',
      's: Kom dan naar Fietsenmaker Snel in de Dorpsstraat! Wij maken je fiets binnen één uur.',
      's: En deze maand krijgen alle scholieren tien procent korting. Neem wel je schoolpas mee!',
      's: Fietsenmaker Snel: snel weer op weg.'
    ],
    doel:{ is:'overtuigen', wie:'deze reclame', niet:['activeren'], u:'Een reclame wil je overhalen: je moet vinden dat Fietsenmaker Snel een goede keus is, zodat je er heen gaat. Er zit wel informatie in (de korting), maar die is er om je over te halen.' },
    v:[
      M('o', 'Waarvoor is deze reclame?', ['een fietsenmaker', 'een winkel met nieuwe fietsen', 'een schoolpas', 'een fietsles'], 'De reclame gaat over Fietsenmaker Snel, die kapotte fietsen maakt.'),
      M('i', 'Wie krijgen er deze maand korting?', ['scholieren', 'iedereen met een lekke band', 'mensen uit de Dorpsstraat', 'ouders'], '‘Deze maand krijgen alle scholieren tien procent korting.’'),
      O('i', 'Hoeveel procent korting krijg je? Schrijf alleen het getal.', ['10', 'tien'], 'Tien procent. Eén uur gaat over hoe snel je fiets klaar is, niet over de korting.', 'procent'),
      M('i', 'Wat moet je meenemen om korting te krijgen?', ['je schoolpas', 'je rapport', 'een bon uit de krant', 'je ouders'], '‘Neem wel je schoolpas mee!’ Daarmee laat je zien dat je scholier bent.'),
      M('b', 'Waarom zegt de reclame: ‘Wij maken je fiets binnen één uur’?', ['Om te laten merken dat je niet lang hoeft te wachten.', 'Omdat de winkel na een uur dichtgaat.', 'Omdat je de fiets een uur mag lenen.', 'Omdat het een grapje is.'], 'Snel klaar is een reden om naar deze fietsenmaker te gaan. Dat past ook bij de naam: Snel.'),
      FM('b', 'Deze maand krijgen alle scholieren tien procent korting.', 'feit', 'Dit is een feit: je kunt nagaan of het klopt. Er zit geen oordeel in zoals ‘de beste’ of ‘heel goedkoop’.')
    ] });

  F({ niv:'bb', id:'bb-schoolreis', soort:'uitleg', titel:'De mentor over de schoolreis', sit:'Aan het eind van de mentorles vertelt je mentor iets aan de klas.',
    wie:{ m:['Mentor', 'v'] },
    tekst:[
      'm: Luister even allemaal. Volgende week vrijdag gaan we op schoolreis naar het pretpark.',
      'm: We vertrekken om half acht precies bij school, dus wees op tijd: de bus wacht niet.',
      'm: Neem een lunchpakket en iets te drinken mee. Geld voor een ijsje mag, maar niet meer dan tien euro.',
      'm: We zijn om zes uur ’s avonds weer terug.',
      'm: En vergeet het formulier niet. Dat moet uiterlijk maandag, ondertekend door je ouders, bij mij liggen.'
    ],
    doel:{ is:'informeren', wie:'de mentor', niet:['activeren'], u:'De mentor geeft vooral informatie over de schoolreis: wanneer, hoe laat, wat je meeneemt. Ze zegt ook een paar keer wat je moet doen, maar die zinnen horen bij de informatie.' },
    v:[
      M('o', 'Waar gaat deze uitleg over?', ['de schoolreis van volgende week', 'de regels in de kantine', 'een toets van volgende week', 'de sportdag'], 'De mentor vertelt alles over de schoolreis naar het pretpark.'),
      O('i', 'Hoe laat vertrekt de bus? Schrijf de tijd in cijfers, zoals 12.15', ['7.30', '07.30', '7:30', 'half acht', '7.30 uur'], 'Half acht, dus 7.30 uur. Zes uur is de tijd dat jullie terug zijn.'),
      M('i', 'Hoeveel geld mag je hoogstens meenemen?', ['tien euro', 'vijf euro', 'twintig euro', 'geen geld'], '‘Geld voor een ijsje mag, maar niet meer dan tien euro.’'),
      M('i', 'Wanneer moet het formulier bij de mentor liggen?', ['uiterlijk maandag', 'volgende week vrijdag', 'vandaag', 'op de dag van de schoolreis'], '‘Uiterlijk maandag’ betekent: maandag of eerder. Vrijdag is de dag van de schoolreis zelf.'),
      M('b', 'De mentor zegt: ‘De bus wacht niet.’ Wat bedoelt ze?', ['Wie te laat is, gaat niet mee.', 'De bus rijdt heel hard.', 'De bus is vaak te laat.', 'De chauffeur heeft geen tijd voor vragen.'], 'Als de bus niet wacht, vertrekt hij om half acht, ook als jij er nog niet bent. Dan ben je te laat en ga je niet mee.')
    ] });

  F({ niv:'bb', id:'bb-koe', soort:'nieuwsbericht', titel:'Het nieuws uit de regio', sit:'Op de radio is het regionale nieuws. Je hoort het laatste bericht.',
    wie:{ n:['Nieuwslezer', 'm'] },
    tekst:[
      'n: En dan nog een opvallend bericht. In een dorp in Friesland heeft de brandweer gisteravond een koe uit een sloot gehaald.',
      'n: Het dier was door een hek gebroken en in het water gegleden.',
      'n: Het duurde bijna twee uur voordat de koe met een grote kraan uit de sloot was getild.',

    ],

  F({ niv:'kgt', id:'kgt-fietslicht', soort:'radiospot', titel:'Een spotje op de radio', sit:'Tussen twee liedjes hoor je een spotje van de gemeente.',

      'v: Ik heb helemaal niks gezien.',
      's: Precies. Zonder licht zien anderen jou niet. Automobilisten zien een fietser zonder licht vaak pas als het te laat is.',

    v:[

      M('i', 'Waar kun je de gratis lampjes halen?', ['bij de conciërge op school', 'bij het gemeentehuis', 'bij de fietsenmaker', 'bij de politie'], '‘Haal ze in de pauze bij de conciërge.’'),
      M('i', 'Wanneer kun je de lampjes halen?', ['deze week in de pauze', 'na schooltijd', 'zaterdag', 'de hele maand'], 'De gemeente deelt ze ‘deze week’ uit, en je haalt ze ‘in de pauze’.'),
      M('b', 'Wat bedoelt het spotje met ‘Zie en word gezien’?', ['Zorg dat je zelf goed ziet en dat anderen jou zien.', 'Draag een bril als je fietst.', 'Kijk goed uit naar de politie.', 'Fiets alleen als het licht is.'], 'Met een lamp zie je zelf de weg, en zien anderen jou. Dat is de boodschap van het hele spotje.')

  F({ niv:'kgt', id:'kgt-bijbaan', soort:'sollicitatiegesprek', titel:'Een bijbaan in de supermarkt', sit:'Jesse solliciteert naar een bijbaan als vakkenvuller. Hij praat met de bedrijfsleider.',
    wie:{ b:['Bedrijfsleider', 'v'], j:['Jesse', 'm'] },
    tekst:[
      'b: Goedemiddag Jesse, ga zitten. Je wilt bij ons komen werken als vakkenvuller?',
      'j: Ja, dat lijkt me leuk. Ik wil graag mijn eigen geld verdienen.',
      'b: Heb je al eens eerder gewerkt?',
      'j: Ik heb een jaar kranten bezorgd. Daar moest ik elke ochtend om zes uur beginnen, dus ik ben wel gewend om op tijd te zijn.',
      'b: Dat is goed om te horen. Wanneer kun je werken?',
      'j: Op dinsdag- en donderdagavond, en op zaterdag. Op woensdag heb ik voetbaltraining.',
      'b: Wij zoeken vooral iemand voor de zaterdag en de vrijdagavond.',
      'j: Vrijdagavond kan eventueel ook wel, als ik het op tijd weet.',
      'b: Mooi. Je begint met een proefperiode van een maand. Aan het eind van de week hoor je of je bent aangenomen.'
    ],
    v:[
      M('o', 'Wat voor gesprek is dit?', ['een sollicitatiegesprek voor een bijbaan', 'een gesprek met een klant', 'een gesprek met een voetbaltrainer', 'een gesprek over een klacht'], 'Jesse wil ‘komen werken als vakkenvuller’ en de bedrijfsleider vraagt naar zijn ervaring en wanneer hij kan. Dat is een sollicitatiegesprek.'),
      M('i', 'Welke werkervaring heeft Jesse?', ['een jaar kranten bezorgen', 'vakkenvullen', 'voetbaltrainer', 'geen'], '‘Ik heb een jaar kranten bezorgd.’'),
      M('i', 'Op welke dag kan Jesse niet werken?', ['woensdag', 'zaterdag', 'dinsdag', 'donderdag'], 'Op woensdag heeft hij voetbaltraining.'),
      M('i', 'Welke uitspraak over hoe het verder gaat klopt?', ['Jesse hoort aan het eind van de week of hij is aangenomen.', 'Jesse begint morgen.', 'Jesse krijgt meteen een vast contract.', 'Jesse moet nog een brief sturen.'], 'De bedrijfsleider zegt: ‘Aan het eind van de week hoor je of je bent aangenomen.’ Als hij wordt aangenomen, begint hij met een proefperiode, geen vast contract.'),
      M('b', 'Waarom vertelt Jesse dat hij om zes uur ’s ochtends moest beginnen?', ['Om te laten zien dat hij op tijd kan zijn.', 'Omdat hij graag vroeg wil werken.', 'Omdat hij klaagt over zijn oude baan.', 'Omdat hij ’s ochtends moe is.'], 'Hij zegt erbij: ‘dus ik ben wel gewend om op tijd te zijn.’ Zo laat hij zien dat hij een betrouwbare werknemer is.'),
      M('b', 'Jesse zegt: ‘Vrijdagavond kan eventueel ook wel, als ik het op tijd weet.’ Wat bedoelt hij?', ['Hij kan op vrijdagavond werken als hij het van tevoren hoort.', 'Hij wil nooit op vrijdag werken.', 'Hij komt vaak te laat.', 'Hij moet het eerst aan zijn ouders vragen.'], '‘Eventueel’ betekent: als het nodig is. En ‘als ik het op tijd weet’ is zijn voorwaarde.')
    ] });

  F({ niv:'kgt', id:'kgt-brandwond', soort:'uitleg', titel:'Eerste hulp bij een brandwond', sit:'Je kijkt naar een korte uitleg over eerste hulp.',

      'u: Een brandwond, wat doe je dan? Het belangrijkste is koelen, en zo snel mogelijk.',

      'u: Gebruik ook geen boter of zalf. Dan houd je de warmte juist vast.',
      'u: Doe ringen of een horloge in de buurt van de wond voorzichtig af, want de huid kan opzwellen.',
      'u: Is de brandwond groter dan de handpalm van de gewonde, of zit er een open wond? Bel dan de huisarts. Is het heel ernstig, bel dan 112.'
    ],
    doel:{ is:'informeren', wie:'deze uitleg', niet:['activeren'], u:'De spreker legt uit wat je moet doen bij een brandwond. Zo’n uitleg in stappen geeft informatie.' },
    v:[
      M('o', 'Waarover gaat deze uitleg?', ['wat je moet doen bij een brandwond', 'hoe je brand in huis voorkomt', 'wanneer je 112 belt', 'hoe je een zalf maakt'], 'De uitleg begint met: ‘Een brandwond, wat doe je dan?’ 112 bellen is maar een klein stukje aan het eind.'),
      O('i', 'Hoeveel minuten moet je een brandwond minstens koelen? Schrijf alleen het getal.', ['10', 'tien'], 'Minstens tien minuten.', 'minuten'),
      M('i', 'Met welk water koel je een brandwond?', ['lauw, zacht stromend water', 'ijskoud water', 'warm water', 'water met zout'], '‘Houd de wond onder lauw, zacht stromend water.’ IJskoud water kan de huid juist meer beschadigen.'),
      M('i', 'Waarom moet je ringen afdoen?', ['De huid kan opzwellen.', 'Ringen worden heet.', 'Ringen kunnen gaan roesten.', 'Anders zie je de wond niet.'], '‘Doe ringen voorzichtig af, want de huid kan opzwellen.’ Een ring kan dan gaan knellen.'),
      M('b', 'Waarom noemt de spreker boter en zalf?', ['Omdat sommige mensen denken dat dat helpt, terwijl het niet goed is.', 'Omdat je ze na het koelen moet gebruiken.', 'Omdat ze de pijn wegnemen.', 'Omdat ze in elke verbanddoos zitten.'], 'Ze zegt: ‘Gebruik ook geen boter of zalf.’ Je noemt zoiets alleen als mensen het weleens doen. Het houdt de warmte juist vast.'),
      M('b', 'Waarom zegt de spreker erbij: ‘Dus niet ijskoud’?', ['Omdat ijskoud water de huid nog meer kan beschadigen.', 'Omdat ijskoud water niet stroomt.', 'Omdat lauw water sneller werkt dan koud water.', 'Omdat er vaak geen koud water is.'], 'Veel mensen denken: hoe kouder, hoe beter. Daarom waarschuwt ze: ‘ijs of ijskoud water kan de huid nog meer beschadigen.’')
    ] });

  F({ niv:'kgt', id:'kgt-uniform', soort:'discussie', titel:'Een schooluniform?', sit:'In een jongerenprogramma op de radio praten Sara en Thomas over een schooluniform.',
    wie:{ p:['Presentator', 'm'], s:['Sara', 'v'], t:['Thomas', 'm'] },
    tekst:[
      'p: Moet er op school een schooluniform komen? Ik heb Sara en Thomas aan de lijn. Sara, jij bent voor.',
      's: Ja. Nu wordt er op school heel erg op kleding gelet. Wie geen merkkleding heeft, hoort er soms niet bij. Met een uniform is iedereen gelijk.',
      'p: Thomas?',
      't: Ik ben tegen. Met kleding laat je zien wie je bent, en dat wil ik niet kwijt. En een uniform kost ook geld: ouders moeten het toch kopen.',
      's: Maar merkkleding is veel duurder.',
      't: Dat hoeft niet. Je kunt ook gewone kleding kopen. Het probleem is niet de kleding, maar het pesten.',
      'p: Daar zit wat in. Luisteraars, wat vinden jullie? Stuur een berichtje naar de studio.'
    ],
    v:[
      M('o', 'Waarover gaat deze discussie?', ['of er op school een schooluniform moet komen', 'pesten op school', 'de prijs van merkkleding', 'wat je ouders voor je kopen'], 'De presentator stelt de vraag meteen aan het begin. Pesten en merkkleding zijn argumenten in de discussie.'),
      M('o', 'Wat voor fragment is dit?', ['een discussie tussen twee mensen met een andere mening', 'een interview met een deskundige', 'een reclame voor schooluniformen', 'een nieuwsbericht'], 'Sara is voor en Thomas is tegen. Ze reageren op elkaar: dat is een discussie.'),
      M('i', 'Welk argument geeft Sara voor een uniform?', ['Met een uniform is iedereen gelijk.', 'Een uniform is goedkoop.', 'Met kleding laat je zien wie je bent.', 'Een uniform is mooi.'], 'Sara zegt: ‘Met een uniform is iedereen gelijk.’ ‘Met kleding laat je zien wie je bent’ is juist een argument van Thomas.'),
      M('i', 'Welk argument gebruikt Thomas?', ['Een uniform kost ook geld.', 'Merkkleding is veel duurder.', 'Met een uniform hoort iedereen erbij.', 'Op school wordt te veel op kleding gelet.'], 'Thomas: ‘een uniform kost ook geld: ouders moeten het toch kopen.’ De andere argumenten zijn van Sara.'),
      M('b', 'Wat is het standpunt van Thomas?', ['Hij is tegen een schooluniform.', 'Hij is voor een schooluniform.', 'Hij weet het nog niet.', 'Hij wil alleen een uniform bij gym.'], 'Thomas zegt het letterlijk: ‘Ik ben tegen.’'),
      M('b', 'Thomas zegt: ‘Het probleem is niet de kleding, maar het pesten.’ Wat bedoelt hij?', ['Een uniform lost het echte probleem niet op.', 'Kleding is nooit een probleem.', 'Hij wordt zelf gepest.', 'Pesten komt door merkkleding.'], 'Volgens Thomas gaan pesters gewoon door, ook met een uniform. Dan moet je het pesten aanpakken, niet de kleding.'),
      FM('b', 'Met kleding laat je zien wie je bent.', 'mening', 'Dit is een mening van Thomas: je kunt het niet nagaan, en een ander kan er anders over denken.')
    ] });

  F({ niv:'kgt', id:'kgt-veerboot', soort:'omroepbericht', titel:'Op de veerboot', sit:'Je zit op de veerboot terug van een eiland. Dan hoor je een bericht van de kapitein.',

      'k: Vanwege de harde wind kan de boot wat schommelen. Blijf daarom zo veel mogelijk zitten.',
      'k: Passagiers met een auto worden verzocht pas naar het autodek te gaan als wij dat omroepen. De trappen naar het autodek zijn tot die tijd gesloten.',
      'k: Fietsers verlaten het schip via de loopbrug aan de voorkant. Het restaurant gaat over vijf minuten dicht.',
      'k: Wij wensen u een prettige dag.'

    v:[
      M('o', 'Waarom spreekt de kapitein de passagiers toe?', ['De boot komt bijna aan en hij geeft aanwijzingen.', 'Er is een noodsituatie aan boord.', 'Het restaurant gaat open.', 'De boot heeft veel vertraging.'], 'Hij zegt dat de boot over twintig minuten aankomt, en vertelt wat passagiers met een auto en fietsers moeten doen. Er is geen nood: de boot schommelt alleen wat.'),
      O('i', 'Over hoeveel minuten komt de boot aan? Schrijf alleen het getal.', ['20', 'twintig'], 'Over ongeveer twintig minuten. Vijf minuten gaat over het restaurant.', 'minuten'),
      M('i', 'Wat moeten passagiers met een auto doen?', ['wachten tot omgeroepen wordt dat ze naar het autodek mogen', 'nu meteen naar het autodek gaan', 'via de loopbrug van boord gaan', 'in hun auto blijven zitten'], 'Ze mogen ‘pas naar het autodek gaan als wij dat omroepen’. De trappen zijn tot die tijd dicht.'),
      M('i', 'Hoe gaan fietsers van boord?', ['via de loopbrug aan de voorkant', 'via het autodek', 'via de achterkant', 'samen met de auto’s'], '‘Fietsers verlaten het schip via de loopbrug aan de voorkant.’'),
      M('b', 'Waarom vraagt de kapitein om te blijven zitten?', ['Door de harde wind schommelt de boot en kun je vallen.', 'Omdat het restaurant dichtgaat.', 'Omdat de trappen gesloten zijn.', 'Omdat hij de passagiers wil tellen.'], '‘Vanwege de harde wind kan de boot wat schommelen. Blijf daarom zo veel mogelijk zitten.’ Wie loopt, kan dan vallen.'),
      M('b', 'De kapitein zegt: ‘Passagiers met een auto worden verzocht ...’ Wat betekent ‘worden verzocht’?', ['er wordt hun gevraagd', 'het wordt hun verboden', 'ze mogen kiezen', 'ze worden gewaarschuwd'], 'Iemand iets verzoeken is iemand netjes iets vragen. Het is een beleefde manier van zeggen wat je moet doen.')
    ] });

  F({ niv:'kgt', id:'kgt-koptelefoon', soort:'gesprek', titel:'Een kapotte koptelefoon', sit:'Mevrouw Yilmaz komt terug in de elektronicawinkel waar ze een koptelefoon kocht.',

      'y: Ja, hier.',
      'm: Dan valt hij onder de garantie. We kunnen hem opsturen voor reparatie. Dat duurt ongeveer twee weken.',
      'y: Twee weken? Ik gebruik hem elke dag in de trein. Kan ik niet gewoon een nieuwe krijgen?',
      'm: Normaal sturen we hem eerst op. Maar ik zie dat u hem minder dan dertig dagen geleden hebt gekocht. Dan mag ik hem meteen omruilen.',
      'y: O, gelukkig. Dat scheelt een hoop.',
      'm: Alstublieft. Ik heb er wel alleen nog een in het zwart. De witte is uitverkocht.',
      'y: Zwart is ook prima.'
    ],
    v:[
      M('o', 'Waarom komt mevrouw Yilmaz naar de winkel?', ['Haar koptelefoon doet het niet goed meer.', 'Ze wil een andere kleur.', 'Ze is haar bon kwijt.', 'Ze wil een nieuwe koptelefoon kopen.'], 'De linkerkant van haar koptelefoon ‘doet het niet meer’.'),
      M('i', 'Waarom mag de koptelefoon meteen worden omgeruild?', ['Hij is minder dan dertig dagen geleden gekocht.', 'Mevrouw Yilmaz is boos.', 'De witte is uitverkocht.', 'Reparatie is te duur.'], 'De medewerker zegt dat hij hem mag omruilen, omdat ze hem minder dan dertig dagen geleden kocht. Normaal gaat hij eerst op voor reparatie.'),
      O('i', 'Welke kleur heeft de nieuwe koptelefoon?', ['zwart', 'zwarte'], 'Zwart: de witte is uitverkocht.'),
      M('i', 'Welke uitspraak klopt?', ['De linkerkant van de koptelefoon is kapot.', 'De rechterkant van de koptelefoon is kapot.', 'Ze kocht de koptelefoon drie maanden geleden.', 'Ze heeft geen bon meer.'], 'Het is de linkerkant, ze kocht hem drie weken geleden, en ze heeft de bon nog.'),
      M('b', 'Hoe reageert mevrouw Yilmaz als ze hoort dat reparatie twee weken duurt?', ['Ze is er niet blij mee en vraagt om een nieuwe.', 'Ze vindt het prima.', 'Ze wordt woedend en loopt weg.', 'Ze wil liever nog langer wachten.'], 'Ze zegt verbaasd ‘Twee weken?’, legt uit dat ze hem elke dag gebruikt en vraagt om een nieuwe. Woedend is te sterk: ze blijft rustig.'),
      M('b', 'Ze zegt: ‘O, gelukkig. Dat scheelt een hoop.’ Hoe voelt ze zich?', ['opgelucht', 'teleurgesteld', 'verbaasd', 'boos'], '‘Gelukkig’ zeg je als iets beter afloopt dan je dacht. Ze hoeft nu geen twee weken zonder koptelefoon.')
    ] });

  F({ niv:'kgt', id:'kgt-slaap', soort:'interview', titel:'Waarom tieners zo moe zijn', sit:'In een radioprogramma over gezondheid praat de presentator met slaaponderzoeker Anouk Peters.',
    wie:{ p:['Presentator', 'm'], a:['Anouk Peters', 'v'] },
    tekst:[
      'p: Veel tieners zijn ’s ochtends doodmoe. Slaaponderzoeker Anouk Peters, hoe komt dat?',
      'a: Tieners hebben acht tot tien uur slaap nodig, maar veel jongeren slapen er maar zes of zeven. In de puberteit verschuift je biologische klok: je wordt ’s avonds later moe. Maar de school begint gewoon om half negen.',
      'p: Ligt het dus niet aan de telefoon?',
      'a: Die speelt ook mee. Wie tot laat op zijn telefoon zit, blijft langer wakker. Mijn advies: leg je telefoon een uur voor het slapen weg, het liefst buiten je slaapkamer.',
      'p: Zou school later moeten beginnen?',
      'a: Ik denk het wel. In het buitenland hebben scholen dat geprobeerd, en daar sliepen leerlingen langer. Maar ik snap ook dat het lastig te regelen is.'
    ],
    v:[
      M('o', 'Wat is het onderwerp van dit interview?', ['waarom veel tieners ’s ochtends moe zijn', 'hoe je een slaaponderzoek doet', 'waarom telefoons slecht zijn', 'hoe laat scholen in het buitenland beginnen'], 'De presentator vraagt het meteen: ‘Veel tieners zijn ’s ochtends doodmoe. Hoe komt dat?’ De telefoon en de begintijd zijn delen van het antwoord.'),
      O('i', 'Hoeveel uur slaap hebben tieners minstens nodig volgens Anouk Peters? Schrijf alleen het getal.', ['8', 'acht'], 'Acht tot tien uur, dus minstens acht. Zes of zeven uur is wat veel jongeren echt slapen.', 'uur'),
      M('i', 'Wat gebeurt er volgens Anouk Peters in de puberteit?', ['Je wordt ’s avonds later moe.', 'Je hebt minder slaap nodig.', 'Je wordt ’s avonds eerder moe.', 'Je slaapt dieper.'], '‘In de puberteit verschuift je biologische klok: je wordt ’s avonds later moe.’'),
      M('i', 'Welk advies geeft Anouk Peters?', ['Leg je telefoon een uur voor het slapen weg.', 'Ga om acht uur naar bed.', 'Zet je telefoon op stil naast je bed.', 'Slaap ’s middags een uurtje.'], 'Ze zegt: ‘leg je telefoon een uur voor het slapen weg, het liefst buiten je slaapkamer.’ Naast je bed is dus juist niet de bedoeling.'),
      M('b', 'Wat vindt Anouk Peters van een latere begintijd van school?', ['Ze is ervoor, maar ziet ook dat het lastig is.', 'Ze is ertegen.', 'Het maakt haar niet uit.', 'Ze denkt dat het makkelijk te regelen is.'], '‘Ik denk het wel’ laat zien dat ze voor is. Met ‘Maar ik snap ook dat het lastig te regelen is’ geeft ze een nadeel toe.'),
      M('b', 'Waarom vraagt de presentator: ‘Ligt het dus niet aan de telefoon?’', ['Hij wil weten of de telefoon ook een oorzaak is.', 'Hij wil zeggen dat de telefoon niet slecht is.', 'Hij is het niet eens met Anouk Peters.', 'Hij wil over iets anders praten.'], 'Anouk noemde als oorzaak de biologische klok. Veel mensen denken dat het aan de telefoon ligt, dus vraagt hij daarnaar. Zij zegt dat die ‘ook meespeelt’.'),
      FM('b', 'In de puberteit verschuift je biologische klok.', 'feit', 'Dit is een feit: het is onderzocht en je kunt het nagaan. ‘Ik denk dat school later moet beginnen’ is wel een mening.')
    ] });

  F({ niv:'kgt', id:'kgt-keuzemenu', soort:'keuzemenu', titel:'De klantenservice', sit:'Je belt de klantenservice van je energiebedrijf. Je hoort eerst een ingesproken bericht.',

      'b: Let op: ruikt u gas in huis? Bel dan niet ons, maar direct het landelijke storingsnummer.',

  F({ niv:'kgt', id:'kgt-oma', soort:'column', titel:'Mijn oma appt', sit:'In een radioprogramma leest Jayden een korte column voor die hij zelf schreef.',
    wie:{ j:['Jayden', 'm'] },
    tekst:[
      'j: Mijn oma is tachtig, en sinds vorige maand heeft ze een smartphone. Ze appt me nu elke ochtend om zeven uur.',
      'j: Niet één berichtje, nee: tien. Goedemorgen. Heb je goed geslapen? Het regent. Neem een jas mee. En dan een foto van haar duim. Per ongeluk, denk ik.',
      'j: Vorige week stuurde ze een spraakbericht van vier minuten. Ik hoorde vooral geritsel en de radio. Pas aan het eind zei ze: hoe stuur je nou een spraakbericht?',
      'j: Eerlijk gezegd vind ik het wel gezellig. Ik spreek haar nu vaker dan ooit. Al zet ik mijn telefoon ’s ochtends wel op stil.'
    ],
    doel:{ is:'amuseren', wie:'Jayden', niet:[], u:'Jayden vertelt een persoonlijk verhaal met grappige voorbeelden: de tien berichtjes, de foto van de duim, het spraakbericht vol geritsel. Hij wil je vooral vermaken.' },
    v:[
      M('o', 'Waar gaat deze column over?', ['de oma van Jayden die leert appen', 'hoe je een spraakbericht stuurt', 'waarom ouderen geen smartphone moeten hebben', 'het weer van vorige week'], 'De hele column gaat over oma en haar nieuwe smartphone. Jayden zegt nergens dat ouderen geen smartphone moeten hebben.'),
      O('i', 'Hoe laat appt oma elke ochtend? Schrijf de tijd in cijfers, zoals 12.15', ['7.00', '07.00', '7:00', '7', '7 uur', 'zeven uur', '7.00 uur'], 'Om zeven uur, dus 7.00 uur.'),
      M('i', 'Wat hoorde Jayden in het spraakbericht van vier minuten?', ['vooral geritsel en de radio', 'een liedje van oma', 'een lang verhaal over het weer', 'helemaal niets'], '‘Ik hoorde vooral geritsel en de radio.’ Pas aan het eind zei oma iets.'),
      M('b', '‘En dan een foto van haar duim. Per ongeluk, denk ik.’ Wat bedoelt Jayden?', ['Oma drukte per ongeluk op de knop van de camera.', 'Oma wilde haar duim laten zien.', 'Oma had haar duim bezeerd.', 'Oma stuurt een duimpje omdat ze het leuk vindt.'], 'Met ‘per ongeluk’ zegt hij dat oma de foto niet wilde maken. Haar duim zat voor de camera.'),
      M('b', 'Hoe denkt Jayden over al die berichten van oma?', ['Hij vindt het eigenlijk gezellig.', 'Hij vindt het vervelend en wil dat het stopt.', 'Hij maakt zich zorgen om oma.', 'Het kan hem niets schelen.'], '‘Eerlijk gezegd vind ik het wel gezellig. Ik spreek haar nu vaker dan ooit.’ Hij lacht er wel om, maar hij wil niet dat het stopt.'),
      M('b', 'Waarom zet Jayden zijn telefoon ’s ochtends op stil?', ['Om niet wakker te worden van de berichten om zeven uur.', 'Omdat hij boos is op oma.', 'Omdat hij geen berichten meer wil krijgen.', 'Omdat zijn telefoon kapot is.'], 'Oma appt elke ochtend om zeven uur, tien berichtjes. Met de telefoon op stil krijgt hij ze nog wel, maar wordt hij er niet wakker van.')
    ] });

  F({ niv:'hv', id:'hv-binnenstad', soort:'radiogesprek', titel:'Een autovrije binnenstad', sit:'In een actualiteitenprogramma praat de presentator met wethouder Bas Hendriks en winkeleigenaar Marieke de Wit.',
    wie:{ p:['Presentator', 'm'], b:['Wethouder Hendriks', 'm'], m:['Marieke de Wit', 'v'] },
    tekst:[
      'p: Vanaf januari mogen er geen auto’s meer in de binnenstad van Westerveld. Wethouder Bas Hendriks, waarom deze maatregel?',
      'b: De binnenstad is van de mensen, niet van de auto’s. Er zijn te veel bijna-ongelukken met fietsers, en de lucht is er slechter dan elders in de stad. Steden die het eerder deden, zagen juist meer bezoekers.',
      'p: Marieke de Wit, u heeft een schoenwinkel in het centrum. Blij?',
      'm: Blij is een groot woord. Ik snap het idee, hoor. Maar mijn klanten zijn vaak ouderen. Die gaan echt niet met twee tassen vol in de bus zitten. Die rijden straks gewoon naar het winkelcentrum buiten de stad, waar je gratis kunt parkeren.',
      'b: Daarom komen er aan de rand van het centrum twee nieuwe parkeergarages, en een gratis pendelbusje.',
      'm: Een busje, ja. Dat heb ik vaker gehoord. Bij de vorige verbouwing zou er ook van alles komen. Ik heb toen een half jaar lang een bouwput voor de deur gehad.',
      'p: Wethouder, wat zegt u tegen ondernemers als Marieke?',
      'b: Dat we na een jaar samen met hen kijken hoe het gaat. Als het slecht uitpakt voor de winkels, passen we het aan.'
    ],
    v:[
      M('o', 'Waarover gaat dit gesprek?', ['over de autovrije binnenstad en wat dat betekent voor de winkels', 'over nieuwe parkeergarages aan de rand van de stad', 'over de luchtkwaliteit in Westerveld', 'over de vorige verbouwing van het centrum'], 'De maatregel en de gevolgen voor de winkels zijn het onderwerp. Parkeergarages, lucht en de verbouwing zijn argumenten die in het gesprek langskomen.'),
      M('i', 'Welke argumenten geeft de wethouder voor de maatregel?', ['minder gevaar voor fietsers en een betere lucht', 'gratis parkeren en een pendelbusje', 'minder winkels en meer woningen', 'lagere kosten voor de gemeente'], 'Hij noemt de bijna-ongelukken met fietsers en de slechte lucht. Parkeergarages en het busje zijn zijn antwoord op de kritiek, geen reden voor de maatregel.'),
      M('i', 'Welk tegenargument geeft Marieke?', ['Oudere klanten gaan dan naar het winkelcentrum buiten de stad.', 'Fietsers zijn juist gevaarlijk voor voetgangers.', 'Het pendelbusje is te duur.', 'De lucht is in het centrum helemaal niet slecht.'], 'Ze zegt dat haar oudere klanten niet met volle tassen de bus nemen, maar naar het winkelcentrum buiten de stad rijden. Dan verliest zij klanten.'),
      M('b', 'Marieke zegt: ‘Blij is een groot woord.’ Wat bedoelt ze?', ['Ze is niet echt blij met de maatregel.', 'Ze is heel erg blij.', 'Ze vindt de vraag lastig.', 'Ze wil er niet over praten.'], 'Als je zegt dat een woord ‘groot’ is, vind je het te sterk. Ze is dus niet blij, en daarna legt ze uit waarom.'),
      M('b', 'Waarom vertelt Marieke over de vorige verbouwing?', ['Ze laat merken dat ze niet gelooft dat de beloftes worden nagekomen.', 'Ze wil klagen over de bouwvakkers.', 'Ze vond de vorige verbouwing een succes.', 'Ze wil dat het centrum opnieuw wordt verbouwd.'], 'Toen ‘zou er ook van alles komen’, en zij zat een half jaar met een bouwput. Daarmee zegt ze zonder het letterlijk te zeggen: ik vertrouw die beloftes niet.'),
      M('b', 'Welke houding hoor je bij Marieke in ‘Een busje, ja. Dat heb ik vaker gehoord.’?', ['wantrouwend', 'enthousiast', 'verdrietig', 'onverschillig'], 'Ze herhaalt het woord ‘busje’ en zegt dat ze dat ‘vaker gehoord’ heeft. Ze gelooft het dus niet zomaar.'),
      M('b', 'Hoe reageert de wethouder op de kritiek van Marieke?', ['Hij belooft samen met de ondernemers te kijken en de maatregel zo nodig aan te passen.', 'Hij trekt de maatregel in.', 'Hij zegt dat Marieke ongelijk heeft.', 'Hij geeft geen antwoord.'], '‘Dat we na een jaar samen met hen kijken hoe het gaat. Als het slecht uitpakt voor de winkels, passen we het aan.’ Hij houdt de maatregel dus wel.')
    ] });

  F({ niv:'hv', id:'hv-ruis', soort:'uitleg', titel:'Hoe werkt ruisonderdrukking?', sit:'In een wetenschapsprogramma op de radio legt een presentator uit hoe een koptelefoon met ruisonderdrukking werkt.',
    wie:{ u:['Presentator', 'm'] },
    tekst:[
      'u: Je zit in de trein, je zet je koptelefoon op, en ineens is het gebrom van de trein weg. Hoe kan dat?',
      'u: Een koptelefoon met ruisonderdrukking heeft kleine microfoontjes aan de buitenkant. Die vangen het geluid van buiten op. Een chip maakt daar razendsnel een geluidsgolf van die precies het spiegelbeeld is: waar de ene golf omhoog gaat, gaat de andere omlaag.',
      'u: Komen die twee golven samen in je oor, dan heffen ze elkaar op. Je hoort dan veel minder.',
      'u: Dat werkt het best bij een gelijkmatig geluid, zoals het brommen van een motor. Bij plotselinge geluiden, zoals een gillend kind of een stem, werkt het minder goed: die veranderen te snel. Daarom hoor je je buurman in de trein vaak nog wel praten.',
      'u: En nog een tip. Zet je muziek niet harder dan nodig. Juist doordat het lawaai van buiten wegvalt, heb je minder volume nodig. Goed voor je oren.'
    ],
    doel:{ is:'informeren', wie:'deze uitleg', niet:[], u:'De presentator legt uit hoe iets werkt. De tip aan het eind volgt uit die uitleg, maar is niet het hoofddoel.' },
    v:[
      M('o', 'Welke vraag beantwoordt deze uitleg vooral?', ['Hoe houdt een koptelefoon met ruisonderdrukking geluid van buiten tegen?', 'Waarom maken treinen zoveel lawaai?', 'Hoe raken je oren beschadigd?', 'Welke koptelefoon is het beste?'], 'De presentator stelt de vraag zelf aan het begin (‘Hoe kan dat?’) en beantwoordt die daarna stap voor stap.'),
      M('i', 'Wat doen de microfoontjes aan de buitenkant?', ['Ze vangen het geluid van buiten op.', 'Ze nemen je stem op.', 'Ze maken het geluid harder.', 'Ze meten hoe hard je muziek staat.'], '‘Die vangen het geluid van buiten op.’ Van dat geluid maakt de chip daarna het spiegelbeeld.'),
      M('i', 'Bij welk geluid werkt ruisonderdrukking het best?', ['een gelijkmatig geluid, zoals een brommende motor', 'een gillend kind', 'een stem', 'een plotselinge knal'], 'Het werkt het best ‘bij een gelijkmatig geluid, zoals het brommen van een motor’. Plotselinge geluiden veranderen te snel.'),
      M('b', 'Wat betekent ‘heffen elkaar op’ hier?', ['Ze werken elkaar weg, zodat er weinig geluid overblijft.', 'Ze maken elkaar sterker.', 'Ze gaan samen omhoog.', 'Ze komen na elkaar in je oor.'], 'Eén golf gaat omhoog als de andere omlaag gaat. Samen blijft er dan bijna niets over: ‘Je hoort dan veel minder.’'),
      M('b', 'Waarom noemt de presentator de buurman die je nog hoort praten?', ['als voorbeeld van geluid dat te snel verandert om weg te werken', 'om te laten zien dat de koptelefoon kapot kan gaan', 'om te zeggen dat je in de trein niet mag praten', 'als voorbeeld van een gelijkmatig geluid'], 'Een stem is een plotseling, snel veranderend geluid. ‘Daarom’ hoor je de buurman nog: het voorbeeld hoort bij de zin ervoor.'),
      M('b', 'Wat is de functie van het laatste deel (‘En nog een tip ...’)?', ['een advies geven dat volgt uit de uitleg', 'de uitleg samenvatten', 'een tegenargument noemen', 'reclame maken voor een merk'], 'Omdat het lawaai wegvalt, heb je minder volume nodig: het advies bouwt voort op de uitleg. Een samenvatting herhaalt de uitleg, en dat gebeurt hier niet.')
    ] });

  F({ niv:'hv', id:'hv-kleding', soort:'interview', titel:'Lina en haar tweedehands kleding', sit:'In een programma over jonge ondernemers praat de interviewer met Lina, zeventien jaar.',
    wie:{ i:['Interviewer', 'm'], l:['Lina', 'v'] },
    tekst:[
      'i: Lina, je bent zeventien en je hebt een eigen bedrijf in tweedehands kleding. Hoe begon dat?',
      'l: Eigenlijk uit ergernis. Mijn kast hing vol met dingen die ik één keer had gedragen. Ik dacht: dat kan niet de bedoeling zijn. Dus ik ging mijn eigen kleren online verkopen, en daarna die van vriendinnen.',
      'i: En nu?',
      'l: Nu verkoop ik zo’n tweehonderd stuks per maand. Ik koop partijen in bij kringloopwinkels, ik was en strijk alles, en ik maak er mooie foto’s van.',
      'i: Dat klinkt als een hoop werk naast school.',
      'l: Klopt. Mijn ouders waren eerst ook niet zo enthousiast. Mijn cijfers gingen even omlaag. Nu werk ik alleen nog in het weekend, en mijn zusje helpt met de foto’s.',
      'i: Verdien je er veel aan?',
      'l: Rijk word ik er niet van. Maar daar gaat het me ook niet om. Elke jurk die ik verkoop, hoeft niet nieuw gemaakt te worden. Dat vind ik eigenlijk het mooiste.',
      'i: Wat is je droom?',
      'l: Een echte winkel, waar je ook kleren kunt laten repareren. Want weggooien is zo zonde.'
    ],
    v:[
      M('o', 'Wat is het onderwerp van dit interview?', ['het bedrijf van Lina in tweedehands kleding', 'de kledingindustrie in het algemeen', 'het werk van kringloopwinkels', 'hoe je kleding repareert'], 'Het gesprek gaat over hoe Lina begon, hoe het nu gaat, wat het haar oplevert en wat ze nog wil.'),
      M('o', 'Welke titel past het best bij dit interview?', ['Van volle kast naar eigen bedrijf', 'Rijk worden met kleding', 'Ouders boos op ondernemende dochter', 'Kringloopwinkels in nood'], 'Lina begon door haar volle kast en heeft nu een bedrijf. Rijk wordt ze niet, en haar ouders waren ‘niet zo enthousiast’, niet boos.'),
      M('i', 'Wat doet Lina met de kleding voordat ze die verkoopt?', ['wassen, strijken en fotograferen', 'repareren en verven', 'sorteren op maat', 'naar vriendinnen brengen'], '‘Ik was en strijk alles, en ik maak er mooie foto’s van.’ Repareren is haar droom voor later.'),
      O('i', 'Hoeveel stuks kleding verkoopt Lina ongeveer per maand? Schrijf alleen het getal.', ['200', 'tweehonderd'], 'Zo’n tweehonderd stuks per maand. Zeventien is haar leeftijd.', 'stuks'),
      M('b', 'Waarom waren de ouders van Lina eerst niet enthousiast?', ['Haar cijfers gingen omlaag.', 'Ze verdiende er te weinig mee.', 'Ze verkocht ook hun kleren.', 'Het huis lag vol kleding.'], 'Lina zegt het niet met ‘omdat’, maar de twee zinnen staan naast elkaar: ouders niet enthousiast, cijfers omlaag. En haar oplossing (alleen nog in het weekend werken) gaat over school.'),
      M('b', 'Wat vindt Lina het belangrijkst aan haar bedrijf?', ['dat er minder nieuwe kleding gemaakt hoeft te worden', 'dat ze er veel geld mee verdient', 'dat ze mooie foto’s kan maken', 'dat ze met haar zusje kan werken'], '‘Rijk word ik er niet van. Maar daar gaat het me ook niet om.’ Het mooiste vindt ze dat elke verkochte jurk niet nieuw gemaakt hoeft te worden.')
    ] });

  F({ niv:'hv', id:'hv-klok', soort:'column', titel:'Laat die klok met rust', sit:'In een ochtendprogramma op de radio leest columnist Renée de Jong haar column voor.',
    wie:{ r:['Renée de Jong', 'v'] },
    tekst:[
      'r: Twee keer per jaar zetten we de klok een uur vooruit of achteruit. En twee keer per jaar ben ik een week lang een zombie. Ik wil ervan af. Laten we de klok gewoon laten staan.',
      'r: Want wat levert dat verzetten eigenlijk op? Ooit was het idee dat we er energie mee zouden besparen. Maar volgens mij levert dat tegenwoordig nauwelijks nog iets op.',
      'r: Wat het wel doet: het verstoort ons ritme. Je lichaam laat zich niet zomaar een uur verzetten. Een week lang word ik wakker op het verkeerde moment, en heb ik honger op het verkeerde moment.',
      'r: Nu hoor ik u al denken: maar die lange zomeravonden dan, op een terras tot tien uur ’s avonds licht? Ja, die zijn heerlijk. Maar ik ruil ze graag in voor uitgeruste ochtenden.',
      'r: Kortom: laat die klok met rust.'
    ],
    doel:{ is:'overtuigen', wie:'Renée de Jong', niet:['activeren'], u:'Renée geeft haar standpunt (de klok moet blijven staan) en argumenten daarvoor. Ze wil dat jij het met haar eens wordt. De grap over de zombie is er om je aandacht te trekken, niet het doel.' },
    v:[
      M('o', 'Wat is het standpunt van Renée de Jong?', ['De klok moet niet meer verzet worden.', 'Het moet het hele jaar zomertijd zijn.', 'We moeten meer energie besparen.', 'Terrassen moeten langer open blijven.'], 'Ze zegt het aan het begin (‘Laten we de klok gewoon laten staan’) en herhaalt het aan het eind na ‘Kortom’. Welke tijd het dan wordt, zegt ze niet.'),
      M('i', 'Waarom werd de klok volgens Renée ooit verzet?', ['om energie te besparen', 'voor langere zomeravonden', 'voor uitgeruste ochtenden', 'om gelijk te lopen met andere landen'], '‘Ooit was het idee dat we er energie mee zouden besparen.’'),
      M('i', 'Welk argument geeft Renée tegen het verzetten van de klok?', ['Het verstoort ons ritme.', 'Het kost veel energie.', 'De zomeravonden worden te lang.', 'Niemand weet hoe laat het is.'], '‘Wat het wel doet: het verstoort ons ritme.’ Daarna geeft ze voorbeelden: wakker worden en honger hebben op het verkeerde moment.'),
      M('b', '‘Twee keer per jaar ben ik een week lang een zombie.’ Wat bedoelt ze?', ['Na het verzetten van de klok is ze een week erg moe.', 'Ze kijkt graag griezelfilms.', 'Ze gaat een week op vakantie.', 'Ze is twee keer per jaar ziek.'], 'Een zombie loopt rond zonder echt wakker te zijn. Zo voelt zij zich, doordat haar ritme verstoord is.'),
      M('b', 'Hoe reageert Renée op het argument van de lange zomeravonden?', ['Ze geeft toe dat die fijn zijn, maar vindt uitgeruste ochtenden belangrijker.', 'Ze zegt dat het niet waar is.', 'Ze vindt het een goed argument en verandert van mening.', 'Ze gaat er niet op in.'], '‘Ja, die zijn heerlijk.’ Daarmee geeft ze toe. ‘Maar ik ruil ze graag in voor uitgeruste ochtenden’: haar eigen argument weegt voor haar zwaarder.'),
      M('b', 'Welke zin uit de column is een mening?', ['Volgens mij levert dat tegenwoordig nauwelijks nog iets op.', 'Twee keer per jaar zetten we de klok een uur vooruit of achteruit.', 'Ooit was het idee dat we er energie mee zouden besparen.', 'In de zomer is het ’s avonds lang licht.'], 'Met ‘volgens mij’ geeft Renée aan dat het haar mening is. De andere zinnen kun je nagaan.'),
      M('b', 'Wat is de functie van het woord ‘Kortom’ aan het eind?', ['Het leidt de conclusie in.', 'Het leidt een nieuw argument in.', 'Het leidt een voorbeeld in.', 'Het leidt een tegenargument in.'], 'Na ‘kortom’ volgt in één zin waar het op neerkomt: de conclusie. Die is hier hetzelfde als haar standpunt.')
    ] });

  F({ niv:'hv', id:'hv-bieb', soort:'reportage', titel:'De bibliotheek als huiskamer', sit:'Je hoort een reportage in het regionale nieuws over de bibliotheek in de wijk Kruisland.',
    wie:{ r:['Verslaggever', 'v'], b:['Bibliothecaris', 'm'], m:['Mevrouw Bos', 'v'] },
    tekst:[
      'r: De bibliotheek in de wijk Kruisland is niet meer alleen een plek om boeken te lenen. Sinds de verbouwing kun je er ook terecht voor hulp met formulieren, een kop koffie, en twee keer per week een taalcafé.',
      'b: We zagen dat steeds minder mensen kwamen om alleen boeken te halen. Tegelijk wonen er in deze wijk veel mensen die eenzaam zijn, of die vastlopen met alles wat tegenwoordig online moet. Daar willen we iets aan doen.',
      'r: Op deze dinsdagochtend is het druk. Aan een tafel zit mevrouw Bos. Ze krijgt hulp bij haar belastingaangifte.',
      'm: Mijn man deed dit altijd. Sinds hij er niet meer is, lag die envelop gewoon in de la. Ik durfde hem niet open te maken.',
      'r: Niet iedereen is blij met de veranderingen. Er staan minder boekenkasten, en sommige vaste lezers missen de rust.',
      'b: Dat begrijp ik. Daarom is de bovenverdieping nu een stilteruimte.',
      'r: De gemeente wil het idee uitbreiden naar andere wijken.'
    ],
    doel:{ is:'informeren', wie:'deze reportage', niet:[], u:'Een reportage laat zien wat er gebeurt, met mensen die er zelf over vertellen, en ook met kritiek. De verslaggever geeft geen eigen mening.' },
    v:[
      M('o', 'Wat is het onderwerp van deze reportage?', ['de bibliotheek die een plek voor hulp en ontmoeting is geworden', 'eenzaamheid in de wijk Kruisland', 'hulp bij de belastingaangifte', 'de verbouwing van de bibliotheek'], 'Alles in de reportage hangt aan de veranderde bibliotheek: waarom het zo is gegaan, een voorbeeld, kritiek en de plannen. Eenzaamheid en de aangifte zijn delen daarvan.'),
      M('i', 'Waarom is de bibliotheek veranderd, volgens de bibliothecaris?', ['Er kwamen minder mensen voor boeken, en veel wijkbewoners zijn eenzaam of lopen vast met online zaken.', 'De gemeente wilde minder boeken.', 'De oude bibliotheek was te klein.', 'Vaste lezers vroegen om een taalcafé.'], 'Hij noemt twee dingen: ‘steeds minder mensen kwamen om alleen boeken te halen’ en ‘veel mensen die eenzaam zijn, of die vastlopen met alles wat tegenwoordig online moet.’'),
      M('i', 'Wat heeft de bibliotheek gedaan voor de lezers die de rust missen?', ['De bovenverdieping is een stilteruimte geworden.', 'Er zijn meer boekenkasten bijgekomen.', 'Het taalcafé is gestopt.', 'De bibliotheek is op dinsdag gesloten.'], '‘Daarom is de bovenverdieping nu een stilteruimte.’'),
      M('b', 'Wat kun je afleiden uit wat mevrouw Bos zegt?', ['Haar man is overleden.', 'Haar man is verhuisd.', 'Haar man werkt bij de bibliotheek.', 'Haar man helpt haar niet meer, omdat hij geen zin heeft.'], '‘Sinds hij er niet meer is’ is een voorzichtige manier om te zeggen dat iemand is overleden. Ze zegt het niet letterlijk, maar het volgt uit hoe ze het zegt.'),
      M('b', 'Hoe voelde mevrouw Bos zich over de envelop van de belasting?', ['onzeker en bang', 'boos', 'onverschillig', 'nieuwsgierig'], '‘Ik durfde hem niet open te maken.’ Wie iets niet durft, is bang of onzeker. Als het haar niets kon schelen, had ze hem gewoon laten liggen zonder iets te voelen.'),
      M('b', 'Hoe gaat de bibliothecaris om met de kritiek van vaste lezers?', ['Hij erkent de kritiek en noemt wat er voor hen gedaan is.', 'Hij zegt dat de kritiek niet klopt.', 'Hij negeert de kritiek.', 'Hij belooft alle boekenkasten terug te zetten.'], '‘Dat begrijp ik’ is erkennen. Daarna noemt hij de stilteruimte als oplossing.')
    ] });

  F({ niv:'hv', id:'hv-internet', soort:'telefoongesprek', titel:'Nog steeds geen internet', sit:'Fatma Öztürk is verhuisd. Ze belt de klantenservice van haar internetaanbieder.',
    wie:{ d:['Dennis', 'm'], f:['Fatma Öztürk', 'v'] },
    tekst:[
      'd: Klantenservice Snelnet, u spreekt met Dennis.',
      'f: Goedemiddag, met Fatma Öztürk. Ik bel voor de derde keer deze week. Sinds mijn verhuizing heb ik nog steeds geen internet.',
      'd: Vervelend om te horen. Ik zoek het even voor u op. Ik zie dat er een monteur gepland staat voor vrijdag, tussen acht en één.',
      'f: Vrijdag? Maandag werd me beloofd dat hij woensdag zou komen. Ik heb er een vrije dag voor opgenomen. Er kwam niemand.',
      'd: Dat spijt me echt. Ik zie inderdaad dat die afspraak is vervallen. Waarom, dat kan ik helaas niet zien.',
      'f: Geweldig. Ik werk vanuit huis. Zonder internet kan ik eigenlijk niet werken.',
      'd: Ik begrijp het. Wat ik kan doen: ik zet uw melding op spoed, en ik stuur u gratis een mobiele router, zodat u in de tussentijd kunt werken. En u krijgt een maand abonnementskosten terug.',
      'f: Oké. Dat is in ieder geval iets. Maar als er vrijdag weer niemand komt, zeg ik mijn abonnement op.',
      'd: Dat begrijp ik. Ik bel u donderdag zelf om de afspraak te bevestigen.'
    ],
    v:[
      M('o', 'Waarom belt Fatma de klantenservice?', ['Ze heeft na haar verhuizing nog steeds geen internet.', 'Ze wil haar abonnement opzeggen.', 'Ze wil een nieuwe router kopen.', 'Ze wil een vrije dag terug.'], 'Ze zegt het meteen: ‘Sinds mijn verhuizing heb ik nog steeds geen internet.’ Opzeggen is wat ze dreigt te doen als het vrijdag weer misgaat.'),
      O('i', 'Voor de hoeveelste keer belt Fatma deze week? Schrijf alleen het getal.', ['3', 'drie', '3e', 'derde'], 'Voor de derde keer: ‘Ik bel voor de derde keer deze week.’'),
      M('i', 'Waarom kwam de monteur woensdag niet?', ['Dat weet Dennis niet: hij ziet alleen dat de afspraak is vervallen.', 'De monteur was ziek.', 'Fatma was niet thuis.', 'De afspraak was verzet naar vrijdag op verzoek van Fatma.'], '‘Ik zie inderdaad dat die afspraak is vervallen. Waarom, dat kan ik helaas niet zien.’ Wie een reden invult, verzint iets wat niet gezegd wordt.'),
      M('i', 'Wat biedt Dennis aan?', ['spoed, een gratis mobiele router en een maand abonnementskosten terug', 'vandaag nog een monteur', 'een vrije dag en een nieuw abonnement', 'een nieuwe router en een korting voor een jaar'], 'Hij noemt drie dingen: de melding op spoed, een gratis mobiele router en een maand abonnementskosten terug.'),
      M('b', 'Fatma zegt: ‘Geweldig.’ Wat bedoelt ze?', ['Ze meent het niet: ze is juist teleurgesteld en geïrriteerd.', 'Ze is blij dat Dennis het probleem ziet.', 'Ze vindt het knap dat Dennis het zo snel vindt.', 'Ze is blij met de afspraak op vrijdag.'], 'Ze zegt ‘geweldig’ net nadat ze hoort dat niemand weet waarom de monteur niet kwam. Dat is ironie: ze zegt het tegenovergestelde van wat ze bedoelt.'),
      M('b', 'Waarom vertelt Fatma dat ze vanuit huis werkt?', ['om duidelijk te maken waarom het probleem zo dringend is', 'om uit te leggen waarom ze een vrije dag had', 'om te laten horen dat ze een belangrijke baan heeft', 'om een andere monteur te krijgen'], 'Zonder internet ‘kan ik eigenlijk niet werken’: daarmee maakt ze duidelijk dat wachten tot vrijdag voor haar echt een probleem is.'),
      M('b', 'Hoe is Fatma’s houding aan het eind van het gesprek?', ['iets milder, maar ze dreigt op te zeggen als het weer misgaat', 'helemaal tevreden', 'nog net zo boos als aan het begin', 'onverschillig'], '‘Dat is in ieder geval iets’ laat zien dat ze iets milder is. Maar meteen daarna dreigt ze haar abonnement op te zeggen.')
    ] });

  F({ niv:'hv', id:'hv-nepnieuws', soort:'uitleg', titel:'Klopt dat filmpje wel?', sit:'In een radioprogramma over media geeft een presentatrice uitleg over berichten die online rondgaan.',
    wie:{ p:['Presentatrice', 'v'] },
    tekst:[
      'p: Je ziet een filmpje voorbijkomen: een bekende voetballer zegt dat hij stopt. Het wordt duizenden keren gedeeld. Maar klopt het wel?',
      'p: Een paar vragen helpen. Ten eerste: wie heeft het gemaakt? Een account zonder naam, of met een vreemde naam, is een waarschuwing.',
      'p: Ten tweede: wanneer is het gemaakt? Veel nieuws is gewoon oud, maar wordt opnieuw gedeeld alsof het vandaag gebeurde.',
      'p: Ten derde: zeggen andere bronnen hetzelfde? Als geen enkele grote nieuwssite er iets over meldt, is dat verdacht.',
      'p: En let op je eigen gevoel. Nepnieuws wordt vaak gemaakt om je boos of bang te maken, want dan deel je sneller. Juist als iets je heel erg raakt, is het slim om even te wachten.',
      'p: Tegenwoordig kun je met slimme programma’s ook stemmen en gezichten namaken. Een filmpje is dus geen bewijs meer. Vroeger zeiden we: eerst zien, dan geloven. Nu zou ik zeggen: eerst checken, dan delen.'
    ],
    v:[
      M('o', 'Wat wil de presentatrice vooral bereiken?', ['dat luisteraars berichten controleren voordat ze die delen', 'dat luisteraars geen filmpjes meer kijken', 'dat luisteraars boos worden op makers van nepnieuws', 'dat luisteraars de voetballer steunen'], 'Ze geeft vragen om berichten te controleren, en eindigt met ‘eerst checken, dan delen’. Filmpjes kijken mag gewoon.'),
      M('o', 'Welke zin past het best als hoofdgedachte?', ['Controleer met een paar vragen of een bericht klopt voordat je het deelt.', 'Nepnieuws is altijd oud nieuws.', 'Grote nieuwssites maken nooit fouten.', 'Filmpjes van voetballers zijn vaak nep.'], 'De hele uitleg draait om de vragen die je stelt voordat je iets deelt. ‘Altijd’ en ‘nooit’ zegt de presentatrice nergens.'),
      M('i', 'Welke vraag noemt de presentatrice niet?', ['Hoe vaak is het bericht gedeeld?', 'Wie heeft het gemaakt?', 'Wanneer is het gemaakt?', 'Zeggen andere bronnen hetzelfde?'], 'Dat het filmpje duizenden keren gedeeld wordt, noemt ze aan het begin, maar dat is geen controlevraag. Vaak gedeeld zegt niets over of iets klopt.'),
      M('i', 'Wat is volgens de presentatrice een waarschuwingsteken?', ['een account zonder naam of met een vreemde naam', 'een filmpje met veel kijkers', 'een bericht van een grote nieuwssite', 'een bericht over sport'], '‘Een account zonder naam, of met een vreemde naam, is een waarschuwing.’'),
      M('b', 'Waarom is het volgens de presentatrice slim om te wachten als een bericht je erg raakt?', ['Nepnieuws wil je vaak boos of bang maken, zodat je sneller deelt.', 'Je kunt beter eerst kalmeren voordat je reageert op vrienden.', 'Na een tijdje is een bericht vanzelf verdwenen.', 'Grote nieuwssites zijn altijd later.'], '‘Nepnieuws wordt vaak gemaakt om je boos of bang te maken, want dan deel je sneller.’ Juist dat sterke gevoel is dus een reden om op te passen.'),
      M('b', 'Wat bedoelt de presentatrice met ‘Een filmpje is dus geen bewijs meer’?', ['Een filmpje kan nagemaakt zijn, dus het hoeft niet echt te zijn.', 'Filmpjes zijn altijd nep.', 'Je mag filmpjes niet meer delen.', 'Een filmpje is te kort om iets te bewijzen.'], 'Met slimme programma’s kun je stemmen en gezichten namaken. Een filmpje kán dus nep zijn; ‘altijd nep’ zegt ze niet.'),
      M('b', 'Wat is de functie van het voorbeeld van de voetballer aan het begin?', ['de luisteraar laten zien om wat voor berichten het gaat', 'bewijzen dat de voetballer niet stopt', 'een tegenargument geven', 'de uitleg samenvatten'], 'Het voorbeeld is een herkenbaar begin: zo’n bericht ken je. Daarna komt de uitleg die erbij hoort.')
    ] });

  F({ niv:'hv', id:'hv-storing', soort:'omroepbericht', titel:'Een storing op het spoor', sit:'Je staat op het station in Utrecht en wilt naar Amersfoort. Je hoort een omroepbericht.',

      O('i', 'Van welk spoor vertrekt de stoptrein naar Amersfoort? Schrijf alleen het getal.', ['18', 'achttien', 'spoor 18'], 'Spoor 18.'),
      M('i', 'Wat moet een reiziger naar Zwolle doen?', ['via Amsterdam reizen en daar overstappen', 'de stoptrein naar Amersfoort nemen', 'wachten tot vier uur', 'de bus nemen'], '‘Reizigers naar Zwolle reizen via Amsterdam en stappen daar over.’'),

      M('b', 'Wat zegt het woord ‘ongeveer’ in ‘tot ongeveer vier uur’?', ['Niemand weet precies wanneer de storing voorbij is.', 'De storing is om precies vier uur voorbij.', 'De storing duurt vier uur.', 'Na vier uur rijden er geen treinen meer.'], 'Met ‘ongeveer’ geeft de omroeper een schatting. Het kan ook iets eerder of later zijn.'),
      M('b', 'Wat kun je afleiden over een reiziger die in Amersfoort de bus moet halen?', ['Hij komt waarschijnlijk later thuis dan gepland.', 'Hij kan beter de intercity nemen.', 'De bus wacht op hem.', 'Hij moet in Amsterdam overstappen.'], 'De bussen wachten niet, en de stoptrein komt later aan. Dus mist hij waarschijnlijk zijn bus en moet hij op een volgende wachten.')

  F({ niv:'hv', id:'hv-kruisband', soort:'interview', titel:'Terug op het veld', sit:'In een sportprogramma praat een verslaggever met voetballer Kevin, negentien jaar.',
    wie:{ v:['Verslaggever', 'v'], k:['Kevin', 'm'] },
    tekst:[
      'v: Kevin, een jaar geleden scheurde je je kruisband. Afgelopen zaterdag speelde je je eerste wedstrijd weer. Hoe was dat?',
      'k: Raar, eerlijk gezegd. Ik had me er een jaar lang op verheugd. En toen ik het veld op liep, dacht ik alleen maar: als het maar goed gaat.',
      'v: Was je bang?',
      'k: Bang is misschien te sterk. Maar bij elke sliding dacht ik even aan mijn knie. Dat zit in je hoofd.',
      'v: Wat was het zwaarste van dat jaar?',
      'k: Niet de pijn, maar het toekijken. Elke week zag ik mijn teamgenoten spelen, en ik zat op de tribune. Op een gegeven moment ging ik niet meer kijken. Dat was misschien niet zo slim.',
      'v: Hoezo niet?',
      'k: Ik voelde me steeds minder een deel van het team. Mijn trainer heeft me toen gevraagd om te helpen bij de jeugdtraining. Dat heeft me echt door die tijd heen gesleept.',
      'v: En nu?',
      'k: Nu wil ik vooral weer plezier hebben. Of ik ooit nog prof word, dat zien we wel.'
    ],
    v:[
      M('o', 'Waar gaat dit interview vooral over?', ['hoe Kevin het jaar met zijn blessure en zijn terugkeer heeft beleefd', 'hoe je een kruisband scheurt', 'hoe je een jeugdtraining geeft', 'de wedstrijd van afgelopen zaterdag'], 'De vragen gaan over zijn gevoel bij de eerste wedstrijd, het zwaarste van dat jaar en wat hem hielp. De wedstrijd is alleen het begin van het gesprek.'),
      M('i', 'Wat was volgens Kevin het zwaarste van dat jaar?', ['het toekijken vanaf de tribune', 'de pijn', 'de revalidatie', 'de eerste wedstrijd'], '‘Niet de pijn, maar het toekijken.’ De pijn noemt hij, maar juist om te zeggen dat die het niet was.'),
      M('i', 'Wat hielp Kevin door die moeilijke tijd?', ['helpen bij de jeugdtraining', 'naar elke wedstrijd kijken', 'een andere sport', 'gesprekken met een psycholoog'], '‘Dat heeft me echt door die tijd heen gesleept’ gaat over het helpen bij de jeugdtraining.'),
      M('b', 'Hoe voelde Kevin zich tijdens zijn eerste wedstrijd?', ['gespannen: hij dacht steeds aan zijn knie', 'heel ontspannen', 'bang om te verliezen', 'boos op de tegenstander'], '‘Als het maar goed gaat’ en ‘bij elke sliding dacht ik even aan mijn knie’: hij was gespannen over zijn knie, niet over de uitslag.'),
      M('b', 'Kevin zegt: ‘Bang is misschien te sterk.’ Wat bedoelt hij?', ['Hij was wel een beetje ongerust, maar niet echt bang.', 'Hij was heel erg bang.', 'Hij was helemaal niet ongerust.', 'Hij vindt de vraag onzin.'], 'Een woord ‘te sterk’ vinden betekent: het klopt een beetje, maar niet helemaal. Daarna legt hij uit wat hij wel voelde.'),
      M('b', 'Waarom vindt Kevin het achteraf niet zo slim dat hij niet meer ging kijken?', ['Hij voelde zich daardoor minder een deel van het team.', 'Zijn trainer werd boos.', 'Hij miste belangrijke tactiek.', 'Zijn teamgenoten verloren toen vaker.'], 'Op de vraag ‘Hoezo niet?’ antwoordt hij: ‘Ik voelde me steeds minder een deel van het team.’'),
      M('b', 'Hoe denkt Kevin nu over profvoetballer worden?', ['Dat is niet meer het belangrijkste; eerst wil hij plezier hebben.', 'Hij weet zeker dat hij prof wordt.', 'Hij wil nooit meer prof worden.', 'Hij wil liever jeugdtrainer worden.'], '‘Nu wil ik vooral weer plezier hebben. Of ik ooit nog prof word, dat zien we wel.’ Met ‘dat zien we wel’ laat hij het open.')
    ] });

  F({ niv:'hv', id:'hv-mentor', soort:'gesprek', titel:'De mentor belde', sit:'Isa komt thuis. Haar vader wil met haar praten.',
    wie:{ v:['Vader', 'm'], i:['Isa', 'v'] },
    tekst:[
      'v: Isa, heb je even? Je mentor belde vandaag.',
      'i: O. Wat zei ze?',
      'v: Dat je de laatste weken drie keer je huiswerk niet had. En dat je in de les vaak op je telefoon zit.',
      'i: Drie keer? Dat valt toch wel mee? Iedereen vergeet weleens iets.',
      'v: Daar gaat het me niet om. Het gaat me erom dat ik het van haar moet horen, en niet van jou.',
      'i: Ik wilde het je heus wel vertellen. Maar je wordt altijd meteen boos.',
      'v: Word ik nu boos?',
      'i: Nee.',
      'v: Nou dan. Luister, ik wil niet de hele dag op je lip zitten. Maar dan moet ik wel weten dat het goed gaat. Wat als jij zelf elke zondag even vertelt hoe de week was?',
      'i: Elke zondag? Dat is wel heel vaak.',
      'v: Om de week dan. Maar dan wel eerlijk.',
      'i: Oké. Deal.'
    ],
    v:[
      M('o', 'Waar gaat het gesprek eigenlijk over?', ['dat Isa niet zelf vertelde dat het op school minder ging', 'dat Isa drie keer haar huiswerk vergat', 'dat Isa te veel op haar telefoon zit', 'dat de mentor te snel belt'], 'De vader zegt het zelf: ‘Daar gaat het me niet om. Het gaat me erom dat ik het van haar moet horen, en niet van jou.’ Het huiswerk is de aanleiding, niet de kern.'),
      M('i', 'Wat had de mentor verteld?', ['Isa had drie keer haar huiswerk niet en zit in de les vaak op haar telefoon.', 'Isa had een onvoldoende voor een toets.', 'Isa was drie keer te laat.', 'Isa was een les weggelopen.'], 'De vader noemt twee dingen: drie keer geen huiswerk, en vaak op de telefoon in de les.'),
      M('i', 'Wat spreken Isa en haar vader uiteindelijk af?', ['Isa vertelt om de week eerlijk hoe het gaat.', 'Isa vertelt elke zondag hoe de week was.', 'Isa levert haar telefoon in.', 'De vader belt zelf elke week de mentor.'], 'De vader stelde eerst elke zondag voor, maar Isa vond dat te vaak. Dan wordt het: ‘Om de week dan. Maar dan wel eerlijk.’'),
      M('b', 'Hoe reageert Isa eerst op wat de mentor vertelde?', ['Ze maakt het kleiner dan het is.', 'Ze geeft meteen toe dat het fout was.', 'Ze wordt boos op de mentor.', 'Ze begint te huilen.'], '‘Dat valt toch wel mee? Iedereen vergeet weleens iets.’ Daarmee doet ze alsof het niet zo erg is.'),
      M('b', 'Waarom vraagt de vader: ‘Word ik nu boos?’', ['om te laten merken dat haar verwijt nu niet klopt', 'omdat hij het echt niet weet', 'omdat hij boos wil worden', 'om van onderwerp te veranderen'], 'Isa zegt dat hij ‘altijd meteen boos’ wordt. Met zijn vraag laat hij zien dat dat nu niet zo is. Isa moet toegeven: ‘Nee.’'),
      M('b', 'Wat bedoelt de vader met ‘op je lip zitten’?', ['haar steeds controleren', 'haar steeds zoenen', 'naast haar zitten bij het huiswerk', 'haar steeds straffen'], 'Iemand op de lip zitten is iemand de hele tijd in de gaten houden. Dat wil hij niet, als hij maar weet dat het goed gaat.')
    ] });

  F({ niv:'hv', id:'hv-dertig', soort:'nieuwsbericht', titel:'Dertig kilometer per uur', sit:'Je hoort een bericht in het regionale nieuws.',
    wie:{ n:['Nieuwslezer', 'm'] },
    tekst:[
      'n: In Rijnstad geldt sinds een halfjaar op de meeste wegen binnen de bebouwde kom een maximumsnelheid van dertig kilometer per uur. Vandaag presenteerde de gemeente de eerste cijfers.',

    vragen.forEach(function(q, k){
      var info = vraagInfo(f, q, niv), nrTekst = String(k + 1);
      html += '<div class="lu-pq"><b class="lu-pnr">' + nrTekst + '.</b> <span>' + S(info.vraag) + '</span>' + (info.zin ? '<span class="lu-pzin">‘' + S(info.zin) + '’</span>' : '');
      if (info.vorm === 'open'){
        html += '<span class="lijn" aria-hidden="true"></span>';
        antwoorden.push(nrTekst + '. ' + info.antwoord[0] + (info.eenheid ? ' ' + info.eenheid : ''));
      } else {
        var l = info.opties.map(function(t, i){ return { t:t, i:i }; });
        if (!info.vast) l = H(l);
        var letter = '';
        html += '<div class="opties">' + l.map(function(x, i){ if (x.i === 0) letter = LET[i]; return '<span><b>' + LET[i] + '</b>' + S(x.t) + '</span>'; }).join('') + '</div>';
        antwoorden.push(nrTekst + '. ' + letter + ' (' + String(info.opties[0]).replace(/[.!?]+$/, '') + ')');
      }
      html += '</div>';
      uitleg.push(nrTekst + '. ' + S(info.u));
    });
    return {
      onderdeel:'luisteren: fragment', onderdeelNaam:'fragment', vorm:'eigen', sleutel:'p-' + f.id,
      vraag:'Luister naar het fragment: ' + S(f.soort) + ', ‘' + S(f.titel) + '’. ' + S(f.sit),
      opdracht:'Je docent leest het fragment ' + MAX[niv] + ' keer voor. Lees eerst de vragen. Omcirkel daarna de letter van het goede antwoord, of schrijf het antwoord op de lijn.',
      teken:function(el){ el.innerHTML = '<div class="lu-pv">' + html + '</div>'; },
      antwoordTekst:'Voorlezen: ' + tekstKaal(f) + ' Antwoorden: ' + antwoorden.join('; ') + '.',
      uitleg:uitleg.join(' ')
    };
  }

  /* de leerling stopt of begint opnieuw: dan ook de stem stil */
  addEventListener('click', function(e){ var b = e.target.closest && e.target.closest('#opnieuwBtn, #stopBtn'); if (b) setTimeout(function(){ if (!$('luSpeler') || !document.body.contains($('luSpeler')) || $('scherm-spel').classList.contains('hide')) SPRAAK.stop(); }, 0); }, true);

  VAKSPEL.maak({
    id:'luisteren', naam:'Luister goed', vak:'ned', kleur:'#F26749',
    hand:'eerst de vraag, dan luisteren',
    lead:'Een omroepbericht op het station, een voicemail, een gesprek bij de huisarts, een interview op de radio of een reclame: de computer leest het fragment voor, met een eigen stem voor elke spreker. Daarna beantwoord je vragen zoals op het examen: wat is het onderwerp, wat wil de spreker, welke informatie klopt, wat moet je nu doen en wat bedoelt iemand eigenlijk.',
    leerdoel:'Je leert gericht te luisteren: het onderwerp en het doel van een fragment herkennen, de informatie vinden die je nodig hebt, en horen wat iemand bedoelt of vindt, ook als hij het niet letterlijk zegt.',
    hoe:[
      { kop:'Eerst de vraag', tekst:'Lees eerst de vraag, dan weet je waar je op moet letten. Druk dan op <b>Luister</b>. Je kunt elk fragment twee keer horen (op vmbo-bb drie keer).' },
      { kop:'Een stem per spreker', tekst:'Bij een gesprek praat elke spreker met een eigen stem of toonhoogte. Boven de knop licht op wie er aan het woord is.' },
      { kop:'Geen stem?', tekst:'Staat er geen Nederlandse stem op je computer, dan kun je het fragment lezen. Na je antwoord kun je altijd teruglezen wat er gezegd werd.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb', uit:'Korte fragmenten, vragen over wat er gezegd wordt. Je kunt elk fragment drie keer horen.' },
        { id:'kgt', naam:'vmbo-kgt en tl', uit:'Examenniveau: fragmenten van ongeveer een minuut, ook vragen over bedoeling en mening. Twee keer luisteren.' },
        { id:'hv', naam:'havo en vwo', uit:'Langere fragmenten met meer tussen de regels: ironie, houding en argumenten. Twee keer luisteren.' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' }, { id:'onderwerp', naam:'onderwerp en doel' }, { id:'informatie', naam:'informatie' }, { id:'bedoeling', naam:'bedoeling en mening' } ] }
    ],
    aantal:10, minuten:12,
    maak:function(keuze, nr){
      if (WERKBLAD) return papierOpgave(keuze, nr);
      if (nr === 1 && laatsteNr !== 1){ rij = []; fragNr = 0; }
      laatsteNr = nr;
      if (keuze.soort !== rijSoort){ rij = []; rijSoort = keuze.soort; }
      if (!rij.length) vulRij(keuze);
      var o = rij.shift() || null;
      if (o){ gesteld.push(o.sleutel); if (gesteld.length > 150) gesteld.shift(); }
      return o;
    },
    tutorial:[
      { titel:'Het fragment', tekst:'Hier staat wat je gaat horen. Druk op Luister: de computer leest het voor, en je ziet wie er praat. Je kunt het twee keer horen (op vmbo-bb drie keer).', doel:'beeld' },
      { titel:'Eerst de vraag', tekst:'Lees de vraag voordat je luistert. Bij elk fragment horen twee of drie vragen; je hoeft het niet voor elke vraag opnieuw te horen.', doel:'vraag' },
      { titel:'Antwoorden', tekst:'Kies het antwoord dat klopt, of vul het in. Daarna lees je waarom, en kun je teruglezen wat er gezegd werd.', doel:'antwoordvak' }
    ],
    uitleg:{ doel:'Gericht luisteren naar fragmenten zoals op het examen: onderwerp en doel, informatie, en bedoeling en mening.',
      tijd:'twintig vragen per ronde, of kies 10 of 30; bij elk fragment horen twee of drie vragen',
      bediening:'Lees de vraag en druk op Luister. Kies dan het goede antwoord (of druk op 1 tot 4), of vul het in en kijk het na. Geen Nederlandse stem op je computer? Druk op Lees het fragment.' }
  });
})();
