<style>
/* een logo staat altijd op wit, ook in de donkere stand: zo zien de kleuren eruit zoals de partij ze bedoelt */
.logokaart{background:#fff;border:1px solid var(--rand2);border-radius:18px;width:min(100%,280px);height:170px;display:grid;place-items:center;padding:18px;margin:0 auto;box-shadow:0 6px 18px rgba(20,34,76,.08)}
.logokaart img{max-width:100%;max-height:130px;width:auto;height:auto;display:block}
.logokaart.oud{position:relative}
.logokaart.oud::after{content:'oud logo';position:absolute;top:8px;right:10px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6a7290}
.logoknop{display:grid;place-items:center;background:#fff;border-radius:10px;height:74px;padding:8px}
.logoknop img{max-width:100%;max-height:58px;width:auto;height:auto;display:block}
.opties button.optie .logoknop{margin:-4px}
/* vier logo's als keuze: twee naast elkaar, anders wordt het een lange toren */
.opties:has(.logoknop){grid-template-columns:1fr 1fr}
.opties:has(.logoknop) button.optie{padding:8px}
.naamkaart{display:grid;place-items:center;gap:4px;min-height:84px;width:min(100%,320px);margin:0 auto;border-radius:18px;background:var(--kaart2);border:1px solid var(--rand2);padding:16px;text-align:center}
.naamkaart b{font-size:1.15rem;letter-spacing:.02em;color:var(--ink)}
.naamkaart span{font-size:.85rem;color:var(--muted)}
.tijdas{width:min(100%,460px);height:auto;display:block;margin:0 auto;font-family:inherit}
.tijdas text{fill:var(--muted);font-size:11px;font-weight:600}
.tijdas .lijn{stroke:var(--muted);stroke-width:2}
.tijdas .stip{fill:var(--kaart2);stroke:var(--muted);stroke-width:1.5}
.tijdas .vraag{fill:var(--nadruk);font-size:22px;font-weight:700}
.bron{font-size:.8rem;line-height:1.5;color:var(--muted);text-align:center;max-width:720px;margin:0 auto;padding:0 16px 28px}
.bron a{color:var(--link)}
</style>

<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script src="partijen-opgaven.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }

  /* De partijen, de feiten over hun ontstaan en de christelijke partijen staan
     in partijen-opgaven.js. nu: in de Tweede Kamer (fracties september 2026);
     anders eerder in de Kamer (alleen op havo en vwo). Logo's: Wikimedia
     Commons, staan in partijlogos/. w = de goede antwoorden bij typen; jaar = opgericht. */
  var D = window.PARTIJEN_DATA, P = D.P;
  var PID = {}; P.forEach(function(p){ PID[p.id] = p; });
  /* het beeldmerk zonder de naam: voor FvD, PRO en PvdD een eigen bestand, voor
     NSC en PvdA een uitsnede van het logo (alleen de kaart, alleen de roos) */
  var ICOON = { fvd:'fvd-icoon', pro:'pro-icoon', pvdd:'pvdd-icoon', nsc:'nsc-icoon', pvda:'pvda-icoon' };
  /* Wat er in een logo te lezen staat. Bijna elk logo heeft letters, en dan
     verklapt het logo het antwoord op "welke partij is dit?".
     naam: de naam staat er voluit in (ChristenUnie, Partij voor de Dieren), of
       de naam is de afkorting (DENK, JA21): dit logo komt niet bij een vraag naar
       de naam of de afkorting; het beeldmerk (ICOON) wel, als dat er is.
     afk: alleen de afkorting (CDA, VVD): dan vraagt de opgave waar die voor staat.
     Wat hier niet staat, heeft geen letters (de beeldmerken, de oude PvdA-logo's). */
  var TEKST = {
    '50plus':'naam', cu:'naam', denk:'naam', fvd:'naam', gl:'naam', ja21:'naam', nsc:'naam', pro:'naam', pvdd:'naam', volt:'naam', 'sgp-1979':'naam', 'd66-1985':'naam', 'd66-2002':'naam',
    bbb:'afk', cda:'afk', d66:'afk', 'd66-1966':'afk', 'd66-2006':'afk', pvda:'afk', pvv:'afk', sgp:'afk', 'sgp-2000':'afk', sp:'afk', 'sp-1981':'afk', 'sp-1989':'afk',
    vvd:'afk', 'vvd-1948':'afk', 'vvd-1966':'afk', 'vvd-1992':'afk', 'vvd-2005':'afk', 'vvd-2009':'afk'
  };
  /* het logo dat bij een vraag naar de naam niets verklapt: het gewone logo, anders het beeldmerk, anders geen */
  function logoZonderNaam(p){ return TEKST[p.id] !== 'naam' ? p.id : ICOON[p.id] || ''; }
  /* de volledige naam als antwoord: de lange vormen uit w (voor de oude SP-logo's ook de oude spelling) */
  function voluitW(p, oud){ return p.w.filter(function(w){ return w.length > 6 || w === p.naam; }).concat(oud && p.id === 'sp' ? ['Socialistiese Partij'] : []); }
  /* oude logo's: van, bestand, van-tot, en of bb hem ook krijgt (de laatste voor het huidige) */
  var OUD = [
    { p:'vvd', f:'vvd-2009', tijd:'van 2009 tot 2020', bb:true }, { p:'vvd', f:'vvd-2005', tijd:'van 2005 tot 2009', bb:true },
    { p:'vvd', f:'vvd-1992', tijd:'van 1992 tot 2005' }, { p:'vvd', f:'vvd-1966', tijd:'van 1966 tot 1992' }, { p:'vvd', f:'vvd-1948', tijd:'van 1948 tot 1966' },
    { p:'d66', f:'d66-2006', tijd:'van 2006 tot 2008', bb:true }, { p:'d66', f:'d66-2002', tijd:'van 2002 tot 2006', bb:true },
    { p:'d66', f:'d66-1985', tijd:'van 1985 tot 2001' }, { p:'d66', f:'d66-1966', tijd:'van 1966 tot 1985' },
    { p:'sgp', f:'sgp-2000', tijd:'van 2000 tot 2016', bb:true }, { p:'sgp', f:'sgp-1979', tijd:'van 1979 tot 2000' },
    { p:'pvda', f:'pvda-1966', tijd:'van 1966 tot 1970' }, { p:'pvda', f:'pvda-1950', tijd:'van 1950 tot 1966' },
    { p:'sp', f:'sp-1989', tijd:'rond 1989, toen de partij nog Socialistiese Partij heette', bb:true }, { p:'sp', f:'sp-1981', tijd:'rond 1981, toen de partij nog Socialistiese Partij heette' }
  ].filter(function(o){ return window.LOGO_ER ? LOGO_ER[o.f] : true; });

  function logoSrc(f){ return 'partijlogos/' + f + '.svg'; }
  function logoKaart(f, oud){ return '<div class="logokaart' + (oud ? ' oud' : '') + '"><img src="' + logoSrc(f) + '" alt="logo van een partij"></div>'; }
  function logoKnop(f){ return '<span class="logoknop"><img src="' + logoSrc(f) + '" alt="logo"></span>'; }
  function naamKaart(boven, onder){ return '<div class="naamkaart"><b>' + S(boven) + '</b>' + (onder ? '<span>' + S(onder) + '</span>' : '') + '</div>'; }
  function magP(niveau){ return P.filter(function(p){ return p.nu || niveau === 'hv'; }); }
  function anderen(p, niveau, n){ return H(magP(niveau).filter(function(x){ return x !== p; })).slice(0, n || 3); }

  /* ---------- 1. welke partij is dit: het logo, zeg de partij ----------
     Een logo met de naam erin komt hier niet (zie TEKST); een logo met alleen de
     afkorting wel, maar dan is de vraag waar die afkorting voor staat. */
  function logo(niveau){
    var lijst = magP(niveau).filter(function(p){ return TEKST[p.id] !== 'naam'; }).map(function(p){ return { p:p, f:p.id, oud:null }; })
      .concat(Object.keys(ICOON).filter(function(id){ return magP(niveau).indexOf(PID[id]) >= 0; }).map(function(id){ return { p:PID[id], f:ICOON[id], oud:null, icoon:true }; }))
      .concat(OUD.filter(function(o){ return (niveau !== 'bb' || o.bb) && TEKST[o.f] !== 'naam'; }).map(function(o){ return { p:PID[o.p], f:o.f, oud:o }; }));
    var it = kies(lijst), p = it.p, letters = TEKST[it.f] === 'afk';
    var basis = { onderdeel:'partijen: welke partij', onderdeelNaam:'welke partij is dit', sleutel:'lo' + it.f,
      beeld: logoKaart(it.f, !!it.oud),
      uitleg: it.oud ? 'Dit logo gebruikte de ' + p.afk + ' ' + it.oud.tijd + '. Nu heeft de partij een ander logo.' : (it.icoon ? 'Dit is het beeldmerk' : 'Dit is het logo') + ' van ' + (p.afk !== p.naam ? 'de ' + p.afk + ' (' + p.naam + ')' : p.naam) + ', opgericht in ' + p.jaar + '.',
      antwoordTekst: letters ? p.naam : p.naam + (p.afk !== p.naam ? ' (' + p.afk + ')' : '') };
    /* de letters staan in het logo: waar staan ze voor? */
    if (letters){
      var vraagL = it.oud ? 'Dit is een <b>oud logo</b>. Er staat een afkorting in. Waar staat die voor?' : 'In dit logo staat de afkorting van de partij. Waar staat die voor?';
      if (niveau === 'bb') return Object.assign(basis, { vorm:'meerkeuze', vraag: vraagL, opdracht: 'Kies de volledige naam.',
        opties: [p.naam].concat(anderen(p, niveau, 20).filter(function(x){ return x.naam !== x.afk; }).slice(0, 3).map(function(x){ return x.naam; })), goed: 0 });
      return Object.assign(basis, { vorm:'invul', vraag: vraagL, opdracht: 'Typ de volledige naam, niet de afkorting. Hoofdletters tellen niet.',
        velden: [{ label:'voluit', type:'tekst', breed:true, antwoord: voluitW(p, !!it.oud) }] });
    }
    if (niveau === 'bb') return Object.assign(basis, { vorm:'meerkeuze',
      vraag: it.oud ? 'Dit is een <b>oud logo</b>. Van welke partij?' : it.icoon ? 'Dit is het <b>beeldmerk</b> van een partij, zonder de naam. Welke partij?' : 'Van welke partij is dit logo?',
      opdracht: 'Kijk goed naar het teken en de kleuren.',
      opties: [p.afk].concat(anderen(p, niveau).map(function(x){ return x.afk; })), goed: 0 });
    var voluit = niveau === 'hv' && p.afk !== p.naam && !it.oud;
    return Object.assign(basis, { vorm:'invul',
      vraag: it.oud ? 'Dit is een <b>oud logo</b>. Van welke partij?' : it.icoon ? 'Dit is het <b>beeldmerk</b> van een partij, zonder de naam. Welke partij?' + (voluit ? ' Typ de <b>volledige naam</b>.' : '') : voluit ? 'Van welke partij is dit logo? Typ de <b>volledige naam</b>.' : 'Van welke partij is dit logo?',
      opdracht: voluit ? 'Niet de afkorting, maar waar die voor staat. Hoofdletters tellen niet.' : 'Typ de naam of de afkorting. Hoofdletters tellen niet.',
      velden: [{ label:'partij', type:'tekst', breed:true, antwoord: voluit ? voluitW(p) : p.w }] });
  }

  /* ---------- 2. welk logo hoort erbij: de naam, kies het logo ----------
     De naamkaart noemt de afkorting niet (die staat in bijna elk logo), en een
     partij waarvan de naam zelf in het logo staat, komt met haar beeldmerk of niet. */
  function welkLogo(niveau){
    var oudKans = OUD.filter(function(o){ return niveau !== 'bb' || o.bb; });
    if (oudKans.length && Math.random() < 0.35){
      var o = kies(oudKans), p = PID[o.p];
      /* Een oud logo tussen andere logo's van dezelfde partij: met logo's van
         andere partijen verklapten de letters het antwoord. */
      var zelfde = [p.id].concat(OUD.filter(function(x){ return x.p === p.id && x.f !== o.f; }).map(function(x){ return x.f; }));
      var mis = H(zelfde).slice(0, 3);
      return { onderdeel:'partijen: welk logo', onderdeelNaam:'welk logo hoort erbij', vorm:'meerkeuze', sleutel:'wo' + o.f,
        vraag: 'Welk logo gebruikte de <b>' + S(p.afk) + '</b> ' + o.tijd + '?', opdracht: 'Alle logo’s zijn van de ' + S(p.afk) + ', uit verschillende jaren. Welk logo is van toen?',
        beeld: naamKaart(p.afk, p.afk !== p.naam ? p.naam : 'opgericht in ' + p.jaar),
        opties: [logoKnop(o.f)].concat(mis.map(logoKnop)), goed: 0,
        uitleg: 'Dit logo gebruikte de ' + p.afk + ' ' + o.tijd + '.', antwoordTekst: 'het logo van de ' + p.afk + ' ' + o.tijd };
    }
    var q = kies(magP(niveau).filter(function(p){ return logoZonderNaam(p) && p.afk !== p.naam; })), f = logoZonderNaam(q);
    return { onderdeel:'partijen: welk logo', onderdeelNaam:'welk logo hoort erbij', vorm:'meerkeuze', sleutel:'wl' + q.id,
      vraag: 'Welk logo hoort bij <b>' + S(q.naam) + '</b>?', opdracht: 'Tik het logo aan.',
      beeld: naamKaart(q.naam, 'opgericht in ' + q.jaar),
      opties: [logoKnop(f)].concat(anderen(q, niveau).map(function(x){ return logoKnop(logoZonderNaam(x) || x.id); })), goed: 0,
      uitleg: (f === q.id ? 'Dit is het logo' : 'Dit is het beeldmerk') + ' van ' + q.naam + ' (' + q.afk + ').', antwoordTekst: 'het logo van ' + q.afk };
  }

  /* ---------- 3. voluit: afkorting en naam ---------- */
  function voluit(niveau){
    var lijst = magP(niveau).filter(function(p){ return p.afk !== p.naam && p.id !== 'ja21'; });
    var p = kies(lijst), omgekeerd = Math.random() < 0.5;
    if (omgekeerd){
      var basisO = { onderdeel:'partijen: voluit', onderdeelNaam:'afkorting en naam', sleutel:'va' + p.id, beeld: naamKaart(p.naam, 'hoe kort je dit af?'),
        uitleg: p.naam + ' kort je af als ' + p.afk + '.', antwoordTekst: p.afk };
      if (niveau === 'bb') return Object.assign(basisO, { vorm:'meerkeuze', vraag:'Wat is de afkorting van <b>' + S(p.naam) + '</b>?', opdracht:'Kies de goede afkorting.',
        opties: [p.afk].concat(anderen(p, niveau).map(function(x){ return x.afk; })), goed:0 });
      return Object.assign(basisO, { vorm:'invul', vraag:'Wat is de afkorting van <b>' + S(p.naam) + '</b>?', opdracht:'Typ de afkorting. Hoofdletters tellen niet.',
        velden:[{ label:'afkorting', type:'tekst', antwoord: p.w.filter(function(w){ return w.length <= 6; }) }] });
    }
    /* een logo met de volledige naam erin zou het antwoord laten zien: dan het beeldmerk, of alleen de afkorting */
    var lz = logoZonderNaam(p);
    var basis = { onderdeel:'partijen: voluit', onderdeelNaam:'afkorting en naam', sleutel:'vo' + p.id, beeld: lz ? logoKaart(lz) : naamKaart(p.afk, 'waar staat dit voor?'),
      uitleg: p.afk + ' staat voor ' + p.naam + '.', antwoordTekst: p.naam };
    if (niveau === 'hv') return Object.assign(basis, { vorm:'invul', vraag:'Waar staat <b>' + S(p.afk) + '</b> voor?', opdracht:'Typ de volledige naam. Hoofdletters tellen niet.',
      velden:[{ label:'voluit', type:'tekst', breed:true, antwoord: voluitW(p) }] });
    return Object.assign(basis, { vorm:'meerkeuze', vraag:'Waar staat <b>' + S(p.afk) + '</b> voor?', opdracht:'Kies de volledige naam.',
      opties: [p.naam].concat(H(lijst.filter(function(x){ return x !== p; })).slice(0, 3).map(function(x){ return x.naam; })), goed:0 });
  }

  /* ---------- 4. hoe en wanneer ontstaan: alleen feiten (FEIT staat in partijen-opgaven.js) ---------- */
  var FEIT = D.FEIT;
  /* christelijke partijen: de afleiders zijn dan partijen die dat niet zijn */
  var CHRISTELIJK = D.CHRISTELIJK, NIET_CHR = D.NIET_CHR;
  function feiten(niveau){
    var n = FEIT.filter(function(f){ return !f[2] || niveau === 'hv'; }).length, wie = Math.random();
    /* een derde: in welk jaar; een beetje: welke is christelijk; de rest: welke partij */
    if (wie < 0.33){
      var p = kies(magP(niveau)), jaren = [p.jaar], poging = 0;
      while (jaren.length < 4 && poging++ < 50){ var j = p.jaar + (Math.random() < 0.5 ? -1 : 1) * (4 + Math.floor(Math.random() * 30)); if (j < 1900 || j > 2026) continue; if (jaren.every(function(x){ return Math.abs(x - j) >= 4; })) jaren.push(j); }
      return { onderdeel:'partijen: ontstaan', onderdeelNaam:'hoe en wanneer ontstaan', vorm:'meerkeuze', sleutel:'ja' + p.id,
        vraag:'In welk jaar werd <b>' + S(p.naam) + '</b> opgericht?', opdracht:'Kijk op de tijdlijn: waar staat het vraagteken ongeveer?',
        beeld: tijdas(p.jaar), opties: jaren.map(String), goed:0,
        uitleg: p.naam + ' bestaat sinds ' + p.jaar + '.', antwoordTekst: String(p.jaar) };
    }
    if (wie < 0.45){
      var c = kies(CHRISTELIJK), cp = PID[c];
      return { onderdeel:'partijen: ontstaan', onderdeelNaam:'hoe en wanneer ontstaan', vorm:'meerkeuze', sleutel:'ch' + c,
        /* geen logo erbij: dat was het logo van het goede antwoord */
        vraag:'Welke van deze partijen is een <b>christelijke</b> partij?', opdracht:'Drie van de vier zijn het niet.',
        opties: [cp.afk].concat(H(NIET_CHR).slice(0, 3).map(function(x){ return PID[x].afk; })), goed:0,
        uitleg: 'Het CDA, de ChristenUnie en de SGP baseren hun ideeën op de Bijbel. De ' + cp.afk + ' is er een van.', antwoordTekst: cp.afk };
    }
    var f = kies(FEIT.filter(function(x){ return !x[2] || niveau === 'hv'; })), fp = PID[f[0]];
    return { onderdeel:'partijen: ontstaan', onderdeelNaam:'hoe en wanneer ontstaan', vorm: niveau === 'bb' ? 'meerkeuze' : 'meerkeuze', sleutel:'fe' + f[0],
      vraag: f[1], opdracht:'Kies de partij.', beeld: tijdas(fp.jaar, true),
      opties: [fp.afk === fp.naam || fp.afk.length > 4 ? fp.naam : fp.afk].concat(anderen(fp, niveau).map(function(x){ return x.afk === x.naam || x.afk.length > 4 ? x.naam : x.afk; })), goed:0,
      uitleg: fp.naam + (fp.afk !== fp.naam ? ' (' + fp.afk + ')' : '') + ' bestaat sinds ' + fp.jaar + '.', antwoordTekst: fp.naam };
  }
  /* een tijdlijn van 1900 tot nu met een vraagteken (of een stip) bij het jaar */
  function tijdas(jaar, stip){
    var W = 460, L = 24, R = 24, x = function(j){ return L + (j - 1900) / 130 * (W - L - R); };
    var s = '<svg class="tijdas" viewBox="0 0 ' + W + ' 70" aria-hidden="true"><line class="lijn" x1="' + L + '" y1="40" x2="' + (W - R) + '" y2="40"/>';
    [1900, 1925, 1950, 1975, 2000, 2025].forEach(function(j){ s += '<line class="lijn" x1="' + x(j) + '" y1="35" x2="' + x(j) + '" y2="45"/><text x="' + x(j) + '" y="62" text-anchor="middle">' + j + '</text>'; });
    s += stip ? '<circle class="stip" cx="' + x(jaar) + '" cy="40" r="7" style="fill:var(--nadruk);stroke:var(--nadruk)"/>' : '<text class="vraag" x="' + x(jaar) + '" y="28" text-anchor="middle">?</text><circle class="stip" cx="' + x(jaar) + '" cy="40" r="6"/>';
    return s + '</svg>';
  }

  var SOORTEN = { logo: logo, kies: welkLogo, voluit: voluit, ontstaan: feiten };
  VAKSPEL.maak({
    id:'partijen', naam:'Welke partij is dit?', vak:'burg', kleur:'#83A5F2',
    hand:'ken je partijen',
    lead:'De partijen in de Tweede Kamer: herken ze aan hun logo, ook aan een oud logo, weet waar de afkorting voor staat, en wanneer en hoe een partij ontstond. Zonder standpunten: alleen wie wie is.',
    hoe:[
      { kop:'Het logo', tekst:'Je ziet een logo of een beeldmerk en zegt welke partij het is. Staat de afkorting in het logo, dan zeg je waar die voor staat. Op vmbo-bb kies je uit vier, daarna typ je het.' },
      { kop:'Voluit', tekst:'VVD, CDA, SGP: waar staan die letters voor? En andersom: hoe kort je een partij af?' },
      { kop:'Ontstaan', tekst:'De oudste partij is van 1918, de nieuwste van 2026. Een tijdlijn helpt je schatten.' }
    ],
    keuzes:[
