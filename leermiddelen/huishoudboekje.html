<style>
/* het kasboek: posten met een bedrag en een balkje dat de grootte laat zien */
.beeld .kasboek{border-collapse:separate;border-spacing:0;width:min(100%,540px);font-size:.95rem;font-variant-numeric:tabular-nums}
.beeld .kasboek th{text-align:left;padding:7px 10px;background:var(--kaart2);font-weight:600;border:none;min-width:0}
.beeld .kasboek th:first-child{border-radius:10px 0 0 10px}
.beeld .kasboek th:last-child{border-radius:0 10px 10px 0}
.beeld .kasboek th small{font-weight:500;color:var(--muted);margin-left:6px}
.beeld .kasboek td{padding:5px 10px;border:none;border-bottom:1px solid var(--rand);text-align:left;min-width:0}
.beeld .kasboek td.bedrag{text-align:right;white-space:nowrap;font-weight:600}
.beeld .kasboek td.balk{width:150px;padding-right:0}
.beeld .kasboek .balk i{display:block;height:10px;border-radius:99px;background:var(--nadruk);min-width:4px;max-width:100%}
.beeld .kasboek .uit .balk i{background:var(--amber)}
.beeld .kasboek tr.som td{font-weight:700;border-bottom:none}
.beeld .kasboek td.min{color:var(--fout)}
.beeld .kasboek td.plus{color:var(--goed)}
.beeld .kasboek td.vraagteken{color:var(--muted);text-align:right}
.beeld .maanden td.bedrag{font-weight:500}
.beeld .maanden th.mnd{text-align:right}
.beeld .grafiek text{fill:var(--ink);font-size:11px;font-family:inherit}
.beeld .grafiek .as{stroke:var(--muted);stroke-width:1}
.beeld .grafiek .doel{stroke:var(--fout);stroke-width:2;stroke-dasharray:6 4}
.beeld .grafiek .staaf{fill:var(--amber)}
.beeld .grafiek .staaf.start{fill:var(--nadruk)}
.beeld .grafiek .munt{fill:var(--amber);stroke:var(--kaart);stroke-width:1}
.beeld .grafiek .leen{fill:var(--nadruk)}
.beeld .grafiek .rente{fill:var(--amber)}
.beeld .grafiek text.licht{fill:#fff;font-weight:600}
.beeld .grafiek text.mut{fill:var(--muted)}
@media(max-width:480px){.beeld .kasboek{font-size:.86rem}.beeld .kasboek td,.beeld .kasboek th{padding:5px 6px}.beeld .kasboek td.balk{width:70px}}
body.groot .beeld .kasboek{font-size:1.15rem}

<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function tussen(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function rond(x){ return Math.round(x * 100) / 100; }
  function geld(x){ x = rond(x); var neg = x < 0; x = Math.abs(x); var s = x.toFixed(2), d = s.split('.'); d[0] = d[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (neg ? '−€ ' : '€ ') + d[0] + ',' + d[1]; }
  function net(x){ x = rond(x); var s = String(Math.abs(x)), d = s.split('.'); d[0] = d[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (x < 0 ? '−' : '') + d[0] + (d[1] ? ',' + d[1] : ''); }
  /* een bedrag lezen zoals leerlingen het typen: 1.250 of 1250 of 1.250,50 of 12,5 of 12.5 */
  function bedrag(t){
    var s = String(t == null ? '' : t).trim().replace(/€|\s|−/g, function(c){ return c === '−' ? '-' : ''; });
    if (/^[-+]?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '');
    s = s.replace(',', '.');
    if (!s || !/^[-+]?\d*\.?\d+$/.test(s)) return null;
    return parseFloat(s);
  }

  /* ---------- de eigen invulvorm: dezelfde vakjes als de motor, maar met bedragen ---------- */
  function veldenOpgave(o){
    var velden = o.velden;
    o.vorm = 'eigen';
    o.teken = function(el, api){
      el.innerHTML = '<div class="velden">' + velden.map(function(v, i){
        return '<div class="veldje"><label for="hb-' + i + '">' + S(v.label) + '</label><div class="rij">' + (v.voor ? '<span class="eenheid">' + S(v.voor) + '</span>' : '') +
          '<input id="hb-' + i + '" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="' + S(v.label) + '">' + (v.eenheid ? '<span class="eenheid">' + S(v.eenheid) + '</span>' : '') + '</div><span class="juist"></span></div>';
      }).join('') + '</div>';
      var invoer = el.querySelectorAll('input');
      var knop = api.knop('Nakijken', function(){
        var alles = true;
        velden.forEach(function(v, i){
          var inp = invoer[i], g = bedrag(inp.value), ok = g !== null && Math.abs(g - v.antwoord) <= (v.tol || 0.005);
          inp.disabled = true; inp.classList.add(ok ? 'goed' : 'fout');
          if (!ok){ alles = false; inp.parentNode.parentNode.querySelector('.juist').textContent = 'goed: ' + (v.toon || net(v.antwoord)); }
        });
        knop.disabled = true;
        api.klaar(alles, '');
      });
      Array.prototype.forEach.call(invoer, function(inp, i){ inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); if (invoer[i + 1]) invoer[i + 1].focus(); else knop.click(); } }); });
      setTimeout(function(){ if (invoer[0]) invoer[0].focus(); }, 50);
      el.proef = function(){ velden.forEach(function(v, i){ invoer[i].value = String(v.antwoord).replace('.', ','); }); knop.click(); };
      el.proefFout = function(){ velden.forEach(function(v, i){ invoer[i].value = 'xx'; }); knop.click(); };
    };
    return o;
  }

  /* ---------- de posten: wat er in een kasboek kan staan ---------- */
  var NAMEN = ['Sam', 'Noor', 'Daan', 'Lina', 'Finn', 'Yara', 'Milan', 'Sofia', 'Jesse', 'Amira', 'Tim', 'Zoë'];
  var GEZINNEN = ['het gezin De Vries', 'de familie Bakker', 'het gezin Yilmaz', 'de familie Jansen', 'het gezin Pietersen', 'de familie Okafor'];
  var MAANDEN = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'september', 'oktober', 'november'];
  /* per post: naam, van, tot, stap, soort (in, vast, var, res) */
  var JONGERE = {
    in:  [['zakgeld', 20, 40, 5], ['bijbaan in de supermarkt', 80, 200, 10], ['kleedgeld van je ouders', 30, 50, 5], ['oppassen', 20, 60, 5], ['krantenwijk', 40, 90, 5], ['bijbaan bij de bakker', 60, 150, 10]],
    vast:[['telefoonabonnement', 10, 25, 1], ['contributie sportclub', 15, 35, 1], ['streamingabonnement', 6, 13, 1], ['busabonnement', 20, 60, 5], ['sportschool', 20, 30, 1], ['muziekles', 25, 45, 5]],
    var: [['kleding', 15, 60, 5], ['uitgaan en bioscoop', 10, 40, 5], ['snacks en drinken', 10, 30, 1], ['games en apps', 5, 30, 1], ['cadeautjes', 5, 25, 1], ['kapper', 15, 30, 1]],
    res: [['sparen voor een fiets', 20, 40, 5], ['sparen voor een nieuwe telefoon', 15, 40, 5], ['sparen voor de zomervakantie', 20, 50, 5], ['sparen voor een scooter', 30, 60, 5]]
  };
  var GEZIN = {
    in:  [['loon (netto)', 2000, 3200, 50], ['loon partner (parttime)', 900, 1800, 50], ['kinderbijslag', 90, 280, 10], ['zorgtoeslag', 50, 150, 5], ['huurtoeslag', 100, 300, 10]],
    vast:[['huur', 650, 1200, 10], ['energie (gas en stroom)', 110, 250, 5], ['zorgverzekering', 130, 320, 5], ['internet en tv', 40, 70, 1], ['gemeentebelasting', 30, 60, 1], ['autoverzekering', 40, 90, 1], ['telefoonabonnementen', 30, 60, 1], ['inboedelverzekering', 10, 25, 1]],
    var: [['boodschappen', 350, 700, 10], ['benzine', 80, 250, 5], ['kleding', 50, 200, 5], ['uitjes en uit eten', 30, 150, 5], ['cadeaus', 10, 80, 5], ['klusspullen', 20, 100, 5]],
    res: [['sparen voor de vakantie', 100, 300, 10], ['sparen voor een nieuwe wasmachine', 25, 75, 5], ['sparen voor een andere auto', 100, 250, 10], ['sparen voor de studie van de kinderen', 50, 150, 10]]
  };
  function pak(lijst, n){ return H(lijst).slice(0, n); }
  /* inkomsten kiezen: een gezin heeft altijd loon, de rest is willekeurig */
  function inkomsten(P, n){ return P === GEZIN ? [P.in[0]].concat(pak(P.in.slice(1), n - 1)) : pak(P.in, n); }
  function post(p, soort, centen){
    var b = p[1] + Math.round(Math.random() * ((p[2] - p[1]) / p[3])) * p[3];
    if (centen && soort !== 'in' && Math.random() < 0.5) b += kies([0.5, 0.95, 0.25, 0.75]);
    return { naam: p[0], bedrag: rond(b), soort: soort };
  }
  function som(lijst){ return rond(lijst.reduce(function(t, p){ return t + p.bedrag; }, 0)); }

  /* het kasboek als tabel: inkomsten boven, uitgaven eronder, elk met een balkje */
  function kasboekHtml(inn, uit, opties){
    opties = opties || {};
    var max = Math.max.apply(null, inn.concat(uit).map(function(p){ return p.bedrag; }));
    function rij(p, klas){ return '<tr class="' + klas + '"><td>' + S(p.naam) + '</td><td class="balk"><i style="width:' + Math.max(4, Math.round(p.bedrag / max * 140)) + 'px"></i></td><td class="bedrag">' + geld(p.bedrag) + '</td></tr>'; }
    var h = '<table class="kasboek"><tr><th colspan="3">Inkomsten' + (opties.kop ? '<small>' + S(opties.kop) + '</small>' : '') + '</th></tr>' + inn.map(function(p){ return rij(p, 'in'); }).join('');
    if (opties.sommen) h += '<tr class="som"><td>inkomsten samen</td><td></td><td class="bedrag">' + geld(som(inn)) + '</td></tr>';
    h += '<tr><th colspan="3">Uitgaven</th></tr>' + uit.map(function(p){ return rij(p, 'uit'); }).join('');
    if (opties.sommen){ var over = rond(som(inn) - som(uit)); h += '<tr class="som"><td>uitgaven samen</td><td></td><td class="bedrag">' + geld(som(uit)) + '</td></tr><tr class="som"><td>' + (over < 0 ? 'tekort' : 'over') + '</td><td></td><td class="bedrag ' + (over < 0 ? 'min' : 'plus') + '">' + geld(over) + '</td></tr>'; }
    else if (opties.vraag) h += '<tr class="som"><td>samen</td><td></td><td class="vraagteken">?</td></tr>';
    return h + '</table>';
  }

  /* 1. optellen: inkomsten, uitgaven en wat er overblijft */
  function optellen(niveau){
    var jong = niveau === 'bb' || (niveau === 'kgt' && Math.random() < 0.5);
    var P = jong ? JONGERE : GEZIN, centen = niveau === 'hv';
    var nIn = niveau === 'bb' ? 2 : jong ? tussen(2, 3) : 3, nUit = niveau === 'bb' ? 3 : niveau === 'kgt' ? 4 : tussen(5, 6);
    var inn = inkomsten(P, nIn).map(function(p){ return post(p, 'in', false); });
    var uitLijst = pak(P.vast, Math.ceil(nUit / 2)).concat(pak(P.var, Math.floor(nUit / 2)));
    if (niveau === 'hv') uitLijst = uitLijst.slice(0, nUit - 1).concat(pak(P.res, 1));
    var uit = H(uitLijst.map(function(p){ return post(p, 'uit', centen); }));
    var tIn = som(inn), tUit = som(uit), over = rond(tIn - tUit);
    if (niveau === 'bb' && over < 0) return optellen(niveau);
    var wie = jong ? kies(NAMEN) : kies(GEZINNEN), maand = kies(MAANDEN);
    return veldenOpgave({
      onderdeel:'huishoudboekje: optellen', onderdeelNaam:'optellen', sleutel:'op' + tIn + '-' + tUit,
      vraag: 'Het kasboek van <b>' + S(wie) + '</b> in ' + maand + '. Hoeveel komt er binnen, hoeveel gaat eruit, en wat blijft er over?',
      opdracht: 'Tel de inkomsten op, tel de uitgaven op, en trek ze van elkaar af.' + (niveau === 'bb' ? '' : ' Komt er geld tekort? Zet dan een min voor het getal, zoals -25.'),
      beeld: kasboekHtml(inn, uit, { kop: maand, vraag: true }),
      velden: [{ label:'inkomsten samen', voor:'€', antwoord: tIn, toon: geld(tIn) }, { label:'uitgaven samen', voor:'€', antwoord: tUit, toon: geld(tUit) }, { label: over < 0 ? 'tekort (met een min)' : 'blijft over', voor:'€', antwoord: over, toon: geld(over) }],
      uitleg: 'Inkomsten: ' + inn.map(function(p){ return net(p.bedrag); }).join(' + ') + ' = ' + geld(tIn) + '. Uitgaven: ' + uit.map(function(p){ return net(p.bedrag); }).join(' + ') + ' = ' + geld(tUit) + '. ' + net(tIn) + ' − ' + net(tUit) + ' = ' + geld(over) + (over < 0 ? ': er gaat meer uit dan er binnenkomt, een tekort.' : over === 0 ? ': precies rond.' : ': dat blijft er over om te sparen of uit te geven.'),
      antwoordTekst: 'in ' + geld(tIn) + ', uit ' + geld(tUit) + ', over ' + geld(over)
    });
  }

  /* 2. vast of variabel: posten slepen. De tabel laat drie maanden zien: vaste lasten zijn elke maand gelijk */
  function vastVariabel(niveau){
    var jong = niveau !== 'hv' && Math.random() < 0.65, P = jong ? JONGERE : GEZIN;
    var vast = pak(P.vast, niveau === 'bb' ? 2 : 3), varb = pak(P.var, niveau === 'bb' ? 2 : 3);
    var extraSoort = niveau === 'hv' ? 'res' : 'in', extra = pak(P[extraSoort], 1);
    var posten = [{ p: extra[0], soort: extraSoort }].concat(vast.map(function(p){ return { p: p, soort: 'vast' }; }), varb.map(function(p){ return { p: p, soort: 'var' }; }));
    var mnd = MAANDEN.slice(0, 3);
    posten.forEach(function(x, i){
      x.id = 'k' + i;
      var basis = post(x.p, x.soort, false).bedrag;
      x.per = x.soort === 'var' ? mnd.map(function(){ return post(x.p, 'var', false).bedrag; }) : [basis, basis, basis];
      if (x.soort === 'var' && x.per[0] === x.per[1] && x.per[1] === x.per[2]) x.per[1] = rond(x.per[1] + x.p[3]);
    });
    var vakken = [
      extraSoort === 'in' ? { id:'in', naam:'inkomst', uit:'geld dat binnenkomt' } : { id:'res', naam:'reserveringsuitgave', uit:'apart zetten voor iets groots later' },
      { id:'vast', naam:'vaste lasten', uit:'elke maand hetzelfde bedrag' },
      { id:'var', naam:'variabele uitgaven', uit:'elke maand anders, je kiest het zelf' }
    ].map(function(v){ v.hoort = posten.filter(function(x){ return x.soort === v.id; }).map(function(x){ return x.id; }); return v; });
    var beeld = '<table class="kasboek maanden"><tr><th>post</th>' + mnd.map(function(m){ return '<th class="mnd">' + m + '</th>'; }).join('') + '</tr>' +
      H(posten).map(function(x){ return '<tr><td>' + S(x.p[0]) + '</td>' + x.per.map(function(b){ return '<td class="bedrag">' + geld(b) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>';
    return {
      onderdeel:'huishoudboekje: vast of variabel', onderdeelNaam:'vast of variabel', vorm:'sleep', sleutel:'vv' + posten.map(function(x){ return x.p[0]; }).join(''),
      vraag: 'Uit het kasboek van <b>' + S(jong ? kies(NAMEN) : kies(GEZINNEN)) + '</b>: welke post hoort waar?',
      opdracht: 'Kijk naar de drie maanden: een vaste last is elke maand even hoog. ' + (extraSoort === 'in' ? 'Eén post is geen uitgave maar een inkomst.' : 'Eén post is geld dat apart wordt gezet voor later: een reserveringsuitgave.'),
      beeld: beeld,
      kaarten: posten.map(function(x){ return { id: x.id, tekst: S(x.p[0]) }; }),
      vakken: vakken,
      uitleg: 'Vaste lasten: ' + vast.map(function(p){ return p[0]; }).join(', ') + ' (elke maand hetzelfde, je zit eraan vast). Variabele uitgaven: ' + varb.map(function(p){ return p[0]; }).join(', ') + ' (wisselt per maand, daar kun je op besparen). ' + (extraSoort === 'in' ? extra[0][0].charAt(0).toUpperCase() + extra[0][0].slice(1) + ' is een inkomst: dat komt binnen.' : extra[0][0].charAt(0).toUpperCase() + extra[0][0].slice(1) + ' is een reserveringsuitgave: je zet nu geld apart voor een grote uitgave later.'),
      antwoordTekst: vakken.map(function(v){ return v.naam + ': ' + v.hoort.map(function(id){ return posten.filter(function(x){ return x.id === id; })[0].p[0]; }).join(', '); }).join('; ')
    };
  }

  /* 3. keuze maken: het geld schiet tekort. Wat is verstandig? */
  var KEUZES = {
    jong: {
      goed: ['deze maand minder uitgeven aan snacks en uitgaan', 'de nieuwe sneakers een maand uitstellen', 'een extra dienst vragen bij je bijbaan', 'eerst je telefoonabonnement en je sportclub betalen, dan kijken wat er over is', 'een streamingabonnement opzeggen dat je bijna niet gebruikt', 'je uitgaven een maand bijhouden en de variabele uitgaven verlagen', 'geen nieuwe game kopen tot je weer geld over hebt', 'een tweedehands jas kopen in plaats van een nieuwe', 'oude spullen verkopen die je niet meer gebruikt', 'je lunch van thuis meenemen in plaats van hem te kopen', 'met je ouders overleggen en samen een plan maken'],
      fout: ['de telefoonrekening deze maand gewoon niet betalen', 'rood gaan staan en er later wel naar kijken', 'geld lenen bij een vriend voor de nieuwe game', 'de contributie van de sportclub niet betalen, dat merken ze toch niet', 'een dure telefoon op afbetaling kopen, dan heb je tenminste iets nieuws', 'je spaargeld voor de fiets opmaken aan kleding', 'met de bus reizen zonder te betalen', 'bij iemand anders lenen om de eerste lening terug te betalen', 'toch elke dag snacks halen, want dat is gezellig']
    },
    gezin: {
      goed: ['deze maand minder uit eten en geen uitjes', 'eerst de huur, de energie en de zorgverzekering betalen', 'de vakantie goedkoper plannen of een jaar uitstellen', 'een abonnement opzeggen dat niemand gebruikt', 'goedkopere boodschappen doen en aanbiedingen gebruiken', 'een overzicht maken van alle uitgaven en de variabele uitgaven verlagen', 'nakijken of het gezin recht heeft op een toeslag', 'de nieuwe bank pas kopen als ervoor gespaard is'],
      fout: ['de huur deze maand overslaan', 'de zorgverzekering opzeggen om geld te besparen', 'een lening afsluiten voor een nieuwe televisie', 'rood staan en hopen dat het volgende maand beter gaat', 'de energierekening niet betalen tot er een aanmaning komt', 'een tweede lening nemen om de eerste af te lossen', 'de boodschappen op de creditcard zetten en de rente later betalen', 'het spaargeld voor de wasmachine uitgeven aan een weekendje weg', 'de gemeentebelasting negeren, die komt vanzelf wel weer']
    }
  };
  var NODIG = { jong: ['telefoonabonnement', 'contributie sportclub', 'busabonnement naar school', 'schoolspullen', 'lunch voor school', 'reparatie van je fiets om naar school te gaan', 'vervanging van je kapotte winterjas'], gezin: ['huur', 'energie', 'zorgverzekering', 'boodschappen', 'gemeentebelasting', 'autoverzekering'] };
  var LUXE = { jong: ['nieuwe sneakers', 'bioscoop', 'een nieuwe game', 'snacks na school', 'een tweede streamingabonnement', 'nieuwe oordopjes', 'een concertkaartje', 'een nieuwe skin in een game'], gezin: ['weekendje weg', 'een nieuwe televisie', 'uit eten', 'een tweede streamingabonnement', 'een nieuwe bank', 'een duurder telefoonabonnement'] };
  function keuzeMaken(niveau){
    var jong = niveau === 'bb' || Math.random() < 0.5, wie = jong ? kies(NAMEN) : kies(GEZINNEN), soort = jong ? 'jong' : 'gezin';
    var P = jong ? JONGERE : GEZIN;
    var inn = inkomsten(P, 2).map(function(p){ return post(p, 'in'); }), uit = (jong ? pak(P.vast, 2).concat(pak(P.var, 2)) : pak(P.vast, 4).concat(pak(P.var, 3))).map(function(p){ return post(p, 'uit'); });
    var tekort = rond(som(uit) - som(inn));
    /* komt het toch uit? dan een onverwachte rekening erbij, zodat er echt een tekort is */
