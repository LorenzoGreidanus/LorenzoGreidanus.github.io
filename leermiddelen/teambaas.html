/* Teambaas: een donker speelveld in de stijl van de spellen (nachtblauw, gloed, merkkleuren), ook in het lichte thema */
.tb{--tb-bg:#0B1029;--tb-kaart:#121A3D;--tb-rand:rgba(251,246,241,.16);--tb-ink:#FBF6F1;--tb-zacht:#C9D2EE;--tb-stil:#8F9BC8;
  background:radial-gradient(ellipse 60% 50% at 70% 0%,rgba(32,78,207,.26),transparent 70%),var(--tb-bg);color:var(--tb-ink);border-radius:24px;padding:18px 22px 22px;margin:14px auto 24px;max-width:1340px;font-family:Poppins,system-ui,sans-serif}
.tb h2,.tb h3{margin:0;font-weight:600;color:var(--tb-ink)}.tb h2{font-size:1.15rem}.tb h3{font-size:1rem}
.tb a{color:#83A5F2}

.tb-klein{font-size:.8rem;color:var(--tb-zacht);line-height:1.45}
.tb-balk{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.tb-team{display:flex;align-items:center;gap:10px;margin-right:auto}.tb-team b{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.tb-kleuren{display:flex;gap:4px}.tb-kleuren i{width:16px;height:16px;border-radius:50%;box-shadow:0 0 10px currentColor}
.tb-tel{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--tb-rand)}
.tb-tel b{font-size:1.15rem;display:block;line-height:1.1}.tb-tel span,.tb-tel small{font-size:.72rem;color:var(--tb-zacht);display:block}
.tb-munt{border-color:rgba(234,152,54,.55);background:rgba(234,152,54,.08)}.tb-munt svg{width:22px;height:22px}
.tb-betr{border-color:rgba(131,165,242,.5);background:rgba(131,165,242,.08)}.tb-betr .tb-meter{width:120px}
.tb-meter{height:8px;border-radius:4px;background:rgba(251,246,241,.12);overflow:hidden;flex:1}.tb-meter i{display:block;height:100%;background:#83A5F2;border-radius:4px}

.tb-job-kop{display:flex;justify-content:space-between;gap:8px;font-size:.82rem}.tb-vrij{background:transparent;border:1.5px dashed rgba(251,246,241,.25);font-size:.82rem;color:var(--tb-zacht)}

.tb-vraagvak{min-height:440px;padding:26px 30px;gap:18px}.tb-label{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(251,246,241,.08);font-size:.75rem;color:var(--tb-zacht);font-style:normal}

.tb-opties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.tb-optie b{color:var(--tb-zacht);font-weight:600}.tb-optie:hover:not([disabled]){border-color:#83A5F2}

.tb-uitleg{display:flex;align-items:center;gap:16px;border-radius:16px;padding:14px 18px}.tb-uitleg>div{flex:1}.tb-uitleg p{margin:4px 0 0;font-size:.9rem;color:#E3E8F7}

.tb-bol{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.tb-garage{display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:16px;align-items:start}

.tb-midden{justify-content:center}.tb-tweehelm{display:flex;gap:16px;align-self:flex-start}.tb-tweehelm>div{display:flex;flex-direction:column;align-items:center;font-size:.75rem;color:var(--tb-zacht)}
