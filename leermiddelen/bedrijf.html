/* De bronnen: een loonstrook, een tabel en een bericht. Alles op de kleurtokens, zodat het in de donkere stand meekleurt.
   Smal genoeg voor een telefoon van 375 breed: twee kolommen, kleine binnenruimte. */
.beeld table.strook,.beeld table.bron{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem;background:var(--kaart2);border-radius:12px;overflow:hidden;width:min(100%,360px)}
.beeld table.strook caption,.beeld table.bron caption{caption-side:top;text-align:left;font-weight:700;padding:0 2px 6px;color:var(--ink)}
.beeld table.strook td,.beeld table.bron td,.beeld table.bron th{border:0;border-bottom:1px solid var(--rand2);padding:7px 10px;min-width:0;text-align:left;vertical-align:top}
.beeld table.strook td.b,.beeld table.bron td.b,.beeld table.bron th.b{text-align:right;white-space:nowrap}
.beeld table.bron th{background:var(--kaart-aan);font-weight:700;font-size:.88rem}
.beeld table.strook tr.som td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.beeld table.strook tr:last-child td,.beeld table.bron tr:last-child td{border-bottom:0}
.beeld .open{color:var(--nadruk);font-weight:700}
.beeld .bronbij{font-size:.8rem;color:var(--muted);margin-top:6px;text-align:left;width:min(100%,360px)}
.bericht{width:min(100%,420px);background:var(--kaart2);border-left:5px solid var(--spelkleur);border-radius:10px;padding:12px 14px;text-align:left;font-size:.95rem;line-height:1.45}
.bericht b{display:block;margin-bottom:4px;color:var(--ink)}
.bericht p{margin:0}
.koers{display:inline-block;background:var(--kaart2);border:2px solid var(--rand2);border-radius:12px;padding:8px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.koers small{display:block;font-weight:600;color:var(--muted);font-size:.78rem}
/* op een werkblad (werkblad.html zet deze stijl in zijn .blad) bestaat de spelkleur niet: de streep bij een bericht in inkt */
.blad .bericht{border-left:3px solid #14224C}

<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  var NIV = { bb:1, kgt:2, hv:3 };
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function tussen(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function rond(x, d){ var f = Math.pow(10, d === undefined ? 2 : d); return Math.round(x * f + (x >= 0 ? 1e-9 : -1e-9)) / f; }
  /* een getal tussen lo en hi in stappen van st */
  function stap(lo, hi, st){ return rond(lo + st * tussen(0, Math.round((hi - lo) / st)), 2); }
  /* Nederlands geschreven: punt voor duizendtallen, komma voor decimalen */
  function nl(x, dec){
    var neg = x < 0, s = Math.abs(x).toFixed(dec === undefined ? 0 : dec), p = s.split('.');
    return (neg ? '−' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (p[1] ? ',' + p[1] : '');
  }
  function heel(x){ return Math.abs(Math.round(x * 100)) % 100 === 0; }
  /* € 1.850 bij hele bedragen, € 12,50 met centen; geld2 altijd met centen */
  function geld(x){ return '€ ' + nl(x, heel(x) ? 0 : 2); }
  function geld2(x){ return '€ ' + nl(x, 2); }
  function pct(x, d){ return nl(x, d === undefined ? 1 : d) + '%'; }
  function hoofd(t){ t = String(t); return t.charAt(0).toUpperCase() + t.slice(1); }
  /* het goede antwoord eerst, daarna drie andere die echt anders zijn */
  function opties4(goed, fout){ var uit = [goed]; fout.forEach(function(f){ if (uit.length < 4 && uit.indexOf(f) < 0) uit.push(f); }); return uit; }

  /* invulvelden voor bedragen, procenten en aantallen */
  function bedrag(label, x, tol){ return { label:label, voor:'€', antwoord:rond(x, 2), tol:tol || 0.005, toon:geld2(x) }; }
  function procent(label, x){ return { label:label, antwoord:rond(x, 1), tol:0.05, eenheid:'%', toon:pct(x) }; }
  function aantal(label, x, eenheid){ return { label:label, antwoord:x, tol:0.5, eenheid:eenheid || '', toon:nl(x) + (eenheid ? ' ' + eenheid : '') }; }

  /* ---------- de bronnen ---------- */
  /* rijen: [label, bedrag, 'som' of 'open'] */
  function strook(titel, rijen, onder){
    return '<table class="strook"><caption>' + titel + '</caption>' + rijen.map(function(r){
      return '<tr' + (r[2] === 'som' ? ' class="som"' : '') + '><td>' + r[0] + '</td><td class="b' + (r[1] === '?' ? ' open' : '') + '">' + r[1] + '</td></tr>';
    }).join('') + '</table>' + (onder ? '<p class="bronbij">' + onder + '</p>' : '');
  }
  function tabel(titel, kop, rijen, onder){
    return '<table class="bron"><caption>' + titel + '</caption><tr>' + kop.map(function(k, i){ return '<th scope="col"' + (i ? ' class="b"' : '') + '>' + k + '</th>'; }).join('') + '</tr>' +
      rijen.map(function(r){ return '<tr>' + r.map(function(c, i){ return '<td' + (i ? ' class="b' + (c === '?' ? ' open' : '') + '"' : '') + '>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>' +
      (onder ? '<p class="bronbij">' + onder + '</p>' : '');
  }
  function bericht(kop, tekst){ return '<div class="bericht"><b>' + kop + '</b><p>' + tekst + '</p></div>'; }

  /* een meerkeuzevraag uit een lijst: { v:vraag, g:goed (of een lijst om uit te kiezen), f:[fout…], u:uitleg, n:vanaf niveau, b:bron } */
  function uitLijst(lijst, niv, deel, naam, pre){
    var l = lijst.filter(function(x){ return (x.n || 1) <= NIV[niv]; }), i = Math.floor(Math.random() * l.length), x = l[i];
    var g = Array.isArray(x.g) ? kies(x.g) : x.g, fout = H(x.f).slice(0, 3), opties = [g].concat(fout);
    return { onderdeel:'bedrijf: ' + deel, onderdeelNaam:naam, vorm:'meerkeuze', sleutel:pre + lijst.indexOf(x) + g,
      vraag:x.v, opdracht:x.o || '', beeld:x.b || '', opties:opties, goed:0,
      uitleg:x.u.replace(/#g/g, g), antwoordTekst:g };
  }
  /* sleepopgave: kaarten in vakken */
  function sleep(deel, naam, vraag, opdracht, vakken, kaarten, uitleg, pre){
    var ks = kaarten.map(function(k, i){ return { id:'k' + i, tekst:k.t, vak:k.v }; });
    return { onderdeel:'bedrijf: ' + deel, onderdeelNaam:naam, vorm:'sleep', sleutel:pre + kaarten.map(function(k){ return k.t.slice(0, 12); }).sort().join('|'),
      vraag:vraag, opdracht:opdracht,
      kaarten:ks.map(function(k){ return { id:k.id, tekst:k.tekst }; }),
      vakken:vakken.map(function(v){ return { id:v.id, naam:v.naam, uit:v.uit, hoort:ks.filter(function(k){ return k.vak === v.id; }).map(function(k){ return k.id; }) }; }),
      uitleg:uitleg || vakken.map(function(v){ var in_ = ks.filter(function(k){ return k.vak === v.id; }).map(function(k){ return k.tekst; }); return in_.length ? '<b>' + hoofd(v.naam) + '</b>: ' + in_.map(function(t){ return t.replace(/\.$/, ''); }).join('; ') + '.' : ''; }).filter(Boolean).join(' '),
      antwoordTekst:vakken.map(function(v){ return v.naam + ': ' + ks.filter(function(k){ return k.vak === v.id; }).map(function(k){ return k.tekst; }).join(', '); }).join('; ') };
  }

  var NAMEN = ['Sanne', 'Daan', 'Noor', 'Mohammed', 'Lotte', 'Sem', 'Aylin', 'Jesse', 'Fenna', 'Ilias', 'Mila', 'Bram', 'Yara', 'Thijs', 'Esra', 'Luuk', 'Nina', 'Kevin'];
  var BEROEP = ['als monteur', 'in de thuiszorg', 'als kok', 'bij een bouwbedrijf', 'als buschauffeur', 'in een distributiecentrum', 'als kapper', 'bij de gemeente', 'in een elektronicawinkel', 'als doktersassistent'];
  var BIJBAAN = ['in de supermarkt', 'bij de bakker', 'in een tuincentrum', 'bij de snackbar', 'in de bioscoop', 'in de afwas van een restaurant', 'bij een fietsenwinkel', 'als vakkenvuller'];
  var MAANDEN = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];

  /* =====================================================================
     1. Werk en loon
     ===================================================================== */
  var LOON = 'werk en loon';
  function loonstrook(niv){
    var n = kies(NAMEN), werk = kies(BEROEP), mnd = kies(MAANDEN);
    if (niv === 'bb'){
      var bruto = tussen(160, 280) * 10, hef = Math.round(bruto * tussen(8, 14) / 100), netto = bruto - hef;
      if (Math.random() < .6){
        return { onderdeel:'bedrijf: loon', onderdeelNaam:LOON, vorm:'meerkeuze', sleutel:'lsn' + bruto + '-' + hef,
          vraag:n + ' werkt ' + werk + '. Dit is de loonstrook over ' + mnd + '. Hoeveel geld komt er op de bankrekening van ' + n + '?',
          opdracht:'Op je rekening komt het nettoloon: het brutoloon min de inhoudingen.',
          beeld:strook('Loonstrook ' + mnd, [['Brutoloon', geld(bruto)], ['Loonheffing', '− ' + geld(hef)], ['Nettoloon', '?', 'som']]),
          opties:opties4(geld(netto), [geld(bruto), geld(bruto + hef), geld(hef)]), goed:0,
          uitleg:'Het nettoloon is ' + geld(bruto) + ' − ' + geld(hef) + ' = ' + geld(netto) + '. Het brutoloon is wat je verdient voordat er iets af gaat; dat krijg je dus niet helemaal op je rekening.', antwoordTekst:geld(netto) };
      }
      return { onderdeel:'bedrijf: loon', onderdeelNaam:LOON, vorm:'meerkeuze', sleutel:'lsh' + bruto + '-' + hef,
        vraag:'Op de loonstrook van ' + n + ' is een bedrag weggevallen. Hoeveel loonheffing heeft de werkgever ingehouden?',
        opdracht:'Brutoloon min loonheffing is nettoloon. Wat moet er dus tussen?',
        beeld:strook('Loonstrook ' + mnd, [['Brutoloon', geld(bruto)], ['Loonheffing', '?'], ['Nettoloon', geld(netto), 'som']]),
        opties:opties4(geld(hef), [geld(netto), geld(bruto + netto), geld(bruto)]), goed:0,
        uitleg:'De loonheffing is het verschil tussen bruto en netto: ' + geld(bruto) + ' − ' + geld(netto) + ' = ' + geld(hef) + '. De werkgever houdt dat in en betaalt het aan de Belastingdienst.', antwoordTekst:geld(hef) };
    }
    var u = stap(15, 22, 0.05), h = kies([96, 112, 120, 128, 136, 144, 152, 160]), b = rond(u * h, 2);
    var pens = rond(b * kies([0.04, 0.05, 0.06]), 2), heff = rond(b * tussen(9, 15) / 100 + tussen(0, 99) / 100, 2), net = rond(b - pens - heff, 2);
    var rijen = [['Brutoloon', geld2(b)], ['Pensioenpremie', '− ' + geld2(pens)], ['Loonheffing', '− ' + geld2(heff)], ['Nettoloon', geld2(net), 'som']];
    if (niv === 'kgt'){
      if (Math.random() < .5){
        return { onderdeel:'bedrijf: loon', onderdeelNaam:LOON, vorm:'invul', sleutel:'lsk' + u + '-' + h,
          vraag:n + ' werkt ' + werk + '. Op de loonstrook over ' + mnd + ' ontbreken twee bedragen. Bereken het brutoloon en het nettoloon.',
          opdracht:'Brutoloon = uurloon × uren. Nettoloon = brutoloon min alle inhoudingen.',
          beeld:strook('Loonstrook ' + mnd, [['Uurloon', geld2(u)], ['Gewerkte uren', String(h)], ['Brutoloon', '?'], ['Pensioenpremie', '− ' + geld2(pens)], ['Loonheffing', '− ' + geld2(heff)], ['Nettoloon', '?', 'som']]),
          velden:[bedrag('brutoloon', b), bedrag('nettoloon', net)],
          uitleg:'Brutoloon: ' + h + ' × ' + geld2(u) + ' = ' + geld2(b) + '. Nettoloon: ' + geld2(b) + ' − ' + geld2(pens) + ' − ' + geld2(heff) + ' = ' + geld2(net) + '. Vergeet niet beide inhoudingen eraf te halen.', antwoordTekst:geld2(b) + ' en ' + geld2(net) };
      }
      return { onderdeel:'bedrijf: loon', onderdeelNaam:LOON, vorm:'invul', sleutel:'lsi' + b + '-' + pens,
        vraag:'Hoeveel is er op de loonstrook van ' + n + ' in totaal <b>ingehouden</b>?',
        opdracht:'Tel alle inhoudingen op. Controleer: brutoloon min inhoudingen moet het nettoloon zijn.',
        beeld:strook('Loonstrook ' + mnd, rijen),
        velden:[bedrag('ingehouden', pens + heff)],
        uitleg:geld2(pens) + ' + ' + geld2(heff) + ' = ' + geld2(pens + heff) + '. Controle: ' + geld2(b) + ' − ' + geld2(pens + heff) + ' = ' + geld2(net) + ', het nettoloon.', antwoordTekst:geld2(pens + heff) };
    }
    var w = kies(['pct', 'cao', 'vak']);
    if (w === 'pct'){
      var p = heff / b * 100;
      return { onderdeel:'bedrijf: loon', onderdeelNaam:LOON, vorm:'invul', sleutel:'lsp' + b + '-' + heff,
        vraag:'Hoeveel procent van het brutoloon van ' + n + ' gaat naar de <b>loonheffing</b>?',
        opdracht:'Deel de loonheffing door het brutoloon en doe keer 100. Rond af op één decimaal.',
        beeld:strook('Loonstrook ' + mnd, rijen),
        velden:[procent('loonheffing', p)],
        uitleg:geld2(heff) + ' / ' + geld2(b) + ' × 100 = ' + pct(p) + '. Deel door het brutoloon, niet door het nettoloon: het percentage gaat over het hele loon.', antwoordTekst:pct(p) };
    }
    if (w === 'cao'){
      var x = kies([2, 2.5, 3, 3.5, 4, 4.5, 5]), nb = b * (1 + x / 100);
      return { onderdeel:'bedrijf: loon', onderdeelNaam:LOON, vorm:'invul', sleutel:'lsc' + b + '-' + x,
        vraag:'In de nieuwe cao staat dat alle lonen per 1 januari met <b>' + nl(x, x % 1 ? 1 : 0) + '%</b> stijgen. Wat wordt het brutoloon per maand van ' + n + '?',
        opdracht:'Gebruik het brutoloon van de loonstrook. Rond af op centen.',
        beeld:strook('Loonstrook ' + mnd, rijen),
        velden:[bedrag('nieuw brutoloon', nb, 0.011)],
        uitleg:geld2(b) + ' × ' + nl(1 + x / 100, 3).replace(/0+$/, '') + ' = ' + geld2(nb) + '. Een cao is een afspraak tussen werkgevers en vakbonden; de loonsverhoging gaat over het brutoloon. Het nettoloon stijgt niet precies even hard, want de inhoudingen veranderen mee.', antwoordTekst:geld2(nb) };
    }
    var vm = b * 0.08, vj = b * 12 * 0.08;
    return { onderdeel:'bedrijf: loon', onderdeelNaam:LOON, vorm:'invul', sleutel:'lsv' + b,
      vraag:n + ' bouwt elke maand vakantiegeld op: 8% van het brutoloon. Hoeveel is dat deze maand, en hoeveel over een heel jaar met hetzelfde loon?',
      opdracht:'Reken met het brutoloon, niet met het nettoloon. Rond af op centen.',
      beeld:strook('Loonstrook ' + mnd, rijen),
      velden:[bedrag('deze maand', vm, 0.011), bedrag('in een jaar', vj, 0.07)],
      uitleg:'8% van ' + geld2(b) + ' = ' + geld2(vm) + ' per maand. Over twaalf maanden: ' + geld2(vm) + ' × 12 = ' + geld2(vj) + '. Vakantiegeld is minstens 8% van je brutoloon; de meeste mensen krijgen het in mei of juni.', antwoordTekst:geld2(vm) + ' en ' + geld2(vj) };
  }

  function bijbaan(niv){
    var plek = kies(BIJBAAN);
    if (niv === 'bb'){
      var u = kies([6, 6.5, 7, 7.5, 8, 8.5, 9]), h = tussen(3, 12), w = u * h;
      if (Math.random() < .5) return { onderdeel:'bedrijf: loon', onderdeelNaam:LOON, vorm:'invul', sleutel:'bbb' + u + '-' + h,
        vraag:'Je bent 16 en werkt ' + plek + '. Je verdient <b>' + geld2(u) + '</b> bruto per uur. Deze week werk je <b>' + h + ' uur</b>. Hoeveel verdien je deze week bruto?',
        opdracht:'Bruto weekloon = uurloon × aantal uren.', velden:[bedrag('bruto deze week', w)],
        uitleg:h + ' × ' + geld2(u) + ' = ' + geld2(w) + '. Dit is je brutoloon; als er loonheffing wordt ingehouden, krijg je netto iets minder.', antwoordTekst:geld2(w) };
      return { onderdeel:'bedrijf: loon', onderdeelNaam:LOON, vorm:'meerkeuze', sleutel:'bbb' + u + '-' + h,
        vraag:'Je bent 16 en werkt ' + plek + '. Je verdient <b>' + geld2(u) + '</b> bruto per uur. Deze week werk je <b>' + h + ' uur</b>. Hoeveel verdien je deze week bruto?',
        opdracht:'Bruto weekloon = uurloon × aantal uren.',
        opties:opties4(geld2(w), [geld2(u * (h + 1)), geld2(u * (h - 1)), geld2(u + h)]), goed:0,
        uitleg:h + ' × ' + geld2(u) + ' = ' + geld2(w) + '. Dit is je brutoloon; als er loonheffing wordt ingehouden, krijg je netto iets minder.', antwoordTekst:geld2(w) };
    }
    var dagen = H(['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag']).slice(0, niv === 'kgt' ? 3 : 2);
    dagen.sort(function(a, b){ return ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'].indexOf(a) - ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'].indexOf(b); });
    var uren = dagen.map(function(){ return kies([2.5, 3, 3.5, 4, 4.5, 5, 6, 6.5]); }), uu = stap(6, 9, 0.05), som = uren.reduce(function(s, x){ return s + x; }, 0);
    var rijen = dagen.map(function(d, i){ return [d, nl(uren[i], uren[i] % 1 ? 1 : 0) + ' uur']; });
    if (niv === 'kgt'){
      var tot = uu * som;
      return { onderdeel:'bedrijf: loon', onderdeelNaam:LOON, vorm:'invul', sleutel:'bbk' + uu + '-' + uren.join('-'),
        vraag:'Je werkt ' + plek + ' voor <b>' + geld2(uu) + '</b> bruto per uur. Hoeveel verdien je deze week bruto?',
        opdracht:'Tel eerst de uren op en doe dan keer het uurloon.',
        beeld:tabel('Jouw rooster deze week', ['dag', 'uren'], rijen),
        velden:[bedrag('bruto deze week', tot)],
        uitleg:'Uren: ' + uren.map(function(x){ return nl(x, x % 1 ? 1 : 0); }).join(' + ') + ' = ' + nl(som, som % 1 ? 1 : 0) + ' uur. ' + nl(som, som % 1 ? 1 : 0) + ' × ' + geld2(uu) + ' = ' + geld2(tot) + '.', antwoordTekst:geld2(tot) };
    }
    var hz = kies([3, 4, 5, 6]), totz = uu * som + uu * 1.5 * hz;
    rijen.push(['zondag', hz + ' uur']);
    return { onderdeel:'bedrijf: loon', onderdeelNaam:LOON, vorm:'invul', sleutel:'bbh' + uu + '-' + uren.join('-') + '-' + hz,
      vraag:'Je werkt ' + plek + ' voor <b>' + geld2(uu) + '</b> bruto per uur. Volgens de cao krijg je op zondag <b>50% toeslag</b> op je uurloon. Hoeveel verdien je deze week bruto?',
      opdracht:'Reken de gewone uren en de zondaguren apart uit. Rond af op centen.',
      beeld:tabel('Jouw rooster deze week', ['dag', 'uren'], rijen),
      velden:[bedrag('bruto deze week', totz, 0.011)],

  /* =====================================================================
     Typen zoals je wilt: € 12,50 en 12.50 en 12,50 zijn allemaal goed.
     Vlak voordat de motor nakijkt (de klik op Nakijken, ook via Enter),
     haalt dit het euroteken, procentteken en de duizendtallen weg.
     ===================================================================== */
  function maakSchoon(w, verwacht){
    var s = String(w).trim().toLowerCase().replace(/€|euro|eur\b|procentpunt|procent|%|\s/g, '').replace(/[,.]-+$/, '').replace(/[\u2212\u2013]/g, '-');
    if (!s) return w;
    var p = s.indexOf('.') >= 0, k = s.indexOf(',') >= 0, groot = Math.abs(verwacht) >= 1000;
    if (p && k){ s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '') : s.replace(/,/g, ''); }
    else if (p && groot && /^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    else if (k && groot && /^-?\d{1,3}(,\d{3})+$/.test(s) && Math.abs(verwacht % 1) < 1e-9) s = s.replace(/,/g, '');
    return /^-?\d*[.,]?\d+$/.test(s) ? s : w;
  }
