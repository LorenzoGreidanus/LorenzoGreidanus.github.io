<style>
/* luisteren: de spreker met golfjes, knoppen, en de zin die pas na het antwoord in beeld komt */
.luisterkaart{width:100%;max-width:560px;margin:0 auto;display:grid;gap:10px;justify-items:center;text-align:center}
.luisterkaart [hidden]{display:none!important}
.luisterkaart .spreker{width:96px;height:72px;color:var(--nadruk)}
.luisterkaart .golf{opacity:.25;transition:opacity .2s}
.luisterkaart.praat .golf{opacity:1;animation:lkgolf .9s ease-in-out infinite alternate}
@keyframes lkgolf{from{transform:scale(.96);transform-origin:40% 50%}to{transform:scale(1.04);transform-origin:40% 50%}}
@media(prefers-reduced-motion:reduce){.luisterkaart.praat .golf{animation:none}}
.lknop{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lknop button{border:none;border-radius:999px;padding:12px 22px;font-weight:600;min-height:46px;background:var(--spelkleur,#204ECF);color:var(--spelinkt,#fff)}
.lknop button.stil{background:var(--kaart2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rand2)}
.lkmeld{font-size:.88rem;color:var(--muted);max-width:46ch;line-height:1.45;margin:0}
.lktekst{background:var(--kaart2);border-left:4px solid var(--nadruk);border-radius:0 14px 14px 0;padding:12px 16px;font-size:1.15rem;font-weight:600;line-height:1.45;text-align:left;max-width:52ch;margin:0;overflow-wrap:anywhere}
/* een zin met een gat, voor het typen */
.zinkaart{width:100%;max-width:560px;margin:0 auto;background:var(--kaart2);border-left:5px solid var(--nadruk);border-radius:0 16px 16px 0;padding:14px 18px;text-align:left;font-size:1.15rem;font-weight:600;line-height:1.55;overflow-wrap:anywhere}
.zinkaart .gat{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);text-align:center;color:var(--muted);font-weight:600;line-height:1.2;margin:0 2px}
.veldje input.breed{width:min(26em,calc(100vw - 60px))}
/* een mail of chat met gaten: bij elk gat kies je het stuk dat past */
.mailkaart{width:100%;max-width:640px;margin:0 auto;background:var(--kaart);border:1px solid var(--rand2);border-radius:16px;overflow:hidden;text-align:left}
.mailkop{background:var(--kaart2);padding:10px 16px;font-size:.88rem;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}
.mailtekst{padding:14px 16px;display:grid;gap:10px}
.mvast{margin:0;line-height:1.5;overflow-wrap:anywhere}
.mgat{display:grid;gap:6px;padding:6px 0 4px}
.mlabel{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mkeus{text-align:left;background:var(--kaart2);border:2px solid transparent;border-radius:12px;padding:10px 12px;font-weight:500;line-height:1.35;min-height:46px;color:var(--ink);overflow-wrap:anywhere}
.mkeus:hover:not(:disabled){border-color:var(--vista)}
.mkeus.on{border-color:var(--nadruk);background:var(--kaart-aan)}
.mkeus:disabled{cursor:default}
.mkeus.juist{background:var(--goed-bg);border-color:var(--goed);color:var(--goed)}
.mkeus.mis{background:var(--fout-bg);border-color:var(--fout);color:var(--fout)}
:root[data-theme="dark"] .mkeus.juist,:root[data-theme="dark"] .mkeus.mis{color:var(--ink)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .mkeus.juist,:root:not([data-theme="light"]) .mkeus.mis{color:var(--ink)}}
body.groot .lktekst,body.groot .zinkaart{font-size:1.5rem}
body.groot .mkeus,body.groot .mvast{font-size:1.15rem}
@media(max-width:560px){.lktekst,.zinkaart{font-size:1.05rem}.mailtekst{padding:12px 12px}}

  /* ================= hulpjes ================= */
  /* geen herhaling binnen een ronde; als alles al geweest is, begint de lijst opnieuw */
  var gebruikt = {};
  function pak(lijst, deel, niveau){

  /* samentrekkingen: I'd en I would zijn allebei goed (net als in translate.html) */

  function omzetten(z, van, naar){ return SAMEN.reduce(function(t, p){ return t.replace(new RegExp('\\b' + p[van] + '\\b', 'gi'), p[naar]); }, z); }
  function varianten(lijst){ var uit = [], gezien = {}; lijst.forEach(function(z){ [z, omzetten(z, 0, 1), omzetten(z, 1, 0)].forEach(function(v){ if (!gezien[v.toLowerCase()]){ gezien[v.toLowerCase()] = 1; uit.push(v); } }); }); return uit; }

  function luisterKaart(zegt){
    /* op een werkblad kan niemand luisteren: dan leest de docent voor en staat de zin er ook */
    if (WERKBLAD) return '<div class="luisterkaart"><p class="lkmeld">De docent leest voor, of je leest zelf.</p><p class="lktekst">' + S(zegt) + '</p></div>';

  }
  function luisterStart(zegt){
    var kaart = $('lk'); if (!kaart) return;
    var knop = $('lkBtn'), lang = $('lkLangzaam'), toon = $('lkToon'), meld = $('lkMeld'), tekst = $('lkTekst');
    var kan = !!(window.VOORLEES && VOORLEES.kan()), spreekt = false, geweest = false, weg = null;
    function zetKnop(){ knop.textContent = spreekt ? 'Stop' : (geweest ? 'Nog eens' : 'Luister'); }
    /* de zin in beeld: bij geen stem, bij een stem die het niet doet, op verzoek, of na het antwoord */
    function laatZien(waarom){
      tekst.hidden = false; toon.hidden = true;
      if (waarom) meld.textContent = waarom;
    }
    function nood(waarom){
      kaart.classList.remove('praat'); knop.hidden = true; lang.hidden = true;
      laatZien(waarom);
    }
    function lees(tempo){
      if (!kan) return;
      if (spreekt){ VOORLEES.stop(); return; }
      spreekt = true; geweest = true; kaart.classList.add('praat'); zetKnop();
      VOORLEES.spreek({ v: zegt, taal: TAAL, tempo: tempo, klaar: function(reden){
        spreekt = false; kaart.classList.remove('praat'); zetKnop();
        reden = String(reden || '');
        if (!/^(klaar|stop|te lang|interrupted|canceled|not-allowed)$/.test(reden)) nood('De stem werkt op dit apparaat niet. Lees de zin zelf en kies de beste reactie.');
        if (reden === 'not-allowed') meld.textContent = 'Druk op Luister om te beginnen.';
      } });
    }
    knop.addEventListener('click', function(){ lees(0.9); });
    lang.addEventListener('click', function(){ if (spreekt) VOORLEES.stop(); lees(0.65); });
    toon.addEventListener('click', function(){ laatZien(''); });
    /* geen stem voor Engels: de zin staat er meteen, met een uitleg */
    var gestart = false;
    function stemCheck(){
      if (!document.body.contains(kaart)){ if (weg) weg(); return; }
      if (gestart) return;
      if (!kan){ gestart = true; nood('Deze browser kan niet voorlezen, dus de zin staat hier. Op een telefoon of in een andere browser werkt het meestal wel.'); return; }
      if (!VOORLEES.stemmenBekend()) return;
      gestart = true;
      if (!VOORLEES.stemVoor(TAAL)) nood('Op dit apparaat staat geen Engelse stem, dus de zin staat hier. Lees hem zelf en kies de beste reactie.');
      else setTimeout(function(){ if (document.body.contains(kaart) && !spreekt && !geweest && VAKSPEL._stand().bezig) lees(0.9); }, 250);
    }
    if (kan && VOORLEES.opStemmen) weg = VOORLEES.opStemmen(stemCheck); else stemCheck();
    /* na het antwoord: de zin in beeld, en de stem stopt */
    var r = $('reactie');
    if (r && window.MutationObserver){
      var mo = new MutationObserver(function(){ if (r.querySelector('.uitslagregel')){ mo.disconnect(); if (window.VOORLEES) VOORLEES.stop(); laatZien(''); } });
      mo.observe(r, { childList: true });
    }
  }
  function luister(niveau){
    var p = pak(lijstVoor(LUISTER, niveau), 'l', niveau), x = p.x;
    return {
      onderdeel: 'situaties: luister', onderdeelNaam: 'luister en reageer', vorm: 'meerkeuze', sleutel: p.sl,

  }

  /* ================= mail ================= */
  function mail(niveau){
    /* vmbo-bb krijgt de makkelijkste mails: die van vmbo-kgt */
    var lijst = MAIL[niveau] || MAIL.kgt, p = pak(lijst, 'm', MAIL[niveau] ? niveau : 'kgt'), x = p.x;
    var chat = /^(Chat|Groepsapp)/.test(x.kop[0]);
    var gaten = x.d.filter(function(d){ return typeof d !== 'string'; });
    var uitleg = gaten.map(function(d){ return '<b>' + S(d[0]) + '</b>: ' + S(d[1]) + '<br>' + S(d[3] || STD_UIT[d[0]] || ''); }).join('<br><br>');
    return {
      onderdeel: 'situaties: mail', onderdeelNaam: 'mail en chat', vorm: 'eigen', sleutel: p.sl,
      vraag: chat ? 'Maak de chat af.' : 'Maak de mail af.',
      opdracht: S(x.s) + ' Kies bij elk gat het stuk dat past.',
      uitleg: uitleg,
      antwoordTekst: gaten.map(function(d){ return d[1]; }).join(' | '),
      teken: function(el, api){
        var staat = [], h = '<div class="mailkaart" lang="en"><div class="mailkop">' + x.kop.map(S).join('<br>') + '</div><div class="mailtekst">';
        x.d.forEach(function(d){
          if (typeof d === 'string'){ h += '<p class="mvast">' + S(d) + '</p>'; return; }
          var gi = staat.length, opts = H([{ t: d[1], goed: true }, { t: d[2][0], goed: false }, { t: d[2][1], goed: false }]);
          staat.push({ opts: opts, keus: -1 });
          h += '<div class="mgat" role="group" aria-label="' + S(d[0]) + '"><span class="mlabel">' + S(d[0]) + '</span>' +
            opts.map(function(o, k){ return '<button type="button" class="mkeus" data-g="' + gi + '" data-k="' + k + '" aria-pressed="false">' + S(o.t) + '</button>'; }).join('') + '</div>';
        });
        el.innerHTML = h + '</div></div>';
        var knop = api.knop('Nakijken', nakijken); knop.disabled = true;
        function kiesOptie(gi, k){
          staat[gi].keus = k;
          Array.prototype.forEach.call(el.querySelectorAll('.mkeus[data-g="' + gi + '"]'), function(b){ var aan = +b.getAttribute('data-k') === k; b.classList.toggle('on', aan); b.setAttribute('aria-pressed', aan ? 'true' : 'false'); });
          knop.disabled = staat.some(function(s){ return s.keus < 0; });
        }
        Array.prototype.forEach.call(el.querySelectorAll('.mkeus'), function(b){
          b.addEventListener('click', function(){ if (api.bezig()) kiesOptie(+b.getAttribute('data-g'), +b.getAttribute('data-k')); });
        });
        function nakijken(){
          if (!api.bezig() || staat.some(function(s){ return s.keus < 0; })) return;
          var goed = 0;
          staat.forEach(function(s, gi){
            if (s.opts[s.keus].goed) goed++;
            Array.prototype.forEach.call(el.querySelectorAll('.mkeus[data-g="' + gi + '"]'), function(b){
              var k = +b.getAttribute('data-k'); b.disabled = true; b.classList.remove('on');
              if (s.opts[k].goed) b.classList.add('juist'); else if (k === s.keus) b.classList.add('mis');
            });
          });
          knop.disabled = true;
          api.klaar(goed === staat.length, '', { goed: goed, van: staat.length });
        }
        el.proef = function(){ staat.forEach(function(s, gi){ kiesOptie(gi, s.opts.map(function(o){ return o.goed; }).indexOf(true)); }); nakijken(); };
        el.proefFout = function(){ staat.forEach(function(s, gi){ kiesOptie(gi, s.opts.map(function(o){ return o.goed; }).indexOf(false)); }); nakijken(); };
      }
    };
  }
