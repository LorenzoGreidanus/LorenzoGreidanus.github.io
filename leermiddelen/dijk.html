<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="cosmetica.js"></script>
<script src="avatar.js"></script>
<script src="profiel.js"></script>
<title>Dijkbouwers · meneer Greidanus</title>
<meta name="description" content="Dijkbouwers: de klas bouwt samen een dijk. Elk goed antwoord is een zandzak.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1430">
<link rel="stylesheet" href="../fonts.css?v=2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230B1430'/><path d='M14 70 Q50 30 86 70 Z' fill='%23E8C08A'/></svg>">
<style>
/* Dijkbouwers op de laptop van de leerling. Dezelfde nacht als het bord:
   navy, warm licht, crème kaarten met inkt. De vraag staat groot in het
   midden; onderaan de dijk van de klas, die meegroeit. */
:root{--nacht:#0B1430;--nacht2:#14224C;--inkt:#0B1430;--creme:#F3EFE9;--creme2:#FBF6F1;--zand:#E8C08A;--amber:#F2A23E;--koraal:#F26749;--vista:#83A5F2;--grijs:#B3BBD0}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 86% 13%,#F3EFE9 0 22px,rgba(131,165,242,.22) 24px,rgba(131,165,242,0) 120px),radial-gradient(1.4px 1.4px at 12% 18%,#F3EFE9 99%,transparent),radial-gradient(1.2px 1.2px at 34% 9%,#F3EFE9 99%,transparent),radial-gradient(1.6px 1.6px at 58% 15%,#F3EFE9 99%,transparent),radial-gradient(1.1px 1.1px at 72% 6%,#F3EFE9 99%,transparent),radial-gradient(1.3px 1.3px at 22% 31%,#F3EFE9 99%,transparent),linear-gradient(#070E26 0%,#14224C 42%,#2A3A78 74%,#6A5584 90%,#B86E5A 100%) fixed;color:var(--creme);
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hide{display:none !important}
.wrap{width:min(100% - 32px,980px);margin-inline:auto;min-height:100svh;display:flex;flex-direction:column;padding:18px 0 0}
/* de kop: wat de klas samen heeft, en wat jij deed */
.kop{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.kop .titel{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.kop .titel i{font-family:Caveat,cursive;font-style:normal;font-size:1.35rem;color:var(--koraal)}
.kop .titel b{font-size:1.5rem;font-weight:600}
.pil{display:flex;align-items:center;gap:10px;background:rgba(11,20,48,.75);border:2px solid rgba(243,239,233,.7);border-radius:14px;padding:7px 14px;font-size:.95rem;white-space:nowrap}
.pil small{color:var(--grijs);font-size:.8rem}
.pil svg{width:30px;height:30px;flex:none}
.klasbalk{flex:1 1 260px;min-width:220px;display:flex;flex-direction:column;gap:5px}
.klasbalk .rij{display:flex;justify-content:space-between;font-size:.88rem;color:var(--grijs)}
.klasbalk .rij b{color:var(--creme);font-weight:600}
.balk{height:12px;border-radius:999px;background:rgba(243,239,233,.15);overflow:hidden}
.balk i{display:block;height:100%;width:0;background:var(--amber);box-shadow:0 0 12px var(--amber);border-radius:999px;transition:width .8s}
/* de vraag */
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:22px 0 12px}
.vraag{background:var(--creme2);color:var(--inkt);border:3px solid var(--inkt);border-radius:22px;padding:22px 26px;box-shadow:0 0 0 2px rgba(243,239,233,.4),0 18px 40px rgba(0,0,0,.35)}
.vraag .soort{font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#5B6480;margin-bottom:6px}
.vraag h1{margin:0;font-size:clamp(1.25rem,2.1vw,1.7rem);font-weight:600;line-height:1.3;letter-spacing:-.01em}
.antw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.antw button{display:flex;align-items:center;gap:14px;text-align:left;min-height:68px;padding:12px 18px;border-radius:16px;
  background:var(--creme);color:var(--inkt);border:3px solid var(--inkt);font-size:1.08rem;font-weight:500;line-height:1.3;
  box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,background .15s}
.antw button:hover{background:#fff;transform:translateY(-1px)}
.antw button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.antw button:focus-visible{outline:4px solid var(--amber);outline-offset:2px}
.antw button .nr{flex:none;width:30px;height:30px;border-radius:50%;background:var(--inkt);color:var(--creme);display:grid;place-items:center;font-size:.9rem;font-weight:600}
.antw button[disabled]{cursor:default}
.antw button.goed{background:#FCE0B4;border-color:var(--inkt);box-shadow:0 0 0 4px var(--amber)}
.antw button.mis{background:#F7C9BE;opacity:.9}
.antw button.weg{opacity:.45}
/* na een antwoord */
.oordeel{min-height:58px;display:flex;align-items:center;gap:14px;border-radius:16px;padding:10px 16px;font-size:1rem}
.oordeel.goed{background:rgba(242,162,62,.16);border:2px solid var(--amber)}
.oordeel.mis{background:rgba(242,103,73,.14);border:2px solid var(--koraal)}
.oordeel b{font-weight:600}
.oordeel .uit{flex:1;min-width:0}
.oordeel .verder{flex:none;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--amber);color:var(--inkt);font-weight:600;font-size:1rem}
.oordeel .verder[disabled]{opacity:.5;cursor:wait}
.oordeel .verder:focus-visible{outline:4px solid var(--creme);outline-offset:2px}
/* de dijk onderaan: de muur van de klas groeit mee */
.dijk{height:170px;margin-top:auto;position:relative}
.dijk svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:1247px;height:170px;overflow:visible}
.golf{animation:golf 5s linear infinite}
@keyframes golf{from{transform:translateX(-80px)}to{transform:translateX(0)}}
.erbij{animation:erbij .6s cubic-bezier(.5,0,.75,.4) both}
@keyframes erbij{from{transform:translateY(-70px);opacity:0}30%{opacity:1}to{transform:translateY(0);opacity:1}}
.plus{position:fixed;left:50%;bottom:150px;transform:translate(-50%,-50%);font-size:1.6rem;font-weight:600;color:var(--amber);text-shadow:0 2px 0 var(--inkt);pointer-events:none;opacity:0}
.plus.aan{animation:plus 1s ease-out}
@keyframes plus{0%{opacity:0;transform:translate(-50%,-20%)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-160%)}}
/* wachten, einde */
.scherm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px 0}
.scherm h2{margin:0;font-size:clamp(1.6rem,3vw,2.4rem);font-weight:600}
.scherm p{margin:0;color:#DCE0EA;max-width:34em}
.scherm .hand{font-family:Caveat,cursive;font-size:1.6rem;color:var(--amber)}
.knop{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;border:0;background:var(--amber);color:var(--inkt);font-weight:600;text-decoration:none}
.knop.stil{background:transparent;border:2px solid rgba(243,239,233,.7);color:var(--creme)}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stats div{background:rgba(11,20,48,.75);border:2px solid rgba(243,239,233,.7);border-radius:16px;padding:10px 18px;min-width:130px}
.stats b{display:block;font-size:1.6rem;font-weight:600}
.stats small{color:var(--grijs)}
@media (max-width:640px){.antw{grid-template-columns:1fr}.dijk{height:110px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="kop">
    <div class="titel"><i>bouw mee aan de dijk</i><b>Dijkbouwers</b></div>
    <div class="klasbalk" aria-label="De dijk van de klas">
      <div class="rij"><span><b id="zakken">0</b> van <span id="doel">…</span> zakken</span><span id="klok"></span></div>
      <div class="balk"><i id="balk"></i></div>
    </div>
    <div class="pil" id="jij"><span id="gezicht"></span><span><b id="gelegd">0</b> <small>jij</small></span><span><b id="reeks">0</b> <small>op rij</small></span></div>
  </header>

  <main id="spel" class="hide">
    <section class="vraag" aria-live="polite">
      <div class="soort" id="soort"></div>
      <h1 id="vraagTekst"></h1>
    </section>
    <div class="antw" id="antw"></div>
    <div class="oordeel hide" id="oordeel" role="status"></div>
  </main>

  <section class="scherm" id="wacht">
    <div class="hand" id="wachtHand">even geduld</div>
    <h2 id="wachtKop">Verbinden…</h2>
    <p id="wachtUit"></p>
    <a class="knop stil hide" id="wachtTerug" href="strijd.html">Andere code invullen</a>
  </section>

  <section class="scherm hide" id="einde">
    <div class="hand" id="eindHand"></div>
    <h2 id="eindKop"></h2>
    <p id="eindUit"></p>
    <div class="stats" id="eindStats"></div>
    <a class="knop" href="index.html">Terug naar de site</a>
  </section>

  <div class="dijk" aria-hidden="true">
    <svg viewBox="0 0 1100 150" preserveAspectRatio="xMidYMax meet">
      <defs>
        <linearGradient id="zakK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBE6C6"/><stop offset=".6" stop-color="#E8C08A"/><stop offset="1" stop-color="#B98A55"/></linearGradient>
        <linearGradient id="dijkK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A5C9E"/><stop offset="1" stop-color="#1C2A5C"/></linearGradient>
        <g id="zak"><path d="M-15 -1 C-16 -9 -9 -11.5 0 -11.5 C9 -11.5 16 -9 15 -1 C15.5 6 9 8 0 8 C-9 8 -15.5 6 -15 -1 Z" fill="url(#zakK)" stroke="#0B1430" stroke-width="2.5"/></g>
      </defs>
      <g class="golf" fill="#1B3380" stroke="#83A5F2" stroke-width="2.5"><path d="M-720 108 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V170 H-720 Z"/></g>
      <path d="M700 140 L1900 134 V170 H700 Z" fill="#1C2A5C" stroke="#0B1430" stroke-width="3"/>
      <path d="M380 150 L450 104 L640 102 L760 150 Z" fill="url(#dijkK)" stroke="#0B1430" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M450 104 L640 102" stroke="#C9D3EE" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
      <g id="muur"></g>
    </svg>
  </div>
  <div class="plus" id="plus">+1 zandzak</div>
</div>
<script src="/vangnet.js" defer></script>
<script src="naamfilter.js"></script>
<script src="wakker.js"></script>
<script src="verbinding.js"></script>
<script>
/* Dijkbouwers op de laptop. De kamer (server/kamer.js, game "dijk") is de
   baas: hij stuurt je vraag zonder het goede antwoord, kijkt je keuze na en
   telt de zakken van de klas. Deze pagina laat alleen zien wat de kamer zegt.
   Na een fout lees je eerst de uitleg; de kamer telt een antwoord ook pas als
   het na de leestijd komt, dus doorklikken loont niet. */
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg', LEES = 2500;
  function param(k){ try { return new URLSearchParams(location.search).get(k); } catch (e){ return null; } }
  function schoon(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function kenmerk(){
    /* hetzelfde kenmerk als de Klasstrijd: wie in de wachtkamer zat, is hier dezelfde speler */
    var k = null;
    try { k = localStorage.getItem('lg-quiz-sid'); } catch (e){}
    if (!k){
      var r = new Uint8Array(12); crypto.getRandomValues(r);
      k = Array.prototype.map.call(r, function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
      try { localStorage.setItem('lg-quiz-sid', k); } catch (e){}
    }
    return k;
  }
  var CODE = String(param('kamer') || '').toUpperCase().replace(/[^A-Z]/g, '');
  var NAAM = String(param('naam') || '').trim().slice(0, 16);
  if (!NAAM){ try { NAAM = (localStorage.getItem('lg-quiz-naam') || '').trim().slice(0, 16); } catch (e){} }
  var AV = window.PROFIEL && PROFIEL.avatar ? PROFIEL.avatar() : '';
  var v = null, vraag = null, gekozen = -1, oordeelK = -1, wachtVolgende = null, verderKlok = null, dijk = null, klokT = null, verschil = 0, gelegdMuur = 0;

  function toon(id){ ['spel', 'wacht', 'einde'].forEach(function(x){ $(x).classList.toggle('hide', x !== id); }); }
  function wacht(hand, kop, uit, terug){ toon('wacht'); $('wachtHand').textContent = hand; $('wachtKop').textContent = kop; $('wachtUit').textContent = uit || ''; $('wachtTerug').classList.toggle('hide', !terug); }
  if (window.AVATAR && NAAM) $('gezicht').innerHTML = AVATAR.svg(NAAM, 30, AV, { stemming:'blij' });

  /* ---------- de muur onderaan: dezelfde plekken als op het bord, kleiner ---------- */
  var PLEK = [];
  [[490, 520, 550, 580, 610], [505, 535, 565, 595], [490, 520, 550, 580, 610], [505, 535, 565, 595]].forEach(function(r, i){ r.forEach(function(x){ PLEK.push({ x:x, y:93 - i * 19 }); }); });
  function legMuur(n, nieuw){
    var muur = $('muur');
    n = Math.max(0, Math.min(PLEK.length, n));
    while (muur.childNodes.length < n){
      var p = PLEK[muur.childNodes.length], g = document.createElementNS(NS, 'g'), u = document.createElementNS(NS, 'use');
      u.setAttribute('href', '#zak'); u.setAttribute('x', p.x); u.setAttribute('y', p.y);
      g.appendChild(u); if (nieuw) g.setAttribute('class', 'erbij'); muur.appendChild(g);
    }
    while (muur.childNodes.length > n) muur.removeChild(muur.lastChild);
  }
  function tijd(ms){ ms = Math.max(0, ms); var s = Math.ceil(ms / 1000), m = Math.floor(s / 60); s = s % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
  function klok(){ if (dijk) $('klok').textContent = 'nog ' + tijd(dijk.eind - (Date.now() + verschil)); }
  function zetDijk(d){
    if (!d) return;
    dijk = d;
    if (d.nu) verschil = d.nu - Date.now();
    $('zakken').textContent = d.zakken; $('doel').textContent = d.doel;
    $('balk').style.width = Math.min(100, d.zakken / d.doel * 100).toFixed(1) + '%';
    if (typeof d.gelegd === 'number') $('gelegd').textContent = d.gelegd;
    var n = Math.round(Math.min(1, d.zakken / d.doel) * PLEK.length);
    legMuur(n, n > gelegdMuur); gelegdMuur = n;
    klok();
    if (!klokT) klokT = setInterval(klok, 1000);
  }

  /* ---------- de vraag ---------- */
  function toonVraag(b){
    vraag = b; gekozen = -1;
    toon('spel');
    $('soort').textContent = b.kop || '';
    $('vraagTekst').textContent = b.v;
    $('antw').innerHTML = b.o.map(function(t, i){
      return '<button type="button" data-i="' + i + '"><span class="nr">' + (i + 1) + '</span><span>' + schoon(t) + '</span></button>';
    }).join('');
    Array.prototype.forEach.call($('antw').querySelectorAll('button'), function(k){ k.addEventListener('click', function(){ kies(+k.getAttribute('data-i')); }); });
    $('oordeel').classList.add('hide'); $('oordeel').innerHTML = '';
    var eerste = $('antw').querySelector('button');
    if (eerste && document.activeElement && document.activeElement.classList.contains('verder')) eerste.focus();
  }
  function kies(i){
    if (!vraag || gekozen >= 0 || !v) return;
    gekozen = i;
    Array.prototype.forEach.call($('antw').querySelectorAll('button'), function(k){ k.disabled = true; if (+k.getAttribute('data-i') === i) k.classList.add('gekozen'); });
    v.stuur({ t:'antwoord', k:vraag.k, b:i });
  }
  function oordeel(b){
    if (b.k === oordeelK) return;   /* hetzelfde oordeel nog een keer (de verbinding haperde) */
    oordeelK = b.k;
    $('gelegd').textContent = b.gelegd | 0; $('reeks').textContent = b.reeks | 0;
    if (dijk){ dijk.zakken = b.zakken; dijk.doel = b.doel; dijk.gelegd = b.gelegd; zetDijk(dijk); }
    /* het oordeel over een vraag die hier niet (meer) staat, na een herlaad: alleen de tellers */
    if (!vraag || vraag.k !== b.k) return;
    var knoppen = $('antw').querySelectorAll('button');
    Array.prototype.forEach.call(knoppen, function(k){
      var i = +k.getAttribute('data-i'); k.disabled = true;
      if (i === b.g) k.classList.add('goed'); else if (i === gekozen) k.classList.add('mis'); else k.classList.add('weg');
    });
    var o = $('oordeel');
    o.classList.remove('hide', 'goed', 'mis');
    if (b.goed){
      o.classList.add('goed');
      o.innerHTML = '<div class="uit"><b>Goed!</b> Je legt een zandzak op de dijk.' + (b.reeks >= 3 ? ' Al ' + b.reeks + ' op rij.' : '') + '</div>';
      var p = $('plus'); p.classList.remove('aan'); void p.offsetWidth; p.classList.add('aan');
      /* na een goed antwoord meteen door naar de volgende */
      verderKlok = setTimeout(volgende, 900);
    } else {
      o.classList.add('mis');
      var goed = vraag && vraag.o ? vraag.o[b.g] : '';
      o.innerHTML = '<div class="uit"><b>Helaas.</b> Het goede antwoord is <b>' + schoon(goed) + '</b>.' + (b.u ? ' ' + schoon(b.u) : '') + '</div>' +
        '<button type="button" class="verder" id="verder" disabled>Volgende</button>';
      var knop = $('verder');
      knop.addEventListener('click', volgende);
      /* eerst even lezen: de kamer telt een antwoord ook pas na de leestijd */
      verderKlok = setTimeout(function(){ knop.disabled = false; knop.focus(); }, LEES);
    }
  }
  function volgende(){
    clearTimeout(verderKlok);
    if (wachtVolgende){ var b = wachtVolgende; wachtVolgende = null; toonVraag(b); }
    else { vraag = null; $('antw').innerHTML = ''; $('vraagTekst').textContent = 'Even wachten op je volgende vraag…'; $('oordeel').classList.add('hide'); }
  }
  /* toetsen: 1 tot 4 kiest, Enter is Volgende */
  addEventListener('keydown', function(e){
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && vraag && gekozen < 0 && $('oordeel').classList.contains('hide')){ var k = $('antw').querySelector('[data-i="' + (n - 1) + '"]'); if (k){ e.preventDefault(); kies(n - 1); } }
  });

  /* ---------- de kamer ---------- */
  function einde(b){
    clearInterval(klokT); klokT = null;
    if (v) v.zetDicht();
    var d = b.dijk || dijk || { zakken:0, doel:0 };
    toon('einde');
    var gehaald = d.zakken >= d.doel && d.doel > 0;
    $('eindHand').textContent = gehaald ? 'goed gedaan' : 'net niet';
    $('eindKop').textContent = gehaald ? 'De dijk houdt!' : 'De dijk is nog niet dicht';
    $('klok').textContent = 'klaar';
    $('eindUit').textContent = gehaald ? 'De klas legde samen ' + d.zakken + ' zandzakken. De polder blijft droog.' : 'De klas legde samen ' + d.zakken + ' van de ' + d.doel + ' zandzakken. Er waren er nog ' + (d.doel - d.zakken) + ' nodig.';
    $('eindStats').innerHTML = '<div><b>' + (d.gelegd | 0) + '</b><small>zakken van jou</small></div><div><b>' + (d.beste | 0) + '</b><small>beste reeks</small></div><div><b>' + d.zakken + '</b><small>zakken samen</small></div>';
  }
  function bericht(b){
    if (b.t === 'welkom'){
      if (b.spel !== 'strijd' || b.game !== 'dijk'){ location.href = '/q/' + CODE; return; }
      if (b.fase === 'lobby') wacht('je doet mee', 'Wacht tot je docent start', 'Je bent binnen als ' + NAAM + '. Zodra de docent start, krijg je je eerste vraag.');
      if (b.fase === 'einde') wacht('helaas', 'Dit spel is al afgelopen', '', true);
      return;
    }
    if (b.t === 'start'){ wacht('daar gaan we', 'Je eerste vraag komt eraan…', ''); return; }
    if (b.t === 'stand'){ if (b.dijk) zetDijk(b.dijk); return; }
    if (b.t === 'vraag'){
      if (!Array.isArray(b.o) || !(b.k >= 0)) return;
      /* tijdens een oordeel wacht de nieuwe vraag tot je verder gaat */
      if (vraag && gekozen >= 0 && !$('oordeel').classList.contains('hide')) wachtVolgende = b;
      else if (!vraag || vraag.k !== b.k) toonVraag(b);
      return;
    }
    if (b.t === 'uitslag'){ oordeel(b); return; }
    if (b.t === 'einde'){ einde(b); return; }
    if (b.t === 'eruit'){ if (v) v.zetDicht(); wacht('jammer', 'Je bent uit dit spel gehaald', 'Was dat een vergissing? Vul de code opnieuw in.', true); return; }
    if (b.t === 'verhuis' && /^[A-Z]{4}$/.test(b.code || '') && b.code !== CODE){
      if (v) v.sluit();
      location.href = 'dijk.html?kamer=' + b.code + '&naam=' + encodeURIComponent(NAAM);
    }
  }
  function verbind(){
    v = VERBINDING.maak({ pad: CODE + '?rol=speler&sid=' + encodeURIComponent(kenmerk()) + '&naam=' + encodeURIComponent(NAAM) + '&av=' + encodeURIComponent(AV), rol:'speler',
      onBericht: bericht,
      /* weer verbonden: een keuze waar nog geen oordeel op kwam, gaat nog een keer (dubbel telt de kamer niet) */
      onOpen: function(opnieuw){ if (opnieuw && vraag && gekozen >= 0 && oordeelK !== vraag.k) v.stuur({ t:'antwoord', k:vraag.k, b:gekozen }, { rij:false }); },
      onEruit: function(){ wacht('jammer', 'Je bent uit dit spel gehaald', 'Was dat een vergissing? Vul de code opnieuw in.', true); },
      onDicht: function(){ if ($('einde').classList.contains('hide')) wacht('helaas', 'Het spel is gesloten', 'Vraag je docent om de nieuwe code.', true); } });
  }
  if (CODE.length !== 4){ wacht('oeps', 'Geen code', 'Vul de code van je docent in om mee te doen.', true); return; }
  if (!NAAM || (window.NAAMFILTER && NAAMFILTER.verboden(NAAM))){ location.href = 'strijd.html?k=' + CODE; return; }
  fetch('/api/kamer/' + CODE).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); }).then(function(x){
    if (!x.ok){ wacht('oeps', 'Deze code bestaat niet', 'Kijk of je hem goed hebt overgenomen.', true); return; }
    if (x.j.spel !== 'strijd' || x.j.game !== 'dijk'){ location.href = '/q/' + CODE; return; }
    if (x.j.fase === 'einde'){ wacht('helaas', 'Dit spel is al afgelopen', '', true); return; }
    try { localStorage.setItem('lg-quiz-naam', NAAM); } catch (e){}
    verbind();
  }).catch(function(){ wacht('oeps', 'Geen verbinding', 'De server is nu niet bereikbaar. Probeer het zo nog eens.', true); });
  legMuur(0);
})();
</script>
