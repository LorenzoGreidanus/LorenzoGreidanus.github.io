<style>
/* De situatie, de tabellen en de tekeningen lezen hun kleuren uit de tokens van vakspel.css,
   zodat de donkere stand meekantelt. Alleen de rand van de situatie heeft de spelkleur. */
.af-sit{max-width:62ch;width:100%;text-align:left;background:var(--kaart2);border-left:4px solid var(--spelkleur);border-radius:0 14px 14px 0;padding:13px 18px 13px 16px;font-size:1.02rem;line-height:1.6}
.af-sit p+p{margin-top:8px}
.af-wrap{display:grid;gap:10px;justify-items:center;width:100%}
.af-tab{border-collapse:collapse;width:100%;max-width:520px;font-size:.9rem;background:var(--kaart);margin-top:10px}
.af-tab caption{caption-side:top;text-align:left;font-size:.82rem;color:var(--muted);font-weight:600;padding:0 2px 6px}
.af-tab td,.af-tab th{padding:7px 10px;text-align:left;border:1px solid var(--rand2);line-height:1.35}
.af-tab thead th{background:var(--kaart2);font-weight:600}
.af-tab td.n,.af-tab th.n{text-align:center;font-variant-numeric:tabular-nums}
.beeld svg.af-gr,.missers svg.af-gr{width:100%;max-width:min(100%,440px);height:auto;display:block;font-family:inherit;color:var(--ink)}
.af-gr text{fill:var(--muted);font-size:13px}
.af-gr .kop{fill:var(--ink);font-weight:600}
.af-gr .raster{stroke:var(--rand2);stroke-width:1}
.af-gr .as{stroke:currentColor;stroke-width:2;stroke-linecap:round}
.af-gr .lijn{fill:none;stroke:var(--nadruk);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.af-gr .mark{stroke:var(--hand);stroke-width:2;stroke-dasharray:5 4}
.af-gr .marktekst{fill:var(--hand);font-weight:600;font-size:12.5px}
.af-gr .tak{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.af-gr .soort{fill:var(--ink);font-size:14px;font-weight:600}
body.groot .af-sit{font-size:1.25rem}
.af-mis{display:none}
/* een rij stappen op volgorde: elke stap een eigen rij, anders staan lange zinnen in smalle kolommen */
body.af-stap .vakken.rij{grid-template-columns:1fr}
body.af-stap .vakken.rij .sleepdoel{flex-direction:row;align-items:center;min-height:58px;gap:10px}
body.af-stap .vakken.rij .doelknop{width:auto;flex:none}
body.af-stap .vakken.rij .sleepdoel .inhoud{justify-content:flex-start;flex:1;min-height:32px}
body.af-stap .sleepkaart{text-align:left;font-weight:500;font-size:.92rem;display:flex}
body.af-stap .kaartjes{flex-direction:column;align-items:stretch}
@media(max-width:560px){.af-sit{font-size:.97rem;padding:11px 14px}.af-tab{font-size:.84rem}.af-tab td,.af-tab th{padding:6px 7px}}
/* Op een werkblad (werkblad.html zet deze stijl in zijn .blad): een grafiek of stamboom even
   breed als in het spel; het blad maakt een tekening anders zo breed als de bladzijde */
.blad .vakspel .beeld svg.af-gr{max-width:min(100%,440px)}
/* --hand staat in vakspel.css, dat het werkblad niet laadt: zonder deze regel verdwijnen de
   stippellijnen bij de eerste en tweede besmetting uit de grafiek */
.blad{--hand:#D9522F}

<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function tussen(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function kaal(t){ return String(t || '').replace(/<[^>]+>/g, '').trim(); }
  function sit(t){ return '<div class="af-sit">' + t + '</div>'; }

  var NAAM = { verdediging:'eerste verdediging', bloed:'afweer in je bloed', immuniteit:'immuniteit', evolutie:'evolutie', gedrag:'gedrag' };
  var ALLE = ['verdediging', 'bloed', 'immuniteit', 'evolutie', 'gedrag'];
  /* vmbo-bb: bescherming en het bloed horen bij de stof; evolutie en gedrag niet */
  var BB = ['verdediging', 'bloed', 'immuniteit'];
  function basis(deel, niv){ return { onderdeel:'afweer: ' + deel, onderdeelNaam:NAAM[deel] }; }

  /* een meerkeuzevraag: het eerste antwoord is het goede (de motor husselt) */
  function M(s, v, o, u){ return { t:'m', s:s, v:v, o:o, u:u }; }
  /* een invulvraag met een begrip; alle teksten in a zijn goed */
  function I(s, v, l, a, u){ return { t:'i', s:s, v:v, l:l, a:a, u:u }; }

  /* =====================================================================
     DE LIJSTEN: per onderdeel en niveau
     ===================================================================== */
  var LIJST = { verdediging:{}, bloed:{}, immuniteit:{}, evolutie:{}, gedrag:{} };

  /* ---------- eerste verdediging ---------- */
  LIJST.verdediging.bb = [
    M('Je huid is aan de buitenkant bedekt met een laag dode, platte cellen.', 'Hoe heet deze laag?',
      ['de hoornlaag', 'de kiemlaag', 'de lederhuid', 'het onderhuids bindweefsel'],
      'De hoornlaag is de buitenste laag van je huid. Hij bestaat uit dode cellen en houdt ziekteverwekkers en water tegen. De kiemlaag ligt eronder: daar worden nieuwe huidcellen gemaakt.'),
    M('', 'Waartegen beschermt de hoornlaag van je huid je <b>niet</b>?',
      ['tegen ziekteverwekkers die je inademt', 'tegen uitdroging', 'tegen infecties via de huid', 'tegen beschadiging van de huid'],
      'De hoornlaag beschermt tegen infecties, uitdroging en beschadiging. Wat je inademt, komt niet langs je huid maar in je luchtwegen. Daar beschermen slijm en trilhaartjes je.'),
    M('Sanne ligt de hele middag in de zon. Na een paar dagen is haar huid bruiner geworden.', 'Wat is de functie van het bruine pigment in haar huid?',
      ['Het beschermt tegen ultraviolette straling (uv) uit zonlicht.', 'Het houdt ziekteverwekkers tegen.', 'Het voorkomt dat de huid uitdroogt.', 'Het maakt de huid dikker, zodat hij niet beschadigt.'],
      'Pigment vangt uv-straling op, zodat de cellen dieper in de huid minder schade krijgen. Bruin worden is dus een bescherming, maar geen volledige: je kunt toch verbranden.'),
    M('In je neus en luchtpijp zit een laagje slijm. Stofjes en bacteriën die je inademt, blijven eraan plakken.', 'Wat werkt dit slijm naar je keel?',
      ['trilhaartjes', 'de hoornlaag', 'maagzuur', 'pigment'],
      'Trilhaartjes bewegen steeds dezelfde kant op en werken het slijm met stof en bacteriën naar je keel. Daar slik je het in of hoest je het op.'),
    M('Je eet een broodje waar een paar bacteriën op zitten.', 'Wat doodt in je lichaam de meeste van die bacteriën?',
      ['het zoutzuur in je maag', 'de trilhaartjes in je luchtpijp', 'het pigment in je huid', 'de hoornlaag van je huid'],
      'Je maagsap bevat zoutzuur. Dat is zo zuur dat de meeste bacteriën in je eten doodgaan voordat ze je darmen bereiken.'),
    M('Je valt van je fiets en schaaft je knie. Er komt wat bloed uit, en na een tijdje zit er een korstje op.', 'Waarom is het korstje belangrijk?',
      ['Het sluit de wond af, zodat er geen ziekteverwekkers meer in komen.', 'Het maakt nieuwe bloedcellen.', 'Het doodt alle bacteriën in de wond.', 'Het houdt uv-straling tegen.'],
      'Op de plek van de wond is de hoornlaag weg. Het bloed stolt en het korstje sluit de wond af: bloed blijft binnen en ziekteverwekkers blijven buiten. Het korstje doodt zelf geen bacteriën.'),
    M('Je hebt je hand opengehaald aan een roestig hek.', 'Waarom spoel je het wondje schoon?',
      ['Om vuil en ziekteverwekkers weg te halen voordat ze in de wond kunnen groeien.', 'Om het bloed sneller te laten stollen.', 'Om de hoornlaag sneller terug te laten groeien.', 'Om de wond te beschermen tegen zonlicht.'],
      'Door de wond is de hoornlaag kapot, dus ziekteverwekkers kunnen naar binnen. Schoonmaken haalt vuil en bacteriën weg. Zo is de kans op een ontsteking kleiner.'),
    M('', 'Waarom is het slim om je handen te wassen voor het eten en na de wc?',
      ['Zo spoel je ziekteverwekkers weg voordat ze in je lichaam komen.', 'Zo wordt je hoornlaag dikker.', 'Zo maakt je lichaam meer pigment.', 'Zo heb je daarna geen afweer meer nodig.'],
      'Op je handen zitten vaak bacteriën en virussen. Met eten of door aan je mond te zitten komen ze naar binnen. Handen wassen haalt ze weg voordat dat gebeurt.'),
    M('Als er een vuiltje in je oog komt, gaat je oog tranen.', 'Hoe beschermt traanvocht je oog?',
      ['Het spoelt vuil en ziekteverwekkers weg en bevat een stof die bacteriën doodt.', 'Het maakt een nieuwe hoornlaag op je oog.', 'Het houdt uv-straling tegen.', 'Het laat je bloed sneller stollen.'],
      'Traanvocht spoelt het oog schoon. Er zit ook een stof in (lysozym) die bacteriën kapotmaakt. Je oog heeft geen hoornlaag, dus dit is daar de bescherming.'),
    M('Hepatitis B en hiv kunnen via bloed van de ene op de andere persoon overgaan.', 'Hoe verklein je de kans op besmetting?',
      ['Gebruik nooit een naald, scheermesje of tandenborstel van een ander.', 'Smeer je goed in met zonnebrandcrème.', 'Was je handen na het sporten.', 'Eet geen rauwe groente.'],
      'Op een naald, scheermesje of tandenborstel kan een beetje bloed zitten. Zo kan het virus van de een naar de ander gaan. Zonnebrandcrème en handen wassen beschermen hier niet tegen.'),
    M('', 'Wat beschermt bij seks het best tegen soa’s zoals chlamydia en gonorroe?',
      ['een condoom', 'de anticonceptiepil', 'na de seks je handen wassen', 'vooraf een paar antibiotica slikken'],
      'Een condoom houdt ziekteverwekkers in sperma, voorvocht en vaginavocht tegen. De pil beschermt alleen tegen zwanger worden, niet tegen soa’s.'),
    M('Tuberculose (tbc) is een besmettelijke ziekte die vooral de longen aantast.', 'Hoe wordt tbc meestal verspreid?',
      ['via kleine druppeltjes in de lucht als een zieke hoest', 'via een muggenbeet', 'via bedorven eten', 'via een schaafwond'],
      'Tbc-bacteriën zitten in de longen. Als een zieke hoest of niest, komen ze in kleine druppeltjes in de lucht. Wie die inademt, kan besmet raken.'),
    M('Je hebt verkoudheid en moet vaak niezen.', 'Waarom is niezen of hoesten in je elleboog beter dan in je hand?',
      ['Dan komen de ziekteverwekkers niet op je hand, waarmee je daarna deurklinken en mensen aanraakt.', 'Dan ben je zelf sneller beter.', 'Dan maak je meer slijm aan.', 'Dan worden de ziekteverwekkers in je elleboog gedood.'],
      'Met je hand raak je van alles aan. Zo geef je ziekteverwekkers door. In je elleboog blijven ze op een plek waar je niemand mee aanraakt.'),
    I('', 'Hoe heet de laag dode cellen aan de buitenkant van je huid?', 'de laag', ['hoornlaag', 'de hoornlaag'],
      'De hoornlaag bestaat uit dode cellen. Hij beschermt tegen infecties, uitdroging en beschadiging.'),
    I('', 'Je maag maakt een zuur dat bacteriën in je eten doodt. Hoe heet dat zuur?', 'het zuur', ['zoutzuur', 'maagzuur'],
      'Het maagsap bevat zoutzuur. Daarom heet het ook wel maagzuur. De meeste bacteriën gaan erdoor dood.'),
    I('', 'Kleine haartjes in je luchtwegen werken slijm met stof en bacteriën naar je keel. Hoe heten ze?', 'de haartjes', ['trilhaartjes', 'trilharen', 'trilhaartje'],
      'Trilhaartjes bewegen als een golf steeds naar boven. Zo gaat het slijm met stof en bacteriën naar je keel.')
  ];
  LIJST.verdediging.kgt = [
    M('Op een tekening van de huid zie je van buiten naar binnen: de hoornlaag, de kiemlaag, de lederhuid en het onderhuids bindweefsel.', 'In welke laag worden nieuwe huidcellen gemaakt, die later de hoornlaag vormen?',
      ['de kiemlaag', 'de hoornlaag', 'de lederhuid', 'het onderhuids bindweefsel'],
      'In de kiemlaag delen cellen zich. De nieuwe cellen schuiven naar buiten, sterven af en verhoornen. Zo wordt de hoornlaag steeds aangevuld. De hoornlaag zelf bestaat uit dode cellen en kan dus niet delen.'),
    M('Iemand met grote brandwonden ligt in het ziekenhuis vaak in een extra schone kamer.', 'Waarom is dat nodig?',
      ['Door de brandwonden is de hoornlaag weg, dus ziekteverwekkers komen makkelijk binnen.', 'Door de brandwonden maakt het lichaam geen pigment meer.', 'Door de brandwonden werken de trilhaartjes niet meer.', 'Door de brandwonden is het bloed besmettelijk voor anderen.'],
      'De hoornlaag houdt normaal ziekteverwekkers en water tegen. Bij grote brandwonden is die laag weg. De patiënt kan dan makkelijk een infectie krijgen en droogt ook sneller uit.'),
    M('Mensen die veel roken, hoesten vaak ’s ochtends en krijgen vaker een longontsteking. Roken beschadigt de trilhaartjes in hun luchtwegen.', 'Welke verklaring past hierbij?',
      ['Slijm met ziekteverwekkers wordt minder goed afgevoerd en blijft in de luchtwegen.', 'Rook doodt alle witte bloedcellen in het bloed.', 'Rook maakt de hoornlaag van de huid dunner.', 'Door roken wordt het maagzuur minder zuur.'],
      'Trilhaartjes werken slijm met stof en ziekteverwekkers naar boven. Werken ze slecht, dan blijft het slijm liggen en kunnen bacteriën zich daar vermenigvuldigen. Het ochtendhoesten is het lichaam dat dat slijm toch kwijt wil.'),
    M('Meneer De Vries slikt al jaren een medicijn dat zijn maag minder zuur maakt.', 'Welk risico loopt hij daardoor?',
      ['Meer bacteriën uit zijn eten overleven de maag, dus hij heeft meer kans op een darminfectie.', 'Zijn eten wordt niet meer verteerd in de dunne darm.', 'Hij maakt minder antistoffen.', 'Hij verbrandt sneller in de zon.'],
      'Maagzuur doodt de meeste bacteriën in je eten. Is de maag minder zuur, dan komen er meer levende bacteriën in de darmen. De vertering in de dunne darm gaat gewoon door.'),
    M('Je hebt een splinter in je vinger. Een dag later is de plek rood, warm, dik en pijnlijk.', 'Waardoor wordt de plek rood en warm?',
      ['Er stroomt meer bloed naar de plek, want de bloedvaten daar worden wijder.', 'De bacteriën maken warmte en een rode kleurstof.', 'De hoornlaag rond de splinter verbrandt.', 'De rode bloedcellen gaan op die plek kapot.'],
      'Dit is een ontsteking. De bloedvaten worden wijder, er stroomt meer warm bloed naar de plek en daarmee komen ook meer witte bloedcellen. Die ruimen de bacteriën op.'),
    M('In een ontstoken wondje zit na een paar dagen geelwit vocht: pus.', 'Waaruit bestaat pus vooral?',
      ['dode witte bloedcellen en bacteriën', 'rode bloedcellen', 'stukjes hoornlaag', 'vet uit de huid'],
      'Witte bloedcellen ruimen de bacteriën op en gaan daarbij zelf ook dood. Die dode witte bloedcellen, dode bacteriën en weefselresten vormen samen pus.'),
    M('Bij een wondje plakken bloedplaatjes aan de wondrand. Er ontstaat een netwerk van draden waarin bloedcellen blijven hangen.', 'Hoe heten deze draden?',
      ['fibrine', 'antistoffen', 'hemoglobine', 'pigment'],
      'Bloedplaatjes zetten de bloedstolling in gang. Daarbij ontstaan fibrinedraden. In dat netwerk blijven bloedcellen hangen: zo ontstaat een stolsel, en later een korstje.'),
    M('Mensen met albinisme maken (bijna) geen pigment.', 'Waarom moeten zij extra goed oppassen in de zon?',
      ['Hun huid wordt minder beschermd tegen uv-straling, dus ze verbranden sneller.', 'Hun hoornlaag laat meer bacteriën door.', 'Ze kunnen niet zweten en raken oververhit.', 'Ze maken geen antistoffen tegen zonlicht.'],
      'Pigment vangt uv-straling op. Zonder pigment komt de straling diep in de huid. Dat geeft snel verbranding en op den duur meer kans op huidkanker. De hoornlaag en het zweten werken bij hen gewoon.'),
    M('Zweet en talg maken je huid een beetje zuur.', 'Wat is daarvan het voordeel?',
      ['Veel bacteriën groeien slecht op een zure huid.', 'Een zure huid verbrandt minder snel.', 'Een zure huid maakt meer pigment.', 'Op een zure huid stolt het bloed sneller.'],
      'Ziekteverwekkers groeien het best in een vochtige, niet zure omgeving. De droge, licht zure huid remt de groei van veel bacteriën.'),
    M('Bloeddonors worden elke keer gecontroleerd op hiv en hepatitis.', 'Waarom is dat nodig?',
      ['Deze virussen kunnen met het bloed van de donor bij de ontvanger komen.', 'Deze virussen maken het bloed te dik om te geven.', 'Mensen met hepatitis hebben geen witte bloedcellen.', 'Deze ziekten zijn erfelijk.'],
      'Hiv en hepatitis B en C worden via bloed overgedragen. Bij een bloedtransfusie gaat bloed rechtstreeks het lichaam van de ontvanger in. Daarom wordt elk bloedzakje getest.'),
    M('Je hebt per ongeluk een stukje bedorven eten gegeten en moet overgeven.', 'Is overgeven hier een vorm van verdediging?',
      ['Ja, zo raak je de schadelijke stoffen en bacteriën snel kwijt.', 'Nee, overgeven heeft geen functie.', 'Ja, want bij overgeven maak je antistoffen.', 'Nee, overgeven maakt de bacteriën juist sterker.'],
      'Overgeven en diarree zijn manieren om schadelijke stoffen en ziekteverwekkers snel uit je lichaam te krijgen. Antistoffen hebben er niets mee te maken.'),
    M('Een leerling zegt: "Slijm in je neus is vies en heeft geen nut."', 'Waarom klopt dat niet?',
      ['Slijm vangt stof en ziekteverwekkers voordat ze je longen bereiken.', 'Slijm maakt pigment tegen uv-straling.', 'Slijm bevat antibiotica.', 'Slijm maakt de lucht droger.'],
      'Het slijm in neus en luchtpijp is een vangnet. Stof en ziekteverwekkers plakken eraan vast en trilhaartjes voeren het af. Slijm maakt de lucht juist vochtiger.'),
    M('Bij verkoudheid zijn je lymfeklieren in je hals soms dik en gevoelig.', 'Wat gebeurt daar?',
      ['Daar zijn veel witte bloedcellen bezig de ziekteverwekkers te bestrijden.', 'Daar wordt slijm gemaakt.', 'Daar wordt maagzuur gemaakt.', 'Daar worden nieuwe huidcellen gemaakt.'],
      'In lymfeklieren zitten veel witte bloedcellen. Bij een infectie gaan die delen en aan het werk. Daardoor zwellen de klieren op.'),
    I('', 'Hoe heet de reactie waarbij een plek in je lichaam rood, warm, gezwollen en pijnlijk wordt omdat je lichaam ziekteverwekkers bestrijdt?', 'de reactie', ['ontsteking', 'een ontsteking', 'ontstekingsreactie'],
      'Bij een ontsteking worden de bloedvaten wijder. Er komt meer bloed en er komen meer witte bloedcellen naar de plek.'),
    I('', 'In welke laag van de opperhuid worden nieuwe huidcellen en pigment gemaakt?', 'de laag', ['kiemlaag', 'de kiemlaag'],
      'De kiemlaag ligt onder de hoornlaag. Daar delen cellen en wordt pigment gemaakt.'),
    I('', 'Welke draden vormen bij de bloedstolling een netwerk waarin bloedcellen blijven hangen?', 'de draden', ['fibrine', 'fibrinedraden', 'fibrinedraad'],
      'Fibrinedraden ontstaan bij de bloedstolling, die door de bloedplaatjes in gang wordt gezet.')
  ];
  LIJST.verdediging.hv = [
    M('Het afweersysteem wordt vaak in twee delen verdeeld: de aspecifieke afweer en de specifieke afweer.', 'Welke uitspraak over de aspecifieke afweer is juist?',
      ['Hij werkt op dezelfde manier tegen allerlei ziekteverwekkers en is meteen actief.', 'Hij werkt alleen tegen een ziekteverwekker waarmee je eerder besmet bent.', 'Hij bestaat uit antistoffen die op één antigeen passen.', 'Hij wordt pas actief na een vaccinatie.'],
      'Aspecifieke afweer (huid, slijm, maagzuur, fagocyten, ontsteking) maakt geen onderscheid tussen ziekteverwekkers en hoeft niets te leren. Specifieke afweer (antistoffen, T-cellen, geheugencellen) richt zich op één antigeen en heeft bij de eerste keer dagen nodig.'),
    M('Traanvocht en speeksel bevatten lysozym, een enzym dat de celwand van bacteriën afbreekt.', 'Tegen welke ziekteverwekkers helpt lysozym niet?',

  /* kaartjes in vakken: elk bak { naam, uit, k:[teksten] }; per = hoeveel kaartjes per bak */
  function sorteer(o){
    var bakken = o.aantalBakken ? H(o.bakken).slice(0, o.aantalBakken) : o.bakken.slice();
    bakken.sort(function(a, b){ return o.bakken.indexOf(a) - o.bakken.indexOf(b); });
    var kaarten = [], vakken = [], sl = [], uit = [];
    bakken.forEach(function(b){
      var bi = o.bakken.indexOf(b), n = Array.isArray(o.per) ? tussen(o.per[0], o.per[1]) : (o.per || 1);
      var gekozen = H(b.k.map(function(t, i){ return { t:t, i:i }; })).slice(0, n), ids = [];
      gekozen.forEach(function(c){ var id = 'k' + bi + '_' + c.i; ids.push(id); sl.push(id); kaarten.push({ id:id, tekst:c.t }); });
      vakken.push({ id:'v' + bi, naam:b.naam, uit:b.uit, hoort:ids });
      uit.push('<b>' + b.naam + '</b>: ' + gekozen.map(function(c){ return c.t; }).join('; '));
    });
    return Object.assign(basis(o.deel), {
      vorm:'sleep', sleutel:o.sleutel + ':' + sl.sort().join(','), vraag:o.vraag, opdracht:o.opdracht || '', beeld:o.beeld || '',
      kaarten:kaarten, vakken:vakken,
      uitleg:(o.uitleg ? o.uitleg + '<br>' : '') + uit.join('<br>'),
      antwoordTekst:uit.map(kaal).join('. ')
    });
  }
  /* stappen op volgorde: n van de stappen, in de goede volgorde */
  function volgorde(o){
    var idx = H(o.stappen.map(function(x, i){ return i; })).slice(0, o.n || o.stappen.length).sort(function(a, b){ return a - b; });
    var kaarten = idx.map(function(i){ return { id:'s' + i, tekst:o.stappen[i] }; });
    return Object.assign(basis(o.deel), {
      vorm:'sleep', stapLijst:true, sleutel:o.sleutel + ':' + idx.join(''), vraag:o.vraag, opdracht:o.opdracht || 'Zet de stappen op volgorde: de eerste stap bovenaan.', beeld:o.beeld || '',
      kaarten:kaarten, vakken:idx.map(function(i){ return { id:'p' + i, max:1, hoort:['s' + i] }; }),
      sleepuit:'Sleep elke stap naar zijn plek. Op een telefoon: tik een stap aan en dan het vak.',
      uitleg:(o.uitleg ? o.uitleg + '<br>' : '') + idx.map(function(i, k){ return (k + 1) + '. ' + o.stappen[i]; }).join('<br>'),
      antwoordTekst:idx.map(function(i, k){ return (k + 1) + '. ' + o.stappen[i]; }).join(' ')
    });
  }

  /* ---------- de grafiek van de hoeveelheid antistoffen ---------- */
  function antiGrafiek(g){

    for (x = 0; x <= g.xmax; x += 5) s += '<line class="raster" x1="' + X(x) + '" y1="' + T + '" x2="' + X(x) + '" y2="' + Y(0) + '"/>';
    for (y = 0; y <= g.ymax; y += 10) s += '<line class="raster" x1="' + L + '" y1="' + Y(y) + '" x2="' + X(g.xmax) + '" y2="' + Y(y) + '"/>';
    s += '<line class="as" x1="' + L + '" y1="' + Y(0) + '" x2="' + (X(g.xmax) + 4) + '" y2="' + Y(0) + '"/><line class="as" x1="' + L + '" y1="' + (T - 6) + '" x2="' + L + '" y2="' + Y(0) + '"/>';
    for (x = 0; x <= g.xmax; x += 10) s += '<text x="' + X(x) + '" y="' + (Y(0) + 17) + '" text-anchor="middle">' + x + '</text>';
    for (y = 0; y <= g.ymax; y += (g.ymax > 60 ? 20 : 10)) s += '<text x="' + (L - 6) + '" y="' + (Y(y) + 4.5) + '" text-anchor="end">' + y + '</text>';
    s += '<text class="kop" x="' + X(g.xmax) + '" y="' + (Hh - 6) + '" text-anchor="end">tijd (dagen)</text>';
    s += '<text class="kop" x="' + (L + 4) + '" y="' + (T - 14) + '">antistoffen (eenheden)</text>';
    /* de besmettingen: stippellijnen met een label */
    [[0, g.l1], [g.t2, g.l2]].forEach(function(m, i){ s += '<line class="mark" x1="' + X(m[0]) + '" y1="' + (T + 4) + '" x2="' + X(m[0]) + '" y2="' + Y(0) + '"/><text class="marktekst" x="' + (X(m[0]) + 4) + '" y="' + (T + 14 + i * 0) + '">' + m[1] + '</text>'; });
