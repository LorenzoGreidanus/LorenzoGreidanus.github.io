<style>
/* De bronnen: een kader met kop, het diagram of de tabel, en eronder waar de cijfers vandaan komen.
   Alles leest zijn kleuren uit de tokens van vakspel.css, zodat de donkere stand meekantelt. */
.bl-bron{width:100%;max-width:460px;margin:0 auto;text-align:left;background:var(--kaart);border:1.5px solid var(--rand2);border-radius:14px;padding:12px 14px 10px}
.bl-bron figcaption{font-weight:700;font-size:1rem;line-height:1.35;color:var(--ink)}
.bl-bron .bl-nr{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:1px}
.bl-sub{font-size:.84rem;color:var(--muted);margin:2px 0 8px;line-height:1.4}
.bl-noot{font-size:.8rem;color:var(--ink);margin:6px 0 0;line-height:1.4}
.bl-her{font-size:.76rem;color:var(--muted);font-style:italic;margin:6px 0 0;line-height:1.35}
.bl-twee{display:grid;gap:12px;width:100%;max-width:940px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.bl-twee{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.bl-svg{width:100%;height:auto;display:block;font-family:inherit;margin-top:4px}
.bl-svg text{fill:var(--muted);font-size:13px;font-weight:600}
.bl-svg text.leg{fill:var(--ink)}
.bl-svg text.klein{font-size:11.5px}
.bl-svg text.waarde{fill:var(--ink);font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--kaart);stroke-width:4px;stroke-linejoin:round}
.bl-svg .as{stroke:var(--ink);stroke-width:1.5}
.bl-svg .raster{stroke:var(--rand2);stroke-width:1}
.beeld .bl-tab{border-collapse:collapse;width:100%;font-size:.92rem;margin-top:2px}
.beeld .bl-tab th,.beeld .bl-tab td{padding:6px 8px;min-width:0;border:1px solid var(--rand2);line-height:1.3}
.beeld .bl-tab td{text-align:right;font-variant-numeric:tabular-nums;background:var(--kaart)}
.beeld .bl-tab thead th{text-align:right;background:var(--kaart2);font-weight:700}
.beeld .bl-tab thead th:first-child{text-align:left}
.beeld .bl-tab tbody th{text-align:left;font-weight:600;background:var(--kaart2)}
.beeld .bl-tab tr.som th,.beeld .bl-tab tr.som td{font-weight:700;border-top:2px solid var(--ink)}
.beeld .bl-tab td.gat{color:var(--hand);font-weight:800}
/* de uitspraak die je controleert */
.bl-uit{display:block;max-width:62ch;margin:8px auto 0;padding:9px 14px;border-left:4px solid var(--spelkleur);background:var(--kaart2);border-radius:0 12px 12px 0;font-weight:600;font-size:1rem;line-height:1.5}
@media(max-width:560px){.bl-bron{padding:10px 10px 8px}.beeld .bl-tab{font-size:.84rem}.beeld .bl-tab th,.beeld .bl-tab td{padding:5px 6px}}
body.groot .beeld .bl-tab{font-size:1.05rem}
/* op het werkblad (zonder vakspel.css) de tokens die de bronnen gebruiken, in de lichte tinten */
.blad .bl-bron,.blad .bl-uit{--hand:#D9522F;--spelkleur:#EA9836}
</style>

<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function tussen(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function rond(x, d){ var m = Math.pow(10, d || 0); return Math.round(x * m + (x >= 0 ? 1e-7 : -1e-7)) / m; }
  function opKorrel(x, k){ return rond(Math.round(x / k) * k, 4); }
  function som(a){ return a.reduce(function(s, x){ return s + x; }, 0); }
  function cap(t){ t = String(t); return t.charAt(0).toUpperCase() + t.slice(1); }
  /* een getal op zijn Nederlands: punt tussen de duizendtallen, komma voor de decimalen */
  function nl(x, d){
    var neg = x < 0; x = Math.abs(x);
    var s = d != null ? x.toFixed(d) : String(rond(x, 4));
    var p = s.split('.'); if (p[0].length > 3) p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '-' : '') + p.join(',');
  }
  /* bedragen in euro met centen als het geen heel getal is */
  function geld(x){ return x === Math.round(x) ? nl(x) : nl(x, 2); }
  function procent(x){ return nl(x) + '%'; }
  /* een invulveld; een heel getal vanaf 1000 mag met of zonder punten */
  function veld(label, w, eenheid, tol){
    w = rond(w, 4); if (label === eenheid) label = 'antwoord';
    if (Math.abs(w) >= 1000 && w === Math.round(w)) return { label:label, antwoord:[String(w), nl(w)], type:'tekst', eenheid:eenheid, toon:nl(w) + (eenheid ? ' ' + eenheid : ''), breed:true };
    return { label:label, antwoord:w, tol:tol, eenheid:eenheid, toon:nl(w) + (eenheid ? ' ' + eenheid : '') };
  }
  function euro(label, w, tol){ var v = veld(label, w, '', tol); v.voor = '€'; v.toon = '€ ' + geld(rond(w, 2)); return v; }
  var TOL0 = 0.51, TOL1 = 0.051, TOL2 = 0.0051;
  var NIV = { bb:1, kgt:2, hv:3 };
  function voor(lijst, niveau){ return lijst.filter(function(t){ return t.niv.indexOf(niveau) >= 0; }); }
  function her(t){ return 'bron: verzonnen voor deze oefening, ' + (t || 'naar CBS-cijfers'); }
  var KLEUR = ['var(--nadruk)', 'var(--hand)', 'var(--amber)', 'var(--goed)', 'var(--muted)'];
  var DAGNAAM = { ma:'maandag', di:'dinsdag', wo:'woensdag', 'do':'donderdag', vr:'vrijdag', za:'zaterdag', zo:'zondag' };
  var DAGEN = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
  function jaren(a, b, st){ var r = [], j; for (j = a; j <= b; j += (st || 1)) r.push(String(j)); return r; }
  var teller = 0;

  /* ---------- de bron om een diagram of tabel heen ---------- */
  function bron(nr, titel, sub, inhoud, noot, herkomst){
    return '<figure class="bl-bron"><figcaption>' + (nr ? '<span class="bl-nr">bron ' + nr + '</span>' : '') + S(titel) + '</figcaption>' +
      (sub ? '<p class="bl-sub">' + S(sub) + '</p>' : '') + inhoud + (noot ? '<p class="bl-noot">' + noot + '</p>' : '') +
      '<p class="bl-her">' + S(herkomst || her()) + '</p></figure>';
  }
  function twee(a, b){ return '<div class="bl-twee">' + a + b + '</div>'; }
  function tabelHtml(kop, rijen){
    return '<table class="bl-tab"><thead><tr>' + kop.map(function(k){ return '<th scope="col">' + k + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rijen.map(function(r){ return '<tr' + (r.som ? ' class="som"' : '') + '><th scope="row">' + r[0] + '</th>' + r.slice(1).map(function(c){ return c === '?' ? '<td class="gat">?</td>' : '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
  }
  function svg(W, Hh, s, aria){ return '<svg class="bl-svg" viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="' + S(aria || 'diagram') + '">' + s + '</svg>'; }
  /* de as: van min tot een mooi maximum, met een getal bij elke, elke tweede of elke vijfde lijn */
  function asBereik(min, maxW, grid){
    var n = Math.ceil((maxW - min) / grid + 0.5), elke = n > 16 ? 5 : n > 8 ? 2 : 1;
    n = Math.ceil(n / elke) * elke;
    return { min:min, max:rond(min + n * grid, 6), elke:elke, grid:grid, n:n };
  }
  function rasterwaarden(b){ var r = [], i; for (i = 0; i <= b.n; i++) r.push(rond(b.min + i * b.grid, 6)); return r; }

  /* staafdiagram: staand (jaren, dagen) of liggend (namen) */
  function staafSvg(o){
    var n = o.labels.length, s = '', b = o.bereik, dec = o.dec, kleur = o.kleur || KLEUR[0];
    if (o.liggend){
      var lang = Math.max.apply(null, o.labels.map(function(l){ return String(l).length; }));
      var L = Math.min(150, Math.round(lang * 8.2 + 14)), W = 360, R = o.waarden ? 46 : 16, T = 8, rij = 30, ph = n * rij, Hh = T + ph + 42, pw = W - L - R;
      var X = function(v){ return rond(L + pw * (v - b.min) / (b.max - b.min), 1); };
      /* de getallen onder de liggende as niet tegen elkaar aan (800 1.0001.200): zo nodig minder getallen */
      var lw = nl(b.max, dec).length * 8 + 8, stapL = b.elke;
      while (pw * stapL / b.n < lw && stapL < b.n) stapL += b.elke;
      rasterwaarden(b).forEach(function(t, i){
        s += '<line class="raster" x1="' + X(t) + '" y1="' + T + '" x2="' + X(t) + '" y2="' + (T + ph) + '"/>';
        if (i % stapL === 0) s += '<text x="' + X(t) + '" y="' + (T + ph + 16) + '" text-anchor="middle">' + nl(t, dec) + '</text>';
      });
      o.labels.forEach(function(l, i){
        var y = T + i * rij, v = o.w[i];
        s += '<text class="leg" x="' + (L - 8) + '" y="' + (y + rij / 2 + 4) + '" text-anchor="end">' + S(l) + '</text>';
        s += '<rect x="' + L + '" y="' + (y + 6) + '" width="' + Math.max(0, rond(X(v) - L, 1)) + '" height="' + (rij - 12) + '" fill="' + kleur + '"/>';
        if (o.waarden) s += '<text class="waarde" x="' + (X(v) + 5) + '" y="' + (y + rij / 2 + 4) + '">' + nl(v, dec) + '</text>';
      });
      s += '<line class="as" x1="' + L + '" y1="' + (T - 2) + '" x2="' + L + '" y2="' + (T + ph) + '"/>';
      s += '<text x="' + (W - R) + '" y="' + (Hh - 6) + '" text-anchor="end">' + S(o.as) + '</text>';
      return svg(W, Hh, s, o.aria);
    }
    var W2 = 360, L2 = 48, R2 = 10, T2 = 28, ph2 = 180, Hh2 = T2 + ph2 + 30, pw2 = W2 - L2 - R2, slot = pw2 / n, bw = Math.min(40, slot * 0.62);
    var Y = function(v){ return rond(T2 + ph2 * (1 - (v - b.min) / (b.max - b.min)), 1); };
    s += '<text x="4" y="14">' + S(o.as) + '</text>';
    rasterwaarden(b).forEach(function(t, i){
      s += '<line class="raster" x1="' + L2 + '" y1="' + Y(t) + '" x2="' + (W2 - R2) + '" y2="' + Y(t) + '"/>';
      if (i % b.elke === 0) s += '<text x="' + (L2 - 6) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + nl(t, dec) + '</text>';
    });
    o.labels.forEach(function(l, i){
      var x = rond(L2 + slot * i + (slot - bw) / 2, 1), v = o.w[i];
      s += '<rect x="' + x + '" y="' + Y(v) + '" width="' + rond(bw, 1) + '" height="' + Math.max(0, rond(Y(b.min) - Y(v), 1)) + '" fill="' + kleur + '"/>';
      if (o.waarden) s += '<text class="waarde" x="' + rond(x + bw / 2, 1) + '" y="' + (Y(v) - 5) + '" text-anchor="middle">' + nl(v, dec) + '</text>';
      s += '<text class="leg' + (n > 7 ? ' klein' : '') + '" x="' + rond(L2 + slot * i + slot / 2, 1) + '" y="' + (T2 + ph2 + 18) + '" text-anchor="middle">' + S(l) + '</text>';
    });
    s += '<line class="as" x1="' + L2 + '" y1="' + (T2 - 6) + '" x2="' + L2 + '" y2="' + (T2 + ph2) + '"/><line class="as" x1="' + L2 + '" y1="' + (T2 + ph2) + '" x2="' + (W2 - R2) + '" y2="' + (T2 + ph2) + '"/>';
    return svg(W2, Hh2, s, o.aria);
  }
  /* gestapeld staafdiagram: twee delen op elkaar */
  function stapelSvg(o){
    var n = o.xs.length, b = o.bereik, W = 360, L = 48, R = 10, T = 50, ph = 180, Hh = T + ph + 30, pw = W - L - R, slot = pw / n, bw = Math.min(42, slot * 0.6), s = '';
    var Y = function(v){ return rond(T + ph * (1 - (v - b.min) / (b.max - b.min)), 1); };
    o.delen.forEach(function(d, j){ s += '<rect x="' + (4 + j * 168) + '" y="5" width="13" height="13" fill="' + KLEUR[j] + '"/><text class="leg" x="' + (23 + j * 168) + '" y="16">' + S(d.naam) + '</text>'; });
    s += '<text x="4" y="' + (T - 12) + '">' + S(o.as) + '</text>';
    rasterwaarden(b).forEach(function(t, i){
      s += '<line class="raster" x1="' + L + '" y1="' + Y(t) + '" x2="' + (W - R) + '" y2="' + Y(t) + '"/>';
      if (i % b.elke === 0) s += '<text x="' + (L - 6) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + nl(t) + '</text>';
    });
    o.xs.forEach(function(x, i){
      var bodem = 0, xx = rond(L + slot * i + (slot - bw) / 2, 1);
      o.delen.forEach(function(d, j){
        var v = d.w[i];
        s += '<rect x="' + xx + '" y="' + Y(bodem + v) + '" width="' + rond(bw, 1) + '" height="' + rond(Y(bodem) - Y(bodem + v), 1) + '" fill="' + KLEUR[j] + '" stroke="var(--kaart)" stroke-width="1.5"/>';
        if (o.waarden) s += '<text class="waarde" x="' + rond(xx + bw / 2, 1) + '" y="' + rond((Y(bodem) + Y(bodem + v)) / 2 + 4, 1) + '" text-anchor="middle">' + nl(v) + '</text>';
        bodem += v;
      });
      s += '<text class="leg" x="' + rond(L + slot * i + slot / 2, 1) + '" y="' + (T + ph + 18) + '" text-anchor="middle">' + S(x) + '</text>';
    });
    s += '<line class="as" x1="' + L + '" y1="' + (T - 6) + '" x2="' + L + '" y2="' + (T + ph) + '"/><line class="as" x1="' + L + '" y1="' + (T + ph) + '" x2="' + (W - R) + '" y2="' + (T + ph) + '"/>';
    return svg(W, Hh, s, o.aria);
  }
  /* lijndiagram met een of twee lijnen; de tweede gestreept en met vierkantjes */
  function lijnSvg(o){
    var b = o.bereik, n = o.xs.length, tw = o.lijnen.length > 1, W = 360, L = 48, R = 14, T = tw ? 50 : 30, ph = 190, Hh = T + ph + 30, pw = W - L - R, s = '';
    var X = function(i){ return rond(L + 14 + i * (pw - 28) / (n - 1), 1); };
    var Y = function(v){ return rond(T + ph * (1 - (v - b.min) / (b.max - b.min)), 1); };
    if (tw) o.lijnen.forEach(function(l, j){
      var x0 = 4 + j * 168;
      s += '<line x1="' + x0 + '" y1="12" x2="' + (x0 + 26) + '" y2="12" stroke="' + KLEUR[j] + '" stroke-width="3"' + (j ? ' stroke-dasharray="6 4"' : '') + '/>' + punt(x0 + 13, 12, j) + '<text class="leg" x="' + (x0 + 33) + '" y="16">' + S(l.naam) + '</text>';
    });
    s += '<text x="4" y="' + (T - 14) + '">' + S(o.as) + '</text>';
    rasterwaarden(b).forEach(function(t, i){
      s += '<line class="raster" x1="' + L + '" y1="' + Y(t) + '" x2="' + (W - R) + '" y2="' + Y(t) + '"/>';
      if (i % b.elke === 0) s += '<text x="' + (L - 6) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + nl(t, o.dec) + '</text>';
    });
    o.xs.forEach(function(x, i){
      s += '<line class="raster" x1="' + X(i) + '" y1="' + T + '" x2="' + X(i) + '" y2="' + (T + ph) + '" stroke-dasharray="2 4"/>';
      s += '<text class="leg' + (n > 7 ? ' klein' : '') + '" x="' + X(i) + '" y="' + (T + ph + 18) + '" text-anchor="middle">' + S(x) + '</text>';
    });
    s += '<line class="as" x1="' + L + '" y1="' + (T - 6) + '" x2="' + L + '" y2="' + (T + ph) + '"/><line class="as" x1="' + L + '" y1="' + (T + ph) + '" x2="' + (W - R) + '" y2="' + (T + ph) + '"/>';
    o.lijnen.forEach(function(l, j){
      s += '<polyline points="' + l.w.map(function(v, i){ return X(i) + ',' + Y(v); }).join(' ') + '" fill="none" stroke="' + KLEUR[j] + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"' + (j ? ' stroke-dasharray="6 4"' : '') + '/>';
      s += l.w.map(function(v, i){ return punt(X(i), Y(v), j); }).join('');
    });
    return svg(W, Hh, s, o.aria);
  }
  function punt(x, y, j){ return j ? '<rect x="' + rond(x - 4, 1) + '" y="' + rond(y - 4, 1) + '" width="8" height="8" fill="' + KLEUR[j] + '"/>' : '<circle cx="' + x + '" cy="' + y + '" r="4.2" fill="' + KLEUR[j] + '"/>'; }
  /* cirkeldiagram met de procenten in de legenda */
  function cirkelSvg(o){
    var n = o.namen.length, W = 360, Hh = Math.max(180, n * 26 + 24), cx = 86, cy = Hh / 2, r = 78, s = '', hoek = -Math.PI / 2;
    o.pct.forEach(function(p, i){
      var a2 = hoek + p / 100 * 2 * Math.PI, groot = p > 50 ? 1 : 0;
      s += '<path d="M' + cx + ' ' + cy + 'L' + rond(cx + r * Math.cos(hoek), 2) + ' ' + rond(cy + r * Math.sin(hoek), 2) + 'A' + r + ' ' + r + ' 0 ' + groot + ' 1 ' + rond(cx + r * Math.cos(a2), 2) + ' ' + rond(cy + r * Math.sin(a2), 2) + 'Z" fill="' + KLEUR[i] + '" stroke="var(--kaart)" stroke-width="2"/>';
      hoek = a2;
    });
    var y0 = cy - n * 13 + 13;
    o.namen.forEach(function(nm, i){
      var y = y0 + i * 26;
      s += '<rect x="180" y="' + (y - 7) + '" width="14" height="14" rx="2" fill="' + KLEUR[i] + '"/><text class="leg" x="200" y="' + (y + 4) + '">' + S(nm) + '</text><text class="leg" x="356" y="' + (y + 4) + '" text-anchor="end">' + procent(o.pct[i]) + '</text>';
    });
    return svg(W, Hh, s, o.aria);
  }
  /* beeldgrafiek: elk poppetje is een vast aantal, een half poppetje de helft */
  var POP = '<circle cx="11" cy="5" r="4.3"/><path d="M2.5 21.5v-3.2a8.5 8.5 0 0 1 17 0v3.2z"/>';
  function beeldSvg(o){
    var n = o.namen.length, lang = Math.max.apply(null, o.namen.map(function(l){ return String(l).length; })), L = Math.min(140, Math.round(lang * 8.2 + 14));
    var W = 360, rij = 32, T = 6, Hh = T + n * rij + 40, id = 'blh' + (++teller), s = '<defs><clipPath id="' + id + '"><rect x="0" y="0" width="11" height="23"/></clipPath></defs>';
    o.namen.forEach(function(nm, i){
      var y = T + i * rij, aantal = o.w[i] / o.per, heel = Math.floor(aantal + 1e-9), half = aantal - heel > 0.25, k;
      s += '<text class="leg" x="' + (L - 8) + '" y="' + (y + rij / 2 + 4) + '" text-anchor="end">' + S(nm) + '</text>';
      for (k = 0; k < heel; k++) s += '<g transform="translate(' + (L + k * 25) + ' ' + (y + 5) + ')" fill="' + KLEUR[0] + '">' + POP + '</g>';
      if (half) s += '<g transform="translate(' + (L + heel * 25) + ' ' + (y + 5) + ')" fill="' + KLEUR[0] + '"><g clip-path="url(#' + id + ')">' + POP + '</g></g>';
