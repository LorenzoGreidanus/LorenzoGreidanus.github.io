          { n:'v', v:'Leg uit waarom deze bron in het Frankrijk van 1748 als bedreigend kon worden gezien.', o:['De koning had als absolute vorst alle machten; zonder scheiding is er geen vrijheid.', 'Montesquieu riep in deze tekst op tot een gewapende opstand tegen de koning.', 'Montesquieu wilde de adel afschaffen en in Frankrijk een republiek stichten.', 'Montesquieu stelde dat godsdienst altijd een zaak van de staat en de vorst moest blijven.'], u:'De bron valt een absolute vorst niet met wapens aan, maar met een redenering: wie alle macht heeft, maakt vrijheid onmogelijk. Daarom hielden vorsten zulke publicaties angstvallig in de gaten.' },

  var KA_MAAK = { voorbeeld:kVoorbeeld, tijdvak:kTijdvak, sleep:kSleep, volgorde:kVolgorde };
  function aspecten(niv){
    var o = KA_MAAK[kies(KA_SOORTEN[niv] || KA_SOORTEN.hv)](niv);
    o.onderdeel = 'contextenvwo: ka'; o.onderdeelNaam = 'kenmerkende aspecten';

  }

  /* ---------- bronvragen ---------- */
  function bronvraag(niv){
    var k = letter(niv), paren = [];
    BR.forEach(function(b){ b.q.forEach(function(q, i){ if (q.n.indexOf(k) >= 0) paren.push([b, q, i]); }); });
    var p = kies(paren), b = p[0], q = p[1], o;
    if (q.a) o = { vorm:'invul', vraag:q.v, opdracht:'Vul het begrip in.', velden:[{ label:q.label || 'antwoord', antwoord:q.a, type:'tekst', breed:true, toon:q.a[0] }], uitleg:q.u, antwoordTekst:q.a[0] };
    else o = mkOpgave(q, { vraag:q.v });
    o.beeld = bronHtml(b); o.sleutel = 'br' + b.id + p[2];
    o.opdracht = o.opdracht || (niv === 'vwo' ? 'Lees eerst wie de maker is, wanneer en waarom de bron gemaakt is.' : 'Lees eerst wie de bron gemaakt heeft en wanneer.');
    o.onderdeel = 'contextenvwo: bron'; o.onderdeelNaam = 'bronvragen';
    return o;
  }

  VAKSPEL.maak({

      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' },
        { id:'steden', naam:'Steden en burgers', uit:'De Lage Landen van 1050 tot 1700: van Atrecht en Brugge via de Opstand naar de Gouden Eeuw.' },
        { id:'verlichting', naam:'Verlichting', uit:'Van 1650 tot 1900: verlichte denkers, de Amerikaanse en Franse revoluties en de politieke stromingen van de 19e eeuw.' },
        { id:'china', naam:'China', uit:'Van 1842 tot 2001: de opiumoorlogen, de republiek, de Volksrepubliek en de weg naar grootmacht.' },

        { id:'ka', naam:'kenmerkende aspecten koppelen', uit:'Voorbeelden bij de 49 kenmerkende aspecten van alle tien tijdvakken.' },
