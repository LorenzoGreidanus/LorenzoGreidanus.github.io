<script>
(function(){
  'use strict';
  /* op een werkblad (?werkblad=1) staan de opdrachten zoals ze met een pen kunnen: geen slepen of tikken */
  var WB = /[?&]werkblad=1/.test(location.search);
  var SLEEPOPDR = WB ? '' : 'Sleep elk kaartje naar zijn plek, of tik een kaartje en dan het vak.';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function tussen(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function rond(x, n){ var f = Math.pow(10, n || 0); return Math.round(x * f) / f; }
  /* een getal met een komma (zo kun je het precies zo intypen) */
  function net(x, n){ return String(rond(x, n === undefined ? 2 : n)).replace('.', ','); }
  function niv(n){ return n === 'vwo' ? 'v' : 'h'; }
  function past(it, n){ return it.n.indexOf(niv(n)) >= 0; }
  function cap(t){ return t.charAt(0).toUpperCase() + t.slice(1); }
  /* een item uit een lijst; op vwo vaker een vraag die alleen bij vwo hoort */
  function kiesItem(lijst, n){
    var eigen = lijst.filter(function(it){ return it.n === 'v'; });
    if (n === 'vwo' && eigen.length && Math.random() < .65) return kies(eigen);
    return kies(lijst.filter(function(it){ return past(it, n); }));
  }
  function bron(h){ return '<div class="bron">' + h + '</div>'; }

  var DEEL = {
    enzymen:{ od:'stofwisseling: enzymen', naam:'enzymen' },
    fotosynthese:{ od:'stofwisseling: fotosynthese', naam:'fotosynthese' },
    dissimilatie:{ od:'stofwisseling: dissimilatie', naam:'dissimilatie en ATP' },
    kringloop:{ od:'stofwisseling: kringloop', naam:'assimilatie en koolstofkringloop' }
  };
  function basis(deel, sleutel){ return { onderdeel:DEEL[deel].od, onderdeelNaam:DEEL[deel].naam, sleutel:sleutel }; }

  /* ---------- opgaven uit een lijst ----------
     Een item: { n:'hv' (havo en vwo), 'h' of 'v', k:sleutel, v:vraag, o:[goed, fout, fout, fout], u:uitleg }
     of met a (een open antwoord: getal of lijst met goede woorden) in plaats van o.
     jo: een juist/onjuist-vraag; dan staan de keuzes in vaste volgorde en is g het goede antwoord. */
  function uitLijst(deel, it){
    var o = Object.assign(basis(deel, it.k), { vraag:it.v, beeld:it.b || '', uitleg:it.u });
    if (it.a !== undefined){
      var num = typeof it.a === 'number';
      return Object.assign(o, { vorm:'invul', opdracht:it.op || (num ? 'Schrijf het getal op.' : 'Schrijf het begrip op.'),
        velden:[{ label:it.l || (num ? 'antwoord' : 'begrip'), antwoord:it.a, tol:it.tol || 0.001, eenheid:it.e || '', type:num ? undefined : 'tekst', breed:!num }],
        antwoordTekst:num ? net(it.a) + (it.e ? ' ' + it.e : '') : it.a[0] });
    }
    if (it.jo) return Object.assign(o, { vorm:'meerkeuze', opdracht:'Is de bewering juist of onjuist? Kies het antwoord met de goede reden.', opties:it.o, goed:it.g, vasteVolgorde:true, antwoordTekst:it.o[it.g] });
    return Object.assign(o, { vorm:'meerkeuze', opdracht:it.op || '', opties:it.o, goed:0, antwoordTekst:it.o[0] });
  }
  /* een juist/onjuist-vraag: twee keer juist, twee keer onjuist, met elk een reden; g is het goede */
  function jo(n, k, bewering, juist1, juist2, onjuist1, onjuist2, g, u){
    return { n:n, k:k, jo:true, v:'Bewering: <i>' + bewering + '</i>', o:['Juist, want ' + juist1, 'Juist, want ' + juist2, 'Onjuist, want ' + onjuist1, 'Onjuist, want ' + onjuist2], g:g, u:u };
  }

  /* ================= tekenen ================= */
  /* een assenstelsel: o = { xmin, xmax, xstap, xlab, ymin, ymax, ystap, ylab, xnaam, ynaam, hoog, titel } */
  function assen(o){
    var W = 400, Hh = o.hoog || 260, L = 52, R = 16, T = 42, B = 46;
    var sx = (W - L - R) / (o.xmax - o.xmin), sy = (Hh - T - B) / (o.ymax - o.ymin);
    function X(x){ return rond(L + (x - o.xmin) * sx, 1); }
    function Y(y){ return rond(T + (o.ymax - y) * sy, 1); }
    var s = '', x, y, i, n;
    s += '<g stroke="var(--rand2)" stroke-width="1">';
    n = Math.round((o.xmax - o.xmin) / o.xstap);
    for (i = 0; i <= n; i++){ x = o.xmin + i * o.xstap; s += '<line x1="' + X(x) + '" y1="' + T + '" x2="' + X(x) + '" y2="' + (Hh - B) + '"/>'; }
    n = Math.round((o.ymax - o.ymin) / o.ystap);
    for (i = 0; i <= n; i++){ y = o.ymin + i * o.ystap; s += '<line x1="' + L + '" y1="' + Y(y) + '" x2="' + (W - R) + '" y2="' + Y(y) + '"/>'; }
    var ybasis = o.ymin < 0 && o.ymax > 0 ? Y(0) : Hh - B;
    s += '</g><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="' + L + '" y1="' + ybasis + '" x2="' + (W - R) + '" y2="' + ybasis + '"/><line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (Hh - B) + '"/></g>';
    s += '<g font-size="14" fill="var(--muted)">';
    n = Math.floor((o.xmax - o.xmin) / o.xlab + 1e-9);
    for (i = 0; i <= n; i++){ x = o.xmin + i * o.xlab; s += '<text x="' + X(x) + '" y="' + (Hh - B + 18) + '" text-anchor="middle">' + (o.xtekst ? o.xtekst(x) : net(x)) + '</text>'; }
    n = Math.floor((o.ymax - o.ymin) / o.ylab + 1e-9);
    for (i = 0; i <= n; i++){ y = o.ymin + i * o.ylab; s += '<text x="' + (L - 6) + '" y="' + (Y(y) + 5) + '" text-anchor="end">' + (y < 0 ? '−' + net(-y) : net(y)) + '</text>'; }
    s += '</g><g font-size="14" font-weight="600" fill="currentColor">';
    s += '<text x="' + (W - R) + '" y="' + (Hh - 8) + '" text-anchor="end">' + S(o.xnaam) + '</text>';
    s += '<text x="' + (L - 44) + '" y="' + (T - 22) + '">' + S(o.ynaam) + '</text>';
    s += '</g>';
    return { X:X, Y:Y, kop:'<svg class="sgr" viewBox="0 0 ' + W + ' ' + Hh + '" overflow="visible" font-family="inherit" role="img" aria-label="' + S(o.aria || 'grafiek') + '">' + s, staart:'</svg>' };
  }
  /* een vloeiende lijn door punten (monotone kubische interpolatie): geen bobbels die niet in de meting zitten */
  function glad(p, per){
    per = per || 16;
    var n = p.length, d = [], m = [], i, uit = [];
    for (i = 0; i < n - 1; i++) d.push((p[i + 1][1] - p[i][1]) / (p[i + 1][0] - p[i][0]));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (i = 0; i < n - 1; i++){
      if (d[i] === 0){ m[i] = 0; m[i + 1] = 0; continue; }
      var a = m[i] / d[i], b = m[i + 1] / d[i], h = a * a + b * b;
      if (h > 9){ var t = 3 / Math.sqrt(h); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
    }
    for (i = 0; i < n - 1; i++){
      var x0 = p[i][0], x1 = p[i + 1][0], y0 = p[i][1], y1 = p[i + 1][1], hh = x1 - x0;
      for (var k = 0; k < per; k++){
        var s = k / per, s2 = s * s, s3 = s2 * s;
        uit.push([x0 + s * hh, (2 * s3 - 3 * s2 + 1) * y0 + (s3 - 2 * s2 + s) * hh * m[i] + (-2 * s3 + 3 * s2) * y1 + (s3 - s2) * hh * m[i + 1]]);
      }
    }
    uit.push(p[n - 1]);
    return uit;
  }
  function lijn(a, punten, kleur, streep){
    return '<polyline points="' + punten.map(function(p){ return a.X(p[0]) + ',' + a.Y(p[1]); }).join(' ') + '" fill="none" stroke="' + kleur + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"' + (streep ? ' stroke-dasharray="7 5"' : '') + '/>';
  }
  function tekst(a, x, y, t, kleur, anker, dx, dy){
    return '<text x="' + rond(a.X(x) + (dx || 0), 1) + '" y="' + rond(a.Y(y) + (dy || 0), 1) + '" font-size="14" font-weight="700" fill="' + (kleur || 'currentColor') + '" text-anchor="' + (anker || 'start') + '">' + t + '</text>';
  }
  function stip(a, x, y, letter, kleur, dx, dy){
    return '<circle cx="' + a.X(x) + '" cy="' + a.Y(y) + '" r="5" fill="' + (kleur || 'currentColor') + '"/>' + (letter ? tekst(a, x, y, letter, 'currentColor', 'middle', dx || 0, dy || -10) : '');
  }
  var L1 = 'var(--nadruk)', L2 = 'var(--lijn2)', L3 = 'var(--lijn3)';


  /* ================= 1. enzymen ================= */
  var ENZ_LIJST = [
    { n:'hv', k:'ek1', v:'Wat doet een enzym met de activeringsenergie van een reactie?', o:[
      'Het verlaagt de activeringsenergie, zodat de reactie bij lichaamstemperatuur snel genoeg verloopt.',
      'Het levert de activeringsenergie, zodat de reactie kan beginnen.',
      'Het verhoogt de activeringsenergie, zodat de reactie niet te snel gaat.',
      'Het verandert de hoeveelheid energie die bij de reactie in totaal vrijkomt.'],
      u:'Een enzym is een biokatalysator: het verlaagt de activeringsenergie. Het levert zelf geen energie, en hoeveel energie de reactie in totaal oplevert of kost, verandert niet.' },
    { n:'hv', k:'ek2', v:'Wat is er na afloop van de reactie met het enzym gebeurd?', o:[
      'Niets: het is onveranderd en kan opnieuw een substraatmolecuul binden.',
      'Het is opgebruikt en moet opnieuw worden gemaakt.',
      'Het is omgezet in een van de producten.',
      'Het is gedenatureerd door de reactie.'],
      u:'Een katalysator wordt bij de reactie niet verbruikt. Na het loslaten van de producten is de actieve plaats weer vrij. Daarom is er van een enzym maar weinig nodig.' },
    { n:'hv', k:'ek3', v:'Amylase breekt zetmeel af, maar geen cellulose, hoewel beide uit glucose-eenheden bestaan. Hoe komt dat?', o:[
      'De bindingen tussen de glucose-eenheden zijn anders, en de actieve plaats past alleen bij de binding in zetmeel.',
      'Cellulose is te groot om door een enzym te worden afgebroken.',
      'Cellulose denatureert het amylase.',
      'Amylase werkt alleen in de mond en cellulose komt pas in de darm.'],
      u:'Enzymen zijn specifiek: het substraat moet in de actieve plaats passen. In zetmeel en cellulose zitten de glucose-eenheden op een andere manier aan elkaar vast; amylase past alleen op de binding in zetmeel.' },
    jo('hv', 'ek4', 'Bij 0 °C is de activiteit van een enzym bijna nul, omdat het enzym dan gedenatureerd is.',
      'bij een lage temperatuur verandert de vorm van de actieve plaats blijvend.', 'het enzym bevriest bij 0 °C.',
      'bij een lage temperatuur bewegen de moleculen langzaam, zodat er weinig botsingen zijn; het enzym zelf is niet beschadigd.', 'enzymen werken bij 0 °C het best.', 2,
      'Bij lage temperatuur bewegen enzym en substraat langzaam en botsen ze zelden. Warm je het weer op, dan werkt het enzym weer normaal. Denatureren (blijvend van vorm veranderen) gebeurt bij een te hoge temperatuur.'),
    { n:'hv', k:'ek5', v:'Speeksel bevat amylase. Met het voedsel komt het in de maag, waar de pH ongeveer 2 is. Wat gebeurt er met de werking van het amylase in de maag?', o:[
      'Die stopt vrijwel, omdat de pH ver van het optimum van amylase ligt.',
      'Die wordt sneller, omdat de maag warmer is dan de mond.',
      'Die blijft gelijk, omdat enzymen bij elke pH even goed werken.',

      u:'Speekselamylase werkt het best bij een pH rond 7. In het zure maagsap verandert de vorm van het enzym en stopt de afbraak van zetmeel. Pas in de dunne darm gaat amylase uit de alvleesklier verder.' },
    { n:'hv', k:'ek6', v:'Lactase splitst melksuiker (lactose) in glucose en galactose. Mensen met lactose-intolerantie maken te weinig lactase. Waarom krijgen zij darmklachten van melk?', o:[
      'Lactose wordt niet gesplitst en komt in de dikke darm, waar bacteriën het vergisten en er gassen ontstaan.',
      'Lactase hoopt zich op in de darm en veroorzaakt een ontsteking.',

      'Melk denatureert de andere enzymen in de darm.'],
      u:'Zonder lactase kan lactose niet worden opgenomen; alleen glucose en galactose gaan door de darmwand. De lactose gaat door naar de dikke darm. Daar vergisten bacteriën het, en dat geeft gas en buikpijn.' },
    { n:'hv', k:'ek7', v:'Een wasmiddel bevat enzymen die vlekken van eiwit en vet afbreken. Op de verpakking staat: was op 30 tot 40 °C. Waarom niet op 90 °C?', o:[
      'Bij 90 °C denatureren de enzymen, zodat ze de vlekken niet meer afbreken.',
      'Bij 90 °C werken de enzymen te snel en beschadigen ze de kleding.',
      'Bij 90 °C lossen de vlekken vanzelf op, dus de enzymen zijn niet nodig.',
      'Bij 90 °C zijn er te weinig botsingen tussen enzym en vlek.'],
      u:'Een hoge temperatuur verandert de ruimtelijke vorm van het enzym blijvend (denaturatie). Dan past het substraat niet meer in de actieve plaats.' },
    { n:'hv', k:'ek8', v:'Hoe heet het deel van een enzym waar het substraat bindt?', a:['actieve plaats', 'actief centrum', 'actieve centrum', 'active site', 'actieve plek'],
      u:'Het substraat bindt in de <b>actieve plaats</b> (ook wel actief centrum). Zo ontstaat het enzym-substraatcomplex.' },
    { n:'hv', k:'ek9', v:'Een eiwit verliest door verhitting blijvend zijn ruimtelijke vorm. Hoe heet dit proces?', a:['denaturatie', 'denatureren', 'denaturering', 'denatureert', 'gedenatureerd'],
      u:'Dat is <b>denaturatie</b>. Het enzym kan daarna geen substraat meer binden, ook niet als het weer afkoelt.' },
    { n:'hv', k:'ek10', v:'Waarom stijgt de activiteit van een enzym als de temperatuur van 10 °C naar 30 °C gaat?', o:[
      'Enzym en substraat bewegen sneller en botsen vaker.',
      'Er worden meer enzymen gemaakt.',
      'De actieve plaats wordt groter.',
      'Het substraat denatureert, waardoor het makkelijker breekt.'],
      u:'Bij een hogere temperatuur bewegen moleculen sneller. Er ontstaan per seconde meer enzym-substraatcomplexen. Dat gaat door tot het optimum; daarboven begint het enzym te denatureren.' },
    { n:'v', k:'ek11', v:'In een reeks reacties A → B → C → D remt stof D het enzym dat A omzet in B. Wat is het effect van deze regeling?', o:[
      'Als er veel D is, wordt er minder D gemaakt: negatieve terugkoppeling.',
      'Als er veel D is, wordt er nog meer D gemaakt: positieve terugkoppeling.',
      'Stof D wordt door het enzym weer omgezet in A.',
      'Stof D denatureert het enzym, zodat de reeks voorgoed stopt.'],
      u:'Dit heet eindproductremming. Het eindproduct remt het eerste enzym van de reeks. Is er genoeg D, dan wordt de aanmaak afgeremd; daalt D, dan gaat de remming eraf. Zo blijft de hoeveelheid D ongeveer gelijk.' },
    { n:'v', k:'ek12', v:'Een remmer bindt aan een enzym op een andere plek dan de actieve plaats. Daardoor verandert de vorm van de actieve plaats. Wat gebeurt er als je veel extra substraat toevoegt?', o:[
      'De maximale reactiesnelheid blijft lager, want het substraat verdringt de remmer niet.',
      'De remming verdwijnt, want het substraat verdringt de remmer uit de actieve plaats.',
      'De reactiesnelheid wordt hoger dan zonder remmer.',

      u:'Dit is een niet-competitieve remmer: hij concurreert niet met het substraat om de actieve plaats. Meer substraat helpt dus niet. Bij een competitieve remmer, die wel in de actieve plaats bindt, verdringt veel substraat de remmer wel.' },
    { n:'v', k:'ek13', v:'Veel enzymen hebben een cofactor nodig, zoals een metaalion. Wat gebeurt er als die cofactor ontbreekt?', o:[

    jo('v', 'ek14', 'Een competitieve remmer verlaagt de maximale reactiesnelheid van een enzym, ook bij een zeer hoge substraatconcentratie.',

      'Een competitieve remmer lijkt op het substraat en bindt in de actieve plaats. Hoe meer substraat, hoe kleiner de kans dat de remmer bindt. Bij een heel hoge substraatconcentratie wordt de maximale snelheid daarom wel gehaald; je hebt er alleen meer substraat voor nodig.'),
    { n:'v', k:'ek15', v:'Waarom verandert de activiteit van een enzym als de pH verandert?', o:[
      'H⁺-ionen veranderen de ladingen in het eiwit, waardoor de vorm van de actieve plaats verandert.',

      'Bij een andere pH wordt het enzym verbruikt.',

  /* --- de lichtcurve: netto zuurstofproductie bij verschillende lichtintensiteit --- */
  var LICHT = [
    { R:5, Lc:5, P:30, y2:20, y3:27 }, { R:5, Lc:5, P:35, y2:20, y3:30 }, { R:10, Lc:10, P:30, y2:20, y3:25 },
    { R:10, Lc:10, P:35, y2:20, y3:30 }, { R:5, Lc:10, P:25, y2:15, y3:20 }, { R:10, Lc:5, P:30, y2:15, y3:25 }
  ];
  function fotoLicht(n){
    var c = kies(LICHT), x2 = c.Lc + 10, x3 = c.Lc + 20;
    var a = assen({ xmin:0, xmax:50, xstap:5, xlab:10, ymin:-10, ymax:40, ystap:5, ylab:10, xnaam:'lichtintensiteit (klux)', ynaam:'netto O₂-productie (ml/uur)', aria:'netto zuurstofproductie van een plant bij verschillende lichtintensiteit' });
    var punten = glad([[0, -c.R], [c.Lc, 0], [x2, c.y2], [x3, c.y3], [c.Lc + 30, c.P], [50, c.P]]);
    var s = kies(['comp', 'bruto', 'donker', 'compbet', 'plateau']);
    var beeld = a.kop + lijn(a, punten, L1) + (s === 'bruto' ? stip(a, x2, c.y2, 'P', L1, -12, -6) : '') + a.staart;
    var intro = 'Bij een waterplant wordt de netto zuurstofproductie gemeten bij verschillende lichtintensiteiten. De temperatuur en de CO<sub>2</sub>-concentratie zijn steeds gelijk.';
    var k = 'fl-' + s + c.R + c.Lc + c.P + c.y2;
    if (s === 'comp') return Object.assign(basis('fotosynthese', k), { vorm:'invul', vraag:intro + ' Bij welke lichtintensiteit is de fotosynthese even groot als de dissimilatie?', opdracht:'Lees de grafiek af.', beeld:beeld,
      velden:[{ label:'lichtintensiteit', antwoord:c.Lc, tol:1.5, eenheid:'klux' }],
      uitleg:'Fotosynthese en dissimilatie zijn even groot waar de netto zuurstofproductie 0 is: bij <b>' + c.Lc + ' klux</b>. Dat heet het compensatiepunt.', antwoordTekst:c.Lc + ' klux' });
    if (s === 'bruto') return Object.assign(basis('fotosynthese', k), { vorm:'invul', vraag:intro + ' Bereken de bruto zuurstofproductie bij punt P. Neem aan dat de dissimilatie bij elke lichtintensiteit even groot is.', opdracht:'Bruto productie = netto productie + verbruik door dissimilatie. Lees beide af.', beeld:beeld,
      velden:[{ label:'bruto productie', antwoord:c.y2 + c.R, tol:1, eenheid:'ml/uur' }],
      uitleg:'Bij punt P is de netto productie ' + c.y2 + ' ml/uur. In het donker (0 klux) is er alleen dissimilatie: de plant verbruikt dan ' + c.R + ' ml O<sub>2</sub> per uur. Bruto = ' + c.y2 + ' + ' + c.R + ' = <b>' + (c.y2 + c.R) + ' ml/uur</b>.', antwoordTekst:(c.y2 + c.R) + ' ml/uur' });
    if (s === 'donker') return Object.assign(basis('fotosynthese', k), { vorm:'meerkeuze', vraag:intro + ' Waarom is de netto zuurstofproductie bij 0 klux negatief?', beeld:beeld, opties:[
      'De plant dissimileert en verbruikt zuurstof, terwijl er geen fotosynthese is.',
      'De plant geeft in het donker CO<sub>2</sub> af in plaats van zuurstof, dus de meting klopt niet.',
      'In het donker breekt de plant zijn chlorofyl af.',
      'In het donker doet de plant aan omgekeerde fotosynthese.'], goed:0,
      uitleg:'Zonder licht is er geen fotosynthese, maar de dissimilatie gaat door. De plant neemt dan zuurstof op: een negatieve netto productie van ' + c.R + ' ml/uur.', antwoordTekst:'Alleen dissimilatie: zuurstof wordt verbruikt.' });
    if (s === 'compbet') return Object.assign(basis('fotosynthese', k), { vorm:'meerkeuze', vraag:intro + ' Wat geldt bij een lichtintensiteit van ' + c.Lc + ' klux?', beeld:beeld, opties:[
      'De fotosynthese is even groot als de dissimilatie.',
      'Er is geen fotosynthese.',
      'Er is geen dissimilatie.',
      'De fotosynthese is maximaal.'], goed:0,
      uitleg:'Bij ' + c.Lc + ' klux is de netto productie 0: de plant maakt evenveel zuurstof als hij verbruikt. Dat is het compensatiepunt. Beide processen lopen dus wel.', antwoordTekst:'Fotosynthese = dissimilatie.' });
    return Object.assign(basis('fotosynthese', k), { vorm:'meerkeuze', vraag:intro + ' Boven ' + (c.Lc + 30) + ' klux stijgt de lijn niet meer. Welke conclusie is juist?', beeld:beeld, opties:[
      'Licht is daar niet meer de beperkende factor; iets anders, zoals CO<sub>2</sub> of de temperatuur, beperkt de fotosynthese.',
      'De plant kan bij veel licht niet meer dissimileren.',
      'Het chlorofyl is bij veel licht kapot.',
      'Licht is daar de beperkende factor.'], goed:0,
      uitleg:'Meer licht levert niets meer op, dus licht beperkt de fotosynthese niet. Een andere factor is dan beperkend: hier de CO<sub>2</sub>-concentratie of de temperatuur, die in de proef gelijk bleven.', antwoordTekst:'Een andere factor dan licht is beperkend.' });
  }

  /* --- twee lijnen: licht en CO2 of temperatuur als beperkende factor --- */
  var LAAG = [[0, 0], [5, 15], [10, 28], [15, 36], [20, 40], [50, 40]], HOOG = [[0, 0], [5, 15], [10, 28], [15, 40], [20, 50], [30, 68], [40, 78], [50, 80]];
  function fotoBeperkend(n){
    var f = kies([{ id:'co2', laag:'0,04% CO₂', hoog:'0,10% CO₂', naam:'de CO<sub>2</sub>-concentratie' }, { id:'temp', laag:'15 °C', hoog:'25 °C', naam:'de temperatuur' }]);
    var a = assen({ xmin:0, xmax:50, xstap:5, xlab:10, ymin:0, ymax:100, ystap:10, ylab:20, xnaam:'lichtintensiteit (klux)', ynaam:'fotosynthese (relatief)', aria:'fotosynthese bij verschillende lichtintensiteit, twee lijnen' });
    var beeld = a.kop + lijn(a, glad(LAAG), L2) + lijn(a, glad(HOOG), L1) + tekst(a, 50, 40, f.laag, L2, 'end', 0, 22) + tekst(a, 50, 80, f.hoog, L1, 'end', 0, -10) +
      stip(a, 5, 15, 'A', 'currentColor', -10, -8) + stip(a, 35, 40, 'B', 'currentColor', 0, -10) + (n === 'vwo' ? stip(a, 45, 79.5, 'C', 'currentColor', 0, 22) : '') + a.staart;
    var intro = 'Bij een plant is de fotosynthese gemeten bij verschillende lichtintensiteiten, bij ' + f.laag + ' en bij ' + f.hoog + '. Verder waren de omstandigheden gelijk.';
    var soorten = ['A', 'B', 'tuin'];
    if (n === 'vwo') soorten.push('C');
    var s = kies(soorten), k = 'fb-' + s + f.id;
    var factoren = ['de lichtintensiteit', f.naam, f.id === 'co2' ? 'de temperatuur' : 'de CO<sub>2</sub>-concentratie', 'de hoeveelheid water'];
    if (s === 'A') return Object.assign(basis('fotosynthese', k), { vorm:'meerkeuze', vraag:intro + ' Welke factor is bij punt A beperkend?', beeld:beeld, opties:factoren, goed:0,
      uitleg:'Bij punt A liggen de twee lijnen op elkaar: meer ' + (f.id === 'co2' ? 'CO<sub>2</sub>' : 'warmte') + ' helpt daar niet. Meer licht wel, want de lijn stijgt nog. Licht is dus beperkend.', antwoordTekst:'de lichtintensiteit' });
    if (s === 'B') return Object.assign(basis('fotosynthese', k), { vorm:'meerkeuze', vraag:intro + ' Welke factor is bij punt B (de lijn bij ' + f.laag + ') beperkend?', beeld:beeld, opties:[f.naam, 'de lichtintensiteit', factoren[2], 'de hoeveelheid water'], goed:0,
      uitleg:'Bij punt B is de lijn vlak: meer licht helpt niet. Bij ' + f.hoog + ' is de fotosynthese bij dezelfde lichtintensiteit wel hoger. Dus is ' + f.naam + ' bij B beperkend.', antwoordTekst:f.naam.replace(/<[^>]+>/g, '') });
    if (s === 'tuin') return Object.assign(basis('fotosynthese', k), { vorm:'meerkeuze', vraag:intro + ' Op een donkere winterdag is de lichtintensiteit in een kas ongeveer 5 klux. Heeft het zin om ' + (f.id === 'co2' ? 'extra CO<sub>2</sub> in de kas te blazen' : 'de kas extra te verwarmen') + ' om de fotosynthese te verhogen?', beeld:beeld, opties:[
      'Nee, want bij 5 klux is licht de beperkende factor.',
      'Ja, want dan stijgt de fotosynthese naar de bovenste lijn.',
      'Ja, want ' + f.naam + ' is altijd beperkend.',
      'Nee, want in de winter is er geen fotosynthese.'], goed:0,
      uitleg:'Bij 5 klux (punt A) liggen de lijnen op elkaar. Extra ' + (f.id === 'co2' ? 'CO<sub>2</sub>' : 'warmte') + ' verandert de fotosynthese daar niet; alleen meer licht helpt. Daarom gebruiken tuinders in de winter groeilampen.', antwoordTekst:'Nee, licht is beperkend.' });
    return Object.assign(basis('fotosynthese', k), { vorm:'meerkeuze', vraag:intro + ' Wat kun je uit deze grafiek afleiden over de beperkende factor bij punt C?', beeld:beeld, opties:[
      'Licht is daar niet beperkend, maar welke factor wel, kun je met deze proef niet bepalen.',
      'Licht is daar beperkend.',
      f.naam.charAt(0).toUpperCase() + f.naam.slice(1) + ' is daar zeker beperkend.',
      'Bij punt C is geen enkele factor beperkend.'], goed:0,
      uitleg:'Bij C is de lijn vrijwel vlak, dus meer licht helpt niet. Er is altijd een beperkende factor, maar of dat ' + f.naam + ' (nog hoger), ' + factoren[2] + ' of iets anders is, is niet gemeten. Daarvoor zou je een lijn bij nog meer ' + (f.id === 'co2' ? 'CO<sub>2</sub>' : 'warmte') + ' nodig hebben.', antwoordTekst:'Licht niet; welke wel is niet te bepalen.' });
  }

  /* --- de reactievergelijking en rekenen met mol en gram --- */
  function fotoVergelijking(n){
    return Object.assign(basis('fotosynthese', 'fv-coef'), { vorm:'invul', vraag:'Maak de reactievergelijking van de fotosynthese kloppend.',
      beeld:'<div class="bron rv">… CO<sub>2</sub> + … H<sub>2</sub>O → C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + … O<sub>2</sub></div>', opdracht:'Vul de getallen voor de stoffen in.',
      velden:[{ label:'voor CO₂', antwoord:6 }, { label:'voor H₂O', antwoord:6 }, { label:'voor O₂', antwoord:6 }],
      uitleg:'6 CO<sub>2</sub> + 6 H<sub>2</sub>O → C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6 O<sub>2</sub>. Tel na: links 6 C, 12 H en 6×2 + 6 = 18 O; rechts 6 C, 12 H en 6 + 6×2 = 18 O.', antwoordTekst:'6, 6 en 6' });
  }
  function fotoRekenen(n){
    var g = kies([9, 18, 36, 45, 90]), stof = kies(n === 'vwo' ? ['co2', 'o2', 'molco2'] : ['co2', 'o2', 'molco2', 'molco2']);
    var mol = g / 180, bron0 = '<div class="bron rv">6 CO<sub>2</sub> + 6 H<sub>2</sub>O → C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6 O<sub>2</sub><br><small>molaire massa: glucose 180 g/mol, CO<sub>2</sub> 44 g/mol, O<sub>2</sub> 32 g/mol</small></div>';
    if (stof === 'molco2'){
      var m = kies([.5, 1, 1.5, 2, 3]);
      return Object.assign(basis('fotosynthese', 'fr-mol' + m), { vorm:'invul', vraag:'Een plant maakt met fotosynthese ' + net(m) + ' mol glucose. Hoeveel mol CO<sub>2</sub> heeft de plant daarvoor vastgelegd?', beeld:bron0, opdracht:'Gebruik de verhouding in de reactievergelijking.',
        velden:[{ label:'CO₂', antwoord:6 * m, tol:.01, eenheid:'mol' }], uitleg:'Per mol glucose is 6 mol CO<sub>2</sub> nodig: 6 × ' + net(m) + ' = <b>' + net(6 * m) + ' mol</b>.', antwoordTekst:net(6 * m) + ' mol' });
    }
    var M = stof === 'co2' ? 44 : 32, uit = rond(mol * 6 * M, 2), naam = stof === 'co2' ? 'CO<sub>2</sub> heeft de plant daarvoor opgenomen' : 'O<sub>2</sub> komt daarbij vrij';
    return Object.assign(basis('fotosynthese', 'fr-' + stof + g), { vorm:'invul', vraag:'Een plant maakt met fotosynthese ' + g + ' g glucose. Hoeveel gram ' + naam + '?', beeld:bron0, opdracht:'Reken eerst om naar mol glucose.',
      velden:[{ label:stof === 'co2' ? 'CO₂' : 'O₂', antwoord:uit, tol:.15, eenheid:'g' }],
      uitleg:g + ' g ÷ 180 g/mol = ' + net(mol, 3) + ' mol glucose. Daarbij hoort 6 × ' + net(mol, 3) + ' = ' + net(mol * 6, 3) + ' mol ' + (stof === 'co2' ? 'CO<sub>2</sub>' : 'O<sub>2</sub>') + '. Dat is ' + net(mol * 6, 3) + ' × ' + M + ' = <b>' + net(uit, 1) + ' g</b>.', antwoordTekst:net(uit, 1) + ' g' });
  }

  /* --- broomthymolblauw in drie buizen --- */
  function fotoBuizen(n){
    var vraag = kies(['geel', 'blauw']);
    var buizen = H([{ id:'A', t:'een waterplant in het licht' }, { id:'B', t:'een waterplant in het donker' }, { id:'C', t:'geen plant, in het licht' }]);
    var letters = ['1', '2', '3'];
    var beschr = buizen.map(function(b, i){ return 'buis ' + letters[i] + ': ' + b.t; }).join('<br>');
    var goedI = buizen.map(function(b){ return b.id; }).indexOf(vraag === 'geel' ? 'B' : 'A');
    return Object.assign(basis('fotosynthese', 'fz-' + vraag + buizen.map(function(b){ return b.id; }).join('')), { vorm:'meerkeuze',
      vraag:'Drie buizen bevatten water met broomthymolblauw. Deze indicator is groen bij het begin, wordt geel als het water zuurder wordt en blauw als het minder zuur wordt. CO<sub>2</sub> maakt water zuur. Na drie uur: in welke buis is de vloeistof ' + vraag + '?',
      beeld:bron(beschr), opties:['buis 1', 'buis 2', 'buis 3'], goed:goedI, vasteVolgorde:true,
      uitleg:vraag === 'geel' ? 'In het donker is er alleen dissimilatie: de plant geeft CO<sub>2</sub> af en het water wordt zuurder (geel). In het licht neemt de plant netto CO<sub>2</sub> op (blauw). Zonder plant verandert er niets: dat is de controlebuis.'
        : 'In het licht is de fotosynthese groter dan de dissimilatie: de plant haalt CO<sub>2</sub> uit het water, dat minder zuur wordt (blauw). In het donker wordt het geel; zonder plant blijft het groen.', antwoordTekst:'buis ' + letters[goedI] });
  }

  /* --- vwo: het Calvin-experiment, RuBP en 3-fosfoglyceraat --- */
  function fotoCalvin(n){
    var licht = Math.random() < .5, lt = kies([['X', 'Y'], ['Y', 'X']]);   /* lt[0] = RuBP */
    var a = assen({ xmin:0, xmax:10, xstap:1, xlab:2, ymin:0, ymax:100, ystap:10, ylab:20, xnaam:'tijd (min)', ynaam:'concentratie (relatief)', aria:'concentratie van twee stoffen in de Calvincyclus voor en na een verandering op tijdstip 4' });
    var stijg = glad([[0, 40], [4, 40], [5, 62], [6, 74], [8, 80], [10, 81]]), daal = glad([[0, 40], [4, 40], [5, 18], [6, 8], [8, 3], [10, 2]]);

  /* --- vwo: rendement, ATP-opbrengst en RQ --- */

  /* --- de koolstofkringloop als schema met genummerde pijlen --- */
  var BOX = { lucht:[200, 30, 150, ['CO₂ in de lucht']], plant:[62, 150, 104, ['planten']], dier:[190, 262, 100, ['dieren']], red:[330, 262, 110, ['reducenten']], fos:[352, 150, 92, ['fossiele', 'brandstoffen']] };
  var PIJLEN = [
    { id:'a', van:[140, 52], naar:[62, 128], p:'fotosynthese' },
    { id:'b', van:[102, 128], naar:[180, 52], p:'dissimilatie' },
    { id:'c', van:[92, 172], naar:[162, 240], p:'opeten' },
    { id:'d', van:[205, 240], naar:[205, 52], p:'dissimilatie' },
    { id:'e', van:[242, 262], naar:[272, 262], p:'dode resten' },
    { id:'f', van:[318, 240], naar:[244, 52], p:'dissimilatie' },
    { id:'g', van:[352, 128], naar:[272, 50], p:'verbranding' }
  ];
  var PROC = [
    { id:'fotosynthese', naam:'fotosynthese' }, { id:'dissimilatie', naam:'dissimilatie' }, { id:'opeten', naam:'opeten (voedsel)' },
    { id:'dode resten', naam:'dode resten en uitwerpselen' }, { id:'verbranding', naam:'verbranding' }
  ];
  function kringSchema(nummer){
    var s = '<svg class="sgr" viewBox="0 0 400 300" font-family="inherit" role="img" aria-label="schema van de koolstofkringloop met genummerde pijlen"><defs><marker id="kp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>';
    Object.keys(BOX).forEach(function(k){ var b = BOX[k], w = b[2];
      s += '<rect x="' + (b[0] - w / 2) + '" y="' + (b[1] - 20) + '" width="' + w + '" height="40" rx="10" fill="var(--kaart2)" stroke="currentColor" stroke-width="1.5"/>';
      var regels = b[3];
      regels.forEach(function(r, i){ s += '<text x="' + b[0] + '" y="' + (b[1] + 5 + (i - (regels.length - 1) / 2) * 15) + '" font-size="' + (regels.length > 1 ? 12.5 : 14) + '" font-weight="600" text-anchor="middle" fill="currentColor">' + r + '</text>'; });
    });
    PIJLEN.forEach(function(p){
      s += '<line x1="' + p.van[0] + '" y1="' + p.van[1] + '" x2="' + p.naar[0] + '" y2="' + p.naar[1] + '" stroke="currentColor" stroke-width="2" marker-end="url(#kp)"/>';
      var nr = nummer[p.id]; if (!nr) return;
      var mx = (p.van[0] + p.naar[0]) / 2, my = (p.van[1] + p.naar[1]) / 2;
      s += '<circle cx="' + mx + '" cy="' + my + '" r="11" fill="var(--kaart)" stroke="var(--nadruk)" stroke-width="2"/><text x="' + mx + '" y="' + (my + 5) + '" font-size="13" font-weight="700" text-anchor="middle" fill="currentColor">' + nr + '</text>';
    });
    return s + '</svg>';
  }
  function kringSleep(n){
    var gekozen = H(PIJLEN).slice(0, n === 'vwo' ? 6 : 5), nummer = {};
    gekozen.forEach(function(p, i){ nummer[p.id] = i + 1; });
    var kaarten = gekozen.map(function(p){ return { id:p.id, tekst:'pijl ' + nummer[p.id] }; }).sort(function(x, y){ return x.tekst < y.tekst ? -1 : 1; });
    var vakken = PROC.map(function(pr){ return { id:'pr-' + pr.id, naam:pr.naam, hoort:gekozen.filter(function(p){ return p.p === pr.id; }).map(function(p){ return p.id; }) }; });
    return Object.assign(basis('kringloop', 'ks-' + gekozen.map(function(p){ return p.id + nummer[p.id]; }).join('')), { vorm:'sleep', vasteVolgorde:true,
      vraag:'Het schema toont de koolstofkringloop. Welk proces hoort bij elke genummerde pijl?', opdracht:WB ? 'Bij een proces kunnen meer pijlen horen, of geen.' : 'Sleep elke pijl naar het goede proces. Bij een proces kunnen meer pijlen horen, of geen.',
      beeld:kringSchema(nummer), kaarten:kaarten, vakken:vakken,
      uitleg:'Van de lucht naar de planten gaat koolstof via fotosynthese. Planten, dieren en reducenten geven CO<sub>2</sub> terug door dissimilatie. Dieren krijgen koolstof door planten te eten; dode resten en uitwerpselen gaan naar de reducenten. Fossiele brandstoffen geven CO<sub>2</sub> af bij verbranding.',
      antwoordTekst:vakken.filter(function(v){ return v.hoort.length; }).map(function(v){ return v.naam + ': ' + v.hoort.map(function(id){ return 'pijl ' + nummer[id]; }).join(', '); }).join('; ') });
  }
  function kringPijl(n){
    var volg = H(PIJLEN), nummer = {};
    volg.forEach(function(p, i){ nummer[p.id] = i + 1; });
    var vr = kies([
      { p:'g', v:'Bij welke pijl komt koolstof in de lucht die miljoenen jaren in de bodem vastlag?' },
      { p:'a', v:'Bij welke pijl wordt koolstof uit de lucht vastgelegd in organische stoffen?' },
      { p:'c', v:'Bij welke pijl gaat koolstof van een producent naar een consument?' },
      { p:'e', v:'Bij welke pijl gaat koolstof in dode resten en uitwerpselen naar de reducenten?' }]);
    var goed = nummer[vr.p], andere = H(PIJLEN.filter(function(p){ return p.id !== vr.p; })).slice(0, 3).map(function(p){ return nummer[p.id]; });
    var naamGoed = PIJLEN.filter(function(p){ return p.id === vr.p; })[0].p;
    return Object.assign(basis('kringloop', 'kp-' + vr.p + volg.map(function(p){ return p.id; }).join('')), { vorm:'meerkeuze', vraag:'Het schema toont de koolstofkringloop. ' + vr.v, beeld:kringSchema(nummer),
      opties:['pijl ' + goed].concat(andere.map(function(x){ return 'pijl ' + x; })), goed:0,
      uitleg:'Pijl ' + goed + ' is ' + (naamGoed === 'dode resten' ? 'het transport van dode resten en uitwerpselen' : naamGoed) + '. ' + ({ g:'Fossiele brandstoffen bevatten koolstof die planten lang geleden vastlegden; verbranding brengt die terug in de lucht.', a:'Bij fotosynthese maken planten van CO<sub>2</sub> en water glucose.', c:'Planten zijn producenten, dieren consumenten: door te eten krijgen dieren de koolstof binnen.', e:'Reducenten breken dood materiaal af en dissimileren het.' })[vr.p], antwoordTekst:'pijl ' + goed });
  }

  /* --- CO2 in de lucht over drie jaar: seizoenen en een stijgende lijn --- */
  var SEIZOEN = [1.0, 1.8, 2.6, 3.4, 3.8, 2.6, .4, -2.0, -3.4, -3.2, -1.4, 0];
  function kringSeizoen(n){
    var trend = kies([2, 2.5, 3]), basisw = kies([410, 412, 414]), pts = [];
    for (var m = 0; m <= 36; m++) pts.push([m, basisw + trend * m / 12 + SEIZOEN[m % 12]]);
    var top1 = basisw + trend * 4 / 12 + 3.8, top3 = basisw + trend * 28 / 12 + 3.8;
    var a = assen({ xmin:0, xmax:36, xstap:3, xlab:12, ymin:405, ymax:430, ystap:1, ylab:5, xnaam:'tijd (maanden)', ynaam:'CO₂ (ppm)', aria:'CO2-concentratie in de lucht over drie jaar', xtekst:function(x){ return x === 36 ? '' : 'jan jaar ' + (x / 12 + 1); } });
    var s = kies(n === 'vwo' ? ['zomer', 'winter', 'trend', 'reken', 'zuid'] : ['zomer', 'winter', 'trend', 'reken']);
    var beeld = a.kop + lijn(a, glad(pts, 4), L1) + (s === 'reken' ? stip(a, 4, top1, net(rond(top1, 1), 1), L1, 0, -10) + stip(a, 28, top3, net(rond(top3, 1), 1), L1, 0, -10) : '') + a.staart;
    var intro = 'De grafiek toont de CO<sub>2</sub>-concentratie in de lucht, gemeten op een meetstation op het noordelijk halfrond, gedurende drie jaar.';
    var k = 'kz-' + s + trend + basisw;
    if (s === 'reken'){ var st = rond((rond(top3, 1) - rond(top1, 1)) / 2, 2);
      return Object.assign(basis('kringloop', k), { vorm:'invul', vraag:intro + ' De twee stippen geven de hoogste waarde in mei van jaar 1 en van jaar 3. Bereken de gemiddelde stijging van de CO<sub>2</sub>-concentratie per jaar.', opdracht:'Let op: van jaar 1 naar jaar 3 is twee jaar.', beeld:beeld,
        velden:[{ label:'stijging', antwoord:st, tol:.06, eenheid:'ppm per jaar' }], uitleg:'(' + net(rond(top3, 1), 1) + ' − ' + net(rond(top1, 1), 1) + ') ÷ 2 jaar = <b>' + net(st) + ' ppm per jaar</b>.', antwoordTekst:net(st) + ' ppm per jaar' }); }
    if (s === 'zomer') return Object.assign(basis('kringloop', k), { vorm:'meerkeuze', vraag:intro + ' Elk jaar is de concentratie in september en oktober het laagst. Hoe komt dat?', beeld:beeld, opties:[
      'In de zomer is de fotosynthese op het noordelijk halfrond groter dan de dissimilatie: planten nemen netto CO<sub>2</sub> op.',
      'In de zomer verbranden mensen minder fossiele brandstoffen, omdat ze minder stoken.',
      'In de zomer dissimileren planten niet.',
      'Warme lucht bevat minder CO<sub>2</sub>.'], goed:0,
      uitleg:'In het groeiseizoen leggen de planten op het noordelijk halfrond veel CO<sub>2</sub> vast. Aan het eind van de zomer is de concentratie het laagst. Minder stoken speelt een veel kleinere rol; planten dissimileren ook in de zomer.', antwoordTekst:'Fotosynthese groter dan dissimilatie.' });
    if (s === 'winter') return Object.assign(basis('kringloop', k), { vorm:'meerkeuze', vraag:intro + ' Waarom stijgt de concentratie elk jaar in de herfst en de winter?', beeld:beeld, opties:[
      'Er is weinig fotosynthese, terwijl de dissimilatie door planten, dieren en vooral reducenten (afgevallen blad) doorgaat.',
      'In de winter doen planten aan omgekeerde fotosynthese.',
      'In de winter is er meer zuurstof in de lucht.',
      'In de winter stopt alle dissimilatie.'], goed:0,
      uitleg:'Bomen verliezen hun blad en de fotosynthese neemt sterk af. Reducenten breken het afgevallen blad af en geven CO<sub>2</sub> af. Daardoor stijgt de concentratie tot het voorjaar.', antwoordTekst:'Weinig fotosynthese, dissimilatie gaat door.' });
    if (s === 'trend') return Object.assign(basis('kringloop', k), { vorm:'meerkeuze', vraag:intro + ' Elk jaar ligt de lijn hoger dan het jaar ervoor. Wat is daarvan de belangrijkste oorzaak?', beeld:beeld, opties:[
      'het verbranden van fossiele brandstoffen',
      'de dissimilatie van de groeiende wereldbevolking',
      'meer fotosynthese',
      'de seizoenen worden langer'], goed:0,
      uitleg:'Bij verbranding van steenkool, olie en gas komt koolstof vrij die al miljoenen jaren uit de kringloop was. De natuur kan dat extra CO<sub>2</sub> niet helemaal opnemen, dus de concentratie stijgt elk jaar. De dissimilatie van mensen is onderdeel van de gewone kringloop: die koolstof kwam kort ervoor uit voedsel.', antwoordTekst:'verbranding van fossiele brandstoffen' });
    return Object.assign(basis('kringloop', k), { vorm:'meerkeuze', vraag:intro + ' Op een meetstation op het zuidelijk halfrond is de schommeling binnen een jaar veel kleiner. Welke verklaring past daarbij?', beeld:beeld, opties:[
      'Op het zuidelijk halfrond is veel minder land met planten; het grootste deel is oceaan.',
      'Op het zuidelijk halfrond zijn er geen seizoenen.',
      'Op het zuidelijk halfrond doen planten niet aan dissimilatie.',
      'Op het zuidelijk halfrond is er geen fotosynthese in de winter.'], goed:0,
      uitleg:'De seizoensschommeling komt door de planten op het land: groeiseizoen tegenover winter. Het zuidelijk halfrond heeft veel minder landoppervlak, dus is het effect kleiner. Seizoenen zijn er wel, alleen zijn ze omgekeerd.', antwoordTekst:'Minder land met planten.' });
  }

  /* --- een gesloten kas, een etmaal lang --- */
  function kringKas(n){
    var tmax = kies([6, 7, 8]), tmin = kies([16, 17, 18]);
    var a = assen({ xmin:0, xmax:24, xstap:2, xlab:4, ymin:200, ymax:650, ystap:50, ylab:100, xnaam:'tijd (uur)', ynaam:'CO₂ (ppm)', aria:'CO2-concentratie in een gesloten kas gedurende een etmaal' });
    var dt = tmin - tmax;
    var pts = glad([[0, 520], [tmax, 600], [tmax + dt * .25, 560], [tmax + dt * .5, 430], [tmax + dt * .75, 320], [tmin, 280], [tmin + 2.5, 330], [24, 470]]);
    var beeld = a.kop + lijn(a, pts, L1) + a.staart;
    var intro = 'In een afgesloten kas met tomatenplanten wordt een etmaal lang de CO<sub>2</sub>-concentratie gemeten. Er wordt geen CO<sub>2</sub> toegevoegd en er is geen ventilatie.';
    var s = kies(['min', 'max', 'nacht', 'daal']), k = 'kk-' + s + tmax + tmin;
    if (s === 'min' || s === 'max'){ var t = s === 'min' ? tmin : tmax;
      return Object.assign(basis('kringloop', k), { vorm:'invul', vraag:intro + ' Op welk tijdstip ' + (s === 'min' ? 'aan het eind van de middag' : 'in de ochtend') + ' is de fotosynthese even groot als de dissimilatie?', opdracht:'Lees de grafiek af: let op waar de lijn van richting verandert.', beeld:beeld,
        velden:[{ label:'tijdstip', antwoord:t, tol:.6, eenheid:'uur' }],
        uitleg:'Als fotosynthese en dissimilatie even groot zijn, verandert de CO<sub>2</sub>-concentratie niet: de lijn heeft dan een ' + (s === 'min' ? 'laagste' : 'hoogste') + ' punt. Dat is om <b>' + t + ' uur</b>. ' + (s === 'min' ? 'Daarna wordt het licht te zwak en stijgt de concentratie weer.' : 'Daarvoor stijgt de concentratie, daarna is de fotosynthese groter en daalt hij.'), antwoordTekst:t + ' uur' }); }
    if (s === 'nacht') return Object.assign(basis('kringloop', k), { vorm:'meerkeuze', vraag:intro + ' Waarom stijgt de concentratie tussen ' + (tmin + 2) + ' uur en 24 uur?', beeld:beeld, opties:[
      'Er is (vrijwel) geen fotosynthese meer, maar de planten dissimileren wel.',
      'De planten nemen \'s avonds meer CO<sub>2</sub> op.',
      'De temperatuur daalt, waardoor CO<sub>2</sub> uit de grond komt.',
      '\'s Avonds doen de planten meer aan fotosynthese.'], goed:0,
      uitleg:'Zonder licht stopt de fotosynthese. De dissimilatie van planten (en bodemorganismen) gaat door en geeft CO<sub>2</sub> af. In een gesloten kas hoopt dat zich op.', antwoordTekst:'Alleen nog dissimilatie.' });
    return Object.assign(basis('kringloop', k), { vorm:'meerkeuze', vraag:intro + ' Waarom daalt de concentratie tussen ' + (tmax + 1) + ' uur en 12 uur?', beeld:beeld, opties:[
      'De fotosynthese is groter dan de dissimilatie, zodat de planten netto CO<sub>2</sub> opnemen.',
      'De planten dissimileren overdag niet.',
      'De dissimilatie is groter dan de fotosynthese.',
      'CO<sub>2</sub> ontsnapt uit de kas.'], goed:0,
      uitleg:'Bij meer licht neemt de fotosynthese toe en wordt hij groter dan de dissimilatie. De planten halen dan netto CO<sub>2</sub> uit de lucht. Er is geen ventilatie, dus ontsnappen kan niet.', antwoordTekst:'Fotosynthese groter dan dissimilatie.' });
  }

  /* --- assimilatie of dissimilatie --- */
  var ASS = ['fotosynthese', 'vorming van zetmeel uit glucose', 'vorming van eiwitten uit aminozuren', 'vorming van glycogeen in de lever', 'vorming van cellulose voor de celwand', 'vorming van vet uit glucose'];
  var DIS = ['glycolyse', 'alcoholgisting', 'melkzuurgisting', 'citroenzuurcyclus', 'afbraak van vetzuren in een spiercel', 'afbraak van glucose tot CO₂ en water'];
  function kringSoort(n){
    var as = H(ASS).slice(0, 3), ds = H(DIS).slice(0, 3), kaarten = [];
    as.forEach(function(x, i){ kaarten.push({ id:'a' + i, tekst:S(x) }); }); ds.forEach(function(x, i){ kaarten.push({ id:'d' + i, tekst:S(x) }); });
    return Object.assign(basis('kringloop', 'ka-' + as.map(function(x){ return ASS.indexOf(x); }).sort().join('') + ds.map(function(x){ return DIS.indexOf(x); }).sort().join('')), { vorm:'sleep',
      vraag:'Is elk proces assimilatie of dissimilatie?', opdracht:SLEEPOPDR, kaarten:kaarten,
      vakken:[{ id:'ass', naam:'assimilatie', uit:'opbouw, kost energie', hoort:['a0', 'a1', 'a2'] }, { id:'dis', naam:'dissimilatie', uit:'afbraak, levert energie', hoort:['d0', 'd1', 'd2'] }],
      uitleg:'Assimilatie bouwt grotere moleculen op uit kleinere en kost energie: ' + as.join(', ') + '. Dissimilatie breekt organische stoffen af en levert energie (ATP): ' + ds.join(', ') + '.',
      antwoordTekst:'assimilatie: ' + as.join(', ') + '; dissimilatie: ' + ds.join(', ') });
  }

  function maakKringloop(n){
    var r = Math.random();
    if (r < .28) return uitLijst('kringloop', kiesItem(KRING_LIJST, n));
    if (r < .42) return kringSleep(n);
    if (r < .52) return kringPijl(n);
    if (r < .68) return kringSeizoen(n);
    if (r < .84) return kringKas(n);
    return kringSoort(n);
  }


  var SOORTEN = { enzymen:maakEnzymen, fotosynthese:maakFotosynthese, dissimilatie:maakDissimilatie, kringloop:maakKringloop };

  VAKSPEL.maak({
    id:'stofwisseling', naam:'Stofwisseling', vak:'bio', kleur:'#3F7A34', minuten:8,
    hand:'opbouwen, afbreken, energie',
    lead:'Hoe maakt een plant glucose, hoe haalt een spiercel er energie uit, en waarom werkt een enzym bij 37 °C wel en bij 70 °C niet? Je leest grafieken van proeven met enzymen en fotosynthese, zoekt de beperkende factor, vult schema\'s aan, rekent met zuurstof, glucose en energie, en beoordeelt beweringen. Examenstof biologie havo en vwo.',
    leerdoel:'Je leert de stofwisseling van cel en organisme: hoe enzymen werken, hoe fotosynthese afhangt van licht, CO₂ en temperatuur, hoe aerobe en anaerobe dissimilatie ATP opleveren, en hoe koolstof via assimilatie en dissimilatie rondgaat. Op vwo ook de lichtreactie, de Calvincyclus, de citroenzuurcyclus en de oxidatieve fosforylering.',
    hoe:[
      { kop:'Lees de proef', tekst:'Bij veel opgaven staat een grafiek van een proef. Kijk eerst wat er op de assen staat en wat er in de proef verandert. Zoek dan het punt waar de vraag over gaat.' },
      { kop:'De beperkende factor', tekst:'Stijgt de lijn nog als je meer licht geeft, dan is <b>licht</b> beperkend. Is de lijn vlak, dan beperkt iets anders, zoals CO<sub>2</sub> of de temperatuur.' },
      { kop:'Vier onderdelen', tekst:'Enzymen, fotosynthese, dissimilatie en ATP, en assimilatie met de koolstofkringloop. Bij rekenvragen staan de reactievergelijking en de molaire massa\'s erbij.' }
    ],
    keuzes:[
      { id:'niveau', kop:'welk examen', std:'hv', items:[
        { id:'hv', naam:'havo', uit:'Enzymen bij temperatuur en pH, fotosynthese en beperkende factoren, aerobe en anaerobe dissimilatie, ATP, assimilatie en de koolstofkringloop, met grafieken en rekenen met mol en gram.' },
        { id:'vwo', naam:'vwo', uit:'Ook remmers van enzymen, de lichtreactie en de Calvincyclus, de stappen van de dissimilatie in het mitochondrion, ATP-opbrengst, rendement en het respiratoir quotiënt.' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' },
        { id:'enzymen', naam:'enzymen', uit:'Activeringsenergie, de actieve plaats, temperatuur en pH, substraatconcentratie en remmers, en een proef met katalase.' },
        { id:'fotosynthese', naam:'fotosynthese', uit:'De reactievergelijking, het compensatiepunt, bruto en netto, beperkende factoren, en op vwo de lichtreactie en de Calvincyclus.' },
        { id:'dissimilatie', naam:'dissimilatie en ATP', uit:'Aeroob en anaeroob, gist en melkzuur, rekenen met zuurstof en energie, en op vwo glycolyse, citroenzuurcyclus en oxidatieve fosforylering.' },
        { id:'kringloop', naam:'assimilatie en koolstofkringloop', uit:'Opbouw en afbraak, de koolstofkringloop in een schema, CO₂ in de lucht en in een kas.' } ] }
    ],
    aantal:10,
    maak:function(keuze, nr){
      var soort = keuze.soort === 'alles' ? kies(['enzymen', 'fotosynthese', 'dissimilatie', 'kringloop']) : keuze.soort;
      return SOORTEN[soort](keuze.niveau === 'vwo' ? 'vwo' : 'hv');
    },
    uitleg:{ doel:'De stofwisseling van cel en organisme voor havo en vwo: enzymen, fotosynthese, dissimilatie en ATP, assimilatie en de koolstofkringloop, met grafieken van proeven en rekenwerk.', tijd:'twintig opgaven per ronde, of kies 10 of 30',
      bediening:'Kies een antwoord (of druk op 1 tot 4). Bij een getal of begrip typ je het antwoord en druk je op Nakijken; een komma of een punt mag allebei. Bij een schema sleep je de kaartjes naar hun plek, of tik je een kaartje en dan het vak.' }
  });
})();
