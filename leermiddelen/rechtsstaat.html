/* De zaak, de route en de tabellen lezen hun kleuren uit de tokens van vakspel.css, zodat de
   donkere stand meekantelt. Alleen de rand van de zaak en de huidige stap hebben de spelkleur;
   de tekst op de spelkleur is --spelinkt (wit of navy, door vakspel.js gekozen). */
.rs-wrap{display:grid;gap:8px;justify-items:center;width:100%}
.rs-casus,.rs-sit{max-width:62ch;width:100%;text-align:left;background:var(--kaart2);border-left:4px solid var(--spelkleur);border-radius:0 14px 14px 0;padding:12px 16px 12px 14px;font-size:1.02rem;line-height:1.58}
.rs-casus .rs-titel{display:block;font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.rs-casus .rs-eerder{display:block;color:var(--muted);font-size:.88rem;line-height:1.45;margin-bottom:6px}
.rs-route{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px 6px;justify-content:center;max-width:62ch}
.rs-route li{font-size:.76rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--kaart2);color:var(--muted);line-height:1.45}
.rs-route li.af{color:var(--ink)}
.rs-route li.af::before{content:'\2713\00a0'}
.rs-route li.nu{background:var(--spelkleur);color:var(--spelinkt)}
.rs-bron{max-width:62ch;width:100%;text-align:left;border:1px solid var(--rand2);border-radius:12px;padding:12px 16px;background:var(--kaart);font-size:1rem;line-height:1.58}
.rs-bron .rs-kop{display:block;font-weight:700;margin-bottom:4px}
.rs-bron small{display:block;color:var(--muted);font-size:.8rem;margin-top:6px}
.rs-tab{border-collapse:collapse;width:100%;max-width:520px;font-size:.92rem;background:var(--kaart);font-variant-numeric:tabular-nums}
.rs-tab caption{caption-side:top;text-align:left;font-size:.82rem;color:var(--muted);font-weight:600;padding:0 2px 6px}
.beeld .rs-tab td,.beeld .rs-tab th{padding:7px 10px;text-align:right;border-bottom:1px solid var(--rand);line-height:1.35}
.beeld .rs-tab th[scope=row]{text-align:left;font-weight:600}
.beeld .rs-tab thead th{background:var(--kaart2);font-weight:600;vertical-align:bottom}
.beeld .rs-tab thead th:first-child{text-align:left}
body.groot .rs-casus,body.groot .rs-sit,body.groot .rs-bron{font-size:1.25rem}
/* de stappen van een zaak: elke stap een eigen rij, anders staan lange zinnen in smalle kolommen */
body.rs-stap .vakken.rij{grid-template-columns:1fr}
body.rs-stap .vakken.rij .sleepdoel{flex-direction:row;align-items:center;min-height:58px;gap:10px}
body.rs-stap .vakken.rij .doelknop{width:auto;flex:none}
body.rs-stap .vakken.rij .sleepdoel .inhoud{justify-content:flex-start;flex:1;min-height:32px}
body.rs-stap .sleepkaart{text-align:left;font-weight:500;font-size:.92rem;display:flex}
body.rs-stap .kaartjes{flex-direction:column;align-items:stretch}
@media(max-width:560px){.rs-casus,.rs-sit{font-size:.97rem;padding:10px 12px}.rs-bron{font-size:.97rem;padding:10px 12px}.rs-tab{font-size:.84rem}.beeld .rs-tab td,.beeld .rs-tab th{padding:6px 7px}.rs-route li{font-size:.72rem;padding:3px 8px}}

  ];
  function stroming(n){
    var x = kies(STROMSIT), keys = ['lib', 'soc', 'conf'], opt = keys.map(function(k){ return n === 2 ? STROMING[k].kgt : STROMING[k].naam; });
