<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.json">
<script src="avatar.js"></script>
<script src="profiel.js"></script>
<link rel="apple-touch-icon" href="/icoon-192.png">
<script>(function(){try{var t=localStorage.getItem('thema');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
<title>Jouw rol &middot; meneer Greidanus</title>
<meta name="description" content="De telefoon van een leerling bij een rollenspel van de klas: je rol, en wat je op dit moment mag doen.">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="../fonts.css?v=2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M53.3 12.7 C77 15.7 95.6 32 92.2 54.1 C88.4 77.7 69 96 46.2 92.4 C22.6 88.7 5.9 71.5 11.2 48.2 C16.5 24.9 30.3 9.9 53.3 12.7Z' fill='%23204ECF'/><g transform='translate(50 51) scale(2.2) translate(-12 -12)' fill='none' stroke='%23FBF6F1' stroke-width='2.25' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='8' r='3.5'/><path d='M5.5 19.5v-1A3.5 3.5 0 0 1 9 15h6a3.5 3.5 0 0 1 3.5 3.5v1'/></g></svg>">
<style>
:root{--crab:#F26749;--amber:#EA9836;--ocean:#204ECF;--vista:#83A5F2;--sand:#FCDED6;--room:#FBF6F1;--ink:#14224C;--muted:#5b6480;--kaart:#fff;--kaart2:#f4f7ff;--rand:rgba(20,34,76,.10);--rand2:rgba(20,34,76,.2);--goed:#1f7a4a;--goed-bg:#e2f3e8;--fout:#a8371f;--fout-bg:#fbe5e0;--ease:cubic-bezier(.22,.61,.36,1)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--room:#0F1A3D;--ink:#F3EFE9;--muted:#B3BBD0;--kaart:#182652;--kaart2:#1f2f5e;--rand:rgba(243,239,233,.12);--rand2:rgba(243,239,233,.2);--goed-bg:#1f3a2c;--fout-bg:#3a1f1b;--goed:#8fd8ac;--fout:#f0a090}}
:root[data-theme="dark"]{--room:#0F1A3D;--ink:#F3EFE9;--muted:#B3BBD0;--kaart:#182652;--kaart2:#1f2f5e;--rand:rgba(243,239,233,.12);--rand2:rgba(243,239,233,.2);--goed-bg:#1f3a2c;--fout-bg:#3a1f1b;--goed:#8fd8ac;--fout:#f0a090}
*{box-sizing:border-box}
/* de site belooft tikdoelen van 44 beeldpunten; het vak groeit, de tekst niet */
.mark{min-height:44px}
footer a{display:inline-flex;align-items:center;min-height:44px;padding:0 2px}
/* geselecteerde tekst: zand met donkerblauw, in beide standen hetzelfde */
::selection{background:#FCDED6;color:#14224C}
/* het streepje in een invulveld: in de kleur van de site */
input,textarea{caret-color:var(--ocean)}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;background:var(--room);color:var(--ink);line-height:1.5;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.hide{display:none !important}
.wrap{width:min(100% - 24px,560px);margin-inline:auto;padding:14px 0 40px}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.kop{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.kop .naam{font-weight:600;display:flex;align-items:center;gap:8px}
.kop .status{margin-left:auto;font-size:.8rem;color:var(--muted)}
.kaart{background:var(--kaart);border:1px solid var(--rand);border-radius:20px;padding:18px;margin-top:12px}
.veld{width:100%;border:2px solid var(--rand2);border-radius:14px;padding:12px 14px;background:var(--kaart);color:var(--ink);font-size:1.1rem;margin-top:8px}
.veld.code{letter-spacing:.3em;text-transform:uppercase;font-weight:700;text-align:center;font-size:1.6rem}
.knop{border:none;border-radius:14px;padding:12px 18px;font-weight:600;background:var(--ocean);color:#fff;width:100%;margin-top:10px;min-height:48px}
.knop.stil{background:var(--kaart2);color:var(--ink)}
.fout{color:var(--fout);font-size:.9rem;margin-top:8px;min-height:1.2em}
/* de rolkaart: in de kleur van de rol */
.rol{border-radius:22px;padding:18px 20px;color:#fff;margin-top:12px;position:relative;overflow:hidden}.rol>*{position:relative;z-index:1}
.rol::before{content:'';position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.rol .eyebrow{color:inherit;opacity:.82}
/* op een lichte rolkleur (koraal, amber) donkerblauwe letters, en dan niet doorschijnend: anders zakt het contrast weer */
.rol.licht .eyebrow,.rol.licht .onder{opacity:1}
.rol h2{font-size:1.5rem;line-height:1.15;margin-top:2px}
.rol .onder{font-size:.92rem;opacity:.92;margin-top:2px}
.rol p.tekst{font-size:.92rem;margin-top:10px;line-height:1.45}
/* het doel van de rol: een eigen vlak op de rolkaart, zodat het er niet tussendoor valt */
.rol .doel{margin-top:12px;padding:10px 13px;border-radius:14px;background:rgba(255,255,255,.17);font-size:.95rem;line-height:1.4}
.rol.licht .doel{background:rgba(20,34,76,.1)}
.rol .doel b{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:2px}
.rol ul.zo{margin:8px 0 0;padding-left:18px;font-size:.88rem;line-height:1.45}
.rol ul.zo li+li{margin-top:2px}
/* de kaart van dit moment */
.nu h2{font-size:1.25rem;line-height:1.25;margin-top:4px}
.nu p.tekst{color:var(--muted);font-size:.95rem;margin-top:8px}
.nu .meer{font-size:.86rem;color:var(--muted);margin-top:8px;border-top:1px solid var(--rand);padding-top:8px}
.opties{display:grid;gap:8px;margin-top:14px}
.optie{border:2px solid var(--rand2);background:var(--kaart2);border-radius:16px;padding:14px 16px;text-align:left;font-weight:600;font-size:1.02rem;display:flex;gap:10px;align-items:center;min-height:52px}
.optie i{width:12px;height:12px;border-radius:50%;flex:none;background:var(--ocean)}
/* De gekozen optie krijgt de kleur van die optie (groen voor, rood tegen),
   niet voor alles hetzelfde blauw: anders zie je niet meer wat je koos.
   --ok en --okt (de letterkleur erop) zet het script per optie. */
.optie.aan{border-color:var(--ok,var(--ocean));background:var(--ok,var(--ocean));color:var(--okt,#fff)}
.optie.aan i{background:var(--okt,#fff) !important}
.optie.aan::after{content:"\2713";margin-left:auto;font-weight:700;font-size:1.2rem}
.optie small{display:block;font-weight:400;font-size:.82rem;color:var(--muted);margin-top:2px}
.optie.aan small{color:inherit;opacity:.88}
.gestuurd.nog{color:#8a4b00}
/* de standaardstip van een keuze: in het donker lichter, anders verdwijnt hij op de donkere kaart */
:root[data-theme="dark"] .optie i:not([style]){background:var(--vista,#83A5F2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .optie i:not([style]){background:var(--vista,#83A5F2)}}
:root[data-theme="dark"] .gestuurd.nog{color:#ffd08a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .gestuurd.nog{color:#ffd08a}}
.optie:disabled{opacity:.55;cursor:default}
.gestuurd{margin-top:10px;font-size:.9rem;color:var(--goed);font-weight:600;min-height:1.3em}
.lat{margin-top:14px}
.lat input{width:100%;accent-color:var(--ocean);height:44px}
.lat .einden{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.lat .waarde{text-align:center;font-size:2rem;font-weight:700;margin-top:4px}
.wacht{text-align:center;padding:26px 10px}
.wacht .stip{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ocean);margin:0 3px;animation:stip 1.2s infinite}
.wacht .stip:nth-child(2){animation-delay:.2s}.wacht .stip:nth-child(3){animation-delay:.4s}
@keyframes stip{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.uitslag ul{margin:10px 0 0;padding-left:1.2rem;font-size:.92rem}
.mag-niet{background:var(--fout-bg);color:var(--fout);border-radius:14px;padding:12px 14px;font-weight:600;margin-top:12px}
footer{text-align:center;font-size:.8rem;color:var(--muted);padding:20px 16px}
:focus-visible{outline:3px solid var(--focusring,#B4701A);outline-offset:3px}

/* ---------- de app: een tijdlijn zoals in een sociaal netwerk ----------
   Een kaart { soort:'feed' } zet de pagina in de stand van een app. --app is de
   merkkleur die het bord meestuurt (een vast vlak met vaste lichte letters);
   de tijdlijn, de posts en de kolommen kantelen mee met het thema. */
:root{--kbg:#EDF1F3;--app-tekst:var(--app,#0f7c8c);--kchip:rgba(20,34,76,.06);--koraal-t:#a8371f;--koraal-bg:#fde6df;--paars-t:#5b3391;--paars-bg:#efe6fa;--amber-t:#8a4b00;--amber-bg:#fdf0dc;--schaduw-k:0 1px 2px rgba(20,34,76,.06),0 6px 18px rgba(20,34,76,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--kbg:#0B1433;--app-tekst:#7fd6e0;--kchip:rgba(243,239,233,.08);--koraal-t:#ffb4a3;--koraal-bg:#3d2320;--paars-t:#d2b8f5;--paars-bg:#2c2150;--amber-t:#ffd08a;--amber-bg:#3a2c14;--schaduw-k:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--kbg:#0B1433;--app-tekst:#7fd6e0;--kchip:rgba(243,239,233,.08);--koraal-t:#ffb4a3;--koraal-bg:#3d2320;--paars-t:#d2b8f5;--paars-bg:#2c2150;--amber-t:#ffd08a;--amber-bg:#3a2c14;--schaduw-k:0 1px 2px rgba(0,0,0,.3)}
body.app-aan{background:var(--kbg)}
.kapp{min-height:100svh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.ki{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* de app-balk: een vast merkvlak */
.kbalk{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;min-height:58px;padding:6px 8px 6px 14px;background:var(--app,#0f7c8c);color:var(--app-ink,#FBF6F1);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.kmerk{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:1.3rem;letter-spacing:-.03em;line-height:1;min-width:0}
.kmerk svg{width:32px;height:32px;flex:none;display:block}
.kik{margin-left:auto;display:inline-flex;align-items:center;gap:8px;min-height:44px;max-width:58%;border:none;border-radius:999px;padding:4px 12px 4px 4px;background:rgba(255,255,255,.16);color:inherit;text-align:left}
.kik svg.avatar,.kik .kav{flex:none}
.kik span{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.kik b{font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kik small{font-size:.72rem;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kstat{margin:0;padding:6px 14px;font-size:.82rem;background:var(--amber-bg);color:var(--amber-t)}
.kstat:empty{display:none}
/* drie vakken: op de telefoon een tegelijk (met de tabbalk), op een breed scherm naast elkaar */
.kgrid{width:min(100%,640px);margin-inline:auto}
.kgrid>.kvak{display:none;min-width:0}
.kgrid[data-tab="tijdlijn"]>.kmid,.kgrid[data-tab="profiel"]>.klinks,.kgrid[data-tab="trending"]>.krechts{display:block}
.kmid{padding:10px 8px 0}
.klinks,.krechts{padding:14px 12px 0}
.kmidkop{display:flex;align-items:baseline;gap:10px;padding:4px 6px 8px}
.kmidkop h1{font-size:1.15rem;letter-spacing:-.01em;margin:0}
.kmidkop span{margin-left:auto;font-size:.8rem;color:var(--muted);font-weight:600}
.kmidtekst{color:var(--muted);font-size:.9rem;padding:0 6px 8px}
.klijst{display:grid;gap:10px}
/* een post */
.kpost{background:var(--kaart);border:1px solid var(--rand);border-radius:18px;box-shadow:var(--schaduw-k);overflow:hidden;padding:12px 0 0}
.kpost.actief{border-color:color-mix(in srgb,var(--app,#0f7c8c) 45%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--app,#0f7c8c) 30%,transparent),var(--schaduw-k)}
.kvia{display:flex;align-items:center;gap:6px;margin:0 14px 8px;font-size:.8rem;font-weight:500;color:var(--muted)}
.kvia .ki{width:16px;height:16px}
.kvia b{color:var(--ink);font-weight:600}
.kph{display:flex;align-items:center;gap:10px;padding:0 14px;min-width:0}
.kav{flex:none;display:grid;place-items:center;border-radius:50%;overflow:hidden;color:#fff;font-weight:700;letter-spacing:.02em;line-height:1}
.kav.tegel{border-radius:12px}
.kav svg{width:100%;height:100%;display:block}
.kav.leeg{background:#b3b9c6}
.kav.leeg svg{width:70%;height:70%}
.kwie{min-width:0;flex:1;line-height:1.25}
.kwie b{display:flex;align-items:center;gap:4px;font-size:.95rem;min-width:0}
.kwie .knaam{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kwie>span{display:block;font-size:.8rem;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kvink{width:16px;height:16px;flex:none}
.klabels{display:flex;flex-wrap:wrap;gap:6px;margin:10px 14px 0}
.klabel{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px 3px 8px;font-size:.76rem;font-weight:700;line-height:1.3;background:var(--kchip);color:var(--ink)}
.klabel .ki{width:14px;height:14px;stroke-width:2.4}
.klabel.factcheck,.klabel.nep{background:var(--fout-bg);color:var(--fout)}
.klabel.trending{background:var(--koraal-bg);color:var(--koraal-t)}
.klabel.aanbevolen,.klabel.info{background:color-mix(in srgb,var(--app,#0f7c8c) 14%,transparent);color:var(--app-tekst)}
.klabel.klopt{background:var(--goed-bg);color:var(--goed)}
.klabel.satire{background:var(--paars-bg);color:var(--paars-t)}
.klabel.misleidend{background:var(--amber-bg);color:var(--amber-t)}
.klabel.eigen{background:color-mix(in srgb,var(--ocean) 14%,transparent);color:var(--ink)}
.kkop{font-size:1.08rem;line-height:1.3;font-weight:600;letter-spacing:-.01em;margin:10px 14px 0}
.ktekst{font-size:.94rem;line-height:1.45;margin:4px 14px 0;color:var(--ink);opacity:.86}
/* het plaatje is als een foto: vaste kleuren, ook in het donker */
.kbeeld{position:relative;margin:10px 0 0;aspect-ratio:12/7;background:#d9dde6;overflow:hidden}
.kbeeld svg{display:block;width:100%;height:100%}
.kbeeld img{display:block;width:100%;height:100%;object-fit:cover}
.kbeeld text{font-family:'Poppins',system-ui,sans-serif}
.kbeeld .kleeg{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;font-size:.85rem;color:#14224C;background:#D6ECEF}
.kband{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(20,34,76,.86);color:#fff;font-size:.82rem;font-weight:600;line-height:1.3}
.kband .ki{width:18px;height:18px;color:#ffb4a3}
.ktel{display:flex;flex-wrap:wrap;gap:4px 16px;margin:10px 14px 0;font-size:.8rem;color:var(--muted)}
.ktel span{display:inline-flex;align-items:center;gap:5px}
.ktel .ki{width:16px;height:16px}
.ktel b{color:var(--ink);font-variant-numeric:tabular-nums}
/* de actieknoppen onder een post, zoals in een echte app */
.kacties{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;margin:10px 6px 0;padding:6px 0 6px;border-top:1px solid var(--rand)}
.kact{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:none;border-radius:14px;padding:6px 4px;background:none;color:var(--muted);font-weight:600;font-size:.8rem;line-height:1.15;text-align:center;transition:background-color .18s ease,color .18s ease}
.kact .ki{width:23px;height:23px}
.kact:hover:not(:disabled){background:var(--kchip);color:var(--ink)}
.kact.aan{background:var(--ak,var(--ocean));color:var(--akt,#fff)}
.kact.aan .ki{stroke-width:2.4}
.kact.knal .ki{animation:kpop .42s var(--ease)}
.kact:disabled{cursor:default}
.kpost.dicht .kact:not(.aan),.kact.uit:not(.aan){opacity:.45}
@keyframes kpop{0%{transform:scale(1)}35%{transform:scale(1.32)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.knoot{margin:0 14px;padding:0 0 10px;font-size:.8rem;line-height:1.4;color:var(--muted)}
.kgestuurd{margin:0 14px;padding:0 0 10px;font-size:.82rem;font-weight:600;color:var(--goed);min-height:0}
.kgestuurd:empty{display:none}
.kgestuurd.nog{color:var(--amber-t)}
/* de aanwijzing na het checken klapt open onder de post */
/* de check in vier tegels: wie, wat, wanneer, waar (het Kringel-ontwerp) */
.wtegels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.wtegel{background:var(--kaart);border:1.5px solid var(--rand);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wtegel b{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--gr-tekst);letter-spacing:0;text-transform:none}
.wtegel b svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wtegel span{font-size:.92rem;line-height:1.4}
.wtegel.breed{grid-column:1 / -1}
@media(max-width:420px){.wtegels{grid-template-columns:1fr}}
.kcheck .wtegels{margin-top:6px}
.kcheck{margin:10px 10px 0;border-radius:14px;padding:12px 14px;background:var(--amber-bg);color:var(--ink);border-left:4px solid #EA9836}
.kcheck.open{animation:kopen .38s var(--ease)}
@keyframes kopen{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.kcheckkop{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.86rem;color:var(--amber-t);margin:0 0 4px}
.kcheck p{font-size:.9rem;line-height:1.45}
.kcheck .kmeer{font-size:.8rem;color:var(--muted);margin-top:6px}
.kpost.nieuw{animation:kin .45s var(--ease)}
@keyframes kin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
/* tussen nieuw en al gezien, zoals "je bent helemaal bij" */
.kscheid{display:flex;align-items:center;gap:10px;margin:6px 4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.kscheid::before,.kscheid::after{content:'';flex:1;height:1px;background:var(--rand2)}
.kbij{text-align:center;background:var(--kaart);border:1px solid var(--rand);border-radius:18px;padding:18px 16px}
.kbij .kbijico{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:color-mix(in srgb,var(--app,#0f7c8c) 16%,transparent);color:var(--app-tekst)}
.kbij .kbijico .ki{width:26px;height:26px;stroke-width:2.6}
.kbij b{display:block;font-size:1.02rem}
.kbij p{color:var(--muted);font-size:.9rem;margin-top:4px}
/* een melding van de app */
.kmeld{display:flex;gap:12px;align-items:flex-start;background:var(--kaart);border:1px solid var(--rand);border-radius:18px;padding:12px 14px}
.kmeld .kmico{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--app,#0f7c8c);color:var(--app-ink,#FBF6F1)}
.kmeld b{display:block;font-size:.98rem;line-height:1.3}
.kmeld p{font-size:.9rem;line-height:1.4;color:var(--muted);margin-top:2px}
.kmeld.app{background:var(--app,#0f7c8c);border-color:transparent;color:var(--app-ink,#FBF6F1)}
.kmeld.app .kmico{background:var(--accent,#F26749);color:#14224C}
.kmeld.app p{color:inherit;opacity:.92}
.kmeld.nieuw{animation:kin .45s var(--ease)}
/* "jouw ronde": een kaartje zoals het weekoverzicht van een app (vast merkvlak) */
.ksam{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 16px;background:linear-gradient(150deg,var(--app,#0f7c8c),#0B4F5C);color:#FBF6F1}
.ksam::before{content:'';position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.10)}
.ksam>*{position:relative}
.ksam .keb{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.ksam .keb i{width:9px;height:9px;border-radius:50%;background:var(--accent,#F26749)}
.ksam h2{font-size:1.3rem;line-height:1.2;margin-top:6px}
.ksam>p{font-size:.92rem;line-height:1.45;margin-top:6px;opacity:.94}
.kcijf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.kcijf div{border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.14);min-width:0}
.kcijf b{display:block;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kcijf span{display:block;font-size:.78rem;line-height:1.25;opacity:.9;margin-top:2px}
.ksam ul{margin:12px 0 0;padding:12px 0 0 1.1rem;border-top:1px solid rgba(255,255,255,.2);font-size:.88rem;line-height:1.45}
.ksam li+li{margin-top:5px}
.kcijf.licht div{background:var(--kchip)}
.kcijf.licht b{color:var(--ink)}
.kcijf.licht span{color:var(--muted);opacity:1}
/* een nieuw bericht plaatsen */
.kplaats{background:var(--kaart);border:2px solid var(--app,#0f7c8c);border-radius:20px;padding:14px 0 12px;box-shadow:var(--schaduw-k)}
.kplkop{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 14px 10px}
.kpltitel{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:1.05rem}
.kgeheim{display:inline-flex;align-items:center;gap:4px;margin-left:auto;border-radius:999px;padding:3px 10px 3px 7px;font-size:.74rem;font-weight:700;background:var(--koraal-bg);color:var(--koraal-t)}
.kgeheim .ki{width:14px;height:14px}
.kpltekst{font-size:.9rem;color:var(--muted);line-height:1.45;margin:10px 14px 0}
.kplopties{display:grid;gap:8px;margin:12px 14px 0}
.kplopt{display:block;width:100%;text-align:left;border:2px solid var(--rand2);border-radius:16px;padding:11px 14px;background:var(--kaart2);min-height:52px}
.kplopt .kplk{display:block;font-weight:600;font-size:.98rem;line-height:1.3}
.kplopt .kplt{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:.78rem;color:var(--muted)}
.kplopt .kplt i{width:9px;height:9px;border-radius:50%;background:var(--ok,var(--ocean))}
.kplopt[aria-checked="true"]{border-color:var(--ok,var(--ocean));box-shadow:0 0 0 2px var(--ok,var(--ocean))}
/* de voorvertoning als een link in een tijdlijn: tekst links, het plaatje als vierkantje rechts */
.kplvoor{display:grid;grid-template-columns:minmax(0,1fr) 36%;align-items:stretch;margin:12px 14px 0;border:1px solid var(--rand);border-radius:16px;overflow:hidden}
.kplvoor .kplvt{padding:10px 12px;font-size:.86rem;line-height:1.4;align-self:center}
.kplvoor .kplvt b{display:block;font-size:.93rem;line-height:1.3;margin-bottom:3px}
.kplvoor .kplvt span{color:var(--muted)}
.kplvoor .kbeeld{margin:0 !important;border-radius:0 !important;aspect-ratio:auto;min-height:110px;height:100%}
.kplonder{display:flex;align-items:center;gap:12px;margin:12px 14px 0}
.kplonder .kmeer{flex:1;font-size:.8rem;color:var(--muted);line-height:1.35}
.kplknop{flex:none;border:none;border-radius:999px;min-height:46px;padding:0 22px;font-weight:700;background:var(--app,#0f7c8c);color:var(--app-ink,#FBF6F1)}
.kplknop:disabled{opacity:.45;cursor:default}
.kplaats .kgestuurd{margin-top:8px;padding-bottom:0}
/* profiel en trending */
.kmerkgroot{display:none}
.kme{display:flex;align-items:center;gap:12px;padding:4px 2px 2px}
.kme b{display:block;font-size:1.1rem;line-height:1.2}
.kme span{display:block;color:var(--muted);font-size:.85rem}
.klinks .rol{margin-top:12px}
.kpriv{font-size:.76rem;color:var(--muted);margin-top:14px;line-height:1.4}
.kdek{font-size:.8rem;color:var(--muted);margin-top:10px;line-height:1.4}
.kzij{background:var(--kaart);border:1px solid var(--rand);border-radius:18px;padding:14px 14px 12px}
.kzij+.kzij{margin-top:12px}
.kzij h2{font-size:1rem;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.kzij h2 .ki{color:var(--accent,#F26749)}
.kzij ol{list-style:none;margin:0;padding:0}
.kzij li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--rand)}
.kzij li:first-child{border-top:none;padding-top:2px}
.kzij .knr{flex:none;width:22px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.kzij li b{display:block;font-size:.9rem;line-height:1.3}
.kzij li small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.kzij .kleegtekst{color:var(--muted);font-size:.88rem}
/* de tabbalk onderaan */
.ktabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);background:var(--kaart);border-top:1px solid var(--rand2);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.ktabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:none;background:none;color:var(--muted);font-size:.74rem;font-weight:600;border-radius:14px}
.ktabs button .ki{width:24px;height:24px}
.ktabs button[aria-current="page"]{color:var(--app-tekst)}
.ktabs button[aria-current="page"] .ki{stroke-width:2.5}
.kbadge{position:absolute;top:6px;left:calc(50% + 8px);min-width:10px;height:10px;border-radius:999px;background:var(--accent,#F26749);box-shadow:0 0 0 2px var(--kaart)}
.kbadge[hidden]{display:none}
body.app-aan.vb-hapert .vb-balk{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
/* breed scherm: een computerversie met drie kolommen */
@media(min-width:900px){
  .kapp{padding-bottom:24px}
  .kbalk,.ktabs{display:none}
  .kgrid{width:min(100% - 32px,1240px);display:grid;grid-template-columns:minmax(210px,270px) minmax(0,600px) minmax(230px,300px);justify-content:center;gap:clamp(14px,2vw,24px);align-items:start}
  .kgrid>.kvak{display:block !important}
  .klinks,.krechts{position:sticky;top:0;max-height:100vh;overflow:auto;padding:20px 0 20px}
  .kmid{padding:0;border-inline:1px solid var(--rand);min-height:100vh;background:color-mix(in srgb,var(--kbg) 60%,var(--room))}
  .kmidkop{position:sticky;top:0;z-index:5;padding:16px 18px;background:color-mix(in srgb,var(--kbg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rand)}
  .kmidkop h1{font-size:1.3rem}
  .kmidtekst{padding:10px 18px 0}
  .klijst{padding:14px 14px 24px;gap:14px}
  .kmerkgroot{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.6rem;letter-spacing:-.03em;color:var(--ink);padding:0 4px 18px}
  .kmerkgroot svg{width:42px;height:42px}
  .kacties{grid-auto-flow:row;grid-auto-columns:auto;display:flex;gap:6px;padding:8px 6px}
  .kact{flex-direction:row;gap:8px;min-height:44px;padding:8px 16px;border-radius:999px;font-size:.88rem}
  .kact .ki{width:20px;height:20px}
  .kkop{font-size:1.15rem}
  .kbeeld{margin:12px 14px 0;border-radius:14px}
}
@media(prefers-reduced-motion:reduce){
  .kpost.nieuw,.kmeld.nieuw,.kcheck.open,.kact.knal .ki{animation:none}
  .kact{transition:none}
}

<body>
<main class="wrap">
  <div class="kop"><span class="naam" id="kopNaam"></span><span class="status" id="status"></span></div>

  <section id="s-join" class="kaart">
    <p class="eyebrow">doe mee</p>
    <h2 style="font-size:1.3rem;margin-top:4px">Vul de code van het bord in</h2>
    <input class="veld code" id="joinCode" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Code van het bord">
    <input class="veld" id="joinNaam" maxlength="16" placeholder="Je bijnaam" autocomplete="nickname" aria-label="Je bijnaam">
    <button class="knop" id="joinBtn" type="button">Meedoen</button>
    <p class="fout" id="joinFout"></p>
  </section>

  <section id="s-spel" class="hide">
    <div id="rolkaart"></div>
    <div id="nu" class="kaart nu"></div>
  </section>
</main>
<div id="app" class="kapp hide"></div>
<footer>Rollenspel van meneer Greidanus &middot; je bijnaam en je keuzes staan alleen in deze kamer, hoogstens drie uur.</footer>

<script src="naamfilter.js"></script>
<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function schoon(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function sid(){
    var s = null;
    try { s = localStorage.getItem('lg-quiz-sid'); } catch (e){}
    if (!s){ var r = new Uint8Array(12); crypto.getRandomValues(r); s = Array.prototype.map.call(r, function(b){ return ('0' + b.toString(16)).slice(-2); }).join(''); try { localStorage.setItem('lg-quiz-sid', s); } catch (e){} }
    return s;
  }
  var verb = null, code = '', naam = '', rol = null, nu = null, gekozen = {}, klaar = false;

  /* ---------- meedoen ---------- */
  var param = /[?&]k=([A-Za-z]{4})/.exec(location.search);
  if (param) $('joinCode').value = param[1].toUpperCase();
  try { $('joinNaam').value = localStorage.getItem('lg-quiz-naam') || (window.KLAS && KLAS.lees() ? KLAS.lees().naam : '') || ''; } catch (e){}
  $('joinBtn').addEventListener('click', doeMee);
  $('joinNaam').addEventListener('keydown', function(e){ if (e.key === 'Enter') doeMee(); });
  /* via de instappagina is er al op Meedoen gedrukt, met code en bijnaam */
  if (param && /[?&]ga=1/.test(location.search) && $('joinNaam').value.trim().length >= 2) setTimeout(doeMee, 0);
  function doeMee(){
    /* een tik tegelijk: de knop wacht op de server */
    if ($('joinBtn').disabled) return;
    code = $('joinCode').value.toUpperCase().replace(/[^A-Z]/g, '');
    naam = $('joinNaam').value.trim().slice(0, 16);
    if (code.length !== 4){ $('joinFout').textContent = 'De code heeft vier letters.'; return; }
    if (naam.length < 2){ $('joinFout').textContent = 'Vul een bijnaam in.'; return; }
    if (window.NAAMFILTER && NAAMFILTER.verboden(naam)){ $('joinFout').textContent = 'Die bijnaam kan niet. Kies een andere.'; return; }
    try { localStorage.setItem('lg-quiz-naam', naam); } catch (e){}
    $('joinFout').textContent = 'Even kijken…';
    var knop = $('joinBtn'); knop.disabled = true; knop.setAttribute('aria-busy', 'true');
    function vrij(){ knop.disabled = false; knop.removeAttribute('aria-busy'); }
    fetch('/api/kamer/' + code).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); }).then(function(x){
      vrij();
      if (x.ok && x.j.spel === 'rollen' && x.j.game === 'teken'){ location.href = 'tekenslag.html?k=' + code + '&ga=1'; return; }
      if (x.ok && x.j.spel === 'rollen' && x.j.game === 'crisis'){ location.href = 'crisis-team.html?k=' + code + '&ga=1'; return; }
      if (x.ok && x.j.spel && x.j.spel !== 'rollen'){
        /* deze code hoort bij een ander spel van de docent; alleen soorten die we kennen krijgen een doorverwijzing */
        var doel = { strijd:'strijd.html', quiz:'klasquiz.html' }[x.j.spel];
        if (!doel){ $('joinFout').textContent = x.j.spel === 'klas' ? 'Dit is een klascode van een docent, geen spelcode. Die vul je in de leeromgeving in, bij "Code van je docent".' : 'Deze code hoort bij een ander spel. Vraag je docent welke pagina je moet openen.'; return; }
        location.href = doel + '?k=' + code + '&ga=1'; return;
      }
      if (!x.ok || x.j.spel !== 'rollen'){ $('joinFout').textContent = 'Geen spel met deze code. Kijk of je hem goed hebt overgenomen.'; return; }
      $('s-join').classList.add('hide'); $('s-spel').classList.remove('hide');
      $('kopNaam').innerHTML = (window.AVATAR ? AVATAR.svg(naam, 28, window.PROFIEL ? PROFIEL.avatar() : '') : '') + schoon(naam);
      toon({ soort:'wacht', titel:'Je doet mee', tekst:'Wacht tot het bord begint. Je rol komt hier vanzelf.' });
      verbind();
    }).catch(function(){ vrij(); $('joinFout').textContent = 'Geen verbinding. Kijk of je internet hebt en probeer het opnieuw.'; });
  }

  /* ---------- de verbinding ---------- */
  function status(t){ $('status').textContent = t || ''; var k = $('kStat'); if (k) k.textContent = t || ''; }
  /* Via verbinding.js: zolang de verbinding hapert staat er een strook
     onderaan, en een keuze die niet weg kon gaat mee zodra hij terug is.
     stuur() zegt of het echt weg is; pas dan staat er "Verstuurd". */
  function verbind(){
    verb = VERBINDING.maak({ rol:'speler',
      pad:code + '?rol=speler&sid=' + encodeURIComponent(sid()) + '&naam=' + encodeURIComponent(naam) + '&av=' + encodeURIComponent(window.PROFIEL ? PROFIEL.avatar() : ''),
      onBericht:bericht,
      onOpen:function(){ status(''); },
      onEruit:function(){ bericht({ t:'eruit' }); },
      onDicht:function(reden){ status(reden); toon({ soort:'wacht', titel:'Klaar', tekst:reden }); } });
  }
  function stuur(m, x){ return verb ? verb.stuur(m, x) : false; }
  /* de regel onder de knoppen: verstuurd, of nog niet */
  function zegGestuurd(weg, tekst){
    var g = $('gestuurd'); if (!g) return;
    g.classList.toggle('nog', !weg);
    g.textContent = weg ? tekst : 'Nog niet verstuurd, we proberen het opnieuw. Zodra de verbinding terug is, gaat je keuze vanzelf naar het bord.';
  }
  /* De letter op de rolkaart: wit of donkerblauw, wat het meeste contrast
     geeft op de kleur van de rol (zoals --spelinkt in vakspel.js). Wit op
     koraal haalt maar 3:1, donkerblauw 5:1. */
  function lum(hex){
    var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '')); if (!m) return 0;
    return [0, 2, 4].map(function(i){ var c = parseInt(m[1].substr(i, 2), 16) / 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); })
      .reduce(function(s, c, i){ return s + c * [.2126, .7152, .0722][i]; }, 0);
  }
  function inktOp(hex){ var l = lum(hex), wit = 1.05 / (l + .05), navy = (l + .05) / (lum('#14224C') + .05); return navy > wit ? '#14224C' : '#fff'; }
  /* donkere optiekleur: witte letter; lichte: donkerblauwe */
  function letterOp(kleur){
    var m = /^#([0-9a-f]{6})$/i.exec(kleur || ''); if (!m) return '#fff';
    var n = parseInt(m[1], 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#14224C' : '#fff';
  }

  /* Een kaart van het bord: de rolkaart blijft staan, de rest vervangt wat er
     nu staat. Elke kaart heeft een volgnummer, zodat een oude nooit een nieuwe
     overschrijft (het bord voor iedereen en de kaart voor jou lopen door elkaar). */
  var laatsteN = 0;
  function bericht(m){
    if (m.t === 'eruit'){ klaar = true; if (verb) verb.sluit(); status(''); toon({ soort:'wacht', titel:'Je bent uit het spel gehaald', tekst:'Je docent heeft je uit deze kamer gehaald. Was dat een vergissing? Laad deze pagina opnieuw, dan doe je weer mee.' }); return; }
    if (m.t === 'kaart' || m.t === 'bord'){
      var d = m.d; if (!d || typeof d !== 'object') return;
      if (d.soort === 'rol'){ rol = d; tekenRol(); if (nu && nu.soort === 'feed') tekenFeed(nu); return; }
      if (d.n && d.n < laatsteN && m.t === 'bord' && nu && nu.voorMij) return;   /* een persoonlijke kaart wint van een ouder bord */
      if (d.n) laatsteN = Math.max(laatsteN, d.n);
      d.voorMij = m.t === 'kaart';
      toon(d);
      return;
    }
    if (m.t === 'einde'){ klaar = true;
      /* een tijdlijn blijft staan, maar niets is nog aan te tikken */
      if (nu && nu.soort === 'feed'){ nu.dicht = true; tekenFeed(nu); }
      else if (!nu || nu.soort !== 'uitslag') toon({ soort:'wacht', titel:'Het spel is afgelopen', tekst:'Kijk naar het bord.' });
      /* even wachten op een laatste kaart van het bord, dan ophangen: de kamer is klaar */
      setTimeout(function(){ if (verb) verb.sluit(); status(''); }, 4000); }
  }

  /* ---------- tekenen ---------- */
  function rolHtml(){
    if (!rol) return '';
    var kl = /^#[0-9a-f]{6}$/i.test(rol.kleur || '') ? rol.kleur : '#204ECF', inkt = inktOp(kl);
    return '<div class="rol' + (inkt === '#fff' ? '' : ' licht') + '" style="background:' + kl + ';color:' + inkt + '"><p class="eyebrow">jouw rol</p><h2>' + schoon(rol.titel) + '</h2>' +
      (rol.onder ? '<p class="onder">' + schoon(rol.onder) + '</p>' : '') + (rol.tekst ? '<p class="tekst">' + schoon(rol.tekst) + '</p>' : '') +
      (rol.doel ? '<div class="doel"><b>jouw doel</b>' + schoon(rol.doel) + '</div>' : '') +
      (rol.punten && rol.punten.length ? '<ul class="zo">' + rol.punten.slice(0, 6).map(function(p){ return '<li>' + schoon(p) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
  }
  function tekenRol(){ $('rolkaart').innerHTML = rolHtml(); }

  /* ---------- de app: een tijdlijn van een sociaal netwerk ----------
     { soort:'feed', app:{ naam, kleur, accent, logo (svg) }, kop, tekst,
       posts:[{ id, sleutel, naam, handle, avatar, vink, tijd, kop, tekst, beeld,
                tellers:{ gedeeld, gezien }, label of labels:[{ soort, tekst }],
                gedeeldDoor, herkomst, acties:[{ id, tekst, icoon, soort, kleur, onder, aan }],
                gekozen, dicht, aanwijzing:{ kop, tekst, meer }, noot }],
       melding:{ kop, tekst, icoon, soort:'app' }, samenvatting:{ kop, titel, tekst, cijfers, regels },
       plaatsen:{ id, titel, geheim, tekst, als:{ naam, handle, avatar }, beeld, opties:[{ id, tekst, onder, uitleg, kleur }], knop, meer },
       wachtrij:n, bij:{ titel, tekst }, zij:{ trendingKop, trending:[{ kop, onder }], cijfersKop, cijfers:[{ waarde, label }] }, dicht }
     Een tik op een actie stuurt { vraag:post.id, keuze:actie.id }, net als een
     vraagkaart; plaatsen stuurt { vraag:plaatsen.id, keuze:optie.id }.
     avatar: een svg, een zaadje voor AVATAR.svg, { tekst, kleur } of { leeg:true }.
     beeld: een svg of { id, svg, alt }; een beeld met id wordt onthouden, zodat
     het bord het maar een keer hoeft te sturen. */
  var RUSTIG = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var BREED = window.matchMedia ? matchMedia('(min-width: 900px)') : { matches:false };
  var KI = {
    deel:'<path d="M17 2.5l3 3-3 3"/><path d="M4 11V9.5a4 4 0 0 1 4-4h12"/><path d="M7 21.5l-3-3 3-3"/><path d="M20 13v1.5a4 4 0 0 1-4 4H4"/>',
    nee:'<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>',
    check:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
    vergroot:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/><path d="M8 11l2 2 4-4"/>',
    vlag:'<path d="M5 21V4"/><path d="M5 4.5h12l-2.5 4 2.5 4H5"/>',
    oog:'<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>',
    huis:'<path d="M3.5 11L12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/>',
    trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    profiel:'<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>',
    bel:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
    info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5h.01"/>',

      (cf.length ? '<section class="kzij"><h2>' + ki('profiel') + schoon(z.cijfersKop || 'Jouw stand') + '</h2><div class="kcijf licht">' + cf.map(function(c){ return '<div><b>' + schoon(c.waarde) + '</b><span>' + schoon(c.label) + '</span></div>'; }).join('') + '</div></section>' : '') + '</aside>';
    h += '</div>';
    h += '<nav class="ktabs" aria-label="' + schoon(appNaam) + '">' + [['tijdlijn', 'huis', 'Tijdlijn'], ['trending', 'trend', 'Trending'], ['profiel', 'profiel', 'Mijn rol']].map(function(t){
      return '<button type="button" data-tab="' + t[0] + '"' + (app.tab === t[0] ? ' aria-current="page"' : '') + '>' + ki(t[1]) + '<span>' + t[2] + '</span>' + (t[0] === 'tijdlijn' ? '<i class="kbadge"' + (app.badge ? '' : ' hidden') + '></i>' : '') + '</button>';
    }).join('') + '</nav>';
    el.innerHTML = h;
    if (!app.haak){ app.haak = true; el.addEventListener('click', klikApp); }
    if (nieuwTop && (app.tab === 'tijdlijn' || BREED.matches)){
      /* na een check: de aanwijzing in beeld; een nieuw bericht: terug naar boven */
      var cw = eerste && eerste.aanwijzing ? el.querySelector('.kpost.actief .kcheck') : null;
      if (cw && cw.getBoundingClientRect().bottom > innerHeight - 80) cw.scrollIntoView({ block:'center', behavior:RUSTIG ? 'auto' : 'smooth' });
      else if (!cw && scrollY > 60) scrollTo({ top:0, behavior:RUSTIG ? 'auto' : 'smooth' });
    } else if (nieuwKop && scrollY > 60 && (app.tab === 'tijdlijn' || BREED.matches)) scrollTo({ top:0, behavior:RUSTIG ? 'auto' : 'smooth' });
  }
  function zetTab(t){
    if (t === app.tab && t === 'profiel') t = 'tijdlijn';
    app.tab = t;
    if (t === 'tijdlijn') app.badge = false;
    var g = $('app').querySelector('.kgrid'); if (g) g.setAttribute('data-tab', t);
    Array.prototype.forEach.call($('app').querySelectorAll('.ktabs button'), function(b){ if (b.getAttribute('data-tab') === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    var bd = $('app').querySelector('.kbadge'); if (bd) bd.hidden = !app.badge;
    scrollTo({ top:0, behavior:'auto' });
  }
  function zegApp(id, weg, tekst){
    var g = $('app').querySelector('[data-g="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]'); if (!g) return;
    g.classList.toggle('nog', !weg);
    g.textContent = weg ? tekst : 'Nog niet verstuurd. Zodra de verbinding terug is, gaat je keuze vanzelf naar het bord.';
  }
  function klikApp(e){
    var d = nu; if (!d || d.soort !== 'feed') return;
    var t = e.target.closest ? e.target.closest('button') : null; if (!t) return;
    if (t.hasAttribute('data-tab')){ zetTab(t.getAttribute('data-tab')); return; }
    if (t.classList.contains('kact')){
      var art = t.closest('.kpost'), pid = art && art.getAttribute('data-p');
      var p = lijst(d.posts).filter(function(x){ return x && String(x.id) === pid; })[0];
      if (!p || d.dicht || p.dicht || t.disabled) return;
      var a = lijst(p.acties).filter(function(x){ return String(x.id) === t.getAttribute('data-a'); })[0];
      if (!a || a.aan || a.uit) return;
      gekozen[p.id] = a.id;
      Array.prototype.forEach.call(art.querySelectorAll('.kact'), function(b){
        var on = b === t || lijst(p.acties).some(function(x){ return x.aan && String(x.id) === b.getAttribute('data-a'); });
        b.classList.toggle('aan', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.classList.remove('knal');
      });
      if (!RUSTIG){ void t.offsetWidth; t.classList.add('knal'); }
      var tekst = 'Verstuurd.';
      var weg = stuur({ t:'actie', d:{ vraag:p.id, keuze:a.id } }, { daarna:function(){ if (nu === d) zegApp(p.id, true, tekst); } });
      zegApp(p.id, weg, tekst);
      if (navigator.vibrate) navigator.vibrate(30);
      return;
    }
    var pl = d.plaatsen;
    if (pl && t.classList.contains('kplopt')){
      if (app.geplaatst[pl.id] || d.dicht) return;
      app.plaats[pl.id] = t.getAttribute('data-o');
      var sec = t.closest('.kplaats'), nieuw = document.createElement('div');
      nieuw.innerHTML = plaatsHtml(pl, d);
      sec.parentNode.replaceChild(nieuw.firstChild, sec);
      var zelfde = $('app').querySelector('.kplopt[data-o="' + t.getAttribute('data-o').replace(/"/g, '') + '"]'); if (zelfde) zelfde.focus();
      return;
    }
    if (pl && t.classList.contains('kplknop')){
      var k = app.plaats[pl.id] !== undefined ? app.plaats[pl.id] : pl.gekozen;
      if (k === undefined || app.geplaatst[pl.id] || d.dicht) return;
      app.geplaatst[pl.id] = true;
      var w2 = stuur({ t:'actie', d:{ vraag:pl.id, keuze:k } }, { daarna:function(){} });
      var sec2 = t.closest('.kplaats'), n2 = document.createElement('div');
      n2.innerHTML = plaatsHtml(pl, d); sec2.parentNode.replaceChild(n2.firstChild, sec2);
      if (!w2) zegApp(pl.id, false, '');
      if (navigator.vibrate) navigator.vibrate(30);
    }
  }

  function toon(d){
    nu = d;
    if (d.soort === 'feed'){ tekenFeed(d); return; }
    if (document.body.classList.contains('app-aan')) appAan(false);
    var el = $('nu'), h = '';
    if (d.soort === 'wacht'){
      h = '<div class="wacht"><p class="eyebrow">' + schoon(d.titel || 'even wachten') + '</p><p style="margin-top:8px;font-size:1.05rem">' + schoon(d.tekst || '') + '</p><p style="margin-top:14px"><span class="stip"></span><span class="stip"></span><span class="stip"></span></p></div>';
    } else if (d.soort === 'vraag' || d.soort === 'lijst'){
      var keus = gekozen[d.id], items = d.soort === 'vraag' ? (d.opties || []) : (d.items || []);
      h = '<p class="eyebrow">' + schoon(d.kop || (d.soort === 'vraag' ? 'jij mag stemmen' : 'jouw keuze')) + '</p><h2>' + schoon(d.titel || '') + '</h2>' + (d.tekst ? '<p class="tekst">' + schoon(d.tekst) + '</p>' : '') +
        '<div class="opties">' + items.map(function(o){
          var kl = /^#[0-9a-f]{6}$/i.test(o.kleur || '') ? o.kleur : '';
          return '<button type="button" class="optie' + (keus === o.id ? ' aan' : '') + '" data-id="' + schoon(o.id) + '"' + (keus === o.id ? ' aria-pressed="true"' : ' aria-pressed="false"') +
            (kl ? ' style="--ok:' + kl + ';--okt:' + letterOp(kl) + '"' : '') + (d.dicht ? ' disabled' : '') + '><i' + (kl ? ' style="background:' + kl + '"' : '') + '></i><span>' + schoon(o.tekst) + (o.onder ? '<small>' + schoon(o.onder) + '</small>' : '') + '</span></button>';
        }).join('') + '</div><p class="gestuurd" id="gestuurd" role="status">' + (keus ? 'Verstuurd. Je mag nog wisselen tot het bord verdergaat.' : '') + '</p>' +
        (d.meer ? '<p class="meer">' + schoon(d.meer) + '</p>' : '');
    } else if (d.soort === 'lat'){
      var w = gekozen[d.id] !== undefined ? gekozen[d.id] : (d.waarde !== undefined ? d.waarde : 50);
      /* de lat loopt van 0 tot 100: wat het bord anders stuurt, komt niet als tekst in de pagina */
      w = Math.max(0, Math.min(100, Math.round(Number(w)) || 0));
      h = '<p class="eyebrow">' + schoon(d.kop || 'jouw oordeel') + '</p><h2>' + schoon(d.titel || '') + '</h2>' + (d.tekst ? '<p class="tekst">' + schoon(d.tekst) + '</p>' : '') +
        '<div class="lat"><div class="waarde" id="latWaarde">' + w + '</div><input type="range" min="0" max="100" value="' + w + '" id="latIn" aria-label="Schuif"><div class="einden"><span>' + schoon(d.links || '') + '</span><span>' + schoon(d.rechts || '') + '</span></div></div>' +
        '<button class="knop" id="latZend" type="button"' + (d.dicht ? ' disabled' : '') + '>' + schoon(d.knop || 'Zet mijn merkteken') + '</button><p class="gestuurd" id="gestuurd" role="status">' + (gekozen[d.id] !== undefined ? 'Verstuurd. Schuif en druk nog eens als je wilt wisselen.' : '') + '</p>';
    } else if (d.soort === 'uitslag'){
      h = '<div class="uitslag"><p class="eyebrow">' + schoon(d.kop || 'uitslag') + '</p><h2>' + schoon(d.titel || '') + '</h2>' + (d.tekst ? '<p class="tekst">' + schoon(d.tekst) + '</p>' : '') +
        (d.regels && d.regels.length ? '<ul>' + d.regels.map(function(r){ return '<li>' + schoon(r) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
    } else if (d.soort === 'magniet'){
      h = '<p class="eyebrow">' + schoon(d.kop || 'op het bord') + '</p><h2>' + schoon(d.titel || '') + '</h2>' + (d.tekst ? '<p class="tekst">' + schoon(d.tekst) + '</p>' : '') + '<div class="mag-niet">' + schoon(d.waarom || 'Jij mag hier niet over stemmen.') + '</div>';
    } else {
      h = '<h2>' + schoon(d.titel || '') + '</h2>' + (d.tekst ? '<p class="tekst">' + schoon(d.tekst) + '</p>' : '');
    }
    el.innerHTML = h;
    Array.prototype.forEach.call(el.querySelectorAll('.optie'), function(b){
      b.addEventListener('click', function(){
        if (d.dicht) return;
        gekozen[d.id] = b.getAttribute('data-id');
        Array.prototype.forEach.call(el.querySelectorAll('.optie'), function(x){ x.classList.toggle('aan', x === b); x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        var tekst = 'Verstuurd. Je mag nog wisselen tot het bord verdergaat.';
        var weg = stuur({ t:'actie', d:{ vraag:d.id, keuze:gekozen[d.id] } }, { daarna:function(){ if (nu === d) zegGestuurd(true, tekst); } });
        zegGestuurd(weg, tekst);
        if (navigator.vibrate) navigator.vibrate(30);
      });
    });
    var li = $('latIn');
    if (li){
      li.addEventListener('input', function(){ $('latWaarde').textContent = li.value; });
      $('latZend').addEventListener('click', function(){
        gekozen[d.id] = parseInt(li.value, 10);
        var tekst = 'Verstuurd: ' + li.value + '. Schuif en druk nog eens als je wilt wisselen.';
        var weg = stuur({ t:'actie', d:{ vraag:d.id, waarde:gekozen[d.id] } }, { daarna:function(){ if (nu === d) zegGestuurd(true, tekst); } });
        zegGestuurd(weg, tekst);
        if (navigator.vibrate) navigator.vibrate(30);
      });
    }
  }
  /* wie een code in de link heeft, hoeft alleen nog een bijnaam */
  if (param && $('joinNaam').value.length >= 2) $('joinNaam').focus();
})();
</script>
<script src="thema.js"></script>
