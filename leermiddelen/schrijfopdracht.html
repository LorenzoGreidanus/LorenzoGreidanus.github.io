<style>
/* de opdracht zoals op het examen: een kader met de situatie */
.opdr{max-width:62ch;width:100%;text-align:left;background:var(--kaart2);border-left:4px solid var(--spelkleur);border-radius:0 14px 14px 0;padding:12px 16px;font-size:.98rem;line-height:1.6}
.opdr .opdrkop{display:block;font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.opdr ul{margin:4px 0 0;padding-left:1.2em}
.opdr li{margin:2px 0}
.stapel{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
/* de e-mail en de brief: een vel met een kop */
.mail{max-width:62ch;width:100%;text-align:left;background:var(--kaart);border:1px solid var(--rand2);border-radius:10px;box-shadow:var(--schaduw);font-size:.97rem;line-height:1.6;overflow-wrap:anywhere}
.mail .mkop{display:grid;gap:2px;padding:10px 16px;border-bottom:1px solid var(--rand);font-size:.84rem;color:var(--muted)}
.mail .mkop b{color:var(--ink);font-weight:600}
.mail .mlijf{padding:12px 16px 14px}
.mail .mlijf p{margin:0 0 .75em}
.mail .mlijf p:last-child{margin-bottom:0}
.mail.brief{border-radius:4px}
.mail .bkop{padding:14px 16px 0;font-size:.9rem}
.mail .afz{text-align:right;color:var(--muted);margin-bottom:10px}
.mail .ontv{margin-bottom:12px}
.mail .datum{margin:0 0 4px}
.mail .betreft{margin:0 0 6px}
.mail .handtek{display:block;font-size:1.5rem;line-height:1.1;margin:4px 0 0}
.gat{display:inline-block;min-width:6em;border-bottom:2px solid var(--ink);text-align:center;color:var(--muted);font-weight:600;line-height:1.2;margin:0 2px}
/* een losse zin uit een mail */
.zinvak{max-width:62ch;width:100%;text-align:left;background:var(--kaart);border:1px solid var(--rand2);border-radius:10px;padding:12px 16px;font-size:1.05rem;line-height:1.6}
.zinvak small{display:block;font-size:.76rem;color:var(--muted);font-weight:600;margin-bottom:2px}
/* de regel van de examinator */
.regelkaart{max-width:62ch;width:100%;text-align:left;border:1.5px dashed var(--rand2);border-radius:12px;padding:10px 14px;font-size:.9rem;line-height:1.5}
.regelkaart b{display:block;margin-bottom:2px}
/* aanvinken: meer dan een antwoord kan goed zijn */
.vinklijst{display:grid;gap:8px;max-width:640px;margin-inline:auto}
/* .vinklijst ervoor: op werkblad.html staat ook een .vink (het vinkje voor de uitleg), daar hoort dit kader niet bij */
.vinklijst .vink{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--kaart2);border:2px solid transparent;border-radius:14px;padding:11px 14px;min-height:48px;font-weight:500;line-height:1.35;color:var(--ink)}
.vinklijst .vink::before{content:"";flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-size:.85rem;font-weight:700;line-height:1;box-sizing:border-box}
.vink:hover:not(:disabled){border-color:var(--vista)}
.vink.on{border-color:var(--nadruk);background:var(--kaart-aan)}
.vink.on::before{content:"✓";background:var(--nadruk);border-color:var(--nadruk);color:var(--kaart)}
.vink:disabled{cursor:default}
.vink.juist{background:var(--goed-bg);border-color:var(--goed)}
.vink.mis{background:var(--fout-bg);border-color:var(--fout)}
.vink.gemist{border-color:var(--fout);border-style:dashed}
.vink .tag{display:block;font-size:.78rem;font-weight:600;margin-top:2px;color:var(--muted)}
.vink span{flex:1}
.lijstuit{font-size:.88rem;color:var(--muted);text-align:center;margin:10px 0 0}
.waarom ul{margin:.3rem 0;padding-left:1.2em}
body.groot .mail,body.groot .opdr,body.groot .zinvak{font-size:1.2rem}
@media(max-width:560px){.mail .mlijf,.mail .mkop,.mail .bkop{padding-left:12px;padding-right:12px}.opdr{padding:10px 12px;font-size:.94rem}.mail{font-size:.94rem}.zinvak{font-size:1rem;padding:10px 12px}}
/* Op het werkblad (.blad bestaat alleen op werkblad.html). Het lijstje in de opdracht
   is een gewone opsomming: zonder het nummerblokje van de opgaven, en zonder dat de
   nummers van de opgaven verder tellen. De korte tip onder de vraag (span.opdr van het
   werkblad) is geen kader zoals de opdracht. Aanvinken wordt een rij hokjes. */
.blad .opdr li{counter-increment:none;padding:0;border:0;margin:2px 0}
.blad .opdr li::before{content:none;display:none}
.blad span.opdr,.blad .sleep-wb .opdr{background:none;border:0;border-radius:0;padding:0;max-width:none}
.blad .vinklijst{gap:0;max-width:none;margin:4px 0 0}
.blad .vinklijst .wb-keus{display:flex;align-items:flex-start;gap:10px;background:none;border:0;border-radius:0;padding:4px 0;margin:0;min-height:0;font-size:.93rem;font-weight:500;box-shadow:none}
.blad .vinklijst .wb-keus::before{width:18px;height:18px;border:1.5px solid #14224C;border-radius:4px}
.blad .lijstuit{text-align:left;margin-top:4px}
/* de opdracht en de mail iets compacter, zodat een opgave met allebei op een A4 past; de
   opdracht houdt een streep links, want de achtergrondkleur valt bij het printen weg */
.blad div.opdr{background:none;border-left:3px solid #14224C;border-radius:0;padding:2px 0 2px 12px;margin:0;color:#14224C;font-size:.86rem;line-height:1.45;max-width:none}
.blad .stapel:has(>.mail){gap:6px;align-items:stretch}
.blad .mail{font-size:.88rem;line-height:1.45;max-width:none;box-shadow:none}
.blad .mail .mlijf{padding:8px 14px 10px}
.blad .mail .mkop{padding:6px 14px}
.blad .mail .mlijf p{margin-bottom:.4em}
/* de kop van een brief heet net als de kop van het werkblad .bkop: niet als een rij met een dikke streep eronder */
.blad .mail .bkop{display:block;border-bottom:0;padding:10px 16px 0;line-height:1.4}
.blad .mail .afz{margin-bottom:4px}
.blad .mail .ontv{margin-bottom:6px}
.blad .mail .handtek{font-size:1.15rem;margin-top:2px}
</style>

<script>

  { id:"dierenwinkel", aan:"meneer Visser van dierenwinkel De Vogelkooi", mail:"info@devogelkooi.nl", ah:"Geachte heer Visser,", nm:"Lotte Mulder",

    ond:["Stage in de week van 14 april", "Stage", "heyy stage??", "Ik wil graag stage bij u lopen want ik hou van dieren en ik zit in de derde klas"],

  { id:"bioscoop", aan:"Filmhuis Lindeveen", mail:"reserveringen@filmhuislindeveen.nl", ah:"Geachte heer, mevrouw,", nm:"Noah Willems",

  { id:"beroepenavond", aan:"mevrouw Yildiz, oud-leerling en verpleegkundige", mail:"a.yildiz@ziekenhuislindeveen.nl", ah:"Geachte mevrouw Yildiz,", nm:"Anouk Brouwer",

  { id:"sportschool", aan:"sportschool FitFabriek", mail:"administratie@fitfabriek.nl", ah:"Geachte heer, mevrouw,", nm:"Jamal Bakker",

  { id:"belbeter", aan:"telefoonwinkel BelBeter", mail:"service@belbeter.nl", ah:"Geachte heer, mevrouw,", nm:"Sophie Meijer",

  { id:"dehorst", aan:"mevrouw Hoekstra van zorgcentrum De Horst", mail:"vrijwilligers@dehorst.nl", ah:"Geachte mevrouw Hoekstra,", nm:"Iris Scholten",

  { id:"waterbedrijf", aan:"mevrouw Bakker, afdeling communicatie van waterbedrijf Aquaduct", mail:"communicatie@aquaduct.nl", ah:"Geachte mevrouw Bakker,", nm:"Sem Vos",
    s:"Voor je profielwerkstuk onderzoek je samen met een klasgenoot hoe drinkwater wordt gezuiverd. Waterbedrijf Aquaduct heeft een zuiveringsinstallatie in Lindeveen. Jullie willen de installatie bezoeken en een medewerker interviewen. Het interview duurt ongeveer een half uur. Jullie kunnen in de week van 3 februari, behalve op woensdag. Je begeleider is meneer Pinto, docent scheikunde. Jullie willen later allebei scheikunde studeren. Schrijf een e-mail aan mevrouw Bakker van de afdeling communicatie. Stel jezelf voor, leg uit waar jullie onderzoek over gaat, vraag of jullie de installatie mogen bezoeken en een medewerker mogen interviewen, noem wanneer jullie kunnen en bied aan het profielwerkstuk na afloop op te sturen.",
    ond:["Verzoek bezoek en interview voor profielwerkstuk", "Profielwerkstuk", "pws vraagje", "Wij doen een onderzoek naar drinkwater en willen graag bij uw bedrijf komen kijken"],
    aanl:"Ik schrijf u met een verzoek voor ons profielwerkstuk.",
    el:[["wie je bent", "Ik ben Sem Vos, leerling van havo 5 van het Lindecollege."],
        ["waar het onderzoek over gaat", "Samen met een klasgenoot {onderzoek|onderzoekt|Bij ik is de persoonsvorm de stam, zonder t: ik onderzoek.} ik hoe drinkwater wordt {gezuiverd|gezuivert|Gezuiverd: verleng het (het gezuiverde water), dan hoor je een d.}."],
        ["of jullie mogen komen kijken en interviewen", "@"],
        ["wanneer jullie kunnen", "Wij kunnen in de week van 3 februari, behalve op {woensdag|Woensdag|^Dagen schrijf je met een kleine letter.}."],
        ["dat jullie het werkstuk opsturen", "Na afloop sturen wij u {graag|graach|Graag schrijf je met een g aan het eind, net als aan het begin.} ons profielwerkstuk toe."]],
    nee:["wie jullie begeleider is", "wat jullie later willen studeren", "hoe lang het interview duurt"],
    slot:"Ik zie uw antwoord met belangstelling tegemoet.",
    toon:["Zouden wij uw zuiveringsinstallatie mogen bezoeken en een medewerker mogen interviewen?", "Mogen we ff komen kijken en iemand interviewen?", "Wij komen in de week van 3 februari langs en interviewen dan een medewerker.", "Wij zouden het als een ongekend voorrecht beschouwen indien het ons, zij het slechts voor een ogenblik, vergund zou zijn uw installatie te aanschouwen."] },
  { id:"debat", soort:"brief", aan:"wethouder De Groot", ah:"Geachte heer De Groot,", nm:"Yara Mahabier",
    afz:["Iepenlaan 5", "4324 MN  Lindeveen"], ontv:["Gemeente Lindeveen", "t.a.v. de heer M. de Groot, wethouder Jeugd en Onderwijs", "Postbus 100", "4320 AC  Lindeveen"], datum:"Lindeveen, 20 januari 2027",
    s:"Op donderdag 13 maart organiseert de debatclub van jouw school een debat over de vraag of er een avondklok voor jongeren onder de 16 moet komen in het centrum van Lindeveen. Het debat is van 19.30 tot 21.00 uur in de aula. Er komen ongeveer 150 leerlingen en ouders. Jullie willen wethouder De Groot (Jeugd en Onderwijs) uitnodigen om in het panel te zitten. De debatclub heeft vorig jaar een regionale prijs gewonnen. Na afloop is er een hapje en een drankje. Schrijf een brief aan wethouder De Groot. Vertel wie je bent en namens wie je schrijft, beschrijf waar het debat over gaat, vertel wanneer en waar het is, vraag of hij in het panel wil zitten en vraag of hij voor 20 februari wil laten weten of hij komt.",
    ond:["Uitnodiging debat over een avondklok voor jongeren, 13 maart", "Uitnodiging", "kom naar ons debat!", "Wij willen u uitnodigen voor ons debat over de avondklok voor jongeren"],
    aanl:"Graag {nodig|nodigt|Bij ik is de persoonsvorm de stam, zonder t: ik nodig.} ik u uit voor een debat op het Lindecollege.",
    el:[["wie je bent en namens wie je schrijft", "Ik ben Yara Mahabier en ik schrijf u namens de debatclub van het Lindecollege."],
        ["waar het debat over gaat", "Wij {debatteren|debateren|Debatteren schrijf je met dubbel t, al heeft debat er maar één.} over de vraag of er een avondklok voor jongeren onder de 16 moet komen in het centrum van {Lindeveen|lindeveen|^Een plaatsnaam schrijf je met een hoofdletter.}."],
        ["wanneer en waar het is", "Het debat vindt plaats op donderdag 13 maart van 19.30 tot 21.00 uur in de aula van onze school."],
        ["of hij in het panel wil zitten", "@"],
        ["dat hij voor 20 februari laat weten of hij komt", "Wilt u mij voor 20 februari laten weten of u {komt|kom|Bij u hoort een t: u komt.}?"]],
    nee:["dat de debatclub een prijs heeft gewonnen", "dat er een hapje en een drankje is", "wat jouw mening over de avondklok is"],
    slot:"Met belangstelling zie ik uw antwoord tegemoet.",
    toon:["Wij zouden het zeer op prijs stellen als u in ons panel plaatsneemt.", "Heb je zin om ff in ons panel te zitten?", "U wordt verwacht in ons panel; als wethouder hoort u er gewoon bij te zijn.", "Het zou ons ten hoogste vereren indien u, ondanks uw ongetwijfeld overvolle agenda, wellicht zou kunnen overwegen ons met uw aanwezigheid te begunstigen."] },
  { id:"topvorm", aan:"de administratie van sportschool Topvorm", mail:"administratie@topvorm.nl", ah:"Geachte heer, mevrouw,", nm:"Daphne Kuiper",
    s:"Je had bij sportschool Topvorm een jaarabonnement tot 1 september. Op 10 juli heb je het abonnement per e-mail opgezegd. Volgens de voorwaarden van Topvorm geldt een opzegtermijn van één maand, dus je was ruim op tijd. Je kreeg geen bevestiging. Op 1 oktober is er toch weer 34 euro afgeschreven, en volgens Topvorm is je abonnement automatisch met een jaar verlengd. Je bent erg boos, want je sport inmiddels bij een andere club. Schrijf een e-mail aan de administratie. Noem je lidnummer (TV-4471), vertel wanneer en hoe je hebt opgezegd, leg uit waarom de verlenging onterecht is, vraag of ze de verlenging terugdraaien en het geld terugstorten en vraag om een bevestiging dat je abonnement is beëindigd.",
    ond:["Onterechte verlenging abonnement, lidnummer TV-4471", "Abonnement", "ik ben al gestopt!!", "Ik heb mijn abonnement op tijd opgezegd maar u heeft het toch verlengd"],
    aanl:"Ik schrijf u over de verlenging van mijn abonnement, die volgens mij onterecht is.",
    el:[["je lidnummer", "Mijn lidnummer is TV-4471."],
        ["wanneer en hoe je hebt opgezegd", "Op 10 juli heb ik mijn abonnement per e-mail {opgezegd|opgezegt|Opgezegd: de stam zeg eindigt op een g. Die zit niet in ’t kofschip, dus een d.}."],
        ["waarom de verlenging onterecht is", "Volgens uw eigen voorwaarden {geldt|geld|Het onderwerp is een opzegtermijn: stam geld + t = geldt.} een opzegtermijn van één maand, dus ik heb ruim op tijd opgezegd."],
        ["dat de verlenging wordt teruggedraaid en het geld teruggestort", "@"],
        ["een bevestiging dat het abonnement is beëindigd", "Graag ontvang ik een {bevestiging|bevesteging|Bevestiging: be-ves-ti-ging, met een i.} dat mijn abonnement is beëindigd."]],
    nee:["waar je nu sport", "hoe boos je bent", "hoe vaak je naar de sportschool ging"],
    slot:"Ik zie uw reactie binnen tien werkdagen tegemoet.",
    toon:["Ik verzoek u de verlenging ongedaan te maken en het bedrag van 34 euro terug te storten.", "Draai die verlenging ff terug en stort m’n geld terug, oké?", "Dit is gewoon diefstal, en ik wil mijn geld nu terug.", "Ik zou u, indien het u niet al te veel moeite zou kosten, heel nederig willen vragen of u wellicht zou willen overwegen het bedrag misschien terug te storten."] },
  { id:"bibliotheek", soort:"brief", aan:"de heer Jansen, directeur van Bibliotheek Lindeveen", ah:"Geachte heer Jansen,", nm:"Fenna Dijkstra",
    afz:["Lindelaan 30", "4321 AB  Lindeveen"], ontv:["Bibliotheek Lindeveen", "t.a.v. de heer P. Jansen, directeur", "Stationsplein 2", "4321 RS  Lindeveen"], datum:"Lindeveen, 4 februari 2027",
    s:"In de examenperiode, van 6 tot en met 30 mei, willen veel examenleerlingen in de bibliotheek studeren, omdat het thuis vaak te druk is. De bibliotheek is nu doordeweeks open van 10.00 tot 17.00 uur. De leerlingenraden van drie scholen in Lindeveen willen dat de bibliotheek in de examenperiode doordeweeks tot 21.00 uur open is. Vrijwilligers uit de leerlingenraden willen helpen met het toezicht. Jij vindt de stoelen in de bibliotheek oncomfortabel. Schrijf een brief aan de directeur, de heer Jansen. Vertel namens wie je schrijft, beschrijf het probleem, doe het voorstel, vertel hoe de leerlingen kunnen helpen en vraag om een reactie voor 1 maart.",
    ond:["Verzoek langere openingstijden in de examenperiode", "Openingstijden", "langer open pls", "Kan de bibliotheek in mei langer open zijn omdat wij examen hebben"],
    aanl:"Met deze brief doe ik u een voorstel voor de {examenperiode|examen periode|Examenperiode is één woord: een samenstelling.}.",
    el:[["namens wie je schrijft", "Ik schrijf u namens de leerlingenraden van drie scholen in Lindeveen."],
        ["het probleem", "Veel examenleerlingen kunnen thuis niet rustig {studeren|studderen|Studeren schrijf je met één d: stu-de-ren.}, omdat het daar te druk is."],
        ["het voorstel", "@"],
        ["hoe de leerlingen kunnen helpen", "Vrijwilligers uit de leerlingenraden {bieden|biedt|Het onderwerp is vrijwilligers: meervoud, dus bieden.} aan om te helpen met het toezicht."],
        ["een reactie voor 1 maart", "Ik ontvang graag voor 1 maart uw reactie."]],
    nee:["dat de stoelen oncomfortabel zijn", "hoeveel leden de bibliotheek heeft", "welke vakken je moet leren"],
    slot:"Wij zien uw reactie met belangstelling tegemoet.",
    toon:["Wij stellen voor de bibliotheek van 6 tot en met 30 mei doordeweeks tot 21.00 uur open te houden.", "Kunnen jullie in mei ff langer open blijven?", "De bibliotheek moet in mei gewoon tot 21.00 uur open, dat is wel het minste.", "Wij zouden het, met het allergrootste respect, ongekend waarderen als u heel misschien zou kunnen overwegen de deuren wellicht iets langer te openen."] },
  { id:"livenu", aan:"concertorganisator LiveNu", mail:"klantenservice@livenu.nl", ah:"Geachte heer, mevrouw,", nm:"Bram Peeters",
    s:"Je had via LiveNu twee kaarten gekocht voor een concert op 8 november in de Lindeveense Concerthal, voor 59 euro per stuk, plus 6 euro servicekosten. Twee dagen voor het concert kreeg je een e-mail dat het concert was afgelast. In die e-mail stond dat je je geld binnen 14 dagen terug zou krijgen. Inmiddels zijn er vijf weken voorbij en heb je niets ontvangen. Je had de kaarten gekocht als verjaardagscadeau voor je zus. Je had ook een treinkaartje gekocht dat je niet meer kon gebruiken. Schrijf een e-mail aan LiveNu. Noem je bestelnummer (LN-55190), vertel welke kaarten je hebt gekocht en voor welk bedrag, verwijs naar wat er in de e-mail beloofd werd, vraag het hele bedrag inclusief servicekosten terug en vraag wanneer je het geld kunt verwachten.",
    ond:["Terugbetaling afgelast concert, bestelnummer LN-55190", "Concert", "waar is mijn geld", "Het concert van 8 november ging niet door en ik heb mijn geld nog steeds niet terug"],
    aanl:"Ik schrijf u over de terugbetaling van kaarten voor een concert dat niet is {doorgegaan|door gegaan|Doorgaan is één werkwoord, dus doorgegaan schrijf je aan elkaar.}.",
    el:[["je bestelnummer", "Mijn bestelnummer is LN-55190."],
        ["welke kaarten en voor welk bedrag", "Ik heb twee kaarten {gekocht|gekogt|Gekocht schrijf je met ch, net als kocht.} voor het concert van 8 november in de Lindeveense Concerthal, voor in totaal 124 euro inclusief servicekosten."],
        ["wat er in de e-mail beloofd werd", "In uw e-mail stond dat ik het geld binnen 14 dagen zou {terugkrijgen|terug krijgen|Terugkrijgen is één werkwoord; in deze zin schrijf je het aan elkaar.}, maar na vijf weken heb ik nog niets ontvangen."],
        ["het hele bedrag terug, met servicekosten", "@"],
        ["wanneer je het geld kunt verwachten", "Wilt u mij laten weten wanneer ik het bedrag op mijn rekening kan verwachten?"]],
    nee:["voor wie de kaarten bedoeld waren", "dat je een treinkaartje niet kon gebruiken", "waarom het concert is afgelast"],
    slot:"Ik reken op een snelle terugbetaling.",
    toon:["Ik verzoek u het volledige bedrag van 124 euro, inclusief servicekosten, aan mij terug te betalen.", "Kan ik ff m’n 124 euro terug, ook die servicekosten?", "Geef mijn 124 euro terug, of ik zorg dat niemand meer kaartjes bij u koopt.", "Indien u het zou kunnen opbrengen, zou ik het heel bijzonder op prijs stellen als u wellicht eens zou willen kijken of er misschien iets terugbetaald zou kunnen worden."] },
  { id:"notaris", soort:"brief", aan:"mevrouw Van Beek van Notariskantoor Van Beek & Partners", ah:"Geachte mevrouw Van Beek,", nm:"Julia Smeets",
    afz:["Esdoornstraat 9", "4322 VW  Lindeveen"], ontv:["Notariskantoor Van Beek & Partners", "t.a.v. mevrouw mr. L. van Beek", "Kerkstraat 18", "4321 TU  Lindeveen"], datum:"Lindeveen, 7 oktober 2027",
    s:"Je zit in vwo 4 en je wilt later rechten studeren. In de week van 17 tot en met 21 november lopen alle leerlingen van vwo 4 een week mee bij een bedrijf of organisatie om kennis te maken met een beroep: een snuffelstage. Je wilt graag meelopen bij Notariskantoor Van Beek & Partners, omdat je wilt weten hoe het werk van een notaris er in de praktijk uitziet. Je hebt al een open dag van een rechtenopleiding bezocht. Je tante is advocaat. Na de stage moet je een verslag schrijven. Schrijf een brief aan mevrouw Van Beek. Stel jezelf voor, vertel wat een snuffelstage is en wanneer die is, leg uit waarom je juist bij dit kantoor wilt meelopen, vraag of je mag komen en vertel dat je mentor contact opneemt over de afspraken.",
    ond:["Verzoek snuffelstage 17 tot en met 21 november", "Stage", "stage?", "Ik wil graag een week bij uw kantoor meelopen omdat ik later rechten wil studeren"],
    aanl:"Ik schrijf u in verband met de snuffelstage van mijn school.",
    el:[["wie je bent", "Ik ben Julia Smeets, leerling van vwo 4 van het Lindecollege."],
        ["wat een snuffelstage is en wanneer", "Van 17 tot en met 21 {november|November|^Maanden schrijf je met een kleine letter.} lopen alle leerlingen van vwo 4 een week mee bij een bedrijf of organisatie om kennis te maken met een beroep."],
        ["waarom je bij dit kantoor wilt meelopen", "Ik wil later rechten studeren en ben {benieuwd|benieuwt|Benieuwd is een bijvoeglijk naamwoord dat op een d eindigt: een benieuwde blik.} hoe het werk van een notaris er in de praktijk uitziet."],
        ["of je mag komen", "@"],
        ["dat je mentor contact opneemt", "Als u {akkoord|accoord|Akkoord schrijf je met twee keer k.} gaat, neemt mijn mentor contact met u op over de afspraken."]],
    nee:["dat je tante advocaat is", "dat je een open dag hebt bezocht", "dat je na de stage een verslag schrijft"],
    slot:"Ik hoop van harte dat u mij deze kans wilt geven.",
    toon:["Graag zou ik in die week bij uw kantoor meelopen.", "Mag ik die week ff bij jullie meelopen?", "Ik loop die week bij uw kantoor mee; mijn school heeft dat zo bepaald.", "Ik zou mij uitermate gelukkig prijzen indien ik, al was het maar een enkel uurtje, in uw nabijheid zou mogen verkeren."] },
  { id:"fietsenstalling", soort:"brief", aan:"woningcorporatie Thuis in Lindeveen", ah:"Geachte heer, mevrouw,", nm:"Omar Haddou",
    afz:["Populierenhof 46", "4323 XY  Lindeveen"], ontv:["Woningcorporatie Thuis in Lindeveen", "t.a.v. de afdeling Wonen", "Postbus 250", "4320 BB  Lindeveen"], datum:"Lindeveen, 22 september 2027",
    s:"Je woont in de Populierenflat, een flat met 60 woningen. Er is geen fietsenstalling. Bewoners zetten hun fietsen daarom in de gang en het trappenhuis, waardoor bewoners bij brand niet snel naar buiten kunnen. De brandweer heeft daar al op gewezen. Naast de flat ligt een stuk grond van de woningcorporatie dat niet wordt gebruikt. Je hebt handtekeningen verzameld: 41 huishoudens steunen het plan. Je buurman heeft een elektrische fiets van 2.000 euro. Schrijf een brief aan de woningcorporatie. Vertel namens wie je schrijft, beschrijf het probleem, noem het risico, doe een voorstel voor een overdekte fietsenstalling naast de flat en vraag om een gesprek met een medewerker.",
    ond:["Voorstel fietsenstalling Populierenflat", "Fietsen", "fietsen in de gang!!", "Wij hebben last van fietsen in de gang en willen een fietsenstalling"],
    aanl:"Met deze brief vragen wij uw {aandacht|aandagt|Aandacht schrijf je met ch.} voor een probleem in onze flat.",
    el:[["namens wie je schrijft", "Ik schrijf u namens 41 huishoudens uit de Populierenflat."],
        ["het probleem", "Omdat er geen fietsenstalling is, staan de fietsen in de gang en het {trappenhuis|trapenhuis|Trappenhuis schrijf je met dubbel p: trap, trappen, trappenhuis.}."],
        ["het risico", "Daardoor kunnen bewoners bij brand niet snel naar buiten. De brandweer heeft daar al op {gewezen|gewesen|Gewezen schrijf je met een z, net als wijzen.}."],
        ["een voorstel voor een overdekte stalling", "@"],
        ["een verzoek om een gesprek", "Wij {gaan|gaat|Het onderwerp is wij: meervoud, dus gaan.} graag met een van uw medewerkers in gesprek over dit voorstel."]],
    nee:["wat de fiets van je buurman kost", "hoeveel woningen de flat heeft", "hoe lang je al in de flat woont"],
    slot:"Wij zien uw reactie met belangstelling tegemoet.",
    toon:["Wij stellen voor om op het lege stuk grond naast de flat een overdekte fietsenstalling te bouwen.", "Kunnen jullie ff een fietsenhok neerzetten op dat lege veldje?", "Bouw nou eindelijk eens een fietsenstalling, daar betalen wij huur voor.", "Wij zouden u, met de grootst mogelijke voorzichtigheid, willen vragen of het heel misschien ooit denkbaar zou zijn dat er wellicht een stallinkje zou kunnen komen."] },
  { id:"zonvast", aan:"reisbureau Zonvast", mail:"klantenservice@zonvast.nl", ah:"Geachte heer, mevrouw,", nm:"Nadia Bouzid",
    s:"Na je eindexamen ging je met drie vrienden een week naar Spanje met reisbureau Zonvast. Jullie betaalden samen 2.400 euro. Volgens de website had het hotel een zwembad, lag het op vijf minuten lopen van het strand en was er airconditioning op de kamer. Het zwembad bleek de hele week dicht te zijn voor onderhoud, het strand lag op twintig minuten lopen en de airconditioning werkte niet. Je klaagde op de eerste dag bij de receptie, maar er gebeurde niets. Het eten in het hotel was wel lekker. Een van je vrienden werd ziek op de terugreis. Schrijf een e-mail aan Zonvast. Noem je boekingsnummer (ZV-30675), vertel om welke reis het gaat, beschrijf wat er niet klopte, vertel wat je ter plekke hebt gedaan en vraag een vergoeding van 25 procent van de reissom.",
    ond:["Klacht over hotel, boekingsnummer ZV-30675", "Klacht", "slechtste vakantie ooit", "Het hotel in Spanje was helemaal niet zoals op de website stond"],
    aanl:"Hierbij {dien|dient|Bij ik is de persoonsvorm de stam, zonder t: ik dien.} ik een klacht in over onze reis met Zonvast.",
    el:[["je boekingsnummer", "Mijn boekingsnummer is ZV-30675."],
        ["om welke reis het gaat", "Het gaat om een reis van een week naar Spanje voor vier personen, waarvoor wij samen 2.400 euro hebben {betaald|betaalt|Betaald is hier een voltooid deelwoord (hebben betaald). Verleng het: de betaalde reis. Je hoort een d.}."],
        ["wat er niet klopte", "Het zwembad was de hele week dicht, het strand lag op twintig minuten lopen in plaats van vijf en de {airconditioning|aircondisioning|Airconditioning schrijf je met ti: air-con-di-tio-ning.} werkte niet."],
        ["wat je ter plekke hebt gedaan", "Op de eerste dag heb ik bij de receptie {geklaagd|geklaagt|Geklaagd: de stam klaag eindigt op een g. Die zit niet in ’t kofschip, dus een d.}, maar er gebeurde niets."],
        ["een vergoeding van 25 procent", "@"]],
    nee:["dat het eten lekker was", "dat een vriend ziek werd op de terugreis", "waarom jullie voor Spanje kozen"],
    slot:"Ik hoop dat wij samen tot een {oplossing|oplosing|Oplossing: op + lossing, dus dubbel s.} kunnen komen.",
    toon:["Ik verzoek u daarom ons 25 procent van de reissom, 600 euro, te vergoeden.", "Kunnen we ff 600 euro terugkrijgen?", "U betaalt ons 600 euro, want u heeft ons gewoon voorgelogen.", "Zou u, mocht u daartoe ooit genegen zijn, wellicht willen overwegen ons misschien een kleine tegemoetkoming te gunnen?"] },
  { id:"oversteek", soort:"brief", aan:"de gemeente Lindeveen, afdeling Verkeer", ah:"Geachte heer, mevrouw,", nm:"Lars van den Berg",
    afz:["Lindelaan 30", "4321 AB  Lindeveen"], ontv:["Gemeente Lindeveen", "t.a.v. de afdeling Verkeer", "Postbus 100", "4320 AC  Lindeveen"], datum:"Lindeveen, 11 oktober 2027",
    s:"Elke ochtend steken ongeveer 400 leerlingen van het Lindecollege de Rijksweg over bij de rotonde. Er is daar geen zebrapad of verkeerslicht, en auto’s rijden er vaak harder dan de toegestane 50 kilometer per uur. Vorige maand werd een leerling uit de tweede klas aangereden. Zij brak daarbij haar arm. De leerlingenraad heeft 650 handtekeningen verzameld. Langs de Rijksweg staan ook veel bomen. Jij zit zelf in de leerlingenraad en fietst elke dag over die weg. Schrijf een brief aan de gemeente. Vertel namens wie je schrijft, beschrijf de gevaarlijke situatie, noem het ongeluk als voorbeeld, doe een voorstel voor een oplossing en noem het aantal handtekeningen.",
    ond:["Verzoek veilige oversteekplaats Rijksweg", "Verkeer", "gevaarlijk!!!", "Wij willen een zebrapad bij de rotonde omdat het daar gevaarlijk is"],
    aanl:"Met deze brief wil ik u wijzen op een gevaarlijke {oversteekplaats|oversteek plaats|Oversteekplaats is één woord: een samenstelling.} bij onze school.",
    el:[["namens wie je schrijft", "Ik schrijf u namens de leerlingenraad van het Lindecollege."],
        ["de gevaarlijke situatie", "Elke ochtend {steken|steekt|Het onderwerp is leerlingen: meervoud, dus steken.} ongeveer 400 leerlingen de Rijksweg over bij de rotonde, waar geen zebrapad of verkeerslicht is en waar auto’s vaak te hard rijden."],
        ["het ongeluk", "Vorige maand {werd|werdt|De verleden tijd van worden is werd. Bij één persoon komt er niets achter.} een leerling uit de tweede klas aangereden. Zij brak daarbij haar arm."],
        ["een voorstel voor een oplossing", "@"],

      vakken: stukken.map(function(p, i){ return { id:'p' + i, max:1, hoort:[p.id], naam: niveau === 'bb' ? p.n : '' }; }),
      uitleg:'Zo bouw je een ' + soortNaam(x) + ' op: de aanhef, dan de ' + (hv ? 'inleiding' : 'aanleiding') + ' (waarom je schrijft), dan de kern (wat je wilt vertellen of vragen), dan een afsluitende zin, en als laatste de groet' + (hv ? ' en daaronder je naam' : ' met je naam') + '.',
      antwoordTekst: stukken.map(function(p){ return p.n; }).join(', ')
    };
  }
  function onderwerp(x, niveau){
    var brief = isBrief(x);
    return {
      onderdeel:'schrijfopdracht: opbouw', onderdeelNaam:'opbouw', vorm:'meerkeuze', sleutel:'on' + x.id,
      vraag: brief ? 'Wat zet je in deze brief achter Betreft:?' : 'Welke onderwerpregel past bij deze e-mail?',
      opdracht: 'Kort en precies: de lezer moet meteen weten waar het over gaat.',
      beeld: vel(x, { ondGat:true }),
      opties: x.ond.map(S), goed:0,
      uitleg:'Goed is ‘' + S(x.ond[0]) + '’: kort, en de lezer weet meteen waar het over gaat. ‘' + S(x.ond[1]) + '’ is te vaag, ‘' + S(x.ond[2]) + '’ is te informeel en ‘' + S(x.ond[3]) + '’ is een hele zin: te lang voor ' + (brief ? 'de regel Betreft' : 'een onderwerpregel') + '.',
      antwoordTekst: x.ond[0]
    };
  }

  /* ---------- 3. toon: de passende zin, of u en je ---------- */
  function toon(niveau){
    if (Math.random() < .3) return uOfJe(niveau);
    var x = kies(SIT[niveau]);
    return {
      onderdeel:'schrijfopdracht: toon', onderdeelNaam:'toon', vorm:'meerkeuze', sleutel:'to' + x.id,
      vraag:'Welke zin past op de open plek in deze ' + soortNaam(x) + ' aan ' + S(x.aan) + '?',
      opdracht: niveau === 'hv' ? 'Zakelijk en beleefd, maar wel duidelijk: wat wil je dat de lezer doet?' : 'Beleefd en duidelijk, zonder te slijmen of te eisen.',
      beeld: vel(x, { gat:x.ti }),
      opties: x.toon.map(S), goed:0,
      uitleg:'Goed is ‘' + S(x.toon[0]) + '’: beleefd en duidelijk. ‘' + S(x.toon[1]) + '’ is te informeel (je, ff), ‘' + S(x.toon[2]) + '’ is te bot: je ' + (niveau === 'hv' ? 'beschuldigt, eist of dreigt' : 'eist of dreigt') + ', en ‘' + S(x.toon[3]) + '’ is overdreven: zo onderdanig dat het niet meer serieus klinkt.',
      antwoordTekst: x.toon[0]
    };
  }
  function uOfJe(niveau){
    var l = ONTV[niveau].filter(function(e){ return e[3] !== null; }), e = kies(l), i = ONTV[niveau].indexOf(e);
    return {
      onderdeel:'schrijfopdracht: toon', onderdeelNaam:'toon', vorm:'meerkeuze', sleutel:'uj' + niveau + i,
      vraag:'Je schrijft aan ' + S(e[0]) + '. Spreek je de lezer aan met u of met je?',
      opties:['u', 'je'], goed: e[3] ? 0 : 1, vasteVolgorde:true,
      uitleg: S(e[4]) + (e[3] ? ' Houd het dan de hele tekst vol: ook uw in plaats van jouw.' : ''),
      antwoordTekst: e[3] ? 'u' : 'je'
    };
  }

  /* ---------- 4. aanhef en groet (en voor kgt en hv de vorm van de brief) ---------- */
  function aanhef(niveau){
    var r = Math.random(), conv = CONV.filter(function(c){ return c[0].indexOf(niveau === 'hv' ? 'h' : 'k') >= 0; });
    if (niveau !== 'bb' && r < (niveau === 'hv' ? .35 : .25)){
      var c = kies(conv), ci = CONV.indexOf(c);
      return {
        onderdeel:'schrijfopdracht: aanhef', onderdeelNaam:'aanhef en groet', vorm:'meerkeuze', sleutel:'cv' + ci,
        vraag: S(c[1]), opties:[c[2]].concat(c[3]).map(S), goed:0,
        uitleg: S(c[4]), antwoordTekst: c[2]
      };
    }
    var l = ONTV[niveau], e = kies(l), i = l.indexOf(e);
    if (Math.random() < .6){
      return {
        onderdeel:'schrijfopdracht: aanhef', onderdeelNaam:'aanhef en groet', vorm:'meerkeuze', sleutel:'ah' + niveau + i,
        vraag:'Je schrijft aan ' + S(e[0]) + '. Welke aanhef past?',
        opties:[e[1]].concat(e[2]).map(S), goed:0,
        uitleg:'Goed is ‘' + S(e[1]) + '’. ' + S(e[4]),
        antwoordTekst: e[1]
      };
    }
    var formeel = e[3] !== false && e[3] !== null, goed = e[3] === null ? 'Liefs,' : formeel ? GROET : 'Groetjes,';
    var fout = H(e[3] === null || !formeel ? GROET_INFORMEEL_FOUT : GROET_FORMEEL_FOUT).slice(0, 3);
    return {
      onderdeel:'schrijfopdracht: aanhef', onderdeelNaam:'aanhef en groet', vorm:'meerkeuze', sleutel:'gr' + niveau + i,
      vraag:'Je schrijft aan ' + S(e[0]) + '. Hoe sluit je af?',
      opties:[goed].concat(fout).map(S), goed:0,
      uitleg: formeel ? 'Met vriendelijke groet, past bij iedereen die je formeel aanspreekt. Daaronder zet je je naam. Afkortingen als Mvg en informele groeten als Groetjes passen daar niet bij.' : 'Aan iemand die je goed kent, groet je informeel, met ‘' + goed.replace(/,$/, '') + '’. Een deftige groet als Hoogachtend past daar niet bij.',
      antwoordTekst: goed
    };
  }

  /* ---------- 5. wat ontbreekt ---------- */
  function mist(niveau){
    var x = kies(SIT[niveau]), k = Math.random() < .17 ? -1 : tussen(0, x.el.length - 1);
    var opties = x.el.map(function(e){ return S(e[0]); }).concat(['Er ontbreekt niets.']);
    return {
      onderdeel:'schrijfopdracht: wat ontbreekt', onderdeelNaam:'wat ontbreekt', vorm:'meerkeuze', sleutel:'mi' + x.id + k,
      vraag:'Welk onderdeel uit de opdracht ontbreekt in deze ' + soortNaam(x) + '?',
      opdracht:'Lees eerst de opdracht, dan de ' + soortNaam(x) + '. Vink in gedachten af wat erin staat.',
      beeld: stapel(opdracht(x), vel(x, { weg: k >= 0 ? [k] : [] })),
      opties: opties, goed: k >= 0 ? k : opties.length - 1, vasteVolgorde:true,
      uitleg: k >= 0 ? 'De opdracht vraagt ook: ' + S(x.el[k][0]) + '. Daar staat niets over in de ' + soortNaam(x) + '. Er had bijvoorbeeld kunnen staan: ‘' + S(plat(deelTekst(x, 'e' + k))) + '’ Op het examen kost elk ontbrekend element een punt bij de inhoud.' : 'Alles wat de opdracht vraagt, staat erin: ' + S(lijstTekst(x.el.map(function(e){ return e[0]; }))) + '.',
      antwoordTekst: k >= 0 ? x.el[k][0] : 'Er ontbreekt niets.'
    };
  }

  /* ---------- 6. verbeter: een fout woord goed typen, of de goede schrijfwijze kiezen ---------- */
  function verbeter(niveau){
    if (Math.random() < .3){
      var l = LEES[niveau], z = kies(l), zi = l.indexOf(z);
      return {
        onderdeel:'schrijfopdracht: verbeter', onderdeelNaam:'verbeter de mail', vorm:'meerkeuze', sleutel:'lt' + niveau + zi,
        vraag:'Welke schrijfwijze is goed?', opdracht:'Let op hoofdletters en leestekens.',
        opties:[z[0], z[1], z[2]].map(S), goed:0,
        uitleg:'Goed is ‘' + S(z[0]) + '’. ' + S(z[3]), antwoordTekst: z[0]
      };
    }
    var x = kies(SIT[niveau]), a = kies(anns(x).filter(function(a){ return !a.hoofd; }));
    if (!a) return verbeter(niveau);
    var f = {}; f[a.k] = true;
    var fouteZin = zin(a.zin, a.deel, f), goedeZin = plat(a.zin);
    return {
      onderdeel:'schrijfopdracht: verbeter', onderdeelNaam:'verbeter de mail', vorm:'invul', sleutel:'vb' + x.id + a.k,
      vraag:'In deze zin staat één fout. Typ het foute woord goed.',
      opdracht: niveau === 'bb' ? 'Let op: een woord dat verkeerd gespeld is, of een werkwoord met een verkeerde d of t.' : 'Kijk naar de spelling en de werkwoordspelling.',
      beeld:'<div class="zinvak"><small>uit een ' + soortNaam(x) + ' aan ' + S(x.aan) + '</small>' + S(fouteZin) + '</div>',
      velden:[{ label:'het goede woord', antwoord: a.goed, type:'tekst', breed:true, toon: a.goed[0] }],
      uitleg:'‘' + S(a.fout) + '’ moet ‘' + S(a.goed[0]) + '’ zijn. ' + S(a.reden) + ' Goed is: ‘' + S(goedeZin) + '’',
      antwoordTekst: a.goed[0]
    };
  }

  /* ---------- 7. beoordeel als examinator ---------- */
  var CRIT = ['Inhoud: er ontbreekt iets wat de opdracht vraagt', 'Taalgebruik: spelling, werkwoordspelling of leestekens', 'Presentatie en conventies: de vorm, aanhef, groet of toon past niet'];
  function aftrek(n){ return n <= 0 ? 0 : n <= 2 ? 1 : n <= 4 ? 2 : 3; }
  function beoordeel(niveau){
    var x = kies(SIT[niveau]), r = Math.random(), al = anns(x);
    if (r < .4){
      var soort = kies(['inhoud', 'taal', 'conv']), o = {}, uit = '', sl = '';
      if (soort === 'inhoud'){ var k = tussen(0, x.el.length - 1); o.weg = [k]; sl = 'w' + k; uit = 'Er ontbreekt een inhoudselement: ' + S(x.el[k][0]) + '. Dat kost punten bij de inhoud. De rest van de ' + soortNaam(x) + ' is in orde.'; }
      else if (soort === 'taal'){
        var fs = H(al).slice(0, niveau === 'bb' ? 1 : tussen(1, 2)); o.fout = {};
        fs.forEach(function(a){ o.fout[a.k] = true; }); sl = 'f' + fs.map(function(a){ return a.k; }).join('');
        uit = 'Er ' + (fs.length > 1 ? 'staan spelfouten' : 'staat een spelfout') + ' in: ' + fs.map(function(a){ return '‘' + S(a.fout) + '’ moet ‘' + S(a.goed[0]) + '’ zijn'; }).join(' en ') + '. Spelfouten en fouten in de werkwoordspelling kosten punten bij het taalgebruik. Alles wat de opdracht vraagt, staat er wel in.';
      } else {
        var v = kies(isBrief(x) ? ['hoi', 'groet', 'bot', 'informeel', 'datum', 'betreft'] : ['hoi', 'groet', 'bot', 'informeel']);
        sl = v;
        if (v === 'hoi'){ o.ah = 'Hoi!'; uit = 'De aanhef ‘Hoi!’ past niet bij ' + S(x.aan) + '. Goed was ‘' + S(x.ah) + '’.'; }
        else if (v === 'groet'){ o.gr = 'Doei!'; uit = 'De groet ‘Doei!’ past niet in een formele ' + soortNaam(x) + '. Goed was ‘' + GROET + '’.'; }
        else if (v === 'bot'){ o.toonAlt = x.toon[2]; uit = 'De zin ‘' + S(x.toon[2]) + '’ is te bot voor deze lezer. Beter was: ‘' + S(x.toon[0]) + '’'; }
        else if (v === 'informeel'){ o.toonAlt = x.toon[1]; uit = 'De zin ‘' + S(x.toon[1]) + '’ is te informeel: je en ff passen niet bij de rest. Beter was: ‘' + S(x.toon[0]) + '’'; }
        else if (v === 'datum'){ o.geenDatum = true; uit = 'Plaats en datum ontbreken bovenaan de brief. Die horen in een zakelijke brief.'; }
        else { o.geenOnd = true; uit = 'De regel Betreft ontbreekt: in een zakelijke brief staat het onderwerp boven de aanhef.'; }
        uit += ' Dat valt bij de examinator onder presentatie en conventies: de vorm en de toon die bij deze tekstsoort en deze lezer horen.';
      }
      return {
        onderdeel:'schrijfopdracht: beoordelen', onderdeelNaam:'beoordeel als examinator', vorm:'meerkeuze', sleutel:'bA' + x.id + sl,
        vraag:'Je bent examinator. Op welk punt verliest deze ' + soortNaam(x) + ' punten?',
        opdracht:'Er is één soort probleem. Vergelijk met de opdracht en kijk naar spelling, vorm en toon.',
        beeld: stapel(opdracht(x), vel(x, o)),
        opties: CRIT, goed: soort === 'inhoud' ? 0 : soort === 'taal' ? 1 : 2, vasteVolgorde:true,
        uitleg: uit, antwoordTekst: CRIT[soort === 'inhoud' ? 0 : soort === 'taal' ? 1 : 2]
      };
    }
    if (r < .7){
      var n = tussen(0, Math.min(2, x.el.length - 1)), weg = H(x.el.map(function(e, i){ return i; })).slice(0, n).sort();
      return {
        onderdeel:'schrijfopdracht: beoordelen', onderdeelNaam:'beoordeel als examinator', vorm:'invul', sleutel:'bB' + x.id + weg.join(''),
        vraag:'Je bent examinator. Hoeveel inhoudselementen ontbreken in deze ' + soortNaam(x) + '?',
        opdracht:'Loop het lijstje langs en zoek bij elk element de zin waarin het staat.',
        beeld: stapel(checklist(x), vel(x, { weg:weg })),
        velden:[{ label:'aantal elementen dat ontbreekt', antwoord:n, tol:0 }],
        uitleg: n ? 'Er ' + (n > 1 ? 'ontbreken er ' + n : 'ontbreekt er een') + ': ' + S(lijstTekst(weg.map(function(i){ return x.el[i][0]; }))) + '. Elk ontbrekend element kost een punt bij de inhoud.' : 'Er ontbreekt niets: elk element uit het lijstje staat erin.',
        antwoordTekst: String(n)
      };
    }
    var max = Math.min(niveau === 'bb' ? 3 : 5, al.length), m = tussen(1, max), fs2 = H(al).slice(0, m), fo = {};
    fs2.forEach(function(a){ fo[a.k] = true; });
    var hoofdErin = fs2.some(function(a){ return a.hoofd; });
    var velden = [{ label:'aantal spelfouten', antwoord:m, tol:0 }];
    if (niveau !== 'bb') velden.push({ label:'punten aftrek voor spelling', antwoord:aftrek(m), tol:0 });
    return {
      onderdeel:'schrijfopdracht: beoordelen', onderdeelNaam:'beoordeel als examinator', vorm:'invul', sleutel:'bC' + x.id + fs2.map(function(a){ return a.k; }).sort().join(''),
      vraag:'Je bent examinator. Hoeveel spelfouten staan er in deze ' + soortNaam(x) + '?' + (niveau !== 'bb' ? ' En hoeveel punten trek je daarvoor af?' : ''),
      opdracht:'Spelfouten zijn ook fouten in de werkwoordspelling en verkeerde hoofdletters.',
      beeld: stapel(niveau !== 'bb' ? '<div class="regelkaart"><b>Zo telt de examinator bij de schrijfopdracht van het vmbo-examen</b>1 of 2 spelfouten: 1 punt aftrek. 3 of 4 spelfouten: 2 punten. 5 of meer: 3 punten.</div>' : '', vel(x, { fout:fo })),
      velden: velden,
      uitleg:'Er ' + (m > 1 ? 'staan ' + m + ' spelfouten' : 'staat 1 spelfout') + ' in: ' + fs2.map(function(a){ return '‘' + S(a.fout) + '’ moet ‘' + S(a.goed[0]) + '’ zijn'; }).join(', ') + '.' + (niveau !== 'bb' ? ' Dat is ' + aftrek(m) + (aftrek(m) === 1 ? ' punt' : ' punten') + ' aftrek.' : '') + (hoofdErin ? ' Een verkeerde hoofdletter telt ook als spelfout.' : ''),
      antwoordTekst: m + (niveau !== 'bb' ? ' spelfouten, ' + aftrek(m) + ' aftrek' : '')
    };
  }

  var SOORTEN = { inhoud:inhoud, opbouw:opbouw, toon:toon, aanhef:aanhef, mist:mist, verbeter:verbeter, beoordeel:beoordeel };
  VAKSPEL.maak({
    id:'schrijfopdracht', naam:'De schrijfopdracht', vak:'ned', kleur:'#F26749',
    hand:'Geachte heer, mevrouw,',
    lead:'Op het examen Nederlands krijg je een situatie en een opdracht: schrijf een e-mail of brief, bijvoorbeeld een klacht over een bestelling, een vraag om een stageplek of een uitnodiging. De examinator kijkt of alles erin staat wat de opdracht vraagt, of de opbouw en de toon kloppen en hoe het met je spelling zit. Hier oefen je precies dat, stap voor stap, en je beoordeelt ook zelf een mail zoals de examinator dat doet.',
    leerdoel:'Je leert een schrijfopdracht van het examen goed uitvoeren: uit de opdracht halen wat erin moet, een e-mail of brief opbouwen, de toon kiezen die bij de lezer past en je tekst nakijken op spelling.',
    hoe:[
      { kop:'Inhoud', tekst:'Elk ding dat de opdracht noemt (<b>vertel, vraag, leg uit</b>) moet erin. Wat er alleen in de situatie staat, hoeft niet.' },
      { kop:'Vorm en toon', tekst:'Aanhef, aanleiding, kern, afsluiting en groet. Schrijf je aan een bedrijf, school of instantie, dan schrijf je <b>u</b>: beleefd en duidelijk, niet bot en niet slijmerig.' },
      { kop:'Taalverzorging', tekst:'Spelfouten en fouten met d en t kosten punten. Je verbetert zinnen en telt de fouten zoals de examinator dat doet.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb', uit:'Korte e-mails met drie dingen die erin moeten, aan je mentor, een winkel of een club.' },
        { id:'kgt', naam:'vmbo-kgt en tl', uit:'De echte examenvorm: een e-mail met vier inhoudselementen, een onderwerpregel en de beoordeling van de examinator.' },
        { id:'hv', naam:'havo en vwo', uit:'De zakelijke brief en de formele e-mail: een klacht, een verzoek of een sollicitatie, met vijf inhoudselementen.' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' }, { id:'inhoud', naam:'wat moet erin' }, { id:'opbouw', naam:'opbouw' }, { id:'toon', naam:'toon' },
        { id:'aanhef', naam:'aanhef en groet' }, { id:'mist', naam:'wat ontbreekt' }, { id:'verbeter', naam:'verbeter de mail' }, { id:'beoordeel', naam:'beoordeel als examinator' } ] }
    ],
    aantal:10, minuten:9,
    maak:function(keuze, nr){
      var soort = keuze.soort === 'alles' ? kies(['inhoud', 'opbouw', 'toon', 'aanhef', 'mist', 'verbeter', 'beoordeel']) : keuze.soort;
      return SOORTEN[soort](keuze.niveau);
    },
    uitleg:{ doel:'De schrijfopdracht van het examen Nederlands: inhoud, opbouw, toon en taalverzorging van een e-mail of brief.', tijd:'twintig opgaven per ronde, of kies 10 of 30', bediening:'Kies het antwoord (of druk op 1 tot 4). Bij wat moet erin vink je alles aan wat de opdracht vraagt en druk je op Nakijken. Bij de opbouw sleep je de stukken; op een telefoon tik je een stuk en dan het vak. Bij verbeteren en beoordelen typ je het antwoord en druk je op Nakijken.' }
  });
})();
