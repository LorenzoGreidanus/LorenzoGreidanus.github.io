<style>
/* de lijnen A tot D in een grafiek: eigen kleuren die meekantelen met het thema */
:root{--lijnA:#204ECF;--lijnB:#C2410C;--lijnC:#7A3FB0;--lijnD:#0F766E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lijnA:#83A5F2;--lijnB:#F59E6B;--lijnC:#C9A2F0;--lijnD:#5FD0C0}}
:root[data-theme="dark"]{--lijnA:#83A5F2;--lijnB:#F59E6B;--lijnC:#C9A2F0;--lijnD:#5FD0C0}
/* een woordformule in de tekst */
.wf{display:inline;background:var(--kaart2);border-radius:8px;padding:2px 8px;font-weight:600;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.9}
.wf sup{font-size:.72em}
/* de situatie in een kader, en twee formules onder elkaar */
.wf-sit{max-width:62ch;width:100%;text-align:left;background:var(--kaart2);border-left:4px solid var(--spelkleur);border-radius:0 14px 14px 0;padding:12px 16px;font-size:1.02rem;line-height:1.6}
.wf-sit .wf{background:var(--kaart)}
.wf-stapel{display:grid;gap:12px;justify-items:center;width:100%}
/* de grafiek, even breed als de kaart tot 420 px */
.beeld svg.gr{width:100%;max-width:min(100%,420px);height:auto;display:block}
.gr .lab{font-size:17px;font-weight:700;paint-order:stroke;stroke:var(--kaart);stroke-width:5px;stroke-linejoin:round}
/* tabellen: smal genoeg voor een telefoon */
.beeld table.wf-t{font-variant-numeric:tabular-nums}
.beeld table.wf-t td,.beeld table.wf-t th{padding:7px 11px;min-width:0}
table.wf-invul{border-collapse:collapse;font-variant-numeric:tabular-nums;margin:0 auto}
table.wf-invul td,table.wf-invul th{border:1px solid var(--rand2);padding:6px 8px;text-align:center;font-weight:600}
table.wf-invul th{background:var(--kaart2);text-align:left}
/* de vakjes in een formule of tabel */
.wf-vak{display:grid;gap:14px;justify-items:center;width:100%}
.wf-regel{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:6px 8px;font-size:1.08rem;font-weight:600}
.wf-regel .t{white-space:nowrap;line-height:48px}
.wf-in{display:inline-flex;flex-direction:column;align-items:center}
.wf-in input{width:5.2em;height:48px;border-radius:12px;border:2px solid var(--rand2);background:var(--kaart);color:var(--ink);font:inherit;font-size:1.1rem;font-weight:600;text-align:center;padding:0 6px}
.wf-in input:focus{outline:none;border-color:var(--nadruk);box-shadow:0 0 0 4px var(--nadruk-zacht)}
.wf-in input.goed{background:var(--goed-bg);border-color:var(--goed);color:var(--goed)}
.wf-in input.fout{background:var(--fout-bg);border-color:var(--fout);color:var(--fout)}
.wf-in .vg{display:block;font-size:.78rem;color:var(--goed);font-weight:600;min-height:1.1em;line-height:1.3}
/* op een telefoon begint de formule na het =-teken op een nieuwe regel, zodat de vakjes bij elkaar blijven */
.wf-br{display:none}
@media(max-width:480px){
  .wf-br{display:block;flex-basis:100%;height:0}
  .wf-regel{font-size:1rem;gap:4px 6px}
  .wf-in input{width:4.4em;height:46px;font-size:1rem;padding:0 4px}
  .wf-regel .t{line-height:46px}
  .beeld table.wf-t{font-size:.92rem}
  .beeld table.wf-t td,.beeld table.wf-t th{padding:6px 7px}
  table.wf-invul td,table.wf-invul th{padding:4px 4px}
}
body.groot .wf-in input{height:60px;font-size:1.35rem}
body.groot .wf-regel{font-size:1.3rem}
body.groot .wf-regel .t{line-height:60px}
/* Op het werkblad (werkblad.html): het papier is altijd licht, dus ook de lijnkleuren (in de donkere stand werden ze
   pastel op wit), de grafiek niet breder dan op het scherm, en randen in plaats van vlakken: een printer laat vlakken vaak weg. */
.blad .vakspel{--lijnA:#204ECF;--lijnB:#C2410C;--lijnC:#7A3FB0;--lijnD:#0F766E;--spelkleur:#204ECF}
.blad .vakspel .beeld svg.gr{width:100%;max-width:400px}
.blad .wf{background:#fff;border:1px solid #c9cfdd;padding:1px 4px;-webkit-box-decoration-break:slice;box-decoration-break:slice}
.blad .wf-sit{background:#fff;border:1px solid #c9cfdd;border-left:4px solid #204ECF}
.blad table.wf-invul th{background:#fff}
</style>
<script src="/vangnet.js" defer></script>

<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function tussen(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function reeks(a, b){ var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }
  function rond(x){ return Math.round(x * 10000) / 10000; }
  function heel(x){ return Math.abs(x - Math.round(x)) < 1e-9; }
  function net(x){ x = Math.round(x * 100) / 100; return String(x).replace('-', '−').replace('.', ','); }
  /* bedragen met twee cijfers achter de komma als het geen heel getal is: 2,50 */
  function geld(x){ x = Math.round(x * 100) / 100; return (heel(x) ? String(x) : x.toFixed(2)).replace('.', ','); }
  function N(c, x){ return c && c.geld ? geld(x) : net(x); }
  /* met alle cijfers achter de komma (tot vier): 0,0075 en 1,728 */
  function kom(x){ return String(rond(x)).replace('-', '−').replace('.', ','); }
  /* een nette stap voor de verticale as: hoogstens tien hokjes */
  function asStap(top){ return [1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000, 2000, 5000, 10000].filter(function(q){ return top / q <= 10; })[0] || 20000; }
  function wf(t){ return '<span class="wf">' + t + '</span>'; }
  function oplopend(a, b){ return a - b; }
  var teller = 0;

  /* ---------- de situaties ----------
     y en x: de woorden in de formule; ye en xm: kort, voor de kop van een tabel; x1: enkelvoud.
     per: 'per uur'. a en b: het getal per stap en het startgetal, per niveau. zin: de situatie in
     woorden, zin2: dezelfde situatie met twee punten (havo en vwo), beide met nette getallen. */
  var CTX = [
    { id:'klus', y:'kosten in euro', ye:'euro', x:'aantal uur', xm:'uur', x1:'uur', per:'per uur', geld:true, wat:'de kosten van een klus van Klusbedrijf De Hamer',
      a:{ bb:[20, 25, 30, 40], kgt:[32.5, 37.5, 42.5, 45], hv:[38.5, 41.25, 47.5, 52.75] }, b:{ bb:[10, 15, 20, 25], kgt:[17.5, 22.5, 25, 35], hv:[27.5, 32.5, 39, 45] },
      zin:function(A, B){ return 'Klusbedrijf De Hamer rekent € ' + B + ' voorrijkosten en € ' + A + ' per uur.'; },
      zin2:function(p, q, r, s){ return 'Klusbedrijf De Hamer rekent een vast bedrag voor het voorrijden en een vast bedrag per uur. Een klus van ' + p + ' uur kost € ' + q + ', een klus van ' + r + ' uur kost € ' + s + '.'; } },
    { id:'taxi', y:'kosten in euro', ye:'euro', x:'aantal km', xm:'km', x1:'km', per:'per km', geld:true, wat:'de prijs van een taxirit',
      a:{ bb:[2, 3], kgt:[2.4, 2.6, 2.8, 3.2], hv:[2.35, 2.65, 2.85, 3.15] }, b:{ bb:[3, 4, 5, 6], kgt:[3.5, 4, 4.5], hv:[3.6, 4.2, 4.85] },
      zin:function(A, B){ return 'Een taxi rekent € ' + B + ' instaptarief en € ' + A + ' per km.'; },
      zin2:function(p, q, r, s){ return 'Een taxi rekent een instaptarief en een vast bedrag per km. Een rit van ' + p + ' km kost € ' + q + ', een rit van ' + r + ' km kost € ' + s + '.'; } },
    { id:'sport', y:'kosten in euro', ye:'euro', x:'aantal maanden', xm:'maanden', x1:'maand', per:'per maand', geld:true, wat:'wat je in totaal betaalt bij sportschool FitFit',
      a:{ bb:[20, 25, 30], kgt:[22.5, 27.5, 32.5], hv:[24.95, 29.95, 34.95] }, b:{ bb:[10, 15, 20, 30], kgt:[19.5, 25, 29], hv:[19.95, 24.95, 39.95] },
      zin:function(A, B){ return 'Bij sportschool FitFit betaal je één keer € ' + B + ' inschrijfgeld en daarna € ' + A + ' per maand.'; },
      zin2:function(p, q, r, s){ return 'Bij sportschool FitFit betaal je één keer inschrijfgeld en daarna elke maand hetzelfde bedrag. Na ' + p + ' maanden heb je in totaal € ' + q + ' betaald, na ' + r + ' maanden € ' + s + '.'; } },
    { id:'bad', y:'water in liter', ye:'liter', x:'aantal minuten', xm:'minuten', x1:'minuut', per:'per minuut', wat:'het water in een bad dat volloopt',
      a:{ bb:[6, 8, 10, 12], kgt:[7.5, 9, 12.5], hv:[8.4, 11.5, 13.2] }, b:{ bb:[10, 20, 30], kgt:[15, 25, 40], hv:[18, 35, 42] },
      zin:function(A, B){ return 'In een bad zit al ' + B + ' liter water. De kraan gaat open en er komt elke minuut ' + A + ' liter bij.'; },
      zin2:function(p, q, r, s){ return 'In een bad zit al wat water. De kraan gaat open en er komt elke minuut evenveel water bij. Na ' + p + ' minuten zit er ' + q + ' liter in, na ' + r + ' minuten ' + s + ' liter.'; } },
    { id:'plant', y:'hoogte in cm', ye:'cm', x:'aantal weken', xm:'weken', x1:'week', per:'per week', wat:'de hoogte van een zonnebloem',
      a:{ bb:[2, 3, 4, 5], kgt:[1.5, 2.5, 3.5], hv:[1.2, 1.8, 2.4] }, b:{ bb:[5, 8, 10, 12], kgt:[6, 9, 14], hv:[7.5, 11.5, 13] },
      zin:function(A, B){ return 'Een zonnebloem is ' + B + ' cm hoog als je hem in de tuin zet. Hij groeit elke week ' + A + ' cm.'; },
      zin2:function(p, q, r, s){ return 'Een zonnebloem groeit elke week evenveel. Na ' + p + ' weken is hij ' + q + ' cm hoog, na ' + r + ' weken ' + s + ' cm.'; } },
    { id:'spaar', y:'spaargeld in euro', ye:'euro', x:'aantal weken', xm:'weken', x1:'week', per:'per week', geld:true, wat:'het spaargeld van Sanne',
      a:{ bb:[5, 10, 15], kgt:[7.5, 12.5, 17.5], hv:[6.25, 8.75, 11.5] }, b:{ bb:[20, 25, 40, 50], kgt:[35, 45, 65], hv:[37.5, 52.5, 82] },
      zin:function(A, B){ return 'Sanne heeft € ' + B + ' gespaard. Ze legt er elke week € ' + A + ' bij.'; },
      zin2:function(p, q, r, s){ return 'Sanne had al wat gespaard en legt er elke week hetzelfde bedrag bij. Na ' + p + ' weken heeft ze € ' + q + ', na ' + r + ' weken € ' + s + '.'; } },
    { id:'fiets', y:'huur in euro', ye:'euro', x:'aantal dagen', xm:'dagen', x1:'dag', per:'per dag', geld:true, wat:'de huur van een fiets bij De Trapper',
      a:{ bb:[8, 9, 10, 12], kgt:[8.5, 11.5, 13.5], hv:[9.75, 12.25, 14.5] }, b:{ bb:[5, 10, 15], kgt:[7.5, 12.5, 17.5], hv:[6.5, 9.95, 14.95] },
      zin:function(A, B){ return 'Bij fietsverhuur De Trapper betaal je € ' + B + ' reserveringskosten en € ' + A + ' per dag.'; },
      zin2:function(p, q, r, s){ return 'Bij fietsverhuur De Trapper betaal je vaste reserveringskosten en een vast bedrag per dag. Voor ' + p + ' dagen betaal je € ' + q + ', voor ' + r + ' dagen € ' + s + '.'; } },
    /* dalend: vanaf vmbo-kgt */
    { id:'kaars', d:true, y:'lengte in cm', ye:'cm', x:'aantal uur', xm:'uur', x1:'uur', per:'per uur', wat:'de lengte van een brandende kaars',
      a:{ kgt:[1.5, 2, 2.5], hv:[0.8, 1.2, 1.6] }, b:{ kgt:[20, 24, 30], hv:[18, 22.5, 25] },
      zin:function(A, B){ return 'Een nieuwe kaars is ' + B + ' cm lang. Als hij brandt, wordt hij elk uur ' + A + ' cm korter.'; },
      zin2:function(p, q, r, s){ return 'Een kaars brandt en wordt elk uur evenveel korter. Na ' + p + ' uur is hij nog ' + q + ' cm lang, na ' + r + ' uur nog ' + s + ' cm.'; } },
    { id:'accu', d:true, y:'lading in procent', ye:'procent', x:'aantal uur', xm:'uur', x1:'uur', per:'per uur', wat:'de lading van een telefoon tijdens het gamen',
      a:{ kgt:[5, 8, 10], hv:[6, 7.5, 12.5] }, b:{ kgt:[80, 90, 100], hv:[85, 95, 100] },
      zin:function(A, B){ return 'De accu van een telefoon is voor ' + B + ' procent vol. Tijdens het gamen gaat er elk uur ' + A + ' procent af.'; },
      zin2:function(p, q, r, s){ return 'Tijdens het gamen gaat de lading van een telefoon elk uur evenveel procent omlaag. Na ' + p + ' uur is de accu nog voor ' + q + ' procent vol, na ' + r + ' uur voor ' + s + ' procent.'; } },
    { id:'zwembad', d:true, y:'water in m³', ye:'m³', x:'aantal uur', xm:'uur', x1:'uur', per:'per uur', wat:'het water in een zwembad dat wordt leeggepompt',
      a:{ kgt:[6, 8, 12, 15], hv:[7.5, 12.5, 18] }, b:{ kgt:[60, 90, 120], hv:[75, 150, 225] },
      zin:function(A, B){ return 'In een zwembad zit ' + B + ' m³ water. Een pomp haalt er elk uur ' + A + ' m³ uit.'; },
      zin2:function(p, q, r, s){ return 'Een pomp haalt elk uur evenveel water uit een zwembad. Na ' + p + ' uur zit er nog ' + q + ' m³ in, na ' + r + ' uur nog ' + s + ' m³.'; } },
    { id:'ov', d:true, y:'saldo in euro', ye:'euro', x:'aantal ritten', xm:'ritten', x1:'rit', per:'per rit', geld:true, wat:'het saldo op een ov-kaart',
      a:{ kgt:[1.5, 2.5, 3.5], hv:[1.85, 2.35, 3.15] }, b:{ kgt:[20, 25, 30], hv:[20, 30, 40] },
      zin:function(A, B){ return 'Op je ov-kaart staat € ' + B + '. Elke busrit naar school kost € ' + A + '.'; },
      zin2:function(p, q, r, s){ return 'Je gaat met de bus naar school en elke rit kost evenveel. Na ' + p + ' ritten staat er nog € ' + q + ' op je ov-kaart, na ' + r + ' ritten € ' + s + '.'; } }
  ];
  /* recht evenredig: geen startgetal */
  var EVEN = [
    { id:'bios', y:'prijs in euro', ye:'euro', x:'aantal kaartjes', xm:'kaartjes', x1:'kaartje', per:'per kaartje', geld:true, wat:'de prijs van bioscoopkaartjes',
      a:{ bb:[6, 8, 9, 12], kgt:[8.5, 9.5, 11.5, 12.5] }, zin:function(A){ return 'Een bioscoopkaartje kost € ' + A + '. Er zijn geen andere kosten.'; } },
    { id:'loon', y:'loon in euro', ye:'euro', x:'aantal uur', xm:'uur', x1:'uur', per:'per uur', geld:true, wat:'wat je verdient met je bijbaan',
      a:{ bb:[10, 11, 12, 14], kgt:[11.5, 12.25, 13.75] }, zin:function(A){ return 'Met je bijbaan verdien je € ' + A + ' per uur.'; } },
    { id:'fietser', y:'afstand in km', ye:'km', x:'aantal uur', xm:'uur', x1:'uur', per:'per uur', wat:'de afstand die een fietser aflegt',
      a:{ bb:[12, 15, 20], kgt:[14, 16, 18] }, zin:function(A){ return 'Een fietser rijdt de hele tijd ' + A + ' km per uur.'; } },
    { id:'appels', y:'prijs in euro', ye:'euro', x:'aantal kilo', xm:'kilo', x1:'kilo', per:'per kilo', geld:true, wat:'de prijs van appels op de markt',
      a:{ bb:[2, 3, 4], kgt:[1.8, 2.4, 3.6] }, zin:function(A){ return 'Appels kosten op de markt € ' + A + ' per kilo.'; } }
  ];

  function xmVan(c, x){ return x === 1 ? c.x1 : c.xm; }
  function lijn(niveau, dalendKans){
    var dal = niveau !== 'bb' && Math.random() < (dalendKans == null ? 0.3 : dalendKans);
    var c = kies(CTX.filter(function(k){ return !!k.d === dal; }));
    return { c:c, a:kies(c.a[niveau]), b:kies(c.b[niveau]), d:!!c.d };
  }
  function yv(l, x){ return rond(l.d ? l.b - l.a * x : l.a * x + l.b); }
  function formule(c, a, b, d){
    var A = N(c, a), B = N(c, b);
    if (d) return c.y + ' = ' + B + ' − ' + A + ' × ' + c.x;
    if (!b) return c.y + ' = ' + A + ' × ' + c.x;
    return c.y + ' = ' + A + ' × ' + c.x + ' + ' + B;
  }
  function F(l){ return formule(l.c, l.a, l.b, l.d); }

  /* de uitleg die vaak terugkomt: het getal per stap uit twee punten, en het startgetal bij 0 */
  function stapUitleg(l, x0, y0, x1, y1){
    var c = l.c, dx = rond(x1 - x0), dy = rond(Math.abs(y1 - y0));
    var t = 'Van ' + net(x0) + ' naar ' + net(x1) + ' ' + xmVan(c, x1) + ' ' + (l.d ? 'gaat er ' + N(c, dy) + ' af' : 'komt er ' + N(c, dy) + ' bij');
    if (dx === 1) return t + ': dat is het getal per stap (' + N(c, l.a) + ' ' + c.per + ').';
    return t + '. Dat is voor ' + net(dx) + ' ' + c.xm + ' samen, dus ' + c.per + ' is het ' + N(c, dy) + ' ÷ ' + net(dx) + ' = ' + N(c, l.a) + ': het getal per stap.';
  }
  function startUitleg(l, x0, y0){
    var c = l.c;
    if (!x0) return 'Bij 0 ' + c.xm + ' hoort ' + N(c, l.b) + ': dat is het startgetal.';
    return 'Het startgetal hoort bij 0 ' + c.xm + '. Reken terug: ' + N(c, y0) + (l.d ? ' + ' : ' − ') + net(x0) + ' × ' + N(c, l.a) + ' = ' + N(c, l.b) + '. Het startgetal is dus niet ' + N(c, y0) + ', want dat hoort bij ' + net(x0) + ' ' + xmVan(c, x0) + '.';
  }

  /* ---------- de vakjes: een formule of tabel met invulvakjes erin ----------
     o.html heeft {0}, {1}, ... waar een vakje komt; o.vakken[i] = { a, ook, tol, naam, toon }.
     Een komma of punt mag, en 4, 4,00 en 4.00 zijn allemaal goed. */
  function lees(t, api){ return api.getal(String(t == null ? '' : t).replace(/[€\s]/g, '').replace(/−/g, '-')); }
  function vakjes(o){
    return {
      onderdeel:o.onderdeel, onderdeelNaam:o.onderdeelNaam, vraag:o.vraag, opdracht:o.opdracht || 'Vul de vakjes in. Een komma of een punt mag.',
      beeld:o.beeld, uitleg:o.uitleg, antwoordTekst:o.antwoordTekst, sleutel:o.sleutel, vorm:'eigen',
      teken:function(el, api){
        el.innerHTML = '<div class="wf-vak">' + o.html.replace(/\{(\d+)\}/g, function(m, i){
          var v = o.vakken[+i];
          return '<span class="wf-in"><input inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" data-i="' + i + '" aria-label="' + S(v.naam) + '"><span class="vg"></span></span>';
        }) + '</div>';

        beeld:tabelHtml({ xm:'x', ye:'y' }, q.xs, q.ys), html:'<div class="wf-regel"><span class="t">bij x = 5: y =</span>{0}</div>', vakken:[{ a:y5, naam:'y bij x is 5', toon:net(y5) }], antwoordTekst:net(y5),
        uitleg:hoe + ' Er komt hier niet steeds evenveel bij, dus gewoon het laatste verschil nog eens erbij tellen is fout.' }));
    }
    var v = kies([
      function(){ var p = kies([[200, 1.5, 2], [200, 1.5, 3], [500, 1.2, 2], [625, 1.2, 3], [300, 2, 4], [800, 0.5, 3], [2500, 0.8, 2], [1250, 0.8, 3]]);
        var y = rond(p[0] * Math.pow(p[1], p[2])); return { f:'N = ' + p[0] + ' × ' + net(p[1]) + '<sup>t</sup>', met:'N het aantal en t de tijd in uren', vr:'Bereken N als t = ' + p[2] + '.', l:'N =', a:y,
          uit:'Vul t = ' + p[2] + ' in: ' + net(p[1]) + '<sup>' + p[2] + '</sup> = ' + kom(Math.pow(p[1], p[2])) + ', en ' + p[0] + ' × ' + kom(Math.pow(p[1], p[2])) + ' = ' + net(y) + '. Eerst de macht, dan keer ' + p[0] + '. Niet ' + net(p[1]) + ' × ' + p[2] + ' doen: de t is een exponent.' }; },

    return vakjes(Object.assign(basis, { sleutel:'hf' + v.f + v.vr, vraag:v.vr, beeld:'<div class="wf-sit">' + wf(v.f) + '<br>met ' + v.met + '.</div>',

  }
  function verband(niveau){

  function vergelijken(niveau){

      var xmax = Math.ceil(v.xs * 2 / 2) * 2, top = Math.max(kostA(v, xmax), kostB(v, xmax)), ys = asStap(top);

      var fa = function(x){ return kostA(v, x); }, fb = function(x){ return kostB(v, x); };

    if (vanaf){
      var m = Math.ceil(v.xs), m0 = m - 1;

    var yA = kostA(v, X), yB = kostB(v, X), gi = Math.abs(yA - yB) < 1e-6 ? 2 : yA < yB ? 0 : 1;

    return Object.assign(basis, { vorm:'meerkeuze', vasteVolgorde:true, sleutel:'vm' + c.id + v.a1 + '_' + v.a2 + '_' + v.b1 + '_' + v.xs + '_' + X, beeld:beeld,

  function kaarsen(basis){

    },
