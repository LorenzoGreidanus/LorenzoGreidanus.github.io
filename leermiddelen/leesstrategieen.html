<!DOCTYPE html>
<html lang="nl">
<head>
<!-- Leesstrategieën, versie 1.0: op vakspel.js, met de teksten uit de leesbank (leesbank.js, leesteksten.js, leesblad.js) -->

<title>Leesstrategieën &middot; meneer Greidanus</title>
<meta name="description" content="Oefen verkennend, globaal, zoekend, nauwkeurig, kritisch en studerend lezen met echte teksten: folders, berichten, bronnen en artikelen. Ook onderwerp, hoofdgedachte, signaalwoorden, verwijswoorden, samenvatten en tussen de regels lezen.">
<meta property="og:type" content="website">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M47.5 12.6 C71.4 10.9 89.6 21.7 90.5 44 C91.4 67.9 79.1 88.5 55.9 89.5 C32 90.4 12.1 80.8 12.8 56.9 C13.5 33 24.4 14.3 47.5 12.6Z' fill='%23204ECF'/><g transform='translate(50 51) scale(2.2) translate(-12 -12)' fill='none' stroke='%23FBF6F1' stroke-width='2.25' stroke-linecap='round' stroke-linejoin='round'><path d='M3 5.5c2.7-1 5.4-.8 8 .7v13c-2.6-1.5-5.3-1.7-8-.7z'/><path d='M11 6.2c2.6-1.5 5.3-1.7 8-.7v13c-2.7-1-5.4-.8-8 .7'/></g></svg>">
<link rel="stylesheet" href="vakspel.css">
<link rel="stylesheet" href="basis.css">
<link rel="stylesheet" href="spel.css">
<style>
/* ---------- de tekst bij de vragen ---------- */
.ls-tekst{width:100%;text-align:left;background:var(--kaart);border:1.5px solid var(--rand2);border-radius:16px}
.ls-tekst>summary{list-style:none;cursor:pointer;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:12px 16px 8px;min-height:44px}
.ls-tekst>summary::-webkit-details-marker{display:none}
.ls-tekst>summary .eyebrow{margin:0}
.ls-klap{margin-left:auto;font-size:.78rem;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.ls-tekst[open] .ls-klap .dicht,.ls-tekst:not([open]) .ls-klap .open{display:none}
.ls-klok{font-size:.8rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px}
.ls-klok svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.ls-klok.over{color:var(--crab)}
.ls-body{padding:2px 14px 14px}
.ls-body .lb-tekst{border:0;padding:0;margin:0}
.ls-body .lb-zo{margin-bottom:12px}
/* de vraag bij een rij uit een raster of een zoekvraag */
.ls-rij{display:block;margin:10px 0 0;padding:10px 14px;border-radius:12px;background:var(--kaart2);font-weight:600;font-size:1.02rem;color:var(--ink)}
#scherm-spel .opties.ls-kort{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
/* een eigen antwoord: invullen, vergelijken met het voorbeeld, zelf beoordelen */
.ls-eigen{display:grid;gap:10px;text-align:left;width:100%}
.ls-eigen label{font-size:.85rem;font-weight:600;color:var(--muted)}
.ls-eigen textarea,.ls-eigen input{width:100%;box-sizing:border-box;border:1.5px solid var(--rand2);border-radius:12px;background:var(--kaart);color:var(--ink);padding:10px 12px;font:inherit;font-size:1rem;min-height:48px}
.ls-eigen textarea{min-height:96px;resize:vertical}
.ls-eigen textarea:focus,.ls-eigen input:focus{outline:none;border-color:var(--ocean)}
.ls-tel{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ls-tel.te{color:var(--crab);font-weight:600}
.ls-begin{font-size:.95rem;color:var(--muted)}
.ls-schema{display:grid;gap:8px}
.ls-schema > div{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center}
.ls-model{border-left:4px solid var(--goed);background:var(--kaart2);border-radius:0 12px 12px 0;padding:10px 14px;font-size:.95rem}
.ls-model b{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ls-model ul{margin:4px 0 0;padding-left:18px}
.ls-zelf{font-weight:600;font-size:.95rem}
/* markeren: de woorden van een alinea als knoppen */
.ls-woorden{display:flex;flex-wrap:wrap;gap:4px;line-height:1.5;font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.ls-woorden button{border:0;background:none;color:var(--ink);font:inherit;padding:2px 3px;border-radius:5px;min-height:36px;cursor:pointer}
.ls-woorden button:hover{background:var(--kaart2)}
.ls-woorden button[aria-pressed="true"]{background:#f8d48f;color:#14224C}
.ls-woorden button.goed{box-shadow:0 0 0 2px var(--goed)}
.ls-woorden button.fout{box-shadow:0 0 0 2px var(--crab)}
/* twee kolommen op een breed scherm: de tekst links, de vraag rechts */
#scherm-spel .opties{grid-template-columns:1fr}
@media (min-width:880px){
  #scherm-spel .kaart{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:28px;align-items:start}
  #scherm-spel .kaart>*{grid-column:2;min-width:0}
  #scherm-spel .kaart>.beeld{grid-column:1;grid-row:1 / span 8;position:sticky;top:78px;margin:0;display:block;max-height:calc(100vh - 100px);overflow:auto;border-radius:16px}
  #scherm-spel .onderdeel,#scherm-spel .vraag,#scherm-spel .opdracht{text-align:left}
  #scherm-spel .verder{justify-content:flex-start}
  .ls-tekst>summary{cursor:default}
  .ls-tekst .ls-klap{display:none}
}
@media (max-width:879px){
  #scherm-spel .kaart{display:flex;flex-direction:column}
  #scherm-spel .kaart>.onderdeel{order:0}
  #scherm-spel .kaart>.beeld{order:1;display:block;margin:0 0 14px}
  #scherm-spel .kaart>*{order:2}
  .ls-schema > div{grid-template-columns:1fr}
}
</style>
<script src="/vangnet.js" defer></script>
</head>
<body>
<div id="vakspel"></div>
<script src="leesbank.js"></script>
<script src="leesblad.js"></script>
<script src="leesteksten.js"></script>
<script src="vakspel.js"></script>
<script>
(function(){
  'use strict';
  var S = VAKSPEL.schoon, H = VAKSPEL.husselen, B = LEESBANK, O = LEESBLAD.opmaak;
  function $(id){ return document.getElementById(id); }
  var WERKBLAD = /[?&]werkblad=1/.test(location.search);

  /* ---------- welke tekst: het doel op het niveau, niet net gehad ---------- */
  var recent = [];
  function kiesTekst(doel, niv){
    var kan = B.TEKSTEN.filter(function(t){ return t.niv === niv && (doel === 'alles' ? true : (t.taken[doel] || []).length); });
    if (!kan.length) kan = B.TEKSTEN.filter(function(t){ return doel === 'alles' || (t.taken[doel] || []).length; });
    var vers = kan.filter(function(t){ return recent.indexOf(t.id) < 0; });
    var lijst = vers.length ? vers : kan, t = lijst[Math.floor(Math.random() * lijst.length)];
    recent.push(t.id); if (recent.length > Math.max(1, Math.min(8, kan.length - 1))) recent.shift();
    return t;
  }

  /* ---------- de tekst links (of boven) met het kaartje en een klokje ---------- */
  var KLOK = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg>';
  var tekstOpen = true, start = 0, klokTik = null;
  function beeldHtml(t, doel, eerste){
    var d = B.doel(doel), metKlok = doel === t.strat && (t.tijd || t.strat === 'zoekend');
    return '<details class="ls-tekst" id="lsTekst"' + (eerste || tekstOpen ? ' open' : '') + '><summary><span class="eyebrow">' + S(B.VORMEN[t.vorm] || t.vorm) + ' · ' + S(t.niv) + '</span>' +
      (metKlok ? '<span class="ls-klok" id="lsKlok" data-max="' + (t.tijd || 0) + '">' + KLOK + '<span>0:00</span></span>' : '') +
      '<span class="ls-klap"><span class="open">tekst inklappen</span><span class="dicht">tekst laten zien</span></span></summary>' +
      '<div class="ls-body">' + (eerste ? LEESBLAD.zoHtml(doel) : '') + LEESBLAD.tekstHtml(t) + '</div></details>';
  }
  function tijd(s){ return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function zetKlok(){
    clearInterval(klokTik);
    var k = $('lsKlok'); if (!k) return;
    var max = Number(k.getAttribute('data-max')) || 0;
    function tik(){ var s = Math.floor((Date.now() - start) / 1000), el = $('lsKlok'); if (!el){ clearInterval(klokTik); return; }
      el.querySelector('span').textContent = tijd(s) + (max ? ' van ' + tijd(max) : ''); el.classList.toggle('over', !!max && s > max); }
    tik(); klokTik = setInterval(tik, 1000);
  }
  function naTekenen(){
    var tv = $('lsTekst'); if (!tv) return;
    tv.addEventListener('toggle', function(){ tekstOpen = tv.open; });
    tv.querySelector('summary').addEventListener('click', function(e){ if (matchMedia('(min-width:880px)').matches) e.preventDefault(); });
    zetKlok();
  }

  /* ---------- een eigen antwoord: invullen, het voorbeeld zien, zelf zeggen of het klopt ---------- */
  function zelfNakijken(api, vak, modelHtml, leeg){
    var knop = api.knop('Vergelijk met het voorbeeld', function(){
      if (leeg()){ api.uit('Schrijf eerst je eigen antwoord op.'); return; }
      api.uit('');
      [].forEach.call(vak.querySelectorAll('textarea, input'), function(x){ x.readOnly = true; });
      knop.remove();
      var m = document.createElement('div'); m.className = 'ls-model'; m.innerHTML = '<b>Zo kan het</b>' + modelHtml;
      var z = document.createElement('p'); z.className = 'ls-zelf'; z.textContent = 'Klopt jouw antwoord in de kern met het voorbeeld?';
      vak.querySelector('.ls-eigen').appendChild(m); vak.querySelector('.ls-eigen').appendChild(z);
      api.knop('Ja, in de kern wel', function(){ api.klaar(true, ''); });
      api.knop('Nee, nog niet', function(){ api.klaar(false, 'Vergelijk de woorden in het voorbeeld met die van jou. Wat mist er bij jou?'); }, true);
    });
  }
  function telWoorden(s){ return String(s || '').split(/\s+/).filter(Boolean).length; }

  /* ---------- de taken van een tekst als opgaven ---------- */
  function opgaven(t, doel){
    var d = B.doel(doel), prep = LEESBLAD.bereid(t, doel), uit = [];
    function o(x){ x.onderdeel = 'leesstrategie: ' + doel; x.onderdeelNaam = d.naam; x.tekst = t; return x; }
    prep.ops.forEach(function(p){
      var a = p.o, u = a.u ? '<p>' + O(a.u) + '</p>' : '';
      if (a.t === 'keuze') uit.push(o({ vorm:'meerkeuze', vraag:O(a.v), opties:p.orde.map(function(i){ return O(a.o[i]); }), goed:p.goed, vasteVolgorde:true, uitleg:u, antwoordTekst:a.o[0] }));
      else if (a.t === 'raster') a.rijen.forEach(function(r, i){
        uit.push(o({ vorm:'meerkeuze', vraag:O(a.v), opdracht:'<span class="ls-rij">' + O(r.z) + '</span>', opties:a.kol.map(O), goed:r.g, vasteVolgorde:true, kort:true,
          uitleg:(r.al != null ? '<p>Kijk in alinea ' + r.al + '.</p>' : '') + u, antwoordTekst:a.kol[r.g] }));
      });
      else if (a.t === 'koppel') uit.push(o({ vorm:'sleep', vraag:O(a.v), kaarten:p.rechts.map(function(x, j){ return { id:'k' + j, tekst:O(x.r) }; }),
        vakken:a.links.map(function(l, i){ var j = -1; p.rechts.forEach(function(x, k){ if (x.i === i) j = k; }); return { id:'v' + i, naam:O(l), hoort:['k' + j], max:1 }; })
          /* het kopje dat overblijft krijgt een eigen vak: nakijken kan pas als alle kaartjes liggen */
          .concat((a.extra || []).length ? [{ id:'over', naam:'Blijft over', hoort:p.rechts.map(function(x, k){ return x.i < 0 ? 'k' + k : null; }).filter(Boolean), max:a.extra.length }] : []),
        sleepuit:(a.extra || []).length ? 'Sleep elk kaartje naar het vak waar het hoort. Wat nergens past, gaat naar Blijft over.' : '', uitleg:u }));
      else if (a.t === 'volgorde') uit.push(o({ vorm:'sleep', vraag:O(a.v), kaarten:p.stappen.map(function(x){ return { id:'s' + x.i, tekst:O(x.s) }; }), vasteVolgorde:true,
        vakken:a.stappen.map(function(s, i){ return { id:'p' + i, hoort:['s' + i], max:1 }; }), sleepuit:'Zet de kaartjes op volgorde: wat komt eerst?', uitleg:u }));
      else if (a.t === 'zoek') a.vragen.forEach(function(q, i){
        uit.push(o({ vorm:'eigen', vraag:O(q.v), opdracht:i ? '' : (/stopwatch/i.test(a.v) ? 'Het klokje bij de tekst loopt mee. Zoek zo snel als je kunt.' : O(a.v)), sleutelwoord:q.s, antwoordTekst:q.a[0], teken:function(vak, api){
          vak.innerHTML = '<div class="ls-eigen"><label for="lsZoek">Jouw antwoord</label><input id="lsZoek" type="text" autocomplete="off" spellcheck="false"></div>';
          var veld = $('lsZoek'), goed = q.a.map(LEESBLAD.normaal);
          veld.addEventListener('keydown', function(e){ if (e.key === 'Enter') kijk(); });
          function kijk(){
            if (!api.bezig()) return;
            var n = LEESBLAD.normaal(veld.value); if (!n){ api.uit('Vul eerst iets in.'); return; }
            var ok = goed.indexOf(n) >= 0 || goed.some(function(g){ return g.length >= 3 && (n.indexOf(g) >= 0); });
            veld.readOnly = true;
            api.klaar(ok, '<p>Sleutelwoord: <b>' + S(q.s) + '</b>. ' + (ok ? 'Goed gevonden.' : 'Het antwoord is: <b>' + O(q.a[0]) + '</b>. Zoek het woord ' + S(q.s) + ' op en lees alleen daaromheen.') + '</p>');
          }
          api.knop('Nakijken', kijk);
          setTimeout(function(){ veld.focus({ preventScroll:true }); }, 30);
        } }));
      });
      else if (a.t === 'open') uit.push(o({ vorm:'eigen', vraag:O(a.v), antwoordTekst:a.m, teken:function(vak, api){
        vak.innerHTML = '<div class="ls-eigen">' + (a.b ? '<span class="ls-begin">' + O(a.b) + ' …</span>' : '') +
          '<label for="lsOpen">Jouw antwoord' + (a.max ? ' (hoogstens ' + a.max + ' woorden)' : '') + '</label><textarea id="lsOpen"></textarea>' + (a.max ? '<span class="ls-tel" id="lsTel">0 van ' + a.max + ' woorden</span>' : '') + '</div>';
        var veld = $('lsOpen');
        if (a.max) veld.addEventListener('input', function(){ var n = telWoorden(veld.value), t = $('lsTel'); t.textContent = n + ' van ' + a.max + ' woorden'; t.classList.toggle('te', n > a.max); });
        zelfNakijken(api, vak, '<p>' + (a.b ? O(a.b) + ' ' : '') + O(a.m) + '</p>' + u, function(){ return !veld.value.trim(); });
      } }));
      else if (a.t === 'schema') uit.push(o({ vorm:'eigen', vraag:O(a.v), antwoordTekst:a.m.join(', '), teken:function(vak, api){
        vak.innerHTML = '<div class="ls-eigen"><div class="ls-schema">' + a.vakken.map(function(v, i){
          return '<div><label for="lsSc' + i + '">' + O(v) + '</label><input id="lsSc' + i + '" type="text" autocomplete="off"' + (a.vb === i ? ' value="' + S(a.m[i]) + '" readonly' : '') + '></div>';
        }).join('') + '</div></div>';
        zelfNakijken(api, vak, '<ul>' + a.vakken.map(function(v, i){ return '<li>' + O(v) + ': ' + O(a.m[i]) + '</li>'; }).join('') + '</ul>' + u,
          function(){ return [].some.call(vak.querySelectorAll('input:not([readonly])'), function(x){ return !x.value.trim(); }); });
      } }));
      else if (a.t === 'markeer') uit.push(o({ vorm:'eigen', vraag:O(a.v), opdracht:'Tik ' + (a.n === 1 ? 'één woord' : a.n + ' woorden') + ' aan.', antwoordTekst:a.goed.join(', '), teken:function(vak, api){
        var woorden = t.alineas[a.al].replace(/\*\*|__/g, '').split(/\s+/);
        vak.innerHTML = '<div class="ls-eigen"><div class="ls-woorden">' + woorden.map(function(w, i){ return '<button type="button" aria-pressed="false" data-i="' + i + '">' + S(w) + '</button>'; }).join('') + '</div></div>';
        var knop;
        vak.querySelector('.ls-woorden').addEventListener('click', function(e){
          var b = e.target.closest('button'); if (!b || !api.bezig()) return;
          var aan = b.getAttribute('aria-pressed') === 'true';
          if (!aan && vak.querySelectorAll('[aria-pressed="true"]').length >= a.n) return api.uit('Je hebt er al ' + a.n + '. Tik er een uit om te wisselen.');
          b.setAttribute('aria-pressed', String(!aan)); api.uit('');
          knop.disabled = vak.querySelectorAll('[aria-pressed="true"]').length !== a.n;
        });
        var goed = a.goed.map(function(g){ return g.toLowerCase(); });
        function past(w){ w = w.toLowerCase().replace(/[^a-zà-ÿ0-9-]/g, ''); return w.length > 1 && goed.some(function(g){ return g === w || g.split(/\s+/).indexOf(w) >= 0; }); }
        knop = api.knop('Nakijken', function(){
          var gekozen = [].slice.call(vak.querySelectorAll('[aria-pressed="true"]')), ok = true;
          gekozen.forEach(function(b){ var p = past(b.textContent); b.classList.add(p ? 'goed' : 'fout'); if (!p) ok = false; });
          api.klaar(ok, '<p>Kernwoorden zijn de woorden die je nodig hebt om de stof te onthouden, zoals: <b>' + a.goed.map(S).join(', ') + '</b>.</p>' + u);
        });
        knop.disabled = true;
      } }));
    });
    return uit;
  }

  /* ---------- de rij: alle opgaven van een tekst, dan een nieuwe tekst ---------- */
  var rij = [], laatsteNr = 0, rijSleutel = '';
  function vulRij(keuze){
    var doel = keuze.soort || 'alles', t = kiesTekst(doel, keuze.niveau || '2F');
    var d = doel === 'alles' ? t.strat : doel;
    rij = opgaven(t, d);
    rij.forEach(function(x, j){ x.eerste = j === 0; x.doel = d; x.nr = j; x.van = rij.length; });
    start = Date.now(); tekstOpen = true;
  }

  var STRAT = B.DOELEN.filter(function(d){ return d.soort === 'strategie'; }), VAARD = B.DOELEN.filter(function(d){ return d.soort === 'vaardigheid'; });
  VAKSPEL.maak({
    begeleid:false,
    id:'leesstrategie', naam:'Leesstrategieën', vak:'ned', kleur:'#204ECF',
    hand:'kijk, zoek, lees precies',
    lead:'Echte teksten: een folder van het zwembad, een bericht op sociale media, vier bronnen voor je werkstuk, een leertekst. Bij elke tekst doe je de strategie echt: in 30 seconden een bron kiezen, met een sleutelwoord zoeken, elk woord wegen, feit en mening scheiden of een schema maken.',
    leerdoel:'Je leert bij elke tekst de goede manier van lezen te kiezen en die ook echt te doen.',
    hoe:[
      { kop:'Het kaartje', tekst:'Boven de tekst staat <b>Zo lees je</b>: drie stappen voor deze strategie. Lees ze eerst.' },
      { kop:'De tekst', tekst:'Op een breed scherm staat de tekst links, op een telefoon erboven. Bij zoekend en globaal lezen loopt er een klokje mee.' },
      { kop:'De opdrachten', tekst:'Kies, sleep, typ of tik woorden aan. Bij een eigen antwoord zie je daarna een voorbeeld en zeg je zelf of het klopt.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'2F', items:B.NIVEAUS.map(function(n){ return { id:n.id, naam:n.naam, uit:n.uit }; }) },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[{ id:'alles', naam:'alle strategieën', uit:'Elke tekst met zijn eigen strategie.' }]
        .concat(STRAT.map(function(d){ return { id:d.id, naam:d.naam.replace(/ lezen$/, ''), uit:d.kort + '.' }; }))
        .concat(VAARD.map(function(d){ return { id:d.id, naam:d.naam, uit:d.kort }; })) }
    ],
    aantal:10, minuten:12,
    maak:function(keuze, nr){
      if (nr === 1 && laatsteNr !== 1) rij = [];
      laatsteNr = nr;
      var sl = keuze.soort + '|' + keuze.niveau;
      if (sl !== rijSleutel){ rij = []; rijSleutel = sl; }
      if (!rij.length) vulRij(keuze);
      var x = rij.shift(); if (!x) return null;
      var op = Object.assign({}, x);
      op.beeld = beeldHtml(x.tekst, x.doel, x.eerste);
      if (x.van > 1) op.opdracht = '<span class="eyebrow" style="display:block;margin:0 0 4px">opdracht ' + (x.nr + 1) + ' van ' + x.van + ' bij deze tekst</span>' + (op.opdracht || '');
      if (x.kort) op.na = function(vak){ var l = vak.querySelector('.opties'); if (l) l.classList.add('ls-kort'); naTekenen(); };
      else op.na = function(){ naTekenen(); };
      if (WERKBLAD) op.beeld = LEESBLAD.tekstHtml(x.tekst);
      return op;
    },
