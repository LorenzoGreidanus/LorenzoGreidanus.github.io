<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function tussen(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function rond(x, n){ var f = Math.pow(10, n || 0); return Math.round(x * f) / f; }
  /* een getal met een komma, zonder punt voor duizendtallen (dan kun je het precies zo intypen) */
  function net(x){ return String(rond(x, 2)).replace('.', ','); }
  function napKort(x){ x = rond(x, 2); return 'NAP ' + (x < 0 ? '−' : x > 0 ? '+' : '') + net(Math.abs(x)) + ' m'; }
  function napZin(x){ x = rond(x, 2); return x < 0 ? net(-x) + ' m onder NAP' : x > 0 ? net(x) + ' m boven NAP' : 'precies op NAP'; }
  function cap(t){ return t.charAt(0).toUpperCase() + t.slice(1); }
  function weeg(l){ var som = 0, i; for (i = 0; i < l.length; i++) som += l[i][1]; var r = Math.random() * som; for (i = 0; i < l.length; i++){ r -= l[i][1]; if (r < 0) return l[i][0]; } return l[l.length - 1][0]; }
  function letter(niveau){ return niveau === 'bb' ? 'b' : niveau === 'kgt' ? 'k' : 'h'; }
  function past(it, niveau){ return it.n.indexOf(letter(niveau)) >= 0; }

  var DEEL = {
    rivier:{ od:'water: rivieren', naam:'rivieren en afvoer' },
    doorsnede:{ od:'water: doorsnede', naam:'de rivier in doorsnede' },
    kust:{ od:'water: kust', naam:'zee en kust' },
    laag:{ od:'water: laag Nederland', naam:'laag Nederland' },
    zoet:{ od:'water: zoet water', naam:'zoet water en droogte' }
  };
  function basis(deel){ return { onderdeel:DEEL[deel].od, onderdeelNaam:DEEL[deel].naam }; }
  function mk(deel, extra){ return Object.assign(basis(deel), { vorm:'meerkeuze' }, extra); }
  function inv(deel, extra){ return Object.assign(basis(deel), { vorm:'invul' }, extra); }

  /* ================= de lijsten =================
     n: voor welke niveaus (b = vmbo-bb, k = kgt en tl, h = havo en vwo).
     o[0] is goed, o[1] het verleidelijke foute antwoord; f zegt waarom dat niet klopt.
     Op vmbo-bb staan er drie antwoorden, anders vier. */
  var LIJST = {
    rivier:[
      { n:'bk', v:'Waar begint een rivier?', o:['bij de bron','bij de monding','in de delta','in de uiterwaard'], u:'De bron is de plek waar een rivier begint, vaak in de bergen of de heuvels.', f:'De monding is juist het eind: daar stroomt de rivier in zee, in een meer of in een andere rivier.' },
      { n:'bk', v:'Wat is de monding van een rivier?', o:['de plek waar de rivier in zee, een meer of een andere rivier uitkomt','de plek waar de rivier begint','het land tussen de rivier en de dijk','een rivier die in een grotere rivier uitkomt'], u:'Bij de monding houdt de rivier op: het water stroomt in zee, in een meer of in een grotere rivier.', f:'De plek waar de rivier begint, heet de bron.' },
      { n:'bk', v:'Wat is het stroomgebied van een rivier?', o:['het hele gebied waarvan het regenwater naar die rivier stroomt','alleen de rivier zelf en haar oevers','het gebied dat bij hoogwater onder water loopt','het stuk rivier waar schepen varen'], u:'Alle regen die in het stroomgebied valt, komt uiteindelijk in die rivier of in haar zijrivieren terecht.', f:'Het stroomgebied is veel groter dan de rivier zelf: het gaat om al het land waarvan het water naar de rivier stroomt.' },
      { n:'bk', v:'Wat is een zijrivier?', o:['een rivier die uitkomt in een grotere rivier','een rivier die naast de dijk stroomt','een gegraven kanaal voor schepen','de laatste tak van een rivier bij zee'], u:'Een zijrivier voert water naar een grotere rivier. De Moezel is bijvoorbeeld een zijrivier van de Rijn.', f:'Een rivier stroomt altijd tussen de dijken, niet ernaast; zijrivier gaat over waar het water heen stroomt.' },
      { n:'bk', v:'Waar komt het water van een regenrivier vandaan?', o:['vooral van regen','vooral van smeltende sneeuw en gletsjers','vooral van zeewater','vooral van water uit de duinen'], u:'Een regenrivier krijgt zijn water van regen. De Maas en de Schelde zijn regenrivieren.', f:'Smeltwater uit de bergen hoort bij een gemengde rivier, zoals de Rijn.' },
      { n:'bk', v:'De Rijn is een gemengde rivier. Wat betekent dat?', o:['hij krijgt water van regen en van smeltwater uit de Alpen','hij stroomt door meer dan één land','hij heeft zoet en zout water','hij heeft een zomerbed en een winterbed'], u:'Gemengd zegt waar het water vandaan komt: regen, en smeltende sneeuw en gletsjers in de Alpen.', f:'Dat de Rijn door veel landen stroomt klopt, maar daar gaat het woord gemengd niet over.' },
      { n:'bk', v:'Waar ontspringt de Rijn?', o:['in de Alpen in Zwitserland','in de Ardennen in België','in het noordoosten van Frankrijk','in Limburg'], u:'De Rijn begint in de Zwitserse Alpen. Daarom krijgt hij ook smeltwater.', f:'In de Ardennen stromen wel zijrivieren van de Maas, maar de Rijn begint in de Alpen.' },
      { n:'bk', v:'Waar ontspringt de Maas?', o:['in Frankrijk','in Zwitserland','in Duitsland','in Nederland'], u:'De Maas begint in het noordoosten van Frankrijk en stroomt via België naar Nederland. Hij krijgt alleen regenwater: een regenrivier.', f:'In Zwitserland, in de Alpen, ontspringt de Rijn.' },
      { n:'bk', v:'Bij welke plaats stroomt de Rijn Nederland binnen?', o:['bij Lobith','bij Eijsden','bij Vlissingen','bij Hoek van Holland'], u:'Bij Lobith in Gelderland komt de Rijn ons land binnen. Daar meet Rijkswaterstaat hoeveel water de Rijn aanvoert.', f:'Bij Eijsden in Limburg komt de Maas Nederland binnen.' },
      { n:'bk', v:'Wanneer heeft de Maas meestal het minste water?', o:['aan het eind van de zomer','midden in de winter','in het vroege voorjaar','in december'], u:'In de zomer verdampt er veel water en nemen planten veel water op. Er komt dan weinig regenwater in de rivier, en de Maas krijgt geen smeltwater.', f:'In de winter verdampt er weinig, dus komt veel regen in de rivier terecht: dan is de afvoer juist hoog.' },
      { n:'b', v:'Wat is hoogwater op een rivier?', o:['er stroomt heel veel water door de rivier en het water staat hoog','het water staat heel laag','de rivier is bevroren'], u:'Bij hoogwater komt er veel meer water dan normaal, bijvoorbeeld na lange regen. De uiterwaarden lopen dan onder.', f:'Heel laag water heet laagwater.' },
      { n:'b', v:'Wat is een probleem bij laagwater op de Rijn?', o:['schepen kunnen minder lading meenemen','de uiterwaarden lopen onder','de dijken kunnen doorbreken'], u:'Bij laagwater is de rivier ondiep. Schepen mogen dan minder zwaar beladen zijn, anders lopen ze vast.', f:'Ondergelopen uiterwaarden horen bij hoogwater, niet bij laagwater.' },
      { n:'bk', v:'Wat is grondwater?', o:['water dat in de bodem zit, tussen het zand en de klei','water in sloten en rivieren','water dat uit de lucht valt','zout water onder de zee'], u:'Regen zakt in de grond en vult de ruimtes tussen de zandkorrels. Dat is grondwater.', f:'Water in sloten en rivieren heet oppervlaktewater.' },
      { n:'bk', v:'Wat gebeurt er bij verdamping?', o:['water wordt door warmte waterdamp en gaat de lucht in','waterdamp wordt weer water en vormt wolken','water zakt in de bodem','water stroomt naar zee'], u:'Door de warmte van de zon wordt water uit zee, meren en planten waterdamp.', f:'Waterdamp die weer water wordt, heet condensatie: zo ontstaan wolken.' },
      { n:'kh', v:'Waarom heeft de Rijn in de zomer meer water dan de Maas?', o:['de Rijn krijgt in het voorjaar en de zomer smeltwater uit de Alpen','in Duitsland regent het in de zomer veel meer','de Maas wordt in de zomer afgesloten met sluizen','de Rijn krijgt zeewater via de Waddenzee'], u:'Sneeuw en gletsjers in de Alpen smelten in het voorjaar en de zomer. Dat smeltwater vult de Rijn aan, ook als het weinig regent. De Maas heeft dat niet.', f:'Het verschil komt niet door meer regen, maar door het smeltwater.' },
      { n:'kh', v:'In welke drie rivieren splitst de Rijn zich in Nederland?', o:['Waal, Nederrijn (Lek) en IJssel','Maas, Waal en IJssel','Waal, Lek en Schelde','IJssel, Vecht en Maas'], u:'Bij de Pannerdensche Kop splitst de Rijn in de Waal en het Pannerdensch Kanaal. Dat splitst daarna in de Nederrijn (verderop de Lek) en de IJssel.', f:'De Maas is een eigen rivier uit Frankrijk en geen tak van de Rijn.' },
      { n:'kh', v:'Welke tak van de Rijn voert het meeste water af?', o:['de Waal','de IJssel','de Nederrijn','de Lek'], u:'Ongeveer twee derde van het Rijnwater stroomt via de Waal. Daarom varen daar ook de meeste schepen naar Duitsland.', f:'De IJssel krijgt maar een klein deel van het Rijnwater.' },
      { n:'kh', v:'Wat is de afvoer van een rivier?', o:['de hoeveelheid water die per seconde langs een punt stroomt','de snelheid van het water in kilometer per uur','de hoogte van het water ten opzichte van NAP','het water dat uit een polder wordt gepompt'], u:'Afvoer meet je in kubieke meter per seconde (m³/s): hoeveel water er elke seconde langs stroomt.', f:'De hoogte van het water is de waterstand; dat is iets anders dan de afvoer.' },
      { n:'kh', v:'Wat is een waterscheiding?', o:['de grens tussen twee stroomgebieden','een dam die zoet en zout water scheidt','de plek waar een rivier zich splitst','een sluis tussen twee kanalen'], u:'Aan de ene kant van een waterscheiding stroomt het water naar de ene rivier, aan de andere kant naar een andere. Vaak is het een bergkam.', f:'Een dam tussen zoet en zout water is een afsluitdam of kering, geen waterscheiding.' },
      { n:'kh', v:'In een stad zijn veel straten en daken. Wat gebeurt er met de regen bij een hevige bui?', o:['die stroomt snel weg naar riool en sloot, want hij kan niet in de grond zakken','die zakt snel in de grond, want stenen laten water door','die verdampt meteen van de warme stenen','die blijft op de daken liggen tot het droog is'], u:'Op verharding kan water niet infiltreren. Het stroomt snel af, zodat riolen en sloten in korte tijd heel veel water krijgen.', f:'Stenen en asfalt laten bijna geen water door; daardoor ontstaat juist wateroverlast.' },
      { n:'kh', v:'Welk land ligt niet in het stroomgebied van de Rijn?', o:['Spanje','Zwitserland','Duitsland','Frankrijk'], u:'Het stroomgebied van de Rijn ligt onder meer in Zwitserland, Oostenrijk, Duitsland, Frankrijk, Luxemburg en Nederland. Spanje ligt er ver buiten.', f:'Zwitserland hoort er zeker bij: daar ligt de bron van de Rijn.' },
      { n:'kh', v:'Na weken regen valt er in Duitsland nog een flinke bui. Waarom stijgt de Rijn dan extra snel?', o:['de bodem is verzadigd, dus de regen stroomt meteen af naar de rivier','de bodem is droog en hard, dus de regen verdampt niet','na veel regen smelt de sneeuw in de Alpen niet meer','na een natte periode is de rivier juist leeg'], u:'Een verzadigde bodem kan geen water meer opnemen. Alle nieuwe regen stroomt meteen naar beken en rivieren.', f:'Hier gaat het om een natte bodem na weken regen, niet om een droge.' },
      { n:'h', v:'In Duitsland zijn rivierbochten afgesneden en uiterwaarden ingedijkt. Wat betekent dat voor een hoogwatergolf in Nederland?', o:['de golf komt sneller en hoger bij ons aan','de golf komt later en lager aan','de golf wordt in Duitsland helemaal opgevangen','er verandert niets, want het is evenveel water'], u:'Een kortere rivier zonder ruimte voert het water sneller af, en er is minder ruimte om water tijdelijk op te slaan. De top komt dus eerder en hoger aan.', f:'Later en lager zou gebeuren als er juist meer bochten en meer ruimte waren.' },
      { n:'h', v:'In de Alpen valt door klimaatverandering vaker regen in plaats van sneeuw, en de gletsjers krimpen. Wat betekent dat voor de Rijn?', o:['meer water in de winter en minder in de zomer: hij gaat meer op een regenrivier lijken','blijvend meer water in de zomer, want de gletsjers smelten sneller','minder water in de winter, want er valt minder sneeuw','niets, want de neerslag blijft gelijk'], u:'Regen stroomt meteen af, dus de winterafvoer stijgt. Sneeuw en gletsjerijs leveren pas in de zomer water; minder sneeuw en kleinere gletsjers geven dus minder smeltwater in de zomer.', f:'Gletsjers die sneller smelten geven even meer water, maar als ze kleiner worden, neemt het smeltwater juist af.' },
      { n:'h', v:'Waarom duurt het een paar dagen voordat regen in Duitsland als hoogwater bij Lobith aankomt?', o:['het water moet eerst via beken, zijrivieren en de Rijn honderden kilometers stromen','het water zakt eerst in de grond en komt pas na maanden boven','de stuwen in Duitsland houden al het water een week vast','het regenwater moet eerst verdampen en opnieuw vallen'], u:'Het stroomgebied is groot: water uit Zwitserland en Duitsland legt een lange weg af. Daardoor ziet Rijkswaterstaat een hoogwatergolf dagen van tevoren aankomen.', f:'Grondwater stroomt wel heel langzaam, maar een hoogwatergolf komt van water dat over de grond en door de rivieren stroomt.' },
      { n:'h', v:'In juli 2021 overstroomden de Geul en de Maas in Limburg, midden in de zomer. Hoe kon dat bij een regenrivier?', o:['er viel in korte tijd extreem veel regen in een heuvelachtig gebied, en dat stroomde snel af','er kwam ineens veel smeltwater uit de Alpen','de zee drukte het water de Maas op','de dijken langs de Maas waren te hoog'], u:'Een regenrivier reageert snel op regen. In de heuvels van Zuid-Limburg en het gebied erachter stroomde de extreme regen snel naar beken en rivieren.', f:'De Maas krijgt geen smeltwater uit de Alpen; dat is juist het verschil met de Rijn.' },
      { n:'h', v:'Bij laagwater op de Rijn dringt zout zeewater verder het land in via de Nieuwe Waterweg. Waarom?', o:['er stroomt minder zoet rivierwater naar zee dat het zoute water terugduwt','de zee is bij droogte zouter','bij laagwater staan de keringen open','laag rivierwater verdampt sneller en wordt zout'], u:'Normaal duwt het rivierwater het zoute water terug. Bij een lage afvoer is die tegendruk kleiner en schuift de zouttong verder landinwaarts. Dan kunnen inlaten voor drinkwater en landbouw zout water binnenkrijgen.', f:'De zee wordt bij droogte niet zouter; het verschil zit in hoeveel zoet water er tegenin stroomt.' }
    ],
    doorsnede:[
      { n:'bk', v:'Wat is een uiterwaard?', o:['het land tussen de rivier en de dijk','het land achter de dijk waar mensen wonen','de bodem van de rivier','een eiland in de rivier'], u:'De uiterwaard ligt buitendijks, tussen het zomerbed en de winterdijk. Bij hoogwater loopt hij onder.', f:'Het land achter de dijk heet binnendijks land; dat moet juist droog blijven.' },
      { n:'bk', v:'Waarvoor dienen kribben?', o:['ze houden het water in het midden van de rivier, zodat de vaargeul diep genoeg blijft','ze houden de zee tegen bij storm','ze pompen water uit de polder','ze zijn een aanlegplaats voor schepen'], u:'Kribben zijn stenen dammetjes haaks op de oever. Het water stroomt daardoor sneller in het midden, zodat de vaargeul diep blijft en de oever niet wegspoelt.', f:'Tegen de zee bij storm helpen dijken, duinen en stormvloedkeringen, geen kribben.' },
      { n:'bk', v:'Wat is het winterbed van een rivier?', o:['het zomerbed samen met de uiterwaarden','alleen de uiterwaarden','het land achter de winterdijk','de rivier als hij bevroren is'], u:'Bij hoogwater, vaak in de winter, gebruikt de rivier het zomerbed én de uiterwaarden: samen het winterbed, tussen de winterdijken.', f:'Alleen de uiterwaarden is te weinig: het zomerbed hoort er ook bij.' },
      { n:'kh', v:'Wat is een zomerkade?', o:['een lage dijk in de uiterwaard die bij gewoon hoog water de uiterwaard droog houdt','de hoge dijk die bij hoogwater het land beschermt','een kade waar schepen in de zomer aanleggen','een dam die de rivier in de zomer afsluit'], u:'Een zomerkade is laag. Bij echt hoogwater loopt hij over en staat de uiterwaard toch onder water; dan houdt de winterdijk het water tegen.', f:'De hoge dijk die het land beschermt, is de winterdijk (de bandijk).' },
      { n:'kh', v:'Wat is kwel?', o:['grondwater dat onder de dijk door omhoog komt in de polder','rivierwater dat over de dijk heen loopt','water dat een gemaal naar de rivier pompt','water dat bij eb uit de polder stroomt'], u:'Staat het water buiten de dijk hoger dan de polder, dan drukt het water onder de dijk door. Achter de dijk komt het als kwel omhoog.', f:'Water dat over de dijk loopt, is overloop. Dat gebeurt pas als het water hoger komt dan de kruin, en is veel gevaarlijker.' },
      { n:'kh', v:'Waarom liggen uiterwaarden vaak hoger dan het land achter de dijk?', o:['bij elk hoogwater blijft er klei en zand (slib) op de uiterwaarden liggen','de boeren hebben de uiterwaarden opgehoogd voor hun koeien','het land achter de dijk is weggespoeld door regen','de uiterwaarden zijn opgespoten met zeezand'], u:'Als de uiterwaard onder water staat, stroomt het water er langzaam en zakt het slib naar de bodem. Achter de dijk gebeurt dat niet.', f:'Ophogen door boeren is niet de oorzaak: het slib van de rivier doet het werk.' },
      { n:'kh', v:'Bij welke maatregel krijgt de rivier geen extra ruimte?', o:['de dijk verhogen','de uiterwaard verlagen','een nevengeul graven','de dijk landinwaarts verleggen'], u:'Een hogere dijk houdt meer water tegen, maar de rivier wordt er niet breder of dieper van. Bij Ruimte voor de Rivier ging het juist om meer ruimte, zodat de waterstand bij hoogwater lager blijft.', f:'Een lagere uiterwaard geeft de rivier wel meer ruimte: er past meer water tussen de dijken.' },
      { n:'kh', v:'Waarom kwam er na de hoogwaters van 1993 en 1995 het programma Ruimte voor de Rivier?', o:['steeds hogere dijken werd te riskant; de rivier moest meer ruimte krijgen zodat het water lager blijft','de scheepvaart wilde bredere rivieren','de rivieren moesten weer stromen zoals in de middeleeuwen','er was te weinig klei voor nieuwe dijken'], u:'In 1995 moesten meer dan 200.000 mensen hun huis uit. Daarna koos de overheid ervoor de rivieren meer ruimte te geven in plaats van alleen de dijken te verhogen.', f:'De scheepvaart was niet de reden; het ging om veiligheid bij hoogwater.' },
      { n:'h', v:'Bij Nijmegen is de dijk bij Lent landinwaarts verlegd en is er een nevengeul gegraven. Wat is het doel?', o:['de Waal krijgt meer ruimte, zodat de waterstand bij hoogwater lager blijft','er komt meer land vrij om te bouwen','de schepen kunnen sneller varen','de rivier wordt korter'], u:'De Waal maakt bij Nijmegen een scherpe bocht en was daar smal. Met de verlegde dijk en de nevengeul kan er bij hoogwater meer water door.', f:'Er kwam juist minder land vrij, want de rivier kreeg een deel erbij; het doel was veiligheid.' },
      { n:'h', v:'Bij hoogwater zie je achter de dijk op een paar plekken water met zand omhoog borrelen. Waarom is dat gevaarlijk?', o:['het water spoelt zand onder de dijk weg, waardoor de dijk kan bezwijken','het water is zout en maakt de akkers kapot','het betekent dat de rivier al over de dijk loopt','het zand maakt de sloten ondiep'], u:'Dit heet piping. Spoelt er steeds meer zand onder de dijk weg, dan ontstaat er een gang en kan de dijk bezwijken. Daarom leggen dijkwachten er een ring van zandzakken omheen.', f:'Het water stroomt onder de dijk door, niet eroverheen; juist daarom is het gevaar lastig te zien.' },
      { n:'h', v:'Waarom mag je in de uiterwaarden bijna geen huizen bouwen?', o:['bij hoogwater moet het water er vrij door kunnen stromen; huizen nemen ruimte weg en lopen zelf onder','de grond in de uiterwaarden is te zout','de uiterwaarden zijn van de scheepvaart','er mag alleen gebouwd worden op plekken onder NAP'], u:'Elk gebouw in het winterbed neemt ruimte van de rivier in. Dan komt het water bij hoogwater hoger, en de bewoners lopen zelf ook gevaar.', f:'Zout speelt bij de grote rivieren in het binnenland geen rol; het gaat om de ruimte voor het water.' }
    ],
    kust:[
      { n:'bk', v:'Wat gebeurt er met het water in zee bij vloed?', o:['het water stijgt','het water daalt','het water blijft gelijk','het water wordt zouter'], u:'Bij vloed komt het water op: het stijgt tot hoogwater. Daarna begint de eb en daalt het weer.', f:'Bij eb daalt het water.' },
      { n:'bk', v:'Hoe vaak is het ongeveer hoogwater aan de Nederlandse kust?', o:['twee keer per dag','één keer per dag','vier keer per dag','één keer per week'], u:'Tussen twee keer hoogwater zit ongeveer 12 uur en 25 minuten. Zo is het bijna elke dag twee keer hoogwater en twee keer laagwater.', f:'Eén keer per dag is te weinig: na ongeveer 12 uur en 25 minuten is het alweer hoogwater.' },
      { n:'bk', v:'Waardoor ontstaan eb en vloed?', o:['door de aantrekkingskracht van de maan (en de zon)','door de wind boven zee','door het water dat de rivieren naar zee brengen','door de grote schepen op zee'], u:'De maan trekt aan het water van de oceanen. Terwijl de aarde draait, stijgt en daalt het water op een vaste plek.', f:'Wind kan het water bij storm wel extra opstuwen, maar eb en vloed komen door de maan.' },
      { n:'bk', v:'Wat beschermt een groot deel van de Hollandse kust tegen de zee?', o:['de duinen','de uiterwaarden','de kribben','de gemalen'], u:'Langs Noord- en Zuid-Holland liggen brede duinen: een natuurlijke zeewering.', f:'Uiterwaarden liggen langs de rivieren, niet langs de kust.' },
      { n:'bk', v:'In welk jaar was de Watersnoodramp?', o:['1953','1995','1916','1932'], u:'In de nacht van 31 januari op 1 februari 1953 braken in Zeeland, Zuid-Holland en West-Brabant de dijken door. Er kwamen 1836 mensen om.', f:'In 1995 was er hoogwater op de rivieren, geen ramp vanuit zee.' },
      { n:'bk', v:'Welk gebied werd bij de Watersnoodramp het zwaarst getroffen?', o:['Zeeland en Zuid-Holland','Groningen en Friesland','Limburg','de Veluwe'], u:'De storm trof vooral de eilanden in het zuidwesten: Zeeland, de Zuid-Hollandse eilanden en West-Brabant.', f:'Groningen en Friesland liggen ook aan zee, maar in 1953 ging het vooral mis in de zuidwestelijke delta.' },
      { n:'bk', v:'Wat zijn de Deltawerken?', o:['dammen, dijken en stormvloedkeringen in Zeeland en Zuid-Holland','kanalen voor de scheepvaart naar Duitsland','gemalen die polders droogpompen','windmolens langs de kust'], u:'Na de ramp van 1953 kwam het Deltaplan. De zeegaten in de delta werden afgesloten of kregen een stormvloedkering.', f:'Gemalen staan overal in Nederland, maar ze horen niet bij de Deltawerken.' },
      { n:'bk', v:'Wat deed de Afsluitdijk?', o:['hij maakte van de Zuiderzee het IJsselmeer','hij sloot de Oosterschelde af','hij beschermt Rotterdam tegen storm','hij verbindt Zeeland met Zuid-Holland'], u:'De Afsluitdijk werd in 1932 gesloten. De zoute Zuiderzee werd daarna het zoete IJsselmeer.', f:'De Oosterschelde heeft een eigen stormvloedkering: de Oosterscheldekering.' },
      { n:'bk', v:'Wat doet de Maeslantkering?', o:['hij sluit bij zware storm de Nieuwe Waterweg af en beschermt zo Rotterdam','hij pompt water uit de polders rond Rotterdam','hij houdt het IJsselmeer zoet','hij staat altijd dicht'], u:'De Maeslantkering heeft twee enorme deuren. Normaal staan ze open voor de schepen; bij zware storm gaan ze dicht.', f:'Hij staat juist bijna altijd open, anders kunnen de schepen de haven niet in.' },
      { n:'bk', v:'Wat is een stormvloed?', o:['heel hoog water doordat een storm het zeewater naar de kust blaast','een rivier die na veel regen overstroomt','een golf door een aardbeving','gewone vloed bij mooi weer'], u:'Bij een stormvloed stuwt de wind het water op. Valt dat samen met springtij, dan wordt het extra gevaarlijk.', f:'Een rivier die na regen overstroomt, heeft hoogwater; dat is geen stormvloed.' },
      { n:'bk', v:'Wat is zandsuppletie?', o:['zand opspuiten op het strand of voor de kust, zodat de kust niet wegspoelt','zand uit de duinen halen voor de bouw','zand in de rivier storten zodat schepen niet vastlopen','zand op de akkers strooien tegen droogte'], u:'De zee neemt steeds zand mee. Rijkswaterstaat brengt daarom nieuw zand aan, zodat de kustlijn op zijn plek blijft.', f:'Zand weghalen uit de duinen zou de kust juist zwakker maken.' },
      { n:'bk', v:'Wat is laagwater?', o:['het moment waarop het water in zee het laagst staat','het moment waarop het water in zee het hoogst staat','water in een rivier dat stilstaat','een droge zomer'], u:'Na de eb komt laagwater: het laagste punt. Daarna begint de vloed weer.', f:'Het hoogste punt heet hoogwater.' },
      { n:'bk', v:'Wat gebeurt er bij eb in de Waddenzee?', o:['grote zandplaten vallen droog','de Waddenzee wordt zoet','de eilanden lopen onder','het water bevriest'], u:'De Waddenzee is ondiep. Bij eb vallen de platen (het wad) droog; bij vloed staan ze weer onder water.', f:'Zoet wordt de Waddenzee nooit: hij staat in open verbinding met de Noordzee.' },
      { n:'bk', v:'Waarom liggen er in Zeeland zoveel dammen en keringen?', o:['om het land na de ramp van 1953 te beschermen tegen de zee','om er stroom mee op te wekken','om schepen tegen te houden','om de rivieren schoon te houden'], u:'Na de Watersnoodramp zijn met de Deltawerken de zeegaten afgesloten of kregen ze een kering die bij storm dichtgaat.', f:'Stroom opwekken was niet het doel; het ging om veiligheid.' },
      { n:'kh', v:'Wanneer is het springtij?', o:['bij volle maan en nieuwe maan, als zon en maan op één lijn staan','bij halve maan','alleen in het voorjaar','bij een storm uit het noordwesten'], u:'Bij volle en nieuwe maan trekken zon en maan in dezelfde lijn: hoogwater is extra hoog en laagwater extra laag. Bij halve maan is het doodtij.', f:'Bij halve maan is het juist doodtij: het verschil tussen hoog- en laagwater is dan het kleinst.' },
      { n:'kh', v:'Waarom kwam het water in 1953 zo hoog?', o:['een zware noordwesterstorm viel samen met springtij','er was een aardbeving in de Noordzee','de rivieren hadden tegelijk hoogwater door smeltwater','de duinen waren afgegraven'], u:'De storm stuwde het water urenlang op richting de kust, en het was ook nog springtij. De dijken waren te laag en te zwak.', f:'Het water kwam uit zee, niet van de rivieren.' },
      { n:'kh', v:'Waarom is de Oosterscheldekering een open kering die alleen bij storm dichtgaat?', o:['zo blijven eb en vloed en het zoute water, voor de natuur en de visserij','een dichte dam was niet sterk genoeg','zo kunnen schepen naar Antwerpen','de Oosterschelde moest zoet worden'], u:'Eerst zou de Oosterschelde helemaal dicht. Na protest van vissers en natuurbeschermers kwam er een kering met beweegbare schuiven. Hij was in 1986 klaar.', f:'Schepen naar Antwerpen varen over de Westerschelde, niet over de Oosterschelde.' },
      { n:'kh', v:'Waarom is de Westerschelde niet afgesloten?', o:['de schepen moeten de haven van Antwerpen kunnen bereiken','het water is daar niet zout','er wonen daar geen mensen','de Westerschelde ligt in België'], u:'De Westerschelde is de vaarweg naar Antwerpen. Daarom zijn daar de dijken verhoogd en versterkt in plaats van het water af te sluiten.', f:'De Westerschelde ligt in Zeeland, in Nederland; alleen Antwerpen ligt in België.' },
      { n:'kh', v:'Waarom gaat de Maeslantkering bijna nooit dicht?', o:['schepen moeten de haven van Rotterdam in en uit kunnen','hij is te zwaar om vaak te bewegen','hij gaat alleen dicht bij hoogwater op de Rijn','het water bij Rotterdam is te ondiep'], u:'De Nieuwe Waterweg is de toegang tot de haven van Rotterdam. De kering sluit alleen als er bij zware storm een gevaarlijk hoge waterstand wordt verwacht.', f:'Het gaat om storm vanuit zee, niet om hoogwater op de rivier.' },
      { n:'kh', v:'Waarom bouwde men na 1953 dammen in de zeegaten in plaats van alle dijken op de eilanden te verhogen?', o:['met dammen in de zeegaten werd de kustlijn veel korter, dus er hoefde minder dijk sterk te zijn','dammen zijn van zand en dus goedkoop','de dijken waren al hoog genoeg','zo werden de eilanden groter'], u:'Dat heet kustverkorting. Een paar dammen in de zeegaten beschermen het land achter honderden kilometers dijk langs de eilanden.', f:'De dijken waren in 1953 juist te laag en te zwak; dat was het probleem.' },
      { n:'kh', v:'Hoe beschermen duinen het land?', o:['het zand vangt de golven op; bij storm slaat de zee wat zand weg, maar een breed duin blijft staan','duinen pompen het zeewater terug','duinen zijn van binnen van beton','de bomen op de duinen houden het water tegen'], u:'Een duin is een natuurlijke zeewering. Met zandsuppleties zorgt Rijkswaterstaat dat er genoeg zand blijft.', f:'Het duin werkt door het zand; de begroeiing houdt alleen het zand vast tegen de wind.' },
      { n:'kh', v:'Waarom heet het zuidwesten van Nederland een delta?', o:['de Rijn, de Maas en de Schelde komen daar in zee uit en vormden er eilanden en zeearmen','er liggen daar veel Deltawerken','het gebied heeft de vorm van een driehoek','er is daar vroeger een meer drooggemaakt'], u:'Een delta ontstaat bij de monding, waar rivieren zich splitsen en zand en klei afzetten.', f:'De Deltawerken zijn naar de delta genoemd, niet andersom.' },
      { n:'h', v:'Waarom zal de Maeslantkering in de toekomst vaker dicht moeten?', o:['de zeespiegel stijgt, dus komt het water vaker zo hoog dat hij dicht moet','er komen meer schepen naar Rotterdam','de kering slijt en lekt steeds meer','de Rijn voert in de zomer meer water af'], u:'Als het gewone zeeniveau hoger ligt, is er bij een storm minder opstuwing nodig om de gevaarlijke waterstand te halen.', f:'Meer schepen maken het juist lastiger als de kering vaker dicht is; het is geen oorzaak.' },
      { n:'h', v:'Wat is het verschil tussen een dam en een stormvloedkering?', o:['een dam sluit het water af; een stormvloedkering staat meestal open en gaat alleen bij storm dicht','een dam ligt in een rivier, een kering in een meer','een stormvloedkering is altijd dicht, een dam heeft sluizen','er is geen verschil'], u:'Een dam sluit een zeearm of rivier af. Een kering zoals de Oosterscheldekering of de Maeslantkering laat het water door tot er storm komt.', f:'Het is precies andersom: de kering kan open, de dam niet.' },
      { n:'h', v:'Waarom werd de Afsluitdijk gebouwd?', o:['na een overstroming in 1916 wilde men de Zuiderzee afsluiten, tegen overstromingen en voor nieuw land','om herhaling van de Watersnoodramp van 1953 te voorkomen','om een snelweg naar Friesland te maken','om zoet water naar Duitsland te sturen'], u:'Na de overstroming van 1916 kwam in 1918 de Zuiderzeewet. De Afsluitdijk werd in 1932 gesloten; daarna kwamen de IJsselmeerpolders.', f:'De Afsluitdijk lag er al in 1932, ruim vóór de ramp van 1953.' },
      { n:'h', v:'De Zandmotor bij Ter Heijde is een groot schiereiland van zand. Hoe werkt hij?', o:['wind, golven en stroming verspreiden het zand langs de kust, zodat een lange strook kust sterker wordt','het zand houdt als een dam de golven tegen','het zand wordt elke week opnieuw op het strand gelegd','het zand zakt in en wordt een nieuwe polder'], u:'In plaats van steeds een beetje zand op het strand te spuiten, ligt er één grote voorraad. De natuur verdeelt het zand langs de kust.', f:'De Zandmotor is geen dam: het zand mag juist wegspoelen naar de kust ernaast.' },
      { n:'h', v:'Waarom is de Waddenzee tot nu toe meegegroeid met de zeespiegel?', o:['bij elk getij blijven zand en slib op de platen en kwelders liggen','de eilanden houden al het water tegen','de bodem van de Waddenzee wordt omhoog gedrukt','er wordt elk jaar zand in de Waddenzee gespoten'], u:'Zolang de zeespiegel niet te snel stijgt, brengt het getij genoeg zand en slib om de wadplaten mee te laten groeien. Stijgt hij sneller, dan kunnen de platen dat niet bijhouden.', f:'De eilanden laten het getij juist door de zeegaten ertussen.' }
    ],
    laag:[
      { n:'bk', v:'Wat is een polder?', o:['een stuk laag land met dijken eromheen, waar het waterpeil geregeld wordt','een meer midden in het land','een heuvel van zand in de duinen','een rivier met uiterwaarden'], u:'In een polder bepaalt het waterschap hoe hoog het water staat. Water dat te veel is, wordt weggepompt.', f:'Een polder kan vroeger een meer zijn geweest, maar nu is het juist land.' },
      { n:'bk', v:'Wat doet een gemaal?', o:['het pompt water uit de polder','het maakt drinkwater van zeewater','het wekt stroom op met wind','het tilt schepen omhoog'], u:'Regen en kwel komen steeds in de polder. Het gemaal pompt dat water naar een hoger kanaal (de boezem) of een rivier.', f:'Drinkwater maken gebeurt bij een drinkwaterbedrijf, niet bij een gemaal.' },
      { n:'bk', v:'Waar staat NAP voor?', o:['Normaal Amsterdams Peil','Nationaal Afvoer Punt','Nieuw Algemeen Polderpeil','Noordzee Afstand Peil'], u:'NAP is de hoogte waarmee we in Nederland alle hoogtes vergelijken. Het ligt ongeveer op het gemiddelde zeeniveau.', f:'Het heeft niets met afvoer te maken: NAP is een hoogte.' },
      { n:'bk', v:'Een dorp ligt op 3 meter onder NAP. Wat betekent dat?', o:['het dorp ligt 3 meter lager dan NAP','het dorp ligt 3 meter hoger dan NAP','het dorp ligt 3 meter van de zee','het water staat er 3 meter hoog'], u:'NAP ligt ongeveer op het gemiddelde zeeniveau. Onder NAP betekent lager dan dat niveau; je schrijft het met een min: NAP −3 m.', f:'Boven NAP schrijf je met een plus.' },
      { n:'bk', v:'Wat doet een waterschap?', o:['het zorgt voor de dijken, het waterpeil en schoon water in een gebied','het verkoopt drinkwater','het bouwt schepen','het maakt de wetten van Nederland'], u:'Waterschappen zijn de oudste democratische besturen van Nederland. Je kunt zelf op ze stemmen bij de waterschapsverkiezingen.', f:'Drinkwater komt van een drinkwaterbedrijf, niet van het waterschap.' },
      { n:'bk', v:'Hoe werden polders vroeger drooggemaakt?', o:['met windmolens die het water wegmaalden','met emmers en paarden','met stoomschepen','het water verdampte vanzelf'], u:'Windmolens maalden het water omhoog. Later kwamen er stoomgemalen, en nu elektrische en dieselgemalen.', f:'Met emmers kom je bij een heel meer niet ver: daar waren molens voor nodig.' },
      { n:'bk', v:'Hoeveel van Nederland ligt onder zeeniveau?', o:['ongeveer een kwart','bijna niets','bijna alles','precies de helft'], u:'Ongeveer een kwart van Nederland ligt onder zeeniveau, vooral in het westen en noorden. Een nog groter deel zou kunnen overstromen als er geen dijken en duinen waren.', f:'Bijna niets klopt niet: grote delen van Holland, Zeeland, Flevoland en Friesland liggen onder zeeniveau.' },
      { n:'bk', v:'Hoe is Flevoland ontstaan?', o:['het is drooggemalen uit het IJsselmeer','het is aangeslibd door de Rijn','het is opgespoten met zand uit de Noordzee','het lag er altijd al'], u:'Na de Afsluitdijk werden delen van het IJsselmeer ingepolderd. Flevoland is sinds 1986 een provincie.', f:'Opspuiten met zand gebeurde bijvoorbeeld bij de Tweede Maasvlakte; Flevoland is drooggemalen.' },
      { n:'bk', v:'Waarom moet een gemaal ook pompen als het niet regent?', o:['er komt steeds kwelwater uit de grond de polder in','de vissen hebben stromend water nodig','anders bevriest het water','de boeren willen het water warm houden'], u:'Omdat de polder laag ligt, drukt het water van buiten onder de dijk door. Dat kwelwater moet steeds weg.', f:'Om vissen gaat het niet: zonder pompen loopt de polder langzaam vol.' },
      { n:'kh', v:'Waarom daalt de bodem in veengebieden?', o:['het grondwater wordt laag gehouden, waardoor het veen uitdroogt, verteert en inklinkt','er wordt te veel gebouwd op de dijken','de zee trekt het land omlaag','de regen spoelt het veen naar zee'], u:'Om het land droog genoeg te houden voor landbouw blijft het grondwater laag. Veen boven het water komt in contact met lucht en verteert. Zo zakt de bodem, soms tot ongeveer een centimeter per jaar.', f:'Bouwen op dijken heeft er niets mee te maken; het gaat om het veen dat droog komt te liggen.' },
      { n:'kh', v:'Wat is de belangrijkste oorzaak van bodemdaling in het noorden van Groningen?', o:['gaswinning','veel regen','het smelten van gletsjers','de bouw van windmolens'], u:'Doordat er gas uit de diepe ondergrond is gehaald, zakt de grond erboven. Daardoor zijn er ook aardbevingen.', f:'Regen laat de bodem niet dalen.' },
      { n:'kh', v:'Waarom wordt een polder steeds lastiger droog te houden als de bodem daalt?', o:['het verschil met het water buiten de polder wordt groter, dus er komt meer kwel en er moet meer gepompt worden','de gemalen zakken mee en werken dan niet meer','er valt meer regen op lage grond','het water stroomt dan vanzelf naar zee'], u:'Hoe lager de polder ligt, hoe harder het water van buiten onder de dijk door drukt. De gemalen moeten meer en hoger pompen.', f:'Er valt niet meer regen op lage grond; het gaat om het hoogteverschil.' },
      { n:'kh', v:'Wat zijn de twee belangrijkste oorzaken van zeespiegelstijging?', o:['smeltend landijs en zeewater dat uitzet doordat het warmer wordt','smeltend zee-ijs en meer regen boven zee','meer schepen en meer zand uit de rivieren','eb en vloed die sterker worden'], u:'IJs op Groenland en Antarctica smelt en stroomt in zee. En warm water neemt meer ruimte in.', f:'Zee-ijs drijft al in het water; als het smelt, stijgt de zee daar nauwelijks door. Regen boven zee kwam eerst uit zee.' },
      { n:'kh', v:'Wat is de boezem in een poldergebied?', o:['kanalen en meren die hoger liggen dan de polders en het water afvoeren naar zee of rivier','het laagste stuk van de polder','de pompkamer van een gemaal','de plek waar de dijk het breedst is'], u:'Gemalen pompen het polderwater in de boezem. Via de boezem gaat het water naar een groot gemaal of een sluis bij zee of rivier.', f:'Het laagste stuk is juist de polder zelf; de boezem ligt hoger.' },
      { n:'kh', v:'Wat is een dijkring?', o:['een gebied dat helemaal omringd is door dijken en hoge grond','een ring van ijzer in een dijk','een rondje dijk rond één boerderij','een groep dijkwerkers'], u:'Breekt ergens een dijk door, dan kan het hele gebied binnen de ring onderlopen. Daarom moet elk stuk dijk van de ring sterk genoeg zijn.', f:'Een dijkring is veel groter dan één boerderij: vaak een hele streek.' },
      { n:'kh', v:'Een boer wil het waterpeil in de polder laag; natuurbeschermers willen het hoog. Wie beslist over het peil?', o:['het waterschap','de gemeente','de koning','Rijkswaterstaat'], u:'Het waterschap stelt het peil vast en weegt de belangen af: landbouw, natuur, wonen en bodemdaling.', f:'Rijkswaterstaat zorgt voor de grote wateren, zoals de rivieren en de kust, niet voor het peil in een polder.' },
      { n:'h', v:'Waarom zijn bodemdaling en zeespiegelstijging samen een groot probleem?', o:['het land zakt en de zee stijgt: het hoogteverschil groeit van twee kanten','ze heffen elkaar op','alleen de zeespiegelstijging telt','bodemdaling laat de zee dalen'], u:'Het verschil tussen het water buiten de dijk en het land erachter wordt groter. Dat geeft meer kwel en verzilting, hogere pompkosten en zwaardere eisen aan de dijken.', f:'Ze heffen elkaar niet op: allebei maken ze het verschil groter.' },
      { n:'h', v:'Wat helpt het best tegen verdere bodemdaling in een veenweidegebied?', o:['het grondwaterpeil hoger zetten, zodat het veen nat blijft','dieper pompen zodat het land droger wordt','meer huizen bouwen op het veen','extra sloten graven om water af te voeren'], u:'Nat veen verteert niet. Een hoger peil remt de daling, maar maakt het land natter en lastiger voor de boeren: daar zit de afweging.', f:'Dieper pompen maakt het juist erger: het veen droogt verder uit en zakt sneller.' },
      { n:'h', v:'Meerlaagsveiligheid heeft drie lagen. Welke rij klopt?', o:['overstromingen voorkomen, slim bouwen en inrichten, en goede rampenplannen','dijken, duinen en dammen','gemeente, provincie en Rijk','eb, vloed en springtij'], u:'Laag 1 is voorkomen (dijken en duinen). Laag 2 is de ruimte zo inrichten dat de schade beperkt blijft. Laag 3 is de rampenbestrijding, zoals evacueren.', f:'Dijken, duinen en dammen horen samen bij laag 1.' },

  /* een assenstelsel: o = { xmin, xmax, xstap, xlab, ymin, ymax, ystap, ylab, xnaam, ynaam, hoog, xtekst } */
  function assen(o){
    var W = 380, Hh = o.hoog || 250, L = 50, R = 14, T = 30, B = 44;

    function X(x){ return rond(L + (x - o.xmin) * sx, 1); }
    function Y(y){ return rond(T + (o.ymax - y) * sy, 1); }
    var s = '', x, y, i, n;
    s += '<g stroke="var(--rand2)" stroke-width="1">';
    n = Math.round((o.xmax - o.xmin) / o.xstap);
    for (i = 0; i <= n; i++){ x = o.xmin + i * o.xstap; s += '<line x1="' + X(x) + '" y1="' + T + '" x2="' + X(x) + '" y2="' + (Hh - B) + '"/>'; }
    n = Math.round((o.ymax - o.ymin) / o.ystap);
    for (i = 0; i <= n; i++){ y = o.ymin + i * o.ystap; s += '<line x1="' + L + '" y1="' + Y(y) + '" x2="' + (W - R) + '" y2="' + Y(y) + '"/>'; }
    s += '</g><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="' + L + '" y1="' + (Hh - B) + '" x2="' + (W - R) + '" y2="' + (Hh - B) + '"/><line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (Hh - B) + '"/></g>';
    if (o.ymin < 0 && o.ymax > 0) s += '<line x1="' + L + '" y1="' + Y(0) + '" x2="' + (W - R) + '" y2="' + Y(0) + '" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>';
    s += '<g font-size="14" fill="var(--muted)">';
    n = Math.round((o.xmax - o.xmin) / o.xlab);
    for (i = 0; i <= n; i++){ x = o.xmin + i * o.xlab; s += '<text x="' + X(x) + '" y="' + (Hh - B + 18) + '" text-anchor="middle">' + (o.xtekst ? o.xtekst(x) : net(x)) + '</text>'; }
    n = Math.round((o.ymax - o.ymin) / o.ylab);
