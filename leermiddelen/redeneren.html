<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function nr(n){ return Math.floor(Math.random() * n); }
  function kaal(t){ return String(t).replace(/<[^>]+>/g, ''); }
  function hoofd(t){ t = String(t); return t.charAt(0).toUpperCase() + t.slice(1); }
  function zp(t){ t = String(t); return t.charAt(t.length - 1) === '.' ? t.slice(0, -1) : t; }
  function klein(t){ t = String(t); return t.charAt(0).toLowerCase() + t.slice(1); }
  function deel(d){ return { onderdeel: 'redeneren: ' + d, onderdeelNaam: d }; }
  /* een meerkeuzevraag: het goede antwoord staat vooraan, de motor husselt */
  function mk(o){
    return Object.assign(deel(o.deel), { vorm: 'meerkeuze', sleutel: o.sleutel, vraag: o.vraag, opdracht: o.opdracht, beeld: o.beeld,
      opties: [o.goed].concat(o.fout), goed: 0, uitleg: o.uitleg, antwoordTekst: kaal(o.goed) });
  }
  function sl(o){
    return Object.assign(deel(o.deel), { vorm: 'sleep', sleutel: o.sleutel, vraag: o.vraag, opdracht: o.opdracht, beeld: o.beeld, kaarten: o.kaarten, vakken: o.vakken,
      sleepuit: o.sleepuit, uitleg: o.uitleg, antwoordTekst: o.antwoordTekst });
  }
  function ids(p, n){ return H(p.map(function(x, i){ return i; })).slice(0, n).sort(); }
  function citaat(z, wie){ return '<div class="cit"><p>“' + S(z) + '”</p>' + (wie ? '<p class="wie">' + S(wie) + '</p>' : '') + '</div>'; }


  /* ---------- verandering: wat veranderde, wat bleef ---------- */
  /* meerkeuze: [vraag, goed, [drie foute], uitleg] */
  var VER = {
    bb: [
      ['Een boer in het jaar 1300 en een boer in 1900. Wat is voor allebei <b>hetzelfde</b> gebleven?',
        'Ze verbouwen voedsel en houden dieren, en het weer bepaalt of het een goed jaar wordt.',
        ['Ze gebruiken allebei kunstmest uit de fabriek.', 'Ze werken allebei met een tractor met dieselmotor.', 'Ze verkopen allebei hun melk aan een supermarkt.'],
        'Een boer is in 1900 nog steeds afhankelijk van zon en regen, en hij verbouwt en fokt nog steeds. Kunstmest bestond in 1900 wel, maar in 1300 nog niet: dat is dus een verandering. Dieseltractoren en supermarkten zijn van veel later.'],
      ['Kinderen in 1850 en kinderen nu. Wat is er <b>veranderd</b>?',
        'Nu moeten alle kinderen naar school; toen werkten veel kinderen op het land of in de fabriek.',
        ['Nu werken kinderen meer dan toen.', 'Toen gingen alle kinderen al naar de middelbare school.', 'Er is niets veranderd: kinderen deden altijd hetzelfde.'],
        'Rond 1900 kwam de leerplicht, en het Kinderwetje van 1874 verbood al werk in fabrieken voor kinderen onder de twaalf. Wie zegt dat er niets veranderde, vergeet dat het gewone leven van kinderen echt anders werd.'],
      ['In 1800 reisde je naar een andere stad met paard en wagen of met een trekschuit. In de negentiende eeuw kwam er iets nieuws. Wat <b>veranderde</b>?',
        'De trein kwam: reizen werd sneller en goedkoper.',
        ['De auto verving overal het paard.', 'Er kwamen vliegtuigen voor gewone reizigers.', 'Mensen gingen minder reizen, omdat het gevaarlijk werd.'],
        'De eerste trein in Nederland reed in 1839 van Amsterdam naar Haarlem. De auto werd pas na 1900 gewoon, en gewone reizigers in een vliegtuig kwamen nog veel later.'],
      ['Mensen gingen in de tijd van jagers en boeren van rondtrekken naar op één plek wonen. Wat <b>veranderde</b> daardoor?',
        'Ze bouwden dorpen en verbouwden zelf graan.',
        ['Ze gingen vooral jagen en wilde planten verzamelen.', 'Ze gingen in grote steden met een stadsmuur wonen.', 'Ze gebruikten voor het eerst vuur.'],
        'Met landbouw kon je op één plek blijven: je zaaide en je oogstte. Vuur kenden de jagers al lang voor de boeren. Steden met muren komen pas veel later.'],
      ['Voor 1450 schreven monniken boeken met de hand over. Wat <b>veranderde</b> na de uitvinding van de boekdrukkunst?',
        'Boeken werden sneller en goedkoper gemaakt, dus meer mensen konden lezen.',
        ['Er kwamen minder boeken, omdat drukken moeilijker was.', 'Alleen monniken mochten nog boeken lezen.', 'Boeken werden nu gemaakt door machines op stoom.'],
        'Gutenberg ontwikkelde rond 1450 het drukken met losse letters. Een boek hoefde niet meer maanden te kosten. Drukken met stoom kwam pas in de negentiende eeuw.'],
      ['In 1919 veranderde er iets voor Nederlandse vrouwen. Wat?',
        'Ze kregen kiesrecht: ze mochten stemmen.',
        ['Ze mochten voor het eerst werken.', 'Ze mochten voor het eerst naar school.', 'Nederland kreeg zijn eerste koningin.'],
        'Vrouwen werkten al eeuwen, en Nederland had al sinds 1890 een koningin (Wilhelmina). Wat in 1919 veranderde was het stemrecht van vrouwen. Verkiesbaar waren ze al sinds 1917.'],
      ['Nederland in 1900 en nu. Wat is <b>hetzelfde</b> gebleven?',
        'Een koning of koningin is het staatshoofd.',
        ['Vrouwen mogen niet stemmen.', 'Er is geen elektriciteit in de meeste huizen.', 'Mensen betalen met euro’s.'],
        'In 1900 regeerde koningin Wilhelmina, nu koning Willem-Alexander: de monarchie bleef, de persoon wisselde. Vrouwenkiesrecht, elektriciteit in elk huis en de euro zijn nieuw.'],
      ['Een schoenmaker in 1700 maakte schoenen in zijn eigen werkplaats. In 1900 werden schoenen vaak in fabrieken gemaakt. Wat <b>veranderde</b>?',
        'Machines en veel arbeiders maakten veel schoenen tegelijk.',
        ['Er werden minder schoenen gemaakt.', 'Schoenen werden niet meer gedragen.', 'De schoenmaker werd veel rijker dan de fabrikant.'],
        'De industriële revolutie bracht machines en fabrieken. Daardoor werden er veel meer en goedkopere schoenen gemaakt. Veel vakmensen werden arbeider bij een fabrikant.'],
      ['Een ridder rond 1100 en een soldaat in 1916. Wat <b>veranderde</b> er aan het vechten?',
        'Soldaten vochten met machinegeweren en granaten vanuit loopgraven, niet meer te paard met een zwaard.',
        ['Soldaten vochten niet meer voor een land.', 'Alleen de adel ging nog vechten.', 'Er werd niet meer om land en macht gevochten.'],
        'In de Eerste Wereldoorlog (1914 tot 1918) zaten soldaten in loopgraven. De ridder met zijn paard en zwaard hoort bij de middeleeuwen. Hetzelfde bleef wel dat er nog steeds om macht en land werd gevochten.'],
      ['In 1300 kocht je op de markt of bij de ambachtsman. Nu kun je ook in een supermarkt of op internet kopen. Wat is <b>hetzelfde</b> gebleven?',
        'Er zijn kopers en verkopers, en je betaalt voor wat je krijgt.',
        ['Je betaalt met een pinpas.', 'Je bestelt het op je telefoon.', 'Alles komt uit een fabriek.'],
        'De manier veranderde, het idee niet: iemand verkoopt, iemand betaalt. De pinpas, de telefoon en de fabriek zijn nieuw.'],
      ['Rond 1800 gebruikten mensen in huis kaarsen en olielampen. Wat <b>veranderde</b> er in de negentiende en twintigste eeuw?',
        'Er kwamen gaslicht en later elektrisch licht, eerst in steden en later overal.',
        ['Mensen gingen weer terug naar kaarsen.', 'Mensen gingen ineens led-lampen gebruiken.', 'Alleen kerken kregen nog licht.'],
        'Gaslicht kwam in de negentiende eeuw, elektriciteit rond 1900 in de steden en later in elk dorp. Led-lampen zijn van de eenentwintigste eeuw.'],
      ['Op 1 juli 1863 veranderde er iets in Suriname en op de Antillen. Wat?',
        'De slavernij werd wettelijk afgeschaft.',
        ['De belasting op suiker werd afgeschaft.', 'Suriname werd een zelfstandig land.', 'Er kwam een einde aan het werken op plantages.'],
        'In 1863 werd de slavernij afgeschaft. De plantages bleven bestaan, en de mensen moesten nog tot 1873 onder staatstoezicht werken. Zelfstandig werd Suriname pas in 1975.']
    ],
    kgt: [
      ['Rond het jaar 1000 bestuurden lokale heren hun eigen gebied. Rond 1600 was de macht van vorsten in veel landen groter. Wat <b>veranderde</b>?',
        'Vorsten kregen een groter gebied onder hun gezag, met eigen ambtenaren, belasting en soldaten.',
        ['De lokale heren kregen steeds meer macht en de vorsten verdwenen.', 'Vorsten werden overal door het volk gekozen.', 'Er werd geen belasting meer betaald.'],
        'Koninkrijken en staten groeiden: vorsten brachten gebieden onder eigen bestuur, met ambtenaren, belastingen en legers. Dat gebeurde in veel landen, maar niet overal: de Republiek was een uitzondering zonder koning.'],
      ['Na 1517 brak de eenheid van de kerk in West-Europa. Wat bleef <b>hetzelfde</b>?',
        'De meeste Europeanen bleven christen.',
        ['Iedereen bleef katholiek.', 'De paus bleef het hoofd van alle christenen.', 'Mensen stopten met het geloof in God.'],
        'De Reformatie verdeelde de christenen in katholieken en protestanten, maar bijna iedereen bleef christen. De paus was na de breuk niet meer het hoofd van de protestanten.'],
      ['In 1600 voeren VOC-schepen op de wind. Rond 1850 kwamen er stoomschepen. Wat <b>veranderde</b>?',
        'Schepen waren minder afhankelijk van de wind en konden vaste vaartijden halen.',
        ['Schepen kregen voor het eerst kanonnen.', 'Er werd niet meer over zee gehandeld.', 'Schepen werden alleen nog door roeiers voortbewogen.'],
        'Een stoomschip vaart ook zonder wind. Daardoor kon je vaste dienstregelingen maken. Kanonnen hadden schepen al in de zeventiende eeuw.'],
      ['Rond 1850 gingen steeds meer mensen in fabrieken werken in plaats van thuis. Wat <b>veranderde</b> voor die arbeiders?',
        'Ze werkten vaste uren voor loon, onder leiding van een fabrikant, in plaats van voor zichzelf thuis.',
        ['Ze werkten korter en verdienden meer.', 'Ze werkten voor een leenheer.', 'Ze kregen automatisch een pensioen.'],
        'Huisnijverheid werd fabrieksarbeid, met lange dagen en laag loon. Kortere werkdagen kwamen pas later (de achturendag in 1919) en de AOW pas in 1957. Een leenheer hoort bij de middeleeuwen.'],
      ['In 1848 kreeg Nederland, onder koning Willem II, een nieuwe grondwet. Welke <b>verandering</b> volgde?',
        'De koning kon niet meer alleen regeren: de ministers werden verantwoordelijk tegenover de Tweede Kamer.',
        ['Nederland werd een republiek.', 'Alle Nederlanders kregen stemrecht.', 'De koning kreeg meer macht dan daarvoor.'],
        'Thorbecke schreef de grondwet van 1848: de koning bleef, maar de ministers waren verantwoordelijk. Nederland bleef dus een monarchie. Het stemrecht bleef beperkt tot mannen met genoeg inkomen, algemeen kiesrecht kwam in 1917 en 1919.'],
      ['Tussen 1000 en 1400 veranderde de plaats waar veel Hollanders woonden. Wat <b>veranderde</b>?',
        'Steeds meer mensen woonden in steden, die door handel en ambacht groeiden en stadsrechten kregen.',
        ['Steden verdwenen omdat de pest alle mensen doodde.', 'Steden werden door koningen bestuurd.', 'Handel in steden werd verboden.'],
        'Vanaf ongeveer 1000 groeide de handel, en steden als Dordrecht (stadsrechten in 1220) kregen een eigen bestuur. De pest (1349) maakte veel slachtoffers, maar de steden bleven bestaan.'],
      ['Nederland was in 1939 neutraal. Wat <b>veranderde</b> er na de Tweede Wereldoorlog in de buitenlandse politiek?',
        'Nederland was niet langer neutraal en werd in 1949 lid van de NAVO.',
        ['Nederland werd lid van de Sovjet-Unie.', 'Nederland bleef net zo neutraal als voor 1940.', 'Nederland werd een Duitse deelstaat.'],
        'De ervaring van de bezetting (1940 tot 1945) maakte duidelijk dat neutraliteit niet beschermde. In 1949 was Nederland een van de oprichters van de NAVO.'],
      ['Wat <b>veranderde</b> er in 1949 met Indonesië?',
        'Nederland droeg de macht over aan Indonesië, dat zelfstandig werd.',
        ['Indonesië werd een Nederlandse provincie.', 'Nederland veroverde Indonesië.', 'Indonesië werd voor het eerst een Nederlandse kolonie.'],
        'Indonesië riep zichzelf in 1945 onafhankelijk uit. Na een oorlog en onderhandelingen erkende Nederland op 27 december 1949 de soevereiniteit.'],
      ['Na 476 verdween het West-Romeinse Rijk. Wat bleef in veel streken <b>hetzelfde</b>?',
        'Het christendom en het Latijn (in de kerk en bij geleerden) bleven bestaan.',
        ['Het Romeinse leger bewaakte de grenzen.', 'De keizer in Rome bleef regeren.', 'De Romeinse steden bleven even groot.'],
        'De keizer en het leger verdwenen in het westen, en steden slonken. De kerk en het Latijn bleven, en daarom is het Latijn de basis voor talen als Frans en Spaans.'],
      ['Wat <b>veranderde</b> er na 1960 voor vrouwen in Nederland?',
        'Veel meer vrouwen bleven na hun huwelijk werken en gingen studeren.',
        ['Vrouwen kregen kiesrecht.', 'Vrouwen mochten niet meer werken.', 'Er veranderde niets voor vrouwen.'],
        'Kiesrecht kwam al in 1919. Voor de jaren zestig stopten veel gehuwde vrouwen met werken. Met de anticonceptiepil (1962) en de tweede feministische golf kozen steeds meer vrouwen voor studie en werk.'],
      ['Rond 1500 kende Europa Amerika niet. Wat <b>veranderde</b> in de zestiende eeuw?',
        'Europeanen kregen contact met Amerika, en de handel verschoof naar de Atlantische Oceaan.',
        ['De handel stopte omdat er geen schepen meer bestonden.', 'Europa werd een deel van het Chinese rijk.', 'De handel verplaatste zich naar het Oosten.'],
        'Na Columbus (1492) kwamen Spanjaarden en later Nederlanders en Engelsen in Amerika. De handel over de Atlantische Oceaan werd belangrijk, onder andere door de slavenhandel en de handel in suiker en zilver.'],
      ['Wat <b>veranderde</b> er tussen 1950 en 1970 in de huiskamers in Nederland?',
        'De televisie kwam in bijna elk huis, naast de radio.',
        ['De radio werd uitgevonden.', 'Mensen kregen voor het eerst elektrisch licht.', 'De computer kwam bij bijna iedereen thuis.'],
        'De Nederlandse televisie begon in 1951 en groeide snel. De radio bestond al sinds de jaren twintig, elektrisch licht kwam eerder, en de computer thuis pas na 1980.']
    ],
    hv: [
      ['Historici spreken van een “keerpunt” in de geschiedenis. Wat is dat?',
        'Een moment of korte periode waarna de ontwikkeling een andere richting kreeg.',
        ['Het moment waarop alles in één dag veranderde.', 'Een gebeurtenis die altijd een oorlog is.', 'Een jaartal dat alle historici kiezen om een tijdvak te beginnen.'],
        'Een keerpunt is een moment waarna dingen duidelijk anders gaan, zoals 1789 of 1945. Het hoeft niet in één dag te gebeuren, en het hoeft geen oorlog te zijn.'],
      ['De overgang van jagen en verzamelen naar landbouw wordt soms de “neolithische revolutie” genoemd. Waarom is het woord revolutie misleidend?',
        'Omdat de overgang duizenden jaren duurde en op elke plek op een ander moment gebeurde.',
        ['Omdat de landbouw in één jaar over de hele wereld begon.', 'Omdat jagers al landbouw kenden.', 'Omdat er geen verandering plaatsvond.'],
        'Een revolutie klinkt als snel en plotseling, maar de landbouw verspreidde zich geleidelijk. In het Midden-Oosten begon ze rond 9000 v.Chr., in Nederland pas rond 5000 v.Chr.'],
      ['De industrialisatie van de negentiende eeuw wordt vaak vooruitgang genoemd. Voor wie was het in de eerste decennia <b>niet</b> vooruitgang?',
        'Voor veel arbeiders, die lange dagen werkten voor laag loon in slechte woonomstandigheden.',
        ['Voor de fabrikanten, die hun productie zagen stijgen.', 'Voor de consumenten, die goedkopere spullen kregen.', 'Voor niemand, want iedereen ging erop vooruit.'],
        'Verandering is niet hetzelfde als vooruitgang: dat hangt af van voor wie. De productie steeg, maar veel arbeiders hadden het in de eerste jaren zwaar. Pas later kwamen arbeidswetten en hogere lonen.'],
      ['Wat bleef tijdens de Gouden Eeuw in de Republiek <b>hetzelfde</b> als in de middeleeuwen?',
        'Wind, water en spierkracht waren nog de belangrijkste energiebronnen.',
        ['De macht van een erfelijke koning over het hele land.', 'Het leenstelsel bepaalde de verhoudingen op het platteland.', 'Alle mensen waren katholiek.'],
        'Windmolens, waterkracht en spierkracht van mensen en dieren bleven de belangrijkste energiebronnen tot de stoommachine. De Republiek had geen koning, het leenstelsel was verdwenen en na de Reformatie waren de Nederlanden verdeeld.'],
      ['De Fransen voerden vanaf 1795 en onder Napoleon veel nieuwe dingen in. Welke <b>verandering</b> bleef na het vertrek van Napoleon in Nederland bestaan?',
        'Gelijkheid voor de wet en een wetboek (de Code Civil, later het Nederlands Burgerlijk Wetboek) bleven.',
        ['De standen van adel, geestelijkheid en burgers werden weer hersteld.', 'Nederland bleef een deel van Frankrijk.', 'Het koningschap werd afgeschaft.'],
        'Na 1813 kwam Willem I als koning van een onafhankelijk land, maar de gelijkheid voor de wet en de burgerlijke registratie bleven. Zo kwam in 1838 het Burgerlijk Wetboek, dat op de Franse wetten was gebaseerd.'],
      ['Welke <b>verandering</b> verliep geleidelijk, in plaats van abrupt?',
        'Het verdwijnen van het Romeinse gezag in West-Europa, in de vierde en vijfde eeuw.',
        ['De bestorming van de Bastille in 1789.', 'De val van de Berlijnse Muur in 1989.', 'De Duitse inval in Nederland in mei 1940.'],
        'In 476 zette Odoaker de laatste West-Romeinse keizer af, maar het gezag brokkelde al eeuwen af. De Bastille, de Muur en de inval waren gebeurtenissen van één dag en betekenden direct een breuk.'],
      ['Waarom nemen historici 1500 vaak als grens tussen de middeleeuwen en de nieuwe tijd?',
        'Omdat veel ontwikkelingen daar samenkomen, zoals ontdekkingsreizen en boekdrukkunst, maar het blijft een keuze van historici.',
        ['Omdat mensen in 1500 merkten dat de middeleeuwen voorbij waren.', 'Omdat in 1500 alle oorlogen ophielden.', 'Omdat er in 1500 een nieuwe kalender kwam.'],
        'Tijdvakken zijn een hulpmiddel van historici om het verleden te ordenen. Mensen in 1500 leefden niet in een “nieuwe tijd”. De grens is een keuze, omdat veel veranderingen rond die tijd samenkomen.'],
      ['De industrialisatie kwam in Nederland later op gang dan in Engeland. Wat is een goede verklaring?',
        'Nederland had weinig steenkool en ijzer, en de economie draaide al goed op handel en scheepvaart.',
        ['Nederlanders wilden geen machines.', 'Nederland deed niet mee aan internationale handel.', 'Er waren in Nederland geen rivieren.'],
        'Engeland had steenkool en ijzer dichtbij. Nederland leefde lang van handel en landbouw, en de industriële doorbraak kwam pas na 1850. De Nederlandse economie deed wel mee aan de handel, en rivieren waren er juist veel.'],
      ['Een historicus zegt: “De boekdrukkunst veroorzaakte de Reformatie.” Welke <b>nuance</b> is terecht?',
        'De drukpers hielp bij de verspreiding van de ideeën, maar ontevredenheid over de kerk en politieke belangen speelden ook een rol.',

      { g: 'arbeid', w: 'een textielarbeider', j: '1885', z: 'Een werkdag van twaalf uur is veel te lang. Wij moeten meer loon en kortere dagen krijgen.',

        f: ['Hij was eigenaar van de fabriek en wilde meer winst.', 'Hij werkte maar twee uur per dag.'],
        nu: 'Nu is een werkweek van ongeveer veertig uur gewoon, met vakantie, en vakbonden komen op voor werknemers.',

      { g: 'veldheer', w: 'Julius Caesar, een Romeinse veldheer', j: 'ongeveer 50 v.Chr.', z: 'De Galliërs zijn woest en gevaarlijk. Daarom moest ik ze wel onderwerpen.',

        nu: 'Nu zien we dat de verovering van de Banda-eilanden in 1621 gepaard ging met veel geweld: veel bewoners werden gedood of weggevoerd. Dat vinden veel mensen onaanvaardbaar.',
        u: 'Jan Pieterszoon Coen veroverde de eilanden in 1621. Voor de VOC telde de winst. Wat een bestuurder zegt hangt dus samen met zijn bedrijf.' },
      { g: 'leenstelsel', w: 'een horige boer', j: '1100', z: 'Ik werk voor de heer en geef een deel van mijn oogst af, maar hij beschermt ons dorp.',

        nu: 'Nu zijn we vrij: niemand is nog het eigendom van een heer, en we betalen belasting aan de overheid.',
        u: 'Een horige had weinig keuze. De hele samenleving was zo ingericht: bescherming in ruil voor werk. Wat hij zegt, past bij zijn plek in dat stelsel.' },
      { g: 'indie', w: 'een jonge Indonesiër', j: '1945', z: 'Wij willen niet meer onder Nederland vallen. Indonesië moet vrij zijn.',

      { g: 'kiesrecht', w: 'een vrouw die kiesrecht eist, zoals Aletta Jacobs', j: '1900', z: 'Vrouwen moeten mogen stemmen. De wetten gelden ook voor ons.',

      { g: 'reformatie', w: 'een katholieke priester', j: '1560', z: 'Protestanten zijn ketters. De kerk moet één blijven.',

      { g: 'beeldenstorm', w: 'een calvinist', j: '1566', z: 'Beelden in de kerk zijn afgoderij. Ze moeten weg.',

      { g: 'germanen', w: 'een Romeinse burger', j: 'ongeveer 50 na Chr.', z: 'De Germanen zijn barbaren. Ze kennen onze wetten en onze steden niet.',

      { g: 'vrouwenrol', w: 'een vader', j: '1950', z: 'Mijn dochter hoeft niet te studeren. Ze gaat toch trouwen.',

    kgt: [
      { g: 'pest', w: 'een bange stedeling', j: '1349', z: 'De pest is gekomen doordat de joden de bronnen hebben vergiftigd.',

        f: ['Hij was arts en wist precies hoe de ziekte werkte.', 'Hij had bewijs gezien dat de bronnen vergiftigd waren.'],

      { g: 'amerika', w: 'Christoffel Columbus', j: '1493', z: 'Ik heb eilanden bereikt die dicht bij Indië liggen. Ze zijn rijk aan goud, en de bewoners kunnen christen worden.',

        u: 'In zijn Apologie (1580) verdedigde Willem zijn verzet. Zo’n tekst is bedoeld om te overtuigen, niet om neutraal te informeren.' },

      { g: 'kinderarbeid2', w: 'Samuel van Houten, Kamerlid', j: '1874', z: 'Werk door kinderen in fabrieken moet worden verboden. Ze horen te leren en te spelen.',

      { g: 'indie2', w: 'een Nederlandse legerofficier', j: '1947', z: 'Wij herstellen in Indië de rust en de orde. Dit is een politionele actie.',

      { g: 'cultuurstelsel', w: 'een Nederlandse bestuurder', j: '1840', z: 'Javaanse boeren moeten een deel van hun land gebruiken voor koffie en suiker voor de Nederlandse staat. Nederland heeft het geld nodig.',

        f: ['Hij wilde dat Javaanse boeren vrij konden kiezen wat ze verbouwden.', 'Hij werkte voor de Javaanse vorsten.'],

      { g: 'marron', w: 'een gevluchte tot slaaf gemaakte in Suriname', j: '1750', z: 'Wij leven vrij in het binnenland en laten ons nooit meer vangen.',

        nu: 'Nu worden marrons gezien als vrijheidsstrijders. Hun nazaten (de Marrons) vormen eigen gemeenschappen in Suriname.',

      { g: 'gastarbeid', w: 'een gastarbeider uit Turkije', j: '1970', z: 'Ik werk een paar jaar in Nederland, spaar geld en ga dan terug naar huis.',

    hv: [
      { g: 'tacitus', w: 'de Romeinse schrijver Tacitus', j: '98 na Chr.', z: 'De Germanen zijn eenvoudig, eerlijk en trouw. Zij zijn vrij van de bedorvenheid van Rome.',

      { g: 'lascasas', w: 'de priester Bartolomé de las Casas', j: '1542', z: 'De Spanjaarden behandelen de inwoners van Amerika wreed en laten ze sterven door dwangarbeid.',

        u: 'Een getuige die wil overtuigen is waardevol en tegelijk partijdig. De waarde van zo’n bron hangt af van wat je ermee wilt weten.' },
      { g: 'marx', w: 'Karl Marx en Friedrich Engels', j: '1848', z: 'De geschiedenis van alle samenlevingen is tot nu toe de geschiedenis van klassenstrijd.',

        f: ['Ze waren regeringsleiders die de arbeiders wilden kalmeren.', 'Ze beschreven zonder politieke bedoeling alleen de feiten.'],

        u: 'Een verklaring en een politiek doel kunnen samengaan. Zo’n tekst zegt iets over de industriële tijd van Marx en iets over wat hij wilde bereiken.' },
      { g: 'munich', w: 'Neville Chamberlain, Brits premier', j: '1938', z: 'Het akkoord met Hitler brengt vrede voor onze tijd.',

        u: 'Beoordeel iemand niet alleen met wat je achteraf weet. Wat kon hij toen weten, en welke keuzes had hij?' },
      { g: 'multatuli', w: 'Multatuli (Eduard Douwes Dekker)', j: '1860', z: 'Het systeem in Indië is oneerlijk: de Javaanse boer wordt uitgebuit door zijn eigen hoofden en door Nederland.',

        u: 'Multatuli sprak voor de Javanen zonder dat ze zelf aan het woord kwamen. Zijn boek is dus kritiek, maar ook een tekst van een Nederlander voor Nederlanders.' },
      { g: 'degroot', w: 'Hugo de Groot', j: '1609', z: 'De zee is van iedereen. Geen land mag de vrije vaart verbieden.',

        u: 'Het principe klinkt neutraal, maar paste bij het belang van de opdrachtgever. Later verdedigde de VOC zelf juist een monopolie op de specerijenhandel.' },
      { g: 'luther', w: 'Maarten Luther', j: '1517', z: 'Een aflaat helpt niet. Alleen door geloof word je gered.',
        why: 'Hij was monnik en hoogleraar die twijfelde aan de leer van de kerk, en hij wilde de kerk hervormen. Ook zijn kritiek op de geldzucht van de kerk telde mee.',
        f: ['Hij was de paus en wilde de aflaathandel verdedigen.', 'Hij wilde het geloof helemaal afschaffen.'],
        nu: 'Nu zien historici dat de Reformatie niet alleen over geloof ging: de drukpers en vorsten die zich van Rome wilden losmaken speelden ook mee.',
        u: 'Luther sprak vanuit zijn geloofsovertuiging, maar zijn boodschap kreeg kracht door wat er om hem heen gebeurde.' },
      { g: 'vs', w: 'een Amerikaanse kolonist', j: '1776', z: 'Wij betalen belasting aan Engeland, maar hebben geen stem in het parlement. Dat is onrecht.',
        why: 'De kolonisten wilden politieke invloed en waren het zat dat het Britse parlement hen belastte zonder dat ze er een stem in hadden.',

        u: 'Vrijheid voor wie? De kolonisten spraken over vrijheid, maar bedoelden vooral de vrijheid van witte mannen met bezit.' },
      { g: 'ethisch', w: 'een Nederlandse onderwijzer in Indië', j: '1920', z: 'Wij hebben de plicht om de Indonesiërs te ontwikkelen. Dat is de Ethische Politiek.',

        u: 'Goed bedoelde plannen kunnen toch machtsverhoudingen in stand houden. De Ethische Politiek (1901) bracht onderwijs en zorg, maar de macht bleef bij Nederland.' },
      { g: 'revolutie', w: 'een Franse edelman', j: '1789', z: 'De oude rangen en voorrechten horen bij Frankrijk. De standen moeten blijven zoals ze zijn.',
        why: 'Als lid van de adel had hij voorrechten, zoals vrijstelling van belasting, die hij zou verliezen.',
        f: ['Hij was een boer die zijn vorst trouw bleef.', 'Hij wilde dat de koning meer macht kreeg dan de adel.'],

      { g: 'marcopolo', w: 'de reiziger Marco Polo', j: 'ongeveer 1300', z: 'Aan het hof van de Khan is meer rijkdom dan je je kunt voorstellen.',

      opdracht: niv === 'bb' ? 'Denk aan wat er toen was en wat er nu is.' : niv === 'kgt' ? 'Let op: wat verandert er, en wat blijft?' : 'Verandering heeft oorzaken, een tempo en winnaars en verliezers.' });
  }

  /* ---------- 2. anachronisme ---------- */
  var T = { bb: 0, kgt: 1, hv: 2 };
  function lastigUit(sc){ return 'De zin “' + S(sc.lastig[0]) + '” lijkt misschien niet te kloppen, maar dat doet hij wel: ' + S(sc.lastig[1].replace(/^Dat klopt: /, '')); }
  function anachronisme(niv){
    var t = T[niv], si = nr(SCENES.length), sc = SCENES[si], a = sc.a[t], r = Math.random();
    var beeld = '<div class="cit"><p class="wie" style="margin:0">' + S(hoofd(sc.p)) + '</p></div>';
    if (r < .27){
      /* sorteren: klopt of klopt niet */
      var kw = niv === 'bb' ? [0, 1] : [1, 2], goedeZinnen = H(sc.ok).slice(0, 3), metLastig = niv === 'hv' || (niv === 'kgt' && Math.random() < .5);
      if (metLastig) goedeZinnen = goedeZinnen.slice(0, 2).concat([sc.lastig[0]]);
      var kaarten = [], klopt = [], mis = [];
      goedeZinnen.forEach(function(z, i){ kaarten.push({ id: 'k' + i, tekst: S(z) }); klopt.push('k' + i); });
      kw.forEach(function(k, i){ kaarten.push({ id: 'n' + i, tekst: S(sc.a[k][0]) }); mis.push('n' + i); });
      return sl({ deel: 'anachronisme', sleutel: 'asl' + niv + si + '-' + goedeZinnen.map(function(z){ return sc.ok.indexOf(z); }).join(''),
        vraag: 'Een leerling schrijft over <b>' + S(sc.p) + '</b>. Welke zinnen kloppen, en welke niet?',
        opdracht: 'Kon dit toen al bestaan? Sleep elke zin naar klopt of klopt niet.',
        kaarten: kaarten,
        vakken: [{ id: 'ja', naam: 'klopt', uit: 'past bij die tijd', hoort: klopt }, { id: 'nee', naam: 'klopt niet', uit: 'anachronisme', hoort: mis }],
        uitleg: kw.map(function(k){ return '“' + S(sc.a[k][0]) + '” klopt niet. ' + S(sc.a[k][1]); }).join(' ') + (metLastig ? ' ' + lastigUit(sc) : ' De andere zinnen passen bij die tijd.') + ' Dit is ' + S(sc.tv) + '.',
        antwoordTekst: 'klopt niet: ' + kw.map(function(k){ return sc.a[k][0]; }).join(' ') });
    }
    if (r < .55){
      /* waarom klopt het niet */
      var anderen = H(SCENES.filter(function(x, i){ return i !== si; })).slice(0, 2).map(function(x){ return x.a[t][1]; });
      var algemeen = kies(['Dit bestond al, maar alleen voor mensen met veel geld.', 'Dit bestond al, maar de kerk had het verboden.', 'Dit bestond al, maar niemand durfde het te gebruiken.', 'Dit bestond al, maar niet in dit deel van de wereld.']);
      return mk({ deel: 'anachronisme', sleutel: 'aw' + niv + si, vraag: 'Waarom klopt deze zin <b>niet</b> bij ' + S(sc.p) + '?',
        opdracht: 'Wat is de reden? Kies de uitleg die bij deze zin hoort.',
        beeld: citaat(a[0], hoofd(sc.p)), goed: S(a[1]), fout: anderen.map(S).concat([algemeen]),
        uitleg: S(a[1]) + ' Dit is ' + S(sc.tv) + '. Het antwoord “' + algemeen + '” klopt niet: het gaat er niet om of iemand het mocht of durfde, maar of het toen al bestond. Dat noem je een anachronisme: iets dat niet bij die tijd hoort.' });
    }
    /* welke zin klopt niet */
    var normaal = H(sc.ok), kiezen = niv === 'hv' ? normaal.slice(0, 2).concat([sc.lastig[0]]) : (niv === 'kgt' && Math.random() < .5 ? normaal.slice(0, 2).concat([sc.lastig[0]]) : normaal.slice(0, 3));
    var lastigErin = kiezen.indexOf(sc.lastig[0]) >= 0;
    return mk({ deel: 'anachronisme', sleutel: 'ad' + niv + si, vraag: 'Een leerling beschrijft <b>' + S(sc.p) + '</b>. Welke zin klopt <b>niet</b> bij die tijd?',
      opdracht: niv === 'bb' ? 'Denk na: kon dit toen al bestaan?' : niv === 'kgt' ? 'Welke uitvinding of gebeurtenis komt pas later?' : 'Let op: wat modern lijkt, kan toch kloppen, en andersom.',
      goed: S(a[0]), fout: kiezen.map(S),
      uitleg: S(a[1]) + ' Dit is ' + S(sc.tv) + '. ' + (lastigErin ? lastigUit(sc) : 'De andere zinnen passen wel bij die tijd.') });
  }

  /* ---------- 3. standplaats ---------- */
  var GEN = [
    ['Omdat iedereen in die tijd er hetzelfde over dacht.', 'ook toen verschilden mensen van mening, en wat iemand zegt hangt samen met zijn plaats en zijn belang.'],
    ['Omdat hij gewoon de neutrale waarheid vertelt.', 'niemand kijkt van buitenaf: wie iets zegt, spreekt vanuit zijn eigen positie.'],
    ['Omdat mensen vroeger minder slim waren dan wij.', 'mensen waren niet dommer: ze wisten andere dingen en hadden andere belangen en waarden.'],
    ['Omdat hij het eigenlijk helemaal niet meent.', 'er is geen reden om te denken dat hij liegt. Wat hij zegt past bij zijn positie.']
  ];
  function standplaats(niv){
    var r = Math.random();
    if (r < .22){
      var si = nr(STASLEEP[niv].length), x = STASLEEP[niv][si], pi = ids(x.p, 3), kaarten = [], vakken = [];
      pi.forEach(function(i){ kaarten.push({ id: 'z' + i, tekst: '“' + S(x.p[i][1]) + '”' }); vakken.push({ id: 'p' + i, naam: S(x.p[i][0]), hoort: ['z' + i] }); });
      return sl({ deel: 'standplaats', sleutel: 'ss' + niv + si + '-' + pi.join(''),
        vraag: 'Een gesprek over <b>' + S(x.t) + '</b>. Wie zegt wat?',
        opdracht: 'Denk aan wie iedereen is en wat hij wil of verliest. Sleep elke uitspraak naar de persoon die dit het waarschijnlijkst zegt.',
        kaarten: kaarten, vakken: vakken,
        uitleg: pi.map(function(i){ return S(x.p[i][0]) + ' ' + S(x.p[i][2]) + '.'; }).join(' ') + ' Wat iemand zegt hangt samen met zijn positie, zijn belang en zijn tijd. Dat is zijn standplaats.',
        antwoordTekst: pi.map(function(i){ return x.p[i][0] + ': ' + x.p[i][1]; }).join(' / ') });
    }
    var L = STA[niv], i = nr(L.length), x = L[i], wie = hoofd(x.w) + ', ' + x.j;
    if (r < .58){
      var gen = kies(GEN);
      return mk({ deel: 'standplaats', sleutel: 'sw' + niv + i, vraag: 'Waarom zegt deze persoon dit?',
        opdracht: niv === 'bb' ? 'Denk aan wie hij is, wat hij wil en wanneer hij leeft.' : niv === 'kgt' ? 'Denk aan zijn plaats in de samenleving, zijn belang en zijn tijd.' : 'Wat verklaart zijn standpunt: zijn positie, zijn doel of zijn publiek?',
        beeld: citaat(x.z, wie), goed: S(x.why), fout: x.f.map(S).concat([gen[0]]),
        uitleg: S(x.u) + ' Het antwoord “' + gen[0] + '” klopt niet: ' + gen[1] });
    }
    if (r < .8){
      var anderen = H(L.filter(function(y){ return y.g !== x.g; })).slice(0, 3).map(function(y){ return S(y.nu); });
      return mk({ deel: 'standplaats', sleutel: 'sn' + niv + i, vraag: 'Hoe kijkt iemand van nu hier <b>anders</b> tegenaan?',
        opdracht: 'Let op: het gaat om dít onderwerp, niet om een ander.',
        beeld: citaat(x.z, wie), goed: S(x.nu), fout: anderen,
        uitleg: S(x.nu) + ' Wat hij toen zei, past bij zijn plaats en tijd. Wie nu kijkt, weet meer en heeft andere waarden. De andere antwoorden gaan over andere onderwerpen.' });
    }
    var afleiders = H(L.filter(function(y){ return y.g !== x.g; })).slice(0, 3).map(function(y){ return S(hoofd(y.w) + ' (' + y.j + ')'); });
    return mk({ deel: 'standplaats', sleutel: 'sv' + niv + i, vraag: 'Wie zegt dit waarschijnlijk?',
      opdracht: 'Denk aan wie dit zou zeggen gezien zijn belang en zijn tijd.',
      beeld: citaat(x.z, ''), goed: S(hoofd(x.w) + ' (' + x.j + ')'), fout: afleiders,
      uitleg: 'Dit past bij ' + S(x.w) + ' (' + S(x.j) + '). ' + S(x.why) + ' ' + S(x.u) });
  }

  /* ---------- 4. vergelijken ---------- */
  function vergelijken(niv){
    var P = VGL[niv], i = nr(P.length), p = P[i], r = Math.random();
    var beeld = '<div class="vgl"><div><b>' + S(hoofd(p.a)) + '</b><small>' + S(p.ta) + '</small></div><span class="vs">naast</span><div><b>' + S(hoofd(p.b)) + '</b><small>' + S(p.tb) + '</small></div></div>';
    function alleen(zin, wie){ return '“' + S(zin) + '” geldt alleen voor ' + S(wie) + '.'; }
    if (r < .24){
      var n = niv === 'bb' ? [2, 1, 2] : niv === 'kgt' ? [2, 2, 2] : [3, 2, 3], xi = ids(p.x, n[0]), ki = ids(p.k, n[1]), yi = ids(p.y, n[2]), kaarten = [];
      xi.forEach(function(j){ kaarten.push({ id: 'x' + j, tekst: S(p.x[j]) }); });
      ki.forEach(function(j){ kaarten.push({ id: 'k' + j, tekst: S(p.k[j]) }); });
      yi.forEach(function(j){ kaarten.push({ id: 'y' + j, tekst: S(p.y[j]) }); });
      return sl({ deel: 'vergelijken', sleutel: 'vs' + niv + i + '-' + xi.join('') + ki.join('') + yi.join(''),
        vraag: 'Wat hoort bij <b>' + S(p.a) + '</b>, wat bij <b>' + S(p.b) + '</b> en wat bij allebei?',
        opdracht: 'Sleep elke zin naar het vak waar hij bij hoort.', beeld: beeld, kaarten: kaarten,
        vakken: [{ id: 'a', naam: S(hoofd(p.a)), uit: 'alleen hier', hoort: xi.map(function(j){ return 'x' + j; }) }, { id: 'k', naam: 'allebei', uit: 'een overeenkomst', hoort: ki.map(function(j){ return 'k' + j; }) }, { id: 'b', naam: S(hoofd(p.b)), uit: 'alleen hier', hoort: yi.map(function(j){ return 'y' + j; }) }],
        uitleg: 'Alleen ' + S(p.a) + ': ' + xi.map(function(j){ return S(p.x[j]); }).join(' ') + ' Alleen ' + S(p.b) + ': ' + yi.map(function(j){ return S(p.y[j]); }).join(' ') + ' Allebei: ' + ki.map(function(j){ return S(p.k[j]); }).join(' ') + ' ' + S(p.u),
        antwoordTekst: 'alleen ' + p.a + ': ' + xi.map(function(j){ return p.x[j]; }).join(' ') + ' / allebei: ' + ki.map(function(j){ return p.k[j]; }).join(' ') + ' / alleen ' + p.b + ': ' + yi.map(function(j){ return p.y[j]; }).join(' ') });
    }
    if (r < .5){
      var goed = kies(p.k), a1 = kies(p.x), b1 = kies(p.y), rest = p.x.concat(p.y).filter(function(z){ return z !== a1 && z !== b1; }), c1 = kies(rest);
      var eig = p.x.indexOf(a1) >= 0 ? p.a : p.b;
      return mk({ deel: 'vergelijken', sleutel: 'vk' + niv + i + '-' + p.k.indexOf(goed), vraag: 'Welke zin is een <b>overeenkomst</b> tussen ' + S(p.a) + ' en ' + S(p.b) + '?',
        opdracht: 'Een overeenkomst geldt voor allebei.', beeld: beeld, goed: S(goed), fout: [a1, b1, c1].map(S),
        uitleg: 'Dit geldt voor allebei: “' + S(goed) + '” ' + 'Verleidelijk is “' + zp(S(a1)) + '”, maar die zin geldt alleen voor ' + S(p.a) + '. ' + S(p.u) });
    }
    var metA = r < .75, goedL = metA ? p.x : p.y, ander = metA ? p.y : p.x, wie = metA ? p.a : p.b, anderNaam = metA ? p.b : p.a;
    var g = kies(goedL), kk = kies(p.k), o1 = kies(ander), o2 = kies(ander.filter(function(z){ return z !== o1; }));
    return mk({ deel: 'vergelijken', sleutel: 'vv' + niv + i + (metA ? 'a' : 'b') + '-' + goedL.indexOf(g), vraag: 'Wat geldt voor <b>' + S(wie) + '</b>, maar <b>niet</b> voor ' + S(anderNaam) + '?',
      opdracht: 'Een verschil geldt voor één van de twee, niet voor allebei.', beeld: beeld, goed: S(g), fout: [kk, o1, o2].map(S),
      uitleg: 'Alleen ' + S(wie) + ': “' + S(g) + '” Verleidelijk is “' + zp(S(kk)) + '”, maar dat geldt voor allebei, dus dat is een overeenkomst en geen verschil. ' + S(p.u) });
  }

  var SOORTEN = { verandering: verandering, anachronisme: anachronisme, standplaats: standplaats, vergelijken: vergelijken };

  VAKSPEL.maak({
    id:'redeneren', naam:'Denk als een historicus', vak:'ges', kleur:'#204ECF',
    hand:'wat veranderde, wat bleef, wie zegt dit?',
    lead:'Historici weten niet alleen jaartallen, ze redeneren ook. Wat veranderde er tussen twee momenten, en wat bleef gelijk? Wat klopt er niet in een beschrijving van een tijd? Waarom zegt iemand dit, gezien wie hij is en wanneer hij leefde? En wat is een overeenkomst of een verschil tussen twee situaties? Dat oefen je hier, met de tien tijdvakken als stof.',
    hoe:[
      { kop:'Verandering en anachronisme', tekst:'Bij <b>verandering</b> bepaal je wat anders werd en wat hetzelfde bleef. Bij <b>anachronisme</b> zoek je wat niet bij de tijd past: een monnik met een bril in het jaar 600.' },
      { kop:'Standplaats', tekst:'Iemand zegt iets gezien zijn <b>positie</b>, zijn belang en zijn tijd. Een slavenhouder praat anders over slavernij dan een tot slaaf gemaakte, en iemand van nu weer anders.' },
      { kop:'Vergelijken', tekst:'Je legt twee situaties naast elkaar, zoals Athene en Sparta, en zoekt wat <b>hetzelfde</b> en wat <b>anders</b> is. Meestal kies je het antwoord, soms sleep je de zinnen naar het goede vak.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb', uit:'Concrete situaties uit het dagelijks leven, en duidelijke anachronismen zoals een mobiele telefoon bij de Romeinen.' },
        { id:'kgt', naam:'vmbo-kgt en tl', uit:'Ook kenmerkende aspecten en gebeurtenissen: de Reformatie, de VOC, de Industriële Revolutie. Anachronismen die je moet dateren.' },
        { id:'hv', naam:'havo en vwo', uit:'Ook begrippen als keerpunt, hindsight, bronnen met een bedoeling en meerdere oorzaken. Subtiele anachronismen.' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' },
        { id:'verandering', naam:'verandering', uit:'Wat veranderde er tussen twee momenten, en wat bleef hetzelfde?' },
        { id:'anachronisme', naam:'anachronisme', uit:'Wat klopt er niet in deze beschrijving van een tijd, en waarom?' },
        { id:'standplaats', naam:'standplaats', uit:'Waarom zegt deze persoon dit, en hoe kijkt iemand van nu er anders tegenaan?' },
        { id:'vergelijken', naam:'vergelijken', uit:'Twee situaties naast elkaar: wat is een overeenkomst en wat een verschil?' } ] }
    ],
    aantal:10,
    maak:function(keuze, nr){
      var soort = keuze.soort === 'alles' ? kies(['verandering', 'anachronisme', 'standplaats', 'vergelijken']) : keuze.soort;
      return SOORTEN[soort](keuze.niveau);
    },
    uitleg:{ doel:'Historisch redeneren: verandering en continuïteit, anachronismen herkennen, de standplaats van een bron begrijpen en twee situaties vergelijken.', tijd:'twintig opgaven per ronde, of kies 10 of 30', bediening:'Kies het antwoord dat klopt (of druk op 1 tot 4). Bij sorteren sleep je de zinnen naar het goede vak; op een telefoon tik je een zin en dan het vak.' }
  });
})();
