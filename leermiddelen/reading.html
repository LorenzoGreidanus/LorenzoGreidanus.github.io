<style>
/* het tekstvak: een kop, de tekst in alinea's, links uitgelijnd, met een kantlijn in de spelkleur */
.leestekst{width:100%;max-width:640px;background:var(--kaart2);border-radius:16px;padding:16px 22px 18px;text-align:left;border-left:5px solid var(--nadruk)}
.leestekst h3{font-size:1.15rem;margin-bottom:8px;letter-spacing:-.01em}
.leestekst p{font-size:.98rem;line-height:1.65;font-weight:400}
.leestekst p+p{margin-top:10px}
.leestekst b.ws{background:var(--nadruk-zacht);color:var(--ink);border-radius:5px;padding:0 4px;font-weight:600}
.vraag .ws{color:var(--nadruk)}
@media (max-width:560px){.leestekst{padding:14px 14px 16px}.leestekst p{font-size:.94rem}}
body.groot .leestekst{max-width:820px}
body.groot .leestekst p{font-size:1.2rem}
/* De tekst en de vraag samen in beeld. Het tekstvak heeft een vaste hoogte en je scrolt erin; een schaduw aan
   de boven- of onderrand laat zien dat er nog tekst is, en eronder staat dat de tekst verdergaat. Op een breed
   scherm staat de tekst links en de vraag met de antwoorden rechts, en de tekst blijft staan als je verder scrolt.
   Alleen in het spel: op een werkblad staat de hele tekst gewoon op papier. */
:root{--randschaduw:rgba(20,34,76,.32)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--randschaduw:rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--randschaduw:rgba(0,0,0,.7)}
#scherm-spel .leestekst{position:relative;overflow-y:auto;max-height:min(46vh,30rem);scrollbar-width:thin;scrollbar-color:var(--muted) transparent;
  background:linear-gradient(var(--kaart2) 30%, transparent) center top / 100% 36px no-repeat local,
    linear-gradient(transparent, var(--kaart2) 70%) center bottom / 100% 36px no-repeat local,
    radial-gradient(farthest-side at 50% 0, var(--randschaduw), transparent) center top / 100% 14px no-repeat scroll,
    radial-gradient(farthest-side at 50% 100%, var(--randschaduw), transparent) center bottom / 100% 14px no-repeat scroll,
    var(--kaart2)}
#scherm-spel .leestekst:focus-visible{outline:3px solid var(--nadruk);outline-offset:2px}
.meertekst{margin-top:6px;font-size:.8rem;color:var(--muted);text-align:center}
@media (min-width:900px){
  #scherm-spel .kaart{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);grid-template-rows:repeat(6,auto) 1fr;column-gap:28px;align-items:start}
  #scherm-spel .kaart>*{grid-column:2;min-width:0}
  #scherm-spel .kaart>#beeld{grid-column:1;grid-row:1 / -1;position:sticky;top:78px;margin:0;display:block}
  #scherm-spel .kaart>.onderdeel,#scherm-spel .kaart>.vraag,#scherm-spel .kaart>.opdracht{text-align:left}
  #scherm-spel .leestekst{max-width:none;max-height:calc(100vh - 190px)}
  /* de vier vakken voor de volgorde twee aan twee: in de smallere kolom passen er geen vier naast elkaar */
  #scherm-spel .vakken.rij{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
<script src="/vangnet.js" defer></script>

<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script src="reading-opgaven.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon, T = window.READING_OPGAVEN;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  var NIV = { bb:0, kgt:1, hv:2 };
  var NAAM = { hoofd:'hoofdgedachte', detail:'detail', woord:'woord uit de context', volgorde:'volgorde' };

  /* het tekstvak; bij een woordvraag staat dat woord vet in de tekst */
  function tekstvak(t, woord){
    var html = S(t.tekst);
    if (woord) html = html.replace(new RegExp('\\b(' + woord + ')\\b'), '<b class="ws">$1</b>');
    /* tabindex en een naam: met het toetsenbord kun je in het vak scrollen (pijltjes), een schermlezer noemt het "de tekst" */
    return '<article class="leestekst" tabindex="0" role="region" aria-label="De tekst: ' + S(t.kop) + '"><h3>' + S(t.kop) + '</h3>' + html.split(/\n\n/).map(function(p){ return '<p>' + p + '</p>'; }).join('') + '</article>';
  }
  /* na het tekenen: past de tekst niet in het vak, dan staat eronder dat hij verdergaat (tot je onderaan bent),
     en bij een woordvraag schuift het vak naar de zin met het vette woord */
  function tekstInBeeld(){
    var t = document.querySelector('#beeld .leestekst'); if (!t) return;
    var ws = t.querySelector('.ws');
    if (ws && ws.offsetTop + ws.offsetHeight > t.clientHeight - 10) t.scrollTop = Math.max(0, ws.offsetTop - t.clientHeight / 3);
    if (t.scrollHeight <= t.clientHeight + 4) return;
    var meer = document.createElement('p'); meer.className = 'meertekst'; meer.setAttribute('aria-hidden', 'true');
    meer.textContent = 'De tekst gaat verder: scroll in het tekstvak.';
    t.parentNode.insertBefore(meer, t.nextSibling);
    function kijk(){ meer.style.visibility = t.scrollTop + t.clientHeight >= t.scrollHeight - 6 ? 'hidden' : ''; }
    t.addEventListener('scroll', kijk, { passive:true }); kijk();
  }

  /* alle vragen als losse eenheden, met een sleutel per vraag */
  var EENHEDEN = [];
  T.forEach(function(t){
    EENHEDEN.push({ soort:'hoofd', t:t, q:t.hoofd, sleutel:'hoofd' + t.id });
    (t.detail || []).forEach(function(q, i){ EENHEDEN.push({ soort:'detail', t:t, q:q, sleutel:'detail' + t.id + i }); });
    (t.woord || []).forEach(function(q, i){ EENHEDEN.push({ soort:'woord', t:t, q:q, sleutel:'woord' + t.id + i }); });
    if (t.volgorde) EENHEDEN.push({ soort:'volgorde', t:t, q:t.volgorde, sleutel:'volgorde' + t.id });
  });

  /* geen herhaling in een ronde: eerst de vragen van het niveau, en zijn die op, dan die van het niveau ernaast */
  var gebruikt = {};
  function pak(niveau, soort){
    var alle = EENHEDEN.filter(function(e){ return soort === 'alles' || e.soort === soort; });
    var over = alle.filter(function(e){ return !gebruikt[e.sleutel]; });
    var eigen = over.filter(function(e){ return e.t.n === niveau; });
    var lijst = eigen.length ? eigen : over.length ? over.sort(function(a, b){ return Math.abs(NIV[a.t.n] - NIV[niveau]) - Math.abs(NIV[b.t.n] - NIV[niveau]); }).filter(function(e, i, l){ return e.t.n === l[0].t.n; }) : alle;
    var e = kies(lijst);
    gebruikt[e.sleutel] = 1;
    return e;
  }

  function maakOpgave(e){
    var t = e.t, q = e.q, basis = { onderdeel:'reading: ' + NAAM[e.soort], onderdeelNaam: NAAM[e.soort], sleutel: e.sleutel };
    if (e.soort === 'volgorde'){
      var items = q.items.map(function(x, i){ return { id:'g' + i, tekst:S(x) }; });
      return Object.assign(basis, {
        vorm:'sleep', vraag:'Zet de gebeurtenissen in de goede volgorde.', opdracht:'Lees de tekst: in vak 1 komt wat het eerst gebeurt.', na: tekstInBeeld,
        beeld: tekstvak(t), kaarten: items,
        vakken: items.map(function(x, i){ return { id:'p' + i, max:1, hoort:[x.id] }; }),
        sleepuit:'Sleep elk kaartje naar een vak. Op een telefoon: tik een kaartje aan en dan het vak.',
        uitleg: q.uit, antwoordTekst: '(' + t.kop + ') ' + q.items.join(' → ')
      });
    }
    var vraag = e.soort === 'woord' ? 'What does <b class="ws">' + S(q.w) + '</b> mean in this text?' : S(q.v);
    var opdracht = e.soort === 'hoofd' ? 'Waar gaat de tekst vooral over? Kies het antwoord dat de hele tekst dekt, niet een klein stukje.'
      : e.soort === 'detail' ? (q.o.length === 3 ? 'Klopt dit met de tekst? Staat het er niet in, kies dan Not stated.' : q.o.length === 2 ? 'Klopt dit met de tekst?' : 'Zoek het antwoord in de tekst.')
      : 'Kijk naar de zin waarin het woord staat.';
    return Object.assign(basis, {
      vorm:'meerkeuze', vraag: vraag, opdracht: opdracht, beeld: tekstvak(t, e.soort === 'woord' ? q.w : null),
      opties: q.o.map(S), goed: q.g, vasteVolgorde: e.soort === 'detail' && q.o.length <= 3,
      uitleg: q.uit, antwoordTekst: '(' + t.kop + ') ' + q.o[q.g], na: tekstInBeeld
    });
  }

  VAKSPEL.maak({
    id:'reading', naam:'Reading', vak:'eng', kleur:'#204ECF',
    hand:'lees eerst, antwoord dan',
    lead:'Vierentwintig korte Engelse teksten over school, sport, dieren, reizen, eten en het nieuws. Bij elke tekst vragen zoals op een leestoets: wat is de hoofdgedachte, klopt dit detail, wat betekent dit woord hier, en in welke volgorde gebeurde het? De tekst blijft in beeld.',
    hoe:[
      { kop:'De tekst staat erbij', tekst:'Je hoeft niets te onthouden: de tekst blijft bij de vraag staan. Past hij niet helemaal, dan scroll je in het tekstvak. Lees de vraag, zoek de zin in de tekst en kies dan pas.' },
      { kop:'Vier soorten vragen', tekst:'<b>Hoofdgedachte</b>: waar gaat de hele tekst over. <b>Detail</b>: klopt dit, of staat het er niet. <b>Woord</b>: wat betekent het hier. <b>Volgorde</b>: sleep de gebeurtenissen op een rij.' },
      { kop:'Met uitleg', tekst:'Bij elk antwoord staat de zin uit de tekst waar het aan te zien was. Tien vragen per ronde, elke tekst komt voorbij.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb (A1-A2)', uit:'Korte teksten met korte zinnen: een nieuwe school, een hond, pannenkoeken.' },
        { id:'kgt', naam:'vmbo-kgt en tl (A2)', uit:'Iets langere teksten: een nieuwsbericht, een verhaal, schermtijd, pinguïns.' },
        { id:'hv', naam:'havo en vwo (B1)', uit:'Teksten met een mening erin, en bij detailvragen ook Not stated: staat het er wel?' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' }, { id:'hoofd', naam:'hoofdgedachte' }, { id:'detail', naam:'detail' }, { id:'woord', naam:'woord uit de context' }, { id:'volgorde', naam:'volgorde' } ] }
    ],
    aantal:10, minuten:10,
    maak:function(keuze, nr){
      if (nr === 1) gebruikt = {};
      return maakOpgave(pak(keuze.niveau, keuze.soort));
    },
    uitleg:{ doel:'Engelse teksten begrijpen: hoofdgedachte, details, woorden uit de context en volgorde.', tijd:'tien vragen per ronde', bediening:'Tik een antwoord aan, of gebruik de toetsen 1 tot 4. Bij volgorde sleep je de kaartjes; op een telefoon tik je een kaartje en dan het vak.' }
  });
})();
</script>

<script src="klas.js"></script>
