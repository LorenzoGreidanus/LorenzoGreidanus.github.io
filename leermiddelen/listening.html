<style>
/* de luisterkaart: een luidspreker met golfjes, wie er praat, de knoppen, en de tekst die pas na het antwoord in beeld komt */
.lskaart{width:100%;max-width:600px;margin:0 auto;display:grid;gap:12px;justify-items:center;text-align:center}
.lskaart [hidden]{display:none!important}
.lskaart .spreker{width:96px;height:72px;color:var(--nadruk)}
.lskaart .golf{opacity:.25;transition:opacity .2s}
.lskaart.praat .golf{opacity:1;animation:lsgolf .9s ease-in-out infinite alternate}
@keyframes lsgolf{from{transform:scale(.96);transform-origin:40% 50%}to{transform:scale(1.04);transform-origin:40% 50%}}
@media(prefers-reduced-motion:reduce){.lskaart.praat .golf{animation:none}}
.lsrollen{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lsrol{padding:5px 14px;border-radius:999px;background:var(--kaart2);color:var(--muted);font-size:.84rem;font-weight:600;box-shadow:inset 0 0 0 1px var(--rand2);transition:background .15s,color .15s}
.lsrol.aan{background:var(--nadruk);color:var(--kaart);box-shadow:none}
.lsknop{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lsknop button{border:none;border-radius:999px;padding:12px 22px;font-weight:600;min-height:46px;background:var(--spelkleur,#0d7b8a);color:var(--spelinkt,#fff)}
.lsknop button.stil{background:var(--kaart2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rand2)}
.lsknop button.klein{background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-weight:500;font-size:.88rem;padding:10px 12px;min-height:44px}
.lsmeld{font-size:.88rem;color:var(--muted);max-width:48ch;line-height:1.45;margin:0;min-height:1.2em}
.lstekst{width:100%;box-sizing:border-box;text-align:left;background:var(--kaart2);border-left:4px solid var(--nadruk);border-radius:0 14px 14px 0;padding:12px 16px;display:grid;gap:9px}
.lstekst p{margin:0;line-height:1.5;overflow-wrap:anywhere}
.lstekst b{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.lstekst mark{background:var(--nadruk-zacht);color:inherit;border-radius:4px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--nadruk)}
.lstekst .lskop{font-size:.8rem;color:var(--muted);font-style:italic}
body.groot .lstekst p{font-size:1.25rem}
@media(max-width:560px){.lsknop button{padding:12px 18px}.lstekst{padding:10px 12px}}
/* Op het werkblad (.blad bestaat alleen op werkblad.html): de keuzes om te omcirkelen en een lijn voor een getal of tijd */
.blad .lsveld{margin:6px 0 0;color:#14224C}

(function(){
  'use strict';

  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function $(id){ return document.getElementById(id); }

  /* Een tijd als antwoord: 19:30 mag ook 7:30, 07:30 of 7.30 zijn (punt of dubbele punt telt
     hetzelfde), en een heel uur ook 15, 3 uur of 15 uur. */
  function tijd(s){
    var m = /^(\d{1,2}):(\d{2})$/.exec(s), h = +m[1], mm = m[2], uit = [s];
    function zet(x){ if (uit.indexOf(x) < 0) uit.push(x); }
    zet((h < 10 ? '0' : '') + h + ':' + mm);
    if (h > 12){ zet((h - 12) + ':' + mm); zet('0' + (h - 12) + ':' + mm); }
    if (mm === '00'){ zet(String(h)); zet(h + ' uur'); if (h > 12){ zet(String(h - 12)); zet((h - 12) + ' uur'); } }
    uit.toon = h + '.' + mm + ' uur';
    return uit;
  }

  /* ================= de fragmenten =================
     F(id, soort, intro of null, sprekers {A:[naam, 'v'|'m']}, regels ['A|tekst'], vragen)
     een vraag: [deel, vraag, antwoord, bewijs, uitleg]
       deel:     h waar gaat het over, d details, b wat bedoelt iemand
       antwoord: een lijst met keuzes (de eerste is goed), of een getal {n, voor, e, toon} of een tijd {t:tijd('19:30')}
       bewijs:   het stuk tekst waar het antwoord in zit (letterlijk uit het fragment; dat wordt na het antwoord gemarkeerd) */
  function F(id, soort, intro, sp, regels, vragen){
    return { id:id, soort:soort, intro:intro, sp:sp,
      r: regels.map(function(l){ var i = l.indexOf('|'); return [l.slice(0, i), l.slice(i + 1)]; }),
      v: vragen.map(function(q){ return { d:q[0], q:q[1], a:q[2], z:q[3], u:q[4] }; }) };
  }
  var INTRO = { gesprek:'Je hoort een gesprek.', telefoon:'Je hoort een telefoongesprek.', omroep:'Je hoort een omroepbericht.',
    voicemail:'Je hoort een ingesproken bericht op een voicemail.', radio:'Je hoort een fragment van de radio.', vlog:'Je hoort een vlogger.',
    praat:'Je hoort iemand praten.', podcast:'Je hoort een fragment uit een podcast.' };
  var ROL1 = { omroep:'omroeper', radio:'radio', vlog:'vlogger', voicemail:'voicemail', praat:'spreker', podcast:'spreker' };

  var D = {};
  /* ---------- vmbo-bb (A2): kort, duidelijk, rustig ---------- */
  D.bb = [
    F('b01', 'gesprek', null, { A:['Receptionist', 'v'], B:['Guest', 'm'] }, [
      "A|Good evening. Welcome to the Park Hotel. Can I help you?",

      "A|Let me see. Yes, Mr Baker. You're in room two hundred and fourteen, on the second floor.",

    ], [
      ['h', 'Waar speelt dit gesprek zich af?', ['In een hotel', 'In een restaurant', 'Op een treinstation', 'In een ziekenhuis'], "Welcome to the Park Hotel.", 'De vrouw heet de man welkom in het Park Hotel, en hij heeft een kamer voor twee nachten. Het restaurant wordt ook genoemd, maar alleen als de plek waar je ontbijt.'],
      ['d', 'Welk kamernummer krijgt de man?', { n:214, label:'kamer' }, "You're in room two hundred and fourteen", 'Two hundred and fourteen is 214. On the second floor betekent op de tweede verdieping; dat is geen kamernummer.'],
      ['d', 'Tot hoe laat is er ontbijt?', { t:tijd('10:00') }, "Breakfast is from seven until ten", 'From seven until ten betekent van zeven tot tien uur. Zeven uur is het begin, tien uur het eind.'],
      ['b', 'De man vraagt: What time is breakfast? Wat wil hij weten?', ['Hoe laat het ontbijt is', 'Wat er bij het ontbijt is', 'Waar het ontbijt is', 'Of het ontbijt gratis is'], "What time is breakfast?", 'What time vraagt naar een tijd: hoe laat. Naar de plek vraag je met where.']
    ]),
    F('b02', 'omroep', null, { A:['Announcer', 'v'] }, [
      "A|Good afternoon, ladies and gentlemen. This is an announcement for passengers on flight four three two to Amsterdam. Your flight is now boarding at gate twelve. Please have your passport and boarding pass ready. Thank you."

      ['h', 'Voor wie is dit bericht?', ['Voor mensen die naar Amsterdam vliegen', 'Voor mensen die net uit Amsterdam zijn geland', 'Voor mensen die hun paspoort kwijt zijn', 'Voor mensen die op het vliegveld werken'], "passengers on flight four three two to Amsterdam", 'Het bericht is voor passengers (passagiers) van de vlucht to Amsterdam: naar Amsterdam. Het paspoort komt ook voor, maar je moet het alleen klaar hebben.'],
      ['d', 'Bij welke gate moet je zijn?', { n:12, label:'gate' }, "Your flight is now boarding at gate twelve.", 'Gate twelve is gate 12. Het vluchtnummer (432) is iets anders: dat is het nummer van de vlucht.'],
      ['d', 'Wat moet je klaar hebben?', ['Je paspoort en je instapkaart', 'Je koffer en je jas', 'Je telefoon en je bankpas', 'Geld voor de winkel'], "Please have your passport and boarding pass ready.", 'Passport is paspoort, boarding pass is instapkaart. Have ... ready betekent: zorg dat je het klaar hebt.'],

      ['b', 'Wat besluit het meisje aan het eind?', ['Ze wordt lid', 'Ze denkt er nog even over na', 'Ze vindt het te duur', 'Ze komt eerst een keer kijken'], "OK. I'll take it!", "I'll take it betekent: ik neem het. Ze besluit dus lid te worden. Als ze het te duur vond, zou ze iets zeggen als That's too expensive."]

      ['d', 'Hoe laat spreken Lucy en Sam af bij de bioscoop?', { t:tijd('19:30') }, "let's meet at the cinema at half past seven", 'Half past seven is half acht (19.30 uur). Pas op: half past seven is niet half zeven!'],
      ['d', 'Wat moet Sam meenemen?', ["Lucy's blauwe jas", 'Kaartjes voor de film', "Lucy's telefoon", 'Geld voor popcorn'], "can you bring my blue jacket?", 'Bring betekent meenemen. Lucy vraagt of Sam haar blauwe jas (blue jacket) meeneemt.'],
      ['b', 'Lucy zegt: I left it at your house. Wat bedoelt ze?', ['Haar jas ligt nog bij Sam thuis', 'Ze is haar jas onderweg verloren', 'Ze heeft een nieuwe jas gekocht', 'Sam heeft haar jas geleend'], "I left it at your house.", 'I left it betekent: ik heb hem laten liggen. At your house is bij jou thuis. De jas ligt dus nog bij Sam.']

      ['d', 'Hoeveel kost het T-shirt?', { n:12, voor:'£', label:'prijs' }, "It's twelve pounds.", 'Twelve pounds is 12 pond. Let op het verschil tussen twelve (12) en twenty (20).'],

    F('b08', 'praat', 'Je hoort een docent die iets vertelt aan de klas.', { A:['Teacher', 'm'] }, [

      ['d', 'Hoe laat moet je op school zijn?', { t:tijd('8:15') }, "please be at school at quarter past eight", 'Quarter past eight is kwart over acht (8.15 uur). De bus vertrekt om half past eight (8.30 uur); dat is de valkuil.'],
      ['d', 'Wat moet je meenemen?', ['Een lunchpakket en een regenjas', 'Geld en een lunchpakket', 'Een regenjas en geld', 'Alleen geld'], "Bring a packed lunch and a raincoat", "A packed lunch is een lunchpakket, a raincoat is een regenjas. Geld hoeft niet: You don't need any money."],
      ['b', 'Waarom moet je een regenjas meenemen?', ['Omdat het misschien gaat regenen', 'Omdat het koud is in de bus', 'Omdat de dierentuin dat wil', 'Omdat je buiten gaat eten'], "because it might rain", 'Because betekent omdat, it might rain betekent: het gaat misschien regenen.']

    F('v06', 'vlog', null, { A:['Vlogger', 'v'] }, [
      "A|Here's something that might surprise you. When researchers look at how fake news spreads online, it isn't mainly bots doing the damage. It's us. False stories tend to spread faster than true ones, and the reason seems to be that they're more surprising, more emotional, and so more fun to share. So what can you actually do? My advice is pretty simple. Before you share anything that makes you angry or amazed, pause. Ask yourself who's behind it, and whether anyone else is reporting the same thing. If it's genuinely big news, it won't be hard to find a second source."
    ], [
      ['h', "What is the speaker's main message?", ['Stop and check before you share surprising stories.', 'Bots are the main cause of fake news.', 'Never share news on social media.', 'True stories are more fun to share.'], "Before you share anything that makes you angry or amazed, pause.", 'Haar advies: wacht even voordat je iets deelt en controleer wie erachter zit. Over bots zegt ze juist dat zij niet de hoofdschuldige zijn.'],
      ['d', 'According to the speaker, who mainly spreads fake news?', ['Ordinary people.', 'Bots.', 'Journalists.', 'Governments.'], "it isn't mainly bots doing the damage. It's us.", "It's us: wij, gewone gebruikers. Het verleidelijke antwoord is bots, maar dat ontkent ze juist."],
      ['d', 'What should you ask yourself before sharing a story?', ["Who is behind it, and whether others report the same thing.", 'Whether your friends will like it.', 'Whether it is surprising enough.', 'How many people have shared it already.'], "Ask yourself who's behind it, and whether anyone else is reporting the same thing.", "Who's behind it: wie erachter zit. Whether anyone else is reporting the same thing: of anderen hetzelfde melden."],
      ['b', 'Why, according to the speaker, do false stories spread faster?', ['They are more surprising and emotional, so people enjoy sharing them.', 'They are shared by more bots.', 'They are easier to understand.', 'They appear first in search results.'], "they're more surprising, more emotional, and so more fun to share", 'So geeft het gevolg aan: omdat ze verrassender en emotioneler zijn, is het leuker om ze te delen.'],
      ['b', "What does she imply with 'it won't be hard to find a second source'?", ['Really big news is reported by more than one source.', 'Fake news is hard to find.', 'You should always share news twice.', 'Only one source is ever reliable.'], "If it's genuinely big news, it won't be hard to find a second source.", 'Als iets echt groot nieuws is, melden meer bronnen het. Vind je geen tweede bron, dan is dat een waarschuwing.']
