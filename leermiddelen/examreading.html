<style>
/* De examentekst: een kop, het soort tekst, en genummerde alinea's zoals op het centraal examen.
   Het nummer staat in een smalle kolom links; een gat in de tekst is een omlijnd nummer. */
.leestekst{width:100%;max-width:660px;background:var(--kaart2);border-radius:16px;padding:16px 20px 18px 14px;text-align:left;border-left:5px solid var(--nadruk)}
.leestekst .soort{display:block;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 2px 30px}
.leestekst h3{font-size:1.15rem;margin:0 0 10px 30px;letter-spacing:-.01em}
.leestekst .al{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:8px;align-items:baseline}
.leestekst .al+.al{margin-top:10px}
.leestekst .alnr{font-size:.8rem;font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.leestekst p{font-size:.98rem;line-height:1.65;font-weight:400;margin:0}
.leestekst .gat{display:inline-block;min-width:2.6em;text-align:center;border:1.5px solid var(--ink);border-radius:6px;padding:0 6px;font-weight:700;font-size:.85rem;line-height:1.5}
.leestekst .gat.ws{background:var(--nadruk-zacht)}
.leestekst mark.ws{background:var(--nadruk-zacht);color:var(--ink);border-radius:4px;padding:0 2px}
@media (max-width:560px){.leestekst{padding:14px 12px 16px 8px}.leestekst p{font-size:.94rem}.leestekst .al{grid-template-columns:18px minmax(0,1fr);column-gap:6px}.leestekst h3,.leestekst .soort{margin-left:24px}}
body.groot .leestekst{max-width:820px}
body.groot .leestekst p{font-size:1.2rem}
/* De tekst en de vraag samen in beeld (zoals in Reading): op een telefoon een tekstvak met een vaste hoogte
   waarin je scrolt, op een breed scherm de tekst links en de vraag rechts. Alleen in het spel: op een
   werkblad staat de hele tekst gewoon op papier. */
:root{--randschaduw:rgba(20,34,76,.32)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--randschaduw:rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--randschaduw:rgba(0,0,0,.7)}
#scherm-spel .leestekst{position:relative;overflow-y:auto;max-height:min(50vh,32rem);scrollbar-width:thin;scrollbar-color:var(--muted) transparent;
  background:linear-gradient(var(--kaart2) 30%, transparent) center top / 100% 36px no-repeat local,
    linear-gradient(transparent, var(--kaart2) 70%) center bottom / 100% 36px no-repeat local,
    radial-gradient(farthest-side at 50% 0, var(--randschaduw), transparent) center top / 100% 14px no-repeat scroll,
    radial-gradient(farthest-side at 50% 100%, var(--randschaduw), transparent) center bottom / 100% 14px no-repeat scroll,
    var(--kaart2)}
#scherm-spel .leestekst:focus-visible{outline:3px solid var(--nadruk);outline-offset:2px}
.meertekst{margin-top:6px;font-size:.8rem;color:var(--muted);text-align:center}
#scherm-spel .kaart>.vraag,#scherm-spel .kaart>.opdracht{text-align:left}
@media (min-width:900px){
  #scherm-spel .kaart{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:repeat(6,auto) 1fr;column-gap:28px;align-items:start}
  #scherm-spel .kaart>*{grid-column:2;min-width:0}
  #scherm-spel .kaart>#beeld{grid-column:1;grid-row:1 / -1;position:sticky;top:78px;margin:0;display:block}
  #scherm-spel .kaart>.onderdeel{text-align:left}
  #scherm-spel .leestekst{max-width:none;max-height:calc(100vh - 190px)}
  /* wel of niet: de twee vakken naast elkaar passen in de smallere kolom */
  #scherm-spel .vakken{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* meerkeuze met hele zinnen: links uitgelijnd leest beter dan gecentreerd */
#scherm-spel .opties .optie{text-align:left;justify-content:flex-start}
/* Op het werkblad (.blad bestaat alleen op werkblad.html): de beweringen zijn hele zinnen, dus elk op een eigen regel */
.blad .vakspel li:has(.leestekst) .kaartjes-wb span{display:block;margin:3px 0}
.blad .leestekst{max-width:none}

<script>
(function(){
  'use strict';
  /* op een werkblad (?werkblad=1) staan de opdrachten zoals ze met een pen kunnen */
  var WB = /[?&]werkblad=1/.test(location.search);
  var S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }

  /* De onderdelen: wat het centraal examen vraagt. Elke vraag in de teksten heeft een c:
     h = hoofdgedachte en doel, v = opbouw en verbanden, b = bedoeling en toon, z = zoeken en details. */
  var DEEL = {
    h:{ id:'hoofdgedachte', naam:'hoofdgedachte en doel' },
    v:{ id:'verbanden', naam:'opbouw en verbanden' },
    b:{ id:'bedoeling', naam:'bedoeling en toon' },
    z:{ id:'zoeken', naam:'zoeken en details' }
  };
  var VAN = { hoofdgedachte:'h', verbanden:'v', bedoeling:'b', zoeken:'z' };

  /* De teksten. Elke tekst: id, n (hv of vwo), soort, kop, al (de alinea's; [[1]] is een gat) en q (de vragen).
     Een vraag is meerkeuze (o, het eerste antwoord is het goede; de motor hutselt), een gat (gat),
     een alineanummer (al), een citaat (cit: de goede eerste woorden) of wel/niet (wn: [bewering, 1 of 0]). */
  var TEKSTEN = [];
  function T(t){ t.q.forEach(function(q, i){ q.k = t.id + '-' + i; }); TEKSTEN.push(t); }

  /* ================= havo, B2: vijftien teksten ================= */
  T({ id:'h01', n:'hv', soort:'Opinion', kop:'Let them be bored', al:[
`Last summer my eleven-year-old son announced, with the seriousness of a judge delivering a verdict, that he was "bored". My first instinct was to fix it. I reached for my phone to look up a coding camp, a tennis course, anything that would fill the empty hours. Then I stopped. Why, I wondered, did his boredom feel like my failure?`,
`Many parents I know feel the same. We fill our children's weeks with swimming lessons, music classes and homework clubs, partly because we want them to do well and partly because an empty afternoon looks like wasted time. [[1]], psychologists have been warning for years that a child who is never bored may never learn to entertain himself. Boredom, they argue, is not a problem to be solved but a signal: it tells us to go and find something worth doing.`,
`My son proved them right. After two days of complaining, he dragged an old cardboard box into the garden and turned it into a "shop". By the end of the week he had made price tags, invented his own currency and convinced his younger sister to become his only, and very badly paid, employee. No camp could have taught him that much about economics, or about negotiating with a seven-year-old.`,
`I am not saying that organised activities are bad. Children who learn an instrument or play in a team gain discipline and friends. The problem starts when the timetable becomes so full that there is no space left for the child's own ideas. A diary with something planned for every hour sends a quiet message: your time belongs to the adults.`,
`So this summer I am trying something radical. I am going to do nothing. When the complaints begin, as they certainly will, I will smile, make a cup of tea and wait. Somewhere in the boredom, I suspect, the next cardboard shop is waiting to be built.`
  ], q:[
    { c:'h', v:`Welke bewering geeft de hoofdgedachte van de tekst het best weer?`, o:[
      `Kinderen hebben tijd nodig om zich te vervelen, omdat ze dan zelf leren iets te bedenken.`,
      `Georganiseerde activiteiten zoals muziekles zijn slecht voor kinderen.`,
      `Ouders voelen zich terecht schuldig als hun kind zich verveelt.`,
      `Kinderen leren in de zomervakantie meer over economie dan op school.`],
      u:`De schrijver laat in alinea 3 zien wat verveling oplevert (de kartonnen winkel) en sluit af met zijn plan om niets te doen. Dat georganiseerde activiteiten slecht zijn, zegt hij juist niet: in alinea 4 staat "I am not saying that organised activities are bad". Het probleem is een rooster dat te vol is.` },
    { c:'v', gat:1, o:[`Yet`, `Similarly`, `As a result`, `For example`],
      u:`Ouders zien een lege middag als verspilde tijd; psychologen zeggen juist dat verveling nuttig is. Dat is een tegenstelling, dus <b>Yet</b> (toch, maar). <i>Similarly</i> zou betekenen dat psychologen hetzelfde vinden als de ouders, en <i>As a result</i> maakt van de waarschuwing een gevolg van de volle agenda's.` },
    { c:'b', v:`Wat bedoelt de schrijver met "your time belongs to the adults" (alinea 4)?`, o:[
      `Een vol rooster laat kinderen merken dat volwassenen over hun tijd beslissen.`,
      `Kinderen moeten leren dat volwassenen het beste weten.`,
      `Ouders hebben zelf te weinig vrije tijd.`,
      `Kinderen zouden meer tijd met volwassenen moeten doorbrengen.`],
      u:`De zin hoort bij "a diary with something planned for every hour sends a quiet message". Als volwassenen elk uur hebben ingevuld, leert het kind dat zijn tijd niet van hemzelf is. De schrijver vindt dat juist niet goed; hij zegt dus niet dat kinderen moeten leren dat volwassenen het beste weten.` },
    { c:'z', al:3, v:`In welke alinea geeft de schrijver een voorbeeld van wat een kind kan bedenken als het zich verveelt?`,
      u:`In alinea 3 maakt de zoon van een kartonnen doos een winkel, met prijskaartjes, eigen geld en een "employee". Dat is het voorbeeld. In alinea 2 staat alleen de algemene bewering van psychologen.` },
    { c:'b', v:`Hoe kan de toon van de laatste alinea het best worden getypeerd?`, o:[
      `luchtig en vastberaden`, `boos en verwijtend`, `somber en twijfelend`, `zakelijk en neutraal`],
      u:`"I am trying something radical. I am going to do nothing" is een grapje: niets doen is helemaal niet radicaal. Toch meent hij het: hij gaat het echt doen ("I will smile, make a cup of tea and wait"). Dus luchtig en vastberaden. Twijfel klinkt er niet in door; "I suspect" gaat over wat er gaat gebeuren, niet over zijn besluit.` }
  ]});

  T({ id:'h02', n:'hv', soort:'Article', kop:'The four-day week: a trial run', al:[
`When Pellow & Grant, a design company with sixty employees, told its staff that they would work four days a week for the same salary, some of them thought it was a joke. "I checked the date to make sure it wasn't April Fools' Day," says project manager Aisha Khan. Six months later, the experiment has become permanent.`,
`The idea is simple: employees work 32 hours instead of 40, but they are expected to deliver the same amount of work. To make that possible, the company cut the number of internal meetings by half and introduced "focus mornings", during which phones are switched off and emails go unanswered.`,
`The results surprised even the managers. Sick leave fell by almost a third, and fewer people left the company. Clients, who had been worried that projects would be delayed, noticed no difference. [[1]], several of them said that the designers seemed more creative than before.`,
`Not everyone is convinced, though. Economist Martin Hale warns that the success of one small company says little about the economy as a whole. "In a design studio you can reorganise your work. A nurse or a bus driver cannot simply do five days of work in four," he says. "For those jobs, a shorter week means hiring more people, and someone has to pay for that."`,
`Aisha Khan admits that the new system has its downsides. The four working days are busier, and the pressure to finish everything before Thursday evening can be intense. "Some weeks I feel I'm running a marathon at sprint speed," she says. Still, she would not want to go back. "That extra day is when I actually live my life."`,
`For now, Pellow & Grant has no plans to change course. Its director has even started giving talks to other companies. His message is always the same: "Don't ask how many hours people work. Ask what they achieve."`
  ], q:[
    { c:'h', v:`Wat is het doel van deze tekst?`, o:[
      `informeren over een proef met een vierdaagse werkweek, met voordelen en bezwaren`,
      `lezers overtuigen dat elk bedrijf een vierdaagse werkweek moet invoeren`,
      `waarschuwen voor de gevaren van een hoge werkdruk`,
      `uitleggen hoe je als werknemer minder uren kunt gaan werken`],
      u:`Het is een artikel: de schrijver beschrijft wat er bij één bedrijf gebeurde en laat ook kritiek horen (econoom Hale in alinea 4, de nadelen in alinea 5). Overtuigen doet de schrijver niet; het is de directeur die in alinea 6 een boodschap heeft, niet de schrijver.` },
    { c:'v', gat:1, o:[`In fact`, `However`, `Otherwise`, `Nevertheless`],
      u:`Klanten merkten geen verschil, en sommigen vonden het werk zelfs beter. De tweede zin gaat nog een stap verder in dezelfde richting. Daar past <b>In fact</b> (sterker nog). <i>However</i> en <i>Nevertheless</i> kondigen een tegenstelling aan, maar er volgt geen nadeel.` },
    { c:'v', v:`Wat is de functie van alinea 4 ten opzichte van alinea 3?`, o:[
      `Alinea 4 plaatst een kanttekening bij de goede resultaten uit alinea 3.`,
      `Alinea 4 onderbouwt de resultaten uit alinea 3 met cijfers.`,
      `Alinea 4 noemt de oorzaak van de resultaten uit alinea 3.`,
      `Alinea 4 geeft een oplossing voor een probleem uit alinea 3.`],
      u:`Alinea 3 noemt successen. Alinea 4 begint met "Not everyone is convinced, though": de econoom zegt dat het niet voor elk beroep werkt. Dat is een kanttekening (een beperking). Cijfers staan juist in alinea 3, niet in alinea 4.` },
    { c:'b', v:`Wat bedoelt Aisha Khan met "running a marathon at sprint speed" (alinea 5)?`, o:[
      `Ze moet in minder tijd evenveel werk doen, en dat is zwaar.`,
      `Ze sport op haar vrije dag veel meer dan vroeger.`,
      `Haar werk is saaier geworden.`,
      `Ze werkt nu meer uren dan vroeger.`],
      u:`Een marathon is lang, een sprint is snel. Ze doet het werk van een hele week (de marathon) in een hoger tempo (de sprint), omdat alles voor donderdagavond af moet. Meer uren werkt ze niet: het zijn er 32 in plaats van 40.` },
    { c:'z', wn:[[`Medewerkers van Pellow & Grant werken nu 32 uur per week.`, 1], [`Het bedrijf heeft extra personeel aangenomen.`, 0], [`Volgens Martin Hale werkt een kortere week niet zomaar voor elk beroep.`, 1], [`Klanten waren vooraf bang dat projecten vertraging zouden oplopen.`, 1]],
      v:`Geef van elke bewering aan of die wel of niet in de tekst staat.`,
      u:`32 uur staat in alinea 2, de zorgen van klanten in alinea 3 ("had been worried that projects would be delayed") en de mening van Hale in alinea 4. Extra personeel aannemen noemt Hale alleen als gevolg voor ándere beroepen, zoals verpleging; Pellow & Grant deed dat niet.` }
  ]});

  T({ id:'h03', n:'hv', soort:'Review', kop:'The Long Quiet', al:[
`There is a moment, about twenty minutes into The Long Quiet, when the camera simply rests on a woman's face as she reads a letter. Nothing happens. Nobody speaks. And yet it is the most gripping scene I have seen in a cinema this year. If only the rest of the film trusted its audience as much.`,
`Director Hannah Moreau's second feature tells the story of Ruth, a lighthouse keeper on a remote Scottish island who discovers that her late husband had a second family on the mainland. It is a promising idea, and for its first half the film delivers. Moreau lets the silence do the work: the wind, the waves and the slow ticking of a clock tell us more about Ruth's loneliness than any dialogue could.`,
`Unfortunately, the second half seems to belong to a different, much noisier film. Once Ruth sails to the mainland, the story turns into a melodrama full of shouting matches, slammed doors and a car chase that would look more at home in an action movie. Every emotion is explained, then explained again, just in case we missed it.`,
`None of this is the fault of Imogen Clarke, who plays Ruth. She is extraordinary throughout, and even in the weakest scenes she finds something true. Watch how she holds a teacup in the final scene: her hands say everything that the script spells out so clumsily.`,
`[[1]], The Long Quiet is worth seeing, if only for its first hour and its leading lady. But it is hard not to leave the cinema feeling a little cheated. Moreau clearly knows how to make a quiet film. She just doesn't seem to believe that quiet films are enough.`
  ], q:[
    { c:'h', v:`Welke uitspraak past het best bij het oordeel van de recensent?`, o:[
      `De film begint sterk, maar wordt in de tweede helft te luid en te nadrukkelijk.`,
      `De film is helemaal mislukt door de zwakke hoofdrolspeelster.`,
      `De film is te stil en daardoor saai voor de meeste kijkers.`,
      `De film is een spannende actiefilm met een sterk einde.`],
      u:`De eerste helft is goed ("for its first half the film delivers"), de tweede helft is "much noisier" en legt alles uit. De hoofdrolspeelster is juist het sterkste punt: "She is extraordinary throughout".` },
    { c:'v', gat:1, o:[`All in all`, `For example`, `Instead`, `Because of this`],
      u:`De laatste alinea geeft het eindoordeel na alle plussen en minnen. Een samenvattend signaalwoord past: <b>All in all</b> (alles bij elkaar). <i>Because of this</i> zou betekenen dat de film de moeite waard is dankzij de kritiek uit alinea 4, en dat klopt niet.` },
    { c:'b', v:`Wat bedoelt de recensent met "If only the rest of the film trusted its audience as much" (alinea 1)?`, o:[
      `De rest van de film legt te veel uit, alsof de kijker het anders niet snapt.`,
      `De kijkers vertrouwden de regisseur niet.`,
      `De film had meer scènes zonder de hoofdrolspeelster moeten hebben.`,
      `Het publiek in de zaal was onrustig.`],
      u:`In de stille scène vertrouwt de film erop dat je zelf begrijpt wat er gebeurt. Later gebeurt dat niet meer: "Every emotion is explained, then explained again, just in case we missed it" (alinea 3). Het gaat dus om de film die de kijker niet vertrouwt, niet andersom.` },
    { c:'v', v:`Wat doet de recensent in alinea 4?`, o:[
      `Hij maakt een uitzondering op zijn kritiek uit alinea 3.`,
      `Hij geeft nog een voorbeeld van de zwakke tweede helft.`,
      `Hij vat de inhoud van de film samen.`,
      `Hij vergelijkt de film met een andere film.`],
      u:`Na de kritiek in alinea 3 zegt hij: "None of this is the fault of Imogen Clarke". De actrice valt dus buiten zijn kritiek. Over de tweede helft gaat de alinea wel, maar dan om te zeggen dat zíj daar nog steeds goed is.` },
    { c:'z', cit:[`Every emotion`], v:`Citeer de eerste twee woorden van de zin waarin de recensent zegt dat in de tweede helft alles meer dan eens wordt uitgelegd.`,
      u:`Die zin staat aan het eind van alinea 3: "Every emotion is explained, then explained again, just in case we missed it."` }
  ]});

  T({ id:'h04', n:'hv', soort:'Column', kop:'A month without my smartphone', al:[
`It was supposed to be a brave experiment. For thirty days I would live like my grandparents: no smartphone, no apps, no endless scrolling before bed. I bought an old-fashioned phone that could only call and text, put my smartphone in a drawer and told everyone I was "going analogue". My friends were impressed. My mother laughed for a full minute.`,
`The first week was a disaster. I got lost twice on my way to a friend's house, because I had no idea how to read a paper map. I missed a dentist's appointment, since my calendar lived in the drawer. And I discovered that my bank, my gym and even my local pizza place now expect you to own a smartphone. Ordering a pizza by phone, it turns out, is considered almost eccentric.`,
`[[1]], something strange happened in the second week. I started to notice things. The man in the bakery who always whistles the same song. The small park that my bus passes every day, which I had never seen because I had always been looking down. I read two whole books, which is two more than in the whole previous year.`,
`I would love to tell you that I have now given up my smartphone for good. I haven't. On day thirty-one I opened the drawer, switched it on and spent forty minutes catching up on messages that, it turned out, were not very important at all. Old habits, as they say, die hard.`,
`But something has changed. My phone now sleeps in the kitchen, not next to my bed. And when I wait for the bus, I sometimes leave it in my pocket and look at the park. The man in the bakery, by the way, is still whistling. I still don't know which song it is. Perhaps I'll ask him.`
  ], q:[
    { c:'h', v:`Wat is de belangrijkste conclusie van de schrijver?`, o:[
      `Zonder smartphone leven was lastig, maar hij gaat er nu bewuster mee om.`,
      `Iedereen zou een maand zonder smartphone moeten leven.`,
      `Zonder smartphone kun je tegenwoordig niet meer leven.`,
      `Hij is voorgoed gestopt met zijn smartphone.`],
      u:`In alinea 4 staat dat hij niet voorgoed gestopt is ("I haven't"), maar in alinea 5 staat "But something has changed": de telefoon slaapt in de keuken en hij kijkt vaker om zich heen. De schrijver geeft niemand een opdracht, dus het tweede antwoord past niet.` },
    { c:'v', gat:1, o:[`And yet`, `As a result`, `In addition`, `For instance`],
      u:`De eerste week was een ramp, maar in de tweede week gebeurde er iets goeds. Dat is een tegenstelling: <b>And yet</b> (en toch). <i>As a result</i> zou betekenen dat het goede een gevolg was van de rampzalige eerste week; zo presenteert de schrijver het niet.` },
    { c:'b', v:`"My mother laughed for a full minute." (alinea 1) Wat wil de schrijver hiermee duidelijk maken?`, o:[
      `Zijn moeder geloofde niet dat hij het experiment zou volhouden.`,
      `Zijn moeder vond het een goed idee.`,
      `Zijn moeder gebruikt zelf geen smartphone.`,
      `Zijn moeder vond hem dapper.`],
      u:`De zin staat direct na "My friends were impressed" en vormt daar een tegenstelling mee. Een minuut lachen is geen bewondering: zijn moeder nam het plan niet serieus. Dapper vonden alleen zijn vrienden het.` },
    { c:'b', v:`Hoe kan de toon van alinea 2 het best worden getypeerd?`, o:[
      `met zelfspot`, `verontwaardigd`, `belerend`, `somber`],
      u:`De schrijver lacht om zijn eigen onhandigheid: verdwalen met een papieren kaart, een gemiste tandarts, een pizza bestellen per telefoon als iets "eccentric". Dat is zelfspot. Hij is niet echt boos op de bank of de pizzeria; hij overdrijft om het grappig te maken.` },
    { c:'z', al:5, v:`In welke alinea beschrijft de schrijver wat hij sinds het experiment anders doet?`,
      u:`Alinea 5 begint met "But something has changed" en noemt wat er anders is: de telefoon slaapt in de keuken en blijft bij de bushalte soms in zijn zak. In alinea 3 staat wat hij tíjdens het experiment merkte.` }
  ]});

  T({ id:'h05', n:'hv', soort:'Article', kop:'Our new neighbours have red fur', al:[
`For most of the twentieth century, the red fox was a creature of the countryside. Today, many people in British towns are more likely to see one on a pavement than in a field. Foxes have moved into cities across Europe, and they appear to be doing remarkably well there.`,
`Why would a wild animal choose the noise and traffic of a city? According to biologist Dr Laura Benning, the answer is food. "A city is basically an all-you-can-eat buffet," she explains. "There are bins, bird feeders, compost heaps and, in some neighbourhoods, people who deliberately put out food for them." With so much to eat, city foxes need far smaller territories than their rural cousins.`,
`Life in the city is also changing the animals themselves. Benning's team compared foxes from urban and rural areas and found that city foxes tend to be bolder: they approach unfamiliar objects faster and are less afraid of people. [[1]], their skulls are slightly different, with shorter snouts. Some researchers think this may be linked to a diet that requires less hunting and more scavenging, although Benning stresses that this has not yet been proven.`,
`Not everyone is happy with their new neighbours. Foxes dig up gardens, tear open rubbish bags and scream loudly at night during the mating season, which can sound alarmingly like a human in distress. Every year, local councils receive complaints, and some residents demand that the animals be removed.`,
`Experts say that this would be pointless. "If you take away the foxes in one area, others simply move into the empty territory," says Benning. Instead, she advises people to make their gardens less attractive: close bins properly, don't leave pet food outside and, above all, stop feeding them. "A fox that gets used to people is the one that ends up causing problems."`
  ], q:[
    { c:'h', v:`Welke titel past het best bij deze tekst?`, o:[
      `City life: how foxes adapted to living with us`,
      `Why foxes are dangerous for people`,
      `The red fox is disappearing from the countryside`,
      `How to remove foxes from your garden`],
      u:`De tekst gaat over vossen die in de stad zijn gaan wonen, hoe ze daardoor veranderen en hoe je met ze omgaat. Vossen weghalen raadt de deskundige juist af (alinea 5), en gevaarlijk worden ze nergens genoemd: ze zijn alleen lastig.` },
    { c:'v', gat:1, o:[`In addition`, `However`, `Therefore`, `Instead`],
      u:`Eerst noemt de tekst één verschil (stadsvossen zijn brutaler), daarna nog een verschil (hun schedel). Dat is een opsomming: <b>In addition</b>. <i>Therefore</i> zou betekenen dat de schedel anders is omdat ze brutaler zijn, en dat staat er niet.` },
    { c:'b', v:`Wat bedoelt Benning met "A city is basically an all-you-can-eat buffet" (alinea 2)?`, o:[
      `In de stad vinden vossen heel gemakkelijk veel voedsel.`,
      `Vossen eten in de stad vooral bij restaurants.`,
      `Vossen eten in de stad te veel en worden daardoor ziek.`,
      `Mensen in de stad geven vossen expres eten.`],
      u:`Een buffet waar je onbeperkt mag eten is een beeld voor overvloed: vuilnisbakken, vogelvoer, composthopen. Dat sommige mensen vossen expres voeren is maar één voorbeeld ("in some neighbourhoods"), niet de betekenis van het hele beeld.` },
    { c:'z', v:`Wat zegt de tekst over de schedel van stadsvossen?`, o:[
      `De snuit is korter; dat komt misschien door hun voedsel, maar dat is nog niet bewezen.`,
      `De snuit is korter omdat ze minder jagen; dat is bewezen.`,
      `De schedel is groter dan die van vossen op het platteland.`,
      `Er is geen verschil met vossen op het platteland.`],
      u:`In alinea 3 staat "shorter snouts" en dat dit mogelijk komt door een dieet met minder jagen, "although Benning stresses that this has not yet been proven". Let op zulke voorbehouden: het tweede antwoord lijkt goed, maar zegt "bewezen".` },
    { c:'z', cit:[`If you`], v:`Citeer de eerste twee woorden van de zin die uitlegt waarom het weghalen van vossen geen zin heeft.`,
      u:`De uitleg staat in alinea 5: "If you take away the foxes in one area, others simply move into the empty territory." De zin ervoor ("Experts say that this would be pointless") zegt alleen dát het zinloos is, niet waaróm.` }
  ]});

  T({ id:'h06', n:'hv', soort:'Opinion', kop:'A uniform will not make us equal', al:[
`Every few years, someone suggests that schools should introduce compulsory uniforms. The argument usually goes like this: if all pupils wear the same clothes, nobody can be bullied for wearing the wrong brand, and rich and poor children will finally be equal. It sounds lovely. It is also, I am afraid, wishful thinking.`,
`Let me start with what the supporters get right. Clothes do matter to teenagers, and pupils who cannot afford expensive trainers sometimes feel left out. Anyone who has worked in a school, as I have for fifteen years, has seen this happen. I do not doubt for a moment that the people who propose uniforms mean well.`,
`But differences between pupils do not disappear when their sweaters are the same colour. Teenagers are experts at spotting status. If everyone wears the same blazer, they will look at your phone, your bag, your haircut or the place you go on holiday. [[1]], a uniform simply moves the competition somewhere else.`,
`There is also the question of cost. A complete uniform from an official supplier can easily cost a few hundred euros, and children grow fast. For the very families that uniforms are supposed to help, this can be an extra burden rather than a relief.`,
`What actually reduces bullying is far less photogenic: teachers who notice what is happening, clear rules about how pupils treat each other, and a school culture in which being different is not a crime. That takes time and effort, and it cannot be ordered from a catalogue. Perhaps that is exactly why the uniform idea keeps coming back. It looks like a solution, and it is much easier to buy.`
  ], q:[
    { c:'h', v:`Welke bewering geeft het standpunt van de schrijver het best weer?`, o:[
      `Een schooluniform lost ongelijkheid en pesten niet op.`,
      `Schooluniformen zijn te duur voor scholen.`,
      `Kleding speelt voor jongeren geen rol.`,
      `Scholen moeten pesten strenger straffen.`],
      u:`Het standpunt staat al in alinea 1 ("wishful thinking") en wordt in alinea 3 en 4 onderbouwd. De kosten (alinea 4) zijn maar één argument, en het gaat om de kosten voor gezinnen, niet voor scholen. Dat kleding geen rol speelt, ontkent hij juist in alinea 2.` },
    { c:'v', v:`Wat doet de schrijver in alinea 2?`, o:[
      `Hij geeft toe dat de voorstanders van uniformen op één punt gelijk hebben.`,
      `Hij noemt een tweede argument tegen schooluniformen.`,
      `Hij beschrijft hoe hij zelf vroeger werd gepest.`,
      `Hij vat zijn betoog samen.`],
      u:`"Let me start with what the supporters get right" is een toegeving: hij erkent dat kleding ertoe doet en dat voorstanders het goed bedoelen. Pas in alinea 3 komt met "But" zijn tegenargument. Gepest werd hij niet; hij heeft het als docent gezien.` },
    { c:'v', gat:1, o:[`In other words`, `Nevertheless`, `On the other hand`, `For example`],
      u:`De zin met het gat zegt in het kort wat de zin ervoor al liet zien: leerlingen kijken dan naar iets anders. Dat is een herhaling in andere woorden: <b>In other words</b>. <i>For example</i> past niet, want er volgt geen voorbeeld maar een conclusie.` },
    { c:'b', v:`Wat bedoelt de schrijver met "it cannot be ordered from a catalogue" (alinea 5)?`, o:[
      `Een goede schoolcultuur kun je niet kopen; die moet je opbouwen.`,
      `Uniformen zijn alleen via een catalogus te bestellen.`,
      `Scholen hebben te weinig geld voor goede leraren.`,
      `Leraren moeten zelf hun regels bedenken.`],
      u:`"It" verwijst naar wat pesten echt tegengaat: oplettende leraren, duidelijke regels en een goede schoolcultuur. Dat kost "time and effort". Een uniform kun je wel bestellen, en daarom kiezen mensen er volgens de schrijver zo graag voor.` },
    { c:'z', al:4, v:`In welke alinea noemt de schrijver een financieel bezwaar tegen schooluniformen?`,
      u:`Alinea 4 begint met "There is also the question of cost": een uniform kost een paar honderd euro, en kinderen groeien snel. In alinea 2 gaat het ook over geld (dure sneakers), maar daar is het een argument vóór uniformen.` }
  ]});

  T({ id:'h07', n:'hv', soort:'Article', kop:'Second-hand, first choice?', al:[
`Not so long ago, wearing second-hand clothes was something many teenagers preferred to keep quiet about. Now it is something to show off. "Guess how much I paid for this," says sixteen-year-old Maya, pointing at a leather jacket. "Six pounds. On an app." She is far from alone: buying and selling used clothing online has become one of the fastest-growing parts of the fashion industry.`,
`The appeal is easy to understand. Young people have less money than they would like, and they are more aware than previous generations of the damage that the clothing industry does to the environment. Making new clothes uses large amounts of water and energy, and huge quantities of garments end up in landfill every year. Buying second-hand feels like a way to look good without feeling guilty.`,
`But some researchers have their doubts. Professor Daniel Okafor, who studies consumer behaviour, points out that many app users are not buying less; they are simply buying more cheaply. "We see people who sell a dress after wearing it once, and immediately use the money to buy three more," he says. [[1]], the apps may be speeding up the very cycle of consumption that they claim to slow down.`,
`There is also the matter of transport. Every item bought online has to be packed and posted, often across the country, and returns are common. A jacket that travels hundreds of kilometres in a delivery van is not quite as green as it looks in the app.`,
`Okafor is not against second-hand shopping. "Wearing something that already exists is almost always better than buying something new," he says. "The problem is not the app. The problem is the idea that we need something new every week, whether it was made last month or ten years ago." Maya, for her part, is unconvinced. "At least I'm not buying fast fashion," she says, before showing me her next purchase.`
  ], q:[
    { c:'h', v:`Wat is de kern van de tekst?`, o:[
      `Tweedehands kleding kopen via apps is populair, maar minder duurzaam dan het lijkt als mensen daardoor meer kopen.`,
      `Tweedehands kleding is slecht voor het milieu.`,
      `Jongeren hebben te weinig geld voor nieuwe kleding.`,
      `Apps voor tweedehands kleding zouden verboden moeten worden.`],
      u:`De tekst beschrijft eerst waarom de apps populair zijn (alinea 1 en 2) en daarna de twijfels (alinea 3 en 4). Okafor zegt juist dat tweedehands "almost always better" is dan nieuw; het probleem is dat mensen steeds iets nieuws willen.` },
    { c:'v', gat:1, o:[`Ironically`, `For instance`, `Besides`, `Meanwhile`],
      u:`De apps beloven de consumptie af te remmen, maar volgens Okafor versnellen ze die juist. Het tegenovergestelde gebeurt van wat de bedoeling is: <b>Ironically</b>. <i>For instance</i> past niet, want de zin is geen voorbeeld maar een conclusie uit het voorbeeld ervoor.` },
    { c:'v', v:`Wat is de functie van alinea 4 ten opzichte van alinea 3?`, o:[
      `Alinea 4 noemt nog een bezwaar.`,
      `Alinea 4 weerlegt een tegenargument.`,
      `Alinea 4 stelt een oplossing voor.`,
      `Alinea 4 geeft de oorzaak van alinea 3.`],
      u:`"There is also the matter of transport": na het bezwaar dat mensen meer gaan kopen (alinea 3) komt er een tweede bezwaar bij, het vervoer. Het signaalwoord "also" laat zien dat het een opsomming is.` },
    { c:'b', v:`Wat is de functie van de woorden "before showing me her next purchase" aan het eind van de tekst?`, o:[
      `Ze laten met een knipoog zien dat Maya precies doet waar Okafor voor waarschuwt.`,
      `Ze bewijzen dat Maya gelijk heeft.`,
      `Ze laten zien dat Maya niet meer koopt dan nodig.`,
      `Ze kondigen een nieuw onderwerp aan.`],
      u:`Maya zegt dat ze geen fast fashion koopt, en laat meteen daarna haar volgende aankoop zien. Ze koopt dus steeds iets nieuws: precies het gedrag uit alinea 3. De schrijver laat dat zien zonder het hardop te zeggen. Dat is ironie, geen bewijs dat ze gelijk heeft.` },
    { c:'z', wn:[[`Jongeren schamen zich nog vaak voor tweedehands kleding.`, 0], [`Het maken van nieuwe kleding kost veel water en energie.`, 1], [`Okafor vindt dat mensen geen tweedehands kleding moeten kopen.`, 0], [`Kleding die online gekocht is, wordt vaak teruggestuurd.`, 1]],
      v:`Geef van elke bewering aan of die wel of niet in de tekst staat.`,
      u:`Water en energie staan in alinea 2, en "returns are common" in alinea 4. Schamen deden jongeren vroeger ("not so long ago"), nu laten ze het juist zien. En Okafor is "not against second-hand shopping".` }
  ]});

  T({ id:'h08', n:'hv', soort:'Letter to the editor', kop:'We do read, just not what you expect', al:[
`I read your article "The last generation of readers?" with growing irritation. According to your reporter, teenagers no longer read, because their attention spans have been destroyed by short videos. As a seventeen-year-old who reads every day, I would like to offer a different view.`,
`First of all, your article seems to define reading in a very narrow way. Only novels, preferably classic ones, appear to count. But my friends and I read all the time: long online articles, fan fiction, graphic novels, discussions on forums, and the subtitles of almost every series we watch. Your reporter never explains why none of this counts as "real" reading.`,
`Secondly, I wonder whether teenagers today really read less than teenagers in the past. My grandfather tells me proudly that he read a book a week when he was my age. When I asked my grandmother about this, she laughed and said that he mainly read football magazines. Memories, it seems, can be generous.`,
`That said, I do not want to pretend that there is no problem at all. Many of my classmates find it hard to concentrate on a long book, and I sometimes notice it myself. [[1]], the solution is not to complain about young people in newspaper articles. It is to give them books that are worth their time. Half of the novels on our school reading list were written before our parents were born, and some of them are, frankly, very boring.`,
`If you really want to know why teenagers read what they read, here is a simple suggestion: ask them. You might be surprised by the answers.`
  ], q:[
    { c:'h', v:`Wat is het belangrijkste doel van de briefschrijver?`, o:[
      `laten zien dat het artikel een te eenzijdig en negatief beeld geeft van jongeren en lezen`,
      `eisen dat de krant het artikel terugtrekt`,
      `aantonen dat jongeren meer lezen dan volwassenen`,
      `een lijst met goede boeken voor jongeren geven`],
      u:`Ze reageert op een artikel en wil "a different view" geven: jongeren lezen wel, alleen andere dingen. Ze vergelijkt jongeren met jongeren van vroeger (haar opa), niet met volwassenen van nu.` },
    { c:'b', v:`Wat bedoelt de schrijver met "Memories, it seems, can be generous" (alinea 3)?`, o:[
      `Mensen herinneren zich hun verleden vaak mooier dan het was.`,
      `Haar opa heeft een goed geheugen.`,
      `Ouderen delen graag hun herinneringen.`,
      `Haar oma is gul.`],
      u:`Opa zegt dat hij elke week een boek las; oma vertelt dat het vooral voetbalbladen waren. Zijn herinnering is dus "gul" voor hemzelf: mooier dan de werkelijkheid. Daarmee trekt ze in twijfel dat jongeren vroeger meer lazen.` },
    { c:'v', v:`Wat doet de schrijver in alinea 4?`, o:[
      `Ze geeft toe dat er een probleem is, maar ziet een andere oplossing dan klagen.`,
      `Ze geeft nog een argument dat jongeren veel lezen.`,
      `Ze vat haar brief samen.`,
      `Ze geeft een voorbeeld van een saaie leeslijst.`],
      u:`"That said, I do not want to pretend that there is no problem at all" is een toegeving. Daarna noemt ze haar oplossing: boeken geven die de moeite waard zijn. De leeslijst is een onderdeel van die alinea, maar niet de functie ervan.` },
    { c:'v', gat:1, o:[`However`, `Therefore`, `For example`, `In addition`],
      u:`Ze geeft eerst toe dat er een probleem is, en zegt dan dat de oplossing niet is wat de krant doet. Toegeving gevolgd door een tegenstelling: <b>However</b>. <i>Therefore</i> klopt niet: dat leerlingen moeite hebben met concentratie is geen reden om níet te klagen.` },
    { c:'z', cit:[`Many of`], v:`Citeer de eerste twee woorden van de zin waarin de schrijver toegeeft dat ze zelf ook weleens moeite heeft om zich te concentreren.`,
      u:`De zin staat in alinea 4: "Many of my classmates find it hard to concentrate on a long book, and I sometimes notice it myself." Het tweede deel van de zin gaat over haarzelf.` }
  ]});

  T({ id:'h09', n:'hv', soort:'Book review', kop:'The Salt House', al:[
`Some novels grab you by the collar on page one. The Salt House prefers to take your hand and walk you slowly towards the edge of a cliff. By the time you realise how far down it goes, it is far too late to turn back.`,
`Claire Denholm's first novel follows three generations of women who run a small hotel on the Cornish coast. In 1962, young Edie inherits the building from an aunt she barely knew. In 1989, her daughter Grace is struggling to keep the business alive. And in the present day, Grace's daughter Kit returns from London to sell the place, only to find a box of letters in the cellar that changes everything she thought she knew about her family.`,
`Stories that jump between time periods can easily become confusing, but Denholm handles the structure with great confidence. Each chapter ends just as a secret is about to be revealed, and the next one, irritatingly and brilliantly, takes us to another decade. I lost count of the number of times I promised myself "just one more chapter" at two in the morning.`,
`The book is not perfect. The present-day chapters are noticeably weaker than the historical ones, and Kit, with her endless doubts about her career, is far less interesting than her grandmother. Some readers may also find the ending a little too neat: every question is answered, every misunderstanding resolved.`,
`These are small complaints, though. The Salt House is a warm, clever and genuinely moving novel about the things families choose not to say. It will not change your life. But it might very well cost you a night's sleep, and I can think of worse ways to lose one.`
  ], q:[
    { c:'h', v:`Hoe is het oordeel van de recensent over het boek?`, o:[
      `overwegend positief, met een paar kleine kritiekpunten`,
      `zeer negatief`,
      `neutraal, zonder eigen mening`,
      `positief over het heden, negatief over het verleden`],
      u:`De recensent noemt zwakke punten (alinea 4), maar zegt meteen: "These are small complaints, though" en noemt het boek "warm, clever and genuinely moving". Het heden vindt hij juist zwakker dan de historische delen.` },
    { c:'b', v:`Wat bedoelt de recensent met "irritatingly and brilliantly" (alinea 3)?`, o:[
      `Het is vervelend dat je op het geheim moet wachten, maar juist dat maakt het boek zo spannend.`,
      `Het boek is soms slecht geschreven en soms goed.`,
      `De schrijfster zelf is irritant.`,
      `De hoofdstukken zijn te lang.`],
      u:`Elk hoofdstuk stopt vlak voor een onthulling en springt dan naar een andere tijd. Als lezer erger je je daaraan, maar het werkt: je blijft lezen tot twee uur 's nachts. De twee woorden gaan over hetzelfde trucje, niet over goede en slechte stukken.` },
    { c:'v', v:`Wat is de functie van alinea 4?`, o:[
      `De recensent noemt zwakke punten van het boek.`,
      `De recensent vat het verhaal samen.`,
      `De recensent legt uit hoe het boek is opgebouwd.`,
      `De recensent geeft zijn eindoordeel.`],
      u:`"The book is not perfect" kondigt de kritiekpunten aan: het heden is zwakker, Kit is minder interessant en het einde is te netjes. Het eindoordeel staat pas in alinea 5, het verhaal in alinea 2.` },
    { c:'b', v:`"It will not change your life. But it might very well cost you a night's sleep" (alinea 5). Wat bedoelt de recensent?`, o:[
      `Het boek is geen meesterwerk, maar wel zo spannend dat je het moeilijk weglegt.`,
      `Het boek is te eng om voor het slapengaan te lezen.`,
      `Het boek is saai.`,
      `Het boek gaat over slapeloosheid.`],
      u:`Een nacht slaap kwijtraken verwijst terug naar alinea 3: "just one more chapter" om twee uur 's nachts. Het boek is dus spannend, niet eng. "It will not change your life" zegt dat het geen groot, levensveranderend boek is.` },
    { c:'z', wn:[[`Het verhaal speelt zich af in drie verschillende periodes.`, 1], [`Edie erft het hotel van haar moeder.`, 0], [`Kit wil het hotel verkopen.`, 1], [`De recensent vindt Kit het interessantste personage.`, 0]],
      v:`Geef van elke bewering aan of die wel of niet in de tekst staat.`,
      u:`De drie periodes (1962, 1989 en nu) en Kits plan om te verkopen staan in alinea 2. Edie erft het hotel van "an aunt she barely knew", een tante dus. En Kit is "far less interesting than her grandmother".` }
  ]});

  T({ id:'h10', n:'hv', soort:'Article', kop:'All aboard the night train', al:[
`For decades, the night train seemed to be heading for the scrapyard. Cheap flights had made it easy to cross Europe in a couple of hours, and one by one, the old sleeper services were cancelled. Now, surprisingly, they are back. New routes have opened between several European capitals, and on popular nights, tickets sell out weeks in advance.`,
`Much of the renewed interest has to do with climate change. A train journey produces far less carbon dioxide per passenger than the same trip by plane, and a growing number of travellers want to reduce their impact. Some companies now encourage their staff to take the train for business trips of up to a thousand kilometres.`,
`[[1]], climate concerns are only part of the story. Many passengers simply like the experience. "You get on in the evening, have dinner, sleep, and wake up in a different country," says Tom Reilly, who often takes the night train for work. "No airport security, no queues, no getting up at four in the morning. And you arrive in the city centre, not in a field forty kilometres away."`,
`Still, the night train has a serious problem: money. Sleeper trains are expensive to run. Each carriage carries far fewer passengers than a normal train, because beds take up more space than seats, and the trains make only one journey a day. On top of that, rail companies often have to pay high fees to use the tracks in every country they pass through, while international flights are often exempt from fuel tax.`,
`As a result, a bed on a night train can cost more than a flight to the same destination. Supporters argue that governments should make the competition fairer, for instance by lowering track fees for night trains or taxing aviation fuel. Until that happens, the night train may remain what it is now: a wonderful way to travel, for those who can afford it.`
  ], q:[
    { c:'h', v:`Welke bewering geeft de hoofdgedachte het best weer?`, o:[
      `Nachttreinen zijn weer populair, maar ze zijn duur om te laten rijden en daardoor vaak duurder dan vliegen.`,
      `Nachttreinen zijn beter voor het klimaat dan vliegtuigen.`,
      `Steeds meer bedrijven verbieden hun personeel te vliegen.`,
      `Nachttreinen verdwijnen opnieuw door de concurrentie van vliegtuigen.`],
      u:`De tekst beschrijft de terugkeer (alinea 1 tot 3) en het grote probleem: geld (alinea 4 en 5). Dat de trein beter is voor het klimaat klopt, maar is maar één reden voor de populariteit. Bedrijven moedigen de trein aan; verbieden doen ze niets.` },
    { c:'v', gat:1, o:[`However`, `For example`, `Therefore`, `In short`],
      u:`Alinea 2 noemt het klimaat als reden; alinea 3 zegt dat dat maar een deel van het verhaal is. Er komt een andere reden bij die tegen het idee "het is alleen het klimaat" ingaat: <b>However</b>. <i>In short</i> zou een samenvatting aankondigen.` },
    { c:'v', v:`Welk verband is er tussen alinea 4 en alinea 5?`, o:[
      `oorzaak en gevolg`, `tegenstelling`, `opsomming`, `voorbeeld`],
      u:`Alinea 4 legt uit waarom nachttreinen duur zijn om te laten rijden. Alinea 5 begint met "As a result": daardoor is een bed vaak duurder dan een vlucht. Dat signaalwoord geeft een gevolg aan.` },
    { c:'b', v:`Wat bedoelt de schrijver met "for those who can afford it" (laatste zin)?`, o:[
      `Zolang er niets verandert, is de nachttrein vooral iets voor mensen met genoeg geld.`,
      `Mensen met weinig geld reizen liever met de nachttrein.`,
      `De nachttrein wordt binnenkort goedkoper dan het vliegtuig.`,
      `Alleen zakenmensen mogen de nachttrein nemen.`],
      u:`"Until that happens" verwijst naar eerlijkere concurrentie. Zolang die er niet is, blijft de trein duurder dan vliegen, en dus alleen betaalbaar voor wie genoeg geld heeft. Dat het goedkoper wordt, staat er niet: het is een voorwaarde.` },
    { c:'z', al:4, v:`In welke alinea staat waarom een wagon van een nachttrein minder reizigers vervoert dan een gewone wagon?`,
      u:`Alinea 4: "Each carriage carries far fewer passengers than a normal train, because beds take up more space than seats".` }
  ]});

  T({ id:'h11', n:'hv', soort:'Column', kop:'Unexpected item in the bagging area', al:[
`I would like to thank my local supermarket. Thanks to its new self-checkout machines, I have learned a whole new profession. Every Saturday morning I now work, unpaid, as a cashier, and I must say I am getting rather good at it.`,
`It was not always like this. When the machines first appeared, I made every mistake possible. I scanned the same bottle of milk three times. I put my own bag on the scale before I started and was told, by a calm electronic voice, that there was an "unexpected item in the bagging area". The unexpected item was my shopping bag. I waited for a member of staff, who sighed and tapped a code into the screen as if I were a child who had lost his gloves.`,
`The supermarket says that the machines make shopping "faster and more convenient". For whom, exactly? There used to be six cashiers on Saturdays. Now there is one, standing guard over eight machines, running from one blinking light to the next. The queue has not disappeared. It has simply moved, and now I am the one doing the work at the end of it.`,
`To be fair, there are people who love the machines. My neighbour, a shy man, says he prefers not having to talk to anyone. And when you only need one carton of eggs, scanning it yourself is undoubtedly quicker. I understand that. [[1]], I miss Mrs Patel, the cashier who knew the name of every child in the street and once lent me two pounds when I had forgotten my wallet.`,
`No machine has ever lent me two pounds. Then again, no machine has ever asked for them back. Perhaps that is progress.`
  ], q:[
    { c:'h', v:`Wat is de bedoeling van de schrijver met deze column?`, o:[
      `met humor kritiek leveren op zelfscankassa's`,
      `lezers uitleggen hoe een zelfscankassa werkt`,
      `de supermarkt bedanken voor de nieuwe kassa's`,
      `aantonen dat zelfscankassa's sneller zijn`],
      u:`De schrijver lacht om de kassa's en vindt dat de klant nu het werk doet (alinea 3). Het "bedanken" in alinea 1 is ironisch bedoeld. Dat scannen sneller kan zijn, geeft hij in alinea 4 alleen toe voor één doos eieren.` },
    { c:'b', v:`"I would like to thank my local supermarket." (alinea 1) Hoe moet je deze zin opvatten?`, o:[
      `ironisch`, `als een oprecht compliment`, `als een verontschuldiging`, `als een advies`],
      u:`Hij bedankt de supermarkt omdat hij nu "unpaid" als kassamedewerker werkt. Niemand is echt dankbaar voor onbetaald werk: hij zegt het tegenovergestelde van wat hij bedoelt. Dat is ironie.` },
    { c:'b', v:`Wat bedoelt de schrijver met "It has simply moved, and now I am the one doing the work at the end of it" (alinea 3)?`, o:[
      `De klant doet nu het werk van de kassamedewerker, en wachten moet nog steeds.`,
      `De rij staat nu bij de ingang van de winkel.`,
      `De schrijver is in de supermarkt gaan werken.`,
      `Er werken nu meer mensen in de supermarkt.`],
      u:`"It" is de rij: die is er nog steeds, maar staat nu bij de machines. Aan het eind van die rij scant de klant zelf. In de supermarkt werken is figuurlijk bedoeld: hij krijgt er niet voor betaald.` },
    { c:'v', gat:1, o:[`Still`, `Therefore`, `Besides`, `For instance`],
      u:`Hij geeft eerst toe dat de machines voordelen hebben ("I understand that"), en zegt dan dat hij toch iets mist. Toegeving, dan tegenstelling: <b>Still</b> (toch). <i>Besides</i> zou nog een voordeel van de machines aankondigen.` },
    { c:'z', al:4, v:`In welke alinea noemt de schrijver voordelen van zelfscankassa's?`,
      u:`Alinea 4 begint met "To be fair": de verlegen buurman hoeft met niemand te praten, en één doos eieren scan je sneller zelf. Alinea 3 noemt wat de supermarkt zegt ("faster and more convenient"), maar de schrijver gelooft dat niet ("For whom, exactly?").` }

  T({ id:'h12', n:'hv', soort:'Opinion', kop:'Better zoos, not no zoos', al:[
`Every time a zoo animal makes the news, whether it is a baby elephant or an escaped monkey, the same debate begins. Should zoos still exist at all? Critics say that keeping wild animals behind fences is cruel and old-fashioned. I understand their feelings. But I believe that closing every zoo would be a serious mistake.`,
`Let us be honest about the past. For a long time, zoos were little more than prisons for animals, built to entertain visitors. Lions paced up and down in small concrete cages, and bears begged for bread. Nobody should want to return to that.`,
`[[1]], good modern zoos are a different story. They spend large sums on conservation and research, and some species exist today mainly because zoos kept them alive. Przewalski's horse, for instance, disappeared from the wild in the twentieth century and survived only in captivity, before being returned to the grasslands of Mongolia.`,
`Zoos also have an educational role that is easy to underestimate. A documentary can show you a gorilla, but it cannot make you feel how big it is, or how it looks you straight in the eye. Many biologists say that their interest in nature began with a visit to a zoo as a child.`,
`This does not mean that every zoo deserves to stay open. Zoos that cannot give their animals enough space, or that keep species which clearly suffer in captivity, should change or close. The question, then, is not whether zoos should exist, but what kind of zoos we want. Let us demand better ones, rather than none at all.`
  ], q:[

      `Goede moderne dierentuinen moeten blijven; slechte moeten veranderen of sluiten.`,

      `Dierentuinen zijn vooral bedoeld om bezoekers te vermaken.`,
      `Dieren hebben het in een dierentuin beter dan in het wild.`],
      u:`Het standpunt staat in alinea 1 ("closing every zoo would be a serious mistake") en wordt in alinea 5 verfijnd: niet elke dierentuin verdient het om open te blijven. Vermaak was volgens de schrijver de rol van dierentuinen vróeger (alinea 2).` },
    { c:'v', gat:1, o:[`However`, `Therefore`, `In addition`, `For example`],
      u:`Alinea 2 gaat over de slechte dierentuinen van vroeger; alinea 3 zegt dat moderne dierentuinen anders zijn. Dat is een tegenstelling: <b>However</b>. <i>Therefore</i> zou betekenen dat moderne dierentuinen goed zijn omdát de oude slecht waren.` },
    { c:'v', v:`Waarom noemt de schrijver het Przewalskipaard (alinea 3)?`, o:[

      u:`Vlak ervoor staat "some species exist today mainly because zoos kept them alive", en dan volgt "for instance". Het paard verdween in het wild, overleefde in dierentuinen en ging daarna terug naar Mongolië. Het is dus een voorbeeld van wat dierentuinen goed doen.` },
    { c:'b', v:`Wat bedoelt de schrijver met "Let us demand better ones, rather than none at all" (alinea 5)?`, o:[

      `We moeten geld geven aan dierentuinen.`],
      u:`"Better ones" zijn betere dierentuinen; "none at all" is geen enkele dierentuin, wat de critici willen. Hij kiest voor verbeteren. Dat slechte dierentuinen moeten sluiten staat er wel, maar dat is niet de betekenis van deze zin.` },
    { c:'z', al:4, v:`In welke alinea legt de schrijver uit wat een bezoek aan een dierentuin kan doen dat een documentaire niet kan?`,
      u:`In alinea 4: "A documentary can show you a gorilla, but it cannot make you feel how big it is".` }

  T({ id:'h13', n:'hv', soort:'Article', kop:'Why teenagers cannot get up', al:[
`Every school morning, millions of teenagers drag themselves out of bed while it is still dark, and every school morning, their parents assume they went to bed too late. They may be partly right. But according to sleep scientists, there is another reason why teenagers struggle to get up: their biology.`,
`During puberty, the body's internal clock shifts. The hormone melatonin, which makes us feel sleepy, is released later in the evening than in younger children or adults. As a result, many teenagers simply do not feel tired until eleven o'clock or later. If they then have to get up at half past six, they get far less than the eight to ten hours of sleep that experts recommend for their age.`,
`A lack of sleep is not just a matter of yawning in class. Tired pupils find it harder to concentrate and to remember what they have learned, and they are more likely to feel irritable or low. [[1]], some studies suggest that teenagers who sleep too little are more likely to have accidents on the way to school.`,
`This has led some schools to experiment with later start times. In several studies of schools that moved their first lesson later in the morning, pupils slept longer on average and were less often late or absent.`,
`Not everyone is enthusiastic. Some parents worry that a later start means a later finish, which could clash with sports clubs and part-time jobs. Teachers point out that timetables are complicated and that buses are planned around the current school day. And some critics argue that teenagers would simply use the extra hour to stay up even later.`,
`Sleep researchers are not impressed by that last argument. The body clock, they say, is not a bad habit that pupils can easily change. "You can't tell a teenager to feel sleepy at nine o'clock," as one researcher puts it, "any more than you can tell an adult to feel sleepy at six."`
  ], q:[
    { c:'h', v:`Waar gaat de tekst vooral over?`, o:[
      `Tieners hebben door hun biologische klok moeite met vroeg opstaan, en daarom proberen sommige scholen een latere begintijd.`,
      `Tieners gaan te laat naar bed omdat ze te lang op hun telefoon zitten.`,
      `Alle scholen zouden pas om tien uur moeten beginnen.`,
      `Slaaptekort is bij volwassenen een groter probleem dan bij tieners.`],
      u:`De oorzaak (de biologische klok) staat in alinea 1 en 2, de gevolgen in alinea 3 en de proeven met een latere begintijd in alinea 4 tot 6. Telefoons worden niet genoemd; de tekst zegt juist dat er een ándere reden is dan laat naar bed gaan.` },
    { c:'v', gat:1, o:[`What is more`, `On the other hand`, `Instead`, `In conclusion`],
      u:`Na concentratie en humeur komt er een nog ernstiger gevolg bij: ongelukken. Dat is een opsomming met een versterking: <b>What is more</b> (bovendien). <i>On the other hand</i> zou een tegenstelling aankondigen, maar het is nog een nadeel.` },
    { c:'z', v:`Welk bezwaar uit alinea 5 vinden slaaponderzoekers niet overtuigend?`, o:[

      `dat lessen dan later eindigen`,
      `dat bussen op de huidige schooltijden zijn ingesteld`,

      u:`Alinea 6 begint met "Sleep researchers are not impressed by that last argument". Het laatste argument van alinea 5 is dat tieners het extra uur gebruiken om later op te blijven.` },
    { c:'b', v:`Wat bedoelt de onderzoeker met de vergelijking in de laatste alinea?`, o:[

      `Volwassenen zouden om zes uur naar bed moeten gaan.`,
      `Tieners zijn eerder moe dan volwassenen.`,
      `Ouders moeten hun kinderen om negen uur naar bed sturen.`],
      u:`Een volwassene wordt om zes uur 's avonds niet slaperig, hoe graag je dat ook wilt. Voor een tiener geldt hetzelfde om negen uur. Slaperigheid is dus geen keuze maar biologie. Tieners worden juist láter moe, niet eerder.` },
    { c:'z', cit:[`The hormone`], v:`Citeer de eerste twee woorden van de zin die uitlegt waarom tieners 's avonds pas laat moe worden.`,
      u:`De uitleg staat in alinea 2: "The hormone melatonin, which makes us feel sleepy, is released later in the evening". De zin daarna ("As a result, ...") noemt het gevolg, niet de oorzaak.` }
  ]});

  T({ id:'h14', n:'hv', soort:'Article', kop:'The town that said goodbye to cars', al:[
`When the town council of Hollin, a market town of 40,000 people, voted to ban cars from its historic centre, the local newspaper predicted disaster. Shops would close, it warned, elderly residents would be trapped at home and the centre would turn into a ghost town. Three years later, the main square is busier than it has been in decades.`,
`The change did not happen overnight. The council first closed the main street on Saturdays only, to let people get used to the idea. Then it introduced free electric buses from car parks on the edge of town, built cycle lanes and allowed delivery vans in the early morning. Only after two years of experimenting did the ban become permanent.`,
`Shopkeepers were among the fiercest opponents. "I was sure I'd lose half my customers," says bookseller Peter Lund. "Who wants to carry a bag of books to a bus stop?" To his surprise, the opposite happened. People who used to drive in, park and leave now walk around, stop for a coffee and look in shop windows. Lund's sales have risen by fifteen per cent.`,
`[[1]], not every business has benefited. A furniture shop moved to an industrial estate outside town, because its customers could no longer load large items into their cars at the door. And some older residents say the buses are fine for people who walk easily, but difficult for anyone using a walking frame.`,
`The council admits that the plan is not perfect and has promised special taxis for people with limited mobility. But it has no intention of going back. "Streets are for people," says the mayor. "We had simply forgotten that for fifty years."`
  ], q:[

    { c:'v', gat:1, o:[`That said`, `Moreover`, `As a result`, `For this reason`],
      u:`Alinea 3 eindigt positief; alinea 4 noemt bedrijven die geen voordeel hebben. Dat is een tegenstelling: <b>That said</b> (dat gezegd hebbende, toch). <i>Moreover</i> zou nog een voordeel aankondigen.` },
    { c:'v', v:`Wat beschrijft alinea 2?`, o:[

    { c:'z', wn:[[`De krant voorspelde dat het centrum zou leeglopen.`, 1], [`Het autoverbod werd in één keer ingevoerd.`, 0], [`De omzet van boekhandelaar Lund is gestegen.`, 1], [`Alle winkels in het centrum hebben voordeel van het autoverbod.`, 0]],
      v:`Geef van elke bewering aan of die wel of niet in de tekst staat.`,
      u:`De "ghost town" staat in alinea 1 en de vijftien procent meer omzet in alinea 3. Het verbod kwam stap voor stap ("did not happen overnight"), en een meubelzaak heeft er juist last van (alinea 4).` }

  T({ id:'h15', n:'hv', soort:'Opinion', kop:'Exams are not the enemy', al:[
`It has become fashionable to hate exams. Every spring, as pupils across the country sit down in silent sports halls, the familiar complaints appear: exams cause stress, they reward memorising rather than thinking, and a single bad morning can ruin years of hard work. Some politicians have even suggested scrapping final exams altogether. I think that would be a mistake.`,
`Let me be clear: I do not enjoy watching young people suffer from stress, and I agree that some exams test the wrong things. A history exam that asks only for dates is a poor exam. But the answer to a bad exam is a better exam, not no exam at all.`,
`The great strength of a national exam is that it is the same for everyone. Every pupil answers the same questions, and every paper is marked against the same standards. Without it, we would depend entirely on schools' own assessments, and schools differ enormously. [[1]], a high mark at one school might be worth much less at another, and universities and employers would have no way of telling the difference.`,
`Exams also teach something that is easy to overlook: how to perform under pressure. Few adults can choose the moment when they have to deliver. A surgeon cannot postpone an operation because she is having an off day, and a pilot cannot ask for a second attempt at a landing. Learning to prepare well and stay calm when it matters is not a cruel side effect of exams. It is one of their purposes.`,
`None of this means that the system cannot be improved. Pupils should get more chances to resit a failed subject, and exams should test understanding rather than memory. But before we throw exams away, we should ask ourselves an honest question: what would replace them, and would it really be fairer?`
  ], q:[
    { c:'h', v:`Welke bewering geeft het standpunt van de schrijver het best weer?`, o:[
      `Centrale examens moeten blijven, al kunnen ze beter.`,

      `Scholen moeten zelf bepalen hoe ze hun leerlingen toetsen.`,

      u:`Afschaffen "would be a mistake" (alinea 1), maar in alinea 5 staat ook "the system can be improved". Dat scholen zelf toetsen, ziet hij juist als probleem: scholen verschillen te veel (alinea 3).` },
    { c:'v', gat:1, o:[`As a result`, `In contrast`, `Even so`, `Instead`],
      u:`Zonder centraal examen hangt alles af van de scholen, en scholen verschillen sterk. Het gevolg: een cijfer zegt niet overal hetzelfde. Dat is oorzaak en gevolg: <b>As a result</b>. <i>In contrast</i> en <i>Even so</i> kondigen een tegenstelling aan.` },
    { c:'v', v:`Wat doet de schrijver in alinea 2?`, o:[

    { c:'b', v:`Waarom noemt de schrijver een chirurg en een piloot (alinea 4)?`, o:[

      u:`De voorbeelden horen bij "Few adults can choose the moment when they have to deliver". Een chirurg en een piloot moeten het op het juiste moment goed doen, net als een leerling op het examen.` },
    { c:'z', al:5, v:`In welke alinea doet de schrijver voorstellen om het examensysteem te verbeteren?`,
      u:`In alinea 5: meer herkansingen ("more chances to resit a failed subject") en examens die begrip toetsen in plaats van geheugen. In alinea 2 staat alleen dat een slecht examen beter moet, zonder voorstel.` }

  T({ id:'v01', n:'vwo', soort:'Essay', kop:'In praise of the unticked box', al:[
`There is a particular kind of shame that afflicts the modern professional on a Sunday afternoon. It is not the shame of having done something wrong, but of having done nothing at all. The laptop stays closed, the inbox swells quietly, and somewhere in the back of the mind a voice whispers that the hours are being wasted. We have, it seems, become a culture that cannot rest without feeling guilty about it.`,
`The productivity industry has been quick to exploit this anxiety. Bookshops groan under titles promising to help us "hack" our mornings, and app stores overflow with tools that track our habits, our focus and even our sleep. The underlying message is seductive in its simplicity: with the right system, every hour can be made to count. [[1]] the more we optimise, the less satisfied we seem to become.`,
`Part of the problem lies in what productivity culture chooses to measure. It is easy to count emails answered, kilometres run or pages written; it is much harder to quantify a long conversation with an old friend or an afternoon spent staring at the sea. Because the latter leave no trace on a dashboard, they begin to look suspiciously like idleness. Over time, we come to value only what we can record, and the unrecorded parts of life, which are often the best parts, start to feel like failures of discipline.`,
`There is an irony here that the gurus rarely mention. Many of the ideas we now admire were born in precisely those unmeasured hours. Scientists describe breakthroughs that arrived during a walk; writers speak of sentences that came to them in the bath. The mind, it appears, needs periods of apparent uselessness in order to make unexpected connections. A schedule packed from dawn to dusk leaves no room for such accidents.`,
`None of this is an argument for laziness, nor a romantic plea to abandon our ambitions. Work matters, and organising it sensibly is no crime. The problem arises when efficiency stops being a means and becomes an end in itself: when we no longer ask what our time is for, only how much of it we have filled.`,
`Perhaps, then, the most radical item we could add to our to-do lists is one that cannot be ticked off: nothing. Not nothing as a reward for finishing everything else, but nothing as a legitimate way of spending an afternoon. It will feel uncomfortable at first. That discomfort, I suspect, tells us more about the culture we live in than about ourselves.`
  ], q:[
    { c:'h', v:`Welke bewering geeft de hoofdgedachte van de tekst het best weer?`, o:[
      `Door de obsessie met productiviteit lijkt tijd die niets meetbaars oplevert verspild, terwijl die juist waardevol is.`,
      `Productiviteitsapps zijn nuttig, mits je ze op de juiste manier gebruikt.`,

      `Werk is minder belangrijk dan vrije tijd.`],
      u:`De schrijver laat zien dat we alleen waarderen wat we kunnen meten (alinea 3), terwijl juist ongemeten tijd ideeën oplevert (alinea 4). Een pleidooi voor luiheid is het uitdrukkelijk níet: "None of this is an argument for laziness" (alinea 5).` },
    { c:'v', gat:1, o:[`Yet`, `Hence`, `Indeed`, `Likewise`],
      u:`De belofte is dat elk uur kan tellen; het resultaat is dat we minder tevreden worden. Dat is een tegenstelling: <b>Yet</b>. <i>Hence</i> en <i>Indeed</i> zouden de zin als gevolg of bevestiging van de belofte presenteren, en dat is hij niet.` },
    { c:'v', v:`Wat is de functie van alinea 5?`, o:[
      `Ze voorkomt een mogelijk misverstand over het standpunt van de schrijver.`,
      `Ze geeft een nieuw argument voor de bewering uit alinea 4.`,
      `Ze weerlegt de kritiek op productiviteitsgoeroes.`,
      `Ze vat de voorgaande alinea's samen.`],
      u:`Na alle kritiek zou de lezer kunnen denken dat de schrijver tegen werken is. Alinea 5 zegt van niet ("None of this is an argument for laziness") en bakent het probleem af: efficiëntie als doel op zich. Dat is een nuancering, geen samenvatting.` },
    { c:'b', v:`Wat bedoelt de schrijver met "they begin to look suspiciously like idleness" (alinea 3)?`, o:[
      `Omdat ze niets meetbaars opleveren, gaan waardevolle momenten aanvoelen als luiheid.`,
      `Wie naar de zee staart, is meestal gewoon lui.`,
      `Gesprekken met vrienden zijn eigenlijk tijdverspilling.`,
      `Een dashboard laat zien wie er lui is.`],
      u:`"They" zijn het gesprek met een vriend en de middag aan zee: ze laten "no trace on a dashboard" achter. Daardoor lijken ze op nietsdoen, al vindt de schrijver ze juist "the best parts". Het woord "suspiciously" laat zien dat dit een verkeerde indruk is.` },
    { c:'z', cit:[`Work matters`], v:`Citeer de eerste twee woorden van de zin waarin de schrijver zegt dat er niets mis is met werk verstandig organiseren.`,
      u:`Alinea 5: "Work matters, and organising it sensibly is no crime." "No crime" betekent: daar is niets mis mee.` }
  ]});

  T({ id:'v02', n:'vwo', soort:'Exhibition review', kop:'Machine Dreams', al:[
`"Machine Dreams", the new exhibition at the Calder Gallery, opens with a confession. Before you have seen a single work, a wall text informs you that every image in the following eleven rooms was produced, wholly or partly, by artificial intelligence. It is a curious way to begin: part warning, part boast and, as it turns out, the most honest sentence in the show.`,
`The early rooms are undeniably impressive. Vast, shimmering canvases of imaginary cities hang beside portraits of people who have never existed, rendered with a precision that would have taken a human painter months. Some of the cities glitter with impossible towers that seem to have been borrowed from a dozen different centuries at once. Visitors crowd around them, phones raised, photographing pictures that were themselves generated by machines. One begins to wonder who, precisely, the audience for this exhibition is meant to be.`,
`The difficulty is that technical brilliance soon becomes monotonous. By the fifth room, the cities have started to resemble one another, and the faces, for all their flawless skin, share a curious emptiness, as though they had been assembled from the average of a million photographs, which, in a sense, they were. [[1]] a great portrait tells you something about a particular person, these images tell you mainly about the data on which their software was trained.`,
`The curators seem aware of this objection and attempt to answer it in the final rooms, where human artists have used AI as one tool among many. These works are by far the most interesting in the exhibition. In one installation, a painter has fed her late mother's diaries into a program and then painted, by hand, over the images it produced, correcting, erasing and arguing with them. Another artist has trained a program exclusively on her own sketchbooks, so that the machine can only ever echo her hand; the results look less like a computer's work than like a conversation with a younger version of herself. The result is uneasy and deeply moving: a dialogue between memory and machine in which the human voice has the final word.`,
`It is a pity, then, that the gallery chose to devote so much space to the spectacle and so little to the conversation. "Machine Dreams" will doubtless attract record crowds, and it raises questions worth asking about authorship and originality. But it answers the most important one almost by accident. Art made by machines can dazzle; art made with them, by people who have something to say, can still move us. The difference, it turns out, is not the technology. It is whether anyone is home.`

  T({ id:'v03', n:'vwo', soort:'Opinion', kop:'You are not a brand', al:[
`At some point in the last decade, it stopped being enough to be good at your job. You now also need a "personal brand". Career coaches urge graduates to curate their online presence, define their "core values" and post regularly about their achievements, so that potential employers can see not only what they can do but who they are. The language is borrowed, quite openly, from marketing: you are no longer a person looking for work, but a product looking for buyers.`,
`Defenders of the idea argue that it is simply realistic. Recruiters do look people up online, and in a crowded job market, a well-maintained profile can make the difference between an interview and silence. Some coaches point to surveys suggesting that most employers check candidates' social media before inviting them for a conversation. There is some truth in this, and it would be naive to advise young people to ignore it entirely.`,
`But the logic of the brand is corrosive in ways that its advocates rarely acknowledge. A brand, by definition, must be consistent; it cannot afford to change its mind, admit ignorance or try something at which it might fail. People, on the other hand, are supposed to do all three. A twenty-two-year-old who carefully maintains an image of confident expertise is, in effect, being asked to stop growing in public. [[1]], the mistakes and detours that once formed a natural part of early adulthood become threats to be managed.`,
`There is also something faintly absurd about the whole exercise. When everyone is busily presenting themselves as "passionate", "driven" and "solution-oriented", these words lose whatever meaning they once had. Recruiters, by most accounts, have learned to scroll straight past them. Job advertisements, meanwhile, are written in exactly the same vocabulary, so that applicants and employers end up reciting the same slogans to one another, like two salespeople trying to sell each other the same product. The result is an arms race of self-promotion in which everyone works harder to stand out and nobody actually does.`,
`I am not suggesting that young people should vanish from the internet or refuse to talk about their work. Sharing what you have made, written or learned can be valuable and even generous. The difference lies in the motive. Sharing work invites a conversation; maintaining a brand invites only consumption.`,
`Perhaps the best career advice, then, is also the most old-fashioned: become genuinely good at something, be decent to the people you work with, and let your reputation follow. It is slower than a marketing campaign. It is also considerably harder to fake.`
  ], q:[

    { c:'b', v:`Wat bedoelt de schrijver met "an arms race of self-promotion in which everyone works harder to stand out and nobody actually does" (alinea 4)?`, o:[

  T({ id:'v04', n:'vwo', soort:'Article', kop:'Bringing back the mammoth?', al:[
`For most of human history, extinction has been the one truly irreversible event in nature. A species that disappears is gone for good; no amount of regret can bring it back. Or so we used to think. In recent years, a handful of biotechnology companies have announced, with considerable fanfare, that they intend to undo extinction itself, starting with the woolly mammoth, which vanished around four thousand years ago.`,
`What they actually propose is somewhat less dramatic than the headlines suggest. Nobody can clone a mammoth, since no intact mammoth cells survive. Instead, scientists plan to edit the genes of its closest living relative, the Asian elephant, adding traits such as thick hair and a layer of insulating fat. The result would not be a mammoth but a cold-resistant elephant that looks rather like one. Whether that counts as bringing a species back is, to put it mildly, open to debate.`,
`Supporters present the project as a contribution to conservation. Herds of such animals, they argue, could help restore the Arctic grasslands that mammoths once maintained, and the techniques developed along the way might help endangered species that are still alive. [[1]], critics fear the opposite effect. If extinction comes to seem reversible, they warn, the urgency of protecting species today could quietly fade. Why spend money saving a habitat if a laboratory can always rebuild what we lose?`,
`There are practical objections, too. Elephants are highly social animals with pregnancies of nearly two years, and they learn much of their behaviour from older members of the herd. An engineered calf would be born without a single mammoth to teach it how to be one. Animal welfare experts ask whether it is fair to create a creature whose natural social world no longer exists.`,
`Perhaps the strongest argument against the project, however, concerns priorities. Conservation budgets are limited, and species are disappearing far faster than any laboratory could recreate them. The northern white rhinoceros, of which only two animals remain, both female, is a reminder that the battle is being lost in the present, not in the Ice Age.`,
`None of this means that the research is worthless. The science is genuinely fascinating, and genetic tools may one day help rescue populations that are struggling. But it would be a mistake to treat de-extinction as a solution to the loss of biodiversity. A mammoth-like elephant on the tundra might make a splendid photograph. It would not undo the conditions that made the mammoth disappear, nor those that threaten so many species today.`

    { c:'z', wn:[[`Er bestaan nog intacte cellen van mammoeten.`, 0], [`Het plan is om de genen van de Aziatische olifant aan te passen.`, 1], [`Critici vrezen dat mensen minder moeite gaan doen om bestaande soorten te beschermen.`, 1], [`De schrijver vindt het onderzoek waardeloos.`, 0]],
