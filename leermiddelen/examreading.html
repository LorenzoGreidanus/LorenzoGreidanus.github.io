  T({ id:'v05', n:'vwo', soort:'Column', kop:'Confessions of a former grammar pedant', al:[
`I have a confession to make: I used to be a grammar pedant. Not the mild kind who winces quietly at a misplaced apostrophe, but the insufferable kind who corrects menus, emails strangers about "less" and "fewer" and once, to my eternal shame, pointed out a grammatical error in a wedding speech. I believed I was defending the English language. I now suspect I was mainly defending my own sense of superiority.`,
`My conversion began, as these things often do, with a book. A linguist's history of English made an argument I found impossible to dismiss: many of the "rules" I had been enforcing were surprisingly recent inventions. The ban on ending a sentence with a preposition, for example, owes more to seventeenth- and eighteenth-century writers who admired Latin than to anything in the nature of English itself. Speakers had happily ignored it for centuries before anyone thought to write it down.`,
`Then there is "literally". Few words provoke such fury among pedants as the use of "literally" to mean "figuratively", as in "I literally died of embarrassment". It is, we are told, a sign of the language's decline. Yet this use of the word can be found in the works of celebrated nineteenth-century novelists. [[1]] being a symptom of modern ignorance, it is a usage with a long and rather distinguished history.`,
`This is not to say that anything goes. Language has conventions, and conventions matter: they allow us to understand one another, and a job application full of errors will rightly be judged harshly. But a convention is not a moral law. Knowing when formal English is expected is a valuable skill; sneering at people who speak differently in a café, a text message or a regional dialect is not.`,
`What pedants often fail to see is that language has always changed, and that every generation has been convinced it was witnessing the collapse of standards. The complaints of eighteenth-century critics about the vulgar speech of their day sound remarkably similar to modern laments about teenagers and their slang. The language they feared for did not collapse. It became the English we now feel compelled to defend.`,
`I still notice the errors, of course. Old habits die hard. But these days I keep my red pen in the drawer, and I find that people are far more interested in what I have to say now that I have stopped telling them how to say it.`
  ], q:[

  T({ id:'v06', n:'vwo', soort:'Essay', kop:'Stuck on repeat', al:[
`Walk into any cinema this year and you could be forgiven for thinking you had stepped into a time machine. The posters advertise sequels to films from the 1980s, remakes of films from the 1990s and "reimaginings" of cartoons that the parents in the audience watched as children. Television is no different, and the music charts are increasingly populated by songs built on samples of hits from decades ago. Popular culture, it seems, has developed an extraordinary appetite for its own past.`,
`The commercial logic is not hard to grasp. Making a film is expensive and risky, and a title that audiences already recognise reduces that risk considerably. A studio that releases a sequel to a beloved film can count on a ready-made audience, free publicity and a generation of parents eager to introduce their children to the stories they grew up with. In an industry where a single failure can cost hundreds of millions, originality is a gamble that few executives are willing to take.`,
`Yet commerce alone cannot explain the phenomenon, for audiences are not merely tolerating these productions; they are actively seeking them out. Nostalgia, psychologists suggest, is not simply a longing for the past but a way of coping with an uncertain present. When the future looks threatening, whether because of economic instability, political upheaval or climate change, the familiar stories of childhood offer a kind of emotional shelter. [[1]], the remake is less an artistic choice than a comfort blanket.`,
`There is nothing inherently wrong with comfort. The trouble is what it displaces. Every screen devoted to a fourth instalment of a franchise is one fewer for a film that might have surprised us, and every budget spent on recreating the past is money not spent on imagining a future. Young filmmakers with original ideas increasingly find that the only way to get them made is to disguise them as something familiar.`,
`Moreover, nostalgia has a habit of flattening history. The decades being recycled were not as innocent as their remakes suggest; they had their own anxieties, injustices and bad haircuts, most of which have been quietly edited out. What we consume is not the past but a pleasant fiction about it, one that makes the present look worse by comparison and the future seem hardly worth imagining.`,
`Culture has always borrowed from itself, of course; Shakespeare took most of his plots from older sources. The difference is that he transformed what he borrowed into something new. A culture that only repeats, rather than reinvents, risks becoming a museum of its own greatest hits: pleasant to visit, but no place to live.`

  T({ id:'v07', n:'vwo', soort:'Article', kop:'The shade gap', al:[
`On a hot afternoon in July, the difference between two streets in the same city can be startling. On one, lined with mature plane trees, pedestrians stroll in dappled shade. On the other, a stretch of asphalt and glass just a few hundred metres away, the air shimmers and anyone who can has fled indoors. Measurements confirm what the body already knows: tree-lined streets can be several degrees cooler than bare ones.`,
`The phenomenon behind this is known as the urban heat island. Concrete, brick and asphalt absorb heat during the day and release it slowly at night, so that cities remain considerably warmer than the surrounding countryside long after sunset. As heatwaves become more frequent, this is no longer merely a matter of comfort. Prolonged heat places serious strain on the body, particularly among older people and those with heart or lung conditions.`,
`Trees counter the effect in two ways. Their canopies block sunlight before it reaches the ground, and they release water vapour through their leaves, a process that cools the surrounding air in much the same way that sweating cools the skin. A single tree helps, but its effect is limited. [[1]], a cluster of trees can noticeably cool an entire block.`,
`Cities have taken note. Many have announced ambitious planting programmes, often promising tens of thousands of new trees within a few years. Such pledges make attractive headlines, but urban ecologists urge caution. Planting a tree is the easy part; keeping it alive is another matter. Young street trees need regular watering for several years, and in many cities a significant proportion die before they reach maturity, often because nobody was made responsible for looking after them.`,
`There is also the question of time. A sapling planted today will take decades to provide the kind of shade that a mature tree offers. This is why many experts argue that protecting existing large trees should take priority over planting new ones. Felling a hundred-year-old oak to make room for a car park and replacing it with ten young saplings may look like a gain on paper; in terms of cooling, it is a substantial loss for a generation.`,
`Finally, critics point out that greenery is not evenly distributed. Wealthier neighbourhoods tend to have more trees, while poorer districts, where residents are often less able to escape the heat, are frequently the most built-up. Planting programmes that ignore this risk widening an inequality that the next heatwave will make painfully visible.`

    { c:'v', gat:1, o:[`By contrast`, `Similarly`, `Therefore`, `In short`],
      u:`Eén boom heeft een beperkt effect; een groep bomen een groot effect. Dat is een tegenstelling: <b>By contrast</b>. <i>Similarly</i> zou zeggen dat het hetzelfde is, en <i>Therefore</i> maakt van de groep bomen een gevolg van de ene boom.` },
    { c:'b', v:`Wat bedoelt de schrijver met "may look like a gain on paper; in terms of cooling, it is a substantial loss for a generation" (alinea 5)?`, o:[

      `Een parkeerplaats koelt de stad meer af dan een oude eik.`,

    { c:'z', wn:[[`Steden koelen 's nachts sneller af dan het platteland.`, 0], [`Hitte is vooral gevaarlijk voor ouderen en mensen met hart- of longproblemen.`, 1], [`Veel jonge straatbomen sterven voordat ze volgroeid zijn.`, 1], [`In arme wijken staan meestal meer bomen dan in rijke wijken.`, 0]],

  T({ id:'v08', n:'vwo', soort:'Opinion', kop:'The trouble with merit', al:[
`Few ideas are as widely admired as meritocracy, the principle that rewards should go to those who earn them through talent and effort rather than birth or connections. Politicians of every stripe invoke it, schools are organised around it, and most of us, if asked, would say that a fair society is one in which anyone can rise as far as their abilities allow. It seems almost churlish to object.`,
`And yet the word itself was coined as a warning. When the British sociologist Michael Young introduced it in 1958, in a satirical book, he imagined a future society in which intelligence and effort had replaced class as the basis of status, and in which the result was not justice but a new and particularly smug elite. Those at the top, convinced that they deserved their position, felt no obligation to those below; those at the bottom, told that they had had their chance, were left with nothing but their failure.`,
`Young's warning has proved uncomfortably prophetic. The trouble with meritocracy is not that it rewards talent, but that it encourages the successful to believe that their success is entirely their own doing. In reality, the "merit" that schools and employers measure is shaped long before anyone sits an exam: by parents who read to their children, by quiet bedrooms to study in, by tutors, by connections that open doors to the right internships. [[1]] the race may be fair in its final metres, it is anything but fair from the start.`,
`The consequences extend beyond the economy. If those who succeed are deemed to deserve their rewards, those who struggle are implicitly deemed to deserve their hardship. It is a short step from there to the condescension that many people without degrees now feel from the institutions that are meant to represent them, and to the resentment that, in many countries, has found expression at the ballot box.`,
`None of this is an argument for abandoning the pursuit of talent. A hospital should hire the most capable surgeon, not the one with the best family connections. The point is rather that merit should be treated with humility: as something partly given rather than wholly earned, and as a responsibility rather than a trophy.`,
`A society that took this seriously would invest heavily in the years before selection begins, would value forms of work that require no diploma, and would stop pretending that the winners of a rigged race have earned every prize. That is not the end of meritocracy. It may be the only way to save it from itself.`
  ], q:[
    { c:'h', v:`Welke bewering geeft de hoofdgedachte het best weer?`, o:[

      u:`"The word itself was coined as a warning": Young beschreef in een satire een toekomst met "a new and particularly smug elite". Hij prees de meritocratie dus niet aan, en hij beschreef een verzonnen toekomst, niet zijn eigen tijd.` },

    { c:'b', v:`Wat bedoelt de schrijver met "the winners of a rigged race" (alinea 6)?`, o:[

      u:`Een "rigged race" is een wedstrijd waarvan de uitslag vooraf beïnvloed is. Dat verwijst naar alinea 3: ouders, rust, bijles en contacten bepalen al vóór het examen wie vooraan staat. De winnaars hoeven zelf niet vals te spelen; de start is oneerlijk.` },
    { c:'v', v:`Waarom noemt de schrijver een chirurg (alinea 5)?`, o:[

      `om te laten zien dat artsen te veel verdienen`,

      `om te laten zien dat ziekenhuizen oneerlijk selecteren`],
      u:`Alinea 5 begint met "None of this is an argument for abandoning the pursuit of talent". De chirurg is het voorbeeld: daar wil je gewoon de beste. Zo laat de schrijver zien dat hij niet tegen talent als maatstaf is.` }

  T({ id:'v09', n:'vwo', soort:'Book review', kop:'The Weight of Feathers', al:[
`Julian Marsh's new novel, The Weight of Feathers, runs to a little over seven hundred pages, which is roughly five hundred more than its story requires. This is a book that never uses one adjective when four are available, never lets a character simply leave a room when they could instead "drift towards the threshold like a thought half-formed", and never, under any circumstances, trusts the reader to understand anything the first time.`,
`The plot, such as it is, concerns Adrian, a melancholy professor of architecture who returns to the coastal village of his childhood after his father's death. There he encounters his estranged brother, his former lover and a quantity of symbolic weather. Along the way there are long letters from the dead father, a secret buried in the dunes and a lighthouse that is described, with diminishing returns, on no fewer than eleven occasions. Over the following six hundred pages, rain falls meaningfully, the sea broods and Adrian reflects, at considerable length, on memory, loss and the impossibility of truly knowing another person.`,
`It would be unfair to deny that Marsh can write. Scattered through the book are passages of real beauty, among them a description of the brothers' childhood bedroom that is as precise and unsentimental as anything he has written. In these moments, one glimpses the novel that might have been: shorter, sharper and far braver. [[1]], such moments are islands in an ocean of self-regard, and the current always drags us back out.`,
`The supporting characters fare worse still. The former lover, in particular, appears to have spent the twenty years since their parting waiting by the window for his return. The brother exists chiefly to be resentful, the former lover chiefly to be wistful, and the women of the village, without exception, to listen to Adrian. Not one of them is permitted an inner life that does not revolve around him. One suspects this is not a deliberate comment on male self-absorption, though it would make an excellent one.`,
`Marsh's admirers, of whom there are many, will no doubt find all this profound, and the novel will almost certainly appear on prize lists; juries have often confused length with ambition. Readers who prefer their profundity in smaller doses might be better served by rereading his early stories, written before he became convinced that every sentence he wrote deserved to be a monument.`
  ], q:[

      `De bijpersonages zijn beter uitgewerkt dan de hoofdpersoon.`],
      u:`Alle personages draaien om Adrian. Als dat de bedoeling was, zou het scherpe kritiek op mannelijke zelfingenomenheid zijn. Maar de recensent vermoedt dat het niet de bedoeling is: de schrijver is zelf zo. Dat "not a deliberate comment" sluit het tweede antwoord uit.` },
    { c:'z', v:`Wat raadt de recensent lezers aan die liever niet zoveel diepzinnigheid in één keer krijgen?`, o:[

      `de mooie passages opzoeken`,
      `wachten op een kortere uitgave`],

  T({ id:'v10', n:'vwo', soort:'Essay', kop:'Wish you weren\'t here', al:[
`Every summer, the same photographs circulate: crowds packed shoulder to shoulder on a medieval bridge, cruise ships towering over ancient harbours, residents holding banners that tell visitors, with varying degrees of politeness, to go home. Overtourism has become one of the defining complaints of our age, and it is easy to see why. In the most popular destinations, the very qualities that attract visitors are being worn away by their sheer number.`,
`The usual response is to blame the tourists themselves: the selfie-takers, the stag parties, the day-trippers who spend a few hours and a few euros before returning to their ship. There is something satisfying in this, not least because it allows each of us to believe that we are a traveller rather than a tourist, part of the solution rather than the problem. Unfortunately, the crowd does not distinguish between the two. Everyone who stands on the bridge is, by definition, part of it.`,
`A more honest analysis would look at the structures that channel visitors into a handful of places. Cheap flights, platforms that turn apartments into permanent holiday lets, and marketing campaigns that promote the same few landmarks all play their part. So do cities themselves, which for years measured success purely in visitor numbers and only belatedly discovered that a historic centre emptied of residents is not a city but a theme park. [[1]], the local bakery becomes a souvenir shop, the neighbours are replaced by suitcases, and the place that people came to see quietly ceases to exist.`,
`Some cities have begun to respond with entrance fees, limits on short-term rentals and bans on large cruise ships. These measures are controversial, and critics warn that they risk turning travel into a privilege of the wealthy. The objection deserves to be taken seriously. Still, the alternative, unlimited access until there is nothing left worth accessing, is hardly more democratic.`,
`Individual travellers are not powerless either, though the remedies are less glamorous than a boycott. Visiting outside the peak season, staying longer in fewer places and spending money in businesses owned by residents all reduce the pressure, as does the simple willingness to go somewhere that has not already been photographed a million times.`,
`Travel at its best broadens the mind; at its worst, it merely moves a crowd from one queue to another. The difference lies less in where we go than in how many of us go at once, and in whether the places we visit are allowed to remain places at all.`
  ], q:[

    { c:'z', cit:[`So do`], v:`Citeer de eerste twee woorden van de zin waarin de schrijver zegt dat steden pas laat ontdekten dat een centrum zonder bewoners geen echte stad meer is.`,
      u:`Alinea 3: "So do cities themselves, which for years measured success purely in visitor numbers and only belatedly discovered that a historic centre emptied of residents is not a city but a theme park."` }

  T({ id:'v11', n:'vwo', soort:'Opinion', kop:'Top of the league, but for what?', al:[
`Every autumn, a small industry publishes its verdict on the world's universities, and every autumn, university administrators study the results with an intensity usually reserved for election nights. A climb of three places is announced in triumphant press releases; a fall prompts anxious meetings and, occasionally, the departure of a senior official. Rarely does anyone stop to ask what, exactly, is being measured.`,
`The answer is less impressive than the confident league tables suggest. Rankings typically combine a handful of indicators, such as the number of research citations, the ratio of staff to students and the results of reputation surveys, and weight them according to formulas that their compilers devise. Change the weights and the order changes; and the choice of weights is, in the end, a matter of opinion dressed up as arithmetic.`,
`Reputation surveys deserve particular scepticism. Academics are asked to name the best institutions in their field, but few have any direct knowledge of more than a handful of universities. They tend, understandably, to name the ones that are already famous, which then remain famous partly because they are named. The result is a self-reinforcing loop in which last year's prestige becomes this year's evidence.`,
`More troubling than the flaws of the rankings is the behaviour they encourage. Because research output counts for more than teaching quality, which is notoriously hard to measure, universities have every incentive to reward academics for publishing papers rather than for teaching students well. [[1]], an indicator that was meant to describe reality ends up reshaping it, often in ways that serve the institution's position rather than its students.`,
`Defenders reply that rankings, for all their faults, give students and their families some guidance in a confusing market, especially those who cannot visit universities abroad. That is a fair point, and it explains why the rankings will not disappear. But guidance is only useful if it points in the right direction. A prospective student wants to know whether she will be well taught, supported and prepared for her future; on these questions, most rankings have remarkably little to say.`,
`Several universities have already announced that they will no longer supply data to some of the best-known tables. Their critics accuse them of sour grapes. Perhaps. But if the rankings cannot survive the absence of the institutions they claim to judge, that tells us something about how much they were ever really worth.`
  ], q:[

  T({ id:'v12', n:'vwo', soort:'Article', kop:'The pill with nothing in it', al:[
`For most of the history of modern medicine, the placebo effect was regarded as something of an embarrassment. A patient given a sugar pill who reported feeling better was assumed either to have been fooled or never to have been very ill in the first place. In clinical trials, the placebo group existed only to be beaten: a drug was worth something precisely to the extent that it outperformed nothing.`,
`That view has shifted considerably. Researchers now recognise that the placebo effect is not imaginary but involves measurable changes in the brain, including the release of the body's own painkilling substances. Its strength also depends, intriguingly, on context: in some experiments, people reported more relief from a pill they believed to be expensive than from an identical one they thought was cheap, and the ritual surrounding a treatment seems to matter almost as much as the treatment itself.`,
`Perhaps the most surprising finding concerns so-called open-label placebos. In a number of studies, patients with long-term complaints were told quite plainly that they were receiving pills containing no active ingredient, and many nevertheless reported a clear improvement in their symptoms. [[1]] deception, long assumed to be essential to the effect, may not be necessary at all.`,
`Enthusiasts have been quick to draw sweeping conclusions, and some caution is in order. Placebos appear to work mainly on symptoms that patients experience subjectively, such as pain, nausea and fatigue; they do not shrink tumours or cure infections. A patient who feels better is not necessarily a patient who is better, and there is a real danger that the fashion for "mind over matter" could lead some people to abandon treatments that actually work.`,
`The placebo's dark twin is equally instructive. The nocebo effect describes how negative expectations can produce real symptoms. In some trials, patients who were told in detail about the possible side effects of a drug were more likely to experience them, even when they had in fact been given a placebo. This presents doctors with a genuine dilemma: they are obliged to inform patients honestly, yet the way they do so may itself cause harm.`,
`What emerges from this research is less a miracle cure than a reminder. Medicine has long treated the patient's mind as a source of noise, something to be controlled for and then ignored. The placebo suggests that it is also part of the treatment, and that the words a doctor chooses may be among the most powerful instruments she has.`
  ], q:[

  T({ id:'v13', n:'vwo', soort:'Column', kop:'My house is smarter than me', al:[
`My house has become cleverer than I am, and it would like me to know it. It began innocently enough, with a speaker that could play music and tell me the weather. Then came the light bulbs that change colour according to my "mood", a thermostat that "learns my habits", and a doorbell with a camera that sends a notification to my phone every time a cat walks past. The fridge, I am told, will soon be able to order milk on its own initiative. Our home, the brochures promised, would become an extension of ourselves.`,
`The thermostat, for instance, has learned my habits with alarming thoroughness. It knows that I get up at seven, and it therefore warms the house at half past six. What it does not know is that on Saturdays I would like to stay in bed until nine, and every attempt to explain this has resulted in a negotiation that the thermostat appears to be winning. Last weekend it sent me a cheerful message congratulating me on "saving energy" during the hours I had spent shivering under the duvet in protest.`,
`The speaker, meanwhile, has developed the habit of answering questions nobody has asked. During a dinner party last month, it interrupted a heated discussion about politics to inform the table, in a tone of serene helpfulness, that it had not quite understood the request. It was the most sensible contribution of the evening. On another occasion it began playing a cheerful song about sunshine in the middle of my aunt's account of her hip operation.`,
`[[1]], all this convenience comes at a price that is rarely printed on the box. Each device collects information: when I come home, how long I sleep, what music I play when I am sad. Somewhere, in a data centre I will never see, there is presumably a more accurate portrait of my private life than any friend could provide. I agreed to this, of course. I clicked "accept" on terms and conditions longer than most novels, as one does, without reading a word.`,
`Friends tell me I could simply switch everything off. They are right, and occasionally I do. The silence is extraordinary: no beeps, no chirpy updates, no lights changing colour behind my back. But a strange thing happens when the house falls silent: I miss it. I have grown used to being reminded, monitored and congratulated. Perhaps that, more than any data collection, is what the manufacturers were really selling: not a smarter home, but an owner who can no longer imagine living without one.`

  T({ id:'v14', n:'vwo', soort:'Essay', kop:'Sorry if you were offended', al:[
`It has become one of the most familiar rituals of public life. A politician, a celebrity or the head of a large company is caught saying or doing something offensive. A day or two of outrage follows. Then comes the statement, usually released late on a Friday afternoon: "I am sorry if anyone was offended by my remarks." The wording varies slightly from case to case, but the structure is so predictable that one could almost write it in advance.`,
`Linguists have a name for this formula: the non-apology. It has the outward shape of an apology, and it contains the word "sorry", but it quietly transfers responsibility from the speaker to the listener. The problem, it implies, is not what was said but the regrettable sensitivity of those who heard it. One is sorry, in other words, not for the offence but for the offence taken.`,
`[[1]] its popularity, the non-apology rarely achieves its aim. Audiences have become remarkably skilled at recognising it, and a defective apology often generates a second wave of criticism larger than the first. Commentators dissect every word of the statement, and the conditional "if" tends to become the headline. The original remark is forgotten; the evasive response is remembered. It is worth asking, then, why so many advisers still recommend it.`,
`Part of the answer is legal. A full admission of wrongdoing may be used against the person or organisation in court, and lawyers understandably prefer language that concedes as little as possible. But part of it is psychological. A genuine apology is an act of voluntary humiliation: it requires the speaker to say, without qualification, "I was wrong", and to accept whatever consequences follow. For people accustomed to power and admiration, that can feel like an intolerable loss of face.`,
`The irony is that research on apologies suggests this fear is largely misplaced. Studies in fields ranging from medicine to business have found that a sincere apology, one that names the specific wrong, accepts responsibility and offers some form of repair, often reduces anger considerably and can even restore trust. Patients who receive a frank apology after a medical error, for instance, have in some studies proved less likely to take legal action.`,
`A good apology, in short, is not a sign of weakness but an exercise of strength, and not only a moral act but frequently a practical one. That so few public figures manage it says less about the difficulty of the words than about the difficulty of meaning them.`

  T({ id:'v15', n:'vwo', soort:'Opinion', kop:'Whose treasures?', al:[
`Walk through the great museums of Europe and you will encounter, in glass case after glass case, objects that did not arrive there by accident. Some were bought, some exchanged and some given as gifts. But a substantial number were taken during the colonial period by soldiers, officials and collectors who rarely asked anyone's permission. The question of whether such objects should be returned has moved, in barely two decades, from the margins of academic debate to the centre of public life.`,
`The most notorious example is that of the Benin Bronzes, thousands of sculptures and plaques taken by British troops when they looted the royal palace of Benin City in 1897. Dispersed among museums and private collections across Europe and North America, they have become a symbol of the entire debate. Several institutions have since returned pieces, and in 2022 Germany transferred ownership of the bronzes in its public collections to Nigeria.`,
`Opponents of restitution have traditionally advanced two arguments. The first is that the objects are better preserved and more widely seen in major Western museums than they would be elsewhere. The second is that these "universal museums" allow visitors to compare the cultures of the world under one roof, a purpose that would be undermined if every object were sent back to its country of origin.`,
`Neither argument has aged well. The first rests on an assumption, that institutions in Africa or Asia cannot be trusted with their own heritage, which is both condescending and, in many cases, simply untrue. The second is more appealing but sidesteps the essential point: a museum's educational mission, however admirable, does not confer ownership of stolen goods. [[1]], a library would hardly be entitled to keep a stolen manuscript on the grounds that more people could read it there.`,
`That said, restitution is not always as simple as its advocates suggest. Establishing the history of an object can take years of research, and in some cases it is genuinely unclear whether a piece was taken by force or legitimately acquired. There are also questions about to whom an object should be returned: a national government, a royal family, a particular community? These are real difficulties. They are not, however, reasons for doing nothing.`,
`What is ultimately at stake is not a collection of objects but a relationship. Returning a stolen sculpture cannot undo the violence through which it was taken. It can, however, signal that the institutions which have benefited from that violence are prepared to see it for what it was, and that is where any honest conversation about the past has to begin.`

  /* ================= het tekstvak ================= */
  /* het gemarkeerde stuk: de woorden tussen aanhalingstekens in de vraag, als ze letterlijk in de tekst staan */
  function markeer(q){
    if (q.m !== undefined) return q.m; var m = /"([^"]{6,})"/.exec(q.v || ''); return m ? m[1] : null;
  }
  function tekstvak(t, mark, gat){
    var gemarkeerd = false;
    var alineas = t.al.map(function(p, i){
      var h = S(p).replace(/\[\[(\d+)\]\]/g, function(a, n){ return '<span class="gat' + (gat == n ? ' ws' : '') + '" aria-label="gat ' + n + '">' + n + '</span>'; });
      if (mark && !gemarkeerd){
        var sm = S(mark), j = h.indexOf(sm);
        if (j >= 0){ h = h.slice(0, j) + '<mark class="ws">' + sm + '</mark>' + h.slice(j + sm.length); gemarkeerd = true; }
      }
      return '<div class="al"><span class="alnr" aria-label="alinea ' + (i + 1) + '">' + (i + 1) + '</span><p>' + h + '</p></div>';
    }).join('');
    /* tabindex en een naam: met het toetsenbord kun je in het vak scrollen, een schermlezer noemt het "de tekst" */
    return '<article class="leestekst" tabindex="0" role="region" aria-label="De tekst: ' + S(t.kop) + '" lang="en">' +
      '<span class="soort">' + S(t.soort) + '</span><h3>' + S(t.kop) + '</h3>' + alineas + '</article>';
  }
  /* na het tekenen: past de tekst niet, dan staat eronder dat hij verdergaat, en een gemarkeerde zin schuift in beeld */
  function tekstInBeeld(){
    var t = document.querySelector('#beeld .leestekst'); if (!t) return;
    var ws = t.querySelector('.ws');
    if (ws && ws.offsetTop + ws.offsetHeight > t.clientHeight - 10) t.scrollTop = Math.max(0, ws.offsetTop - t.clientHeight / 3);
    if (t.scrollHeight <= t.clientHeight + 4) return;
    var meer = document.createElement('p'); meer.className = 'meertekst'; meer.setAttribute('aria-hidden', 'true');
    meer.textContent = 'De tekst gaat verder: scroll in het tekstvak.';
    t.parentNode.insertBefore(meer, t.nextSibling);
    function kijk(){ meer.style.visibility = t.scrollTop + t.clientHeight >= t.scrollHeight - 6 ? 'hidden' : ''; }
    t.addEventListener('scroll', kijk, { passive:true }); kijk();
  }

  /* ================= kiezen: een tekst, en dan zijn vragen op een rij ================= */
  /* Een examentekst lees je één keer en dan beantwoord je er meerdere vragen over. Dus: een tekst kiezen
     en daarvan de vragen geven die bij het gekozen onderdeel horen; zijn die op, dan een volgende tekst.
     Wat gesteld is, komt pas terug als alle vragen van dat niveau geweest zijn. */
  var gebruikt = {}, nu = null;
  function open(t, c){ return t.q.filter(function(q){ return !gebruikt[q.k] && (!c || q.c === c); }); }
  function pak(niveau, c){
    if (nu && nu.c === c){ var rest = open(nu.t, c); if (rest.length) return { t:nu.t, q:rest[0] }; }
    var lijst = TEKSTEN.filter(function(t){ return t.n === niveau && open(t, c).length; });
    if (!lijst.length){
      TEKSTEN.forEach(function(t){ if (t.n === niveau) t.q.forEach(function(q){ if (!c || q.c === c) delete gebruikt[q.k]; }); });
      lijst = TEKSTEN.filter(function(t){ return t.n === niveau && open(t, c).length; });
    }
    /* liefst een tekst die nog helemaal nieuw is */
    var vers = lijst.filter(function(t){ return t.q.every(function(q){ return !gebruikt[q.k]; }); });
    var t = kies(vers.length ? vers : lijst);
    nu = { t:t, c:c };
    return { t:t, q:open(t, c)[0] };
  }

  /* ================= een opgave maken ================= */
  function maakOpgave(e){
    var t = e.t, q = e.q, d = DEEL[q.c];
    gebruikt[q.k] = 1;
    var basis = { onderdeel:'examreading: ' + d.id, onderdeelNaam:d.naam, sleutel:q.k, na:tekstInBeeld };
    if (q.gat){
      return Object.assign(basis, {
        vorm:'meerkeuze', vraag:'Welk woord of welke woorden passen in gat ' + q.gat + '?',
        opdracht:'Lees de zin vóór en na het gat: welk verband is er?',
        beeld:tekstvak(t, null, q.gat), opties:q.o.map(S), goed:0, uitleg:q.u, antwoordTekst:'(' + t.kop + ', gat ' + q.gat + ') ' + q.o[0]
      });
    }
    if (q.al){
      return Object.assign(basis, {
        vorm:'invul', vraag:S(q.v), opdracht:'Schrijf het nummer van de alinea op.', beeld:tekstvak(t),
        velden:[{ id:'al', label:'alinea', antwoord:q.al, tol:0 }], uitleg:q.u, antwoordTekst:'alinea ' + q.al
      });
    }
    if (q.cit){
      return Object.assign(basis, {
        vorm:'invul', vraag:S(q.v), opdracht:'Schrijf alleen de eerste twee woorden van die zin op, zoals ze in de tekst staan.', beeld:tekstvak(t),
        velden:[{ id:'cit', label:'eerste twee woorden', antwoord:q.cit, type:'tekst', breed:true }], uitleg:q.u, antwoordTekst:q.cit[0]
      });
    }
    if (q.wn){
      var kaarten = q.wn.map(function(w, i){ return { id:'s' + i, tekst:S(w[0]) }; });
      return Object.assign(basis, {
        vorm:'sleep', vraag:S(q.v), opdracht:WB ? '' : 'Zet elke bewering in het goede vak.',
        beeld:tekstvak(t), kaarten:kaarten,
        vakken:[
          { id:'wel', naam:'wel', uit:'staat in de tekst', hoort:q.wn.map(function(w, i){ return w[1] ? 's' + i : null; }).filter(Boolean) },
          { id:'niet', naam:'niet', uit:'staat er niet of anders', hoort:q.wn.map(function(w, i){ return w[1] ? null : 's' + i; }).filter(Boolean) } ],
        sleepuit:'Sleep elke bewering naar wel of niet. Op een telefoon: tik een bewering aan en dan het vak.',
        uitleg:q.u, antwoordTekst:'wel: ' + q.wn.filter(function(w){ return w[1]; }).map(function(w){ return w[0]; }).join(' / ') + '; niet: ' + q.wn.filter(function(w){ return !w[1]; }).map(function(w){ return w[0]; }).join(' / ')
      });
    }
    var mark = markeer(q);
    var opdracht = q.c === 'h' ? 'Kies het antwoord dat over de hele tekst gaat, niet over één alinea.'
      : q.c === 'v' ? 'Let op signaalwoorden en op wat de alinea doet in het geheel.'
      : q.c === 'b' ? (mark ? 'Het stuk staat gemarkeerd in de tekst. Lees ook de zinnen eromheen.' : 'Let op hoe de schrijver iets zegt, niet alleen op wat hij zegt.')
      : 'Zoek de plek in de tekst waar het staat, en lees die precies.';
    return Object.assign(basis, {
      vorm:'meerkeuze', vraag:S(q.v), opdracht:opdracht, beeld:tekstvak(t, mark),
      opties:q.o.map(S), goed:0, uitleg:q.u, antwoordTekst:'(' + t.kop + ') ' + q.o[0]
    });
  }
