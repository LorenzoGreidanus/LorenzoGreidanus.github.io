<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script src="voorlezen.js"></script>
<script src="luisterspel.js"></script>
<script src="dictation-opgaven.js"></script>
<script>
(function(){
  'use strict';
  var S = VAKSPEL.schoon, D = window.DICTATION_OPGAVEN, TAAL = 'en-GB';
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  var NIV = { bb:1, kgt:2, hv:3 };
  function items(lijst, niveau){
    var n = NIV[niveau] || 2, uit = lijst.filter(function(x){ return x.n <= n; });
    if (uit.length < 12) uit = lijst.filter(function(x){ return x.n <= n + 1; });
    return uit.length ? uit : lijst;
  }
  function woorden(niveau){
    var it = kies(items(D.woorden, niveau));
    return LUISTER.opgave({ onderdeel:'dictation: woorden', onderdeelNaam:'woorden', taal:TAAL, sleutel:'w' + it.w,
      spreek: it.w + '. ' + it.zin, antwoord: it.w,
      vraag:'Luister en typ het <b>woord</b> dat je als eerste hoort.', opdracht:'Je hoort het woord, en dan een zin waarin het staat.',
      uitleg: it.w + ': ' + it.uit + '.', antwoordTekst: it.w });
  }
  /* don't en do not tellen allebei: de samentrekkingen naast elkaar */
  var SAMEN = [['do not', "don't"], ['does not', "doesn't"], ['did not', "didn't"], ['is not', "isn't"], ['are not', "aren't"], ['was not', "wasn't"], ['were not', "weren't"], ['have not', "haven't"], ['has not', "hasn't"], ['had not', "hadn't"], ['will not', "won't"], ['would not', "wouldn't"], ['cannot', "can't"], ['must not', "mustn't"], ['should not', "shouldn't"], ['I am', "I'm"], ['it is', "it's"], ['I have', "I've"], ['I will', "I'll"], ['I would', "I'd"], ['they are', "they're"], ['we are', "we're"], ['you are', "you're"], ['he is', "he's"], ['she is', "she's"], ['there is', "there's"], ['o’clock', "o'clock"]];
  function varianten(zin){
    var uit = [zin];
    SAMEN.forEach(function(p){
      uit.slice().forEach(function(z){
        var a = z.replace(new RegExp(p[0], 'gi'), p[1]), b = z.replace(new RegExp(p[1].replace(/'/g, "['’]"), 'gi'), p[0]);
        if (a !== z && uit.indexOf(a) < 0) uit.push(a);
        if (b !== z && uit.indexOf(b) < 0) uit.push(b);
      });
    });
    return uit;
  }
  function getallen(niveau){
    var it = kies(items(D.getallen, niveau));
    return LUISTER.opgave({ onderdeel:'dictation: getallen en tijden', onderdeelNaam:'getallen en tijden', taal:TAAL, sleutel:'g' + it.spreek,
      spreek: it.spreek, antwoord: it.antwoord,
      vraag:'Luister en typ het <b>in cijfers</b>: een getal, een tijd of een datum.', opdracht:'Bijvoorbeeld 13, 7:30 of 14 March. Voluit geschreven mag ook.',
      uitleg: it.uit + '.', antwoordTekst: it.antwoord[0] });
  }
  function paren(niveau){
    var it = kies(items(D.paren, niveau));
    return LUISTER.opgave({ onderdeel:'dictation: minimal pairs', onderdeelNaam:'woordparen', taal:TAAL, sleutel:'p' + it.w,
      spreek: it.zin, antwoord: it.w,
      vraag:'Luister naar de zin. Welk woord hoor je: <b>' + S(it.w) + '</b> of <b>' + S(it.ander) + '</b>? Typ het.', opdracht:'Twee woorden die bijna hetzelfde klinken; luister naar de klinker of de medeklinker.',
      uitleg: it.uit + '.', antwoordTekst: it.w });
  }
  var SOORTEN = { woorden: woorden, zinnen: function(n){ var it = kies(items(D.zinnen, n)); return LUISTER.opgave({ onderdeel:'dictation: zinnen', onderdeelNaam:'zinnen', taal:TAAL, sleutel:'z' + it.zin.slice(0, 24), spreek: it.zin, antwoord: varianten(it.zin), vraag:'Luister en typ de <b>hele zin</b>.', opdracht:'Hoofdletters en leestekens tellen niet mee; don’t en do not zijn allebei goed.', uitleg: it.uit + '.', antwoordTekst: it.zin }); }, getallen: getallen, paren: paren };
  VAKSPEL.maak({
    id:'dictation', naam:'Dictation', vak:'eng', kleur:'#204ECF',
    hand:'listen, then write it down',
    lead:'De computer leest Engels voor, jij typt wat je hoort. Lastige woorden als Wednesday en necessary, hele zinnen met de grammatica van je niveau, getallen en tijden in cijfers, en woorden die bijna hetzelfde klinken: ship of sheep. Bij een fout zie je letter voor letter waar het misging.',
    hoe:[
      { kop:'Luister goed', tekst:'Je hoort het woord of de zin, hoogstens drie keer, net als bij een luistertoets. Zo oefen je echt luisteren in plaats van raden. Typ wat je hoort.' },
      { kop:'Nakijken met verschil', tekst:'Fout? Dan staat de goede spelling ernaast: <b>doorgestreept</b> wat te veel was, groen wat er hoort.' },
      { kop:'De regel erbij', tekst:'Na elk antwoord staat de regel of het verschil in het Nederlands: i before e except after c, thirteen of thirty.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb (A1-A2)', uit:'Korte zinnen, veelgebruikte woorden, hele en halve uren.' },
        { id:'kgt', naam:'vmbo-kgt en tl (A2)', uit:'Ook verleden tijd, going to, data en honderdtallen.' },
        { id:'hv', naam:'havo en vwo (B1)', uit:'Present perfect, conditionals, passief, lastige spelling en grote getallen.' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' }, { id:'woorden', naam:'woorden' }, { id:'zinnen', naam:'zinnen' }, { id:'getallen', naam:'getallen en tijden' }, { id:'paren', naam:'woordparen', uit:'Twee woorden die bijna hetzelfde klinken, zoals ship en sheep.' } ] }
    ],
    aantal:10,
    maak:function(keuze, nr){
      var soort = keuze.soort === 'alles' ? kies(['woorden', 'woorden', 'zinnen', 'zinnen', 'getallen', 'paren']) : keuze.soort;
      return SOORTEN[soort](keuze.niveau);
    },
    uitleg:{ doel:'Engels verstaan en goed opschrijven: woorden, zinnen, getallen en tijden.', tijd:'tien woorden of zinnen per ronde', bediening:'Druk op Luister (of hij leest vanzelf voor), typ wat je hoort en druk op Nakijken of Enter. Nog eens luisteren kan twee keer.' },
    tutorial:[
      { titel:'Luister', tekst:'De computer leest het Engels voor. Hoor je het niet goed, dan kun je nog twee keer op Nog eens drukken.', doel:'luisterBtn' },
      { titel:'Typ wat je hoort', tekst:'Typ het in het vak en druk op Enter of Nakijken. Hoofdletters en leestekens tellen niet mee.', doel:'luisterInvoer' },
      { titel:'Leer van het verschil', tekst:'Bij een fout zie je precies welke letters anders moesten, en de uitleg erbij in het Nederlands.', doel:'balk' }
    ]
  });
})();
</script>
