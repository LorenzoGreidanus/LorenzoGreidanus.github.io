<style>
/* De grafiek is smal getekend (340 breed), zodat de tekst op een telefoon van 375 breed minstens
   11 pixels blijft. De vraaglijn heeft de nadrukkleur (in donker lichter blauw), de aanbodlijn oranje;
   de tekst bij de aanbodlijn is in licht een donkerder oranje, anders is hij te zwak op wit. */
:root{--aanbodinkt:#B83D20}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--aanbodinkt:#F26749}}
:root[data-theme="dark"]{--aanbodinkt:#F26749}
.va{width:min(100%,420px);height:auto;display:block;font-family:inherit}
.va text{fill:var(--muted);font-size:13px;font-weight:600}
.va .as{stroke:var(--ink);stroke-width:2}
.va .rooster{stroke:var(--rand2);stroke-width:1}
.va .vraag{stroke:var(--nadruk);stroke-width:3;fill:none}
.va .aanbod{stroke:#F26749;stroke-width:3;fill:none}
.va .vraag.oud,.va .aanbod.oud{stroke-dasharray:6 5;opacity:.45}
.va .ev{fill:var(--goed);stroke:var(--kaart);stroke-width:2}
.va .hulp{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.va .prijslijn{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:2 3}
.va .stipV{fill:var(--nadruk)}.va .stipA{fill:#F26749}
.va .naam{font-size:14px}
.va .as-naam{fill:var(--ink)}
.va .naamV{fill:var(--nadruk)}.va .naamA{fill:var(--aanbodinkt)}
body.groot .va{width:min(100%,560px)}
/* de punten van de lijnen als tabel, alleen voor een schermlezer */
.sr-tabel{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap;border:0}
.schuif{display:grid;gap:6px;justify-items:center;margin-top:10px}
.schuif input[type=range]{width:min(100%,360px);min-height:44px;accent-color:var(--nadruk)}
.schuif .stand{font-weight:600;text-align:center}
.schuif .stand b{color:var(--nadruk)}
/* overschot in een donker oranje (in donker amber), zodat het ook op wit genoeg contrast heeft */
.schuif .stand .tekort{color:var(--fout)}.schuif .stand .over{color:#8a5a12}.schuif .stand .ev{color:var(--goed)}
:root[data-theme="dark"] .schuif .stand .over{color:var(--amber)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .schuif .stand .over{color:var(--amber)}}
</style>
<script src="/vangnet.js" defer></script>

<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script src="vraagenaanbod-opgaven.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function tussen(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function geld(x){ return '€ ' + (Math.round(x * 100) / 100).toFixed(2).replace('.', ','); }

  /* Een markt: prijzen van 0 tot 10 euro in stappen, hoeveelheden van 0 tot
     100. De vraaglijn daalt, de aanbodlijn stijgt; het evenwicht ligt netjes
     op een roosterpunt. q = a - b*p (vraag), q = c + d*p (aanbod). */
  var PRODUCTEN = ['ijsjes', 'broodjes', 'concertkaartjes', 'tweedehands fietsen', 'aardbeien', 'flesjes water', 'T-shirts', 'schoolagenda’s'];
  function markt(niveau){
    var pe = niveau === 'bb' ? kies([2, 3, 4, 5, 6, 7]) : kies([2, 3, 4, 5, 6, 7, 8]), qe = kies([20, 30, 40, 50, 60, 70]);
    var b = niveau === 'bb' ? 10 : kies([5, 10, 10, 15]), d = niveau === 'bb' ? 10 : kies([5, 10, 10, 15]);
    /* door het evenwicht: a = qe + b*pe, c = qe - d*pe; c mag niet onder 0 op de as komen: dan begint het aanbod bij een prijs boven 0 (prima) */
    var a = qe + b * pe, c = qe - d * pe;
    if (a > 100) return markt(niveau);
    return { pe:pe, qe:qe, a:a, b:b, c:c, d:d, product: kies(PRODUCTEN) };
  }
  function vraag(m, p){ return Math.max(0, m.a - m.b * p); }
  function aanbod(m, p){ return Math.max(0, m.c + m.d * p); }
  /* de grafiek: prijs verticaal (0-10), hoeveelheid horizontaal (0-100) */
  /* 340 breed getekend, zodat de tekst op een telefoon minstens 11 pixels blijft; de hoeveelheid staat per 20 onder de as, het rooster per 10 */
  function grafiek(m, o){
    o = o || {};
    var W = 340, Hh = 282, L = 46, R = 328, T = 34, B = 242;
    function X(q){ return L + (R - L) * q / 100; } function Y(p){ return B - (B - T) * p / 10; }
    var wat = 'Grafiek van vraag en aanbod' + (m.product ? ' voor ' + m.product : '') + ', met de prijs van 0 tot 10 euro omhoog en de hoeveelheid van 0 tot 100 naar rechts. De vraaglijn daalt, de aanbodlijn stijgt.' +
      (o.evenwicht ? ' Het snijpunt is met een stip aangegeven.' : '') + (o.prijs !== undefined ? ' Een stippellijn staat bij een prijs van ' + geld(o.prijs) + '.' : '') + (o.oud ? ' Gestippeld de oude lijnen, doorgetrokken de nieuwe.' : '');
    var s = '<svg class="va" viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="' + S(wat) + (o.tabel ? ' De punten staan in de tabel hierna.' : '') + '">';
    for (var q = 0; q <= 100; q += 10) s += '<line class="rooster" x1="' + X(q) + '" y1="' + T + '" x2="' + X(q) + '" y2="' + B + '"/>' + (q % 20 ? '' : '<text x="' + X(q) + '" y="' + (B + 17) + '" text-anchor="middle">' + q + '</text>');
    for (var p = 0; p <= 10; p++) s += '<line class="rooster" x1="' + L + '" y1="' + Y(p) + '" x2="' + R + '" y2="' + Y(p) + '"/><text x="' + (L - 6) + '" y="' + (Y(p) + 4.5) + '" text-anchor="end">€ ' + p + '</text>';
    s += '<line class="as" x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + B + '"/><line class="as" x1="' + L + '" y1="' + B + '" x2="' + R + '" y2="' + B + '"/>';
    s += '<text class="as-naam" x="' + R + '" y="' + (B + 35) + '" text-anchor="end">hoeveelheid</text><text class="as-naam" x="4" y="' + (T - 18) + '">prijs</text>';
    function lijn(f, klas, naam){
      var pts = [];
      for (var pp = 0; pp <= 10; pp += 0.5){ var qq = f(pp); if (qq >= 0 && qq <= 100) pts.push([X(qq), Y(pp)]); }
      if (pts.length < 2) return '';
      /* de naam bij het eind van de lijn; past hij er rechts niet meer naast, dan links ervan */
      var laatst = pts[pts.length - 1], nx = laatst[0] + 6, anker = 'start', ny = laatst[1] - 6;
      if (nx + 56 > W){ nx = laatst[0] - 6; anker = 'end'; }
      if (ny < 14) ny = laatst[1] + 18;
      return '<polyline class="' + klas + '" points="' + pts.map(function(x){ return x[0].toFixed(1) + ',' + x[1].toFixed(1); }).join(' ') + '"/>' + (naam ? '<text class="naam ' + (klas.indexOf('vraag') >= 0 ? 'naamV' : 'naamA') + '" x="' + nx.toFixed(1) + '" y="' + ny.toFixed(1) + '" text-anchor="' + anker + '">' + naam + '</text>' : '');
    }
    if (o.oud){ s += lijn(function(p){ return vraag(o.oud, p); }, 'vraag oud', '') + lijn(function(p){ return aanbod(o.oud, p); }, 'aanbod oud', ''); }
    s += lijn(function(p){ return vraag(m, p); }, 'vraag', 'vraag') + lijn(function(p){ return aanbod(m, p); }, 'aanbod', 'aanbod');
    if (o.evenwicht) s += '<line class="hulp" x1="' + L + '" y1="' + Y(m.pe) + '" x2="' + X(m.qe) + '" y2="' + Y(m.pe) + '"/><line class="hulp" x1="' + X(m.qe) + '" y1="' + Y(m.pe) + '" x2="' + X(m.qe) + '" y2="' + B + '"/><circle class="ev" cx="' + X(m.qe) + '" cy="' + Y(m.pe) + '" r="7"/>';
    if (o.prijs !== undefined){
      var qv = vraag(m, o.prijs), qa = aanbod(m, o.prijs);
      s += '<line class="prijslijn" x1="' + L + '" y1="' + Y(o.prijs) + '" x2="' + R + '" y2="' + Y(o.prijs) + '"/><circle class="stipV" cx="' + X(qv) + '" cy="' + Y(o.prijs) + '" r="6"/><circle class="stipA" cx="' + X(qa) + '" cy="' + Y(o.prijs) + '" r="6"/>';
    }
    return s + '</svg>';
  }
  /* de grafiek met daarna dezelfde punten als tabel: onzichtbaar, maar een schermlezer kan zo aflezen wat je in de grafiek ziet.
     De tabel staat na de svg, zodat de lijst met missers alleen de svg meeneemt. */
  function beeldMet(m, o){
    o = Object.assign({ tabel:true }, o || {});
    function n(q){ return q > 100 ? 'meer dan 100' : String(Math.round(q)); }
    var rijen = [];
    for (var p = 0; p <= 10; p++) rijen.push('<tr><th scope="row">' + geld(p) + '</th><td>' + n(vraag(m, p)) + '</td><td>' + n(aanbod(m, p)) + '</td></tr>');
    return grafiek(m, o) + '<div class="sr-tabel"><table><caption>Vraag en aanbod' + (m.product ? ' voor ' + S(m.product) : '') + ' bij elke prijs, in stuks</caption>' +
      '<tr><th scope="col">prijs</th><th scope="col">vraag</th><th scope="col">aanbod</th></tr>' + rijen.join('') + '</table></div>';
  }

  /* 1. evenwicht aflezen */
  function evenwicht(niveau){
    var m = markt(niveau);
    if (niveau === 'bb'){
      var opties = H([m.pe].concat(H([1, 2, 3, 4, 5, 6, 7, 8].filter(function(p){ return p !== m.pe; })).slice(0, 3)));
      return { onderdeel:'vraag en aanbod: evenwicht', onderdeelNaam:'evenwicht', vorm:'meerkeuze', sleutel:'e' + m.pe + m.qe + m.product,
        vraag:'De markt voor <b>' + m.product + '</b>. Wat is de <b>evenwichtsprijs</b>?', opdracht:'De evenwichtsprijs is de prijs waar de vraaglijn en de aanbodlijn elkaar snijden.', beeld: beeldMet(m, {}),
        opties: opties.map(function(p){ return geld(p); }), goed: opties.indexOf(m.pe),
        uitleg:'De lijnen snijden elkaar bij ' + geld(m.pe) + ' en ' + m.qe + ' stuks: daar is de gevraagde hoeveelheid gelijk aan de aangeboden hoeveelheid.', antwoordTekst: geld(m.pe) };
    }
    return { onderdeel:'vraag en aanbod: evenwicht', onderdeelNaam:'evenwicht', vorm:'invul', sleutel:'e' + m.pe + m.qe + m.product,
      vraag:'De markt voor <b>' + m.product + '</b>. Lees de <b>evenwichtsprijs</b> en de <b>evenwichtshoeveelheid</b> af.', opdracht:'Het snijpunt van de vraaglijn (blauw) en de aanbodlijn (oranje).', beeld: beeldMet(m, {}),
      velden:[{ label:'evenwichtsprijs', voor:'€', antwoord:m.pe, tol:0.01 }, { label:'evenwichtshoeveelheid', antwoord:m.qe, tol:0.5, eenheid:'stuks' }],
      uitleg:'Bij ' + geld(m.pe) + ' is de vraag ' + m.qe + ' en het aanbod ' + m.qe + ': gelijk, dus evenwicht. Bij een hogere prijs is het aanbod groter dan de vraag; bij een lagere prijs andersom.', antwoordTekst: geld(m.pe) + ', ' + m.qe + ' stuks' };
  }
  /* 2. schuiven: de prijs instellen tot vraag en aanbod gelijk zijn (eigen vorm) */
  function schuiven(niveau){
    var m = markt(niveau), stap = 0.5;
    return { onderdeel:'vraag en aanbod: schuiven', onderdeelNaam:'evenwicht zoeken met de schuif', vorm:'eigen', sleutel:'s' + m.pe + m.qe + m.b + m.d,
      vraag:'Markt voor <b>' + m.product + '</b>. Zet de prijs met de schuif op de <b>evenwichtsprijs</b>.', opdracht:'Bij elke prijs zie je hoeveel er gevraagd (blauw) en aangeboden (oranje) wordt. Zoek de prijs waar dat gelijk is.',
      uitleg:'Bij ' + geld(m.pe) + ' zijn vraag en aanbod allebei ' + m.qe + '. Daarboven is er een overschot (aanbod groter dan vraag), daaronder een tekort.', antwoordTekst: geld(m.pe),
      teken:function(el, api){
        var prijs = m.pe > 5 ? 2 : 8;
        /* de stand onder de schuif wordt voorgelezen: zo hoort een schermlezer bij elke prijs de vraag en het aanbod */
        el.innerHTML = '<div id="grafiekvak">' + grafiek(m, { prijs:prijs }) + '</div><div class="schuif"><input type="range" id="prijsSchuif" min="0" max="10" step="' + stap + '" value="' + prijs + '" aria-label="prijs" aria-describedby="stand"><p class="stand" id="stand" aria-live="polite"></p></div>';
        var sch = el.querySelector('#prijsSchuif'), stand = el.querySelector('#stand'), gv = el.querySelector('#grafiekvak'), bewogen = false;
        function toon(){
          prijs = parseFloat(sch.value); var qv = vraag(m, prijs), qa = aanbod(m, prijs);
          sch.setAttribute('aria-valuetext', geld(prijs));
          gv.innerHTML = grafiek(m, { prijs:prijs });
          stand.innerHTML = 'prijs <b>' + geld(prijs) + '</b>: vraag ' + Math.round(qv) + ', aanbod ' + Math.round(qa) + ' → ' + (qv > qa ? '<span class="tekort">tekort van ' + Math.round(qv - qa) + '</span>' : qa > qv ? '<span class="over">overschot van ' + Math.round(qa - qv) + '</span>' : '<span class="ev">evenwicht</span>');
        }
        sch.addEventListener('input', function(){ bewogen = true; toon(); }); toon();
        var knop = api.knop('Nakijken', function(){
          /* nog niet geschoven is geen fout antwoord: eerst de prijs zoeken */
          if (!bewogen){ api.uit('Schuif eerst de prijs naar de plek waar vraag en aanbod gelijk zijn.'); sch.focus(); return; }
          var ok = Math.abs(prijs - m.pe) < 0.01; sch.disabled = true; knop.disabled = true;
          api.klaar(ok, ok ? '' : 'Je zette de prijs op ' + geld(prijs) + '; het evenwicht ligt bij ' + geld(m.pe) + '.');
        });
        el.proef = function(){ sch.value = m.pe; bewogen = true; toon(); knop.click(); };
        el.proefFout = function(){ sch.value = m.pe > 5 ? 1 : 9; bewogen = true; toon(); knop.click(); };
      } };
  }
  /* 3. wat gebeurt er: een gebeurtenis verschuift een lijn */
  var D = window.VRAAGAANBOD_DATA, GEBEURTENISSEN = D.GEBEURTENISSEN; /* in vraagenaanbod-opgaven.js */
  function gebeurt(niveau){
    var g = kies(GEBEURTENISSEN), m = markt(niveau); m.product = g.product;
    var nieuw = Object.assign({}, m); var schuif = 15;
    if (g.lijn === 'vraag') nieuw.a = m.a + (g.kant === 'rechts' ? schuif : -schuif); else nieuw.c = m.c + (g.kant === 'rechts' ? schuif : -schuif);
    var opties = ['de vraaglijn schuift naar rechts', 'de vraaglijn schuift naar links', 'de aanbodlijn schuift naar rechts', 'de aanbodlijn schuift naar links'];
    var goed = 'de ' + g.lijn + 'lijn schuift naar ' + g.kant;
    return { onderdeel:'vraag en aanbod: verschuiven', onderdeelNaam:'een lijn verschuift', vorm:'meerkeuze', vasteVolgorde:true, sleutel:'g' + g.t,
      vraag:S(g.t) + ' Wat gebeurt er op de markt voor <b>' + g.product + '</b>?', opdracht:'Verandert er iets bij de kopers (vraag) of bij de verkopers (aanbod)? En wordt het meer of minder?',
      beeld: beeldMet(m, { evenwicht:true }), opties: opties, goed: opties.indexOf(goed),
      uitleg: g.uit + ' Gestippeld de oude lijn, doorgetrokken de nieuwe: ' + '<div style="margin-top:8px">' + grafiek(nieuw, { oud:m, evenwicht:false }) + '</div>', antwoordTekst: goed };
  }
  /* 4. tekort of overschot bij een prijs */
  function tekort(niveau){
    var m = markt(niveau), p = m.pe + kies([-2, -1, 1, 2]); if (p < 1) p = m.pe + 1; if (p > 9) p = m.pe - 1;
    var qv = vraag(m, p), qa = aanbod(m, p), over = qa > qv, verschil = Math.abs(qa - qv);
    if (niveau === 'bb'){
      var opties = ['een tekort: er wordt meer gevraagd dan aangeboden', 'een overschot: er wordt meer aangeboden dan gevraagd', 'evenwicht: vraag en aanbod zijn gelijk'];
      return { onderdeel:'vraag en aanbod: tekort en overschot', onderdeelNaam:'tekort en overschot', vorm:'meerkeuze', vasteVolgorde:true, sleutel:'t' + m.pe + p + m.product,
        vraag:'De prijs van <b>' + m.product + '</b> is <b>' + geld(p) + '</b>. Wat is er op de markt?', opdracht:'Kijk bij die prijs: welke lijn ligt verder naar rechts?', beeld: beeldMet(m, { prijs:p }),
        opties: opties, goed: over ? 1 : 0,
        uitleg:'Bij ' + geld(p) + ' is de vraag ' + Math.round(qv) + ' en het aanbod ' + Math.round(qa) + '. ' + (over ? 'Er is een overschot van ' + Math.round(verschil) + ': de prijs is te hoog en zal dalen.' : 'Er is een tekort van ' + Math.round(verschil) + ': de prijs is te laag en zal stijgen.'), antwoordTekst: opties[over ? 1 : 0] };
    }
    return { onderdeel:'vraag en aanbod: tekort en overschot', onderdeelNaam:'tekort en overschot', vorm:'invul', sleutel:'t' + m.pe + p + m.product,
      vraag:'De prijs van <b>' + m.product + '</b> is <b>' + geld(p) + '</b>. Hoe groot is het ' + (over ? 'overschot' : 'tekort') + '?', opdracht:'Lees bij die prijs de gevraagde en de aangeboden hoeveelheid af en neem het verschil.', beeld: beeldMet(m, { prijs:p }),
      velden:[{ label: over ? 'overschot' : 'tekort', antwoord: verschil, tol:1, eenheid:'stuks' }],
      uitleg:'Bij ' + geld(p) + ': vraag ' + Math.round(qv) + ', aanbod ' + Math.round(qa) + '. Het verschil is ' + Math.round(verschil) + '. ' + (over ? 'Aanbod groter dan vraag: overschot, de prijs daalt richting ' + geld(m.pe) + '.' : 'Vraag groter dan aanbod: tekort, de prijs stijgt richting ' + geld(m.pe) + '.'), antwoordTekst: Math.round(verschil) + ' stuks' };
  }
  /* 5. begrippen */
  var BEGRIPPEN = D.BEGRIPPEN; /* in vraagenaanbod-opgaven.js */
  function begrippen(niveau){
    var lijst = BEGRIPPEN.filter(function(b){ return !b.hv || niveau === 'hv'; }), b = kies(lijst), m = markt(niveau);
    var anderen = H(lijst.filter(function(x){ return x !== b; })).slice(0, 3), opties = H([b].concat(anderen)).map(function(x){ return x.b; });
    return { onderdeel:'vraag en aanbod: begrippen', onderdeelNaam:'begrippen', vorm:'meerkeuze', sleutel:'b' + b.b,
      vraag:'Welk begrip hoort bij: <b>' + b.u + '</b>?', beeld: beeldMet(m, { evenwicht:true }), opties: opties, goed: opties.indexOf(b.b),
      uitleg: b.b.charAt(0).toUpperCase() + b.b.slice(1) + ': ' + b.u + '.', antwoordTekst: b.b };
  }

  var SOORTEN = { evenwicht: evenwicht, schuiven: schuiven, gebeurt: gebeurt, tekort: tekort, begrippen: begrippen };
  VAKSPEL.maak({
    id:'vraagenaanbod', naam:'Vraag en aanbod', vak:'eco', kleur:'#EA9836',
    hand:'waar de lijnen elkaar kruisen',
    lead:'Een markt in een grafiek: de vraaglijn daalt, de aanbodlijn stijgt, en waar ze elkaar snijden ligt de evenwichtsprijs. Je leest het evenwicht af, zoekt het met een schuif, ziet welke lijn verschuift bij een gebeurtenis en rekent tekorten en overschotten uit.',
    hoe:[
      { kop:'De twee lijnen', tekst:'<b>Vraag</b> (blauw): hoe lager de prijs, hoe meer mensen willen kopen. <b>Aanbod</b> (oranje): hoe hoger de prijs, hoe meer verkopers willen verkopen.' },
      { kop:'Evenwicht', tekst:'Op het snijpunt zijn vraag en aanbod gelijk. Is de prijs hoger, dan blijft er over (overschot); lager, dan komen kopers tekort.' },
      { kop:'Verschuiven', tekst:'Verandert er iets bij de kopers, dan schuift de vraaglijn; bij de verkopers de aanbodlijn. Naar rechts is meer, naar links is minder.' }
    ],
    keuzes:[
