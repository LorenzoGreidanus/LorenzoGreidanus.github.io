<style>
.pir{width:min(100%,520px);height:auto;display:block;font-family:inherit}
.pir text{fill:var(--muted);font-size:11px;font-weight:600}
.pir .kop{fill:var(--ink);font-size:13px}
.pir .man{fill:#204ECF;fill-opacity:.85}
.pir .vrouw{fill:#F26749;fill-opacity:.85}
.pir .man.licht,.pir .vrouw.licht{fill-opacity:.25}
.pir .as{stroke:var(--muted);stroke-width:1}
.pir .mid{stroke:var(--ink);stroke-width:1.5}
.twee{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.twee .pir{width:min(100%,300px)}
.dtm{width:min(100%,420px);height:auto;display:block;font-family:inherit}
.dtm text{fill:var(--muted);font-size:11px;font-weight:600}
.dtm .lijn{fill:none;stroke-width:2.5}
.dtm .geb{stroke:#204ECF}.dtm .ster{stroke:#F26749}
.dtm .fase{fill:var(--muted);font-size:12px}

<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script src="bevolkingspiramide-opgaven.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon, P = window.PIRAMIDES, GR = window.PIRAMIDE_GROEPEN;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function net(x){ return String(Math.round(x * 10) / 10).replace('.', ','); }
  var SOORTNAAM = { groei:'groeiende bevolking (piramide)', stabiel:'stabiele bevolking (klok)', krimp:'krimpende, vergrijzende bevolking (urn)' };

  /* de piramide: links mannen, rechts vrouwen, per groep van tien jaar; licht: welke groepen oplichten */
  function piramide(l, o){
    o = o || {};
    var W = 560, Hh = 250, mid = 270, top = 28, rh = 19, sch = 15; /* 1% = 18 px */
    var s = '<svg class="pir" viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="bevolkingspiramide' + (o.naam ? ' van ' + S(l.land) : '') + '">';
    s += '<text class="kop" x="' + mid + '" y="16" text-anchor="middle">' + (o.naam ? S(l.land) : 'bevolking, in procenten per groep') + '</text>';
    s += '<text x="' + (mid - 150) + '" y="' + (top - 4) + '" text-anchor="middle" style="fill:#204ECF">mannen</text><text x="' + (mid + 150) + '" y="' + (top - 4) + '" text-anchor="middle" style="fill:#F26749">vrouwen</text>';
    for (var i = 0; i < 10; i++){
      var y = top + (9 - i) * rh, licht = o.licht && o.licht.indexOf(i) < 0 ? ' licht' : '';
      s += '<rect class="man' + licht + '" x="' + (mid - l.m[i] * sch) + '" y="' + y + '" width="' + (l.m[i] * sch) + '" height="' + (rh - 2) + '"/>';
      s += '<rect class="vrouw' + licht + '" x="' + mid + '" y="' + y + '" width="' + (l.v[i] * sch) + '" height="' + (rh - 2) + '"/>';
      s += '<text x="' + (mid - l.m[i] * sch - 4) + '" y="' + (y + 13) + '" text-anchor="end">' + net(l.m[i]) + '</text><text x="' + (mid + l.v[i] * sch + 4) + '" y="' + (y + 13) + '">' + net(l.v[i]) + '</text>';
      s += '<text x="' + (W - 6) + '" y="' + (y + 13) + '" text-anchor="end" style="fill:var(--ink)">' + GR[i] + '</text>';
    }
    s += '<line class="mid" x1="' + mid + '" y1="' + (top - 2) + '" x2="' + mid + '" y2="' + (top + 10 * rh) + '"/>';
    s += '<line class="as" x1="' + (mid - 11 * sch) + '" y1="' + (top + 10 * rh) + '" x2="' + (mid + 11 * sch) + '" y2="' + (top + 10 * rh) + '"/>';
    [10, 5, 0, 5, 10].forEach(function(p, k){ var x = mid + (k - 2) * 5 * sch; s += '<text x="' + x + '" y="' + (top + 10 * rh + 14) + '" text-anchor="middle">' + p + '%</text>'; });
    return s + '</svg>';
  }
  function som(l, van, tot){ var t = 0; for (var i = van; i <= tot; i++) t += l.m[i] + l.v[i]; return Math.round(t * 10) / 10; }
  function grootste(l){ var b = 0; for (var i = 1; i < 10; i++) if (l.m[i] + l.v[i] > l.m[b] + l.v[b]) b = i; return b; }
  function landenVan(niveau){ return niveau === 'bb' ? P.filter(function(l){ return ['Niger', 'Nigeria', 'India', 'Nederland', 'Japan', 'Duitsland', 'Brazilië'].indexOf(l.land) >= 0; }) : P; }

  /* 1. de vorm */
  function vorm(niveau){
    var l = kies(landenVan(niveau)), opties = ['groei', 'stabiel', 'krimp'];
    return { onderdeel:'bevolkingspiramide: vorm', onderdeelNaam:'vorm', vorm:'meerkeuze', vasteVolgorde:true, sleutel:'v' + l.land,
      vraag:'Wat voor bevolking laat deze piramide zien?', opdracht:'Kijk naar de basis (de jongste groepen) en de top (de oudste).', beeld: piramide(l, {}),
      opties: opties.map(function(k){ return SOORTNAAM[k]; }), goed: opties.indexOf(l.soort),
      uitleg: 'Dit is ' + l.land + ': ' + l.uit + '. ' + (l.soort === 'groei' ? 'Een brede basis betekent veel kinderen: de bevolking groeit.' : l.soort === 'stabiel' ? 'De groepen zijn ongeveer even breed tot de ouderen: de bevolking blijft ongeveer gelijk.' : 'De basis is smaller dan het midden: er worden weinig kinderen geboren en de bevolking vergrijst.'), antwoordTekst: SOORTNAAM[l.soort] };
  }
  /* 2. aflezen: een percentage of de grootste groep */
  function aflezen(niveau){
    var l = kies(landenVan(niveau)), soort = kies(['jong', 'oud', 'groep', 'groep']);
    if (soort === 'groep'){
      var g = grootste(l), opties = H([g].concat(H([0, 1, 2, 3, 4, 5, 6, 7, 8].filter(function(i){ return i !== g; })).slice(0, 3)));
      return { onderdeel:'bevolkingspiramide: aflezen', onderdeelNaam:'aflezen', vorm:'meerkeuze', sleutel:'ag' + l.land,
        vraag:'Welke leeftijdsgroep is in ' + S(l.land) + ' het <b>grootst</b> (mannen en vrouwen samen)?', beeld: piramide(l, { naam:true }),
        opties: opties.map(function(i){ return GR[i] + ' jaar'; }), goed: opties.indexOf(g),
        uitleg: 'De breedste balk (links en rechts samen) is ' + GR[g] + ' jaar: ' + net(l.m[g]) + '% + ' + net(l.v[g]) + '% = ' + net(l.m[g] + l.v[g]) + '% van de bevolking.', antwoordTekst: GR[g] + ' jaar' };
    }
    var jong = soort === 'jong', van = jong ? 0 : 7, tot = jong ? 1 : 9, p = som(l, van, tot);
    return { onderdeel:'bevolkingspiramide: aflezen', onderdeelNaam:'aflezen', vorm:'invul', sleutel:'a' + soort + l.land,
      vraag:'Hoeveel procent van de bevolking van ' + S(l.land) + ' is <b>' + (jong ? 'jonger dan 20' : '70 jaar of ouder') + '</b>?', opdracht:'Tel de balken van mannen en vrouwen bij elkaar op. Een afwijking van 1 procentpunt mag.',
      beeld: piramide(l, { naam:true, licht: jong ? [0, 1] : [7, 8, 9] }),
      velden:[{ label: jong ? '0 tot 19 jaar' : '70 jaar en ouder', antwoord: p, tol: 1, eenheid:'%' }],
      uitleg: (jong ? 'Twee groepen: ' : 'Drie groepen: ') + GR.slice(van, tot + 1).map(function(g, k){ var i = van + k; return net(l.m[i]) + ' + ' + net(l.v[i]); }).join(' + ') + ' = ' + net(p) + '%.', antwoordTekst: net(p) + '%' };
  }
  /* 3. welk land */
  function land(niveau){
    var lijst = landenVan(niveau), l = kies(lijst);
    /* de afleiders: liefst landen met een andere vorm, zodat de vorm het verschil maakt */
    var anders = H(lijst.filter(function(x){ return x.soort !== l.soort; })).slice(0, 2).concat(H(lijst.filter(function(x){ return x !== l && x.soort === l.soort; })).slice(0, 1));
    var opties = H([l].concat(anders));
    return { onderdeel:'bevolkingspiramide: welk land', onderdeelNaam:'welk land', vorm:'meerkeuze', sleutel:'l' + l.land,
      vraag:'Van welk land is deze piramide?', opdracht:'Kijk naar de vorm: groei, stabiel of krimp. Welk land past daarbij?', beeld: piramide(l, {}),
      opties: opties.map(function(x){ return x.land; }), goed: opties.indexOf(l),
      uitleg: l.land + ': ' + l.uit + '. ' + anders.map(function(x){ return x.land + ' heeft een ' + (x.soort === 'groei' ? 'groeiende' : x.soort === 'stabiel' ? 'stabiele' : 'krimpende') + ' bevolking'; }).join('; ') + '.', antwoordTekst: l.land };
  }
  /* 4. begrippen */
  var BEGRIPPEN = [
    { b:'vergrijzing', u:'het aandeel ouderen in de bevolking neemt toe', soort:'krimp' },
    { b:'ontgroening', u:'het aandeel jongeren in de bevolking neemt af', soort:'krimp' },
    { b:'geboortecijfer', u:'het aantal geboorten per 1000 inwoners per jaar' },
    { b:'sterftecijfer', u:'het aantal sterfgevallen per 1000 inwoners per jaar' },
    { b:'levensverwachting', u:'hoe oud iemand gemiddeld wordt' },
    { b:'natuurlijke bevolkingsgroei', u:'geboortecijfer min sterftecijfer' },
    { b:'bevolkingspiramide', u:'een grafiek met per leeftijdsgroep het aandeel mannen en vrouwen' },
    { b:'demografische transitie', u:'de overgang van hoge naar lage geboorte- en sterftecijfers' },
    { b:'babyboom', u:'een periode met veel geboorten, zoals vlak na 1945' },
    { b:'grijze druk', u:'het aantal 65-plussers ten opzichte van de werkende leeftijdsgroep' }
  ];
  function begrippen(niveau){
    var lijst = niveau === 'bb' ? BEGRIPPEN.slice(0, 7) : BEGRIPPEN, b = kies(lijst), l = kies(landenVan(niveau));
    if (b.soort) l = kies(P.filter(function(x){ return x.soort === b.soort; }));
    var anderen = H(lijst.filter(function(x){ return x !== b; })).slice(0, 3), opties = H([b].concat(anderen)).map(function(x){ return x.b; });
    var metCijfers = Math.random() < 0.5 && niveau !== 'bb';
    return { onderdeel:'bevolkingspiramide: begrippen', onderdeelNaam:'begrippen', vorm:'meerkeuze', sleutel:'b' + b.b,
      vraag: metCijfers ? S(l.land) + ' heeft een geboortecijfer van ' + l.geboorte + ' en een sterftecijfer van ' + l.sterfte + ' per 1000. Welk begrip hoort bij: <b>' + b.u + '</b>?' : 'Welk begrip hoort bij: <b>' + b.u + '</b>?',
      beeld: piramide(l, { naam:true }), opties: opties, goed: opties.indexOf(b.b),
      uitleg: b.b.charAt(0).toUpperCase() + b.b.slice(1) + ': ' + b.u + '.' + (b.b === 'natuurlijke bevolkingsgroei' ? ' Voor ' + l.land + ': ' + l.geboorte + ' − ' + l.sterfte + ' = ' + (l.geboorte - l.sterfte) + ' per 1000.' : b.b === 'levensverwachting' ? ' In ' + l.land + ' is die ongeveer ' + l.levensverwachting + ' jaar.' : ''), antwoordTekst: b.b };
  }
  /* 5. het demografisch transitiemodel (hv): welke fase */
  function dtm(){
    var W = 420, Hh = 200, s = '<svg class="dtm" viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="demografisch transitiemodel">';
    var fasen = [[20, 100], [100, 190], [190, 290], [290, 400]];
    fasen.forEach(function(f, i){ s += '<rect class="vak" x="' + f[0] + '" y="20" width="' + (f[1] - f[0] - 2) + '" height="150"/><text class="fase" x="' + ((f[0] + f[1]) / 2) + '" y="188" text-anchor="middle">fase ' + (i + 1) + '</text>'; });
    s += '<path class="lijn geb" d="M20 45 C60 40 90 50 100 46 C140 40 170 52 190 60 C230 80 260 120 290 140 C330 150 370 150 400 150"/>';
    s += '<path class="lijn ster" d="M20 55 C60 50 90 60 100 60 C130 70 160 100 190 120 C230 135 260 145 290 148 C330 150 370 150 400 150"/>';
    s += '<text x="24" y="14" style="fill:#204ECF">geboortecijfer</text><text x="130" y="14" style="fill:#F26749">sterftecijfer</text>';
    return s + '</svg>';
  }
  function transitie(niveau){
    var l = kies(P), fase = l.soort === 'groei' ? (l.geboorte > 35 ? 2 : 3) : 4;
    var opties = ['fase 1: hoog geboorte- en sterftecijfer, bevolking groeit niet', 'fase 2: sterftecijfer daalt, geboortecijfer blijft hoog: snelle groei', 'fase 3: geboortecijfer daalt ook, groei neemt af', 'fase 4: allebei laag, bevolking stabiel of krimpend'];
    return { onderdeel:'bevolkingspiramide: transitie', onderdeelNaam:'transitiemodel', vorm:'meerkeuze', vasteVolgorde:true, sleutel:'t' + l.land,
      vraag:S(l.land) + ' heeft een geboortecijfer van <b>' + l.geboorte + '</b> en een sterftecijfer van <b>' + l.sterfte + '</b> per 1000. In welke fase van het demografisch transitiemodel zit het land?',
      opdracht:'Blauw is het geboortecijfer, oranje het sterftecijfer. De groei is het verschil ertussen.', beeld: dtm() + piramide(l, { naam:true }),
      opties: opties, goed: fase - 1,
      uitleg: l.land + ': geboortecijfer ' + l.geboorte + ', sterftecijfer ' + l.sterfte + ', dus een natuurlijke groei van ' + (l.geboorte - l.sterfte) + ' per 1000. ' + (fase === 2 ? 'Het sterftecijfer is al laag maar het geboortecijfer nog hoog: fase 2, snelle groei.' : fase === 3 ? 'Het geboortecijfer daalt maar is nog hoger dan het sterftecijfer: fase 3.' : 'Allebei laag en dicht bij elkaar: fase 4, met vergrijzing.'), antwoordTekst: opties[fase - 1] };
  }
  /* 6. gevolgen (hv) */
  var GEVOLGEN = [
    { soort:'krimp', v:'Wat is een gevolg van deze piramide voor de zorg?', goed:'meer vraag naar ouderenzorg en verpleeghuizen', mis:['meer vraag naar kinderopvang en consultatiebureaus', 'minder ziekenhuizen nodig', 'niets: de zorgvraag verandert niet'] },
    { soort:'krimp', v:'Wat is een gevolg van deze piramide voor de pensioenen?', goed:'minder werkenden betalen voor meer gepensioneerden', mis:['de pensioenen worden automatisch hoger', 'jongeren gaan eerder met pensioen', 'er zijn minder gepensioneerden'] },
    { soort:'krimp', v:'Wat is een gevolg van deze piramide voor scholen?', goed:'scholen krijgen minder leerlingen en sluiten of fuseren', mis:['er moeten veel nieuwe basisscholen bij', 'klassen worden groter', 'er komen meer leraren tekort door meer kinderen'] },
    { soort:'groei', v:'Wat is een gevolg van deze piramide voor scholen?', goed:'er zijn veel scholen en leraren nodig voor alle kinderen', mis:['scholen sluiten omdat er weinig kinderen zijn', 'ouderenzorg is het grootste probleem', 'er zijn te veel leraren'] },
    { soort:'groei', v:'Wat is een gevolg van deze piramide voor de arbeidsmarkt over 15 jaar?', goed:'heel veel jongeren zoeken tegelijk werk', mis:['er zijn te weinig jongeren om de banen te vullen', 'de meeste werkenden gaan met pensioen', 'niets: de bevolking blijft gelijk'] },
    { soort:'stabiel', v:'Wat past bij deze piramide?', goed:'de bevolking blijft ongeveer even groot', mis:['de bevolking verdubbelt in twintig jaar', 'de helft van de bevolking is jonger dan 15', 'er zijn bijna geen ouderen'] }
  ];
  function gevolgen(niveau){
    var g = kies(GEVOLGEN), l = kies(P.filter(function(x){ return x.soort === g.soort; })), opties = H([g.goed].concat(g.mis));
    return { onderdeel:'bevolkingspiramide: gevolgen', onderdeelNaam:'gevolgen', vorm:'meerkeuze', sleutel:'g' + g.v + l.land,
      vraag:S(l.land) + ': ' + g.v, beeld: piramide(l, { naam:true }), opties: opties, goed: opties.indexOf(g.goed),
      uitleg: l.land + ' heeft een ' + (g.soort === 'groei' ? 'groeiende bevolking met veel kinderen' : g.soort === 'krimp' ? 'vergrijzende bevolking met weinig kinderen en veel ouderen' : 'stabiele bevolking') + ': ' + g.goed + '.', antwoordTekst: g.goed };
  }

  var SOORTEN = { vorm: vorm, aflezen: aflezen, land: land, begrippen: begrippen, transitie: transitie, gevolgen: gevolgen };
  VAKSPEL.maak({
    id:'bevolkingspiramide', naam:'Bevolkingspiramides', vak:'aard', kleur:'#2f7d52',
    hand:'jong onderaan, oud bovenaan',
    lead:'Twaalf echte landen, van Niger tot Japan. Je herkent aan de vorm of een bevolking groeit, stabiel is of krimpt, leest percentages af, raadt het land, kent de begrippen en bedenkt op havo en vwo wat de piramide betekent voor scholen, zorg en pensioenen.',
    hoe:[
      { kop:'Lezen', tekst:'Links de mannen, rechts de vrouwen, elke balk een leeftijdsgroep van tien jaar. De getallen zijn <b>procenten</b> van de hele bevolking.' },
      { kop:'De vorm', tekst:'Brede basis: veel kinderen, groei. Rechte zijkanten: stabiel. Smalle basis en brede top: krimp en vergrijzing.' },
      { kop:'Begrippen', tekst:'Vergrijzing, ontgroening, geboorte- en sterftecijfer, levensverwachting en op havo en vwo het demografisch transitiemodel.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb', uit:'Zeven duidelijke landen, de vorm herkennen en de grootste groep aflezen.' },
        { id:'kgt', naam:'vmbo-kgt en tl', uit:'Twaalf landen, percentages optellen, alle begrippen.' },
        { id:'hv', naam:'havo en vwo', uit:'Ook het demografisch transitiemodel en de gevolgen voor de samenleving.' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' }, { id:'vorm', naam:'vorm' }, { id:'aflezen', naam:'aflezen' }, { id:'land', naam:'welk land' }, { id:'begrippen', naam:'begrippen' }, { id:'transitie', naam:'transitiemodel' }, { id:'gevolgen', naam:'gevolgen' } ] }
    ],
    aantal:10,
    maak:function(keuze, nr){
      var lijst = ['vorm', 'aflezen', 'land', 'begrippen']; if (keuze.niveau === 'hv') lijst.push('transitie', 'gevolgen');
      var soort = keuze.soort === 'alles' ? kies(lijst) : keuze.soort;
      return SOORTEN[soort](keuze.niveau);
    },
    uitleg:{ doel:'Bevolkingspiramides lezen en begrijpen wat ze zeggen over een land.', tijd:'tien opgaven per ronde', bediening:'Kies een antwoord, of typ een percentage en druk op Nakijken.' }
  });
})();
</script>
