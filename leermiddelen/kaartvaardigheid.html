<style>
.kaart-svg{width:min(100%,520px);height:auto;display:block;font-family:inherit}
.kaart-svg .land{fill:var(--kaart2)}
.kaart-svg text{fill:var(--ink);font-weight:600;stroke:var(--kaart2);stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.kaart-svg .stad{fill:var(--ink)}
.legendatabel{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:.9rem;margin-top:8px}

<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script src="kaartvaardigheid-opgaven.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon, G = window.KAART_GEGEVENS;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function tussen(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function net(x){ x = Math.round(x * 100) / 100; return String(x).replace('.', ','); }
  function symSvg(s, maat){ return '<svg class="sym" viewBox="-11 -11 22 22" width="' + (maat || 26) + '" height="' + (maat || 26) + '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + s.d + '</svg>'; }

  /* ---------- een kaartje tekenen: vlakken, lijnen, plaatsen, symbolen ---------- */
  function kaartSvg(o){
    /* o: { w, h, vlakken:[{soort, d}], lijnen:[{soort, d}], plaatsen:[{x,y,naam}], symbolen:[{x,y,sym}], raster:{kol,rij}, extra } */
    var w = o.w || 520, h = o.h || 340, uit = '<svg class="kaart-svg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="kaart">';
    uit += '<rect class="land" x="0" y="0" width="' + w + '" height="' + h + '" rx="12"/>';
    (o.vlakken || []).forEach(function(v){ var vk = G.vlakken.filter(function(x){ return x.id === v.soort; })[0]; uit += '<path d="' + v.d + '" fill="' + vk.vul + '" fill-opacity="' + vk.dekking + '" stroke="none"/>'; });
    (o.lijnen || []).forEach(function(l){
      if (l.soort === 'snelweg') uit += '<path d="' + l.d + '" fill="none" stroke="var(--ink)" stroke-width="7"/><path d="' + l.d + '" fill="none" stroke="var(--kaart2)" stroke-width="2"/>';
      else if (l.soort === 'weg') uit += '<path d="' + l.d + '" fill="none" stroke="var(--ink)" stroke-width="3"/>';
      else if (l.soort === 'spoor') uit += '<path d="' + l.d + '" fill="none" stroke="var(--ink)" stroke-width="2.5"/><path d="' + l.d + '" fill="none" stroke="var(--kaart2)" stroke-width="1.5" stroke-dasharray="6 6"/>';
      else if (l.soort === 'rivier') uit += '<path d="' + l.d + '" fill="none" stroke="#204ECF" stroke-width="5" stroke-linecap="round"/>';
      else if (l.soort === 'grens') uit += '<path d="' + l.d + '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="10 4 2 4"/>';
      else uit += '<path d="' + l.d + '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 5"/>';
    });
    if (o.raster){
      var kw = w / o.raster.kol, rh = h / o.raster.rij;
      for (var i = 1; i < o.raster.kol; i++) uit += '<line x1="' + (i * kw) + '" y1="0" x2="' + (i * kw) + '" y2="' + h + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>';
      for (var j = 1; j < o.raster.rij; j++) uit += '<line x1="0" y1="' + (j * rh) + '" x2="' + w + '" y2="' + (j * rh) + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>';
      for (i = 0; i < o.raster.kol; i++) uit += '<text x="' + (i * kw + kw / 2) + '" y="16" font-size="14" text-anchor="middle" fill="var(--muted)">' + String.fromCharCode(65 + i) + '</text>';
      for (j = 0; j < o.raster.rij; j++) uit += '<text x="12" y="' + (j * rh + rh / 2 + 5) + '" font-size="14" text-anchor="middle" fill="var(--muted)">' + (j + 1) + '</text>';
    }
    (o.plaatsen || []).forEach(function(p){ uit += '<circle class="stad" cx="' + p.x + '" cy="' + p.y + '" r="5"/><text x="' + (p.x + 9) + '" y="' + (p.y + 5) + '" font-size="14">' + S(p.naam) + '</text>'; });
    (o.symbolen || []).forEach(function(s){ uit += '<g transform="translate(' + s.x + ' ' + s.y + ') scale(1.3)" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + s.sym.d + '</g>'; });
    uit += o.extra || '';
    return uit + '</svg>';
  }
  function windroos(x, y, r){
    return '<g transform="translate(' + x + ' ' + y + ')" fill="none" stroke="var(--ink)" stroke-width="2">' +
      '<circle r="' + r + '" fill="var(--kaart)" fill-opacity=".85"/><path d="M0 -' + r + 'L6 -6 0 0 -6 -6z" fill="var(--nadruk)" stroke="none"/><path d="M0 ' + r + 'L6 6 0 0 -6 6z" fill="var(--ink)" stroke="none"/>' +
      '<path d="M-' + r + ' 0h' + (2 * r) + '" stroke-width="1.5"/><text x="0" y="-' + (r + 6) + '" font-size="13" text-anchor="middle" fill="var(--nadruk)" stroke="none">N</text></g>';
  }
  /* een willekeurig landschapje: een meer, een bos, een dorp, een rivier en een weg */
  function landschap(w, h){
    var vl = [], ln = [];
    var mx = tussen(80, w - 120), my = tussen(60, h - 80);
    vl.push({ soort:'water', d:'M' + mx + ' ' + my + 'c40 -30 90 -10 80 30s-60 40 -90 20s-30 -30 10 -50z' });
    var bx = tussen(40, w - 140), by = tussen(40, h - 100);
    vl.push({ soort:'bos', d:'M' + bx + ' ' + by + 'l60 -20 50 30 -10 50 -70 10 -40 -30z' });
    var dx = tussen(60, w - 100), dy = tussen(60, h - 60);
    vl.push({ soort:'bebouwing', d:'M' + dx + ' ' + dy + 'h60v40h-60z' });
    ln.push({ soort:'rivier', d:'M0 ' + tussen(40, h - 40) + 'c' + (w / 3) + ' -40 ' + (w / 2) + ' 60 ' + w + ' 10' });
    ln.push({ soort:'weg', d:'M' + tussen(0, 80) + ' ' + h + 'L' + tussen(w - 120, w) + ' 0' });
    return { vlakken: vl, lijnen: ln };
  }

  /* 1. schaal */
  function schaal(niveau){
    var s = G.schalen[niveau], sch = kies(s.schaal), cm = kies(s.cm), naarEcht = Math.random() < 0.6 || niveau === 'bb';
    var km = cm * sch / 100000;
    var a = kies(G.plaatsen), b = kies(G.plaatsen); while (b === a) b = kies(G.plaatsen);
    var beeld = kaartSvg({ w:520, h:200, plaatsen:[{ x:90, y:100, naam:a }, { x:90 + cm * 30, y:100, naam:b }],
      extra: '<line x1="90" y1="100" x2="' + (90 + cm * 30) + '" y2="100" stroke="var(--nadruk)" stroke-width="2" stroke-dasharray="6 4"/>' +
        '<text x="' + (90 + cm * 15) + '" y="88" font-size="14" text-anchor="middle" fill="var(--nadruk)">' + net(cm) + ' cm op de kaart</text>' +
        '<g transform="translate(90 160)"><rect x="0" y="0" width="30" height="8" fill="var(--ink)"/><rect x="30" y="0" width="30" height="8" fill="none" stroke="var(--ink)"/><text x="0" y="24" font-size="12">0</text><text x="60" y="24" font-size="12" text-anchor="end">' + net(2 * sch / 100000) + ' km</text><text x="200" y="8" font-size="13" fill="var(--muted)">schaal 1 : ' + sch.toLocaleString('nl-NL') + '</text></g>' });
    if (naarEcht) return {
      onderdeel:'kaartvaardigheid: schaal', onderdeelNaam:'schaal', vorm:'invul', sleutel:'sch' + sch + cm,
      vraag:'De kaart heeft schaal <b>1 : ' + sch.toLocaleString('nl-NL') + '</b>. Van ' + a + ' naar ' + b + ' is het op de kaart ' + net(cm) + ' cm. Hoeveel km is dat in het echt?',
      opdracht:'1 cm op de kaart is ' + sch.toLocaleString('nl-NL') + ' cm in het echt. 100 000 cm is 1 km.', beeld: beeld,
      velden:[{ label:'in het echt', antwoord: km, tol: 0.01, eenheid:'km' }],
      uitleg: net(cm) + ' cm × ' + sch.toLocaleString('nl-NL') + ' = ' + (cm * sch).toLocaleString('nl-NL') + ' cm. Gedeeld door 100 000 (want 1 km = 100 000 cm) is dat ' + net(km) + ' km.', antwoordTekst: net(km) + ' km'
    };
    return {
      onderdeel:'kaartvaardigheid: schaal', onderdeelNaam:'schaal', vorm:'invul', sleutel:'sch2' + sch + cm,
      vraag:'Schaal <b>1 : ' + sch.toLocaleString('nl-NL') + '</b>. In het echt is het ' + net(km) + ' km van ' + a + ' naar ' + b + '. Hoeveel cm is dat op de kaart?',
      opdracht:'Eerst km naar cm (keer 100 000), dan delen door het schaalgetal.', beeld: beeld,
      velden:[{ label:'op de kaart', antwoord: cm, tol: 0.01, eenheid:'cm' }],
      uitleg: net(km) + ' km = ' + (km * 100000).toLocaleString('nl-NL') + ' cm. Gedeeld door ' + sch.toLocaleString('nl-NL') + ' is ' + net(cm) + ' cm op de kaart.', antwoordTekst: net(cm) + ' cm'
    };
  }
  /* 2. legenda: symbool, vlak of lijn herkennen */
  function legenda(niveau){
    var soort = kies(['sym', 'sym', 'vlak', 'lijn']);
    if (soort === 'sym'){
      var s = kies(G.symbolen), anderen = H(G.symbolen.filter(function(x){ return x !== s; })).slice(0, 3);
      var opties = H([s].concat(anderen)), beeld = kaartSvg(Object.assign({ w:520, h:220, symbolen:[{ x:tussen(80, 440), y:tussen(60, 170), sym:s }], plaatsen:[{ x:60, y:190, naam:kies(G.plaatsen) }] }, landschap(520, 220)));
      return { onderdeel:'kaartvaardigheid: legenda', onderdeelNaam:'legenda', vorm:'meerkeuze', sleutel:'leg' + s.id,
        vraag:'Op de kaart staat dit teken: ' + symSvg(s, 34) + '. Wat betekent het?', beeld: beeld,
        opties: opties.map(function(x){ return x.naam; }), goed: opties.indexOf(s),
        uitleg: 'Het teken is ' + s.uit + '. In de legenda staat bij elk teken wat het betekent; deze tekens lijken op wat ze voorstellen.', antwoordTekst: s.naam };
    }
    if (soort === 'vlak'){
      var v = kies(G.vlakken), vo = H(G.vlakken);
      var lb = landschap(520, 220);
      return { onderdeel:'kaartvaardigheid: legenda', onderdeelNaam:'legenda', vorm:'meerkeuze', sleutel:'vlak' + v.id,
        vraag:'Welk vlak op de kaart is <b>' + v.kleur + '</b>? Wat stelt die kleur voor?', beeld: kaartSvg(Object.assign({ w:520, h:220 }, lb)),
        opties: vo.map(function(x){ return x.naam; }), goed: vo.indexOf(v),
        uitleg: 'Op een kaart is ' + v.kleur + ' bijna altijd ' + v.naam + '. Blauw is water, groen is bos, oranje of rood is bebouwing, lichtgeel is open land.', antwoordTekst: v.naam };
    }
    var l = kies(G.lijnen), lo = H(G.lijnen).slice(0, 4); if (lo.indexOf(l) < 0) lo[0] = l; lo = H(lo);
    return { onderdeel:'kaartvaardigheid: legenda', onderdeelNaam:'legenda', vorm:'meerkeuze', sleutel:'lijn' + l.id,
      vraag:'Welke lijn is dit op de kaart?', beeld: kaartSvg({ w:520, h:140, lijnen:[{ soort:l.id, d:'M30 70c120 -40 240 40 460 0' }] }),
      opties: lo.map(function(x){ return x.naam; }), goed: lo.indexOf(l),
      uitleg: 'Dit is ' + l.uit + '.', antwoordTekst: l.naam };
  }
  /* 3. windrichting: van A naar B */
  function windrichting(niveau){
    var richtingen = niveau === 'bb' ? G.richtingen.filter(function(r){ return r.hoek % 90 === 0; }) : G.richtingen;
    var r = kies(richtingen), a = kies(G.plaatsen), b = kies(G.plaatsen); while (b === a) b = kies(G.plaatsen);
    var ax = 230, ay = 170, afst = 120, rad = (r.hoek - 90) * Math.PI / 180, bx = Math.round(ax + Math.cos(rad) * afst), by = Math.round(ay + Math.sin(rad) * afst);
    var lb = landschap(520, 340);
    var beeld = kaartSvg(Object.assign({ w:520, h:340, plaatsen:[{ x:ax, y:ay, naam:a }, { x:bx, y:by, naam:b }], extra: windroos(460, 60, 30) }, lb));
    var opties = richtingen.map(function(x){ return x.naam; });
    return { onderdeel:'kaartvaardigheid: windrichting', onderdeelNaam:'windrichting', vorm:'meerkeuze', vasteVolgorde:true, sleutel:'wr' + r.id + a + b,
      vraag:'Je staat in <b>' + a + '</b>. In welke richting ligt <b>' + b + '</b>?', opdracht:'De windroos rechtsboven wijst naar het noorden.', beeld: beeld,
      opties: opties, goed: opties.indexOf(r.naam),
      uitleg: 'Noord is boven op de kaart. Vanuit ' + a + ' ligt ' + b + ' naar ' + (r.hoek === 0 ? 'boven' : r.hoek === 180 ? 'beneden' : r.hoek === 90 ? 'rechts' : r.hoek === 270 ? 'links' : (r.hoek < 180 ? 'rechts' : 'links') + (r.hoek < 90 || r.hoek > 270 ? 'boven' : 'onder')) + ': dat is ' + r.naam + ' (' + r.id + ').', antwoordTekst: r.naam };
  }
  /* 4. vakken: in welk vak ligt het teken */
  function vakken(niveau){
    var kol = niveau === 'bb' ? 4 : 6, rij = niveau === 'bb' ? 3 : 4, w = 520, h = niveau === 'bb' ? 300 : 340;
    var s = kies(G.symbolen), ci = tussen(0, kol - 1), ri = tussen(0, rij - 1), kw = w / kol, rh = h / rij;
    var x = Math.round(ci * kw + kw * (0.35 + Math.random() * 0.3)), y = Math.round(ri * rh + rh * (0.35 + Math.random() * 0.3));
    var antwoord = String.fromCharCode(65 + ci) + (ri + 1);
    var beeld = kaartSvg(Object.assign({ w:w, h:h, raster:{ kol:kol, rij:rij }, symbolen:[{ x:x, y:y, sym:s }] }, landschap(w, h)));
    return { onderdeel:'kaartvaardigheid: vakken', onderdeelNaam:'vakken', vorm:'invul', sleutel:'vak' + antwoord + s.id,
      vraag:'In welk vak ligt de <b>' + s.naam + '</b> ' + symSvg(s, 30) + '?', opdracht:'Eerst de letter (kolom), dan het cijfer (rij), bijvoorbeeld B2.', beeld: beeld,
      velden:[{ label:'vak', antwoord:[antwoord, antwoord.toLowerCase()], type:'tekst' }],
      uitleg: 'De ' + s.naam + ' staat in kolom ' + antwoord[0] + ' en rij ' + antwoord.slice(1) + ': vak ' + antwoord + '. De letters lopen van links naar rechts, de cijfers van boven naar beneden.', antwoordTekst: antwoord };
  }
  /* 5. hoogtelijnen (kgt en hv) */
  function hoogtelijnen(niveau){
    var stap = kies([10, 20, 50]), n = 5, cx = 260, cy = 170, uit = '', top = stap * n;
    var steil = kies(['links', 'rechts']);
    for (var i = 0; i < n; i++){
      var rx = steil === 'links' ? 220 - i * (steil === 'links' ? 26 : 40) : 220 - i * 40, ry = 120 - i * 22;
      var ox = steil === 'links' ? cx + i * 14 : cx - i * 14;
      uit += '<ellipse cx="' + ox + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="none" stroke="#8a5a2b" stroke-width="1.6"/>' +
        '<text x="' + (ox + rx - 4) + '" y="' + (cy - 4) + '" font-size="12" text-anchor="end" fill="#8a5a2b">' + (stap * (i + 1)) + '</text>';
    }
    var px = steil === 'links' ? cx - 150 : cx + 150, py = cy - 30;
    uit += '<circle cx="' + px + '" cy="' + py + '" r="6" fill="var(--nadruk)"/><text x="' + (px + 10) + '" y="' + (py - 8) + '" font-size="15" fill="var(--nadruk)">X</text>';
    var beeld = '<svg class="kaart-svg" viewBox="0 0 520 340" role="img" aria-label="kaart met hoogtelijnen"><rect class="land" width="520" height="340" rx="12"/>' + uit + '</svg>';
    var vraagSoort = kies(['steil', 'hoogte']);
    if (vraagSoort === 'steil'){
      var opties = ['links, waar de lijnen dicht bij elkaar liggen', 'rechts, waar de lijnen ver uit elkaar liggen', 'in het midden, bij de top', 'overal even steil'];
      var goedI = steil === 'links' ? 0 : 1;
      if (steil === 'rechts'){ opties[0] = 'links, waar de lijnen ver uit elkaar liggen'; opties[1] = 'rechts, waar de lijnen dicht bij elkaar liggen'; }
      return { onderdeel:'kaartvaardigheid: hoogtelijnen', onderdeelNaam:'hoogtelijnen', vorm:'meerkeuze', vasteVolgorde:true, sleutel:'hl' + steil + stap,
        vraag:'De bruine lijnen zijn hoogtelijnen, om de ' + stap + ' meter. Waar is de heuvel het <b>steilst</b>?', beeld: beeld,
        opties: opties, goed: goedI,
        uitleg: 'Hoe dichter de hoogtelijnen bij elkaar, hoe sneller de hoogte verandert en hoe steiler het is. Aan de ' + steil + 'kant liggen ze dicht op elkaar.', antwoordTekst: opties[goedI] };
    }
    /* punt X ligt tussen lijn 1 en 2 (aan de buitenkant): tussen stap en 2*stap */
    var opties2 = H(['tussen ' + stap + ' en ' + 2 * stap + ' meter', 'lager dan ' + stap + ' meter', 'precies ' + top + ' meter', 'hoger dan ' + top + ' meter']);
    var goed2 = opties2.indexOf('tussen ' + stap + ' en ' + 2 * stap + ' meter');
    return { onderdeel:'kaartvaardigheid: hoogtelijnen', onderdeelNaam:'hoogtelijnen', vorm:'meerkeuze', sleutel:'hh' + steil + stap,
      vraag:'Hoe hoog ligt punt <b>X</b> ongeveer? De hoogtelijnen gaan per ' + stap + ' meter; de buitenste is ' + stap + ' meter, de binnenste ' + top + ' meter.', beeld: beeld,
      opties: opties2, goed: goed2,
      uitleg: 'X ligt tussen de lijn van ' + stap + ' en die van ' + 2 * stap + ' meter, dus daartussenin. De top zit in het midden, waar de hoogste lijn (' + top + ' m) ligt.', antwoordTekst: opties2[goed2] };
  }

  var SOORTEN = { schaal: schaal, legenda: legenda, windrichting: windrichting, vakken: vakken, hoogtelijnen: hoogtelijnen };
  VAKSPEL.maak({
    id:'kaartvaardigheid', naam:'Kaartvaardigheden', vak:'aard', kleur:'#2f7d52',
    hand:'een kaart lezen is een vak apart',
    lead:'Schaal omrekenen, de legenda lezen, windrichtingen bepalen, vakken opzoeken en hoogtelijnen begrijpen. Elke opgave heeft een getekende kaart; de dorpen zijn verzonnen, de vaardigheid is echt.',
    hoe:[
      { kop:'Schaal', tekst:'1 : 50 000 betekent: 1 cm op de kaart is 50 000 cm in het echt. Deel door <b>100 000</b> voor kilometers.' },
      { kop:'Legenda en windroos', tekst:'Kleuren en tekens staan in de legenda. Noord is boven, tenzij de windroos anders zegt.' },
      { kop:'Vakken en hoogtelijnen', tekst:'Vak B3 is kolom B, rij 3. Hoogtelijnen dicht op elkaar: steil. Ver uit elkaar: vlak.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb', uit:'Ronde schalen, de vier windrichtingen, een klein raster.' },
        { id:'kgt', naam:'vmbo-kgt en tl', uit:'Ook tussenrichtingen, terugrekenen van km naar cm en hoogtelijnen.' },
        { id:'hv', naam:'havo en vwo', uit:'Grote schalen, halve centimeters en hoogtelijnen.' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' }, { id:'schaal', naam:'schaal' }, { id:'legenda', naam:'legenda' }, { id:'windrichting', naam:'windrichting' }, { id:'vakken', naam:'vakken' }, { id:'hoogtelijnen', naam:'hoogtelijnen' } ] }
    ],
    aantal:10,
    maak:function(keuze, nr){
      var lijst = keuze.niveau === 'bb' ? ['schaal', 'legenda', 'windrichting', 'vakken'] : ['schaal', 'legenda', 'windrichting', 'vakken', 'hoogtelijnen'];
      var soort = keuze.soort === 'alles' ? kies(lijst) : keuze.soort;
      if (soort === 'hoogtelijnen' && keuze.niveau === 'bb') return hoogtelijnen('kgt');
      return SOORTEN[soort](keuze.niveau);
    },
    uitleg:{ doel:'Een kaart lezen: schaal, legenda, windrichting, vakken en hoogtelijnen.', tijd:'tien opgaven per ronde', bediening:'Kies een antwoord of typ het in en druk op Nakijken. Een komma mag.' }
  });
})();
