/* de pictogrammen: lijnen in de inktkleur, vlakken uit de kaartkleur, en een
   paar vaste accentkleuren (groen voor planten, oranje voor de vos) die in de
   donkere stand net zo goed te zien zijn */
:root{--vw-groen:#5aa564;--vw-oranje:#E08A3C;--vw-blauw:#4A90D9;--vw-geel:#E8C547;--vw-bruin:#8B5A2B;--vw-grijs:#9aa3b8}
.vw-ico{width:44px;height:44px;display:block;color:var(--ink);fill:var(--kaart2);stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vw-groep{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;align-items:flex-start}
.vw-groep figure{margin:0;display:grid;justify-items:center;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;width:82px;text-align:center;line-height:1.2}
.vw-groep .vw-ico{width:52px;height:52px}
.vw-eco{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:center;margin-bottom:10px}
.vw-kaart{display:inline-flex;align-items:center;gap:7px}
.vw-kaart .vw-ico{width:26px;height:26px;stroke-width:2.4}
.sleepkaart.goed .vw-ico,.sleepkaart.fout .vw-ico{color:inherit}
.sleepdoel .inhoud .sleepkaart{padding:6px 10px}
.vakken.rij .sleepdoel{min-height:104px}
.vw-web{max-width:100%;height:auto;display:block;font-family:inherit}
.vw-web text{fill:var(--ink);font-size:12.5px;font-weight:600;stroke:var(--kaart);stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.vw-web .vw-knoop{fill:var(--kaart);stroke:var(--rand2);stroke-width:2}
.vw-web .vw-knoop.aan{stroke:var(--nadruk);stroke-width:3}
.vw-web .vw-pijl{stroke:var(--muted);stroke-width:2;fill:none}
.vw-web .vw-pijl.aan{stroke:var(--nadruk);stroke-width:3}
.vw-web .vw-pijlkop{fill:var(--muted);stroke:none}
.vw-web .vw-pijlkop.aan{fill:var(--nadruk)}
.vw-web .vw-letter circle{fill:var(--nadruk);stroke:none}
.vw-web .vw-letter text{fill:#fff;font-size:11px;text-anchor:middle}
.vw-web .vw-tekst{fill:var(--muted);font-size:11.5px;font-weight:500}
.vw-legenda{font-size:.78rem;color:var(--muted);text-align:center;margin-top:4px}
.beeld .vw-blok{display:grid;justify-items:center;gap:6px;max-width:100%}
.opties button.optie .vw-kaart{gap:8px}
.opties button.optie .vw-ico{width:28px;height:28px}
body.groot .vw-groep .vw-ico{width:64px;height:64px}
body.groot .vw-web text{font-size:15px}
@media(max-width:560px){.vw-groep{gap:8px 10px}.vw-groep figure{width:70px;font-size:.74rem}.vw-groep .vw-ico{width:44px;height:44px}}
</style>
<script src="/vangnet.js" defer></script>

        uitleg: hoofd(ORG[lijst[0]].e) + ' maakt zelf voedsel: producent. ' + lijst.slice(1).map(function(id, i){ return hoofd(ORG[id].e) + ' eet ' + ORG[lijst[i]].e + ': ' + ORDE[i + 1]; }).join('. ') + '. ' + hoofd(ORG[afb].e) + ' breekt dode resten af: afbreker.',
        antwoordTekst: lijst.map(function(id, i){ return ORG[id].n + ' = ' + ORDE[i]; }).join(', ') + ', ' + ORG[afb].n + ' = afbreker'
      };
    }
    if (niveau === 'hv'){
      var per = { herbivoor:[], carnivoor:[], omnivoor:[] }, prod = [];
      alle.forEach(function(id){ var o = ORG[id]; if (o.rol === 'producent') prod.push(id); else if (per[o.rol] && !o.twijfel) per[o.rol].push(id); });
      /* niet elk ecosysteem heeft een duidelijke omnivoor in de ketens; dan komt er een bij die er wel woont */
      var OMNI = { bos:['das', 'zwijn'], weiland:['das', 'eend'], sloot:['eend'], noordzee:['meeuw'], savanne:['aap'], pool:['meeuw'], regenwoud:['aap'] };
      var keuze = [kies(prod), kies(per.herbivoor), kies(per.carnivoor), per.omnivoor.length ? kies(per.omnivoor) : kies(OMNI[eco]), afb];
      var extra = H(alle.filter(function(id){ return keuze.indexOf(id) < 0 && !ORG[id].twijfel; })).slice(0, 1);
      var ids2 = H(keuze.concat(extra));
      var rollenLijst = ['producent', 'herbivoor', 'carnivoor', 'omnivoor', 'afbreker'];
      return {
        onderdeel:'voedselweb: rollen', onderdeelNaam:'rollen', vorm:'sleep', sleutel:'rh' + ids2.slice().sort().join(''),
        vraag: 'Welke rol heeft elk organisme in ' + S(D.ECO[eco]) + '?',
        opdracht: 'Herbivoor eet planten, carnivoor eet dieren, omnivoor eet allebei.',
        beeld: groep(ids2, eco),
        kaarten: ids2.map(function(id){ return { id:id, tekst:kaart(id) }; }),
        vakken: rollenLijst.map(function(r){ return { id:r, naam:rolNaam(r), hoort: ids2.filter(function(id){ return ORG[id].rol === r; }) }; }),
        uitleg: ids2.map(function(id){ return hoofd(ORG[id].n) + ': ' + rolNaam(ORG[id].rol); }).join('. ') + '.',
        antwoordTekst: ids2.map(function(id){ return ORG[id].n + ' = ' + ORG[id].rol; }).join(', ')
      };
    }
    var prod2 = alle.filter(function(id){ return ORG[id].rol === 'producent'; }), cons = alle.filter(function(id){ return ORG[id].rol !== 'producent' && ORG[id].rol !== 'afbreker'; });
    var nP = niveau === 'bb' ? 1 : kies([1, 2]), ids3 = H(H(prod2).slice(0, nP).concat(H(cons).slice(0, 5 - nP)).concat([afb]));
    var vakkenLijst = [{ id:'producent', naam:'producent', uit:'maakt zelf voedsel' }, { id:'consument', naam:'consument', uit:'eet planten of dieren' }, { id:'afbreker', naam:'afbreker', uit:'ruimt dode resten op' }];
    return {
      onderdeel:'voedselweb: rollen', onderdeelNaam:'rollen', vorm:'sleep', sleutel:'r' + ids3.slice().sort().join(''),
      vraag: 'Producent, consument of afbreker? Organismen uit ' + S(D.ECO[eco]) + '.',
      opdracht: niveau === 'bb' ? 'Planten maken zelf voedsel. Dieren eten. Bacteriën en schimmels ruimen op.' : 'Sleep elk organisme naar zijn rol.',
      beeld: groep(ids3, eco),
      kaarten: ids3.map(function(id){ return { id:id, tekst:kaart(id) }; }),
      vakken: vakkenLijst.map(function(v){ return { id:v.id, naam:v.naam, uit:v.uit, hoort: ids3.filter(function(id){ var r = ORG[id].rol; return v.id === 'producent' ? r === 'producent' : v.id === 'afbreker' ? r === 'afbreker' : (r !== 'producent' && r !== 'afbreker'); }) }; }),
      uitleg: 'Producenten (planten en algen) maken zelf voedsel met licht. Consumenten (alle dieren) eten andere organismen. Afbrekers (bacteriën en schimmels) breken dode resten af.',
      antwoordTekst: ids3.map(function(id){ var r = ORG[id].rol; return ORG[id].n + ' = ' + (r === 'producent' || r === 'afbreker' ? r : 'consument'); }).join(', ')
    };
  }

  /* ---------- 3. wat gebeurt er: meerkeuze bij een web ---------- */
  function webVraag(niveau){
    var wi = Math.floor(Math.random() * D.WEBBEN.length), web = D.WEBBEN[wi], soorten = ['weg', 'weg', 'wie', 'wat', 'prod'];
    if (niveau !== 'bb') soorten.push('pijl', 'pijl', 'top');
    if (niveau === 'hv') soorten.push('orde', 'orde');
    var soort = kies(soorten), basis = { onderdeel:'voedselweb: wat gebeurt er', onderdeelNaam:'wat gebeurt er', vorm:'meerkeuze' };
    var andere = web.n.slice();
    if (soort === 'weg'){
      var x = kies(web.n.filter(function(id){ return voedsel(web, id).length; }));
      var prooi = voedsel(web, x), alleenX = web.n.filter(function(id){ var v = voedsel(web, id); return v.length === 1 && v[0] === x; });
      var y, meer, uitleg;
      if (alleenX.length && Math.random() < 0.5){ y = kies(alleenX); meer = false; uitleg = hoofd(ORG[y].m) + ' eten in dit web alleen ' + ORG[x].m + '. Verdwijnt hun voedsel, dan nemen ze af.'; }
      else { y = kies(prooi); meer = true; uitleg = hoofd(ORG[x].m) + ' eten ' + ORG[y].m + '. Zonder ' + ORG[x].m + ' ' + (mv(y) ? 'worden er minder ' + kaal(y) + ' gegeten, dus hun aantal groeit' : 'wordt er minder ' + kaal(y) + ' gegeten, dus er komt meer') + '. Later kan het voedsel van ' + ORG[y].m + ' op raken.'; }
      var p = mv(y), yn = kaal(y);
      var tMeer = (p ? 'er komen meer ' : 'er komt meer ') + yn + (p ? ', want ze worden minder gegeten' : ', want het wordt minder gegeten');
      var tMinder = (p ? 'er komen minder ' : 'er komt minder ') + yn + (p ? ', want ze hebben minder te eten' : ', want het heeft minder te eten');
      var goed = meer ? tMeer : tMinder;
      var opties = [goed, meer ? tMinder : tMeer, 'niets: ' + ORG[y].m + (p ? ' hebben' : ' heeft') + ' niets met ' + ORG[x].m + ' te maken', hoofd(ORG[y].m) + (p ? ' verdwijnen' : ' verdwijnt') + ' ook meteen helemaal'];
      return Object.assign(basis, { sleutel:'w' + wi + 'weg' + x + y,
        vraag: hoofd(ORG[x].m) + ' verdwijnen uit ' + S(D.ECO[web.eco]) + ', bijvoorbeeld door een ziekte. Wat gebeurt er eerst met ' + ORG[y].m + '?',
        opdracht: 'Kijk in het web wie wie eet.', beeld: webSvg(web, { knopen:[x, y] }),
        opties: opties, goed: 0, uitleg: uitleg, antwoordTekst: goed });
    }
    if (soort === 'wie' || soort === 'wat'){
      var wie = soort === 'wie', kand = web.n.filter(function(id){ return (wie ? eters(web, id) : voedsel(web, id)).length && web.n.filter(function(z){ return z !== id && (wie ? eters(web, id) : voedsel(web, id)).indexOf(z) < 0; }).length >= 3; });
      if (!kand.length) return webVraag(niveau);
      var x2 = kies(kand), lijst = wie ? eters(web, x2) : voedsel(web, x2), g = kies(lijst);
      var fout = H(web.n.filter(function(z){ return z !== x2 && lijst.indexOf(z) < 0; })).slice(0, 3);
      var opts = [g].concat(fout);
      return Object.assign(basis, { sleutel:'w' + wi + soort + x2 + g,
        vraag: wie ? 'Welk organisme eet ' + ORG[x2].e.replace(/^(de|het) /, wie ? '$1 ' : '') + ' in dit web?' : 'Wat eet ' + ORG[x2].e + ' volgens dit web?',
        opdracht: 'De pijl wijst van wie gegeten wordt naar wie eet.', beeld: webSvg(web, { knopen:[x2] }),
        opties: opts.map(kaart), goed: 0,
        uitleg: wie ? 'Er loopt een pijl van ' + ORG[x2].e + ' naar ' + ORG[g].e + ': ' + ORG[g].e + ' eet ' + ORG[x2].e + '.' + (lijst.length > 1 ? ' Ook ' + lijst.filter(function(z){ return z !== g; }).map(function(z){ return ORG[z].e; }).join(' en ') + ' eet ' + ORG[x2].e + '.' : '') : 'Er loopt een pijl van ' + ORG[g].e + ' naar ' + ORG[x2].e + ': ' + ORG[x2].e + ' eet ' + ORG[g].e + '.' + (lijst.length > 1 ? ' Ook ' + lijst.filter(function(z){ return z !== g; }).map(function(z){ return ORG[z].e; }).join(' en ') + '.' : ''),
        antwoordTekst: ORG[g].n });
    }
    if (soort === 'prod' || soort === 'top'){
      var top = web.n.filter(function(id){ return !eters(web, id).length; });
      if (soort === 'top' && top.length !== 1) soort = 'prod';
      var goedId = soort === 'top' ? top[0] : kies(producenten(web));
      var mis = H(web.n.filter(function(id){ return soort === 'top' ? id !== goedId : ORG[id].rol !== 'producent'; })).slice(0, 3);
      return Object.assign(basis, { sleutel:'w' + wi + soort + goedId,
        vraag: soort === 'top' ? 'Welk organisme staat in dit web helemaal bovenaan: het wordt door niemand gegeten?' : 'Welk organisme in dit web is een producent?',
        opdracht: soort === 'top' ? 'Zoek de knoop waar geen pijl uit vertrekt.' : 'Een producent maakt zelf voedsel; er komt geen pijl bij hem aan.', beeld: webSvg(web),
        opties: [goedId].concat(mis).map(kaart), goed: 0,
        uitleg: soort === 'top' ? hoofd(ORG[goedId].e) + ' is de toppredator: er vertrekt geen pijl, niemand eet hem.' : hoofd(ORG[goedId].e) + ' maakt zelf voedsel met licht en staat onderaan, waar alle pijlen beginnen.',
        antwoordTekst: ORG[goedId].n });
    }
    if (soort === 'pijl'){
      var pijlen = H(web.p).slice(0, 4), om = pijlen[0], rest = web.p.filter(function(p){ return p !== om; });
      var letters = ['A', 'B', 'C', 'D'], gemengd = H(pijlen), getekend = rest.slice();
      var gel = gemengd.map(function(p, i){ var q = p === om ? [p[1], p[0], letters[i]] : [p[0], p[1], letters[i]]; if (p !== om) getekend = getekend.filter(function(r){ return r !== p; }); return q; });
      var tekening = { eco: web.eco, n: web.n, p: getekend.concat(gel) };
      var opts2 = gel.map(function(q){ return q[2] + ': ' + ORG[q[0]].n + ' → ' + ORG[q[1]].n; }), gi = gel.findIndex(function(q){ return q[0] === om[1]; });
      return Object.assign(basis, { sleutel:'w' + wi + 'pijl' + om.join(''), vasteVolgorde:true,
        vraag: 'In dit web is één pijl verkeerd om getekend. Welke?',
        opdracht: 'De pijl hoort te wijzen van wie gegeten wordt naar wie eet.', beeld: webSvg(tekening),
        opties: opts2, goed: gi,
        uitleg: 'Pijl ' + gel[gi][2] + ' zegt dat ' + ORG[om[0]].e + ' ' + ORG[om[1]].e + ' eet. Het is andersom: ' + ORG[om[1]].e + ' eet ' + ORG[om[0]].e + ', dus de pijl hoort van ' + ORG[om[0]].n + ' naar ' + ORG[om[1]].n + '.',
        antwoordTekst: opts2[gi] });
    }
    /* orde: een keten uit het web, en van welke orde is een schakel */
    var start = kies(producenten(web)), keten = [start], cur = start;
    while (eters(web, cur).length && keten.length < 5){ cur = kies(eters(web, cur)); keten.push(cur); }
    if (keten.length < 3) return webVraag(niveau);
    var idx = 1 + Math.floor(Math.random() * (keten.length - 1)), doel = keten[idx];
    var opts3 = ORDE.slice(0, Math.max(4, keten.length)).slice(0, 4);
    if (idx >= 4) opts3 = ORDE.slice(1, 5);
    return Object.assign(basis, { sleutel:'w' + wi + 'orde' + keten.join('') + idx, vasteVolgorde:true,
      vraag: 'Neem uit dit web de keten <b>' + keten.map(function(id){ return S(ORG[id].n); }).join(' → ') + '</b>. Wat is ' + ORG[doel].e + ' in deze keten?',
      opdracht: 'Tel vanaf de producent: eerste orde, tweede orde, enzovoort.', beeld: webSvg(web, { knopen: keten, aan: keten.slice(1).map(function(id, i){ return [keten[i], id]; }) }),
      opties: opts3, goed: opts3.indexOf(ORDE[idx]),
      uitleg: hoofd(ORG[keten[0]].e) + ' is de producent. ' + keten.slice(1).map(function(id, i){ return hoofd(ORG[id].n) + ' is ' + ORDE[i + 1]; }).join(', ') + '.',
      antwoordTekst: ORDE[idx] });
  }

  /* ---------- 4. begrippen: meerkeuze met een beeld ---------- */
  function pijlHtml(){ return '<svg class="vw-ico" viewBox="0 0 48 48" style="width:30px;height:30px;fill:none"><path d="M6 24h30M28 16l8 8-8 8" stroke="var(--muted)" stroke-width="3"/></svg>'; }
  var BEELDEN = {
    keten: function(){ return '<div class="vw-groep" style="align-items:center">' + ['gras', 'konijn', 'vos'].map(function(id, i){ return (i ? pijlHtml() : '') + '<figure>' + icoon(ORG[id].ico) + '<figcaption>' + ORG[id].n + '</figcaption></figure>'; }).join('') + '</div>'; },
    web: function(){ return webSvg({ eco:'bos', n:['gras', 'eik', 'konijn', 'bosmuis', 'vos', 'bosuil'], p:[['gras', 'konijn'], ['gras', 'bosmuis'], ['eik', 'bosmuis'], ['konijn', 'vos'], ['bosmuis', 'vos'], ['bosmuis', 'bosuil']] }); },
    producent: function(){ return '<div class="vw-groep" style="align-items:center"><svg class="vw-ico" viewBox="0 0 48 48" style="width:52px;height:52px"><circle cx="24" cy="24" r="9" fill="' + Y + '" stroke="' + Y + '"/><path d="M24 6v6M24 36v6M6 24h6M36 24h6M11 11l4 4M33 33l4 4M11 37l4-4M33 15l4-4" stroke="' + Y + '"/></svg>' + pijlHtml() + '<figure>' + icoon('blad') + '<figcaption>maakt voedsel</figcaption></figure></div>'; },
    consument: function(){ return '<div class="vw-groep" style="align-items:center"><figure>' + icoon('gras') + '<figcaption>gras</figcaption></figure>' + pijlHtml() + '<figure>' + icoon('konijn') + '<figcaption>konijn</figcaption></figure>' + pijlHtml() + '<figure>' + icoon('vos') + '<figcaption>vos</figcaption></figure></div>'; },
    afbreker: function(){ return '<div class="vw-groep" style="align-items:center"><figure>' + icoon('blad') + '<figcaption>dood blad</figcaption></figure>' + pijlHtml() + '<figure>' + icoon('schimmel') + '<figcaption>schimmel</figcaption></figure><figure>' + icoon('bacterie') + '<figcaption>bacterie</figcaption></figure>' + pijlHtml() + '<figure><svg class="vw-ico" viewBox="0 0 48 48"><path d="M4 30h40v12H4z" fill="' + BR + '" stroke="' + BR + '"/><circle cx="14" cy="36" r="1.5" fill="#fff" stroke="none"/><circle cx="26" cy="34" r="1.5" fill="#fff" stroke="none"/><circle cx="36" cy="37" r="1.5" fill="#fff" stroke="none"/></svg><figcaption>voedingsstoffen</figcaption></figure></div>'; },
    zon: function(){ return BEELDEN.producent() ; },
    piramideAantal: function(){ return piramide([['buizerd', '2'], ['kikker', '40'], ['sprinkhaan', '2000'], ['gras', '100 000']], 'aantal'); },
    piramideBiomassa: function(){ return piramide([['vos', '10 kg'], ['konijn', '100 kg'], ['gras', '1000 kg']], 'biomassa'); },
    biomassa: function(){ return '<div class="vw-groep" style="align-items:center">' + [1, 2, 3, 4].map(function(){ return icoon('konijn'); }).join('') + '<figure style="width:auto"><b style="font-size:1.1rem;color:var(--ink)">samen 8 kg</b><figcaption>biomassa</figcaption></figure></div>'; },
    energie: function(){ return '<div class="vw-groep" style="align-items:center"><figure>' + icoon('gras') + '<figcaption>100%</figcaption></figure>' + pijlHtml() + '<figure>' + icoon('konijn') + '<figcaption>10%</figcaption></figure>' + pijlHtml() + '<figure>' + icoon('vos') + '<figcaption>1%</figcaption></figure></div><p class="vw-legenda">per schakel gaat ongeveer 90% verloren: bewegen, warmte, resten</p>'; },
    kringloop: function(){
      var W = 300, cx = 150, cy = 120, r = 82, delen = [['blad', 'planten'], ['konijn', 'dieren'], ['schimmel', 'afbrekers'], ['bodem', 'voedingsstoffen']];
      var s = '<svg class="vw-web" viewBox="0 0 300 240" width="300" height="240"><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" class="vw-pijl" stroke-dasharray="6 6"/>';
      delen.forEach(function(d, i){ var a = -Math.PI / 2 + i * Math.PI / 2, x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
        s += '<g transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"><circle class="vw-knoop" r="22"/><g transform="translate(-20 -20) scale(0.833)">' + (d[0] === 'bodem' ? '<path d="M4 30h40v12H4z" fill="' + BR + '" stroke="' + BR + '"/>' : ICO[d[0]]) + '</g><text text-anchor="middle" y="' + (i === 0 ? -30 : i === 2 ? 40 : 38) + '"' + (i === 1 ? ' x="0"' : i === 3 ? ' x="0"' : '') + '>' + d[1] + '</text></g>';
        var b = a + Math.PI / 4, px = cx + r * Math.cos(b), py = cy + r * Math.sin(b), tx = -Math.sin(b), ty = Math.cos(b);
        s += '<path class="vw-pijlkop" d="M' + (px + tx * 8).toFixed(1) + ' ' + (py + ty * 8).toFixed(1) + 'L' + (px - ty * 5).toFixed(1) + ' ' + (py + tx * 5).toFixed(1) + 'L' + (px + ty * 5).toFixed(1) + ' ' + (py - tx * 5).toFixed(1) + 'z"/>';
      });
      return s + '</svg>';
    }
  };
  function piramide(lagen, soort){
    var W = 320, Hh = lagen.length * 44 + 10, s = '<svg class="vw-web" viewBox="0 0 ' + W + ' ' + Hh + '" width="' + W + '" height="' + Hh + '">';
    lagen.forEach(function(l, i){ var n = lagen.length, breed = 90 + (i / (n - 1)) * 200, x = (W - breed) / 2, y = 5 + i * 44;
      s += '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + breed.toFixed(1) + '" height="38" rx="8" fill="var(--kaart2)" stroke="var(--rand2)" stroke-width="1.5"/>';
      s += '<g transform="translate(' + (x + 8).toFixed(1) + ' ' + (y + 3) + ') scale(0.667)">' + ICO[ORG[l[0]].ico] + '</g>';
      s += '<text x="' + (x + 44).toFixed(1) + '" y="' + (y + 24) + '">' + ORG[l[0]].n + '</text><text class="vw-tekst" text-anchor="end" x="' + (x + breed - 10).toFixed(1) + '" y="' + (y + 24) + '">' + l[1] + '</text>'; });
    return s + '</svg><p class="vw-legenda">piramide van ' + soort + '</p>';
  }
  function begrip(niveau){
    var lijst = D.BEGRIPPEN.filter(function(b){ return b.n.indexOf(niveau) >= 0; }), i = Math.floor(Math.random() * lijst.length), b = lijst[i];
    return {
      onderdeel:'voedselweb: begrippen', onderdeelNaam:'begrippen', vorm:'meerkeuze', sleutel:'b' + D.BEGRIPPEN.indexOf(b),
      vraag: b.v, beeld: BEELDEN[b.b] ? BEELDEN[b.b]() : '', opties: b.o, goed: 0, uitleg: b.u, antwoordTekst: b.o[0]
    };
  }

  var SOORTEN = { keten: ketenBouwen, rollen: rollen, web: webVraag, begrippen: begrip };
  VAKSPEL.maak({
    id:'voedselweb', naam:'Voedselketen en voedselweb', vak:'bio', kleur:'#83A5F2',
    hand:'de pijl wijst naar wie eet',
    lead:'Van het gras tot de vos, van de alg tot de ijsbeer. Je bouwt voedselketens uit zeven ecosystemen, sleept organismen naar hun rol, voorspelt in een voedselweb wat er gebeurt als een soort verdwijnt, en kent de begrippen: van afbreker tot piramide van biomassa.',
    hoe:[
      { kop:'De keten', tekst:'Elke keten begint met een <b>producent</b>: een plant of alg die zelf voedsel maakt. Daarna komt wie hem eet, en wie die weer eet. De pijl wijst naar wie eet.' },
      { kop:'Het web', tekst:'In het echt eet een dier meer dan één ding. Alle ketens samen zijn een <b>voedselweb</b>. Verdwijnt een soort, dan merk je dat door het hele web heen.' },
      { kop:'Vier onderdelen', tekst:'Ketens bouwen, rollen slepen, vragen bij een web en de begrippen. Tien opgaven per ronde, elk met een tekening erbij en meteen nagekeken.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb', uit:'Ketens van drie of vier, rollen met een hint erbij, en de basisbegrippen.' },
        { id:'kgt', naam:'vmbo-kgt en tl', uit:'Ketens van vier, de ordes van consumenten, kringloop en piramide van aantallen.' },
        { id:'hv', naam:'havo en vwo', uit:'Ook ketens van vijf, herbivoor, carnivoor en omnivoor, piramide van biomassa en energieverlies per schakel.' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' }, { id:'keten', naam:'keten bouwen' }, { id:'rollen', naam:'rollen', uit:'Is het een producent, een consument of een opruimer?' }, { id:'web', naam:'wat gebeurt er' }, { id:'begrippen', naam:'begrippen' } ] }
    ],
    aantal:10,
    maak:function(keuze, nr){
      var soort = keuze.soort === 'alles' ? kies(['keten', 'rollen', 'web', 'web', 'begrippen', 'begrippen']) : keuze.soort;
      return SOORTEN[soort](keuze.niveau);
    },
    uitleg:{ doel:'Voedselketens en voedselwebben: producent, consument, afbreker, en wat er gebeurt als een schakel verdwijnt.', tijd:'tien opgaven per ronde', bediening:'Sleep kaartjes naar de vakken (op een telefoon: tik het kaartje en dan het vak) of kies een antwoord. De toetsen 1 tot 4 kiezen ook.' }
  });
})();
