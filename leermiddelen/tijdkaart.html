<style>
.eukaart{width:min(100%,640px);height:auto;display:block;font-family:inherit}
.eukaart .zee{fill:var(--nadruk-zacht)}
.eukaart .achter{fill:var(--kaart2);stroke:none}
.eukaart .land{fill:var(--kaart);stroke:var(--muted);stroke-width:1;stroke-linejoin:round}
.eukaart .gebied{cursor:pointer}
.eukaart .gebied:hover .land{fill:var(--kaart-aan)}
.eukaart .gebied.gekozen .land{fill:var(--nadruk);fill-opacity:.55;stroke:var(--nadruk)}
.eukaart .gebied.goed .land{fill:var(--goed);fill-opacity:.6;stroke:var(--goed)}
.eukaart .gebied.fout .land{fill:var(--fout);fill-opacity:.6;stroke:var(--fout)}
.eukaart .gebied.aan .land{fill:var(--nadruk);fill-opacity:.5;stroke:var(--nadruk)}
.eukaart .gebied.licht .land{fill:var(--amber);fill-opacity:.55}
.eukaart text{fill:var(--ink);font-size:14px;font-weight:600;pointer-events:none;stroke:var(--kaart);stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.kaartuit{text-align:center;color:var(--muted);font-size:.86rem;margin-top:6px}
.legenda{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:.82rem;color:var(--muted);margin-top:6px}

<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon, K = window.TIJDKAART_KAART;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  var NIV = { bb:1, kgt:2, hv:3 };

  /* De gebieden: grove streken uit de landen van nu, zoals in een schoolatlas.
     Het label staat op een vaste plek in de kaart (viewBox 1031 x 700). */
  var GEBIEDEN = [
    { id:'iberie', naam:'Iberisch schiereiland', landen:['Spanje', 'Portugal', 'Andorra'], x:180, y:520 },
    { id:'frankrijk', naam:'Frankrijk', landen:['Frankrijk', 'Monaco'], x:300, y:400 },
    { id:'brits', naam:'Britse eilanden', landen:['Verenigd Koninkrijk', 'Ierland'], x:225, y:250 },
    { id:'nederlanden', naam:'de Nederlanden', landen:['Nederland', 'België', 'Luxemburg'], x:335, y:300 },
    { id:'duits', naam:'Duitse gebieden', landen:['Duitsland', 'Oostenrijk', 'Zwitserland', 'Tsjechië', 'Liechtenstein'], x:430, y:340 },
    { id:'italie', naam:'Italië', landen:['Italië', 'San Marino', 'Malta'], x:445, y:470 },
    { id:'scandinavie', naam:'Scandinavië', landen:['Noorwegen', 'Zweden', 'Denemarken', 'Finland', 'IJsland'], x:470, y:130 },
    { id:'oost', naam:'Oost-Europa', landen:['Polen', 'Slowakije', 'Hongarije', 'Oekraïne', 'Wit-Rusland', 'Litouwen', 'Letland', 'Estland', 'Moldavië', 'Roemenië'], x:600, y:300 },
    { id:'rusland', naam:'Rusland', landen:['Rusland'], x:820, y:200 },
    { id:'balkan', naam:'de Balkan', landen:['Griekenland', 'Bulgarije', 'Servië', 'Kroatië', 'Bosnië en Herzegovina', 'Slovenië', 'Montenegro', 'Albanië', 'Kosovo', 'Noord-Macedonië'], x:560, y:470 },
    { id:'kleinazie', naam:'Klein-Azië', landen:['Turkije', 'Cyprus'], x:800, y:560 }
  ];
  var LAND = {}; K.landen.forEach(function(l){ LAND[l.n] = l.d; });
  function gebiedVan(id){ return GEBIEDEN.filter(function(g){ return g.id === id; })[0]; }
  /* de kaart: elk gebied een groep met de landen erin; klassen per gebied (aan, licht, goed, fout) */
  function kaart(o){
    o = o || {};
    var s = '<svg class="eukaart" viewBox="0 0 ' + K.breed + ' ' + K.hoog + '" role="img" aria-label="kaart van Europa">';
    s += '<rect class="zee" x="0" y="0" width="' + K.breed + '" height="' + K.hoog + '" rx="12"/>';
    if (K.achter) s += '<path class="achter" d="' + K.achter + '"/>';
    GEBIEDEN.forEach(function(g){
      var kl = (o.klassen && o.klassen[g.id]) || '';
      s += '<g class="gebied ' + kl + '" data-g="' + g.id + '">' + g.landen.map(function(n){ return LAND[n] ? '<path class="land" d="' + LAND[n] + '"/>' : ''; }).join('') + '</g>';
    });
    /* de niet ingedeelde landjes blijven grijs mee tekenen */
    if (o.namen !== false) GEBIEDEN.forEach(function(g){ s += '<text x="' + g.x + '" y="' + g.y + '" text-anchor="middle">' + S(g.naam) + '</text>'; });
    return s + '</svg>';
  }

  /* ---------- 1. aanwijzen: waar lag ... ---------- */
  var WAAR = [
    { n:1, tv:2, v:'het hart van het Romeinse Rijk, rond 100 na Christus', goed:['italie'], uit:'Rome ligt in Italië: vandaar breidde het rijk zich uit rond de hele Middellandse Zee.' },
    { n:1, tv:2, v:'de Griekse stadstaten, zoals Athene en Sparta, rond 450 voor Christus', goed:['balkan'], uit:'Griekenland ligt op het zuiden van de Balkan.' },
    { n:1, tv:6, v:'de Republiek der Zeven Verenigde Nederlanden, in 1650', goed:['nederlanden'], uit:'De Republiek besloeg ongeveer het huidige Nederland: de noordelijke Nederlanden.' },
    { n:1, tv:5, v:'het land van Filips II, de koning die de Nederlanden bestuurde', goed:['iberie'], uit:'Filips II was koning van Spanje, op het Iberisch schiereiland.' },
    { n:1, tv:7, v:'het land waar in 1789 de revolutie uitbrak', goed:['frankrijk'], uit:'De Franse Revolutie begon in Parijs.' },
    { n:1, tv:8, v:'het land waar de industriële revolutie begon, rond 1770', goed:['brits'], uit:'De eerste fabrieken en stoommachines stonden in Engeland, op de Britse eilanden.' },
    { n:1, tv:10, v:'het land dat in 1949 in Oost en West werd gesplitst', goed:['duits'], uit:'Duitsland werd na de oorlog verdeeld in de Bondsrepubliek (west) en de DDR (oost).' },

    { n:1, tv:4, v:'Venetië, de rijke handelsstad aan de Adriatische Zee', goed:['italie'], uit:'Venetië ligt in Noord-Italië en handelde in de middeleeuwen met het oosten.' },
    { n:1, tv:4, v:'de Hanzestad Kampen aan de IJssel', goed:['nederlanden'], uit:'Kampen ligt in Overijssel: de IJsselsteden deden mee in de Hanze.' },

    { n:1, tv:9, v:'Engeland, dat in 1940 de luchtslag tegen Duitsland won', goed:['brits'], uit:'In de Slag om Engeland (1940) hield de Britse luchtmacht de Duitsers tegen.' },
    { n:1, tv:9, v:'Normandië, waar de geallieerden in juni 1944 landden', goed:['frankrijk'], uit:'Normandië ligt aan de noordkust van Frankrijk: D-Day, 6 juni 1944.' },
    { n:1, tv:9, v:'Stalingrad, waar het Duitse leger in 1943 verloor', goed:['rusland'], uit:'Stalingrad (nu Wolgograd) ligt aan de Wolga in Rusland.' },

    { n:1, tv:10, v:'Moskou, de hoofdstad van de Sovjet-Unie', goed:['rusland'], uit:'Moskou was de hoofdstad van de Sovjet-Unie en is nu de hoofdstad van Rusland.' },
    { n:1, tv:10, v:'Tsjernobyl, waar in 1986 een kerncentrale ontplofte', goed:['oost'], uit:'Tsjernobyl ligt in het noorden van Oekraïne, toen deel van de Sovjet-Unie.' },
    { n:1, tv:10, v:'Brussel, de stad van de Europese Unie en de NAVO', goed:['nederlanden'], uit:'Brussel is de hoofdstad van België.' },
    { n:1, tv:2, v:'Troje, de stad uit de verhalen van Homerus over het houten paard', goed:['kleinazie'], uit:'Troje lag in het noordwesten van het huidige Turkije, in Klein-Azië.' },
    { n:1, tv:5, v:'Lissabon, de haven waar Vasco da Gama in 1497 vertrok naar India', goed:['iberie'], uit:'Lissabon is de hoofdstad van Portugal, op het Iberisch schiereiland.' },
    { n:1, tv:6, v:'Sint-Petersburg, de stad die tsaar Peter de Grote in 1703 stichtte', goed:['rusland'], uit:'Sint-Petersburg ligt aan de Oostzee en was ruim tweehonderd jaar de hoofdstad van Rusland.' },
    { n:1, tv:9, v:'Warschau, de hoofdstad van Polen, dat Duitsland in 1939 binnenviel', goed:['oost'], uit:'Polen ligt in Oost-Europa; met de Duitse inval op 1 september 1939 begon de Tweede Wereldoorlog.' },
    { n:2, tv:5, v:'het gebied waar Luther in 1517 de reformatie begon', goed:['duits'], uit:'Wittenberg ligt in het huidige Duitsland. Het Duitse Rijk bestond toen uit honderden kleine staten.' },
    { n:2, tv:5, v:'het land van waaruit Columbus in 1492 vertrok', goed:['iberie'], uit:'Columbus voer uit Spanje, betaald door de Spaanse koning en koningin.' },
    { n:2, tv:3, v:'het land van de Vikingen, rond 900', goed:['scandinavie'], uit:'De Vikingen kwamen uit Noorwegen, Zweden en Denemarken.' },
    { n:2, tv:4, v:'Constantinopel, de hoofdstad van het Byzantijnse Rijk', goed:['kleinazie'], uit:'Constantinopel (nu Istanbul) ligt op de grens van Europa en Azië, in het huidige Turkije.' },
    { n:2, tv:9, v:'de stad Sarajevo, waar in 1914 de Oostenrijkse troonopvolger werd vermoord', goed:['balkan'], uit:'Sarajevo ligt in Bosnië, op de Balkan: de kruitvat van Europa.' },
    { n:2, tv:10, v:'de Sovjet-Unie na 1945', goed:['rusland', 'oost'], uit:'De Sovjet-Unie had Rusland als kern en beheerste na 1945 ook Oost-Europa.' },
    { n:2, tv:4, v:'de Hanzesteden Hamburg en Lübeck', goed:['duits'], uit:'De belangrijkste Hanzesteden lagen in Noord-Duitsland; Nederlandse steden als Kampen deden ook mee.' },
    { n:2, tv:5, v:'de Beeldenstorm van 1566', goed:['nederlanden'], uit:'De Beeldenstorm begon in Vlaanderen en trok door de hele Nederlanden.' },
    { n:3, tv:3, v:'de kern van het rijk van Karel de Grote, rond 800', goed:['frankrijk', 'duits', 'nederlanden'], uit:'Het Frankische Rijk lag in het huidige Frankrijk, de Nederlanden en West-Duitsland, met Aken als hoofdstad.' },
    { n:3, tv:7, v:'Waterloo, waar Napoleon in 1815 verloor', goed:['nederlanden'], uit:'Waterloo ligt in het huidige België, toen deel van het Verenigd Koninkrijk der Nederlanden.' },
    { n:3, tv:6, v:'het Ottomaanse Rijk in Europa, rond 1600', goed:['balkan', 'kleinazie'], uit:'De Ottomanen beheersten Klein-Azië en bijna de hele Balkan, tot voor de poorten van Wenen.' },
    { n:3, tv:8, v:'het land dat in 1871 werd verenigd tot een keizerrijk', goed:['duits'], uit:'Bismarck verenigde de Duitse staten in 1871 tot het Duitse Keizerrijk.' },
    { n:3, tv:9, v:'het land waar in 1917 de communistische revolutie plaatsvond', goed:['rusland'], uit:'De Russische Revolutie bracht Lenin aan de macht.' },
    { n:3, tv:10, v:'het IJzeren Gordijn: het gebied dat na 1945 onder Sovjet-invloed stond', goed:['oost'], uit:'Polen, Hongarije, Tsjechoslowakije, Roemenië, Bulgarije en de DDR hoorden bij het Oostblok.' }
  ];
  function aanwijzen(keuze){
    var n = NIV[keuze.niveau] || 2, lijst = WAAR.filter(function(w){ return w.n <= n; }), it = kies(lijst);
    return { onderdeel:'kaart door de tijd: aanwijzen', onderdeelNaam:'aanwijzen', vorm:'eigen', sleutel:'a' + it.v.slice(0, 24),
      vraag:'Tik op de kaart het gebied aan van <b>' + S(it.v) + '</b>.', opdracht:'De kaart laat de landen van nu zien, verdeeld in grote gebieden. Tijdvak ' + it.tv + '.',
      uitleg: it.uit, antwoordTekst: it.goed.map(function(g){ return gebiedVan(g).naam; }).join(' of '),
      teken:function(el, api){
        el.innerHTML = kaart({}) + '<p class="kaartuit" id="kaartuit">Tik een gebied aan; nog eens tikken kiest een ander.</p>';
        var svg = el.querySelector('svg'), gekozen = null;
        svg.addEventListener('click', function(e){
          var g = e.target.closest('.gebied'); if (!g || !api.bezig()) return;
          Array.prototype.forEach.call(svg.querySelectorAll('.gebied'), function(x){ x.classList.remove('gekozen'); });
          g.classList.add('gekozen'); gekozen = g.getAttribute('data-g');
          el.querySelector('#kaartuit').textContent = 'Gekozen: ' + gebiedVan(gekozen).naam + '. Klopt het? Druk op Nakijken.';
          knop.disabled = false;
        });
        var knop = api.knop('Nakijken', function(){
          if (!gekozen) return;
          var ok = it.goed.indexOf(gekozen) >= 0;
          Array.prototype.forEach.call(svg.querySelectorAll('.gebied'), function(x){ var id = x.getAttribute('data-g'); x.classList.remove('gekozen'); if (it.goed.indexOf(id) >= 0) x.classList.add('goed'); else if (id === gekozen) x.classList.add('fout'); });
          knop.disabled = true;
          api.klaar(ok, ok ? '' : 'Jij koos ' + gebiedVan(gekozen).naam + '; het is ' + it.goed.map(function(g){ return gebiedVan(g).naam; }).join(' of ') + ' (groen).');
        });
        knop.disabled = true;
        el.proef = function(){ svg.querySelector('.gebied[data-g="' + it.goed[0] + '"]').dispatchEvent(new MouseEvent('click', { bubbles:true })); knop.click(); };
        el.proefFout = function(){ var f = GEBIEDEN.filter(function(g){ return it.goed.indexOf(g.id) < 0; })[0]; svg.querySelector('.gebied[data-g="' + f.id + '"]').dispatchEvent(new MouseEvent('click', { bubbles:true })); knop.click(); };
      } };
  }

  /* ---------- 2. welk jaar: een kaartsituatie dateren ---------- */
  var SITUATIES = [
    { n:1, naam:'het Romeinse Rijk op zijn grootst', gebieden:['italie', 'iberie', 'frankrijk', 'balkan', 'kleinazie', 'brits'], goed:'rond 100 na Christus', mis:['rond 800', 'rond 1500', 'rond 1950'], uit:'Onder keizer Trajanus (rond 117) was het rijk op zijn grootst: rond de hele Middellandse Zee, tot in Engeland.' },

    { n:1, naam:'de Republiek der Zeven Verenigde Nederlanden', gebieden:['nederlanden'], goed:'rond 1650', mis:['rond 800', 'rond 1200', 'rond 1950'], uit:'De Republiek bestond van 1588 tot 1795; in 1648 werd ze bij de Vrede van Munster erkend.' },
    { n:1, naam:'het IJzeren Gordijn: Oostblok en Westblok', gebieden:['oost', 'rusland'], goed:'rond 1960', mis:['rond 1800', 'rond 1900', 'rond 2020'], uit:'Van 1945 tot 1989 was Europa verdeeld; de Berlijnse Muur (1961) was het symbool.' },
    { n:1, naam:'de Griekse stadstaten, zoals Athene en Sparta', gebieden:['balkan'], goed:'rond 450 voor Christus', mis:['rond 800', 'rond 1600', 'rond 1900'], uit:'In de vijfde eeuw voor Christus bloeiden Athene en Sparta.' },
    { n:1, naam:'het Romeinse Rijk, verdeeld in een westelijk en een oostelijk deel', gebieden:['italie', 'iberie', 'frankrijk', 'balkan', 'kleinazie'], goed:'rond 400', mis:['rond 1200', 'rond 1600', 'rond 1900'], uit:'In 395 werd het rijk definitief gesplitst; het westelijke deel viel in 476.' },
