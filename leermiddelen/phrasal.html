<style>
/* het pictogram bij een phrasal verb: een rond vlak in de kaartkleur, lijnen in de nadrukkleur */
.pict{width:92px;height:92px;border-radius:50%;background:var(--kaart2);color:var(--nadruk);display:grid;place-items:center}
.pict svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pict.klein{width:40px;height:40px}
.pict.klein svg{width:24px;height:24px}
.pictrij{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gat{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--nadruk);line-height:1;margin:0 2px}
body.groot .pict{width:120px;height:120px}
body.groot .pict svg{width:68px;height:68px}
</style>
<script src="/vangnet.js" defer></script>
</head>
<body>
<div id="vakspel"></div>
<script src="vakspel.js"></script>
<script src="phrasal-opgaven.js"></script>
<script>
(function(){
  'use strict';
  var H = VAKSPEL.husselen, S = VAKSPEL.schoon, D = window.PHRASAL_OPGAVEN;
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  var NIV = { bb:0, kgt:1, hv:2 };

  /* ---------- de pictogrammen: 24 bij 24, lijnen in currentColor ---------- */
  var ICONEN = {
    'zon': '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',
    'loep': '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/>',
    'schakelaar': '<rect x="3" y="7" width="18" height="10" rx="5"/><circle cx="15.5" cy="12" r="3"/>',
    'pijl-omhoog': '<path d="M12 20V5M5.5 11.5 12 5l6.5 6.5"/>',
    'pijl-omlaag': '<path d="M12 4v15M5.5 12.5 12 19l6.5-6.5"/>',
    'pijl-vooruit': '<path d="M4 12h15M13 6l6 6-6 6"/>',
    'pijl-terug': '<path d="M20 12H5M11 6l-6 6 6 6"/>',
    'hand': '<path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V11M10 10V4.5a1.5 1.5 0 0 1 3 0V11M13 10.5V6a1.5 1.5 0 0 1 3 0v6M16 12V9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-5-2.7L4 14.2a1.5 1.5 0 0 1 2.4-1.8L7 13.5"/>',
    'shirt': '<path d="M8 4 4 7l2.5 3.5L8.5 9.5V20h7V9.5l2 1L20 7l-4-3a4 4 0 0 1-8 0z"/>',
    'stoel': '<path d="M6 20v-4M18 20v-4M6 16h12v-4H6zM7 12V4h10v8"/>',
    'klok': '<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/>',
    'oog': '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
    'deur': '<rect x="5" y="3" width="14" height="18" rx="1.5"/><circle cx="15" cy="12" r="1" fill="currentColor"/><path d="M5 21h14"/>',
    'pen': '<path d="M4 20l1-4L16.4 4.6a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3M4 20l4-1"/>',
    'prullenbak': '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/>',
    'hart': '<path d="M12 20.5c-5-4-8-7.3-8-11a4.2 4.2 0 0 1 8-1.8 4.2 4.2 0 0 1 8 1.8c0 3.7-3 7-8 11z"/>',
    'bus': '<rect x="4" y="4" width="16" height="14" rx="2.5"/><path d="M4 11h16M8 18v2M16 18v2"/><circle cx="8" cy="14.5" r="1" fill="currentColor"/><circle cx="16" cy="14.5" r="1" fill="currentColor"/>',
    'plant': '<path d="M12 21v-9M12 12c0-4 3-6 7-6 0 4-3 6-7 6zM12 15c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/><path d="M7 21h10"/>',
    'telefoon': '<path d="M6.5 3h3l1.5 4-2 1.5a11 11 0 0 0 6.5 6.5L17 13l4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5a2 2 0 0 1 2-2z"/>',
    'rennen': '<circle cx="15" cy="4.5" r="1.8"/><path d="M9 20l3-6-3-2 2-5 4 1 2 3h3M12 14l3 2 1 4M11 8l-4 1-1.5 3.5"/>',
    'doos': '<path d="M3.5 8 12 4l8.5 4v9L12 21l-8.5-4z"/><path d="M3.5 8 12 12l8.5-4M12 12v9"/>',
    'auto': '<path d="M4 15v-3l2-5h12l2 5v3H4z"/><path d="M4 12h16M6 15v2.5M18 15v2.5"/><circle cx="8" cy="13.5" r="1" fill="currentColor"/><circle cx="16" cy="13.5" r="1" fill="currentColor"/>',
    'rekenmachine': '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8.5 12h1M12 12h1M15.5 12h1M8.5 16h1M12 16h1M15.5 16h1"/>',
    'lamp': '<path d="M9 18h6M10 21h4M8 13a5.5 5.5 0 1 1 8 0c-1 1-1 2-1 3H9c0-1 0-2-1-3z"/>',
    'kalender': '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/><path d="M9 14l2 2 4-4"/>'
  };
  function pict(naam, klein){ return '<div class="pict' + (klein ? ' klein' : '') + '" aria-hidden="true"><svg viewBox="0 0 24 24">' + (ICONEN[naam] || ICONEN.lamp) + '</svg></div>'; }

  /* ---------- geen herhaling binnen een ronde, ook als de motor het niet kan zien ---------- */
  var gebruikt = {};
  function vers(lijst, sleutelVan){
    var over = lijst.filter(function(x){ return !gebruikt[sleutelVan(x)]; });
    var x = kies(over.length ? over : lijst);
    gebruikt[sleutelVan(x)] = 1;
    return x;
  }

  /* de werkwoorden die op een niveau meedoen; op hv wegen de hv-werkwoorden zwaarder */
  function pool(niveau){ return D.verbs.filter(function(v){ return NIV[v.n] <= NIV[niveau]; }); }
  function pakVerb(niveau, deel){
    var p = pool(niveau);
    if (niveau === 'hv' && Math.random() < 0.6) p = p.filter(function(v){ return v.n === 'hv'; });
    return vers(p, function(v){ return deel + v.v; });
  }
  function scheidbaar(v){ return v.v.split(' ').length > 2 ? 'Niet scheidbaar (drie woorden).' : v.sep ? 'Scheidbaar: <i>' + S(v.v.split(' ')[0]) + ' it ' + S(v.v.split(' ').slice(1).join(' ')) + '</i> mag ook.' : 'Niet scheidbaar: het lijdend voorwerp komt erna.'; }
  function uitlegVan(v, niveau){ return v.uit + (niveau === 'hv' ? ' ' + scheidbaar(v) : ''); }

  /* 1. betekenis: de zin met het phrasal verb vet, vier Nederlandse betekenissen */
  function betekenis(niveau){
    var v = pakVerb(niveau, 'bet'), zin = kies(v.z);
    var anders = H(pool(niveau).filter(function(x){ return x.nl !== v.nl && x.v !== v.v; })).slice(0, 3).map(function(x){ return x.nl; });
    var opties = anders.concat([v.nl]);
    return {
      onderdeel:'phrasal: betekenis', onderdeelNaam:'betekenis', vorm:'meerkeuze', sleutel:'bet' + v.v,
      vraag: zin, opdracht: 'Wat betekent het vetgedrukte phrasal verb?',
      beeld: pict(v.ico),
      opties: opties, goed: opties.indexOf(v.nl),
      uitleg: uitlegVan(v, niveau), antwoordTekst: v.nl
    };
  }
  /* 2. gat: het partikel weg (twee woorden) of het hele werkwoord weg (drie woorden) */
  function gat(niveau){
    var v = pakVerb(niveau, 'gat'), zin = kies(v.z), delen = v.v.split(' '), heel = delen.length > 2;
    var m = /<b>([^<]+)<\/b>(?:(.*?)<b>([^<]+)<\/b>)?/.exec(zin), goedWoord, zinGat;
    if (m && m[3]){ /* gescheiden: call you back */
      goedWoord = m[3]; zinGat = zin.replace(m[0], '<b>' + m[1] + '</b>' + m[2] + '<span class="gat"></span>');
    } else if (heel){
      goedWoord = m[1]; zinGat = zin.replace(m[0], '<span class="gat"></span>');
    } else {
      var w = m[1].split(' '); goedWoord = w[w.length - 1];
      zinGat = zin.replace(m[0], '<b>' + w.slice(0, -1).join(' ') + '</b> <span class="gat"></span>');
    }
    var opties = H(v.fp.concat([goedWoord]));
    return {
      onderdeel:'phrasal: gat', onderdeelNaam:'gat', vorm:'meerkeuze', sleutel:'gat' + v.v,
      vraag: zinGat, opdracht: heel ? 'Welk phrasal verb hoort in het gat?' : 'Welk woord hoort in het gat?',
      beeld: pict(v.ico),
      opties: opties, goed: opties.indexOf(goedWoord),
      uitleg: '<b>' + S(v.v) + '</b> = ' + S(v.nl) + '. ' + uitlegVan(v, niveau), antwoordTekst: v.v
    };
  }
  /* 3. koppelen: vier werkwoorden naar vier betekenissen slepen */
  function koppelen(niveau){
    var p = H(pool(niveau)), set = [], nlGezien = {};
    if (niveau === 'hv') p = p.filter(function(v){ return v.n === 'hv'; }).concat(p.filter(function(v){ return v.n !== 'hv'; }));
    /* liever werkwoorden die deze ronde nog niet gekoppeld zijn */
    var eerst = p.filter(function(v){ return !gebruikt['kop' + v.v]; }), rest = p.filter(function(v){ return gebruikt['kop' + v.v]; });
    eerst.concat(rest).forEach(function(v){ if (set.length < 4 && !nlGezien[v.nl]){ nlGezien[v.nl] = 1; set.push(v); } });
    set.forEach(function(v){ gebruikt['kop' + v.v] = 1; });
    return {
      onderdeel:'phrasal: koppelen', onderdeelNaam:'koppelen', vorm:'sleep', sleutel:'kop' + set.map(function(v){ return v.v; }).sort().join(','),
      vraag: 'Sleep elk phrasal verb naar zijn <b>betekenis</b>.',
      sleepuit: 'Elk vak krijgt een werkwoord. Op een telefoon: tik het kaartje aan en dan het vak.',
      beeld: '<div class="pictrij">' + set.map(function(v){ return pict(v.ico, true); }).join('') + '</div>',
      kaarten: set.map(function(v){ return { id:v.v, tekst:S(v.v) }; }),
      vakken: H(set).map(function(v){ return { id:'nl-' + v.v, naam:v.nl, max:1, hoort:[v.v] }; }),
      uitleg: set.map(function(v){ return '<b>' + S(v.v) + '</b> = ' + S(v.nl); }).join(', ') + '.',
      antwoordTekst: set.map(function(v){ return v.v + ' = ' + v.nl; }).join('; ')
    };
  }
  /* 4. collocations: make of do, take of have, say of tell */
  function collocations(niveau){
    var c = vers(D.collocations.filter(function(x){ return NIV[x.n] <= NIV[niveau]; }), function(x){ return 'col' + x.zin; });
    var opties = [c.a, c.b];
    return {
      onderdeel:'phrasal: collocations', onderdeelNaam:'vaste combinaties', vorm:'meerkeuze', sleutel:'col' + c.zin,
      vraag: S(c.zin).replace('___', '<span class="gat"></span>'), opdracht: c.a + ' or ' + c.b + '?',
      opties: opties, goed: opties.indexOf(c.goed),
      uitleg: 'De vaste combinatie is <b>' + S(c.combi) + '</b>. ' + c.uit, antwoordTekst: c.goed
    };
  }

  var SOORTEN = { betekenis: betekenis, gat: gat, koppelen: koppelen, collocations: collocations };
  VAKSPEL.maak({
    id:'phrasal', naam:'Phrasal verbs en collocations', vak:'eng', kleur:'#204ECF',
    hand:'give up is niet geven en niet omhoog',
    lead:'Een werkwoord met een klein woordje erachter betekent ineens iets anders: give up is opgeven, look after is zorgen voor. Je kiest de betekenis, vult het partikel in, koppelt werkwoorden aan hun betekenis en leert de vaste combinaties: make or do, take or have, say or tell.',
    hoe:[
      { kop:'Phrasal verbs', tekst:'Een werkwoord plus een partikel (<b>up</b>, <b>off</b>, <b>for</b>) met een eigen betekenis. Bij elke opgave staat een pictogram als geheugensteun.' },
      { kop:'Collocations', tekst:'Woorden die altijd samen gaan: <b>do</b> your homework, <b>make</b> a mistake, <b>have</b> breakfast, <b>tell</b> the truth. Twee keuzes, en de vaste combinatie erbij.' },
      { kop:'Vier soorten opgaven', tekst:'Betekenis kiezen, het gat vullen, vier werkwoorden koppelen en collocations. Tien per ronde, meteen nagekeken, met de regel erbij.' }
    ],
    keuzes:[
      { id:'niveau', kop:'hoe moeilijk', std:'kgt', items:[
        { id:'bb', naam:'vmbo-bb (A1-A2)', uit:'De twintig meest voorkomende phrasal verbs: get up, look for, turn on, give up.' },
        { id:'kgt', naam:'vmbo-kgt en tl (A2)', uit:'Veertig phrasal verbs, ook look after, grow up, fill in en set off.' },
        { id:'hv', naam:'havo en vwo (B1)', uit:'Ook put up with, look forward to, run out of en come up with, met scheidbaar of niet scheidbaar erbij.' } ] },
      { id:'soort', kop:'wat oefen je', std:'alles', items:[
        { id:'alles', naam:'alles door elkaar' }, { id:'betekenis', naam:'betekenis' }, { id:'gat', naam:'gat invullen', uit:'Een zin met een gat: welk phrasal verb past erin?' }, { id:'koppelen', naam:'koppelen', uit:'Sleep vier phrasal verbs naar hun betekenis.' }, { id:'collocations', naam:'vaste combinaties', uit:'Woorden die altijd samen gaan (collocations): make a mistake, do your homework.' } ] }
    ],
    aantal:10,
    maak:function(keuze, nr){
      if (nr === 1) gebruikt = {};
      var soort = keuze.soort === 'alles' ? kies(['betekenis', 'gat', 'koppelen', 'collocations']) : keuze.soort;
      return SOORTEN[soort](keuze.niveau);
    },
    uitleg:{ doel:'Phrasal verbs herkennen en gebruiken, en de vaste combinaties make/do, take/have en say/tell.', tijd:'tien opgaven per ronde', bediening:'Tik een antwoord aan, of gebruik de toetsen 1 tot 4. Bij koppelen sleep je de kaartjes; op een telefoon tik je een kaartje en dan het vak.' }
  });
})();
</script>
