<style>
/* het dilemma: titel, situatie en stelling in een vak met een streep in de spelkleur */
.stel,.cit{box-sizing:border-box}
.stel{width:100%;max-width:62ch;text-align:left;background:var(--kaart2);border-left:4px solid var(--spelkleur);border-radius:0 14px 14px 0;padding:12px 16px}
.stel .kop{display:block;font-size:.76rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stel .sit{margin:4px 0 8px;font-size:.9rem;line-height:1.45;color:var(--muted)}
.stel .st{margin:0;font-size:1.05rem;line-height:1.45;font-weight:600}
.stel .st b{color:var(--nadruk)}
/* een argument, een zin of een uitspraak onder het dilemma */
.cit{width:100%;max-width:62ch;margin-top:10px;text-align:left;background:var(--kaart);border:2px solid var(--rand2);border-radius:14px;padding:12px 16px;font-size:1.05rem;line-height:1.5}
.cit .wie{display:block;font-size:.76rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
/* twee argumenten naast elkaar (sterk, botsende waarden) */
.paar{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:780px;margin-top:10px}
.paar .cit{margin-top:0;max-width:none}
.paar .l{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;background:var(--spelkleur);color:var(--spelinkt,#fff);font-size:.8rem;font-weight:700;margin-right:6px;letter-spacing:0;text-transform:none}
.kaartjes .sleepkaart{font-weight:500;text-align:left}
body.groot .stel .st,body.groot .cit{font-size:1.25rem}
@media(max-width:560px){.paar{grid-template-columns:1fr}.stel{padding:10px 12px}.cit{padding:10px 12px;font-size:1rem}}
/* Op een werkblad (werkblad.html zet deze stijl in zijn .blad) bestaat de spelkleur niet en drukt
   een vlak niet altijd af: de letters A en B en de streep bij het dilemma in inkt. */
.blad .paar .l{background:#fff;color:#14224C;border:1.5px solid #14224C}
.blad .stel{border-left:3px solid #14224C}
/* de A of B vet in een keuze is geen keuzeletter: geen vaste breedte zoals de letter ervoor */
.blad .opties span b ~ b{display:inline;width:auto}
</style>

    var d = dil(), kant = kies(['v', 't']), zijde = kant === 'v' ? 'voor' : 'tegen', sterk = niv === 'hv' && Math.random() < 0.25, a, soort;
    if (sterk){ a = kies(d[kant].filter(function(x){ return pasN(x.n, niv); })); soort = 'goed'; }
    else { a = kies(d['z' + kant].filter(function(x){ return pasN(x.n, niv); })); soort = a.s; }
    var NIETS = 'Er is niets mis mee: het geeft een echte reden';
    var UIT = { bewering:['overdrijving'], overdrijving:['bewering', 'iedereen'], iedereen:['overdrijving'], glijdend:['overdrijving'], aanval:['overdrijving', 'bewering'], tweekeuze:['overdrijving'], goed:['overdrijving'] };
    var kandidaten = Object.keys(SOORT).filter(function(t){ return t !== soort && (UIT[soort] || []).indexOf(t) < 0; });
    var goed = soort === 'goed' ? NIETS : SOORT[soort].opt;
    var fout = H(kandidaten).slice(0, niv === 'hv' && soort !== 'goed' ? 2 : 3).map(function(t){ return SOORT[t].opt; });
    if (niv === 'hv' && soort !== 'goed') fout.push(NIETS);
    var lijst = H([goed].concat(fout));
    return { onderdeel:'afwegen: sterk', onderdeelNaam:'wat is sterker', vorm:'meerkeuze', vasteVolgorde:true, sleutel:'sm' + a.id,

      opties:lijst, goed:lijst.indexOf(goed),

      antwoordTekst:goed };
  }
  function sterk(niv){
    if (niv === 'bb') return sterkPaar(niv);
    return Math.random() < (niv === 'kgt' ? 0.6 : 0.5) ? sterkPaar(niv) : sterkMis(niv);
  }
